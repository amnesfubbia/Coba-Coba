<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>amnesfubbia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@1,700&family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { background-color: #000; color: #fff; font-family: 'Inter', sans-serif; margin: 0; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        /* Header Fix */
        .fixed-header-section { position: fixed; top: 0; width: 100%; z-index: 100; background: #000; border-bottom: 1px solid #1c1c1c; }
        .ig-header { padding: 12px 15px 5px 15px; }
        .ig-logo { font-family: 'DM Sans', sans-serif; font-weight: 700; font-style: italic; font-size: 24px; letter-spacing: -0.8px; text-transform: lowercase; }
        .verified-icon { font-size: 13px; color: #0095f6; margin-left: 5px; }

        /* Row Menu */
        .menu-scroll-row { display: flex; gap: 8px; overflow-x: auto; padding: 6px 15px; scrollbar-width: none; align-items: center; }
        .menu-pill { 
            background: transparent; border: 1px solid #1c1c1c; color: #fff; 
            padding: 8px 16px; border-radius: 8px; font-size: 10px; font-weight: 800; 
            text-transform: uppercase; white-space: nowrap; transition: 0.2s; 
        }
        .menu-pill.active { border-color: #fff; background: #fff; color: #000; }
        
        /* Filter Lanjutan Animation */
        #advancedFilter { 
            max-height: 0; 
            overflow: hidden; 
            transition: max-height 0.3s ease-out; 
            background: #050505;
        }
        #advancedFilter.open { max-height: 200px; border-top: 1px solid #1c1c1c; padding-bottom: 10px; }

        /* Filter Toggle Button */
        .filter-toggle {
            background: #121212; border: 1px solid #1c1c1c; color: #fff;
            padding: 8px 12px; border-radius: 8px; font-size: 10px; font-weight: 800;
            display: flex; align-items: center; gap: 5px; margin-left: auto;
        }

        /* Grid */
        .movie-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; padding-top: 200px; padding-bottom: 100px; transition: padding 0.3s; }
        .movie-grid.expanded { padding-top: 340px; } /* Menyesuaikan jarak saat filter terbuka */
        
        .post-card { position: relative; aspect-ratio: 2/3; background: #0a0a0a; overflow: hidden; }
        .post-card img { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body>

    <div class="fixed-header-section">
        <header class="ig-header">
            <div class="flex justify-between items-center">
                <div class="flex items-center">
                    <h1 class="ig-logo">amnesfubbia</h1>
                    <i class="fa-solid fa-circle-check verified-icon"></i>
                </div>
                <div class="flex gap-5 text-xl">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <i class="fa-regular fa-heart"></i>
                </div>
            </div>
        </header>

        <div class="menu-scroll-row no-scrollbar">
            <button class="menu-pill active">Semua</button>
            <button class="menu-pill">Film</button>
            <button class="menu-pill">Series</button>
            <button class="menu-pill">Short</button>
            <button class="filter-toggle" onclick="toggleFilter()">
                <i class="fa-solid fa-sliders"></i> Filter
            </button>
        </div>

        <div class="menu-scroll-row no-scrollbar">
            <button class="menu-pill">Aksi</button>
            <button class="menu-pill">Horor</button>
            <button class="menu-pill">Komedi</button>
            <button class="menu-pill">Romantis</button>
            <button class="menu-pill">Anime</button>
        </div>

        <div id="advancedFilter">
            <div class="menu-scroll-row no-scrollbar mt-2">
                <button class="menu-pill"><i class="fa-solid fa-calendar"></i> Tahun</button>
                <button class="menu-pill">USA</button>
                <button class="menu-pill">Korea</button>
                <button class="menu-pill">Jepang</button>
                <button class="menu-pill">Indonesia</button>
            </div>
            <div class="menu-scroll-row no-scrollbar">
                <button class="menu-pill">Terupdate</button>
                <button class="menu-pill">Populer</button>
                <button class="menu-pill">Rating</button>
            </div>
            <div class="menu-scroll-row no-scrollbar">
                <button class="menu-pill border-yellow-600 text-yellow-500">
                    <i class="fa-solid fa-ticket"></i> Jadwal Bioskop Indonesia
                </button>
            </div>
        </div>
    </div>

    <main id="feedGrid" class="movie-grid">
        <div class="post-card"><img src="https://via.placeholder.com/300x450/111/fff?text=Poster+1"></div>
        <div class="post-card"><img src="https://via.placeholder.com/300x450/111/fff?text=Poster+2"></div>
        <div class="post-card"><img src="https://via.placeholder.com/300x450/111/fff?text=Poster+3"></div>
        <div class="post-card"><img src="https://via.placeholder.com/300x450/111/fff?text=Poster+4"></div>
        <div class="post-card"><img src="https://via.placeholder.com/300x450/111/fff?text=Poster+5"></div>
        <div class="post-card"><img src="https://via.placeholder.com/300x450/111/fff?text=Poster+6"></div>
    </main>

    <script>
        function toggleFilter() {
            const filterDiv = document.getElementById('advancedFilter');
            const grid = document.getElementById('feedGrid');
            
            filterDiv.classList.toggle('open');
            grid.classList.toggle('expanded');
            
            // Mengubah ikon tombol filter
            const icon = document.querySelector('.filter-toggle i');
            if (filterDiv.classList.contains('open')) {
                icon.className = 'fa-solid fa-xmark';
            } else {
                icon.className = 'fa-solid fa-sliders';
            }
        }
    </script>
</body>
</html>
