<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Weather — Silmikaffah (Demo)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#0b0f12;--card:#0f1720;--muted:#97a0a9;--accent:#3FAE6A;--text:#e9eef6}
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,system-ui,Segoe UI,Roboto,Arial,sans-serif;background:linear-gradient(180deg,#020407 0%, #071014 100%);color:var(--text);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
    .wrap{width:100%;max-width:720px}
    header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
    h1{font-size:1.15rem;margin:0}
    p.lead{margin:2px 0 0;color:var(--muted);font-size:.92rem}
    .card{background:var(--card);border-radius:12px;padding:18px;box-shadow:0 6px 30px rgba(2,8,14,.6)}
    .controls{display:flex;gap:8px;margin-bottom:12px}
    .controls input[type="text"]{flex:1;padding:10px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.04);background:transparent;color:var(--text)}
    .controls button{padding:10px 12px;border-radius:8px;border:none;background:var(--accent);color:#03100a;font-weight:700;cursor:pointer}
    .grid{display:grid;grid-template-columns:1fr 220px;gap:12px;align-items:start}
    .weather-main{display:flex;flex-direction:column;gap:8px}
    .big-temp{font-size:3.2rem;font-weight:700;line-height:1}
    .meta{color:var(--muted);font-size:.95rem}
    .mini{background:rgba(255,255,255,.02);padding:10px;border-radius:10px}
    footer{margin-top:12px;color:var(--muted);font-size:.85rem;text-align:right}
    @media (max-width:640px){.grid{grid-template-columns:1fr}
      .mini{display:flex;justify-content:space-between}}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>Silmikaffah — Weather Demo</h1>
        <p class="lead">Gunakan geolokasi atau cari kota. Data: Open-Meteo (gratis, tanpa kunci API).</p>
      </div>
      <div style="text-align:right;color:var(--muted);font-size:.9rem">Demo
      </div>
    </header>

    <div class="card">
      <div class="controls">
        <input id="q" type="text" placeholder="Cari kota, misal: Jakarta" aria-label="cari kota">
        <button id="btnSearch">Cari</button>
        <button id="btnLoc" title="Gunakan lokasi perangkat">📍</button>
      </div>

      <div class="grid">
        <div>
          <div id="result" class="weather-main">
            <div id="place" class="meta">Belum ada lokasi</div>
            <div id="tempRow">
              <div class="big-temp" id="temp">—°C</div>
              <div class="meta" id="summary">—</div>
            </div>
            <div class="mini" style="display:flex;gap:10px;margin-top:8px;align-items:center;">
              <div>
                <div class="meta">Angin</div>
                <div id="wind" style="font-weight:600">— m/s</div>
              </div>
              <div>
                <div class="meta">Arah</div>
                <div id="windDir" style="font-weight:600">—</div>
              </div>
              <div>
                <div class="meta">Ketinggian</div>
                <div id="elev" style="font-weight:600">— m</div>
              </div>
            </div>

            <div id="updated" class="meta" style="margin-top:8px">—</div>
          </div>
        </div>

        <aside>
          <div class="mini">
            <div style="font-weight:700;margin-bottom:8px">Detail Cuaca</div>
            <div class="meta">Suhu terasa: <span id="feels">—°C</span></div>
            <div class="meta">Tekanan: <span id="pressure">— hPa</span></div>
            <div class="meta">Kelembapan: <span id="rh">— %</span></div>
            <div style="height:8px"></div>
            <button id="btnRefresh" style="width:100%;padding:8px;border-radius:8px;border:none;background:rgba(255,255,255,.03);color:var(--text);cursor:pointer">Segarkan</button>
          </div>
        </aside>
      </div>

      <footer>
        Catatan: Untuk fitur lokasi, gunakan HTTPS atau localhost.
      </footer>
    </div>
  </div>

  <script>
    // helpers
    const el = id => document.getElementById(id);
    const wmap = {
      0: 'Cerah',1:'Cerah',2:'Cerah Berawan',3:'Berawan',45:'Kabut',48:'Kabut Berdebu',51:'Hujan Gerimis Ringan',53:'Hujan Gerimis Sedang',55:'Hujan Gerimis Lebat',61:'Hujan Ringan',63:'Hujan Sedang',65:'Hujan Lebat',71:'Salju Ringan',73:'Salju Sedang',75:'Salju Lebat',80:'Hujan Lokal',95:'Badai Petir'
    };

    let lastCoords = null;

    async function fetchWeather(lat,lon){
      // Open-Meteo: current_weather + additional parameters
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&hourly=relativehumidity_2m,pressure_msl,apparent_temperature&timezone=auto`;
      el('place').textContent = `Memuat cuaca (${lat.toFixed(3)}, ${lon.toFixed(3)})...`;
      try{
        const r = await fetch(url);
        if(!r.ok) throw new Error('Gagal memuat dari Open-Meteo');
        const j = await r.json();
        // current_weather contains temperature, windspeed, winddirection, weathercode, time
        const cw = j.current_weather;
        if(!cw) throw new Error('Data cuaca tidak lengkap');
        el('temp').textContent = `${cw.temperature.toFixed(1)}°C`;
        el('summary').textContent = wmap[cw.weathercode] || ('Kode ' + cw.weathercode);
        el('wind').textContent = `${cw.windspeed} m/s`;
        el('windDir').textContent = `${cw.winddirection}°`;
        el('updated').textContent = `Waktu data: ${cw.time}`;
        // try to pick hourly index nearest to current time for humidity/pressure/feels
        const nowISO = cw.time;
        let rh='—', pres='—', feels='—', elev='—';
        if(j.hourly && j.hourly.time){
          const idx = j.hourly.time.indexOf(nowISO);
          if(idx>=0){
            rh = j.hourly.relativehumidity_2m[idx];
            pres = j.hourly.pressure_msl ? (j.hourly.pressure_msl[idx]) : '—';
            feels = j.hourly.apparent_temperature ? (j.hourly.apparent_temperature[idx]) : '—';
          }
        }
        el('rh').textContent = (rh==='—')? '—' : rh + '%';
        el('pressure').textContent = (pres==='—')? '—' : pres + ' hPa';
        el('feels').textContent = (feels==='—')? '—°C' : `${feels.toFixed(1)}°C`;
        // elevation if provided
        if(j.elevation!==undefined) el('elev').textContent = `${j.elevation} m`;
        lastCoords = {lat,lon};
      }catch(err){
        el('place').textContent = 'Gagal memuat cuaca';
        el('summary').textContent = err.message;
        console.error(err);
      }
    }

    async function geocode(query){
      const u = 'https://nominatim.openstreetmap.org/search?format=json&limit=5&q=' + encodeURIComponent(query);
      el('place').textContent = 'Mencari lokasi...';
      try{
        const r = await fetch(u,{headers:{'Accept':'application/json','User-Agent':'silmikaffah-demo/1.0'}});
        if(!r.ok) throw new Error('Gagal geocode');
        const data = await r.json();
        if(!data || data.length===0) { el('place').textContent = 'Lokasi tidak ditemukan'; return null; }
        const first = data[0];
        const display = first.display_name || (first.lon + ',' + first.lat);
        el('place').textContent = display;
        await fetchWeather(parseFloat(first.lat), parseFloat(first.lon));
        return first;
      }catch(err){
        el('place').textContent = 'Geocode error';
        console.error(err);
        return null;
      }
    }

    document.getElementById('btnSearch').addEventListener('click', ()=>{
      const q = el('q').value.trim();
      if(!q) return alert('Masukkan nama kota atau alamat.');
      geocode(q);
    });

    document.getElementById('btnLoc').addEventListener('click', ()=>{
      if(!navigator.geolocation){ alert('Geolocation tidak didukung'); return; }
      el('place').textContent = 'Mencari lokasi perangkat...';
      navigator.geolocation.getCurrentPosition(async pos =>{
        const lat = pos.coords.latitude; const lon = pos.coords.longitude;
        // reverse geocode for display
        try{
          const u = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}`;
          const r = await fetch(u,{headers:{'User-Agent':'silmikaffah-demo/1.0'}});
          if(r.ok){ const j = await r.json(); el('place').textContent = j.display_name || `${lat.toFixed(3)}, ${lon.toFixed(3)}`; }
        }catch(e){ el('place').textContent = `${lat.toFixed(3)}, ${lon.toFixed(3)}` }
        fetchWeather(lat,lon);
      }, err=>{
        el('place').textContent = 'Gagal mengambil lokasi: ' + (err.message || err.code);
      }, {enableHighAccuracy:true,timeout:10000});
    });

    document.getElementById('btnRefresh').addEventListener('click', ()=>{
      if(lastCoords) fetchWeather(lastCoords.lat,lastCoords.lon);
      else alert('Belum ada lokasi yang dimuat.');
    });

    // quick demo: load Jakarta by default
    window.addEventListener('load', ()=>{
      geocode('Jakarta');
    });
  </script>
</body>
</html>
