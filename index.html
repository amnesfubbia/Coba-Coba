<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AMNESFUBBIA FILM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        
        body { background-color: #050505; color: #e5e5e5; font-family: 'Plus Jakarta Sans', sans-serif; scroll-behavior: smooth; margin: 0; }
        
        /* Navbar Responsive */
        .nav-glass { background: rgba(5, 5, 5, 0.98); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.05); position: fixed; top: 0; width: 100%; z-index: 1000; }
        
        /* Grid 3 Kolom di Mobile */
        .movie-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 10px; }
        @media (min-width: 768px) { .movie-grid { grid-template-columns: repeat(6, 1fr); gap: 20px; } }

        .movie-card { transition: 0.3s; background: #0f0f0f; border-radius: 8px; overflow: hidden; border: 1px solid rgba(255,255,255,0.05); cursor: pointer; }
        .movie-card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; display: block; }
        .movie-card p { font-size: 9px; font-weight: 800; padding: 6px; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Modal Responsive */
        .modal { display: none; position: fixed; inset: 0; z-index: 2000; background: rgba(0,0,0,0.98); overflow-y: auto; }
        .modal-content { background: #0a0a0a; width: 100%; max-width: 1000px; min-height: 100vh; margin: 0 auto; border: none; overflow: hidden; position: relative; }
        @media (min-width: 768px) { .modal-content { min-height: auto; margin: 20px auto; border-radius: 20px; border: 1px solid #222; } }
        
        /* Slider Pemeran Bulat Sempurna */
        .cast-slider { display: flex; overflow-x: auto; gap: 15px; padding: 10px 5px; scrollbar-width: none; }
        .cast-slider::-webkit-scrollbar { display: none; }
        .cast-item { flex: 0 0 auto; width: 70px; text-align: center; }
        .cast-item .img-container { width: 60px; height: 60px; margin: 0 auto 8px; }
        .cast-item img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 2px solid #ef4444; }
        .cast-item p { font-size: 8px; font-weight: 600; line-height: 1.2; color: #999; }

        #backToTop { display: none; position: fixed; bottom: 25px; right: 20px; z-index: 99; background: #ef4444; color: white; width: 45px; height: 45px; border-radius: 50%; border: none; align-items: center; justify-content: center; box-shadow: 0 5px 15px rgba(239, 68, 68, 0.4); }
        
        .btn-server { @apply bg-zinc-900 border border-white/5 py-3 rounded-xl text-[10px] font-bold uppercase transition-all hover:bg-red-600 flex items-center justify-center gap-2 mb-2; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
    </style>
</head>
<body onload="initApp()">

    <button id="backToTop" onclick="scrollToTop()"><i class="fa-solid fa-arrow-up"></i></button>

    <nav class="nav-glass p-3">
        <div class="container mx-auto space-y-3">
            <div class="flex items-center gap-2">
                <div class="shrink-0 cursor-pointer" onclick="location.reload()">
                    <span class="text-lg font-black italic uppercase tracking-tighter">AMNESFUBBIA<span class="text-red-600">FILM</span></span>
                </div>
                <div class="relative flex-grow">
                    <input type="text" id="searchInput" onkeypress="if(event.key==='Enter') searchMulti()" placeholder="Cari film/aktor..." class="w-full bg-white/5 border border-white/10 p-2.5 rounded-xl text-xs outline-none focus:border-red-600">
                </div>
            </div>
            
            <div class="flex gap-2 overflow-x-auto scrollbar-hide">
                <select id="typeFilter" onchange="resetAndLoad()" class="bg-zinc-900 text-red-600 font-bold text-[10px] p-2 rounded-lg outline-none uppercase">
                    <option value="movie">FILM</option>
                    <option value="tv">SERIES</option>
                </select>
                <select id="genreFilter" onchange="resetAndLoad()" class="bg-zinc-900 text-white text-[10px] font-bold p-2 rounded-lg outline-none uppercase">
                    <option value="">GENRE</option>
                    <option value="28">Aksi</option><option value="12">Petualangan</option><option value="16">Animasi</option>
                    <option value="35">Komedi</option><option value="80">Kriminal</option><option value="27">Horor</option>
                    <option value="18">Drama</option><option value="14">Fantasi</option><option value="10749">Romantis</option>
                </select>
                <select id="yearFilter" onchange="resetAndLoad()" class="bg-zinc-900 text-white text-[10px] font-bold p-2 rounded-lg outline-none uppercase">
                    <option value="">TAHUN</option>
                    <script>
                        const yr = new Date().getFullYear();
                        for(let y=yr; y>=1920; y--) document.write(`<option value="${y}">${y}</option>`);
                    </script>
                </select>
            </div>
        </div>
    </nav>

    <main class="container mx-auto pt-32 pb-20">
        <div id="movieGrid" class="movie-grid"></div>
        <div id="loadMoreContainer" class="flex justify-center mt-8">
            <button onclick="loadMore()" class="bg-red-600 text-white font-black text-xs uppercase px-10 py-4 rounded-full">Lebih Banyak</button>
        </div>
    </main>

    <div id="movieModal" class="modal">
        <div class="modal-content">
            <button onclick="closeModal()" class="fixed top-4 right-4 bg-black/80 text-white w-10 h-10 rounded-full z-[3000] border border-white/20">✕</button>
            
            <div class="flex flex-col lg:flex-row">
                <div class="lg:w-2/3 p-4 lg:p-8 border-r border-white/5">
                    <h2 id="mTitle" class="text-xl lg:text-3xl font-black italic uppercase mb-4 text-white pr-10"></h2>
                    
                    <div class="aspect-video bg-black rounded-xl overflow-hidden mb-6 shadow-2xl">
                        <iframe id="mainPlayer" class="w-full h-full" allowfullscreen allow="autoplay"></iframe>
                    </div>

                    <p class="text-[9px] font-black text-red-500 uppercase mb-2">Sinopsis</p>
                    <p id="mDesc" class="text-xs lg:text-sm text-zinc-400 leading-relaxed italic mb-8"></p>
                    
                    <p class="text-[9px] font-black text-red-500 uppercase mb-3">Pemeran (Geser Kiri/Kanan)</p>
                    <div id="mCast" class="cast-slider"></div>
                </div>

                <div class="lg:w-1/3 p-4 lg:p-8 bg-zinc-900/40">
                    <p class="text-[10px] font-black text-zinc-500 uppercase mb-4">Pilih Server</p>
                    <div id="streamLinks" class="flex flex-col mb-8"></div>
                    
                    <p class="text-[10px] font-black text-zinc-500 uppercase mb-4">Download</p>
                    <div id="downloadLinks" class="flex flex-col"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = 'bfa7df5310c9974f62f26c6789a8c00d';
        const IMG_BASE = 'https://image.tmdb.org/t/p/w500';
        let currentPage = 1;

        window.onscroll = () => {
            const btn = document.getElementById("backToTop");
            btn.style.display = (window.scrollY > 400) ? "flex" : "none";
        };

        function scrollToTop() { window.scrollTo({top: 0, behavior: 'smooth'}); }

        async function initApp() { loadMovies(); }

        async function loadMovies(append = false) {
            const type = document.getElementById('typeFilter').value;
            const genre = document.getElementById('genreFilter').value;
            const year = document.getElementById('yearFilter').value;
            
            let url = `https://api.themoviedb.org/3/discover/${type}?api_key=${API_KEY}&language=id-ID&page=${currentPage}&sort_by=popularity.desc`;
            if (genre) url += `&with_genres=${genre}`;
            if (year) url += `&primary_release_year=${year}&first_air_date_year=${year}`;

            const res = await fetch(url);
            const data = await res.json();
            const grid = document.getElementById('movieGrid');
            if (!append) grid.innerHTML = '';
            
            data.results.forEach(m => {
                const poster = m.poster_path ? IMG_BASE + m.poster_path : 'https://via.placeholder.com/500x750?text=No+Poster';
                const div = document.createElement('div');
                div.className = 'movie-card';
                div.onclick = () => showDetail(m.id, type);
                div.innerHTML = `<img src="${poster}"><p>${m.title || m.name}</p>`;
                grid.appendChild(div);
            });
        }

        async function showDetail(id, type) {
            const [resID, resEN] = await Promise.all([
                fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=${API_KEY}&append_to_response=videos,credits&language=id-ID`),
                fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=${API_KEY}&language=en-US`)
            ]);
            const m = await resID.json();
            const mEN = await resEN.json();

            document.getElementById('mTitle').innerText = m.title || m.name;
            document.getElementById('mDesc').innerText = m.overview || mEN.overview || "Sinopsis tidak tersedia.";

            const streams = [
                { n: 'Server VIP 1', u: `https://vidsrc.xyz/embed/${type}/${id}` },
                { n: 'Server VIP 2', u: `https://vidsrc.to/embed/${type}/${id}` },
                { n: 'Server VIP 3', u: `https://vidrock.net/embed/${type}/${id}` }
            ];
            
            const sCont = document.getElementById('streamLinks');
            sCont.innerHTML = '';
            streams.forEach(s => sCont.innerHTML += `<button onclick="changePlayer('${s.u}')" class="btn-server"><i class="fa-solid fa-play"></i> ${s.n}</button>`);
            document.getElementById('downloadLinks').innerHTML = `<a href="https://dl.vidsrc.vip/${type}/${id}" target="_blank" class="btn-server bg-emerald-700/20 text-emerald-400"><i class="fa-solid fa-download"></i> Simpan Ke HP</a>`;

            const castCont = document.getElementById('mCast');
            castCont.innerHTML = m.credits.cast.slice(0, 15).map(c => `
                <div class="cast-item" onclick="searchByActor('${c.name}')">
                    <div class="img-container">
                        <img src="${c.profile_path ? 'https://image.tmdb.org/t/p/w185'+c.profile_path : 'https://via.placeholder.com/100x100?text=?'}">
                    </div>
                    <p>${c.name}</p>
                </div>
            `).join('');

            // Trailer Optimization
            const yt = m.videos.results.find(v => v.site === 'YouTube' && v.type === 'Trailer') || m.videos.results[0];
            document.getElementById('mainPlayer').src = yt ? `https://www.youtube.com/embed/${yt.key}?autoplay=1&vq=hd720&rel=0` : '';

            document.getElementById('movieModal').style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        async function searchMulti() {
            const q = document.getElementById('searchInput').value; 
            if(!q) return;
            const res = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${API_KEY}&query=${encodeURIComponent(q)}&language=id-ID`);
            const data = await res.json();
            const grid = document.getElementById('movieGrid'); grid.innerHTML = '';
            data.results.forEach(m => {
                if(!m.poster_path) return;
                const div = document.createElement('div'); div.className = 'movie-card';
                div.onclick = () => showDetail(m.id, m.media_type || 'movie');
                div.innerHTML = `<img src="${IMG_BASE + m.poster_path}"><p>${m.title || m.name}</p>`;
                grid.appendChild(div);
            });
            document.getElementById('loadMoreContainer').style.display = 'none';
        }

        function searchByActor(name) { closeModal(); document.getElementById('searchInput').value = name; searchMulti(); }
        function changePlayer(url) { document.getElementById('mainPlayer').src = url + "?autoplay=1&vq=hd720"; }
        function loadMore() { currentPage++; loadMovies(true); }
        function resetAndLoad() { currentPage = 1; loadMovies(); }
        function closeModal() { document.getElementById('movieModal').style.display = 'none'; document.getElementById('mainPlayer').src = ''; document.body.style.overflow = 'auto'; }
    </script>
</body>
</html>
