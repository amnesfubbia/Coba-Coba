<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>amnesfubbia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { background-color: #000; color: #fff; font-family: 'Inter', sans-serif; margin: 0; overflow-x: hidden; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        /* Splash Screen */
        #splashScreen { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .splash-logo { width: 75px; height: 75px; animation: splashScale 0.8s ease-out; }

        /* Header */
        .ig-logo { font-weight: 700; font-size: 20px; letter-spacing: -0.5px; }
        
        /* Profile Section */
        .profile-info { display: flex; align-items: center; gap: 20px; padding: 0 5px; }
        .profile-pic-container { position: relative; width: 84px; height: 84px; flex-shrink: 0; }
        .profile-pic-logo { width: 84px; height: 84px; border-radius: 50%; border: 1px solid #262626; padding: 4px; background: #000; overflow: hidden; }
        .profile-pic-logo img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
        
        .profile-text-side { flex-grow: 1; }
        .bio-name-wrapper { display: flex; align-items: center; gap: 5px; margin-bottom: 2px; }
        .bio-name { font-weight: 700; font-size: 15px; }

        /* Stats */
        .stats { display: flex; justify-content: space-between; text-align: center; margin-top: 10px; }
        .stat-val { font-weight: 700; font-size: 15px; display: block; }
        .stat-label { font-size: 12px; color: #f5f5f5; }

        /* Highlights */
        .highlight-circle { width: 62px; height: 62px; border-radius: 50%; border: 1px solid #262626; display: flex; align-items: center; justify-content: center; background: #000; transition: border 0.3s; }
        .highlight-item.active .highlight-circle { border: 2px solid #fff; }
        .hl-logo { font-size: 10px; font-weight: 900; text-transform: uppercase; }

        /* Dropdowns */
        .filter-dropdown { display: none; position: fixed; bottom: 0; left: 0; right: 0; background: #121212; border-radius: 20px 20px 0 0; z-index: 9000; max-height: 60vh; overflow-y: auto; border-top: 1px solid #333; animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        /* Grid */
        .movie-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; padding-bottom: 80px; }
        .post-card { aspect-ratio: 1/1; position: relative; overflow: hidden; background: #121212; }
        .post-card img { width: 100%; height: 100%; object-fit: cover; }

        /* Modal Player */
        .modal-player { display: none; position: fixed; inset: 0; z-index: 8000; background: #000; overflow-y: auto; }
        .ig-post-content { padding: 0 15px; }
        .ig-username { font-weight: 700; font-size: 13px; margin-right: 4px; }
        .ig-caption { font-size: 13px; color: #f5f5f5; line-height: 1.4; }
        
        /* Footer Modal */
        .meta-footer { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
        .ig-date { color: #a8a8a8; font-size: 11px; text-transform: uppercase; }
        #mTranslateBtn { font-size: 11px; color: #fff; font-weight: 600; cursor: pointer; }

        .btn-ig { flex: 1; background: #262626; border-radius: 8px; padding: 6px; font-size: 13px; font-weight: 600; text-align: center; color: #fff; }
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: #000; border-top: 1px solid #1c1c1c; display: flex; justify-content: space-around; padding: 12px 0; z-index: 500; }
    </style>
</head>
<body>

    <div id="splashScreen">
        <img src="amnesfubbia.png" class="splash-logo" alt="Logo">
    </div>

    <div id="mainProfile" style="display: none;">
        <div class="profile-header px-4 pt-4">
            <div class="flex justify-between items-center mb-6">
                <div class="ig-logo-wrapper flex items-center gap-1" onclick="backToHome()">
                    <span class="ig-logo">amnesfubbia</span>
                    <i class="fa-solid fa-chevron-down text-[10px]"></i>
                </div>
                <div class="flex gap-5 text-2xl">
                    <i class="fa-regular fa-square-plus"></i>
                    <i class="fa-solid fa-bars"></i>
                </div>
            </div>

            <div class="profile-info">
                <div class="profile-pic-container">
                    <div class="profile-pic-logo"><img src="amnesfubbia.png"></div>
                    <div class="absolute bottom-1 right-1 w-6 h-6 bg-[#0095f6] border-2 border-black rounded-full flex items-center justify-center text-[10px]"><i class="fa-solid fa-plus"></i></div>
                </div>
                <div class="profile-text-side">
                    <div class="bio-name-wrapper">
                        <span class="bio-name">amnesfubbia</span>
                        <i class="fa-solid fa-circle-check text-[#0095f6] text-[13px]"></i>
                    </div>
                    <div class="stats">
                        <div><span class="stat-val">25K</span><span class="stat-label">film</span></div>
                        <div><span class="stat-val">8K</span><span class="stat-label">series</span></div>
                        <div><span class="stat-val">1.5K</span><span class="stat-label">short</span></div>
                    </div>
                </div>
            </div>

            <div class="bio text-[13px] mt-4 mb-4">
                <p>Dari Indonesia untuk Dunia</p>
                <p class="text-zinc-500">By Anasteas</p>
            </div>

            <div class="flex gap-2 mb-4">
                <div class="btn-ig" id="btnNowPlaying" onclick="setSchedule('now_playing', this)">Sedang Tayang</div>
                <div class="btn-ig" id="btnUpcoming" onclick="setSchedule('upcoming', this)">Segera Tayang</div>
                <div class="w-8 bg-[#262626] rounded-md flex items-center justify-center" onclick="toggleFilterBar()"><i class="fa-solid fa-user-plus text-xs"></i></div>
            </div>

            <div id="filterBar" class="hidden grid grid-cols-3 gap-2 mb-4">
                <button class="pill bg-transparent border border-zinc-800 py-2 rounded-lg text-[10px] font-bold uppercase" id="btnCountry" onclick="toggleFilter(event, 'countryDropdown')">Negara <i class="fa-solid fa-caret-down"></i></button>
                <button class="pill bg-transparent border border-zinc-800 py-2 rounded-lg text-[10px] font-bold uppercase" id="btnGenre" onclick="toggleFilter(event, 'genreDropdown')">Genre <i class="fa-solid fa-caret-down"></i></button>
                <button class="pill bg-transparent border border-zinc-800 py-2 rounded-lg text-[10px] font-bold uppercase" id="yearBtn" onclick="toggleFilter(event, 'yearDropdown')">Tahun <i class="fa-solid fa-caret-down"></i></button>
            </div>
        </div>

        <div class="highlights-wrapper overflow-x-auto no-scrollbar mb-4">
            <div class="flex gap-4 px-4" id="highlightList"></div>
        </div>

        <div class="tab-nav flex border-t border-zinc-900">
            <div class="flex-1 text-center py-3 border-b border-white" id="tabGrid" onclick="switchTab('grid', this)"><i class="fa-solid fa-table-cells text-xl"></i></div>
            <div class="flex-1 text-center py-3 text-zinc-500" id="tabLikes" onclick="switchTab('likes', this)"><i class="fa-regular fa-heart text-xl"></i></div>
            <div class="flex-1 text-center py-3 text-zinc-500" id="tabBookmark" onclick="switchTab('bookmarks', this)"><i class="fa-regular fa-bookmark text-xl"></i></div>
        </div>

        <main id="feedGrid" class="movie-grid"></main>
    </div>

    <div id="movieModal" class="modal-player">
        <div class="max-w-xl mx-auto pb-20">
            <div class="flex items-center px-4 h-14 border-b border-zinc-900 sticky top-0 bg-black z-50">
                <i class="fa-solid fa-chevron-left text-xl" onclick="closeModal()"></i>
                <div class="flex-grow text-center text-sm font-bold truncate px-10" id="mTitle"></div>
            </div>
            
            <div class="relative aspect-video bg-black overflow-hidden">
                <div class="swipe-overlay absolute inset-0 z-10" id="swipeOverlay"></div>
                <div class="carousel-track flex transition-transform duration-300 h-full" id="carouselTrack"></div>
            </div>
            <div id="carouselDots" class="flex justify-center gap-1.5 py-2"></div>

            <div class="px-4 flex justify-between items-center py-2">
                <div class="flex gap-4 text-2xl">
                    <i id="btnLikeModal" class="fa-regular fa-heart"></i>
                    <i class="fa-regular fa-comment"></i>
                    <i class="fa-regular fa-paper-plane"></i>
                </div>
                <i id="btnBookModal" class="fa-regular fa-bookmark text-2xl"></i>
            </div>

            <div class="ig-post-content">
                <p id="mLikeDisplay" class="font-bold text-sm mb-1"></p>
                <div class="text-sm">
                    <span class="ig-username">amnesfubbia</span>
                    <span id="mDesc" class="ig-caption"></span>
                    <span id="mToggleBtn" class="text-zinc-500 ml-1 hidden" onclick="handleToggleDesc()">selengkapnya</span>
                </div>
                
                <div class="meta-footer">
                    <span id="mDateDisplay" class="ig-date"></span>
                    <span id="mTranslateBtn" onclick="handleTranslate()">Lihat terjemahan</span>
                </div>

                <div id="mHashtags" class="text-[#e0f1ff] text-sm mt-3"></div>
                
                <div id="castContainer" class="cast-wrapper flex overflow-x-auto gap-4 py-4 no-scrollbar"></div>

                <div id="serverList" class="grid grid-cols-3 gap-2 mt-4"></div>
            </div>
        </div>
    </div>

    <div id="searchOverlay" class="fixed inset-0 bg-black z-[5000] hidden overflow-y-auto">
        <div class="p-4 flex items-center gap-3">
            <i class="fa-solid fa-arrow-left text-xl" onclick="closeSearch()"></i>
            <input type="text" id="searchInp" class="flex-1 bg-zinc-900 rounded-lg p-2 text-sm outline-none" placeholder="Cari..." onkeydown="if(event.key==='Enter') searchAction()">
        </div>
        <div id="searchGrid" class="movie-grid"></div>
    </div>

    <nav class="bottom-nav">
        <i class="fa-solid fa-house text-xl" onclick="backToHome()"></i>
        <i class="fa-solid fa-magnifying-glass text-xl" onclick="openSearch()"></i>
        <i class="fa-regular fa-bookmark text-xl" onclick="switchTab('bookmarks', document.getElementById('tabBookmark'))"></i>
    </nav>

    <div id="filterOverlay" class="fixed inset-0 bg-black/70 z-[8900] hidden" onclick="closeD()"></div>
    <div id="countryDropdown" class="filter-dropdown no-scrollbar"></div>
    <div id="genreDropdown" class="filter-dropdown no-scrollbar"></div>
    <div id="yearDropdown" class="filter-dropdown no-scrollbar"></div>

    <script>
        const API_KEY = 'bfa7df5310c9974f62f26c6789a8c00d';
        let page = 1, currentIdx = 0, isExpanded = false, globalFullDesc = "", globalEnDesc = "", isTranslated = false;

        window.onload = () => {
            setTimeout(() => { document.getElementById('splashScreen').style.display = 'none'; document.getElementById('mainProfile').style.display = 'block'; }, 2000);
            initHighlights(); initFilters(); loadFeed(); setupSwipe();
        };

        function initHighlights() {
            const hls = [{n: 'Disney', com: '2|6125', l: 'DSNY'}, {n: 'Pixar', com: '3', l: 'PIXR'}, {n: 'Marvel', com: '420', l: 'MRVL'}, {n: 'Anime', g: 16, l: 'ANIM'}];
            const cont = document.getElementById('highlightList');
            hls.forEach(h => {
                const div = document.createElement('div');
                div.className = 'highlight-item text-center flex-shrink-0';
                div.onclick = () => {
                    document.querySelectorAll('.highlight-item').forEach(el => el.classList.remove('active'));
                    div.classList.add('active');
                    currentCompany = h.com || ''; currentGenre = h.g || ''; loadFeed(true);
                };
                div.innerHTML = `<div class="highlight-circle mb-1"><span class="hl-logo">${h.l}</span></div><span class="text-[11px]">${h.n}</span>`;
                cont.appendChild(div);
            });
        }

        async function loadFeed(isNew = true) {
            if(isNew) { page = 1; document.getElementById('feedGrid').innerHTML = ''; }
            let url = `https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&language=id-ID&page=${page}&sort_by=popularity.desc`;
            const res = await fetch(url);
            const data = await res.json();
            renderGrid(data.results, document.getElementById('feedGrid'));
        }

        function renderGrid(items, grid) {
            items.forEach(m => {
                if(!m.poster_path) return;
                const card = document.createElement('div');
                card.className = 'post-card';
                card.onclick = () => openModal(m.id, 'movie');
                card.innerHTML = `<img src="https://image.tmdb.org/t/p/w342${m.poster_path}">`;
                grid.appendChild(card);
            });
        }

        async function openModal(id, type) {
            window.currentMediaId = id; window.currentMediaType = type;
            document.getElementById('movieModal').style.display = 'block';
            document.body.style.overflow = 'hidden';
            isTranslated = false;
            
            const rId = await fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=${API_KEY}&language=id-ID&append_to_response=videos,credits`);
            const rEn = await fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=${API_KEY}&language=en-US`);
            const dId = await rId.json(), dEn = await rEn.json();
            
            globalFullDesc = dId.overview || "Sinopsis tidak tersedia.";
            globalEnDesc = dEn.overview || "";
            
            document.getElementById('mTitle').innerText = dId.title || dId.name;
            document.getElementById('mLikeDisplay').innerText = `${Math.floor((dId.vote_average || 0) * 1234).toLocaleString('id-ID')} suka`;
            
            const vids = (dId.videos.results || []).slice(0, 3);
            const track = document.getElementById('carouselTrack'), dots = document.getElementById('carouselDots');
            track.innerHTML = ''; dots.innerHTML = '';
            
            vids.forEach((v, i) => {
                track.innerHTML += `<div class="carousel-slide min-w-full h-full"><iframe id="yt-${i}" src="https://www.youtube.com/embed/${v.key}?enablejsapi=1&autoplay=${i===0?1:0}" class="w-full h-full" allow="autoplay"></iframe></div>`;
                dots.innerHTML += `<div class="w-1.5 h-1.5 rounded-full ${i===0?'bg-blue-500':'bg-zinc-700'}"></div>`;
            });

            const rel = dId.release_date || dId.first_air_date || "";
            document.getElementById('mDateDisplay').innerText = rel ? new Date(rel).toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' }) : '';
            document.getElementById('mTranslateBtn').innerText = "Lihat terjemahan";
            
            renderSynopsis();
            updateLibButtons(id);
        }

        async function handleTranslate() {
            const btn = document.getElementById('mTranslateBtn');
            const desc = document.getElementById('mDesc');
            
            if(!isTranslated) {
                if(globalEnDesc) {
                    btn.innerText = "Menerjemahkan...";
                    const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=id&dt=t&q=${encodeURIComponent(globalEnDesc)}`);
                    const data = await res.json();
                    desc.innerText = data[0].map(x => x[0]).join('');
                    btn.innerText = "Lihat versi asli";
                    isTranslated = true;
                }
            } else {
                desc.innerText = isExpanded ? globalFullDesc : globalFullDesc.substring(0, 90) + "...";
                btn.innerText = "Lihat terjemahan";
                isTranslated = false;
            }
        }

        function closeModal() {
            document.getElementById('carouselTrack').innerHTML = ''; // Kill video
            document.getElementById('movieModal').style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        function renderSynopsis() {
            const descEl = document.getElementById('mDesc'), toggleBtn = document.getElementById('mToggleBtn');
            if (globalFullDesc.length > 90) {
                toggleBtn.classList.remove('hidden');
                descEl.innerText = isExpanded ? globalFullDesc : globalFullDesc.substring(0, 90) + "...";
                toggleBtn.innerText = isExpanded ? "ringkas" : "selengkapnya";
            } else {
                descEl.innerText = globalFullDesc;
                toggleBtn.classList.add('hidden');
            }
        }

        function handleToggleDesc() { isExpanded = !isExpanded; renderSynopsis(); }
        function setupSwipe() { /* Logic swipe seperti sebelumnya */ }
        function backToHome() { location.reload(); }
        function openSearch() { document.getElementById('searchOverlay').classList.remove('hidden'); }
        function closeSearch() { document.getElementById('searchOverlay').classList.add('hidden'); }
        function toggleFilterBar() { document.getElementById('filterBar').classList.toggle('hidden'); }
        function closeD() { document.querySelectorAll('.filter-dropdown').forEach(d => d.style.display = 'none'); document.getElementById('filterOverlay').classList.add('hidden'); }
        function initFilters() { /* Logic filter */ }
        function toggleFilter(e, id) { e.stopPropagation(); document.getElementById(id).style.display = 'block'; document.getElementById('filterOverlay').classList.remove('hidden'); }
    </script>
</body>
</html>
