<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>amnesfubbia xx1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@1,700&family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { background-color: #000; color: #fff; font-family: 'Inter', sans-serif; margin: 0; overflow-x: hidden; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        /* HEADER & PROFILE */
        .profile-header { padding: 15px 15px 0 15px; background: #000; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .ig-logo { font-family: 'DM Sans', sans-serif; font-weight: 700; font-style: italic; font-size: 20px; }
        .profile-info { display: flex; align-items: center; gap: 25px; margin-bottom: 15px; }
        .profile-pic { width: 77px; height: 77px; border-radius: 50%; border: 1px solid #333; padding: 3px; }
        .profile-pic img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; filter: grayscale(1); }
        .stats { display: flex; flex-grow: 1; justify-content: space-around; text-align: center; }
        .stat-item { cursor: pointer; }
        .stat-val { font-weight: 700; font-size: 16px; display: block; }
        .stat-label { font-size: 12px; color: #a8a8a8; }
        .bio { font-size: 13px; line-height: 1.4; margin-bottom: 15px; }
        .bio-name { font-weight: 700; display: block; }

        /* ACTION BUTTONS */
        .action-buttons { display: flex; gap: 6px; margin-bottom: 15px; }
        .btn-ig { flex: 1; background: #1c1c1c; border-radius: 8px; padding: 7px; font-size: 13px; font-weight: 600; text-align: center; color: #fff; cursor: pointer; }
        .btn-ig.active { background: #363636; }
        .btn-icon-sq { width: 34px; background: #1c1c1c; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; }

        /* HIGHLIGHTS */
        .highlights-wrapper { padding: 0 15px 15px 15px; border-bottom: 1px solid #1c1c1c; }
        .highlights-container { display: flex; gap: 15px; overflow-x: auto; }
        .highlight-item { flex: 0 0 62px; text-align: center; cursor: pointer; }
        .highlight-circle { width: 58px; height: 58px; border-radius: 50%; border: 1px solid #333; margin-bottom: 5px; display: flex; align-items: center; justify-content: center; background: #0a0a0a; }
        .highlight-circle i { font-size: 20px; color: #fff; opacity: 0.8; }
        .highlight-text { font-size: 10px; color: #fff; }

        /* TAB NAVIGATION (Grid, Like, Bookmark) */
        .tab-nav { display: flex; border-top: 1px solid #1c1c1c; }
        .tab-item { flex: 1; text-align: center; padding: 12px 0; color: #a8a8a8; cursor: pointer; font-size: 20px; }
        .tab-item.active { color: #fff; border-bottom: 2px solid #fff; }

        /* DROPDOWNS FIX */
        #filterBar { display: none; padding: 10px 15px; background: #050505; }
        .pill-grid { display: grid; gap: 6px; }
        .pill { background: transparent; border: 1px solid #1c1c1c; color: #fff; padding: 7px 0; border-radius: 8px; font-size: 10px; font-weight: 800; text-transform: uppercase; text-align: center; cursor: pointer; }
        .filter-dropdown { display: none; position: fixed; background: #1a1a1a; border: 1px solid #333; border-radius: 12px; z-index: 1000; width: 160px; max-height: 250px; overflow-y: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .filter-item { padding: 12px; font-size: 12px; text-align: center; border-bottom: 1px solid #222; color: #ccc; cursor: pointer; }

        /* SEARCH OVERLAY */
        #searchOverlay { display: none; position: fixed; inset: 0; background: #000; z-index: 2000; overflow-y: auto; }
        .search-header { position: sticky; top: 0; background: #000; display: flex; align-items: center; padding: 10px 15px; gap: 10px; border-bottom: 1px solid #1c1c1c; z-index: 10; }
        .search-input-box { flex-grow: 1; background: #262626; border-radius: 10px; padding: 8px 12px; display: flex; align-items: center; }
        .search-input-box input { background: transparent; border: none; outline: none; color: #fff; font-size: 14px; width: 100%; margin-left: 8px; }

        /* MOVIE GRID (BACK TO ORIGINAL SIZE) */
        .movie-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; padding-bottom: 100px; }
        .post-card { position: relative; aspect-ratio: 2/3; background: #0a0a0a; overflow: hidden; cursor: pointer; }
        .post-card img { width: 100%; height: 100%; object-fit: cover; }
        .badge-rating { position: absolute; top: 6px; left: 6px; padding: 2px 5px; border-radius: 2px; font-size: 7px; font-weight: 900; z-index: 5; background: rgba(255,255,255,0.9); color: #000; }
        .badge-type { position: absolute; top: 6px; right: 6px; padding: 2px 5px; border-radius: 2px; font-size: 7px; font-weight: 900; z-index: 5; background: rgba(0,0,0,0.7); color: #fff; text-transform: uppercase; border: 0.5px solid rgba(255,255,255,0.3); }

        /* BOTTOM NAV */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: #000; border-top: 1px solid #1c1c1c; display: flex; justify-content: space-around; padding: 12px 0; z-index: 300; }
        
        /* MODAL PLAYER (ORIGINAL - NO CHANGES) */
        .modal-player { display: none; position: fixed; inset: 0; z-index: 3000; background: #000; overflow-y: auto; }
        .carousel-track { display: flex; transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1); width: 100%; }
        .carousel-slide { min-width: 100%; aspect-ratio: 16/9; position: relative; }
        .swipe-overlay { position: absolute; inset: 0; z-index: 10; background: transparent; }
        .interaction-icon { font-size: 24px; cursor: pointer; color: #fff; }
        .server-btn { width: 100%; padding: 12px 5px; border-radius: 8px; font-size: 8px; font-weight: 800; text-transform: uppercase; border: 1px solid #1c1c1c; text-align: center; cursor: pointer; background: #0a0a0a; color: #fff; }
        .server-btn.active-link { border: 2px solid #fff !important; }
        .dl-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 15px; }
        .dl-link-btn { width: 100%; padding: 14px; border-radius: 12px; background: #000; color: #a1a1aa; font-size: 10px; font-weight: 800; text-transform: uppercase; text-align: center; border: 1px solid #1c1c1c; }
        .cast-wrapper { display: flex; overflow-x: auto; gap: 15px; padding: 15px 0; scrollbar-width: none; }
        .cast-item { flex: 0 0 65px; text-align: center; }
        .cast-img-border { width: 64px; height: 64px; border-radius: 50%; padding: 2px; border: 2px solid #333; margin-bottom: 5px; }
        .cast-img-border img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: #1c1c1c; }
        .ig-post-content { padding: 0 15px; margin-top: 5px; }
        .ig-likes-count { font-weight: 700; font-size: 13px; margin-bottom: 5px; }
        .ig-username { font-weight: 700; font-size: 13px; margin-right: 5px; }
        .ig-caption { font-size: 13px; line-height: 1.5; }
        .toggle-btn { color: #a8a8a8; cursor: pointer; margin-left: 4px; }
        .ig-hashtags { color: #e0f1ff; display: block; margin-top: 10px; font-size: 13px; }
        .ig-date { color: #a8a8a8; font-size: 11px; margin-top: 8px; text-transform: uppercase; }
    </style>
</head>
<body>

    <div id="mainProfile">
        <div class="profile-header">
            <div class="top-bar">
                <div class="flex items-center" onclick="location.reload()">
                    <h1 class="ig-logo">amnesfubbia <span class="opacity-40 font-normal">xx1</span></h1>
                    <i class="fa-solid fa-circle-check text-[#0095f6] ml-1 text-[10px]"></i>
                </div>
                <div class="flex gap-4">
                    <div class="border border-white rounded-[4px] p-0.5"><i class="fa-regular fa-square-plus text-xl"></i></div>
                    <i class="fa-solid fa-bars text-xl"></i>
                </div>
            </div>

            <div class="profile-info">
                <div class="profile-pic">
                    <img src="https://image.tmdb.org/t/p/w200/o79fH0A9mYt1L405G65kQoR97H5.jpg" alt="pfp">
                </div>
                <div class="stats">
                    <div class="stat-item" onclick="setFilter('type', 'movie')">
                        <span class="stat-val">25.4rb</span><span class="stat-label">film</span>
                    </div>
                    <div class="stat-item" onclick="setFilter('type', 'tv')">
                        <span class="stat-val">8.2rb</span><span class="stat-label">series</span>
                    </div>
                    <div class="stat-item" onclick="setFilter('type', 'short')">
                        <span class="stat-val">1.5rb</span><span class="stat-label">short</span>
                    </div>
                </div>
            </div>

            <div class="bio">
                <span class="bio-name">amnesfubbia xx1</span>
                <span>dari indonesia untuk dunia</span><br>
                <span>By Anasteas</span>
            </div>

            <div class="action-buttons">
                <div id="btnNowPlaying" class="btn-ig" onclick="setSchedule('now_playing', this)">Sedang Tayang</div>
                <div id="btnUpcoming" class="btn-ig" onclick="setSchedule('upcoming', this)">Segera Tayang</div>
                <div class="btn-icon-sq" onclick="toggleFilterBar()">
                    <i class="fa-solid fa-user-plus text-sm"></i>
                </div>
            </div>
        </div>

        <div class="highlights-wrapper no-scrollbar">
            <div class="highlights-container no-scrollbar" id="highlightList"></div>
        </div>

        <div class="tab-nav">
            <div class="tab-item active" onclick="switchTab('grid', this)"><i class="fa-solid fa-table-cells"></i></div>
            <div class="tab-item" onclick="switchTab('likes', this)"><i class="fa-regular fa-heart"></i></div>
            <div class="tab-item" onclick="switchTab('bookmarks', this)"><i class="fa-regular fa-bookmark"></i></div>
        </div>

        <div id="filterBar">
            <div class="pill-grid grid-cols-3">
                <button class="pill" id="btnCountry" onclick="toggleDropdown(event, 'countryDropdown')">Negara <i class="fa-solid fa-caret-down"></i></button>
                <button class="pill" id="btnGenre" onclick="toggleDropdown(event, 'genreDropdown')">Genre <i class="fa-solid fa-caret-down"></i></button>
                <button class="pill" id="yearBtn" onclick="toggleDropdown(event, 'yearDropdown')">Tahun <i class="fa-solid fa-caret-down"></i></button>
            </div>
        </div>

        <main id="feedGrid" class="movie-grid"></main>
    </div>

    <div id="searchOverlay">
        <div class="search-header">
            <i class="fa-solid fa-arrow-left text-lg" onclick="closeSearch()"></i>
            <div class="search-input-box">
                <i class="fa-solid fa-magnifying-glass text-zinc-500 text-xs"></i>
                <input type="text" id="searchInp" placeholder="Cari film, series, anime..." onkeydown="if(event.key==='Enter') searchAction()" autocomplete="off">
            </div>
            <span class="text-sm font-semibold" onclick="closeSearch()">Batal</span>
        </div>
        <div id="searchGrid" class="movie-grid"></div>
    </div>

    <div id="countryDropdown" class="filter-dropdown"></div>
    <div id="genreDropdown" class="filter-dropdown"></div>
    <div id="yearDropdown" class="filter-dropdown"></div>

    <div id="movieModal" class="modal-player">
        <div class="max-w-xl mx-auto pb-40">
            <div class="px-4 h-[54px] flex items-center border-b border-zinc-900 sticky top-0 bg-black z-50">
                <i class="fa-solid fa-chevron-left text-xl cursor-pointer" onclick="closeModal()"></i>
                <div class="flex-grow text-center text-[14px] font-bold truncate px-8" id="mTitle"></div>
            </div>
            <div id="castContainer" class="cast-wrapper px-4 no-scrollbar"></div>
            <div class="relative overflow-hidden">
                <div class="swipe-overlay" id="swipeOverlay"></div>
                <div class="carousel-track" id="carouselTrack"></div>
                <div id="carouselDots" class="flex justify-center gap-2 py-3"></div>
            </div>
            <div class="px-4 py-3 flex justify-between items-center">
                <div class="flex gap-4"><i id="btnLikeModal" class="interaction-icon"></i><i class="fa-regular fa-comment interaction-icon"></i><i class="fa-regular fa-paper-plane interaction-icon"></i></div>
                <i id="btnBookModal" class="interaction-icon"></i>
            </div>
            <div class="ig-post-content">
                <span id="mLikeDisplay" class="ig-likes-count"></span>
                <div class="mb-1"><span class="ig-username">amnesfubbia.xx1</span><span id="mDesc" class="ig-caption"></span><span id="mToggleBtn" class="toggle-btn hidden" onclick="handleToggleDesc()">selengkapnya</span></div>
                <p id="mTranslateBtn" class="text-[11px] text-zinc-500 font-bold mb-2 cursor-pointer hidden">Lihat Terjemahan...</p>
                <div id="mHashtags" class="ig-hashtags"></div>
                <div id="mDateDisplay" class="ig-date"></div>
                <div id="seriesControl" class="hidden mt-6 p-4 bg-zinc-950 rounded-2xl border border-zinc-900">
                    <div class="flex justify-between items-center mb-4"><h4 class="text-[9px] font-black text-zinc-400 uppercase">Episode</h4><select id="seasonSel" class="bg-zinc-900 text-white text-[10px] px-2 py-1 rounded" onchange="loadEpisodes()"></select></div>
                    <div id="episodeGrid" class="grid grid-cols-5 gap-2"></div>
                </div>
                <div id="serverList" class="grid grid-cols-3 gap-2 mt-6"></div>
                <div class="dl-grid">
                    <button id="btnDownload1" class="dl-link-btn" onclick="highlightBtn(this); window.open(`https://dl.vidsrc.vip/${window.currentMediaType}/${window.currentMediaId}`)">Download 1</button>
                    <button id="btnDownload2" class="dl-link-btn" onclick="highlightBtn(this); window.open(`https://multiembed.mov/directstream.php?video_id=${window.currentMediaId}&tmdb=1`)">Download 2</button>
                </div>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <i class="fa-solid fa-house cursor-pointer text-xl" onclick="location.reload()"></i>
        <i class="fa-solid fa-magnifying-glass cursor-pointer text-xl" onclick="openSearch()"></i>
        <i class="fa-regular fa-bookmark cursor-pointer text-xl" onclick="switchTab('bookmarks')"></i>
    </nav>

    <script>
        const API_KEY = 'bfa7df5310c9974f62f26c6789a8c00d';
        let page = 1, loading = false, currentType = 'multi', currentGenre = '', currentYear = '', currentCountry = '', currentSchedule = 'trending', searchQuery = '';
        let isExpanded = false, globalFullDesc = "", currentIdx = 0, startX = 0;

        window.onload = () => { initFilters(); initHighlights(); loadFeed(); setupSwipe(); };

        function initHighlights() {
            const hls = [
                {name: 'Anime', id: 16, ico: 'fa-dragon', type: 'anime'},
                {name: 'Korea', country: 'KR', ico: 'fa-k'},
                {name: 'Indonesia', country: 'ID', ico: 'fa-flag'},
                {name: 'India', country: 'IN', ico: 'fa-tala-rupee-sign'},
                {name: 'Thailand', country: 'TH', ico: 'fa-temple'},
                {name: 'Disney', id: 10751, ico: 'fa-mickey-mouse'},
                {name: 'Dreamwork', id: 14, ico: 'fa-moon'},
                {name: 'Ghibli', id: 16, country: 'JP', ico: 'fa-leaf'},
                {name: 'Netflix', id: 10770, ico: 'fa-n'}
            ];
            const container = document.getElementById('highlightList');
            hls.forEach(h => {
                const item = document.createElement('div');
                item.className = 'highlight-item';
                item.onclick = () => {
                    if(h.type === 'anime') { setFilter('type', 'anime'); }
                    else if(h.country) { setCountry(h.country, h.name); }
                    else { setGenre(h.id, h.name); }
                };
                item.innerHTML = `<div class="highlight-circle"><i class="fa-solid ${h.ico}"></i></div><div class="highlight-text">${h.name}</div>`;
                container.appendChild(item);
            });
        }

        function toggleDropdown(e, id) {
            e.stopPropagation();
            const d = document.getElementById(id);
            const rect = e.target.getBoundingClientRect();
            const isVisible = d.style.display === 'block';
            document.querySelectorAll('.filter-dropdown').forEach(el => el.style.display = 'none');
            if(!isVisible) {
                d.style.display = 'block';
                d.style.left = rect.left + 'px';
                d.style.top = (rect.top - d.offsetHeight - 10) + 'px'; // Dropup style to avoid scrolling issues
            }
        }

        function switchTab(mode, el) {
            if(el) {
                document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
                el.classList.add('active');
            }
            if(mode === 'likes' || mode === 'bookmarks') showLibrary(mode);
            else { currentSchedule = 'trending'; loadFeed(true); }
        }

        function openSearch() { document.getElementById('searchOverlay').style.display = 'block'; document.getElementById('searchInp').focus(); document.body.style.overflow = 'hidden'; }
        function closeSearch() { document.getElementById('searchOverlay').style.display = 'none'; document.getElementById('searchInp').value = ''; searchQuery = ''; document.body.style.overflow = 'auto'; }
        function toggleFilterBar() { const b = document.getElementById('filterBar'); b.style.display = b.style.display === 'block' ? 'none' : 'block'; }

        async function loadFeed(isNew = true) {
            if(loading) return; loading = true;
            const target = searchQuery ? document.getElementById('searchGrid') : document.getElementById('feedGrid');
            if(isNew) { page = 1; target.innerHTML = ''; }
            
            let endpoint = (currentType === 'tv' || currentType === 'anime') ? 'discover/tv' : 'discover/movie';
            let url = `https://api.themoviedb.org/3/${endpoint}?api_key=${API_KEY}&language=id-ID&page=${page}&include_adult=false`;

            const today = new Date().toISOString().split('T')[0];
            if(currentSchedule === 'now_playing') {
                const prev = new Date(Date.now() - 30*24*60*60*1000).toISOString().split('T')[0];
                url += `&release_date.gte=${prev}&release_date.lte=${today}&sort_by=release_date.desc`;
            } else if(currentSchedule === 'upcoming') {
                url += `&primary_release_date.gte=${today}&sort_by=primary_release_date.asc`;
            } else {
                url += `&sort_by=popularity.desc`;
            }

            if(currentType === 'anime') url += `&with_genres=16&with_original_language=ja`;
            if(currentType === 'short') url += `&with_runtime.lte=45`;
            if(currentCountry) url += `&with_origin_country=${currentCountry}`;
            if(currentGenre) url += `&with_genres=${currentGenre}`;
            if(currentYear) url += endpoint.includes('tv') ? `&first_air_date_year=${currentYear}` : `&primary_release_year=${currentYear}`;
            if(searchQuery) url = `https://api.themoviedb.org/3/search/multi?query=${encodeURIComponent(searchQuery)}&api_key=${API_KEY}&language=id-ID&page=${page}`;

            try {
                const res = await fetch(url);
                const data = await res.json();
                renderGrid(data.results || [], target);
            } catch(e) {}
            loading = false;
        }

        function renderGrid(items, grid) {
            items.forEach(m => {
                if(!m.poster_path) return;
                const mType = m.media_type || (currentType.includes('tv')||currentType==='anime'?'tv':'movie');
                const card = document.createElement('div');
                card.className = 'post-card';
                card.onclick = () => openModal(m.id, mType);
                card.innerHTML = `<div class="badge-rating">★ ${m.vote_average.toFixed(1)}</div><div class="badge-type">${mType==='tv'?'SERIES':'FILM'}</div><img src="https://image.tmdb.org/t/p/w342${m.poster_path}">`;
                grid.appendChild(card);
            });
        }

        function searchAction() { searchQuery = document.getElementById('searchInp').value; loadFeed(true); }
        function setSchedule(v, el) { document.querySelectorAll('.btn-ig').forEach(b => b.classList.remove('active')); el.classList.add('active'); currentSchedule = v; loadFeed(true); }
        function setFilter(k, v) { currentType = v; loadFeed(true); }
        function setYear(y) { currentYear=y; document.getElementById('yearBtn').innerText=y||'Tahun'; closeD(); loadFeed(true); }
        function setCountry(c, n) { currentCountry=c; document.getElementById('btnCountry').innerText=n; closeD(); loadFeed(true); }
        function setGenre(g, n) { currentGenre=g; document.getElementById('btnGenre').innerText=n; closeD(); loadFeed(true); }
        function closeD() { document.querySelectorAll('.filter-dropdown').forEach(d => d.style.display='none'); }
        document.addEventListener('click', closeD);

        function initFilters() {
            const yD = document.getElementById('yearDropdown');
            yD.innerHTML = '<div class="filter-item" onclick="setYear(\'\')">Semua</div>';
            for(let y=2026; y>=1990; y--) yD.innerHTML += `<div class="filter-item" onclick="setYear(${y})">${y}</div>`;
            const cD = document.getElementById('countryDropdown');
            cD.innerHTML = '<div class="filter-item" onclick="setCountry(\'\',\'Negara\')">Semua</div>';
            [['IN','India'],['KR','Korea'],['ID','Indonesia'],['TH','Thailand'],['US','USA']].forEach(c => cD.innerHTML += `<div class="filter-item" onclick="setCountry('${c[0]}','${c[1]}')">${c[1]}</div>`);
            const gD = document.getElementById('genreDropdown');
            gD.innerHTML = '<div class="filter-item" onclick="setGenre(\'\',\'Genre\')">Semua</div>';
            [[28,'Action'],[16,'Animasi'],[27,'Horror'],[10749,'Romance']].forEach(g => gD.innerHTML += `<div class="filter-item" onclick="setGenre('${g[0]}','${g[1]}')">${g[1]}</div>`);
        }

        // --- MODAL FUNCTIONS (KEEP ORIGINAL) ---
        async function openModal(id, type) {
            window.currentMediaId = id; window.currentMediaType = type;
            document.getElementById('movieModal').style.display = 'block';
            document.body.style.overflow = 'hidden';
            currentIdx = 0;
            const [rId, rEn, rCast] = await Promise.all([
                fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=${API_KEY}&language=id-ID&append_to_response=videos`),
                fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=${API_KEY}&language=en-US&append_to_response=videos`),
                fetch(`https://api.themoviedb.org/3/${type}/${id}/credits?api_key=${API_KEY}`)
            ]);
            const dId = await rId.json(), dEn = await rEn.json(), dCast = await rCast.json();
            const vids = [...(dId.videos?.results || []), ...(dEn.videos?.results || [])].filter(v => v.site === 'YouTube' && (v.type === 'Trailer' || v.type === 'Teaser')).slice(0, 4);
            const track = document.getElementById('carouselTrack'), dots = document.getElementById('carouselDots');
            track.innerHTML = ''; dots.innerHTML = '';
            if(vids.length > 0) {
                vids.forEach((v, i) => {
                    track.innerHTML += `<div class="carousel-slide"><iframe id="yt-${i}" src="https://www.youtube.com/embed/${v.key}?enablejsapi=1&autoplay=${i===0?1:0}" class="w-full h-full" allowfullscreen></iframe></div>`;
                    dots.innerHTML += `<div class="dot w-1.5 h-1.5 rounded-full ${i===0?'bg-blue-500':'bg-zinc-700'}"></div>`;
                });
                document.getElementById('swipeOverlay').style.display = 'block';
            } else {
                track.innerHTML = `<div class="carousel-slide"><iframe src="https://vidrock.net/embed/${type}/${id}${type==='tv'?'/1/1':''}" class="w-full h-full" allowfullscreen></iframe></div>`;
                document.getElementById('swipeOverlay').style.display = 'none';
            }
            document.getElementById('castContainer').innerHTML = (dCast.cast || []).slice(0, 10).map(c => `<div class="cast-item"><div class="cast-img-border"><img src="${c.profile_path ? 'https://image.tmdb.org/t/p/w185' + c.profile_path : 'https://www.themoviedb.org/assets/2/v4/glyphicons/basic/glyphicons-basic-4-user-3245c3f3347706a035c9744ffaa5d174e48be3b860667e406723f3bc8160f47e.svg'}"></div><span class="cast-name">${c.name}</span></div>`).join('');
            document.getElementById('mTitle').innerText = dId.title || dId.name || dEn.title;
            globalFullDesc = dId.overview || dEn.overview || "No data.";
            renderSynopsis();
            document.getElementById('mLikeDisplay').innerText = `${Math.floor((dId.vote_average || 0) * 1234).toLocaleString('id-ID')} suka`;
            const rel = dId.release_date || dId.first_air_date || "";
            document.getElementById('mDateDisplay').innerText = rel;
            document.getElementById('serverList').innerHTML = `<button class="server-btn" onclick="playVid('https://vidrock.net/embed/${type}/${id}${type==='tv'?'/1/1':''}', this)">Server 1</button><button class="server-btn" onclick="playVid('https://vidsrc.me/embed/${type}?tmdb=${id}', this)">Server 2</button>`;
            if(type === 'tv') { document.getElementById('seriesControl').classList.remove('hidden'); loadEpisodes(); } else { document.getElementById('seriesControl').classList.add('hidden'); }
            updateLibButtons(id);
        }

        function closeModal() { document.getElementById('movieModal').style.display = 'none'; document.body.style.overflow = 'auto'; }
        function renderSynopsis() { document.getElementById('mDesc').innerText = globalFullDesc.substring(0, 90) + "..."; }
        function handleToggleDesc() { document.getElementById('mDesc').innerText = globalFullDesc; }
        function highlightBtn(el) { document.querySelectorAll('.server-btn').forEach(b => b.classList.remove('active-link')); el.classList.add('active-link'); }
        async function loadEpisodes() { const s = document.getElementById('seasonSel').value; const res = await fetch(`https://api.themoviedb.org/3/tv/${window.currentMediaId}/season/${s}?api_key=${API_KEY}`); const d = await res.json(); document.getElementById('episodeGrid').innerHTML = (d.episodes||[]).map(e => `<div class="pill" onclick="playVid('https://vidrock.net/embed/tv/${window.currentMediaId}/${s}/${e.episode_number}', this)">${e.episode_number}</div>`).join(''); }
        function playVid(u, el) { document.getElementById('carouselTrack').innerHTML = `<div class="carousel-slide"><iframe src="${u}" class="w-full h-full" allowfullscreen></iframe></div>`; highlightBtn(el); }
        function updateLibButtons(id) { document.getElementById('btnLikeModal').className = 'fa-regular fa-heart interaction-icon'; document.getElementById('btnBookModal').className = 'fa-regular fa-bookmark interaction-icon'; }
        async function showLibrary(k) { const items = JSON.parse(localStorage.getItem(k) || '[]'); const grid = document.getElementById('feedGrid'); grid.innerHTML = ''; for(const i of items) { const r = await fetch(`https://api.themoviedb.org/3/${i.type}/${i.id}?api_key=${API_KEY}&language=id-ID`); const m = await r.json(); renderGrid([m], grid); } }
        function setupSwipe() {
            const overlay = document.getElementById('swipeOverlay');
            overlay.addEventListener('touchstart', e => { startX = e.touches[0].clientX; }, {passive:true});
            overlay.addEventListener('touchend', e => {
                let diff = startX - e.changedTouches[0].clientX;
                const slides = document.querySelectorAll('.carousel-slide');
                if(Math.abs(diff) > 50 && slides.length > 1) {
                    if(diff > 0 && currentIdx < slides.length - 1) currentIdx++;
                    else if(diff < 0 && currentIdx > 0) currentIdx--;
                    document.getElementById('carouselTrack').style.transform = `translateX(-${currentIdx * 100}%)`;
                }
            });
        }
        window.onscroll = () => { if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 1000 && !loading) { page++; loadFeed(false); } };
    </script>
</body>
</html>
