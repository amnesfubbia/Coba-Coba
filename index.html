<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>amnesfubbia xx1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@1,700&family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { background-color: #000; color: #fff; font-family: 'Inter', sans-serif; margin: 0; overflow-x: hidden; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .fixed-header-section { position: fixed; top: 0; width: 100%; z-index: 100; background: #000; border-bottom: 1px solid #1c1c1c; }
        .ig-header { padding: 12px 15px 5px 15px; }
        .ig-logo { font-family: 'DM Sans', sans-serif; font-weight: 700; font-style: italic; font-size: 24px; letter-spacing: -0.8px; text-transform: lowercase; cursor: pointer; }
        .verified-icon { font-size: 13px; color: #0095f6; margin-left: 5px; }
        .search-container { background: #0a0a0a; border-radius: 8px; display: flex; align-items: center; padding: 7px 12px; flex-grow: 1; border: 1px solid #1c1c1c; }
        .search-container input { background: transparent !important; border: none !important; color: white !important; font-size: 13px; width: 100%; outline: none !important; box-shadow: none !important; margin-left: 8px; }

        /* Menu Selektor Berjejer Baru */
        .selectors-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; padding: 0 15px 10px 15px; }
        .selector-box { background: #0a0a0a; border: 1px solid #1c1c1c; border-radius: 8px; padding: 8px 4px; font-size: 8px; font-weight: 800; color: #fff; text-transform: uppercase; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 3px; }
        
        .custom-dropdown { display: none; position: fixed; width: 140px; max-height: 300px; background: #121212; border: 1px solid #1c1c1c; border-radius: 12px; z-index: 110; overflow-y: auto; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .dropdown-item { padding: 12px; font-size: 11px; font-weight: 600; text-align: center; border-bottom: 1px solid #1c1c1c; color: #888; cursor: pointer; text-transform: uppercase; }

        .category-wrapper { padding: 5px 15px 8px 15px; }
        .pill-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
        .pill { background: transparent; border: 1px solid #1c1c1c; color: #fff; padding: 8px 0; border-radius: 8px; font-size: 10px; font-weight: 800; text-transform: uppercase; text-align: center; cursor: pointer; }
        .pill.active { border-color: #fff; }
        
        /* Genre Highlights Section */
        .highlights-section { padding: 10px 0; border-bottom: 1px solid #1c1c1c; background: #000; }
        .highlights-container { display: flex; gap: 15px; overflow-x: auto; padding: 0 15px; scrollbar-width: none; }
        .highlight-item { flex: 0 0 75px; text-align: center; cursor: pointer; }
        .circle-icon { width: 62px; height: 62px; border-radius: 50%; background: #000; border: 1.5px solid #1c1c1c; display: flex; align-items: center; justify-content: center; margin: 0 auto 8px auto; font-size: 18px; color: #555; }
        .highlight-item.active .circle-icon { border: 2px solid transparent; background: linear-gradient(#000, #000) padding-box, linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%) border-box; color: #fff; }
        .highlight-label { font-size: 9px; color: #555; font-weight: 700; text-transform: uppercase; white-space: nowrap; }
        
        .movie-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; padding-top: 315px; padding-bottom: 100px; }
        .post-card { position: relative; aspect-ratio: 2/3; background: #0a0a0a; overflow: hidden; cursor: pointer; }
        .post-card img { width: 100%; height: 100%; object-fit: cover; }
        .badge-rating { position: absolute; top: 6px; left: 6px; padding: 2px 5px; border-radius: 2px; font-size: 7px; font-weight: 900; z-index: 5; background: rgba(255,255,255,0.9); color: #000; }
        
        /* Modal Style Original */
        .modal-player { display: none; position: fixed; inset: 0; z-index: 200; background: #000; overflow-y: auto; }
        .story-border { padding: 2.5px; background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); border-radius: 50%; display: inline-block; }
        .story-inner { background: #000; padding: 2px; border-radius: 50%; }
        .story-img { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; display: block; }
        .interaction-icon { font-size: 24px; cursor: pointer; color: #fff; }
        .server-btn { width: 100%; padding: 14px; border-radius: 12px; font-size: 10px; font-weight: 800; text-transform: uppercase; border: 1px solid #1c1c1c; text-align: center; cursor: pointer; }
        .ep-box { background: #111; border: 1px solid #1c1c1c; color: #555; font-size: 10px; font-weight: 800; padding: 12px 0; border-radius: 8px; text-align: center; cursor: pointer; }
        .ep-box.active { border-color: #fff; color: #fff; }
        .skeleton { background: linear-gradient(90deg, #0a0a0a 25%, #1a1a1a 50%, #0a0a0a 75%); background-size: 200% 100%; animation: skeleton-loading 1.5s infinite; }
        @keyframes skeleton-loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    </style>
</head>
<body>
    <div id="loader" style="position:fixed; top:0; left:0; height:1.5px; background:#fff; width:0%; transition:width 0.3s; z-index:1000;"></div>

    <div class="fixed-header-section">
        <header class="ig-header">
            <div class="flex justify-between items-center">
                <div class="flex items-center">
                    <h1 class="ig-logo" onclick="location.reload()">amnesfubbia <span class="text-white opacity-40 font-normal italic">xx1</span></h1>
                    <i class="fa-solid fa-circle-check verified-icon"></i>
                </div>
                <div class="flex gap-6 text-xl"><i class="fa-regular fa-square-plus cursor-pointer"></i><i class="fa-regular fa-heart cursor-pointer" onclick="showLibrary('likes')"></i></div>
            </div>
            <div class="search-area mt-2">
                <div class="search-container"><i class="fa-solid fa-magnifying-glass text-zinc-600 text-[10px]"></i><input type="text" id="searchInp" placeholder="Cari sinema dunia..." onkeydown="if(event.key==='Enter') searchAction()" autocomplete="off"></div>
            </div>
        </header>

        <div class="category-wrapper">
            <div class="pill-grid">
                <button class="pill active" onclick="setFilter('type', 'multi', this)">Semua</button>
                <button class="pill" onclick="setFilter('type', 'movie', this)">Film</button>
                <button class="pill" onclick="setFilter('type', 'tv', this)">Series</button>
                <button class="pill" onclick="setFilter('type', 'short', this)">Short</button>
            </div>
        </div>

        <div class="selectors-grid">
            <div class="selector-box" onclick="toggleCustomDropdown('yearDropdown', this)"><span id="yearVal">TAHUN</span> <i class="fa-solid fa-chevron-down text-[5px]"></i></div>
            <div class="selector-box" onclick="toggleCustomDropdown('countryDropdown', this)"><span id="countryVal">NEGARA</span> <i class="fa-solid fa-chevron-down text-[5px]"></i></div>
            <div class="selector-box" onclick="toggleCustomDropdown('platformDropdown', this)"><span id="platformVal">STUDIO</span> <i class="fa-solid fa-chevron-down text-[5px]"></i></div>
            <div class="selector-box" onclick="toggleCustomDropdown('genreDropdown', this)"><span id="genreVal">GENRE</span> <i class="fa-solid fa-chevron-down text-[5px]"></i></div>
        </div>

        <div class="highlights-section">
            <div class="highlights-container no-scrollbar" id="genreHighlights">
                <div class="highlight-item active" onclick="setFilter('genre', '', this)"><div class="circle-icon"><i class="fa-solid fa-border-all"></i></div><p class="highlight-label">Semua</p></div>
                <div class="highlight-item" onclick="setFilter('genre', '16', this)"><div class="circle-icon"><i class="fa-solid fa-dragon"></i></div><p class="highlight-label">Animasi</p></div>
                <div class="highlight-item" onclick="setFilter('genre', '27', this)"><div class="circle-icon"><i class="fa-solid fa-ghost"></i></div><p class="highlight-label">Horor</p></div>
                <div class="highlight-item" onclick="setFilter('genre', '28', this)"><div class="circle-icon"><i class="fa-solid fa-bolt"></i></div><p class="highlight-label">Aksi</p></div>
                <div class="highlight-item" onclick="setFilter('genre', '35', this)"><div class="circle-icon"><i class="fa-solid fa-masks-theater"></i></div><p class="highlight-label">Komedi</p></div>
                <div class="highlight-item" onclick="setFilter('genre', '10749', this)"><div class="circle-icon"><i class="fa-solid fa-heart"></i></div><p class="highlight-label">Romantis</p></div>
            </div>
        </div>
    </div>

    <div id="yearDropdown" class="custom-dropdown no-scrollbar"></div>
    <div id="countryDropdown" class="custom-dropdown no-scrollbar"></div>
    <div id="platformDropdown" class="custom-dropdown no-scrollbar"></div>
    <div id="genreDropdown" class="custom-dropdown no-scrollbar"></div>

    <main id="feedGrid" class="movie-grid"></main>

    <nav class="bottom-nav">
        <div class="nav-item" onclick="location.reload();"><i class="fa-solid fa-house"></i></div>
        <div class="nav-item" onclick="document.getElementById('searchInp').focus();"><i class="fa-solid fa-magnifying-glass"></i></div>
        <div class="nav-item" onclick="showLibrary('bookmarks');"><i class="fa-regular fa-bookmark"></i></div>
        <div class="nav-item" onclick="alert('Amnesfubbia XX1\nBy Anasteas')"><i class="fa-regular fa-user"></i></div>
    </nav>

    <div id="movieModal" class="modal-player">
        <div class="max-w-xl mx-auto pb-40">
            <div class="px-4 h-[54px] flex items-center border-b border-zinc-900 sticky top-0 bg-black z-50">
                <i class="fa-solid fa-chevron-left text-xl cursor-pointer" onclick="closeModal()"></i>
                <div class="flex-grow flex flex-col items-center justify-center px-8">
                    <span class="text-[11px] font-bold text-zinc-500 uppercase tracking-widest leading-none mb-1">Sinema</span>
                    <h2 id="mTitle" class="truncate w-full text-center leading-none text-sm font-bold"></h2>
                </div>
            </div>
            <div class="py-4 bg-black"><div id="mCast" class="flex gap-4 overflow-x-auto no-scrollbar px-4"></div></div>
            <div class="aspect-video bg-zinc-900"><iframe id="videoPlayer" class="w-full h-full" allowfullscreen></iframe></div>
            <div class="px-4 py-3 flex justify-between items-center">
                <div class="flex gap-4"><i id="btnLikeModal" class="interaction-icon"></i><i class="fa-regular fa-comment interaction-icon"></i><i class="fa-regular fa-paper-plane interaction-icon"></i></div>
                <i id="btnBookModal" class="interaction-icon"></i>
            </div>
            <div class="px-4 mb-2"><p id="mLikeCount" class="like-count"></p></div>
            <div class="px-4">
                <p class="mb-1"><span id="mTitleAlt" class="mr-2 font-bold"></span><span id="mTagline" class="text-sm text-zinc-300"></span></p>
                <div class="description-area"><span id="mDesc" class="text-sm"></span><span id="readMoreBtn" class="read-more-btn hidden" onclick="expandDesc()">selengkapnya</span></div>
                <div id="translateBtn" class="translate-btn hidden mt-1" onclick="toggleTranslation()">Lihat Terjemahan</div>
                <p id="mMeta" class="text-[11px] text-zinc-500 mt-2"></p>
                <p id="mTime" class="time-ago"></p>
            </div>
            <div class="px-4 pt-2">
                <div id="seriesControl" class="hidden mb-6 p-4 bg-zinc-950 rounded-2xl border border-zinc-900">
                    <div class="flex justify-between items-center mb-4"><h4 class="text-[9px] font-black text-zinc-400 uppercase">Pilih Episode</h4><select id="seasonSel" class="bg-zinc-900 text-white text-[10px] font-bold px-3 py-1 rounded-lg border border-zinc-800" onchange="loadEpisodes()"></select></div>
                    <div id="episodeGrid" class="series-grid"></div>
                </div>
                <div id="serverList" class="grid grid-cols-2 gap-2 mt-4"></div>
                <button id="btnDownloadMain" class="server-btn border-zinc-800 text-zinc-400 mt-4"><i class="fa-solid fa-download mr-2"></i> Download Sinema</button>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = 'bfa7df5310c9974f62f26c6789a8c00d';
        let page = 1, loading = false, currentType = 'multi', currentGenre = '', currentYear = '', currentCountry = '', currentPlatform = '';
        let fullDesc = '', descIndo = '', isTranslated = false;

        window.onload = () => { initDropdowns(); loadFeed(); };

        function initDropdowns() {
            const yD = document.getElementById('yearDropdown');
            let yH = '<div class="dropdown-item" onclick="setVal(\'year\', \'\', \'TAHUN\')">SEMUA</div>';
            for(let y = 2026; y >= 1930; y--) yH += `<div class="dropdown-item" onclick="setVal(\'year\', ${y}, ${y})">${y}</div>`;
            yD.innerHTML = yH;

            const countries = { 'ID':'Indo', 'US':'USA', 'KR':'Korea', 'JP':'Japan', 'TH':'Thai', 'CN':'China' };
            const cD = document.getElementById('countryDropdown');
            let cH = '<div class="dropdown-item" onclick="setVal(\'country\', \'\', \'NEGARA\')">SEMUA</div>';
            for(const code in countries) cH += `<div class="dropdown-item" onclick="setVal(\'country\', \'${code}\', \'${countries[code]}\')">${countries[code]}</div>`;
            cD.innerHTML = cH;

            const platforms = { '213':'Netflix', '1024':'Amazon', '2739':'Disney+', '49':'HBO' };
            const pD = document.getElementById('platformDropdown');
            let pH = '<div class="dropdown-item" onclick="setVal(\'platform\', \'\', \'STUDIO\')">SEMUA</div>';
            for(const id in platforms) pH += `<div class="dropdown-item" onclick="setVal(\'platform\', \'${id}\', \'${platforms[id]}\')">${platforms[id]}</div>`;
            pD.innerHTML = pH;

            const genres = { '16':'Animasi', '27':'Horor', '35':'Komedi', '10749':'Romantis', '28':'Aksi', '18':'Drama' };
            const gD = document.getElementById('genreDropdown');
            let gH = '<div class="dropdown-item" onclick="setVal(\'genre\', \'\', \'GENRE\')">SEMUA</div>';
            for(const id in genres) gH += `<div class="dropdown-item" onclick="setVal(\'genre\', \'${id}\', \'${genres[id]}\')">${genres[id]}</div>`;
            gD.innerHTML = gH;
        }

        function toggleCustomDropdown(id, el) {
            const d = document.getElementById(id);
            const isVisible = d.style.display === 'block';
            document.querySelectorAll('.custom-dropdown').forEach(dd => dd.style.display = 'none');
            if(!isVisible) {
                const rect = el.getBoundingClientRect();
                d.style.top = (rect.bottom + 5) + 'px';
                d.style.left = Math.min(rect.left, window.innerWidth - 150) + 'px';
                d.style.display = 'block';
            }
        }

        function setVal(type, val, label) {
            document.querySelectorAll('.custom-dropdown').forEach(d => d.style.display = 'none');
            if(type === 'year') { currentYear = val; document.getElementById('yearVal').innerText = label; }
            if(type === 'country') { currentCountry = val; document.getElementById('countryVal').innerText = label; }
            if(type === 'platform') { currentPlatform = val; document.getElementById('platformVal').innerText = label; }
            if(type === 'genre') { currentGenre = val; document.getElementById('genreVal').innerText = label; }
            loadFeed(true);
        }

        async function loadFeed(isNew = true) {
            if (loading) return; loading = true;
            if (isNew) { page = 1; document.getElementById('feedGrid').innerHTML = Array(12).fill('<div class="post-card skeleton"></div>').join(''); }
            try {
                const year = currentYear ? (currentType === 'tv' ? `&first_air_date_year=${currentYear}` : `&primary_release_year=${currentYear}`) : '';
                const country = currentCountry ? `&with_origin_country=${currentCountry}` : '';
                const genre = currentGenre ? `&with_genres=${currentGenre}` : '';
                const network = currentPlatform ? `&with_networks=${currentPlatform}` : '';
                
                let url = `https://api.themoviedb.org/3/discover/${currentType==='short'?'movie':(currentType==='multi'?'movie':currentType)}?api_key=${API_KEY}&language=id-ID${genre}${year}${country}${network}&page=${page}`;
                
                const res = await fetch(url); const data = await res.json();
                const items = (data.results || []).map(x => ({...x, m_type: x.media_type || (currentType === 'multi' ? 'movie' : currentType)}));
                if(isNew) document.getElementById('feedGrid').innerHTML = '';
                renderFeed(items);
            } catch (err) { console.error(err); }
            loading = false;
        }

        function renderFeed(data) {
            const grid = document.getElementById('feedGrid');
            data.forEach(m => {
                if (!m.poster_path) return;
                const card = document.createElement('div');
                card.className = 'post-card';
                card.onclick = () => openModal(m.id, m.m_type);
                card.innerHTML = `<div class="badge-rating"><i class="fa-solid fa-star text-[7px]"></i> ${m.vote_average?.toFixed(1) || '0.0'}</div><img src="https://image.tmdb.org/t/p/w342${m.poster_path}" onload="this.parentElement.classList.remove('skeleton')">`;
                grid.appendChild(card);
            });
        }

        function setFilter(t, v, el) { 
            document.querySelectorAll('.pill, .highlight-item').forEach(p => p.classList.remove('active'));
            el.classList.add('active');
            if(t === 'type') currentType = v; else currentGenre = v;
            loadFeed(true); 
        }

        async function openModal(id, type) {
            const modal = document.getElementById('movieModal'); modal.style.display = 'block'; document.body.style.overflow = 'hidden';
            window.currentMediaId = id; const actualType = (type === 'tv') ? 'tv' : 'movie';
            const res = await fetch(`https://api.themoviedb.org/3/${actualType}/${id}?api_key=${API_KEY}&language=id-ID&append_to_response=videos,credits`);
            const d = await res.json();
            document.getElementById('mTitle').innerText = d.title || d.name;
            document.getElementById('mDesc').innerText = d.overview ? d.overview.substring(0, 100) + "..." : "Sinopsis tidak tersedia";
            document.getElementById('mCast').innerHTML = (d.credits?.cast || []).slice(0,10).map(c => `<div class="flex-shrink-0 text-center"><div class="story-border"><div class="story-inner"><img src="https://image.tmdb.org/t/p/w185${c.profile_path}" class="story-img"></div></div><p class="text-[9px] mt-1">${c.name.split(' ')[0]}</p></div>`).join('');
            document.getElementById('videoPlayer').src = type === 'tv' ? `https://vidrock.net/embed/tv/${id}/1/1` : `https://vidrock.net/embed/movie/${id}`;
            if(type==='tv'){ document.getElementById('seriesControl').classList.remove('hidden'); } else { document.getElementById('seriesControl').classList.add('hidden'); }
        }

        function closeModal() { document.getElementById('movieModal').style.display = 'none'; document.getElementById('videoPlayer').src = ''; document.body.style.overflow = 'auto'; }
    </script>
</body>
</html>
