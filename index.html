<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amnesfubbia Film - Fixed</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { background-color: #080808; color: #ffffff; font-family: 'Inter', sans-serif; }
        
        /* Navigasi Transparan */
        .glass-nav { background: rgba(10, 10, 10, 0.9); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255, 255, 255, 0.05); z-index: 1000; position: fixed; top: 0; width: 100%; }
        
        /* Kartu Film */
        .movie-card { background: #121212; border-radius: 12px; overflow: hidden; position: relative; border: 1px solid rgba(255,255,255,0.05); transition: transform 0.3s; }
        .movie-card:hover { transform: scale(1.05); }
        .type-badge { position: absolute; top: 8px; left: 8px; background: #ef4444; color: white; font-size: 8px; font-weight: 900; padding: 3px 6px; border-radius: 4px; z-index: 10; text-transform: uppercase; }
        
        /* Modal - Diperbaiki */
        .modal { display: none; position: fixed; inset: 0; z-index: 3000; background: rgba(0,0,0,0.9); padding: 15px; align-items: center; justify-content: center; }
        
        /* Scrollbar Kustom agar terlihat (PENTING!) */
        .custom-scroll::-webkit-scrollbar { width: 5px; }
        .custom-scroll::-webkit-scrollbar-track { background: #1a1a1a; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #ef4444; border-radius: 10px; }

        .actor-card { min-width: 80px; text-align: center; cursor: pointer; }
        .actor-card img { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; border: 2px solid #ef4444; margin-bottom: 5px; }
        
        .scrollbar-hide::-webkit-scrollbar { display: none; }
    </style>
</head>
<body onload="initApp()">

    <nav class="glass-nav p-4">
        <div class="container mx-auto space-y-4">
            <div class="flex items-center gap-3">
                <div class="shrink-0 cursor-pointer" onclick="location.reload()">
                    <span class="text-2xl font-black italic tracking-tighter">AMNES</span><span class="text-2xl font-black text-red-600 italic tracking-tighter">FILM</span>
                </div>
                <input type="text" id="searchInput" placeholder="Cari film atau aktor..." class="flex-grow bg-white/5 p-3 rounded-xl border border-white/10 text-sm outline-none focus:border-red-600 transition-all">
                <button onclick="searchMulti()" class="bg-red-600 px-6 py-3 rounded-xl font-bold text-xs hover:bg-red-700 transition-colors">CARI</button>
            </div>
            <div class="flex gap-2 overflow-x-auto scrollbar-hide pb-1">
                <select id="genreFilter" onchange="resetAndLoad()" class="bg-black border border-white/10 p-2.5 rounded-lg text-xs font-bold uppercase outline-none">
                    <option value="">Semua Genre</option>
                    <option value="27">Horor</option><option value="35">Komedi</option><option value="18">Drama</option><option value="28">Aksi</option>
                </select>
                <select id="typeFilter" onchange="resetAndLoad()" class="bg-black border border-white/10 p-2.5 rounded-lg text-red-500 font-bold text-xs uppercase outline-none">
                    <option value="movie">Film</option><option value="tv">Series</option>
                </select>
            </div>
        </div>
    </nav>

    <main class="container mx-auto px-4 pt-40 pb-20 min-h-screen">
        <div id="movieGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 lg:grid-cols-6 gap-4"></div>
        <div id="loader" class="text-center py-12 text-red-600 font-black italic animate-pulse">MEMUAT FILM LAINNYA...</div>
    </main>

    <div id="movieModal" class="modal">
        <div class="bg-[#0f0f0f] w-full max-w-5xl rounded-3xl overflow-hidden relative border border-white/10 shadow-2xl flex flex-col md:flex-row max-h-[95vh]">
            <button onclick="closeModal()" class="absolute top-4 right-4 bg-black/60 hover:bg-red-600 text-white w-10 h-10 rounded-full z-[100] flex items-center justify-center border border-white/10 transition-colors">✕</button>
            
            <div class="md:w-1/3 p-6 bg-gradient-to-b from-transparent to-black/40 border-r border-white/5 hidden md:block">
                <img id="mPoster" class="w-full rounded-2xl shadow-2xl mb-6">
                <div id="mSideInfo" class="space-y-3 text-xs font-bold uppercase italic text-gray-400"></div>
            </div>

            <div class="md:w-2/3 p-8 flex flex-col overflow-y-auto custom-scroll">
                <h2 id="mTitle" class="text-4xl font-black italic tracking-tighter uppercase mb-2 text-red-500"></h2>
                <p id="mSub" class="text-xs text-gray-400 font-bold uppercase mb-6 tracking-widest border-b border-white/10 pb-4"></p>

                <div class="aspect-video bg-black rounded-2xl overflow-hidden border border-white/10 shadow-inner mb-8 shrink-0">
                    <iframe id="mTrailer" class="w-full h-full" frameborder="0" allowfullscreen allow="autoplay"></iframe>
                </div>

                <p class="text-[10px] font-black text-red-600 uppercase mb-4 italic tracking-widest">Daftar Pemeran:</p>
                <div id="mCast" class="flex gap-4 overflow-x-auto pb-6 scrollbar-hide mb-6 shrink-0"></div>

                <p class="text-[10px] font-black text-red-600 uppercase mb-3 italic tracking-widest">Sinopsis:</p>
                <p id="mDesc" class="text-sm text-gray-200 leading-relaxed italic mb-10 text-justify"></p>

                <div class="mt-auto grid grid-cols-1 sm:grid-cols-2 gap-4 pt-8 border-t border-white/10">
                    <a id="s1" target="_blank" class="bg-red-600 hover:bg-red-700 text-center py-4 rounded-xl text-xs font-black uppercase italic transition-all">SERVER STREAM 1</a>
                    <a id="s2" target="_blank" class="bg-white/10 hover:bg-white/20 text-center py-4 rounded-xl text-xs font-black uppercase italic border border-white/10 transition-all">SERVER STREAM 2</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const KEY = 'bfa7df5310c9974f62f26c6789a8c00d';
        const IMG = 'https://image.tmdb.org/t/p/w500';
        let page = 1, isLoading = false, isSearch = false;

        function initApp() { 
            loadMovies();
            window.addEventListener('scroll', () => {
                if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 1000 && !isLoading && !isSearch) {
                    page++;
                    loadMovies(true);
                }
            });
        }

        async function loadMovies(append = false) {
            isLoading = true;
            document.getElementById('loader').classList.remove('hidden');
            const type = document.getElementById('typeFilter').value;
            const genre = document.getElementById('genreFilter').value;
            let url = `https://api.themoviedb.org/3/discover/${type}?api_key=${KEY}&with_origin_country=ID&language=id-ID&page=${page}&sort_by=popularity.desc`;
            if (genre) url += `&with_genres=${genre}`;
            
            try {
                const res = await fetch(url);
                const data = await res.json();
                const grid = document.getElementById('movieGrid');
                if (!append) grid.innerHTML = '';
                
                data.results.forEach(m => {
                    if (!m.poster_path) return;
                    const card = document.createElement('div');
                    card.className = 'movie-card cursor-pointer';
                    card.onclick = () => showDetail(m.id, m.title ? 'movie' : 'tv');
                    card.innerHTML = `
                        <div class="type-badge">${m.title ? 'Film' : 'Series'}</div>
                        <img src="${IMG + m.poster_path}" class="w-full aspect-[2/3] object-cover">
                        <div class="p-3 text-[10px] font-black truncate uppercase text-gray-200">${m.title || m.name}</div>
                    `;
                    grid.appendChild(card);
                });
            } catch (e) { console.error(e); }
            isLoading = false;
            document.getElementById('loader').classList.add('hidden');
        }

        async function showDetail(id, type) {
            const res = await fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=${KEY}&append_to_response=videos,credits&language=id-ID`);
            const m = await res.json();
            
            document.getElementById('mPoster').src = IMG + m.poster_path;
            document.getElementById('mTitle').innerText = m.title || m.name;
            document.getElementById('mDesc').innerText = m.overview || "Sinopsis belum tersedia dalam bahasa Indonesia.";
            
            const year = (m.release_date || m.first_air_date || '').split('-')[0];
            const rating = m.vote_average ? m.vote_average.toFixed(1) : 'N/A';
            const genres = m.genres.map(g => g.name).join(', ');
            
            document.getElementById('mSub').innerText = `${year} • ⭐ ${rating} • ${genres}`;
            
            const video = m.videos.results.find(v => v.type === 'Trailer') || m.videos.results[0];
            document.getElementById('mTrailer').src = video ? `https://www.youtube.com/embed/${video.key}` : '';

            const castDiv = document.getElementById('mCast');
            castDiv.innerHTML = m.credits.cast.slice(0, 10).map(c => `
                <div class="actor-card">
                    <img src="${c.profile_path ? IMG + c.profile_path : 'https://via.placeholder.com/150'}">
                    <p class="text-[9px] font-black text-white uppercase leading-tight">${c.name.split(' ')[0]}</p>
                </div>
            `).join('');

            document.getElementById('s1').href = `https://vidsrc.to/embed/${type}/${m.id}`;
            document.getElementById('s2').href = `https://vidsrc.xyz/embed/${type}/${m.id}`;

            document.getElementById('movieModal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('movieModal').style.display = 'none';
            document.body.style.overflow = 'auto';
            document.getElementById('mTrailer').src = '';
        }

        // Fungsi search disingkat agar kode tidak terlalu panjang
        async function searchMulti() {
            const q = document.getElementById('searchInput').value; if (!q) return;
            isSearch = true;
            const res = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${KEY}&query=${encodeURIComponent(q)}&language=id-ID`);
            const data = await res.json();
            const grid = document.getElementById('movieGrid'); grid.innerHTML = '';
            data.results.forEach(m => {
                if(!m.poster_path) return;
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.innerHTML = `<img src="${IMG + m.poster_path}" class="w-full aspect-[2/3] object-cover" onclick="showDetail(${m.id}, '${m.title?'movie':'tv'}')">`;
                grid.appendChild(card);
            });
        }
    </script>
</body>
</html>
