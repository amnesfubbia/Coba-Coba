<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>amnesfubbia xx1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@1,700&family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { background-color: #000; color: #fff; font-family: 'Inter', sans-serif; margin: 0; overflow-x: hidden; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .fixed-header-section { position: fixed; top: 0; width: 100%; z-index: 100; background: #000; border-bottom: 1px solid #1c1c1c; padding-bottom: 10px; }
        .ig-header { padding: 12px 15px 5px 15px; }
        .ig-logo { font-family: 'DM Sans', sans-serif; font-weight: 700; font-style: italic; font-size: 22px; letter-spacing: -0.5px; text-transform: lowercase; cursor: pointer; }
        
        .search-container { background: #0a0a0a; border-radius: 8px; display: flex; align-items: center; padding: 7px 12px; border: 1px solid #1c1c1c; margin: 0 15px 10px 15px; }
        .search-container input { background: transparent !important; border: none !important; color: white !important; font-size: 13px; width: 100%; outline: none !important; margin-left: 8px; box-shadow: none !important; }

        .category-wrapper { padding: 0 15px; }
        .pill-grid { display: grid; gap: 6px; margin-bottom: 8px; }
        .pill { background: transparent; border: 1px solid #1c1c1c; color: #fff; padding: 7px 0; border-radius: 8px; font-size: 10px; font-weight: 800; text-transform: uppercase; text-align: center; cursor: pointer; }
        .pill.active { border-color: #fff; background: rgba(255,255,255,0.1); }
        .movie-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; padding-top: 255px; padding-bottom: 80px; }
        .post-card { position: relative; aspect-ratio: 2/3; background: #0a0a0a; overflow: hidden; }
        .post-card img { width: 100%; height: 100%; object-fit: cover; }
        .badge-rating { position: absolute; top: 6px; left: 6px; padding: 2px 5px; border-radius: 2px; font-size: 7px; font-weight: 900; z-index: 5; background: rgba(255,255,255,0.9); color: #000; }
        .badge-type { position: absolute; top: 6px; right: 6px; padding: 2px 5px; border-radius: 2px; font-size: 7px; font-weight: 900; z-index: 5; background: rgba(0,0,0,0.7); color: #fff; text-transform: uppercase; border: 0.5px solid rgba(255,255,255,0.3); }
        
        .filter-dropdown { display: none; position: fixed; background: #121212; border: 1px solid #1c1c1c; border-radius: 12px; z-index: 200; width: 150px; max-height: 300px; overflow-y: auto; }
        .filter-item { padding: 12px; font-size: 11px; text-align: center; border-bottom: 1px solid #1c1c1c; color: #bbb; cursor: pointer; }
        
        .modal-player { display: none; position: fixed; inset: 0; z-index: 400; background: #000; overflow-y: auto; }
        .carousel-track { display: flex; transition: transform 0.4s ease; width: 100%; }
        .carousel-slide { min-width: 100%; aspect-ratio: 16/9; position: relative; }
        .swipe-overlay { position: absolute; inset: 0; z-index: 10; background: transparent; }
        
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: #000; border-top: 1px solid #1c1c1c; display: flex; justify-content: space-around; padding: 12px 0; z-index: 300; }
    </style>
</head>
<body>

    <div class="fixed-header-section">
        <header class="ig-header flex justify-between items-center">
            <div class="flex items-center" onclick="location.reload()">
                <h1 class="ig-logo">amnesfubbia <span class="text-white opacity-40 font-normal italic">xx1</span></h1>
                <i class="fa-solid fa-circle-check text-[#0095f6] ml-1 text-[10px]"></i>
            </div>
            <div class="flex gap-4">
                <i class="fa-regular fa-heart text-xl cursor-pointer" onclick="showLibrary('likes')"></i>
                <i class="fa-regular fa-bookmark text-xl cursor-pointer" onclick="showLibrary('bookmarks')"></i>
            </div>
        </header>

        <div class="search-container">
            <i class="fa-solid fa-magnifying-glass text-zinc-600 text-[10px]"></i>
            <input type="text" id="searchInp" placeholder="Cari film, series, anime..." onkeydown="if(event.key==='Enter') searchAction()">
        </div>

        <div class="category-wrapper">
            <div class="pill-grid grid-cols-5">
                <button class="pill active" onclick="setFilter('type', 'multi', this)">Semua</button>
                <button class="pill" onclick="setFilter('type', 'movie', this)">Film</button>
                <button class="pill" onclick="setFilter('type', 'tv', this)">Series</button>
                <button class="pill" onclick="setFilter('type', 'short', this)">Short</button>
                <button class="pill" onclick="setFilter('type', 'anime', this)">Anime</button>
            </div>
            <div class="pill-grid grid-cols-4">
                <button class="pill active" onclick="setSchedule('trending', this)">Trending</button>
                <button class="pill" onclick="setSchedule('popular', this)">Populer</button>
                <button class="pill" onclick="setSchedule('now_playing', this)">Tayang</button>
                <button class="pill" onclick="setSchedule('upcoming', this)">Segera</button>
            </div>
            <div class="pill-grid grid-cols-3">
                <button class="pill" id="btnCountry" onclick="toggleFilter('countryDropdown')">Negara <i class="fa-solid fa-caret-down"></i></button>
                <button class="pill" id="btnGenre" onclick="toggleFilter('genreDropdown')">Genre <i class="fa-solid fa-caret-down"></i></button>
                <button class="pill" id="yearBtn" onclick="toggleFilter('yearDropdown')">Tahun <i class="fa-solid fa-caret-down"></i></button>
            </div>
        </div>
    </div>

    <div id="countryDropdown" class="filter-dropdown left-[15px] top-[245px] no-scrollbar"></div>
    <div id="genreDropdown" class="filter-dropdown left-[35%] top-[245px] no-scrollbar"></div>
    <div id="yearDropdown" class="filter-dropdown right-[15px] top-[245px] no-scrollbar"></div>

    <main id="feedGrid" class="movie-grid"></main>

    <div id="movieModal" class="modal-player">
        <div class="max-w-xl mx-auto pb-40">
            <div class="px-4 h-[54px] flex items-center border-b border-zinc-900 sticky top-0 bg-black z-50">
                <i class="fa-solid fa-chevron-left text-xl cursor-pointer" onclick="closeModal()"></i>
                <div class="flex-grow text-center text-[14px] font-bold truncate px-8" id="mTitle"></div>
            </div>

            <div id="castContainer" class="cast-wrapper px-4 no-scrollbar"></div>

            <div class="carousel-container relative overflow-hidden">
                <div class="swipe-overlay" id="swipeOverlay"></div>
                <div class="carousel-track" id="carouselTrack"></div>
                <div class="flex justify-center gap-2 py-3" id="carouselDots"></div>
            </div>

            <div class="px-4 py-3 flex justify-between items-center">
                <div class="flex gap-4">
                    <i id="btnLikeModal" class="text-2xl cursor-pointer" onclick="toggleLib('likes')"></i>
                    <i class="fa-regular fa-comment text-2xl"></i>
                    <i class="fa-regular fa-paper-plane text-2xl"></i>
                </div>
                <i id="btnBookModal" class="text-2xl cursor-pointer" onclick="toggleLib('bookmarks')"></i>
            </div>
            
            <div class="px-4">
                <span id="mLikeDisplay" class="font-bold text-[13px] block mb-1"></span>
                <div class="mb-1">
                    <span class="font-bold text-[13px] mr-1">amnesfubbia.xx1</span>
                    <span id="mDesc" class="text-[13px] leading-relaxed"></span>
                    <span id="mToggleBtn" class="text-zinc-500 cursor-pointer text-[13px] ml-1 hidden" onclick="handleToggleDesc()">selengkapnya</span>
                </div>
                <div id="mTranslateBtn" class="text-blue-500 text-[11px] font-bold cursor-pointer mt-1" onclick="translateDesc()">TERJEMAHKAN</div>
                <div id="mHashtags" class="text-[#e0f1ff] text-[13px] mt-2"></div>
                <div id="mDateDisplay" class="text-[#a8a8a8] text-[11px] mt-2 uppercase"></div>
                
                <div id="seriesControl" class="hidden mt-6 p-4 bg-zinc-950 rounded-2xl border border-zinc-900">
                    <select id="seasonSel" class="bg-zinc-900 text-white text-[10px] w-full p-2 mb-4" onchange="loadEpisodes()"></select>
                    <div id="episodeGrid" class="grid grid-cols-5 gap-2"></div>
                </div>

                <div id="serverList" class="grid grid-cols-3 gap-2 mt-6"></div>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <i class="fa-solid fa-house" onclick="location.reload()"></i>
        <i class="fa-solid fa-magnifying-glass" onclick="document.getElementById('searchInp').focus()"></i>
        <i class="fa-regular fa-user"></i>
    </nav>

    <script>
        const API_KEY = 'bfa7df5310c9974f62f26c6789a8c00d';
        let page = 1, loading = false, currentType = 'multi', currentGenre = '', currentYear = '', currentCountry = '', currentSchedule = 'trending', searchQuery = '';
        let isExpanded = false, descID = "", descEN = "", currentIdx = 0, startX = 0;

        window.onload = () => { initFilters(); loadFeed(); setupSwipe(); };

        function initFilters() {
            const yD = document.getElementById('yearDropdown');
            yD.innerHTML = '<div class="filter-item" onclick="setYear(\'\')">Semua Tahun</div>';
            for(let y=2026; y>=1900; y--) yD.innerHTML += `<div class="filter-item" onclick="setYear(${y})">${y}</div>`;
            const cD = document.getElementById('countryDropdown');
            cD.innerHTML = '<div class="filter-item" onclick="setCountry(\'\',\'Negara\')">Semua</div>';
            [['IN','India'],['TH','Thailand'],['KR','Korea'],['JP','Jepang'],['ID','Indonesia'],['US','USA']].forEach(c => cD.innerHTML += `<div class="filter-item" onclick="setCountry('${c[0]}','${c[1]}')">${c[1]}</div>`);
            const gD = document.getElementById('genreDropdown');
            gD.innerHTML = '<div class="filter-item" onclick="setGenre(\'\',\'Genre\')">Semua</div>';
            [[28,'Action'],[12,'Adventure'],[16,'Animasi'],[35,'Comedy'],[27,'Horror'],[10749,'Romance']].forEach(g => gD.innerHTML += `<div class="filter-item" onclick="setGenre('${g[0]}','${g[1]}')">${g[1]}</div>`);
        }

        async function loadFeed(isNew = true) {
            if(loading) return; loading = true;
            if(isNew) { page = 1; document.getElementById('feedGrid').innerHTML = ''; }
            let url = "";
            
            // Perbaikan Akurasi Menu
            if(searchQuery) {
                url = `https://api.themoviedb.org/3/search/multi?api_key=${API_KEY}&query=${encodeURIComponent(searchQuery)}&page=${page}&language=id-ID`;
            } else if (currentType === 'short') {
                url = `https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&with_runtime.lte=45&language=id-ID&page=${page}`;
            } else {
                let cat = (currentType === 'tv' || currentType === 'anime') ? 'tv' : 'movie';
                if(currentSchedule === 'trending') url = `https://api.themoviedb.org/3/trending/${cat}/day?api_key=${API_KEY}&page=${page}&language=id-ID`;
                else url = `https://api.themoviedb.org/3/${cat}/${currentSchedule}?api_key=${API_KEY}&page=${page}&language=id-ID`;
            }

            if(currentGenre) url += `&with_genres=${currentGenre}`;
            if(currentYear) url += `&${currentType.includes('tv')?'first_air_date_year':'primary_release_year'}=${currentYear}`;
            if(currentCountry) url += `&with_origin_country=${currentCountry}`;

            try {
                const res = await fetch(url);
                const data = await res.json();
                renderGrid(data.results || []);
            } catch(e) {}
            loading = false;
        }

        function renderGrid(items) {
            const grid = document.getElementById('feedGrid');
            items.forEach(m => {
                if(!m.poster_path) return;
                const type = m.media_type || (currentType.includes('tv')?'tv':'movie');
                const div = document.createElement('div');
                div.className = 'post-card';
                div.onclick = () => openModal(m.id, type);
                div.innerHTML = `<div class="badge-rating">★ ${m.vote_average.toFixed(1)}</div><div class="badge-type">${type.toUpperCase()}</div><img src="https://image.tmdb.org/t/p/w342${m.poster_path}">`;
                grid.appendChild(div);
            });
        }

        async function openModal(id, type) {
            window.currentMediaId = id; window.currentMediaType = type;
            document.getElementById('movieModal').style.display = 'block';
            document.body.style.overflow = 'hidden';
            currentIdx = 0;

            const [rId, rEn, rCast] = await Promise.all([
                fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=${API_KEY}&language=id-ID&append_to_response=videos`),
                fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=${API_KEY}&language=en-US&append_to_response=videos`),
                fetch(`https://api.themoviedb.org/3/${type}/${id}/credits?api_key=${API_KEY}`)
            ]);
            
            const dId = await rId.json(), dEn = await rEn.json(), dCast = await rCast.json();
            descID = dId.overview || ""; descEN = dEn.overview || "";
            
            const vids = [...(dId.videos?.results || []), ...(dEn.videos?.results || [])]
                .filter(v => v.site === 'YouTube' && (v.type === 'Trailer' || v.type === 'Teaser')).slice(0, 4);

            const track = document.getElementById('carouselTrack'), dots = document.getElementById('carouselDots');
            track.innerHTML = ''; dots.innerHTML = '';

            vids.forEach((v, i) => {
                track.innerHTML += `<div class="carousel-slide"><iframe id="yt-${i}" src="https://www.youtube.com/embed/${v.key}?enablejsapi=1&autoplay=${i===0?1:0}&mute=0" class="w-full h-full" allow="autoplay; fullscreen"></iframe></div>`;
                dots.innerHTML += `<div class="dot w-1.5 h-1.5 rounded-full ${i===0?'bg-blue-500':'bg-zinc-700'}"></div>`;
            });

            document.getElementById('mTitle').innerText = dId.title || dId.name;
            document.getElementById('mLikeDisplay').innerText = `${Math.floor(dId.vote_average * 1234).toLocaleString()} suka`;
            isExpanded = false; renderSynopsis(descID || descEN);
            
            document.getElementById('serverList').innerHTML = `<button class="server-btn" onclick="playStream('https://vidrock.net/embed/${type}/${id}')">SERVER 1</button><button class="server-btn" onclick="playStream('https://vidsrc.me/embed/${type}?tmdb=${id}')">SERVER 2</button>`;
            
            document.getElementById('castContainer').innerHTML = (dCast.cast || []).slice(0, 10).map(c => `
                <div class="cast-item" onclick="searchActorMovies(${c.id}, '${c.name}')">
                    <div class="cast-img-border"><img src="https://image.tmdb.org/t/p/w185${c.profile_path}"></div>
                    <span class="cast-name">${c.name}</span>
                </div>`).join('');

            updateLibButtons();
        }

        function renderSynopsis(text) {
            const d = document.getElementById('mDesc'), b = document.getElementById('mToggleBtn');
            d.innerText = isExpanded ? text : text.substring(0, 90) + "...";
            b.classList.toggle('hidden', text.length <= 90);
        }

        function translateDesc() {
            const btn = document.getElementById('mTranslateBtn');
            const isToEN = btn.innerText === "TERJEMAHKAN";
            renderSynopsis(isToEN ? descEN : descID);
            btn.innerText = isToEN ? "LIHAT ASLI (ID)" : "TERJEMAHKAN";
        }

        function handleToggleDesc() { isExpanded = !isExpanded; renderSynopsis(document.getElementById('mTranslateBtn').innerText === "TERJEMAHKAN" ? descID : descEN); }

        function toggleLib(key) {
            let items = JSON.parse(localStorage.getItem(key) || '[]');
            const idx = items.findIndex(x => x.id == window.currentMediaId);
            idx > -1 ? items.splice(idx, 1) : items.push({id: window.currentMediaId, type: window.currentMediaType});
            localStorage.setItem(key, JSON.stringify(items));
            updateLibButtons();
        }

        function updateLibButtons() {
            const isL = JSON.parse(localStorage.getItem('likes') || '[]').some(x => x.id == window.currentMediaId);
            const isB = JSON.parse(localStorage.getItem('bookmarks') || '[]').some(x => x.id == window.currentMediaId);
            document.getElementById('btnLikeModal').className = isL ? 'fa-solid fa-heart text-red-500' : 'fa-regular fa-heart';
            document.getElementById('btnBookModal').className = isB ? 'fa-solid fa-bookmark text-white' : 'fa-regular fa-bookmark';
        }

        function setupSwipe() {
            const overlay = document.getElementById('swipeOverlay');
            overlay.addEventListener('touchstart', e => { startX = e.touches[0].clientX; }, {passive:true});
            overlay.addEventListener('touchend', e => {
                let diff = startX - e.changedTouches[0].clientX;
                const total = document.querySelectorAll('.carousel-slide').length;
                if(Math.abs(diff) > 50) {
                    let oldIdx = currentIdx;
                    if(diff > 0 && currentIdx < total - 1) currentIdx++;
                    else if(diff < 0 && currentIdx > 0) currentIdx--;
                    document.getElementById('carouselTrack').style.transform = `translateX(-${currentIdx * 100}%)`;
                    managePlayback(oldIdx, currentIdx);
                }
            });
        }

        function managePlayback(oldI, newI) {
            const o = document.getElementById(`yt-${oldI}`), n = document.getElementById(`yt-${newI}`);
            if(o) o.contentWindow.postMessage('{"event":"command","func":"pauseVideo","args":""}', '*');
            if(n) n.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
        }

        function setFilter(t, v, el) { currentType = v; updatePill(el); loadFeed(true); }
        function setSchedule(v, el) { currentSchedule = v; updatePill(el); loadFeed(true); }
        function updatePill(el) { el.parentElement.querySelectorAll('.pill').forEach(p=>p.classList.remove('active')); el.classList.add('active'); }
        function toggleFilter(id) { document.querySelectorAll('.filter-dropdown').forEach(d=>d.style.display='none'); document.getElementById(id).style.display='block'; }
        function setYear(y) { currentYear=y; loadFeed(true); }
        function setCountry(c, n) { currentCountry=c; loadFeed(true); }
        function setGenre(g, n) { currentGenre=g; loadFeed(true); }
        function closeModal() { document.getElementById('movieModal').style.display = 'none'; document.getElementById('carouselTrack').innerHTML = ''; document.body.style.overflow = 'auto'; }
    </script>
</body>
</html>
