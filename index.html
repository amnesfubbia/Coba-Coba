<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amnesfubbia Film - Pro Version</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { background-color: #080808; color: #ffffff; font-family: 'Inter', sans-serif; }
        
        .glass-nav { background: rgba(10, 10, 10, 0.9); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255, 255, 255, 0.05); z-index: 1000; position: fixed; top: 0; width: 100%; }
        
        .movie-card { background: #121212; border-radius: 12px; overflow: hidden; position: relative; border: 1px solid rgba(255,255,255,0.05); transition: transform 0.3s; }
        .movie-card:hover { transform: scale(1.05); border-color: #ef4444; }
        
        .type-badge { position: absolute; top: 8px; left: 8px; background: #ef4444; color: white; font-size: 8px; font-weight: 900; padding: 3px 6px; border-radius: 4px; z-index: 10; text-transform: uppercase; }
        
        .modal { display: none; position: fixed; inset: 0; z-index: 3000; background: rgba(0,0,0,0.95); padding: 10px; align-items: center; justify-content: center; }
        
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #ef4444; border-radius: 10px; }

        .actor-card { min-width: 90px; text-align: center; flex-shrink: 0; }
        .actor-card img { width: 70px; height: 70px; border-radius: 50%; object-fit: cover; border: 2px solid #ef4444; margin-bottom: 5px; }
        
        .scrollbar-hide::-webkit-scrollbar { display: none; }

        /* Tombol Back to Top */
        #backToTop { display: none; position: fixed; bottom: 80px; right: 20px; z-index: 2000; background: #ef4444; color: white; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; border: none; font-size: 20px; transition: 0.3s; }
        #backToTop:hover { background: white; color: #ef4444; }

        /* Banner Bawah Tetap */
        .sticky-footer { position: fixed; bottom: 0; width: 100%; background: #050505; border-top: 1px solid rgba(255,255,255,0.1); py-4; z-index: 1000; text-align: center; }
    </style>
</head>
<body onload="initApp()">

    <button id="backToTop" onclick="scrollToTop()"><i class="fas fa-arrow-up"></i></button>

    <nav class="glass-nav p-4">
        <div class="container mx-auto space-y-4">
            <div class="flex items-center gap-3">
                <div class="shrink-0 cursor-pointer" onclick="location.reload()">
                    <span class="text-2xl font-black italic tracking-tighter">AMNES</span><span class="text-2xl font-black text-red-600 italic tracking-tighter">FILM</span>
                </div>
                <input type="text" id="searchInput" placeholder="Cari film..." class="flex-grow bg-white/5 p-3 rounded-xl border border-white/10 text-sm outline-none focus:border-red-600">
                <button onclick="searchMulti()" class="bg-red-600 px-6 py-3 rounded-xl font-bold text-xs">CARI</button>
            </div>
            <div class="flex gap-2 overflow-x-auto scrollbar-hide pb-1">
                <select id="genreFilter" onchange="resetAndLoad()" class="bg-black border border-white/10 p-2.5 rounded-lg text-xs font-bold uppercase">
                    <option value="">Semua Genre</option>
                    <option value="27">Horor</option><option value="35">Komedi</option><option value="18">Drama</option><option value="28">Aksi</option>
                </select>
                <select id="yearFilter" onchange="resetAndLoad()" class="bg-black border border-white/10 p-2.5 rounded-lg text-xs font-bold uppercase">
                    <option value="">Semua Tahun</option>
                    <option value="2026">2026</option><option value="2025">2025</option><option value="2024">2024</option><option value="2023">2023</option><option value="2022">2022</option>
                </select>
                <select id="typeFilter" onchange="resetAndLoad()" class="bg-black border border-white/10 p-2.5 rounded-lg text-red-500 font-bold text-xs uppercase">
                    <option value="movie">Film</option><option value="tv">Series</option>
                </select>
            </div>
        </div>
    </nav>

    <main class="container mx-auto px-4 pt-44 pb-32">
        <div id="movieGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 lg:grid-cols-6 gap-4"></div>
        <div id="loader" class="text-center py-12 text-red-600 font-black italic animate-pulse">MEMUAT...</div>
    </main>

    <footer class="sticky-footer py-4">
        <p class="text-[12px] font-black tracking-[0.5em] text-white uppercase italic">AMNESFUBBIA ENTERTAINMENT</p>
    </footer>

    <div id="movieModal" class="modal">
        <div class="bg-[#0f0f0f] w-full max-w-6xl rounded-3xl overflow-hidden relative border border-white/10 shadow-2xl flex flex-col md:flex-row h-full md:h-auto max-h-[90vh]">
            <button onclick="closeModal()" class="absolute top-4 right-4 bg-black/60 text-white w-10 h-10 rounded-full z-[100] flex items-center justify-center border border-white/10 hover:bg-red-600 transition-colors">✕</button>
            
            <div class="md:w-1/3 p-6 bg-black flex flex-col items-center justify-start border-r border-white/5 overflow-y-auto hidden md:flex">
                <img id="mPoster" class="w-full rounded-2xl shadow-2xl mb-6 object-contain">
                <div id="mSideInfo" class="w-full space-y-3 text-xs font-bold uppercase italic text-gray-400"></div>
            </div>

            <div class="md:w-2/3 p-6 md:p-10 flex flex-col overflow-y-auto custom-scroll">
                <h2 id="mTitle" class="text-3xl md:text-5xl font-black italic tracking-tighter uppercase mb-2 text-white"></h2>
                <p id="mSub" class="text-xs text-red-600 font-bold uppercase mb-6 tracking-widest"></p>

                <div class="w-full aspect-video bg-black rounded-2xl overflow-hidden border border-white/10 shadow-inner mb-8">
                    <iframe id="mTrailer" class="w-full h-full" frameborder="0" allowfullscreen allow="autoplay"></iframe>
                </div>

                <p class="text-[10px] font-black text-gray-500 uppercase mb-4 italic tracking-widest">Daftar Pemeran:</p>
                <div id="mCast" class="flex gap-6 overflow-x-auto pb-6 scrollbar-hide mb-8"></div>

                <p class="text-[10px] font-black text-gray-500 uppercase mb-2 italic tracking-widest">Sinopsis:</p>
                <p id="mDesc" class="text-sm text-gray-300 leading-relaxed italic mb-10"></p>

                <div class="mt-auto grid grid-cols-1 sm:grid-cols-2 gap-4 pb-4">
                    <a id="s1" target="_blank" class="bg-red-600 text-center py-4 rounded-xl text-xs font-black uppercase italic">SERVER STREAM 1</a>
                    <a id="s2" target="_blank" class="bg-white/10 text-center py-4 rounded-xl text-xs font-black uppercase italic border border-white/10">SERVER STREAM 2</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const KEY = 'bfa7df5310c9974f62f26c6789a8c00d';
        const IMG = 'https://image.tmdb.org/t/p/w500';
        let page = 1, isLoading = false, isSearch = false;

        function initApp() { 
            loadMovies();
            // Scroll Tak Terbatas
            window.addEventListener('scroll', () => {
                if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 500 && !isLoading && !isSearch) {
                    page++;
                    loadMovies(true);
                }
                // Logika Back to Top
                const btt = document.getElementById('backToTop');
                if (window.scrollY > 500) btt.style.display = 'block';
                else btt.style.display = 'none';
            });
        }

        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetAndLoad() {
            page = 1;
            isSearch = false;
            loadMovies();
        }

        async function loadMovies(append = false) {
            isLoading = true;
            document.getElementById('loader').classList.remove('hidden');
            const type = document.getElementById('typeFilter').value;
            const genre = document.getElementById('genreFilter').value;
            const year = document.getElementById('yearFilter').value;

            let url = `https://api.themoviedb.org/3/discover/${type}?api_key=${KEY}&with_origin_country=ID&language=id-ID&page=${page}&sort_by=popularity.desc`;
            if (genre) url += `&with_genres=${genre}`;
            if (year) url += type === 'movie' ? `&primary_release_year=${year}` : `&first_air_date_year=${year}`;
            
            const res = await fetch(url);
            const data = await res.json();
            const grid = document.getElementById('movieGrid');
            if (!append) grid.innerHTML = '';
            
            data.results.forEach(m => {
                if (!m.poster_path) return;
                const card = document.createElement('div');
                card.className = 'movie-card cursor-pointer';
                card.onclick = () => showDetail(m.id, m.title ? 'movie' : 'tv');
                card.innerHTML = `
                    <div class="type-badge">${m.title ? 'Film' : 'Series'}</div>
                    <img src="${IMG + m.poster_path}" class="w-full aspect-[2/3] object-cover">
                    <div class="p-3 text-[10px] font-black truncate uppercase text-gray-200">${m.title || m.name}</div>
                `;
                grid.appendChild(card);
            });
            isLoading = false;
            document.getElementById('loader').classList.add('hidden');
        }

        async function showDetail(id, type) {
            const res = await fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=${KEY}&append_to_response=videos,credits&language=id-ID`);
            const m = await res.json();
            
            document.getElementById('mPoster').src = IMG + m.poster_path;
            document.getElementById('mTitle').innerText = m.title || m.name;
            document.getElementById('mDesc').innerText = m.overview || "Sinopsis belum tersedia.";
            
            const year = (m.release_date || m.first_air_date || '').split('-')[0];
            const rating = m.vote_average.toFixed(1);
            const genres = m.genres.map(g => g.name).join(', ');
            document.getElementById('mSub').innerText = `${year} | ⭐ ${rating} | ${genres}`;
            
            const video = m.videos.results.find(v => v.type === 'Trailer') || m.videos.results[0];
            document.getElementById('mTrailer').src = video ? `https://www.youtube.com/embed/${video.key}?autoplay=1&mute=1` : '';

            const castDiv = document.getElementById('mCast');
            castDiv.innerHTML = m.credits.cast.slice(0, 12).map(c => `
                <div class="actor-card">
                    <img src="${c.profile_path ? IMG + c.profile_path : 'https://via.placeholder.com/150'}">
                    <p class="text-[9px] font-black text-white uppercase leading-tight mt-1">${c.name}</p>
                </div>
            `).join('');

            document.getElementById('s1').href = `https://vidsrc.to/embed/${type}/${m.id}`;
            document.getElementById('s2').href = `https://vidsrc.xyz/embed/${type}/${m.id}`;

            document.getElementById('movieModal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('movieModal').style.display = 'none';
            document.body.style.overflow = 'auto';
            document.getElementById('mTrailer').src = '';
        }

        async function searchMulti() {
            const q = document.getElementById('searchInput').value; if (!q) return;
            isSearch = true;
            const res = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${KEY}&query=${encodeURIComponent(q)}&language=id-ID`);
            const data = await res.json();
            const grid = document.getElementById('movieGrid');
            grid.innerHTML = '';
            data.results.forEach(m => {
                if(!m.poster_path) return;
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.innerHTML = `<img src="${IMG + m.poster_path}" class="w-full aspect-[2/3] object-cover" onclick="showDetail(${m.id}, '${m.title?'movie':'tv'}')">`;
                grid.appendChild(card);
            });
        }
    </script>
</body>
</html>
