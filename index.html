<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>amnesfubbia ANIMATION</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@1,700&family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { background-color: #000; color: #fff; font-family: 'Inter', sans-serif; margin: 0; overflow-x: hidden; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        /* Fixed Header Section */
        .fixed-header-section { position: fixed; top: 0; width: 100%; z-index: 100; background: #000; border-bottom: 1px solid #1c1c1c; }
        .ig-header { padding: 15px 15px 5px 15px; }
        .ig-logo { font-family: 'DM Sans', sans-serif; font-weight: 700; font-style: italic; font-size: 26px; letter-spacing: -1px; }

        /* Search Bar */
        .search-container { background: #121212; border-radius: 10px; display: flex; align-items: center; padding: 10px 15px; margin: 10px 15px; border: 1px solid #1c1c1c; }
        .search-container input { background: transparent; border: none; color: white; font-size: 14px; width: 100%; outline: none; margin-left: 10px; }

        /* Pills Menu */
        .pill-container { display: flex; gap: 8px; overflow-x: auto; padding: 5px 15px 15px 15px; }
        .pill { background: #000; border: 1px solid #333; color: #888; padding: 8px 18px; border-radius: 9px; font-size: 10px; font-weight: 800; text-transform: uppercase; white-space: nowrap; }
        .pill.active { background: #1a1a1a; border-color: #fff; color: #fff; }

        /* Filter Row */
        .filter-row { display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid #1c1c1c; border-bottom: 1px solid #1c1c1c; }
        .filter-item { font-size: 10px; font-weight: 900; color: #555; text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; gap: 5px; cursor: pointer; }

        /* Studio Highlights */
        .studio-scroll { display: flex; gap: 18px; overflow-x: auto; padding: 18px 15px; background: #000; }
        .studio-circle { width: 60px; height: 60px; border-radius: 50%; background: #000; border: 1.5px solid #1c1c1c; display: flex; align-items: center; justify-content: center; overflow: hidden; margin-bottom: 6px; transition: 0.3s; }
        .studio-logo { width: 38px; height: auto; filter: grayscale(100%) brightness(0.7); }
        .studio-item.active .studio-circle { border-color: #fff; background: #111; }
        .studio-item.active .studio-logo { filter: grayscale(0%) brightness(1); }
        .studio-name { font-size: 8px; font-weight: 800; color: #444; text-align: center; text-transform: uppercase; }

        /* Movie Grid */
        .movie-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5px; padding-top: 415px; padding-bottom: 110px; }
        .post-card { aspect-ratio: 2/3; background: #0a0a0a; position: relative; overflow: hidden; }
        .post-card img { width: 100%; height: 100%; object-fit: cover; transition: 0.3s; }

        /* Bottom Nav */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: #000; border-top: 1px solid #1c1c1c; display: flex; justify-content: space-around; padding: 15px 0; z-index: 200; padding-bottom: calc(15px + env(safe-area-inset-bottom)); }
        .nav-item { color: #fff; font-size: 22px; opacity: 0.4; transition: 0.3s; }
        .nav-item.active { opacity: 1; }

        /* Modal Player & Data Details */
        .modal-player { display: none; position: fixed; inset: 0; z-index: 500; background: #000; overflow-y: auto; }
        .badge { padding: 3px 8px; border-radius: 4px; font-size: 9px; font-weight: 900; text-transform: uppercase; border: 1px solid #333; color: #888; }
    </style>
</head>
<body>

    <div class="fixed-header-section">
        <header class="ig-header">
            <div class="flex justify-between items-center">
                <h1 class="ig-logo" onclick="location.reload()">amnesfubbia <span class="text-zinc-500 font-normal">animation</span></h1>
                <div class="flex gap-6 text-xl">
                    <i class="fa-regular fa-square-plus"></i>
                    <i class="fa-regular fa-heart" onclick="showLibrary('likes')"></i>
                </div>
            </div>
        </header>

        <div class="search-container">
            <i class="fa-solid fa-magnifying-glass text-zinc-600 text-xs"></i>
            <input type="text" id="searchInp" placeholder="Cari film, series, atau anime..." onkeydown="if(event.key==='Enter') searchAction()">
        </div>

        <div class="pill-container no-scrollbar">
            <button class="pill active" onclick="setFilter('type', 'multi', this)">Semua Animasi</button>
            <button class="pill" onclick="setFilter('type', 'movie', this)">Film</button>
            <button class="pill" onclick="setFilter('type', 'tv', this)">Series</button>
            <button class="pill" onclick="setFilter('type', 'short', this)">Short Movie</button>
        </div>

        <div class="filter-row">
            <div class="filter-item" onclick="openSheet('tahun')">Tahun <i class="fa-solid fa-chevron-down text-[7px]"></i></div>
            <div class="filter-item" onclick="openSheet('genre')">Genre <i class="fa-solid fa-chevron-down text-[7px]"></i></div>
            <div class="filter-item" onclick="openSheet('negara')">Negara <i class="fa-solid fa-chevron-down text-[7px]"></i></div>
        </div>

        <div class="studio-scroll no-scrollbar">
            <div class="studio-item" onclick="setStudio('2', this)">
                <div class="studio-circle"><img src="https://upload.wikimedia.org/wikipedia/commons/3/3e/Disney_logo.svg" class="studio-logo"></div>
                <div class="studio-name">Disney</div>
            </div>
            <div class="studio-item" onclick="setStudio('3', this)">
                <div class="studio-circle"><img src="https://upload.wikimedia.org/wikipedia/commons/d/d5/Pixar_Animation_Studios_Logo.svg" class="studio-logo"></div>
                <div class="studio-name">Pixar</div>
            </div>
            <div class="studio-item" onclick="setStudio('10342', this)">
                <div class="studio-circle"><img src="https://upload.wikimedia.org/wikipedia/id/0/03/Studio_Ghibli_logo.svg" class="studio-logo"></div>
                <div class="studio-name">Ghibli</div>
            </div>
            <div class="studio-item" onclick="setStudio('521', this)">
                <div class="studio-circle"><img src="https://upload.wikimedia.org/wikipedia/en/2/2a/DreamWorks_Animation_logo.svg" class="studio-logo"></div>
                <div class="studio-name">Dreamworks</div>
            </div>
            <div class="studio-item" onclick="setStudio('33', this)">
                <div class="studio-circle"><img src="https://upload.wikimedia.org/wikipedia/commons/5/5f/Illumination_Logo.svg" class="studio-logo"></div>
                <div class="studio-name">Illumination</div>
            </div>
        </div>
    </div>

    <main id="feedGrid" class="movie-grid"></main>

    <nav class="bottom-nav">
        <div class="nav-item active" onclick="location.reload()"><i class="fa-solid fa-house"></i></div>
        <div class="nav-item" onclick="document.getElementById('searchInp').focus()"><i class="fa-solid fa-magnifying-glass"></i></div>
        <div class="nav-item" onclick="showLibrary('bookmarks')"><i class="fa-regular fa-bookmark"></i></div>
        <div class="nav-item"><i class="fa-regular fa-circle-user"></i></div>
    </nav>

    <div id="movieModal" class="modal-player">
        <div class="max-w-xl mx-auto pb-20">
            <div class="p-5 border-b border-zinc-900 flex items-center sticky top-0 bg-black/90 backdrop-blur z-50">
                <i class="fa-solid fa-chevron-left text-xl" onclick="closeModal()"></i>
                <h2 id="mTitle" class="flex-grow text-center font-black text-[12px] uppercase truncate px-8 tracking-tighter"></h2>
                <i class="fa-solid fa-share-nodes text-lg"></i>
            </div>
            
            <div class="aspect-video bg-zinc-900">
                <iframe id="videoPlayer" class="w-full h-full" allow="autoplay; fullscreen" allowfullscreen></iframe>
            </div>

            <div class="p-6">
                <div class="flex items-center justify-between mb-6">
                    <div class="flex gap-6">
                        <i id="btnLikeModal" class="fa-regular fa-heart text-2xl"></i>
                        <i id="btnBookModal" class="fa-regular fa-bookmark text-2xl"></i>
                    </div>
                    <div id="mRating" class="text-yellow-500 font-black text-sm"></div>
                </div>

                <div id="mGenreList" class="flex flex-wrap gap-2 mb-6"></div>

                <p id="mDesc" class="text-sm text-zinc-400 leading-relaxed mb-6 font-medium"></p>
                
                <div class="grid grid-cols-2 gap-4 border-t border-zinc-900 pt-6">
                    <div>
                        <p class="text-[9px] font-black text-zinc-600 uppercase mb-1">Rilis</p>
                        <p id="mDate" class="text-xs font-bold text-zinc-300"></p>
                    </div>
                    <div>
                        <p class="text-[9px] font-black text-zinc-600 uppercase mb-1">Durasi</p>
                        <p id="mRuntime" class="text-xs font-bold text-zinc-300"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = 'bfa7df5310c9974f62f26c6789a8c00d';
        let currentType = 'multi', currentStudio = '', searchQuery = '';

        const getStore = (k) => JSON.parse(localStorage.getItem('anim_' + k) || '[]');
        const saveStore = (k, v) => localStorage.setItem('anim_' + k, JSON.stringify(v));

        window.onload = () => loadFeed();

        async function loadFeed() {
            const grid = document.getElementById('feedGrid');
            grid.innerHTML = '';
            let typeUrl = currentType === 'tv' ? 'tv' : 'movie';
            
            let url = `https://api.themoviedb.org/3/discover/${typeUrl}?api_key=${API_KEY}&with_genres=16&language=id-ID&sort_by=popularity.desc`;
            if (searchQuery) url = `https://api.themoviedb.org/3/search/multi?api_key=${API_KEY}&query=${searchQuery}&language=id-ID`;
            if (currentStudio) url += `&with_companies=${currentStudio}`;

            try {
                const res = await fetch(url);
                const data = await res.json();
                data.results.forEach(m => {
                    if (!m.poster_path) return;
                    const card = document.createElement('div');
                    card.className = 'post-card';
                    card.onclick = () => openModal(m.id, m.media_type || typeUrl);
                    card.innerHTML = `<img src="https://image.tmdb.org/t/p/w342${m.poster_path}" loading="lazy">`;
                    grid.appendChild(card);
                });
            } catch (e) { console.error(e); }
        }

        async function openModal(id, type) {
            document.getElementById('movieModal').style.display = 'block';
            document.body.style.overflow = 'hidden';

            try {
                const res = await fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=${API_KEY}&language=id-ID&append_to_response=videos`);
                const d = await res.json();

                // Fill Detail Data
                document.getElementById('mTitle').innerText = d.title || d.name;
                document.getElementById('mDesc').innerText = d.overview || "Sinopsis tidak tersedia dalam bahasa Indonesia.";
                document.getElementById('mRating').innerHTML = `<i class="fa-solid fa-star mr-1"></i>${d.vote_average.toFixed(1)}`;
                document.getElementById('mDate').innerText = d.release_date || d.first_air_date || '-';
                document.getElementById('mRuntime').innerText = (d.runtime || d.episode_run_time?.[0] || '0') + ' Menit';
                
                // Genre Badges
                document.getElementById('mGenreList').innerHTML = d.genres.map(g => `<span class="badge">${g.name}</span>`).join('');

                // Video
                const trailer = d.videos?.results.find(v => v.type === 'Trailer' && v.site === 'YouTube');
                document.getElementById('videoPlayer').src = trailer ? `https://www.youtube.com/embed/${trailer.key}?autoplay=1` : "";

                updateModalButtons(id);
                document.getElementById('btnLikeModal').onclick = () => toggleItem('likes', d, id);
                document.getElementById('btnBookModal').onclick = () => toggleItem('bookmarks', d, id);
            } catch (e) { console.error(e); }
        }

        function closeModal() {
            document.getElementById('movieModal').style.display = 'none';
            document.getElementById('videoPlayer').src = '';
            document.body.style.overflow = 'auto';
        }

        function toggleItem(key, data, id) {
            let items = getStore(key);
            const idx = items.findIndex(x => x.id == id);
            if(idx > -1) items.splice(idx, 1); else items.push(data);
            saveStore(key, items);
            updateModalButtons(id);
        }

        function updateModalButtons(id) {
            const isLiked = getStore('likes').some(x => x.id == id);
            const isBooked = getStore('bookmarks').some(x => x.id == id);
            document.getElementById('btnLikeModal').className = isLiked ? 'fa-solid fa-heart text-red-500 text-2xl' : 'fa-regular fa-heart text-2xl';
            document.getElementById('btnBookModal').className = isBooked ? 'fa-solid fa-bookmark text-white text-2xl' : 'fa-regular fa-bookmark text-2xl';
        }

        function setStudio(id, el) {
            document.querySelectorAll('.studio-item').forEach(s => s.classList.remove('active'));
            if(currentStudio === id) currentStudio = ''; else { currentStudio = id; el.classList.add('active'); }
            loadFeed();
        }

        function setFilter(t, v, el) {
            document.querySelectorAll('.pill').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            currentType = v; loadFeed();
        }

        function searchAction() {
            searchQuery = document.getElementById('searchInp').value;
            loadFeed();
        }

        function showLibrary(k) {
            const items = getStore(k);
            const grid = document.getElementById('feedGrid');
            grid.innerHTML = items.length ? '' : '<div class="col-span-3 text-center py-20 text-zinc-600 text-xs">KOLEKSI KOSONG</div>';
            items.forEach(m => {
                const card = document.createElement('div');
                card.className = 'post-card';
                card.onclick = () => openModal(m.id, m.media_type || 'movie');
                card.innerHTML = `<img src="https://image.tmdb.org/t/p/w342${m.poster_path}">`;
                grid.appendChild(card);
            });
        }
    </script>
</body>
</html>
