<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resep Nusantara | Lengkap</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { background: #f8f9fa; font-family: 'Plus Jakarta Sans', sans-serif; color: #333; }
        .recipe-page { position: fixed; inset: 0; background: white; z-index: 100; transform: translateX(100%); transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); overflow-y: auto; }
        .recipe-page.active { transform: translateX(0); }
        .category-pill { cursor: pointer; transition: 0.3s; border: 1px solid #e2e8f0; }
        .category-pill:hover, .category-pill.active { background: #059669; color: white; border-color: #059669; }
        .recipe-card { cursor: pointer; transition: 0.3s; background: white; border-radius: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .recipe-card:hover { transform: translateY(-5px); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        .tag { font-size: 10px; font-weight: 800; padding: 4px 8px; border-radius: 6px; text-transform: uppercase; }
    </style>
</head>
<body class="pb-10">

    <header class="p-6 bg-white border-b sticky top-0 z-50">
        <h1 class="text-2xl font-extrabold text-emerald-800">Dapur <span class="text-orange-500">Nusantara</span></h1>
        <p class="text-xs text-gray-500 font-medium">Resep Lengkap Sabang sampai Merauke</p>
    </header>

    <div class="flex gap-2 p-6 overflow-x-auto no-scrollbar bg-white shadow-sm">
        <div onclick="filterCategory('semua')" class="category-pill active px-5 py-2 rounded-full text-xs font-bold whitespace-nowrap">Semua</div>
        <div onclick="filterCategory('makanan')" class="category-pill px-5 py-2 rounded-full text-xs font-bold whitespace-nowrap">Makanan Berat</div>
        <div onclick="filterCategory('cemilan')" class="category-pill px-5 py-2 rounded-full text-xs font-bold whitespace-nowrap">Cemilan</div>
        <div onclick="filterCategory('minuman')" class="category-pill px-5 py-2 rounded-full text-xs font-bold whitespace-nowrap">Minuman</div>
    </div>

    <main class="p-6 grid grid-cols-1 md:grid-cols-2 gap-6" id="recipe-grid">
        </main>

    <div id="recipe-detail" class="recipe-page">
        <div class="sticky top-0 bg-white/90 backdrop-blur p-6 flex items-center justify-between border-b">
            <button onclick="closeDetail()" class="text-gray-800 font-bold text-sm"><i class="fa-solid fa-arrow-left mr-2"></i> Kembali</button>
            <span id="detail-category" class="tag bg-emerald-100 text-emerald-700"></span>
        </div>
        <div class="p-8 max-w-2xl mx-auto">
            <h2 id="detail-title" class="text-3xl font-black text-emerald-900 mb-2"></h2>
            <p id="detail-origin" class="text-sm text-orange-600 font-bold mb-6 italic"></p>
            
            <div class="mb-8">
                <h3 class="font-bold text-lg mb-4 border-b pb-2">Bahan-bahan:</h3>
                <ul id="detail-ingredients" class="space-y-2 text-gray-600 text-sm list-disc pl-5 leading-relaxed"></ul>
            </div>

            <div>
                <h3 class="font-bold text-lg mb-4 border-b pb-2">Cara Memasak:</h3>
                <ol id="detail-steps" class="space-y-4 text-gray-600 text-sm list-decimal pl-5 leading-relaxed"></ol>
            </div>
        </div>
    </div>

    <script>
        const recipes = [
            {
                id: 1,
                category: 'makanan',
                title: 'Rendang Daging',
                origin: 'Sumatera Barat (Padang)',
                ingredients: ['500g Daging Sapi', '1 Liter Santan Kental', '2 Batang Serai', '4 Lembar Daun Jeruk', 'Bumbu Halus: Bawang Merah, Putih, Cabai, Lengkuas, Jahe'],
                steps: ['Tumis bumbu halus hingga harum.', 'Masukkan daging, aduk hingga berubah warna.', 'Tuang santan, kecilkan api.', 'Masak sambil diaduk perlahan selama 4-5 jam hingga santan mengering dan menjadi rendang hitam.'],
                desc: 'Masakan terlezat dunia versi CNN.'
            },
            {
                id: 2,
                category: 'makanan',
                title: 'Papeda Ikan Kuah Kuning',
                origin: 'Papua / Maluku',
                ingredients: ['100g Sagu Peras', '500g Ikan Tongkol/Mubara', 'Bumbu: Kunyit, Serai, Daun Kemangi, Jeruk Nipis'],
                steps: ['Masak air hingga mendidih, siram ke sagu hingga bening dan kental (Papeda).', 'Rebus ikan dengan bumbu kuning, kemangi, dan jeruk nipis.', 'Sajikan papeda dengan menyiramkan kuah kuning ikan.'],
                desc: 'Makanan pokok khas Indonesia Timur.'
            },
            {
                id: 3,
                category: 'cemilan',
                title: 'Pisang Goreng Pasir',
                origin: 'Kalimantan / Umum',
                ingredients: ['Pisang Kepok', 'Tepung Terigu & Tepung Beras', 'Tepung Panir/Roti', 'Gula & Garam'],
                steps: ['Celupkan pisang ke adonan tepung basah.', 'Gulingkan ke tepung panir hingga rata.', 'Goreng dalam minyak panas hingga coklat keemasan.'],
                desc: 'Cemilan paling populer untuk teman kopi.'
            },
            {
                id: 4,
                category: 'minuman',
                title: 'Es Pleret',
                origin: 'Jawa Tengah (Blitar)',
                ingredients: ['Tepung Beras', 'Santan', 'Gula Merah Cair', 'Es Batu'],
                steps: ['Buat bulatan pleret dari tepung beras yang dikukus.', 'Siapkan gelas, beri gula merah.', 'Masukkan pleret, tuang santan dan es batu.'],
                desc: 'Minuman segar tradisional yang unik.'
            },
            {
                id: 5,
                category: 'cemilan',
                title: 'Cireng Salju',
                origin: 'Jawa Barat (Sunda)',
                ingredients: ['Tepung Tapioka (Aci)', 'Bawang Putih Halus', 'Daun Bawang', 'Air Panas'],
                steps: ['Campur sebagian tapioka dengan air panas hingga jadi biang.', 'Campur biang dengan sisa tapioka kering.', 'Bentuk pipih dan goreng hingga garing di luar tapi kenyal di dalam.'],
                desc: 'Jajanan kenyal yang bikin ketagihan.'
            },
            {
                id: 6,
                category: 'minuman',
                title: 'Susu Kuda Liar',
                origin: 'Nusa Tenggara Barat (Sumbawa)',
                ingredients: ['Susu Kuda Murni', 'Madu Hutan Sumbawa'],
                steps: ['Saring susu kuda mentah.', 'Campurkan dengan madu sesuai selera.', 'Minum dalam keadaan segar untuk stamina.'],
                desc: 'Minuman kesehatan legendaris dari NTB.'
            }
        ];

        function renderGrid(data) {
            const grid = document.getElementById('recipe-grid');
            grid.innerHTML = '';
            data.forEach(r => {
                grid.innerHTML += `
                    <div class="recipe-card p-6 border border-gray-100" onclick="showDetail(${r.id})">
                        <div class="flex justify-between items-start mb-4">
                            <span class="tag ${r.category === 'makanan' ? 'bg-orange-100 text-orange-600' : r.category === 'cemilan' ? 'bg-blue-100 text-blue-600' : 'bg-purple-100 text-purple-600'}">${r.category}</span>
                            <i class="fa-solid fa-utensils text-gray-200"></i>
                        </div>
                        <h3 class="text-xl font-black text-gray-800">${r.title}</h3>
                        <p class="text-[10px] font-bold text-emerald-600 uppercase mb-2">${r.origin}</p>
                        <p class="text-xs text-gray-500">${r.desc}</p>
                    </div>
                `;
            });
        }

        function filterCategory(cat) {
            // Update UI Button
            document.querySelectorAll('.category-pill').forEach(el => el.classList.remove('active'));
            event.target.classList.add('active');

            if(cat === 'semua') {
                renderGrid(recipes);
            } else {
                const filtered = recipes.filter(r => r.category === cat);
                renderGrid(filtered);
            }
        }

        function showDetail(id) {
            const recipe = recipes.find(r => r.id === id);
            document.getElementById('detail-title').innerText = recipe.title;
            document.getElementById('detail-origin').innerText = recipe.origin;
            document.getElementById('detail-category').innerText = recipe.category;
            
            const ingList = document.getElementById('detail-ingredients');
            ingList.innerHTML = '';
            recipe.ingredients.forEach(i => ingList.innerHTML += `<li>${i}</li>`);

            const stepList = document.getElementById('detail-steps');
            stepList.innerHTML = '';
            recipe.steps.forEach(s => stepList.innerHTML += `<li>${s}</li>`);

            document.getElementById('recipe-detail').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeDetail() {
            document.getElementById('recipe-detail').classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        // Jalankan saat pertama buka
        renderGrid(recipes);
    </script>
</body>
</html>
