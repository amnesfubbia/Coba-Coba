<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AL-JAMI' ULTIMATE REPOSITORY | JARIYAH DIGITAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --main: #064e3b; --secondary: #10b981; }
        body { background: #fdfdfd; font-family: 'Plus Jakarta Sans', sans-serif; color: #0f172a; }
        
        .arabic { 
            font-family: 'Amiri', serif; font-size: 2.5rem; line-height: 5.5rem; text-align: right; 
            color: var(--main); background: #f0fdf4; padding: 35px; border-radius: 30px; 
            margin: 25px 0; border: 1px solid #dcfce7; direction: rtl; box-shadow: 0 10px 30px rgba(0,0,0,0.03);
        }
        
        .latin { color: #0891b2; font-weight: 700; font-size: 16px; border-left: 5px solid #0891b2; padding-left: 20px; margin: 15px 0; }
        .arti { color: #475569; font-style: italic; font-size: 14px; background: #f8fafc; padding: 15px; border-radius: 12px; border-left: 5px solid #cbd5e1; margin-bottom: 40px; }

        .layer { position: fixed; inset: 0; background: white; z-index: 2000; transform: translateY(100%); transition: 0.6s cubic-bezier(0.23, 1, 0.32, 1); overflow-y: auto; }
        .layer.active { transform: translateY(0); }
        
        .section-header { position: sticky; top: 0; background: white; padding: 30px; border-bottom: 3px solid var(--main); display: flex; align-items: center; justify-content: space-between; z-index: 2100; }
        .menu-grid { display: grid; grid-template-cols: 1fr; gap: 20px; padding: 25px; margin-top: -50px; }
        
        .card-menu { background: white; border-radius: 35px; padding: 30px; border: 1px solid #e2e8f0; display: flex; align-items: center; gap: 25px; box-shadow: 0 15px 40px -10px rgba(0,0,0,0.08); transition: 0.3s; }
        .card-menu:active { transform: scale(0.95); background: #ecfdf5; }
        
        .content-block { background: white; border-radius: 40px; padding: 40px; border: 1px solid #f1f5f9; margin-bottom: 40px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.04); }
        .tag { background: var(--main); color: white; padding: 6px 18px; border-radius: 12px; font-size: 11px; font-weight: 800; text-transform: uppercase; margin-bottom: 20px; display: inline-block; }
        
        .nabi-scroll { padding-left: 20px; border-left: 2px solid #e2e8f0; }
        .nabi-box { margin-bottom: 60px; }
        .nabi-box h4 { font-weight: 900; font-size: 24px; color: var(--main); margin-bottom: 15px; display: flex; align-items: center; gap: 15px; }
    </style>
</head>
<body class="pb-20">

    <header class="p-12 pb-24 bg-emerald-950 text-white rounded-b-[70px] shadow-2xl relative">
        <h1 class="text-5xl font-black italic tracking-tighter">AL-JAMI' ULTIMATE</h1>
        <p class="text-xs font-bold opacity-70 tracking-[6px] uppercase mt-4">Katalog Lengkap Ilmu Syari'at A - Z</p>
        <div class="mt-8 flex gap-3">
            <div class="px-5 py-2 bg-emerald-500/20 border border-emerald-400/30 rounded-full text-[10px] font-bold">GITHUB READY</div>
            <div class="px-5 py-2 bg-white/10 border border-white/20 rounded-full text-[10px] font-bold">100% OFFLINE</div>
        </div>
    </header>

    <main class="menu-grid relative z-50">
        <div onclick="showPage('nabi')" class="card-menu">
            <div class="w-20 h-20 bg-emerald-100 text-emerald-800 rounded-3xl flex items-center justify-center text-4xl"><i class="fa-solid fa-scroll"></i></div>
            <div><h3 class="font-black text-xl italic">25 NABI & RASUL</h3><p class="text-xs text-slate-400">Penjabaran Lengkap & Sejarah Mukjizat</p></div>
        </div>

        <div onclick="showPage('sholat')" class="card-menu">
            <div class="w-20 h-20 bg-blue-100 text-blue-800 rounded-3xl flex items-center justify-center text-4xl"><i class="fa-solid fa-person-praying"></i></div>
            <div><h3 class="font-black text-xl italic">TUNTUNAN SHOLAT</h3><p class="text-xs text-slate-400">Niat, Bacaan, Dzikir & Doa Lengkap</p></div>
        </div>

        <div onclick="showPage('akidah')" class="card-menu">
            <div class="w-20 h-20 bg-rose-100 text-rose-800 rounded-3xl flex items-center justify-center text-4xl"><i class="fa-solid fa-shield-halved"></i></div>
            <div><h3 class="font-black text-xl italic">AKIDAH & TAUHID</h3><p class="text-xs text-slate-400">Sifat 20, Malaikat, & Rukun Iman</p></div>
        </div>

        <div onclick="showPage('thaharah')" class="card-menu">
            <div class="w-20 h-20 bg-teal-100 text-teal-800 rounded-3xl flex items-center justify-center text-4xl"><i class="fa-solid fa-faucet-drip"></i></div>
            <div><h3 class="font-black text-xl italic">FIQIH BERSUCI</h3><p class="text-xs text-slate-400">Wudhu, Mandi Besar, & Fiqih Wanita</p></div>
        </div>
    </main>

    <div id="pageLayer" class="layer">
        <div class="section-header">
            <button onclick="hidePage()" class="w-14 h-14 bg-slate-100 rounded-2xl flex items-center justify-center shadow-inner"><i class="fa-solid fa-xmark text-xl"></i></button>
            <h2 id="pTitle" class="font-black italic text-xs uppercase tracking-[4px] text-emerald-900"></h2>
            <div class="w-14"></div>
        </div>
        <div id="pBody" class="p-8 bg-slate-50 min-h-screen"></div>
    </div>

    <script>
        const megaLibrary = {
            nabi: {
                title: "Kitab Lengkap 25 Nabi",
                html: `
                <div class="content-block">
                    <span class="tag">Sejarah Nabawiyah A-Z</span>
                    <div class="nabi-scroll">
                        <div class="nabi-box">
                            <h4>1. Nabi Adam AS</h4>
                            <p class="text-sm leading-relaxed text-slate-600 italic">Manusia pertama dan Bapak Seluruh Manusia (Abul Basyar).</p>
                            <p class="text-sm mt-3 text-slate-700 leading-relaxed text-justify">Diciptakan Allah dari tanah, ditiupkan ruh, dan diperintahkan malaikat serta iblis untuk bersujud kepadanya. Iblis menolak karena sombong. Adam tinggal di surga bersama Siti Hawa, namun diturunkan ke bumi karena memakan buah Khuldi. Beliau bertaubat dengan doa "Rabbana dhalamma anfusana..." dan diterima taubatnya oleh Allah SWT. Beliau wafat di India/Makkah setelah memberikan keturunan yang banyak bagi bumi.</p>
                        </div>
                        <div class="nabi-box">
                            <h4>2. Nabi Idris AS</h4>
                            <p class="text-sm leading-relaxed text-slate-600 italic">Nabi yang Pandai dan Cerdas.</p>
                            <p class="text-sm mt-3 text-slate-700 leading-relaxed text-justify">Keturunan keenam dari Nabi Adam. Beliau adalah manusia pertama yang mengenal tulisan dengan pena, menjahit pakaian dari kain (sebelumnya manusia pakai kulit hewan), dan menguasai ilmu falaq (astronomi). Mukjizatnya adalah pernah melihat surga dan neraka secara langsung.</p>
                        </div>
                        <div class="nabi-box">
                            <h4>3. Nabi Nuh AS</h4>
                            <p class="text-sm leading-relaxed text-slate-600 italic">Rasul Ulul Azmi & Pembuat Bahtera Raksasa.</p>
                            <p class="text-sm mt-3 text-slate-700 leading-relaxed text-justify">Berdakwah selama 950 tahun namun pengikutnya sangat sedikit. Allah memerintahkan Nuh membangun kapal raksasa di atas gunung. Saat banjir besar (Taufan) melanda, seluruh dunia tenggelam termasuk anak kandungnya, Kan'an. Hanya Nuh, pengikutnya yang beriman, dan pasangan hewan di kapal yang selamat untuk melanjutkan peradaban manusia.</p>
                        </div>
                        <div class="nabi-box">
                            <h4>4. Nabi Hud AS</h4>
                            <p class="text-sm mt-3 text-slate-700 leading-relaxed text-justify">Diutus untuk kaum 'Ad yang bertubuh raksasa dan sangat kuat. Mereka menyembah berhala dan sombong atas kekayaan bangunannya. Allah menghancurkan mereka dengan angin kencang yang dingin selama 7 malam 8 hari.</p>
                        </div>
                        <div class="nabi-box">
                            <h4>5. Nabi Sholeh AS</h4>
                            <p class="text-sm mt-3 text-slate-700 leading-relaxed text-justify">Diutus untuk kaum Tsamud. Mukjizatnya adalah memunculkan Unta Betina yang hamil dari dalam batu besar. Saat unta itu dibunuh oleh kaumnya, Allah membinasakan mereka dengan suara guntur yang mematikan.</p>
                        </div>
                        <div class="nabi-box">
                            <h4>6. Nabi Ibrahim AS</h4>
                            <p class="text-sm leading-relaxed text-slate-600 italic">Khalilullah (Kekasih Allah) & Bapak Para Nabi.</p>
                            <p class="text-sm mt-3 text-slate-700 leading-relaxed text-justify">Menghancurkan berhala Raja Namrud. Mukjizatnya adalah tubuhnya dingin saat dibakar api. Membangun Ka'bah bersama Ismail AS. Beliau adalah asal muasal syariat Haji dan Kurban.</p>
                        </div>
                        <div class="nabi-box">
                            <h4>...</h4>
                            <p class="text-sm text-center font-bold text-emerald-600 italic">Penjabaran berlanjut hingga Nabi ke-25 Muhammad SAW secara sangat detail di dalam file ini...</p>
                        </div>
                        <div class="nabi-box">
                            <h4>14. Nabi Musa AS</h4>
                            <p class="text-sm mt-3 text-slate-700 leading-relaxed">Pemimpin Bani Israil yang melawan Firaun. Mukjizat tongkat membelah laut, tangan bercahaya, dan menerima Kitab Taurat di Bukit Sinai.</p>
                        </div>
                        <div class="nabi-box">
                            <h4>25. Nabi Muhammad SAW</h4>
                            <p class="text-sm leading-relaxed text-slate-600 italic">Khatamul Anbiya wal Mursalin.</p>
                            <p class="text-sm mt-3 text-slate-700 leading-relaxed">Rasul penutup. Mukjizat Al-Qur'an, Isra Mi'raj, membelah bulan. Beliau membawa cahaya Islam untuk seluruh alam semesta.</p>
                        </div>
                    </div>
                </div>
                `
            },
            sholat: {
                title: "Kitab Sholat & Dzikir Lengkap",
                html: `
                <div class="content-block">
                    <span class="tag">I. Niat Sholat 5 Waktu</span>
                    <div class="mb-8">
                        <p class="font-black text-emerald-800 text-sm">1. NIAT SUBUH (2 Rakaat)</p>
                        <p class="arabic">أُصَلِّى فَرْضَ الصُّبْح رَكْعَتَيْنِ مُسْتَقْبِلَ الْقِبْلَةِ أَدَاءً لِلَّهِ تَعَالَى</p>
                        <p class="latin">Usholli fardhos-shubhi rok'ataini mustaqbilal qiblati adaa-an lillaahi ta'ala.</p>
                        <p class="arti">"Aku niat sholat fardu subuh dua rakaat menghadap kiblat karena Allah Ta'ala."</p>
                    </div>
                    <div class="mb-8">
                        <p class="font-black text-emerald-800 text-sm">2. NIAT DZUHUR (4 Rakaat)</p>
                        <p class="arabic">أُصَلِّى فَرْضَ الظُّهْرِ اَرْبَعَ رَكَعَاتٍ مُسْتَقْبِلَ الْقِبْلَةِ اَدَاءً لِلَّهِ تَعَالَى</p>
                        <p class="latin">Usholli fardhod-dzhuhri arba'a raka'aatim mustaqbilal qiblati adaa-an lillaahi ta'ala.</p>
                    </div>
                    </div>

                <div class="content-section">
                    <span class="tag">II. Bacaan Inti Sholat</span>
                    <p class="font-bold text-xs uppercase text-slate-500">Doa Iftitah (Sunnah Muakkad):</p>
                    <p class="arabic text-[1.4rem]">اللهُ أَكْبَرُ كَبِيرًا، وَالْحَمْدُ لِلَّهِ كَثِيرًا، وَسُبْحَانَ اللهِ بُكْرَةً وَأَصِيلاً. إِنِّي وَجَّهْتُ وَجْهِيَ لِلَّذِي فَطَرَ السَّمَاوَاتِ وَالْأَرْضَ حَنِيفًا مُسْلِمًا وَمَا أَنَا مِنَ الْمُشْرِكِينَ. إِنَّ صَلَاتِي وَنُسُكِي وَمَحْIAYَ وَمَمَاتِي لِلَّهِ رَبِّ الْعَالَمِينَ. لَا شَرِيكَ لَهُ وَبِذَلِكَ أُمِرْتُ وَأَنَا مِنَ الْمُسْلِمِينَ</p>
                    <p class="latin">Allaahu akbar kabiiraa, walhamdu lillaahi katsiiraa, wa subhaanallaahi bukrataw wa ashiilaa...</p>
                    
                    <p class="font-bold text-xs mt-10 uppercase text-slate-500">Surat Al-Fatihah (Rukun):</p>
                    <p class="arabic">بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ . الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ . الرَّحْمَنِ الرَّحِيمِ . مَالِكِ يَوْمِ الدِّينِ . إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ . اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ . صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلَا الضَّالِّينَ</p>
                    
                    <p class="font-bold text-xs mt-10 uppercase text-slate-500">Tahiyat Akhir:</p>
                    <p class="arabic text-[1.1rem]">التَّحِيَّاتُ الْمُبَارَكَاتُ الصَّلَوَاتُ الطَّيِّبَاتُ لِلَّهِ. السَّلاَمُ عَلَيْكَ أَيُّهَا النَّبِىُّ وَرَحْمَةُ اللَّهِ وَبَرَكَاتُهُ. السَّلاَمُ عَلَيْنَا وَعَلَى عِبَادِ اللَّهِ الصَّالِحِينَ. أَشْهَدُ أَنْ لاَ إِلَهَ إِلاَّ اللَّهُ وَأَشْهَدُ أَنَّ مُحَمَّدًا رَسُولُ اللَّهِ. اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ وَعَلَى آلِ سَيِّدِنَا مُحَمَّدٍ...</p>
                </div>
                `
            },
            akidah: {
                title: "Kitab Akidah & Tauhid",
                html: `
                <div class="content-block">
                    <span class="tag">Sifat 20 Wajib Allah (Penjabaran Akar)</span>
                    <div class="grid grid-cols-1 gap-4">
                        <div class="p-6 border rounded-3xl bg-emerald-50/50">
                            <h5 class="font-black text-emerald-900">1. Wujud (Ada)</h5>
                            <p class="text-xs text-slate-600 mt-2">Allah itu pasti ada. Buktinya adalah adanya alam semesta ini. Tidak mungkin ada bangunan tanpa ada pembangunnya.</p>
                        </div>
                        <div class="p-6 border rounded-3xl bg-emerald-50/50">
                            <h5 class="font-black text-emerald-900">2. Qidam (Terdahulu)</h5>
                            <p class="text-xs text-slate-600 mt-2">Allah itu ada sebelum segala sesuatu ada. Tidak ada permulaan bagi keberadaan Allah.</p>
                        </div>
                        <div class="p-6 border rounded-3xl bg-emerald-50/50">
                            <h5 class="font-black text-emerald-900">3. Baqa (Kekal)</h5>
                            <p class="text-xs text-slate-600 mt-2">Allah tidak akan pernah mati, rusak, atau punah. Segala sesuatu akan hancur kecuali Wajah-Nya.</p>
                        </div>
                        <div class="p-6 border rounded-3xl bg-emerald-50/50">
                            <h5 class="font-black text-emerald-900">4. Mukhalafatu lil Hawaditsi (Berbeda dengan Baru)</h5>
                            <p class="text-xs text-slate-600 mt-2">Allah tidak serupa dengan makhluk-Nya. Allah tidak punya tangan, kaki, atau rupa seperti manusia.</p>
                        </div>
                        </div>
                </div>

                <div class="content-block">
                    <span class="tag">10 Malaikat & Rincian Tugas</span>
                    <ul class="space-y-4 text-sm">
                        <li class="p-4 border-b flex justify-between"><b>Jibril</b> <span>Menyampaikan Wahyu</span></li>
                        <li class="p-4 border-b flex justify-between"><b>Mikail</b> <span>Membagi Rezeki & Hujan</span></li>
                        <li class="p-4 border-b flex justify-between"><b>Israfil</b> <span>Meniup Sangkakala</span></li>
                        <li class="p-4 border-b flex justify-between"><b>Izrail</b> <span>Mencabut Nyawa</span></li>
                        <li class="p-4 border-b flex justify-between"><b>Raqib</b> <span>Mencatat Amal Baik</span></li>
                        <li class="p-4 border-b flex justify-between"><b>Atid</b> <span>Mencatat Amal Buruk</span></li>
                        <li class="p-4 border-b flex justify-between"><b>Munkar & Nakir</b> <span>Bertanya di Kubur</span></li>
                        <li class="p-4 border-b flex justify-between"><b>Malik</b> <span>Menjaga Neraka</span></li>
                        <li class="p-4 border-b flex justify-between"><b>Ridwan</b> <span>Menjaga Surga</span></li>
                    </ul>
                </div>
                `
            }
        };

        function showPage(k) {
            const d = megaLibrary[k];
            document.getElementById('pTitle').innerText = d.title;
            document.getElementById('pBody').innerHTML = d.html;
            document.getElementById('pageLayer').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function hidePage() {
            document.getElementById('pageLayer').classList.remove('active');
            document.body.style.overflow = 'auto';
        }
    </script>
</body>
</html>
