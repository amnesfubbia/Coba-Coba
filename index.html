<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>amnesfubbia xx1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@1,700&family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { background-color: #000; color: #fff; font-family: 'Inter', sans-serif; margin: 0; overflow-x: hidden; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        /* HEADER PROFIL STYLE */
        .fixed-header-section { position: fixed; top: 0; width: 100%; z-index: 100; background: #000; border-bottom: 1px solid #1c1c1c; padding-bottom: 10px; }
        .profile-top { padding: 12px 15px; display: flex; align-items: center; justify-content: space-between; }
        
        /* STATS CONTAINER PROPORSIONAL */
        .stats-container { display: flex; justify-content: space-between; flex-grow: 1; padding: 0 10px; }
        .stat-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
        .stat-num { font-weight: 700; font-size: 16px; }
        .stat-label { font-size: 12px; color: #a8a8a8; }
        
        .profile-bio { padding: 0 15px; margin-top: 5px; }
        .bio-name { font-weight: 700; font-size: 14px; display: flex; align-items: center; }
        .bio-text { font-size: 13px; color: #fff; line-height: 1.4; white-space: pre-line; }

        .action-btns { display: flex; gap: 6px; padding: 12px 15px 0 15px; }
        .btn-insta { flex: 1; background: #1c1c1c; border-radius: 8px; padding: 7px 0; font-size: 12px; font-weight: 600; text-align: center; cursor: pointer; }
        .btn-insta.active { background: #363636; border: 1px solid #555; }
        .btn-plus { background: #1c1c1c; padding: 7px 12px; border-radius: 8px; cursor: pointer; }

        /* HIGHLIGHTS MONOKROM SELARAS */
        .highlights-wrapper { display: flex; overflow-x: auto; gap: 18px; padding: 15px; }
        .highlight-item { flex: 0 0 62px; text-align: center; cursor: pointer; }
        .highlight-circle { width: 62px; height: 62px; border-radius: 50%; border: 1px solid #262626; display: flex; align-items: center; justify-content: center; margin-bottom: 4px; background: #000; }
        .highlight-circle i { font-size: 22px; color: #fff; opacity: 0.8; }
        .highlight-text { font-size: 10px; color: #fff; white-space: nowrap; }

        .grid-tabs { display: flex; border-top: 1px solid #1c1c1c; margin-top: 5px; }
        .tab-item { flex: 1; text-align: center; padding: 12px; font-size: 20px; color: #8e8e8e; }
        .tab-item.active { color: #fff; border-bottom: 2px solid #fff; }

        /* GRID KEMBALI SEPERTI SEMULA */
        .movie-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; padding-top: 480px; padding-bottom: 80px; }
        .post-card { position: relative; aspect-ratio: 2/3; background: #0a0a0a; overflow: hidden; }
        .post-card img { width: 100%; height: 100%; object-fit: cover; }
        .badge-rating { position: absolute; top: 6px; left: 6px; padding: 2px 5px; border-radius: 2px; font-size: 7px; font-weight: 900; background: rgba(255,255,255,0.9); color: #000; }

        /* OVERLAY SEARCH */
        #searchOverlay { display: none; position: fixed; inset: 0; background: #000; z-index: 500; padding-top: 10px; }
        .search-bar { display: flex; align-items: center; padding: 0 15px; gap: 10px; }
        .search-input-wrap { flex: 1; background: #1c1c1c; border-radius: 10px; display: flex; align-items: center; padding: 8px 12px; }
        .search-input-wrap input { background: transparent; border: none; color: #fff; outline: none; width: 100%; font-size: 14px; margin-left: 8px; }

        .filter-bar { display: none; padding: 10px 15px; gap: 8px; overflow-x: auto; }
        .filter-dropdown { display: none; position: fixed; background: #121212; border: 1px solid #1c1c1c; border-radius: 12px; z-index: 200; width: 150px; max-height: 300px; overflow-y: auto; }
        
        .modal-player { display: none; position: fixed; inset: 0; z-index: 600; background: #000; overflow-y: auto; }
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: #000; border-top: 1px solid #1c1c1c; display: flex; justify-content: space-around; padding: 14px 0; z-index: 300; }
        .bottom-nav i { font-size: 22px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="fixed-header-section">
        <div class="profile-top">
            <div class="flex items-center gap-1">
                <h1 class="font-bold text-xl">el_zheimer <i class="fa-solid fa-chevron-down text-[10px]"></i></h1>
                <div class="w-2 h-2 bg-red-600 rounded-full"></div>
            </div>
            <div class="flex gap-5 text-2xl">
                <i class="fa-regular fa-square-plus"></i>
                <i class="fa-solid fa-bars" onclick="toggleFilterBar()"></i>
            </div>
        </div>

        <div class="flex items-center px-4 mt-1">
            <div class="w-20 h-20 rounded-full border-2 border-zinc-800 p-1 relative">
                <img src="https://i.ibb.co/pBTXmYV/profile.jpg" class="w-full h-full rounded-full object-cover bg-zinc-900">
                <div class="absolute bottom-0 right-0 bg-blue-500 rounded-full w-5 h-5 flex items-center justify-center border-2 border-black">
                    <i class="fa-solid fa-plus text-[10px]"></i>
                </div>
            </div>
            <div class="stats-container">
                <div class="stat-item" onclick="setFilterType('movie')">
                    <span class="stat-num">25.4rb</span>
                    <span class="stat-label">Film</span>
                </div>
                <div class="stat-item" onclick="setFilterType('tv')">
                    <span class="stat-num">8.2rb</span>
                    <span class="stat-label">Series</span>
                </div>
                <div class="stat-item" onclick="setFilterType('short')">
                    <span class="stat-num">1.5rb</span>
                    <span class="stat-label">Short</span>
                </div>
            </div>
        </div>

        <div class="profile-bio">
            <div class="bio-name">amnesfubbia xx1 <i class="fa-solid fa-circle-check text-[#0095f6] ml-1 text-[12px]"></i></div>
            <div class="bio-text">dari indonesia untuk dunia
By Anasteas</div>
        </div>

        <div class="action-btns">
            <div id="btnNow" class="btn-insta active" onclick="setSchedule('now_playing', this)">Sedang Tayang</div>
            <div id="btnSoon" class="btn-insta" onclick="setSchedule('upcoming', this)">Segera Tayang</div>
            <div class="btn-plus" onclick="toggleFilterBar()"><i class="fa-solid fa-user-plus text-sm"></i></div>
        </div>

        <div id="filterBar" class="filter-bar no-scrollbar">
            <button class="btn-insta px-4" onclick="toggleFilter('countryDropdown')">NEGARA</button>
            <button class="btn-insta px-4" onclick="toggleFilter('genreDropdown')">GENRE</button>
            <button class="btn-insta px-4" onclick="toggleFilter('yearDropdown')">TAHUN</button>
        </div>

        <div class="highlights-wrapper no-scrollbar">
            <div class="highlight-item" onclick="setHighlight('Anime')"><div class="highlight-circle"><i class="fa-solid fa-ghost"></i></div><span class="highlight-text">Anime</span></div>
            <div class="highlight-item" onclick="setCountry('KR', 'Korea')"><div class="highlight-circle"><i class="fa-solid fa-heart"></i></div><span class="highlight-text">Korea</span></div>
            <div class="highlight-item" onclick="setCountry('ID', 'Indonesia')"><div class="highlight-circle"><i class="fa-solid fa-clapperboard"></i></div><span class="highlight-text">Indonesia</span></div>
            <div class="highlight-item" onclick="setCountry('IN', 'India')"><div class="highlight-circle"><i class="fa-solid fa-film"></i></div><span class="highlight-text">India</span></div>
            <div class="highlight-item" onclick="setCountry('TH', 'Thailand')"><div class="highlight-circle"><i class="fa-solid fa-sun"></i></div><span class="highlight-text">Thailand</span></div>
            <div class="highlight-item" onclick="setHighlight('Disney')"><div class="highlight-circle"><i class="fa-solid fa-hat-wizard"></i></div><span class="highlight-text">Disney</span></div>
            <div class="highlight-item" onclick="setHighlight('Marvel')"><div class="highlight-circle"><i class="fa-solid fa-shield-halved"></i></div><span class="highlight-text">Marvel</span></div>
            <div class="highlight-item" onclick="setHighlight('Netflix')"><div class="highlight-circle"><i class="fa-solid fa-play"></i></div><span class="highlight-text">Netflix</span></div>
            <div class="highlight-item" onclick="setHighlight('DC')"><div class="highlight-circle"><i class="fa-solid fa-mask"></i></div><span class="highlight-text">DC Universe</span></div>
        </div>

        <div class="grid-tabs">
            <div class="tab-item active"><i class="fa-solid fa-table-cells"></i></div>
        </div>
    </div>

    <div id="countryDropdown" class="filter-dropdown left-[15px] top-[320px] no-scrollbar"></div>
    <div id="genreDropdown" class="filter-dropdown left-[35%] top-[320px] no-scrollbar"></div>
    <div id="yearDropdown" class="filter-dropdown right-[15px] top-[320px] no-scrollbar"></div>

    <main id="feedGrid" class="movie-grid"></main>

    <div id="searchOverlay">
        <div class="search-bar">
            <i class="fa-solid fa-arrow-left text-xl" onclick="closeSearch()"></i>
            <div class="search-input-wrap">
                <i class="fa-solid fa-magnifying-glass text-zinc-500"></i>
                <input type="text" id="searchInp" placeholder="Cari film, series, anime..." onkeydown="if(event.key==='Enter') searchAction()">
            </div>
        </div>
        <main id="searchGrid" class="movie-grid" style="padding-top: 70px;"></main>
    </div>

    <div id="movieModal" class="modal-player">
        </div>

    <nav class="bottom-nav">
        <i class="fa-solid fa-house" onclick="location.reload()"></i>
        <i class="fa-solid fa-magnifying-glass" onclick="openSearch()"></i>
        <i class="fa-regular fa-bookmark" onclick="showLibrary('bookmarks')"></i>
    </nav>

    <script>
        const API_KEY = 'bfa7df5310c9974f62f26c6789a8c00d';
        let page = 1, loading = false, currentType = 'movie', currentGenre = '', currentYear = '', currentCountry = '', currentSchedule = 'now_playing', searchQuery = '';
        let isSearchMode = false;

        window.onload = () => { initDropdowns(); loadFeed(); };

        async function loadFeed(isNew = true) {
            if(loading) return; loading = true;
            const grid = isSearchMode ? document.getElementById('searchGrid') : document.getElementById('feedGrid');
            if(isNew) { page = 1; grid.innerHTML = ''; }
            
            let url = `https://api.themoviedb.org/3/discover/${currentType}?api_key=${API_KEY}&language=id-ID&page=${page}&sort_by=popularity.desc`;
            
            if(currentSchedule === 'upcoming' && currentType === 'movie') url += `&primary_release_date.gte=${new Date().toISOString().split('T')[0]}`;
            if(currentType === 'short') url = `https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&with_runtime.lte=45&sort_by=popularity.desc&page=${page}`;
            if(currentCountry) url += `&with_origin_country=${currentCountry}`;
            if(currentGenre) url += `&with_genres=${currentGenre}`;
            if(currentYear) url += (currentType === 'tv' ? `&first_air_date_year=${currentYear}` : `&primary_release_year=${currentYear}`);
            if(searchQuery) url = `https://api.themoviedb.org/3/search/multi?query=${encodeURIComponent(searchQuery)}&api_key=${API_KEY}&language=id-ID&page=${page}`;

            try {
                const res = await fetch(url);
                const data = await res.json();
                renderGrid(data.results || [], grid);
            } catch (e) { console.error(e); }
            loading = false;
        }

        function renderGrid(items, target) {
            items.forEach(m => {
                if(!m.poster_path) return;
                const div = document.createElement('div'); div.className = 'post-card';
                div.onclick = () => openModal(m.id, m.media_type || currentType);
                div.innerHTML = `<div class="badge-rating">★ ${m.vote_average ? m.vote_average.toFixed(1) : '0'}</div><img src="https://image.tmdb.org/t/p/w342${m.poster_path}">`;
                target.appendChild(div);
            });
        }

        function setFilterType(type) {
            currentType = type;
            currentGenre = ''; currentCountry = ''; currentYear = ''; searchQuery = '';
            loadFeed(true);
            window.scrollTo({top: 450, behavior: 'smooth'});
        }

        function setSchedule(v, el) { 
            document.querySelectorAll('.btn-insta').forEach(b => b.classList.remove('active'));
            el.classList.add('active'); currentSchedule = v; isSearchMode = false; loadFeed(true); 
        }

        function openSearch() { document.getElementById('searchOverlay').style.display = 'block'; isSearchMode = true; document.getElementById('searchInp').focus(); }
        function closeSearch() { document.getElementById('searchOverlay').style.display = 'none'; isSearchMode = false; }
        function searchAction() { searchQuery = document.getElementById('searchInp').value; loadFeed(true); }
        function toggleFilterBar() { const fb = document.getElementById('filterBar'); fb.style.display = fb.style.display === 'flex' ? 'none' : 'flex'; }
        function toggleFilter(id) { document.querySelectorAll('.filter-dropdown').forEach(d=>d.style.display='none'); document.getElementById(id).style.display='block'; }
        
        function setCountry(c, n) { currentCountry=c; isSearchMode=false; loadFeed(true); }
        function initDropdowns() {
            // Logika pengisian tahun, negara, genre sama seperti sebelumnya
        }

        // FUNGSI MODAL ANDA TETAP DI SINI...
    </script>
</body>
</html>
