<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AMNESFUBBIA FILM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { background-color: #050505; color: white; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; overflow-x: hidden; }

        .nav-fixed {
            position: fixed; top: 0; left: 0; right: 0;
            background: rgba(5, 5, 5, 0.95); backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.1); z-index: 50; padding: 10px 0;
        }

        #loadingBar { position: absolute; bottom: -1px; left: 0; height: 2px; background: #e11d48; width: 0; transition: width 0.3s; }

        .search-input {
            width: 100%; background: #1a1a1a; border: 1px solid #333;
            padding: 8px 35px 8px 12px; border-radius: 8px; color: white; font-size: 11px; outline: none;
        }

        .movie-grid {
            display: grid; grid-template-columns: repeat(3, 1fr);
            gap: 8px; padding: 165px 8px 80px 8px;
        }

        .card { 
            position: relative; aspect-ratio: 2/3; background: #111; 
            border-radius: 8px; overflow: hidden; border: 1px solid #222; 
            cursor: pointer; transition: all 0.3s ease; opacity: 0; transform: translateY(10px);
        }
        .card.loaded { opacity: 1; transform: translateY(0); }
        .card:active { transform: scale(0.95); border-color: #e11d48; box-shadow: 0 0 15px rgba(225, 29, 72, 0.4); }
        .card img { width: 100%; height: 100%; object-fit: cover; }

        .badge {
            position: absolute; top: 4px; left: 4px; padding: 2px 4px; border-radius: 3px;
            font-size: 7px; font-weight: 900; z-index: 10; text-transform: uppercase;
        }
        .badge-movie { background: #e11d48; }
        .badge-tv { background: #2563eb; }
        .badge-short { background: #f59e0b; color: #000; }

        .menu-scroll { display: flex; gap: 3px; overflow-x: auto; padding: 5px 0; scrollbar-width: none; }
        
        select { 
            background: #1a1a1a; color: white; border: 1px solid #333; 
            padding: 5px 2px; border-radius: 5px; font-size: 6px; 
            font-weight: 800; text-transform: uppercase; outline: none; min-width: 45px;
        }

        .history-scroll { display: flex; gap: 8px; overflow-x: auto; padding: 5px 12px; scrollbar-width: none; background: #0a0a0a; border-bottom: 1px solid #1a1a1a; }
        .hist-item { flex: 0 0 40px; aspect-ratio: 2/3; border-radius: 4px; overflow: hidden; border: 1px solid #333; }
        .hist-item img { width: 100%; height: 100%; object-fit: cover; }

        #backToTop {
            display: none; position: fixed; bottom: 20px; right: 20px;
            width: 40px; height: 40px; background: #e11d48; color: white;
            border-radius: 50%; border: none; z-index: 40; cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); font-size: 14px;
        }

        .modal { display: none; position: fixed; inset: 0; z-index: 100; background: black; overflow-y: auto; }
        .modal-box { min-height: 100vh; background: #080808; padding: 15px; padding-top: 50px; }
        
        .cast-scroll { display: flex; gap: 10px; overflow-x: auto; padding: 10px 0; scrollbar-width: none; }
        .cast-card { flex: 0 0 70px; text-align: center; cursor: pointer; }
        .cast-img { width: 65px; height: 65px; border-radius: 50%; object-fit: cover; border: 2px solid #333; margin-bottom: 5px; }
        .cast-name { font-size: 8px; font-weight: bold; line-height: 1.1; color: #ccc; }

        .btn-red { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 12px; margin-bottom: 8px; background: #e11d48; color: white; border-radius: 8px; font-size: 10px; font-weight: 800; border: none; text-decoration: none; }

        .info-page { display: none; position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); padding: 40px 20px; text-align: center; }
    </style>
</head>
<body>

    <div id="modalAbout" class="info-page" onclick="toggleAbout()">
        <div class="mt-20">
            <h2 class="text-2xl font-black italic mb-4">AMNESFUBBIA<span class="text-red-600">FILM</span></h2>
            <p class="text-xs text-gray-400 leading-relaxed">Arsip digital khusus Film, Series, dan Short Film Indonesia. Dibuat untuk memudahkan pecinta sinema lokal menemukan karya terbaik anak bangsa.</p>
            <p class="mt-10 text-[10px] text-gray-600 font-bold uppercase tracking-widest">Ketuk di mana saja untuk kembali</p>
        </div>
    </div>

    <button id="backToTop" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">
        <i class="fa-solid fa-arrow-up"></i>
    </button>

    <nav class="nav-fixed">
        <div id="loadingBar"></div>
        <div class="container mx-auto px-3">
            <div class="flex items-center gap-2 mb-3">
                <div onclick="location.reload()" class="cursor-pointer shrink-0 uppercase font-black italic text-sm">
                    AMNESFUBBIA<span class="text-red-600">FILM</span>
                </div>
                <i class="fa-solid fa-circle-info text-gray-500 text-xs cursor-pointer" onclick="toggleAbout()"></i>
                <div class="relative w-full">
                    <input type="text" id="inputCari" class="search-input" placeholder="Cari Film..." onkeyup="if(event.key==='Enter') cariFilm()">
                    <i class="fa-solid fa-magnifying-glass absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 text-[12px] cursor-pointer" onclick="cariFilm()"></i>
                </div>
            </div>
            <div class="menu-scroll">
                <select id="pilihTipe" onchange="resetLoad()">
                    <option value="multi">SEMUA</option>
                    <option value="movie">FILM</option>
                    <option value="tv">SERIES</option>
                    <option value="short">SHORT</option>
                </select>
                <select id="pilihGenre" onchange="resetLoad()">
                    <option value="">GENRE</option>
                    <option value="28">AKSI</option><option value="27">HOROR</option>
                    <option value="35">KOMEDI</option><option value="18">DRAMA</option>
                    <option value="10749">ROMANTIS</option><option value="16">ANIMASI</option>
                    <option value="10751">KELUARGA</option>
                </select>
                <select id="pilihTahun" onchange="resetLoad()">
                    <option value="">TAHUN</option>
                    <script>for(let t=2026;t>=1920;t--) document.write(`<option value="${t}">${t}</option>`);</script>
                </select>
                <select id="pilihSort" onchange="resetLoad()" class="flex-grow">
                    <option value="popularity.desc">TERPOPULER</option>
                    <option value="primary_release_date.desc">TERBARU</option>
                </select>
            </div>
        </div>
        <div id="historyBar" class="history-scroll hidden"></div>
    </nav>

    <div id="gridFilm" class="movie-grid"></div>

    <div id="modalFilm" class="modal">
        <div class="modal-box">
            <button onclick="tutupModal()" class="fixed top-4 right-4 bg-red-600 text-white w-8 h-8 rounded-full z-[110] font-bold text-xs">✕</button>
            <h1 id="jdl" class="text-base font-black uppercase">JUDUL</h1>
            <p id="inf" class="text-[9px] text-gray-500 font-bold mb-1"></p>
            <p id="gen" class="text-[9px] text-red-500 font-bold mb-4 uppercase"></p>
            
            <div class="aspect-video bg-black rounded-lg overflow-hidden mb-5 border border-white/10">
                <iframe id="layar" class="w-full h-full" allow="autoplay" allowfullscreen></iframe>
            </div>

            <p class="text-gray-500 text-[8px] font-black uppercase tracking-widest mb-1">Pemeran</p>
            <div id="castList" class="cast-scroll"></div>

            <p class="text-red-600 text-[8px] font-black uppercase tracking-widest mt-4 mb-1">Sinopsis</p>
            <p id="sinop" class="text-xs text-gray-400 italic mb-6 leading-relaxed"></p>
            
            <div id="btnStream"></div>
            <div id="btnDown" class="mt-4"></div>
        </div>
    </div>

    <script>
        const API = 'bfa7df5310c9974f62f26c6789a8c00d';
        let hal = 1; let sedangMemuat = false;
        let startY = 0;

        window.onload = () => { memuatFilm(); updateHistoryUI(); };

        window.addEventListener('touchstart', e => startY = e.touches[0].pageY);
        window.addEventListener('touchmove', e => {
            if (window.scrollY === 0 && e.touches[0].pageY > startY + 150) location.reload();
        });

        window.onscroll = () => { 
            const btt = document.getElementById('backToTop');
            if (window.scrollY > 500) btt.style.display = 'block'; else btt.style.display = 'none';
            if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 500) { if (!sedangMemuat) loadLagi(); } 
        };

        async function memuatFilm() {
            if (sedangMemuat) return; sedangMemuat = true;
            document.getElementById('loadingBar').style.width = '50%';
            const tipe = document.getElementById('pilihTipe').value;
            const genre = document.getElementById('pilihGenre').value;
            const tahun = document.getElementById('pilihTahun').value;
            const sort = document.getElementById('pilihSort').value;

            try {
                let hasilGabungan = [];
                if (tipe === "multi") {
                    const [resFilm, resTV] = await Promise.all([
                        fetch(`https://api.themoviedb.org/3/discover/movie?api_key=${API}&with_origin_country=ID&language=id-ID&page=${hal}&sort_by=${sort}${genre ? '&with_genres='+genre : ''}${tahun ? '&primary_release_year='+tahun : ''}`),
                        fetch(`https://api.themoviedb.org/3/discover/tv?api_key=${API}&with_origin_country=ID&language=id-ID&page=${hal}&sort_by=${sort}${genre ? '&with_genres='+genre : ''}${tahun ? '&first_air_date_year='+tahun : ''}`)
                    ]);
                    const dataFilm = await resFilm.json();
                    const dataTV = await resTV.json();
                    hasilGabungan = [...dataFilm.results, ...dataTV.results].sort((a, b) => b.popularity - a.popularity);
                } else {
                    let url = `https://api.themoviedb.org/3/discover/${tipe==='short'?'movie':tipe}?api_key=${API}&with_origin_country=ID&language=id-ID&page=${hal}&sort_by=${sort}`;
                    if(tipe === 'short') url += '&with_runtime.lte=45';
                    if(genre) url += `&with_genres=${genre}`;
                    if(tahun) url += (tipe === 'tv' ? `&first_air_date_year=${tahun}` : `&primary_release_year=${tahun}`);
                    const res = await fetch(url);
                    const data = await res.json();
                    hasilGabungan = data.results;
                }
                tampilkan(hasilGabungan, tipe);
            } catch (e) { console.log(e); }
            finally { 
                sedangMemuat = false; 
                document.getElementById('loadingBar').style.width = '100%';
                setTimeout(() => document.getElementById('loadingBar').style.width = '0', 300);
            }
        }

        function tampilkan(data, filterTipe) {
            const grid = document.getElementById('gridFilm');
            if(hal === 1) grid.innerHTML = '';
            data.forEach((m, index) => {
                if(!m.poster_path) return;
                const kartu = document.createElement('div');
                kartu.className = 'card';
                const tipeItem = m.title ? 'movie' : 'tv';
                let bCls = tipeItem === 'movie' ? 'badge-movie' : 'badge-tv';
                let bTxt = tipeItem === 'movie' ? 'FILM' : 'SERIES';
                if(filterTipe === 'short') { bCls = 'badge-short'; bTxt = 'SHORT'; }

                kartu.onclick = () => { saveHistory(m.id, tipeItem, m.poster_path); bukaModal(m.id, tipeItem); };
                kartu.innerHTML = `<div class="badge ${bCls}">${bTxt}</div><img src="https://image.tmdb.org/t/p/w500${m.poster_path}" loading="lazy">`;
                grid.appendChild(kartu);
                setTimeout(() => { kartu.classList.add('loaded'); }, index * 50);
            });
        }

        async function bukaModal(id, tipe) {
            document.getElementById('modalFilm').style.display = 'block';
            document.body.style.overflow = 'hidden';
            const res = await fetch(`https://api.themoviedb.org/3/${tipe}/${id}?api_key=${API}&language=id-ID&append_to_response=videos,credits`);
            const d = await res.json();
            
            let infoTambahan = (d.release_date || d.first_air_date || '').split('-')[0];
            if(tipe === 'tv') infoTambahan += ` • ${d.number_of_seasons} Season • ${d.number_of_episodes} Episode`;
            
            document.getElementById('jdl').innerText = d.title || d.name;
            document.getElementById('inf').innerText = `${infoTambahan} • ⭐ ${d.vote_average.toFixed(1)}`;
            document.getElementById('gen').innerText = d.genres.map(g => g.name).join(', ');
            document.getElementById('sinop').innerText = d.overview || "Sinopsis belum tersedia.";
            
            const video = d.videos.results.find(v => v.type === 'Trailer' && v.site === 'YouTube') || d.videos.results.find(v => v.site === 'YouTube');
            document.getElementById('layar').src = video ? `https://www.youtube.com/embed/${video.key}?autoplay=1&rel=0` : `https://vidsrc.xyz/embed/${tipe}/${id}`;
            
            const castHtml = d.credits.cast.slice(0, 12).map(c => `
                <div class="cast-card" onclick="cariFilmPemeran(${c.id}, '${c.name}')">
                    <img class="cast-img" src="${c.profile_path ? 'https://image.tmdb.org/t/p/w200'+c.profile_path : 'https://via.placeholder.com/100x100?text=👤'}">
                    <p class="cast-name">${c.name}</p>
                </div>
            `).join('');
            document.getElementById('castList').innerHTML = castHtml;

            const bH = (n, l) => `<button onclick="document.getElementById('layar').src='${l}'" class="btn-red"><span>${n}</span> <i class="fa-solid fa-play"></i></button>`;
            document.getElementById('btnStream').innerHTML = 
                bH('SERVER UTAMA', `https://vidsrc.xyz/embed/${tipe}/${id}`) + 
                bH('SERVER CADANGAN 1', `https://vidsrc.to/embed/${tipe}/${id}`) +
                bH('SERVER CADANGAN 2', `https://vidsrc.me/embed/${tipe}/${id}`);
            
            document.getElementById('btnDown').innerHTML = `<a href="https://dl.vidsrc.vip/${tipe}/${id}" target="_blank" class="btn-red"><span>DOWNLOAD VIP</span> <i class="fa-solid fa-download"></i></a>`;
        }

        async function cariFilmPemeran(pId, pName) {
            tutupModal();
            document.getElementById('inputCari').value = pName;
            document.getElementById('loadingBar').style.width = '50%';
            const res = await fetch(`https://api.themoviedb.org/3/person/${pId}/combined_credits?api_key=${API}&language=id-ID`);
            const data = await res.json();
            hal = 1;
            // PERBAIKAN: Filter hanya film Indonesia (bahasa 'id' atau asal negara 'ID')
            const hasilIndo = data.cast.filter(m => m.original_language === 'id' || (m.origin_country && m.origin_country.includes('ID')));
            tampilkan(hasilIndo, 'multi');
            window.scrollTo(0,0);
            document.getElementById('loadingBar').style.width = '100%';
            setTimeout(() => document.getElementById('loadingBar').style.width = '0', 300);
        }

        function saveHistory(id, tipe, path) {
            let hist = JSON.parse(localStorage.getItem('hist_amnes')) || [];
            hist = hist.filter(x => x.id !== id);
            hist.unshift({id, tipe, path});
            localStorage.setItem('hist_amnes', JSON.stringify(hist.slice(0, 10)));
            updateHistoryUI();
        }

        function updateHistoryUI() {
            const hist = JSON.parse(localStorage.getItem('hist_amnes')) || [];
            const bar = document.getElementById('historyBar');
            if(hist.length === 0) return;
            bar.classList.remove('hidden');
            bar.innerHTML = hist.map(x => `
                <div class="hist-item" onclick="bukaModal(${x.id}, '${x.tipe}')">
                    <img src="https://image.tmdb.org/t/p/w200${x.path}">
                </div>
            `).join('');
        }

        async function cariFilm() {
            const q = document.getElementById('inputCari').value;
            if(!q) return;
            document.getElementById('loadingBar').style.width = '50%';
            const res = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${API}&query=${q}&language=id-ID`);
            const data = await res.json();
            hal = 1;
            const hasilIndo = data.results.filter(m => m.original_language === 'id' || (m.origin_country && m.origin_country.includes('ID')));
            tampilkan(hasilIndo, 'multi');
            window.scrollTo(0,0);
            document.getElementById('loadingBar').style.width = '100%';
            setTimeout(() => document.getElementById('loadingBar').style.width = '0', 300);
        }

        function toggleAbout() {
            const about = document.getElementById('modalAbout');
            about.style.display = about.style.display === 'block' ? 'none' : 'block';
        }

        function tutupModal() { document.getElementById('modalFilm').style.display = 'none'; document.getElementById('layar').src = ''; document.body.style.overflow = 'auto'; }
        function loadLagi() { hal++; memuatFilm(); }
        function resetLoad() { hal = 1; window.scrollTo(0,0); memuatFilm(); }
    </script>
</body>
</html>
