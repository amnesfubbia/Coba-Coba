  sources:["bukhari","muslim"], related:["puasa-ramadan"], tags:["puasa","sahur"]});
addEntry({id:"berbuka", menu:1, material:"puasa", sub:"wajib", type:"article",
  title:"Berbuka Puasa", summary:"Menyegerakan berbuka saat Maghrib dan berdoa.",
  arabic:{text:"ذَهَبَ الظَّمَأُ وَابْتَلَّتِ الْعُرُوقُ وَثَبَتَ الْأَجْرُ إِنْ شَاءَ اللهُ",translit:"Dzahaba-z-zama'u wabtallatil-'uruqu wa tsabatal-ajru insya Allah",arti:"Telah hilang dahaga, urat-urat telah basah, dan pahala telah tetap, insya Allah.",audio:"",audio_src:"",source:"HR. Abu Dawud no. 2357"},
  body:[{h:"Sunnah", list:["Menyegerakan berbuka (HR. Bukhari no. 1957).","Berdoa saat berbuka; doa di atas adalah doa yang diriwayatkan.","Berbuka dengan kurma atau air."]}],
  sources:["abudawud","bukhari"], related:["puasa-ramadan","doa"], tags:["puasa","ramadan"]});
addEntry({id:"adab-ramadan", menu:1, material:"puasa", sub:"wajib", type:"article",
  title:"Adab Ramadan", summary:"Menjaga lisan, pandangan, dan perbuatan selama berpuasa.",
  body:[{h:"Adab", list:["Menjaga lisan dari dusta dan ghibah: \"Barang siapa tidak meninggalkan perkataan dusta dan perbuatannya, maka Allah tidak butuh ia meninggalkan makan dan minumnya.\" (HR. Bukhari no. 1903).","Menjaga pandangan dan pendengaran.","Memperbanyak sedekah, Al-Qur'an, dan shalat malam.","Menahan amarah; menjawab dengan tenang."]}],
  sources:["bukhari"], related:["puasa-ramadan"], tags:["puasa","adab"]});
addEntry({id:"pembatal-puasa", menu:1, material:"puasa", sub:"wajib", type:"article",
  title:"Hal yang Membatalkan Puasa", summary:"Perkara yang membatalkan puasa dan konsekuensinya.",
  body:[{h:"Pembatal", list:["Makan dan minum dengan sengaja.","Muntah dengan sengaja (HR. Abu Dawud no. 2380).","Hubungan suami istri di siang hari — konsekuensi: qadha + kafarah.","Haid dan nifas.","Keluar mani dengan sengaja (istimna').","Niat membatalkan puasa."]},
  {h:"Kafarah", p:["Untuk hubungan suami istri di siang hari Ramadan: memerdekakan budak, atau puasa dua bulan berturut-turut, atau memberi makan 60 orang miskin (HR. Bukhari no. 1936, Muslim no. 1111)."]}],
  sources:["bukhari","muslim","abudawud"], related:["puasa-ramadan","qadha-puasa"], tags:["puasa","ketentuan"]});
addEntry({id:"tidak-membatalkan", menu:1, material:"puasa", sub:"wajib", type:"article",
  title:"Hal yang Tidak Membatalkan", summary:"Perkara yang sering dikhawatirkan tetapi tidak membatalkan puasa.",
  body:[{h:"Tidak membatalkan", list:["Makan/minum karena lupa (HR. Bukhari no. 1933, Muslim no. 1155).","Tidak sengaja memasukkan air saat berkumur/istinsyaq (selama tidak berlebihan).","Berkumur atau mandi untuk mendinginkan diri.","Mimpi basah.","Muntah yang tidak disengaja.","Mencicipi makanan tanpa menelannya (dengan hati-hati; pendapat ulama)."]}],
  sources:["bukhari","muslim","fiqihsunnah"], related:["pembatal-puasa"], tags:["puasa","ketentuan"]});
addEntry({id:"puasa-sakit", menu:1, material:"puasa", sub:"wajib", type:"article",
  title:"Puasa bagi Orang Sakit", summary:"Orang sakit diberi keringanan: berbuka lalu qadha, atau fidyah sesuai keadaan.",
  body:[{h:"Ketentuan", list:["Sakit yang berat (dikhawatirkan bertambah parah): boleh berbuka dan mengqadha di hari lain.","Sakit yang tidak ada harapan sembuh (kronis): fidyah (memberi makan satu orang miskin per hari).","Dalil: QS. Al-Baqarah 2:185 — \"...barang siapa sakit atau dalam perjalanan, maka (wajib menggantinya) sebanyak hari yang ditinggalkan...\""]},
  {h:"Catatan", p:["Keputusan berbuka sebaiknya berdasarkan pertimbangan medis dan keyakinan diri; jangan menjadikan keringanan sebagai alasan untuk meninggalkan tanpa uzur."]}],
  sources:["quran","baznas"], related:["qadha-puasa","fidyah"], tags:["puasa","rukhsah"]});
addEntry({id:"puasa-musafir", menu:1, material:"puasa", sub:"wajib", type:"article",
  title:"Puasa bagi Musafir", summary:"Musafir boleh berbuka dan mengqadha; berpuasa dalam perjalanan juga dibolehkan jika mampu.",
  body:[{h:"Ketentuan", p:["QS. Al-Baqarah 2:185 memberi rukhsah. Pilihan terbaik: yang lebih memudahkan dan tetap menjaga ibadah; jika berpuasa tidak memberatkan, puasa lebih utama menurut sebagian ulama, dan sebaliknya."]}],
  sources:["quran"], related:["qadha-puasa"], tags:["puasa","rukhsah"]});
addEntry({id:"qadha-puasa", menu:1, material:"puasa", sub:"wajib", type:"article",
  title:"Qadha Puasa", summary:"Mengganti puasa Ramadan yang ditinggalkan karena uzur.",
  body:[{h:"Ketentuan", list:["Wajib mengganti sebanyak hari yang ditinggalkan.","Sebaiknya segera; boleh diakhiri hingga sebelum Ramadan berikutnya.","Jika tertunda hingga Ramadan berikutnya tanpa uzur: qadha + fidyah menurut sebagian ulama (ada perbedaan pendapat).","Perempuan yang haid/nifas: qadha tanpa fidyah."]}],
  sources:["quran","fiqihsunnah"], related:["puasa-ramadan","fidyah"], tags:["puasa","qadha"]});
addEntry({id:"fidyah", menu:1, material:"puasa", sub:"wajib", type:"article",
  title:"Fidyah", summary:"Memberi makan orang miskin sebagai pengganti puasa bagi yang tidak mampu berpuasa (lansia/sakit kronis).",
  body:[{h:"Ketentuan", list:["Satu mud (±0,75 kg) makanan pokok per hari puasa yang ditinggalkan — pendapat jumhur; sebagian menetapkan satu mud beras (BAZNAS: 1 mud = 0,6–0,7 kg / menyesuaikan).","Fidyah tidak menggugurkan puasa bagi yang mampu mengqadha."]}],
  sources:["baznas","fiqihsunnah"], related:["qadha-puasa"], tags:["puasa","fidyah"]});
addEntry({id:"itikaf", menu:1, material:"puasa", sub:"wajib", type:"article",
  title:"I'tikaf", summary:"Berdiam di masjid dengan niat mendekatkan diri kepada Allah — sunnah di sepuluh malam terakhir Ramadan.",
  body:[{h:"Ketentuan", list:["Disunnahkan terutama di 10 malam terakhir Ramadan.","Syarat: Muslim, berakal, suci dari hadats besar, di masjid.","Aktivitas: shalat, tilawah, dzikir, dan doa."]}],
  sources:["bukhari"], related:["lailatul-qadar","puasa-ramadan"], tags:["ramadan","i'tikaf"]});
addEntry({id:"lailatul-qadar", menu:1, material:"puasa", sub:"wajib", type:"article",
  title:"Lailatul Qadar", summary:"Malam kemuliaan yang lebih baik dari seribu bulan — di sepuluh malam terakhir Ramadan.",
  body:[{h:"Ketentuan", list:["QS. Al-Qadr 97:1-5: malam turunnya Al-Qur'an, \"lebih baik daripada seribu bulan\".","Rasulullah ﷺ memburu malam ini pada 10 malam terakhir, terutama malam-malam ganjil (HR. Bukhari no. 2017, Muslim no. 1169).","Amalan: shalat malam, doa, dan dzikir. Doa yang diajarkan: \"Allahumma innaka 'afuwwun tuhibbul-'afwa fa'fu 'anni.\" (HR. Tirmidzi no. 3513)."]}],
  sources:["quran","bukhari","muslim","tirmidzi"], related:["itikaf","puasa-ramadan"], tags:["ramadan","lailatul qadar"]});
addEntry({id:"idulfitri", menu:1, material:"puasa", sub:"wajib", type:"article",
  title:"Idulfitri", summary:"Hari raya setelah sebulan berpuasa — 1 Syawal, hari kemenangan dan syukur.",
  body:[{h:"Amalan", list:["Takbir sejak terbenam matahari hingga shalat Id.","Mandi, memakai pakaian terbaik, dan makan sebelum berangkat (sunah).","Shalat Id dua rakaat, khutbah, silaturahmi, dan mengeluarkan zakat fitrah sebelum shalat."]}],
  sources:["bukhari","muslim"], related:["zakat-fitrah","puasa-ramadan"], tags:["ramadan","hari raya"]});
addEntry({
  id:"puasa-sunnah", menu:1, material:"puasa", sub:"sunnah", type:"article",
  title:"Puasa Sunnah", summary:"Puasa yang dianjurkan di luar Ramadan: Senin-Kamis, Ayyamul Bidh, Arafah, Asyura, dan lainnya.",
  body:[{h:"Catatan", p:["Puasa sunnah tidak wajib; jika ditinggalkan tanpa uzur tidak berdosa, namun meninggalkannya setelah berniat sunnah disunnahkan mengqadha menurut sebagian ulama."]}],
  sources:["muslim"], related:["puasa-senin-kamis","puasa-ayyamul-bidh","puasa-arafah","puasa-asyura","puasa-syawal","puasa-daud"], tags:["puasa sunnah"]
});
addEntry({id:"puasa-senin-kamis", menu:1, material:"puasa", sub:"sunnah", type:"article", title:"Puasa Senin-Kamis", summary:"Puasa sunnah pada hari Senin dan Kamis — hari diangkatnya amal.",
  body:[{h:"Dalil", p:["Rasulullah ﷺ berpuasa Senin-Kamis; \"Amal-amal diperlihatkan pada hari Senin dan Kamis\" (HR. Tirmidzi no. 747; Muslim no. 1162)."]}],
  sources:["muslim","tirmidzi"], related:["puasa-sunnah"], tags:["puasa sunnah"]});
addEntry({id:"puasa-ayyamul-bidh", menu:1, material:"puasa", sub:"sunnah", type:"article", title:"Puasa Ayyamul Bidh", summary:"Puasa tanggal 13, 14, 15 setiap bulan Hijriah.",
  body:[{h:"Dalil", p:["Rasulullah ﷺ bersabda: \"Berpuasalah tiga hari setiap bulan; itu seperti puasa setahun.\" (HR. Bukhari no. 1979, Muslim no. 1159)."]}],
  sources:["bukhari","muslim"], related:["puasa-sunnah"], tags:["puasa sunnah"]});
addEntry({id:"puasa-arafah", menu:1, material:"puasa", sub:"sunnah", type:"article", title:"Puasa Arafah", summary:"Puasa 9 Dzulhijjah — menghapus dosa dua tahun (bagi yang tidak berhaji).",
  body:[{h:"Dalil", p:["\"Puasa Arafah menghapus dosa setahun yang lalu dan setahun yang akan datang.\" (HR. Muslim no. 1162). Jemaah haji di Arafah tidak disunnahkan berpuasa."]}],
  sources:["muslim"], related:["puasa-sunnah","wukuf"], tags:["puasa sunnah"]});
addEntry({id:"puasa-asyura", menu:1, material:"puasa", sub:"sunnah", type:"article", title:"Puasa Asyura", summary:"Puasa 10 Muharram — menghapus dosa setahun yang lalu.",
  body:[{h:"Dalil", p:["\"Puasa Asyura, aku berharap Allah menghapus dosa setahun yang lalu.\" (HR. Muslim no. 1162). Disunnahkan menambah puasa Tasu'a (9 Muharram) untuk menyelisihi kebiasaan ahlu kitab (HR. Abu Dawud no. 2445)."]}],
  sources:["muslim","abudawud"], related:["puasa-tasua","puasa-sunnah"], tags:["puasa sunnah"]});
addEntry({id:"puasa-tasua", menu:1, material:"puasa", sub:"sunnah", type:"article", title:"Puasa Tasu'a", summary:"Puasa 9 Muharram — mengiringi puasa Asyura.",
  body:[{h:"Catatan", p:["Rasulullah ﷺ bersabda: \"Jika aku masih hidup hingga tahun depan, sungguh aku akan berpuasa pada hari kesembilan (Muharram).\" (HR. Muslim no. 1134)."]}],
  sources:["muslim"], related:["puasa-asyura"], tags:["puasa sunnah"]});
addEntry({id:"puasa-syawal", menu:1, material:"puasa", sub:"sunnah", type:"article", title:"Puasa Syawal", summary:"Enam hari di bulan Syawal — seperti puasa setahun penuh.",
  body:[{h:"Dalil", p:["\"Barang siapa berpuasa Ramadan lalu diikuti enam hari Syawal, maka seperti puasa sepanjang tahun.\" (HR. Muslim no. 1164)."]}],
  sources:["muslim"], related:["puasa-sunnah","idulfitri"], tags:["puasa sunnah"]});
addEntry({id:"puasa-daud", menu:1, material:"puasa", sub:"sunnah", type:"article", title:"Puasa Daud", summary:"Puasa selang-seling — puasa yang paling dicintai Allah.",
  body:[{h:"Dalil", p:["\"Puasa yang paling dicintai Allah adalah puasa Daud; beliau berpuasa sehari dan berbuka sehari.\" (HR. Bukhari no. 1979, Muslim no. 1159)."]}],
  sources:["bukhari","muslim"], related:["puasa-sunnah"], tags:["puasa sunnah"]});

/* ========== MENU 01 · HAJI & UMRAH ========== */
addEntry({
  id:"haji", menu:1, material:"haji", type:"article",
  title:"Haji", summary:"Rukun Islam kelima — berkunjung ke Baitullah pada musim haji untuk menunaikan ibadah yang telah ditetapkan.",
  body:[
    {h:"Pengertian", p:["Haji adalah menyengaja Baitullah (Ka'bah) untuk menunaikan amalan tertentu (ihram, tawaf, sa'i, wukuf, dan lainnya) pada waktu tertentu, dengan syarat-syarat tertentu."]},
    {h:"Hukum", p:["Wajib sekali seumur hidup bagi yang mampu — QS. Ali 'Imran 3:97: \"...wajib bagi manusia (melakukan ibadah) haji ke Baitullah, yaitu bagi yang mampu mengadakan perjalanan ke sana.\""]},
    {h:"Syarat wajib", list:["Islam","Balig","Berakal","Merdeka","Mampu (biaya, keamanan, kesehatan)"]},
    {h:"Catatan", p:["Rincian rukun, wajib, sunnah, larangan, dan bacaan tersedia pada entri di bawah materi ini. Bacaan Arab menyertakan arti, transliterasi, dan sumber; audio menyusul."]}
  ],
  sources:["quran","fiqihsunnah"], related:["rukun-haji","ihram","tawaf","wukuf","umrah"], tags:["ibadah","haji","rukun islam"]
});
addEntry({id:"rukun-haji", menu:1, material:"haji", type:"article", title:"Rukun Haji", summary:"Perkara yang wajib ada dalam haji; tidak sah haji tanpa meninggalkannya.",
  body:[{h:"Rukun haji", list:["Ihram (niat haji)","Wukuf di Arafah","Tawaf ifadhah","Sa'i","Tahallul (mencukur/bergunting)","Tertib"]}],
  sources:["fiqihsunnah"], related:["haji","wukuf","tawaf"], tags:["haji","rukun"]});
addEntry({id:"syarat-haji", menu:1, material:"haji", type:"article", title:"Syarat & Wajib Haji", summary:"Syarat sah dan kewajiban yang harus ditunaikan selama haji.",
  body:[{h:"Syarat sah", list:["Islam","Berakal","Pada waktu yang ditentukan (bulan haji)","Di tempat yang ditentukan"]},
  {h:"Wajib haji", list:["Ihram dari miqat","Mabit di Muzdalifah","Mabit di Mina","Melontar jumrah","Tawaf wada' (bagi yang akan meninggalkan Makkah)","Meninggalkan larangan ihram"]}],
  sources:["fiqihsunnah"], related:["haji","miqat","mabit"], tags:["haji","ketentuan"]});
addEntry({id:"ihram", menu:1, material:"haji", type:"article", title:"Ihram", summary:"Niat masuk ibadah haji/umrah, ditandai pakaian ihram dan larangan-larangan.",
  body:[{h:"Larangan ihram", list:["Memakai wewangian","Memotong kuku/rambut","Berburu","Nikah/menikahkan","Hubungan suami istri","(laki-laki) menutup kepala dan memakai pakaian berjahit"]},
  {h:"Sunah", p:["Mandi, memakai wewangian sebelum ihram, shalat dua rakaat, lalu berniat dan bertalbiyah: \"Labbaik Allahumma labbaik...\""]}],
  sources:["fiqihsunnah"], related:["haji","miqat","larangan-ihram"], tags:["haji","ihram"]});
addEntry({id:"larangan-ihram", menu:1, material:"haji", type:"article", title:"Larangan Ihram", summary:"Perkara yang diharamkan saat berihram beserta konsekuensinya (dam/fidyah).",
  body:[{h:"Catatan", p:["Melanggar larangan ihram (selain hubungan suami istri) mengharuskan dam/fidyah sesuai ketentuan fikih; ada perbedaan rincian antar mazhab. Konsultasikan dengan pembimbing haji yang terpercaya."]}],
  sources:["fiqihsunnah"], related:["ihram","dam"], tags:["haji","larangan"]});
addEntry({id:"miqat", menu:1, material:"haji", type:"article", title:"Miqat", summary:"Batas waktu dan tempat memulai ihram.",
  body:[{h:"Miqat zamani", p:["Waktu ihram haji: bulan Syawal, Dzulqa'dah, dan 10 hari pertama Dzulhijjah."]},
  {h:"Miqat makani", list:["Dzulhulaifah (Abyar Ali) — bagi pendatang dari Madinah.","Al-Juhfah — dari arah Syam/Mesir.","Qarnul Manazil — dari arah Najd.","Yalamlam — dari arah Yaman.","Dzatu 'Irq — dari arah Irak.","Penduduk Makkah: ihram dari tempat tinggalnya."]}],
  sources:["bukhari","fiqihsunnah"], related:["ihram","haji"], tags:["haji","miqat"]});
addEntry({id:"tawaf", menu:1, material:"haji", type:"article", title:"Tawaf", summary:"Mengelilingi Ka'bah tujuh kali putaran, dimulai dari Hajar Aswad.",
  body:[{h:"Ketentuan", list:["Tujuh putaran; setiap putaran dimulai dari arah Hajar Aswad (dengan niat).","Tawaf ifadhah adalah rukun; tawaf qudum (kedatangan) dan wada' (perpisahan) sunah/wajib menurut pembagian.","Suci dari hadats adalah syarat menurut jumhur.","Doa dan dzikir dibaca selama tawaf; tidak ada bacaan khusus yang wajib dari Nabi ﷺ selain dzikir umum."]}],
  sources:["bukhari","fiqihsunnah"], related:["haji","sai","umrah"], tags:["haji","tawaf"]});
addEntry({id:"sai", menu:1, material:"haji", type:"article", title:"Sa'i", summary:"Berjalan antara Safa dan Marwah tujuh kali — mengenang usaha Hajar mencari air.",
  body:[{h:"Ketentuan", list:["Dimulai dari Safa dan diakhiri di Marwah, tujuh kali perjalanan.","Rukun haji dan umrah.","Boleh sambil berdzikir dan berdoa; berlari kecil di bagian yang disunnahkan bagi laki-laki."]}],
  sources:["bukhari","muslim"], related:["haji","tawaf"], tags:["haji","sa'i"]});
addEntry({id:"wukuf", menu:1, material:"haji", type:"article", title:"Wukuf di Arafah", summary:"Puncak ibadah haji pada 9 Dzulhijjah — haji tidak sah tanpanya.",
  body:[{h:"Ketentuan", list:["Rasulullah ﷺ bersabda: \"Haji itu (wukuf di) Arafah.\" (HR. Tirmidzi no. 889).","Waktunya sejak tergelincir matahari 9 Dzulhijjah hingga terbit fajar 10 Dzulhijjah.","Amalan: doa, dzikir, talbiyah, dan taubat."]}],
  sources:["tirmidzi","fiqihsunnah"], related:["haji","puasa-arafah"], tags:["haji","arafah"]});
addEntry({id:"mabit", menu:1, material:"haji", type:"article", title:"Mabit (Bermalam)", summary:"Bermalam di Muzdalifah dan Mina — bagian dari manasik haji.",
  body:[{h:"Mabit", list:["Muzdalifah: setelah wukuf, malam 10 Dzulhijjah, lalu mengambil kerikil untuk jumrah.","Mina: malam 11, 12, (dan 13) Dzulhijjah, untuk melontar jumrah.","Hukumnya wajib haji menurut jumhur; meninggalkannya mengharuskan dam."]}],
  sources:["fiqihsunnah"], related:["haji","wukuf"], tags:["haji","mina"]});
addEntry({id:"tahallul", menu:1, material:"haji", type:"article", title:"Tahallul", summary:"Mencukur atau menggunting rambut sebagai tanda keluar dari ihram.",
  body:[{h:"Ketentuan", list:["Tahallul awal: setelah melontar jumrah Aqabah dan bergunting — seluruh larangan ihram halal kecuali hubungan suami istri.","Tahallul tsani: setelah tawaf ifadhah dan sa'i — seluruh larangan halal."]}],
  sources:["fiqihsunnah"], related:["haji","rukun-haji"], tags:["haji","tahallul"]});
addEntry({id:"dam", menu:1, material:"haji", type:"article", title:"Dam (Denda Haji)", summary:"Sembelihan/tebusan karena meninggalkan wajib haji atau melanggar larangan ihram.",
  body:[{h:"Catatan", p:["Jenis dan kadar dam diatur fikih (urutan: menyembelih kambing, atau puasa, atau sedekah, sesuai kasus). Ada perbedaan rincian antar mazhab — ikuti bimbingan pembimbing haji dan referensi fikih yang mu'tabar."]}],
  sources:["fiqihsunnah"], related:["haji","larangan-ihram"], tags:["haji","dam"]});
addEntry({id:"umrah", menu:1, material:"haji", type:"article", title:"Umrah", summary:"Ziarah ke Baitullah dengan ihram, tawaf, sa'i, dan tahallul — dapat dilakukan kapan saja.",
  body:[{h:"Rukun umrah", list:["Ihram (niat umrah)","Tawaf","Sa'i","Tahallul","Tertib"]},
  {h:"Hukum", p:["Wajib sekali seumur hidup menurut jumhur; sebagian ulama berpendapat sunnah muakkad."]},
  {h:"Tata cara ringkas", p:["Mandi, berpakaian ihram, niat di miqat, talbiyah, masuk Makkah, tawaf tujuh putaran, shalat dua rakaat di belakang Maqam Ibrahim bila memungkinkan, sa'i, lalu tahallul."]}],
  sources:["fiqihsunnah"], related:["haji","ihram","tawaf","sai"], tags:["umrah","ibadah"]});
addEntry({id:"talbiyah", menu:1, material:"haji", type:"bacaan", title:"Talbiyah",
  arabic:{text:"لَبَّيْكَ اللَّهُمَّ لَبَّيْكَ، لَبَّيْكَ لَا شَرِيكَ لَكَ لَبَّيْكَ، إِنَّ الْحَمْدَ وَالنِّعْمَةَ لَكَ وَالْمُلْكَ، لَا شَرِيكَ لَكَ",translit:"Labbaik Allahumma labbaik. Labbaik la syarika laka labbaik. Innal-hamda wan-ni'mata laka wal-mulk. La syarika lak.",arti:"Kupenuhi panggilan-Mu ya Allah, kupenuhi panggilan-Mu. Kupenuhi panggilan-Mu, tiada sekutu bagi-Mu, kupenuhi panggilan-Mu. Sesungguhnya segala puji, nikmat, dan kerajaan adalah milik-Mu; tiada sekutu bagi-Mu.",audio:"",audio_src:"",source:"HR. Bukhari no. 1549, Muslim no. 1184"},
  body:[{h:"Keterangan", p:["Dibaca sejak ihram hingga sebelum melontar jumrah Aqabah pada 10 Dzulhijjah; disunnahkan bersuara bagi laki-laki."]}],
  sources:["bukhari","muslim"], related:["ihram","haji"], tags:["haji","bacaan"]});

/* ========== MENU 02 — RUKUN IMAN ========== */
addEntry({
  id:"iman", menu:2, material:"iman-kepada-allah", type:"article",
  title:"Rukun Iman", summary:"Enam perkara yang wajib diyakini: Allah, malaikat, kitab, rasul, hari akhir, qada dan qadar.",
  body:[{h:"Enam rukun", list:["Iman kepada Allah","Iman kepada malaikat-malaikat-Nya","Iman kepada kitab-kitab-Nya","Iman kepada rasul-rasul-Nya","Iman kepada hari akhir","Iman kepada qada dan qadar"]},
  {h:"Dalil", p:["Hadis Jibril: \"...iman adalah engkau beriman kepada Allah, malaikat-malaikat-Nya, kitab-kitab-Nya, rasul-rasul-Nya, hari akhir, dan beriman kepada takdir baik dan buruk.\" (HR. Muslim no. 8)."]}],
  sources:["muslim"], related:["iman-kepada-allah","iman-kepada-malaikat","iman-kepada-kitab","iman-kepada-rasul","iman-kepada-hari-akhir","iman-kepada-qada-qadar"], tags:["akidah","rukun iman"]
});
addEntry({
  id:"iman-kepada-allah", menu:2, material:"iman-kepada-allah", type:"article",
  title:"Iman kepada Allah", summary:"Meyakini keberadaan, keesaan, dan kesempurnaan Allah; mencakup tauhid rububiyah, uluhiyah, dan asma wa sifat.",
  body:[
    {h:"Pengertian", p:["Iman kepada Allah adalah membenarkan dengan hati, mengucapkan dengan lisan, dan mengamalkan dengan anggota tubuh bahwa Allah Maha Esa, satu-satunya Rabb, satu-satunya sesembahan, dan memiliki nama serta sifat yang sempurna."]},

  sources:["fiqihsunnah"], related:["fiqih-muamalah"], tags:["fiqih","muamalah"]});
addEntry({id:"akad", menu:5, material:"fiqih-muamalah", type:"article", title:"Akad", summary:"Ikatan antara dua pihak yang menimbulkan hak dan kewajiban.",
  body:[{h:"Jenis", list:["Akad jual beli (bai'), sewa (ijarah), kerja sama (syirkah/mudharabah), bagi hasil (muzara'ah), dan lainnya.","Akad harus memenuhi rukun dan syarat; akad yang mengandung riba/gharar/maisir tidak sah."]}],
  sources:["fiqihsunnah"], related:["fiqih-muamalah","jual-beli"], tags:["fiqih","muamalah"]});
addEntry({id:"transaksi-digital", menu:5, material:"fiqih-muamalah", type:"article", title:"Transaksi Digital & E-Commerce", summary:"Penerapan hukum jual beli pada platform digital: marketplace, e-wallet, fintech.",
  body:[{h:"Catatan", p:["Prinsip muamalah berlaku sama: objek jelas, bebas riba, dan tidak gharar. Transaksi online sah selama memenuhi rukun dan syarat. Perbedaan pendapat muncul pada kasus seperti jual beli mata uang digital dan skema tertentu — perlu kajian fiqih kontemporer dan fatwa lembaga."]}],
  sources:["fiqihsunnah","app"], related:["fiqih-muamalah","fiqih-kontemporer","riba"], tags:["fiqih","digital"]});
addEntry({id:"fiqih-ekonomi", menu:5, material:"fiqih-muamalah", type:"article", title:"Fiqih Ekonomi", summary:"Kaidah ekonomi Islam: harta, kepemilikan, distribusi, dan konsumsi.",
  body:[{h:"Prinsip", list:["Harta adalah amanah Allah.","Kepemilikan diperoleh dengan cara halal.","Distribusi adil: zakat, infak, sedekah, waris.","Konsumsi halal dan thayyib, tidak berlebih-lebihan."]}],
  sources:["quran","fiqihsunnah"], related:["fiqih-muamalah","zakat"], tags:["fiqih","ekonomi"]});
addEntry({id:"fiqih-keluarga", menu:5, material:"fiqih-keluarga", type:"article", title:"Fiqih Keluarga", summary:"Hukum pernikahan dan rumah tangga: khitbah, akad, mahar, nafkah, talak, waris.",
  body:[{h:"Catatan", p:["Isi yang dahulu direncanakan sebagai menu \"Keluarga & Kehidupan\" berada di sini. Aspek akhlak keluarga ditautkan ke Akhlak, Adab & Tazkiyah."]}],
  sources:["quran","fiqihsunnah"], related:["pernikahan","khitbah","mahar","nafkah","talak","waris"], tags:["fiqih","keluarga"]});
addEntry({id:"pernikahan", menu:5, material:"fiqih-keluarga", type:"article", title:"Pernikahan", summary:"Akad yang menghalalkan hubungan suami istri — sunnah dan bagian dari fitrah.",
  body:[{h:"Hukum", p:["Sunnah muakkad bagi yang mampu; dapat menjadi wajib bila khawatir terjerumus zina. \"Wahai para pemuda, barang siapa mampu menikah, menikahlah...\" (HR. Bukhari no. 5066, Muslim no. 1400)."]}],
  sources:["bukhari","muslim","fiqihsunnah"], related:["khitbah","akad-nikah","mahar","nafkah"], tags:["fiqih","keluarga"]});
addEntry({id:"khitbah", menu:5, material:"fiqih-keluarga", type:"article", title:"Khitbah (Lamaran)", summary:"Permintaan resmi untuk menikahi seorang wanita.",
  body:[{h:"Ketentuan", list:["Dibolehkan melihat yang biasa tampak (wajah, telapak tangan) dengan niat menikah (HR. Tirmidzi no. 1087).","Khitbah tidak mengubah status hukum: tetap ajnabiyah hingga akad.","Khitbah kepada yang telah dikhitbah orang lain (dan diterima) tidak dibolehkan (HR. Bukhari no. 5142)."]}],
  sources:["bukhari","tirmidzi","fiqihsunnah"], related:["pernikahan","akad-nikah"], tags:["fiqih","keluarga"]});
addEntry({id:"akad-nikah", menu:5, material:"fiqih-keluarga", type:"article", title:"Akad Nikah", summary:"Ijab kabul yang mengikat pernikahan.",
  body:[{h:"Rukun", list:["Calon suami dan istri","Wali","Dua saksi","Ijab dan kabul","Mahar"]},
  {h:"Syarat saksi", p:["Dua saksi laki-laki yang adil (menurut jumhur). \"Tidak sah pernikahan kecuali dengan wali dan dua saksi yang adil.\" (HR. Ibnu Hibban; derajatnya diperselisihkan — rujuk kitab fiqih)."]}],
  sources:["fiqihsunnah"], related:["pernikahan","mahar"], tags:["fiqih","keluarga"]});
addEntry({id:"mahar", menu:5, material:"fiqih-keluarga", type:"article", title:"Mahar", summary:"Pemberian suami kepada istri sebagai bagian dari akad — hak penuh istri.",
  body:[{h:"Ketentuan", list:["Wajib disebut/ditetapkan; boleh berupa uang, barang, atau manfaat yang halal.","Tidak ada batas minimal maksimal yang disepakati — \"...berikanlah maskawin kepada wanita sebagai pemberian dengan penuh kerelaan.\" (QS. An-Nisa' 4:4).","Disunnahkan tidak memberatkan."]}],
  sources:["quran","fiqihsunnah"], related:["akad-nikah","pernikahan"], tags:["fiqih","keluarga"]});
addEntry({id:"nafkah", menu:5, material:"fiqih-keluarga", type:"article", title:"Nafkah", summary:"Kewajiban suami memberi nafkah kepada istri dan anak sesuai kemampuan.",
  body:[{h:"Dalil", p:["\"...dan kewajiban ayah memberi makan dan pakaian kepada para ibu dengan cara yang ma'ruf.\" (QS. Al-Baqarah 2:233). Nafkah mencakup makan, pakaian, tempat tinggal, dan kebutuhan pokok."]}],
  sources:["quran","fiqihsunnah"], related:["pernikahan"], tags:["fiqih","keluarga"]});
addEntry({id:"talak", menu:5, material:"fiqih-keluarga", type:"article", title:"Talak & Rujuk", summary:"Perceraian — perkara halal yang paling dibenci Allah; rujuk adalah kembali dalam masa iddah.",
  body:[{h:"Ketentuan", list:["Talak dijatuhkan suami; diatur dengan ketentuan (talak satu/dua dapat rujuk dalam iddah; talak tiga tidak dapat rujuk kecuali dengan ketentuan).","Rujuk: mengembalikan ikatan pernikahan selama masa iddah tanpa akad baru.","Perceraian hendaknya menjadi jalan terakhir setelah upaya damai (hakam) — QS. An-Nisa' 4:35."]}],
  sources:["quran","fiqihsunnah"], related:["fiqih-keluarga","pernikahan"], tags:["fiqih","keluarga"]});
addEntry({id:"waris", menu:5, material:"fiqih-keluarga", type:"article", title:"Ilmu Waris (Faraidh)", summary:"Pembagian harta peninggalan sesuai ketentuan Al-Qur'an.",
  body:[{h:"Catatan", p:["Bagian ahli waris telah ditetapkan (QS. An-Nisa' 4:11-12). Ilmu faraidh memiliki kaidah rinci; untuk kasus konkret gunakan penghitungan bersama ahli/lembaga yang kompeten."]}],
  sources:["quran"], related:["fiqih-keluarga"], tags:["fiqih","waris"]});
addEntry({id:"ushul-fiqih", menu:5, material:"ushul-fiqih", type:"article", title:"Ushul Fiqih", summary:"Metodologi penggalian hukum dari dalil: Al-Qur'an, sunnah, ijma', qiyas, dan dalil lain.",
  body:[{h:"Cakupan", list:["Dalil hukum: Al-Qur'an, sunnah, ijma', qiyas.","Dalil ikhtilafi: maslahah mursalah, 'urf, istihsan, istishab, saddudz-dzari'ah.","Ijtihad dan taqlid."]}],

addEntry({id:"dalil-hukum", menu:5, material:"ushul-fiqih", type:"article", title:"Dalil-Dalil Hukum", summary:"Hierarki dalil dalam istinbath hukum.",
  body:[{h:"Urutan", list:["Al-Qur'an","Sunnah yang sahih","Ijma'","Qiyas","Dalil lain yang diperselisihkan (maslahah, 'urf, istihsan, dsb.)"]}],

addEntry({id:"qiyas", menu:5, material:"ushul-fiqih", type:"article", title:"Qiyas", summary:"Menyamakan kasus yang tidak ada nash-nya dengan kasus yang ada nash-nya karena kesamaan illat.",

addEntry({id:"ijtihad", menu:5, material:"ushul-fiqih", type:"article", title:"Ijtihad", summary:"Pengerahan kemampuan untuk menetapkan hukum dari dalil oleh yang memenuhi syarat.",

  sources:["bukhari","muslim"], related:["ushul-fiqih"], tags:["fiqih","ushul"]});
addEntry({id:"maslahah", menu:5, material:"ushul-fiqih", type:"article", title:"Maslahah Mursalah", summary:"Kemaslahatan yang tidak ditunjuk langsung oleh nash dan tidak dibatalkan nash — dipakai sebagian ulama sebagai dalil.",
  body:[{h:"Catatan", p:["Dipakai dengan syarat ketat oleh mazhab Maliki dan sebagian ulama; ditolak sebagian ulama lain. Contoh klasik: pengumpulan Al-Qur'an dalam satu mushaf."]}],
  sources:["app"], related:["ushul-fiqih","maqashid-syariah"], tags:["fiqih","ushul"]});
addEntry({id:"urf", menu:5, material:"ushul-fiqih", type:"article", title:"'Urf", summary:"Kebiasaan masyarakat yang tidak bertentangan dengan syariat — dapat menjadi pertimbangan hukum.",

addEntry({id:"istihsan", menu:5, material:"ushul-fiqih", type:"article", title:"Istihsan", summary:"Berpaling dari qiyas jali kepada hukum yang lebih sesuai maslahat — dalil yang dipakai mazhab Hanafi dan Maliki.",

addEntry({id:"kaidah-fiqih", menu:5, material:"kaidah-fiqih", type:"article", title:"Kaidah Fiqih", summary:"Prinsip umum yang merangkum banyak hukum cabang (qawa'id fiqhiyyah).",

addEntry({id:"kaidah-masyaqqah", menu:5, material:"kaidah-fiqih", type:"article", title:"Kaidah: Al-Masyaqqatu Tajlibut-Taysir", summary:"Kesulitan mendatangkan kemudahan — dasar rukhsah.",

addEntry({id:"kaidah-dharar", menu:5, material:"kaidah-fiqih", type:"article", title:"Kaidah: La Dharara wa La Dhirar", summary:"Tidak boleh membahayakan diri/orang lain dan tidak membalas bahaya dengan bahaya.",

addEntry({id:"maqashid-syariah", menu:5, material:"maqashid", type:"article", title:"Maqashid Syariah", summary:"Tujuan-tujuan syariat: menjaga agama, jiwa, akal, keturunan, dan harta.",

addEntry({
  id:"doa", menu:6, material:"doa", type:"article",
  title:"Doa", summary:"Permohonan hamba kepada Allah — inti ibadah, dianjurkan dalam segala keadaan.",
  body:[{h:"Adab berdoa", list:["Memuji Allah dan bershalawat sebelum berdoa.","Khusyuk, yakin, dan tidak tergesa-gesa.","Berdoa dengan suara lembut dan penuh harap.","Menghadirkan hati dan mengulang permohonan.","Berdoa dalam keadaan suci dan menghadap kiblat bila memungkinkan."]},
  {h:"Kategori", p:["Doa harian (makan, tidur, rumah, perjalanan, belajar), doa perlindungan, doa keluarga, doa kesulitan, dan lainnya — masing-masing sebagai entri di bawah materi ini."]}],
  sources:["quran","muslim"], related:["doa-bangun-tidur","doa-sebelum-makan","sayyidul-istighfar","dzikir"], tags:["doa","ibadah"]
});
const DOAS = [
  {id:"doa-bangun-tidur", ar:"الْحَمْدُ لِلَّهِ الَّذِي أَحْيَانَا بَعْدَ مَا أَمَاتَنَا وَإِلَيْهِ النُّشُورُ", tr:"Alhamdulillahil-ladzi ahyana ba'da ma amatana wa ilaihin-nusyur", arti:"Segala puji bagi Allah yang menghidupkan kami setelah mematikan kami, dan kepada-Nya kami dibangkitkan.", src:"HR. Bukhari no. 6312", kat:"Doa Harian"},
  {id:"doa-sebelum-tidur", ar:"بِاسْمِكَ اللَّهُمَّ أَمُوتُ وَأَحْيَا", tr:"Bismika Allahumma amutu wa ahya", arti:"Dengan nama-Mu ya Allah, aku mati dan aku hidup.", src:"HR. Bukhari no. 6324", kat:"Doa Harian"},
  {id:"doa-sebelum-makan", ar:"بِسْمِ اللَّهِ", tr:"Bismillah", arti:"Dengan nama Allah.", src:"HR. Bukhari no. 5376; jika lupa: \"Bismillahi awwalahu wa akhirahu\" (HR. Abu Dawud no. 3767)", kat:"Doa Harian"},
  {id:"doa-sesudah-makan", ar:"الْحَمْدُ لِلَّهِ الَّذِي أَطْعَمَنَا وَسَقَانَا وَجَعَلَنَا مُسْلِمِينَ", tr:"Alhamdulillahil-ladzi ath'amana wa saqana wa ja'alana muslimin", arti:"Segala puji bagi Allah yang memberi kami makan dan minum serta menjadikan kami muslim.", src:"HR. Abu Dawud no. 3850", kat:"Doa Harian"},
  {id:"doa-masuk-rumah", ar:"بِسْمِ اللَّهِ وَلَجْنَا وَبِسْمِ اللَّهِ خَرَجْنَا وَعَلَى اللَّهِ رَبِّنَا تَوَكَّلْنَا", tr:"Bismillahi walajna wa bismillahi kharajna wa 'alallahi rabbina tawakkalna", arti:"Dengan nama Allah kami masuk, dengan nama Allah kami keluar, dan kepada Allah Tuhan kami kami bertawakal.", src:"HR. Abu Dawud no. 5096", kat:"Doa Harian"},
  {id:"doa-keluar-rumah", ar:"بِسْمِ اللَّهِ تَوَكَّلْتُ عَلَى اللَّهِ، وَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ", tr:"Bismillahi tawakkaltu 'alallah, wa la haula wa la quwwata illa billah", arti:"Dengan nama Allah aku bertawakal kepada Allah; tiada daya dan kekuatan kecuali dengan Allah.", src:"HR. Abu Dawud no. 5095, Tirmidzi no. 3426", kat:"Doa Harian"},
  {id:"doa-perjalanan", ar:"سُبْحَانَ الَّذِي سَخَّرَ لَنَا هَٰذَا وَمَا كُنَّا لَهُ مُقْرِنِينَ وَإِنَّا إِلَى رَبِّنَا لَمُنْقَلِبُونَ", tr:"Subhanal-ladzi sakhkhara lana hadza wa ma kunna lahu muqrinin, wa inna ila rabbina lamunqalibun", arti:"Mahasuci Allah yang menundukkan kendaraan ini bagi kami, padahal kami tidak mampu menundukkannya, dan sesungguhnya kami akan kembali kepada Tuhan kami.", src:"QS. Az-Zukhruf 43:13-14", kat:"Perjalanan"},
  {id:"doa-kedua-orangtua", ar:"رَبِّ ارْحَمْهُمَا كَمَا رَبَّيَانِي صَغِيرًا", tr:"Rabbir-hamhuma kama rabbayani shaghira", arti:"Wahai Tuhanku, sayangilah keduanya sebagaimana mereka menyayangiku di waktu kecil.", src:"QS. Al-Isra' 17:24", kat:"Keluarga"},
  {id:"doa-meminta-ilmu", ar:"رَبِّ زِدْنِي عِلْمًا", tr:"Rabbi zidni 'ilma", arti:"Wahai Tuhanku, tambahkanlah ilmu kepadaku.", src:"QS. Thaha 20:114", kat:"Belajar"},
  {id:"sayyidul-istighfar", ar:"اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ بِذَنْبِي، فَاغْفِرْ لِي فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ", tr:"Allahumma anta Rabbi la ilaha illa anta, khalaqtani wa ana 'abduka, wa ana 'ala 'ahdika wa wa'dika mastatha'tu. A'udzu bika min syarri ma shana'tu. Abu'u laka bini'matika 'alayya, wa abu'u bidzanbi, faghfir li fa innahu la yaghfirudz-dzunuba illa anta", arti:"Ya Allah, Engkau Tuhanku, tiada tuhan selain Engkau. Engkau menciptakanku dan aku hamba-Mu, dan aku di atas perjanjian dan janji-Mu semampuku. Aku berlindung kepada-Mu dari kejahatan yang kuperbuat. Aku mengakui nikmat-Mu atasku dan aku mengakui dosaku, maka ampunilah aku — sesungguhnya tiada yang mengampuni dosa kecuali Engkau.", src:"HR. Bukhari no. 6306", kat:"Perlindungan & Taubat"}

addEntry({id:"adab-orangtua", menu:7, material:"adab", type:"article", title:"Adab kepada Orang Tua", summary:"Berbakti (birrul walidain) — amal paling utama setelah shalat.",

addEntry({id:"adab-belajar", menu:7, material:"adab", type:"article", title:"Adab Belajar", summary:"Adab penuntut ilmu: niat ikhlas, menghormati guru, dan bersungguh-sungguh.",

addEntry({

  title:"Sirah Nabi Muhammad ﷺ", summary:"Perjalanan hidup Rasulullah ﷺ — teladan dalam seluruh aspek kehidupan.",
  body:[{h:"Pengertian", p:["Sirah adalah perjalanan hidup Nabi Muhammad ﷺ: kelahiran, masa kecil, kerasulan, dakwah, hijrah, hingga wafat. Mempelajarinya menumbuhkan kecintaan dan teladan (QS. Al-Ahzab 33:21)."]},
  {h:"Cakupan", p:["Kelahiran, masa kecil & muda, pernikahan, awal wahyu, dakwah Makkah, hijrah, peristiwa penting, Fathu Makkah, Haji Wada', dan wafat — masing-masing sebagai entri di bawah materi ini."]}],
  sources:["quran","sirah"], related:["kelahiran-nabi","awal-wahyu","hijrah","fathu-makkah","haji-wada","nabi-muhammad"], tags:["sirah","sejarah"]
});
addEntry({id:"kelahiran-nabi", menu:8, material:"sirah-nabi", type:"article", title:"Kelahiran Nabi Muhammad ﷺ", summary:"Lahir di Makkah pada Tahun Gajah (±570 M), yatim sejak kecil.",
  body:[{h:"Ringkasan", list:["Lahir di Makkah, Tahun Gajah (± 570 M; tanggal pastinya diperselisihkan — pendapat masyhur 12 Rabiul Awal, ada pendapat lain).","Ayah: Abdullah bin Abdul Muththalib (wafat sebelum beliau lahir/saat ibunya hamil).","Ibu: Aminah binti Wahb (wafat saat beliau berusia ±6 tahun).","Disusui Halimah as-Sa'diyah; diasuh kakek Abdul Muththalib, lalu paman Abu Thalib."]}],
  sources:["sirah"], related:["sirah","masa-kecil-nabi","nabi-muhammad"], tags:["sirah","nabi"]});
addEntry({id:"masa-kecil-nabi", menu:8, material:"sirah-nabi", type:"article", title:"Masa Kecil & Muda", summary:"Tumbuh sebagai anak jujur dan terpercaya; dikenal Al-Amin.",
  body:[{h:"Ringkasan", list:["Masa kecil di Bani Sa'd (Badui) dan Makkah.","Menggembala kambing (HR. Bukhari no. 3402).","Membantu paman berdagang; dikenal jujur (Al-Amin) dan amanah.","Mengikuti perjanjian Hilful Fudhul — membela yang dizalimi."]}],
  sources:["bukhari","sirah"], related:["sirah","pernikahan-nabi"], tags:["sirah","nabi"]});
addEntry({id:"pernikahan-nabi", menu:8, material:"sirah-nabi", type:"article", title:"Pernikahan dengan Khadijah", summary:"Menikah dengan Khadijah binti Khuwailid pada usia 25 tahun.",
  body:[{h:"Ringkasan", p:["Khadijah adalah wanita pertama yang dinikahi Nabi ﷺ, pendukung pertama dakwah, dan ibu bagi anak-anak beliau (selain Ibrahim). Beliau tidak menikah lagi selama Khadijah hidup."]}],
  sources:["sirah"], related:["sirah","khadijah","awal-wahyu"], tags:["sirah","keluarga"]});
addEntry({id:"awal-wahyu", menu:8, material:"sirah-nabi", type:"article", title:"Awal Wahyu", summary:"Wahyu pertama turun di Gua Hira: QS. Al-'Alaq 96:1-5.",
  body:[{h:"Ringkasan", list:["Usia ±40 tahun, beliau menyendiri di Gua Hira.","Malaikat Jibril datang dan menyampaikan \"Iqra'...\" (QS. Al-'Alaq 96:1-5).","Khadijah menenangkan dan membawa beliau kepada Waraqah bin Naufal.","Setelah fatrah (masa terhenti wahyu), wahyu turun kembali dan dakwah dimulai."]}],
  sources:["bukhari","sirah"], related:["sirah","dakwah-makkah","khadijah"], tags:["sirah","wahyu"]});
addEntry({id:"dakwah-makkah", menu:8, material:"sirah-nabi", type:"article", title:"Dakwah Periode Makkah", summary:"Dakwah sembunyi-sembunyi lalu terang-terangan; penuh ujian dan kesabaran.",
  body:[{h:"Ringkasan", list:["Tiga tahun pertama dakwah sembunyi-sembunyi.","Lalu dakwah terang-terangan: \"Maka sampaikanlah apa yang diperintahkan kepadamu...\" (QS. Al-Hijr 15:94).","Boikot, penyiksaan, dan hijrah ke Habasyah bagi sebagian sahabat.","Tahun duka: wafat Abu Thalib dan Khadijah.","Isra' Mi'raj terjadi pada periode ini."]}],
  sources:["quran","sirah"], related:["sirah","awal-wahyu","hijrah"], tags:["sirah","dakwah"]});
addEntry({id:"hijrah", menu:8, material:"sirah-nabi", type:"article", title:"Hijrah ke Madinah", summary:"Perpindahan ke Yatsrib (Madinah) pada tahun 622 M — awal kalender Hijriah.",
  body:[{h:"Ringkasan", list:["Bai'at Aqabah dan undangan penduduk Yatsrib.","Nabi ﷺ hijrah bersama Abu Bakar; bersembunyi di Gua Tsur (QS. At-Taubah 9:40).","Tiba di Quba, membangun masjid; lalu mempersaudarakan Muhajirin dan Anshar.","Peristiwa ini menjadi titik awal penanggalan Hijriah pada masa Umar."]}],
  sources:["quran","sirah"], related:["sirah","abu-bakar","islam-nusantara"], tags:["sirah","hijrah"]});
addEntry({id:"fathu-makkah", menu:8, material:"sirah-nabi", type:"article", title:"Fathu Makkah", summary:"Pembebasan Makkah pada 20 Ramadan 8 H tanpa pertumpahan darah besar.",
  body:[{h:"Ringkasan", list:["Setelah perjanjian Hudaibiyah dilanggar, kaum Muslimin memasuki Makkah.","Rasulullah ﷺ memaafkan penduduk Makkah: \"Pergilah, kalian bebas.\"","Penghancuran berhala di sekitar Ka'bah dan penetapan Makkah sebagai kota suci."]}],
  sources:["sirah"], related:["sirah","haji-wada"], tags:["sirah","makkah"]});
addEntry({id:"haji-wada", menu:8, material:"sirah-nabi", type:"article", title:"Haji Wada'", summary:"Haji terakhir Rasulullah ﷺ pada 10 H — khutbah yang sarat wasiat.",
  body:[{h:"Ringkasan", list:["Beliau berhaji pada 10 H dan berkhutbah di Arafah (khutbah wada').","Wasiat: menjaga darah dan harta, hak wanita, dan berpegang pada Al-Qur'an dan sunnah.","Turun ayat penyempurnaan agama (QS. Al-Ma'idah 5:3)."]}],
  sources:["bukhari","muslim"], related:["sirah","wafat-nabi","haji"], tags:["sirah","haji"]});
addEntry({id:"wafat-nabi", menu:8, material:"sirah-nabi", type:"article", title:"Wafat Rasulullah ﷺ", summary:"Wafat di Madinah pada 12 Rabiul Awal 11 H (± 8 Juni 632 M).",
  body:[{h:"Ringkasan", list:["Setelah sakit beberapa hari, Rasulullah ﷺ wafat di rumah Aisyah.","Beliau dimakamkan di kamar tersebut, kini di dalam Masjid Nabawi.","Abu Bakar menenangkan umat: \"Barang siapa menyembah Muhammad, maka Muhammad telah wafat; barang siapa menyembah Allah, maka Allah Maha Hidup tidak mati.\" (HR. Bukhari no. 1241)."]}],
  sources:["bukhari","sirah"], related:["sirah","abu-bakar","haji-wada"], tags:["sirah","nabi"]});
addEntry({id:"khulafaur-rasyidin", menu:8, material:"sahabat", type:"article", title:"Khulafaur Rasyidin", summary:"Empat khalifah petunjuk: Abu Bakar, Umar, Utsman, Ali — masa 11–40 H.",
  body:[{h:"Ringkasan", list:["Abu Bakar (11–13 H): memerangi kaum murtad, mengumpulkan Al-Qur'an.","Umar (13–23 H): perluasan wilayah, penetapan kalender Hijriah, pembangunan administrasi.","Utsman (23–35 H): penyeragaman mushaf, perluasan Masjid Nabawi.","Ali (35–40 H): konsolidasi internal, memindahkan pusat pemerintahan ke Kufah."]}],
  sources:["sirah"], related:["abu-bakar","umar","utsman","ali","sirah"], tags:["sejarah","khulafaur rasyidin"]});
addEntry({id:"sejarah-islam", menu:8, material:"sejarah-islam", type:"article", title:"Sejarah Islam", summary:"Perkembangan Islam dari masa khulafa hingga era modern di berbagai wilayah.",
  body:[{h:"Cakupan", list:["Dinasti Umayyah dan Abbasiyah: perluasan wilayah, pusat ilmu (Baghdad, Damaskus, Kordoba).","Kerajaan-kerajaan Islam di berbagai kawasan (Andalusia, Persia, Turki Utsmani, Asia Tenggara).","Islam Nusantara: masuk lewat jalur dagang, dakwah damai, dan akulturasi.","Islam modern: kebangkitan, pembaruan, dan tantangan kontemporer."]}],
  sources:["app"], related:["islam-nusantara","khulafaur-rasyidin","peradaban"], tags:["sejarah","peradaban"]});
addEntry({id:"islam-nusantara", menu:8, material:"sejarah-islam", type:"article", title:"Islam Nusantara", summary:"Masuknya Islam ke Nusantara dan perkembangannya.",
  body:[{h:"Ringkasan", list:["Bukti awal: Kerajaan Samudera Pasai (abad ke-13 M), makam dan naskah.","Masuk melalui jalur perdagangan, dakwah para wali (Walisongo), dan akulturasi budaya.","Penyebaran damai tanpa penaklukan militer besar; munculnya kerajaan-kerajaan Islam (Demak, Aceh, Banten, Gowa, Mataram Islam).","Ulama Nusantara berperan dalam pendidikan pesantren dan karya tulis."]}],
  sources:["app"], related:["sejarah-islam","nawawi-banten","hamka"], tags:["sejarah","nusantara"]});
addEntry({id:"peristiwa-sejarah", menu:8, material:"peristiwa", type:"article", title:"Peristiwa Sejarah", summary:"Setiap peristiwa sejarah adalah entri individual dengan tanggal, lokasi, tokoh, dan sumber.",
  body:[{h:"Catatan", p:["Database peristiwa dikaitkan dengan Kalender Hijriah: tanggal Hijriah → peristiwa → entri lengkap di sini. Kalender tidak membuat artikel sejarah duplikat."]}],

addEntry({id:"ziarah", menu:8, material:"ziarah", type:"feature", title:"Eksplorasi Ziarah", summary:"Ziarah bukan menu utama, melainkan fitur: tempat ziarah, adab, doa, dan sejarah — terhubung dengan Sirah, Tokoh, dan Kalender.",
  body:[{h:"Cakupan", list:["Pengertian dan tujuan ziarah.","Ziarah kubur: adab, tata cara, dan doa.","Tempat ziarah: masjid bersejarah, makam tokoh, dan situs sejarah Islam.","Jika data lokasi tersedia: alamat, koordinat, dan tautan peta.","Perbedaan pendapat yang relevan ditampilkan dengan catatan."]}],
  sources:["app"], related:["ziarah-kubur","adab-ziarah","doa-ziarah-kubur","masjidil-haram"], tags:["ziarah","fitur"]});
addEntry({id:"ziarah-kubur", menu:8, material:"ziarah", type:"article", title:"Ziarah Kubur", summary:"Mengunjungi kubur untuk mendoakan mayit dan mengingat kematian.",
  body:[{h:"Ketentuan", list:["Disunnahkan — Rasulullah ﷺ bersabda: \"Dahulu aku melarang kalian berziarah kubur, maka (sekarang) berziarahlah.\" (HR. Muslim no. 977).","Mengucapkan salam kepada penghuni kubur dan mendoakan mereka.","Dilarang: meminta kepada mayit, thawaf kubur, dan perbuatan syirik lainnya.","Perempuan: boleh ziarah menurut sebagian ulama dengan adab; sebagian lain memakruhkan — tampilkan transparan."]}],
  sources:["muslim","fiqihsunnah"], related:["ziarah","adab-ziarah","doa-ziarah-kubur"], tags:["ziarah","kubur"]});
addEntry({id:"adab-ziarah", menu:8, material:"ziarah", type:"article", title:"Adab Ziarah", summary:"Tata krama saat ziarah kubur dan tempat bersejarah.",
  body:[{h:"Adab", list:["Niat mengingat kematian dan mendoakan.","Mengucap salam dan berdoa dengan khusyuk.","Tidak duduk/duduk-duduk di atas kubur (HR. Muslim no. 972).","Tidak meratap, berteriak, atau meminta kepada mayit.","Menjaga kesopanan di masjid dan situs bersejarah."]}],
  sources:["muslim"], related:["ziarah-kubur","ziarah"], tags:["ziarah","adab"]});
addEntry({id:"doa-ziarah-kubur", menu:8, material:"ziarah", type:"bacaan", title:"Doa Ziarah Kubur",
  arabic:{text:"السَّلَامُ عَلَيْكُمْ أَهْلَ الدِّيَارِ مِنَ الْمُؤْمِنِينَ وَالْمُسْلِمِينَ، وَإِنَّا إِنْ شَاءَ اللهُ بِكُمْ لَلَاحِقُونَ",translit:"Assalamu 'alaikum ahlad-diyari minal-mu'minina wal-muslimin, wa inna insya Allahu bikum lalahiqun",arti:"Semoga keselamatan atas kalian wahai penghuni kubur dari kalangan mukminin dan muslimin. Sungguh kami, insya Allah, akan menyusul kalian.",audio:"",audio_src:"",source:"HR. Muslim no. 975"},
  body:[{h:"Keterangan", p:["Diucapkan saat memasuki pekuburan; lalu mendoakan mayit sesuai yang diketahui kebaikannya."]}],
  sources:["muslim"], related:["ziarah-kubur","adab-ziarah"], tags:["ziarah","doa"]});

  sources:["bukhari","muslim"], related:["shalat-sunnah","doa"], tags:["ibadah","shalat sunnah"]});

/* --- Menu 1 · Zakat --- */
addEntry({id:"hukum-zakat", menu:1, material:"zakat", type:"article", title:"Hukum Zakat", summary:"Zakat wajib bagi yang memenuhi syarat; meninggalkannya adalah dosa besar.",
  body:[{h:"Dalil", list:["QS. Al-Baqarah 2:43 — \"...dirikanlah shalat dan tunaikanlah zakat...\"","QS. At-Taubah 9:103 — \"Ambillah zakat dari harta mereka...\"","Nabi ﷺ mewajibkan zakat dan mengutus petugas penariknya (HR. Bukhari no. 1395)."]}],
  sources:["quran","bukhari"], related:["zakat","zakat-mal"], tags:["zakat","hukum"]});
addEntry({id:"cara-menghitung-zakat", menu:1, material:"zakat", type:"guide", title:"Cara Menghitung Zakat", summary:"Langkah umum menghitung zakat mal: cek nishab, haul, lalu keluarkan 2,5%.",
  body:[{h:"Langkah", list:["Tentukan jenis harta (emas, uang, dagangan, penghasilan, panen, ternak).","Cek nishab: senilai 85 gram emas (atau 595 gram perak) untuk zakat mal; 5 wasaq (±653 kg) untuk pertanian.","Cek haul (satu tahun) kecuali pertanian dan rikaz.","Kurangi utang jatuh tempo yang menjadi tanggungan.","Keluarkan 2,5% (pertanian: 10% atau 5% sesuai pengairan)."]},
  {h:"Alat", p:["Gunakan Kalkulator Zakat pada materi ini — metode dan rinciannya ditampilkan transparan."]}],
  sources:["baznas"], related:["zakat","zakat-kalkulator","zakat-nishab"], tags:["zakat","kalkulator"]});

/* --- Menu 1 · Puasa --- */
addEntry({id:"hukum-puasa", menu:1, material:"puasa", type:"article", title:"Hukum Puasa", summary:"Puasa Ramadan wajib; dalilnya QS. Al-Baqarah 2:183-185.",
  body:[{h:"Dalil", list:["QS. Al-Baqarah 2:183 — \"...diwajibkan atas kamu berpuasa sebagaimana diwajibkan atas orang-orang sebelum kamu...\"","QS. Al-Baqarah 2:185 — \"...barang siapa di antara kamu hadir (di negeri tempat tinggalnya) pada bulan itu, maka berpuasalah...\"","Rasulullah ﷺ: \"Islam dibangun di atas lima perkara... dan puasa Ramadan.\" (HR. Bukhari no. 8, Muslim no. 16)."]}],
  sources:["quran","bukhari","muslim"], related:["puasa","puasa-ramadan"], tags:["puasa","hukum"]});
addEntry({id:"kafarat-puasa", menu:1, material:"puasa", sub:"wajib", type:"article", title:"Kafarat Puasa", summary:"Tebusan bagi yang membatalkan puasa Ramadan dengan hubungan suami istri di siang hari.",
  body:[{h:"Ketentuan", list:["Urutan: memerdekakan budak → puasa dua bulan berturut-turut → memberi makan 60 orang miskin.","Dalil: hadis tentang lelaki yang menggauli istrinya di siang Ramadan (HR. Bukhari no. 1936, Muslim no. 1111).","Catatan: tetap wajib qadha di samping kafarat."]}],
  sources:["bukhari","muslim"], related:["qadha-puasa","pembatal-puasa"], tags:["puasa","kafarat"]});
addEntry({id:"tadarus", menu:1, material:"puasa", sub:"ramadan", type:"article", title:"Tadarus Al-Qur'an", summary:"Saling membacakan Al-Qur'an — amalan utama Ramadan.",
  body:[{h:"Dalil", p:["Setiap Ramadan, Jibril bertadarus Al-Qur'an bersama Nabi ﷺ (HR. Bukhari no. 1902, Muslim no. 4268). Tadarus dapat dilakukan sendiri, berpasangan, atau dalam halaqah."]}],
  sources:["bukhari","muslim"], related:["puasa-ramadan","alquran","juz-amma"], tags:["ramadan","al-quran"]});
addEntry({id:"amalan-ramadan", menu:1, material:"puasa", sub:"ramadan", type:"article", title:"Amalan Ramadan", summary:"Amalan utama di bulan Ramadan: puasa, qiyam, tadarus, sedekah, dan i'tikaf.",
  body:[{h:"Amalan", list:["Puasa dan menahan diri dari hal yang membatalkan.","Qiyamul lail: tarawih dan witir.","Tadarus dan tilawah Al-Qur'an.","Sedekah dan memberi makan orang berbuka.","I'tikaf di sepuluh malam terakhir.","Memperbanyak doa, istighfar, dan dzikir."]}],
  sources:["bukhari","muslim"], related:["puasa-ramadan","tarawih","tadarus","itikaf"], tags:["ramadan","amalan"]});

/* --- Menu 1 · Haji --- */
addEntry({id:"sunnah-haji", menu:1, material:"haji", type:"article", title:"Sunnah Haji", summary:"Amalan yang disunnahkan dalam haji dan menambah kesempurnaan.",
  body:[{h:"Sunnah", list:["Talbiyah dengan suara keras bagi laki-laki.","Tawaf qudum (tawaf kedatangan).","Berdoa dan dzikir di Arafah, Muzdalifah, dan Mina.","Mencukur rambut saat tahallul.","Memperbanyak sedekah selama musim haji."]}],
  sources:["fiqihsunnah"], related:["haji","talbiyah","tawaf"], tags:["haji","sunnah"]});
addEntry({id:"melontar-jumrah", menu:1, material:"haji", type:"article", title:"Melontar Jumrah", summary:"Melempar kerikil ke tiang jumrah pada 10–13 Dzulhijjah.",
  body:[{h:"Ketentuan", list:["10 Dzulhijjah: melontar Jumrah Aqabah (7 kerikil).","11–12 Dzulhijjah (dan 13 bagi yang menunda): melontar tiga jumrah — Ula, Wustha, Aqabah — masing-masing 7 kerikil.","Dalil: perbuatan Rasulullah ﷺ dalam haji (HR. Bukhari no. 1749, Muslim no. 1296)."]}],
  sources:["bukhari","muslim"], related:["haji","mabit","tata-cara-haji"], tags:["haji","manasik"]});
addEntry({id:"tata-cara-haji", menu:1, material:"haji", type:"guide", title:"Tata Cara Haji", summary:"Urutan manasik haji secara ringkas (tamattu').",
  body:[{h:"Urutan ringkas", list:["1. Ihram haji dari miqat, bertalbiyah.","2. Tiba di Makkah: tawaf qudum bila memungkinkan.","3. 8 Dzulhijjah: berangkat ke Mina, bermalam.","4. 9 Dzulhijjah: wukuf di Arafah hingga terbenam matahari.","5. Mabit di Muzdalifah, mengambil kerikil.","6. 10 Dzulhijjah: melontar Aqabah, menyembelih (bagi yang mampu), tahallul awal.","7. Tawaf ifadhah dan sa'i.","8. Mabit di Mina 11–12 (13) Dzulhijjah dan melontar jumrah.","9. Tawaf wada' sebelum meninggalkan Makkah."]},
  {h:"Catatan", p:["Rincian lengkap dan perbedaan mazhab pada kitab manasik; bimbingan pembimbing haji sangat dianjurkan."]}],
  sources:["fiqihsunnah"], related:["haji","rukun-haji","wukuf","melontar-jumrah"], tags:["haji","manasik"]});
addEntry({id:"tata-cara-umrah", menu:1, material:"haji", type:"guide", title:"Tata Cara Umrah", summary:"Urutan umrah: ihram, tawaf, sa'i, tahallul.",
  body:[{h:"Urutan", list:["1. Ihram (niat umrah) dari miqat, bertalbiyah.","2. Tawaf tujuh putaran mengelilingi Ka'bah.","3. Shalat dua rakaat di belakang Maqam Ibrahim bila memungkinkan.","4. Sa'i antara Safa dan Marwah tujuh kali.","5. Tahallul: mencukur atau menggunting rambut."]}],
  sources:["fiqihsunnah"], related:["umrah","ihram","tawaf","sai"], tags:["umrah","manasik"]});

/* --- Menu 2 · Rukun Iman --- */
addEntry({id:"dalil-iman-kepada-allah", menu:2, material:"iman-kepada-allah", type:"article", title:"Dalil Iman kepada Allah", summary:"Dalil wajibnya beriman kepada Allah dari Al-Qur'an dan hadis.",
  body:[{h:"Dalil", list:["QS. Al-Baqarah 2:163 — \"Tuhan kamu adalah Tuhan Yang Maha Esa; tiada tuhan selain Dia...\"","QS. Al-Ikhlas 112:1-4 — keesaan Allah.","Hadis Jibril — \"...iman adalah engkau beriman kepada Allah...\" (HR. Muslim no. 8)."]}],
  sources:["quran","muslim"], related:["iman-kepada-allah","tauhid"], tags:["akidah","iman"]});
addEntry({id:"hikmah-iman-kepada-allah", menu:2, material:"iman-kepada-allah", type:"article", title:"Hikmah Beriman kepada Allah", summary:"Buah iman kepada Allah dalam kehidupan.",
  body:[{h:"Hikmah", list:["Hati tenang karena segala urusan diserahkan kepada Allah.","Berani berbuat benar karena takut hanya kepada-Nya.","Ikhlas dan tulus dalam beramal.","Bersyukur atas nikmat dan sabar atas ujian."]}],
  sources:["quran"], related:["iman-kepada-allah","tawakal"], tags:["akidah","iman"]});
addEntry({id:"sifat-allah", menu:2, material:"iman-kepada-allah", sub:"sifat", type:"article", title:"Sifat-sifat Allah", summary:"Ringkasan sifat Allah; dibahas hati-hati sesuai pendekatan yang dipilih.",
  body:[{h:"Pendekatan Ahlus Sunnah", p:["Menetapkan nama dan sifat yang Allah tetapkan dalam Al-Qur'an dan sunnah, tanpa takyif (menanyakan hakikat) dan tamtsil (menyerupakan): \"...tidak ada sesuatu pun yang serupa dengan Dia.\" (QS. Asy-Syura 42:11)."]},
  {h:"Pendekatan ilmu tauhid (maturidiyah/asya'irah)", p:["Merangkum sifat wajib bagi Allah: wujud (ada), qidam (dahulu), baqa' (kekal), mukhalafatuhu lil hawadits (berbeda dari makhluk), qiyamuhu binafsihi (berdiri sendiri), wahdaniyah (esa), qudrat (kuasa), iradat (berkehendak), ilmu, hayat (hidup), sam' (mendengar), bashar (melihat), dan kalam (berfirman)."]},
  {h:"Catatan", p:["Kedua pendekatan memiliki dalil dan metode masing-masing. Aplikasi menampilkan secara informatif tanpa klaim sepihak; pendalaman sebaiknya bersama guru/kitab akidah yang mu'tabar."]}],
  sources:["quran","app"], related:["asma-wa-sifat","tauhid"], tags:["akidah","sifat allah"]});
addEntry({id:"dalil-malaikat", menu:2, material:"iman-kepada-malaikat", type:"article", title:"Dalil Iman kepada Malaikat", summary:"Dalil keberadaan dan tugas malaikat.",
  body:[{h:"Dalil", list:["QS. Al-Baqarah 2:285 — \"Rasul beriman kepada apa yang diturunkan kepadanya dari Tuhannya, demikian pula orang-orang yang beriman; semuanya beriman kepada Allah, malaikat-malaikat-Nya, kitab-kitab-Nya, dan rasul-rasul-Nya.\"","QS. At-Tahrim 66:6 — malaikat yang keras dan taat.","Hadis Jibril (HR. Muslim no. 8)."]}],
  sources:["quran","muslim"], related:["iman-kepada-malaikat"], tags:["akidah","malaikat"]});
addEntry({id:"sifat-malaikat", menu:2, material:"iman-kepada-malaikat", type:"article", title:"Sifat Malaikat", summary:"Karakteristik malaikat menurut Al-Qur'an dan hadis.",
  body:[{h:"Sifat", list:["Diciptakan dari cahaya (HR. Muslim no. 2996).","Tidak makan, tidak minum, dan tidak menikah.","Selalu taat — \"...malaikat-malaikat tidak mendurhakai Allah terhadap apa yang Dia perintahkan kepada mereka.\" (QS. At-Tahrim 66:6).","Jumlah mereka hanya Allah yang tahu.","Dapat berubah wujud dengan izin Allah."]}],
  sources:["quran","muslim"], related:["iman-kepada-malaikat","dalil-malaikat"], tags:["akidah","malaikat"]});
addEntry({id:"hikmah-malaikat", menu:2, material:"iman-kepada-malaikat", type:"article", title:"Hikmah Beriman kepada Malaikat", summary:"Pengaruh iman kepada malaikat pada perilaku.",
  body:[{h:"Hikmah", list:["Menjaga diri karena setiap amal dicatat oleh Raqib dan Atid.","Semangat beramal karena malaikat mendoakan orang beriman.","Meyakini pertolongan Allah melalui para malaikat-Nya."]}],
  sources:["quran"], related:["iman-kepada-malaikat"], tags:["akidah","malaikat"]});
addEntry({id:"dalil-rasul", menu:2, material:"iman-kepada-rasul", type:"article", title:"Dalil Iman kepada Rasul", summary:"Dalil wajibnya beriman kepada para rasul.",
  body:[{h:"Dalil", list:["QS. An-Nisa' 4:164 — \"...dan Allah berbicara kepada Musa secara langsung.\"","QS. An-Nahl 16:36 — \"...dan sungguh Kami telah mengutus rasul pada setiap umat...\"","Hadis Jibril (HR. Muslim no. 8)."]}],
  sources:["quran","muslim"], related:["iman-kepada-rasul"], tags:["akidah","rasul"]});
addEntry({id:"nabi-rasul-25", menu:2, material:"iman-kepada-rasul", type:"article", title:"25 Nabi dan Rasul", summary:"Dua puluh lima nabi dan rasul yang disebutkan dalam Al-Qur'an.",
  body:[{h:"Daftar", list:["1. Adam","2. Idris","3. Nuh","4. Hud","5. Shaleh","6. Ibrahim","7. Luth","8. Ismail","9. Ishaq","10. Ya'qub","11. Yusuf","12. Ayyub","13. Syu'aib","14. Musa","15. Harun","16. Dzulkifli","17. Dawud","18. Sulaiman","19. Ilyas","20. Ilyasa'","21. Yunus","22. Zakariyya","23. Yahya","24. Isa","25. Muhammad ﷺ"]},
  {h:"Catatan", p:["Biografi masing-masing ditautkan ke menu Tokoh & Ulama agar tidak ada biografi ganda."]}],
  sources:["quran"], related:["iman-kepada-rasul","nabi-muhammad","tokoh"], tags:["akidah","nabi"]});
addEntry({id:"sifat-rasul", menu:2, material:"iman-kepada-rasul", type:"article", title:"Sifat Rasul", summary:"Sifat yang wajib ada pada para rasul.",
  body:[{h:"Sifat", list:["Siddiq — jujur dalam segala perkataan.","Amanah — dapat dipercaya menjalankan risalah.","Tabligh — menyampaikan seluruh wahyu.","Fathanah — cerdas dan mampu berargumentasi.","Terjaga dari dosa besar dan hal yang merusak kepercayaan (maksum dalam menyampaikan risalah)."]}],
  sources:["app"], related:["iman-kepada-rasul","nabi-rasul-25"], tags:["akidah","rasul"]});
addEntry({id:"mukjizat-rasul", menu:2, material:"iman-kepada-rasul", type:"article", title:"Mukjizat Para Rasul", summary:"Bukti kenabian yang melampaui kebiasaan, dengan izin Allah.",
  body:[{h:"Contoh", list:["Nabi Musa: tongkat membelah laut.","Nabi Isa: menyembuhkan penyakit dengan izin Allah.","Nabi Muhammad ﷺ: Al-Qur'an — mukjizat terbesar yang kekal; terbelahnya bulan (QS. Al-Qamar 54:1); air mengalir dari jari beliau (HR. Bukhari no. 3576)."]}],
  sources:["quran","bukhari"], related:["iman-kepada-rasul","alquran"], tags:["akidah","mukjizat"]});
addEntry({id:"keteladanan-rasul", menu:2, material:"iman-kepada-rasul", type:"article", title:"Keteladanan Rasulullah ﷺ", summary:"Rasulullah ﷺ adalah teladan terbaik dalam seluruh aspek kehidupan.",
  body:[{h:"Dalil", list:["QS. Al-Ahzab 33:21 — \"Sungguh telah ada pada (diri) Rasulullah itu suri teladan yang baik bagimu...\"","Akhlak beliau adalah Al-Qur'an (HR. Muslim no. 746).","Rincian kehidupan beliau: menu Sirah & Sejarah Islam."]}],
  sources:["quran","muslim"], related:["iman-kepada-rasul","sirah","nabi-muhammad"], tags:["akidah","teladan"]});
addEntry({id:"ulul-azmi", menu:2, material:"iman-kepada-rasul", type:"article", title:"Ulul Azmi", summary:"Lima rasul dengan kesabaran dan keteguhan paling tinggi.",
  body:[{h:"Nama", list:["Nuh","Ibrahim","Musa","Isa","Muhammad ﷺ"]},
  {h:"Dalil", p:["QS. Al-Ahzab 33:7 dan QS. Asy-Syura 42:13 menyebutkan mereka; QS. Al-Ahqaf 46:35: \"...maka bersabarlah engkau sebagaimana kesabaran rasul-rasul yang memiliki keteguhan hati (ulul azmi)...\""]}],
  sources:["quran"], related:["iman-kepada-rasul","nabi-rasul-25"], tags:["akidah","rasul"]});
addEntry({id:"tanda-kiamat", menu:2, material:"iman-kepada-hari-akhir", type:"article", title:"Tanda-tanda Kiamat", summary:"Tanda kecil dan tanda besar menjelang hari kiamat.",
  body:[{h:"Tanda kecil", list:["Hilangnya amanah dan diangkatnya ilmu.","Banyaknya fitnah dan pembunuhan.","Saling berlomba membangun dan memperindah masjid (HR. Bukhari no. 59, Muslim no. 157)."]},
  {h:"Tanda besar", list:["Munculnya Dajjal, turunnya Isa, keluarnya Ya'juj dan Ma'juj.","Terbitnya matahari dari barat.","Asap (dukhan) dan binatang melata (dabbah). (HR. Muslim no. 2901)."]}],
  sources:["bukhari","muslim"], related:["iman-kepada-hari-akhir"], tags:["akidah","hari akhir"]});
addEntry({id:"kebangkitan", menu:2, material:"iman-kepada-hari-akhir", type:"article", title:"Kebangkitan & Mahsyar", summary:"Dibangkitkannya manusia dari kubur dan berkumpul di padang mahsyar.",
  body:[{h:"Dalil", list:["QS. Ya Sin 36:51-52 — \"...maka seketika itu mereka keluar dari kuburnya (dalam keadaan) bersegera kepada Tuhan mereka.\"","Setelah kebangkitan, manusia dihimpun di mahsyar; keadaan sangat sulit, dan syafaat agung milik Nabi Muhammad ﷺ (HR. Bukhari no. 4712)."]}],
  sources:["quran","bukhari"], related:["iman-kepada-hari-akhir","hisab-mizan-shirath"], tags:["akidah","hari akhir"]});
addEntry({id:"hisab-mizan-shirath", menu:2, material:"iman-kepada-hari-akhir", type:"article", title:"Hisab, Mizan & Shirath", summary:"Perhitungan amal, timbangan amal, dan jembatan menuju surga.",
  body:[{h:"Hisab", p:["Setiap amal diperhitungkan: \"Barang siapa mengerjakan kebaikan seberat zarah, niscaya dia akan melihat (balasan)-nya.\" (QS. Az-Zalzalah 99:7-8)."]},
  {h:"Mizan", p:["Timbangan amal: \"...dan Kami akan memasang timbangan yang adil pada hari kiamat.\" (QS. Al-Anbiya' 21:47)."]},
  {h:"Shirath", p:["Jembatan di atas neraka menuju surga; manusia melintas sesuai amalnya (HR. Bukhari no. 7437, Muslim no. 183)."]},
  {h:"Syafaat", p:["Syafaat hanya dengan izin Allah: \"...tiada yang dapat memberi syafaat di sisi Allah kecuali dengan izin-Nya.\" (QS. Al-Baqarah 2:255)."]}],
  sources:["quran","bukhari","muslim"], related:["iman-kepada-hari-akhir","kebangkitan","surga","neraka"], tags:["akidah","hari akhir"]});
addEntry({id:"hikmah-qada-qadar", menu:2, material:"iman-kepada-qada-qadar", type:"article", title:"Hikmah Beriman kepada Qada & Qadar", summary:"Buah iman kepada takdir dalam kehidupan sehari-hari.",
  body:[{h:"Hikmah", list:["Ketenangan dan keridhaan atas ketetapan Allah.","Semangat berikhtiar tanpa putus asa.","Tidak iri atas keberhasilan orang lain — semua dengan takdir.","Sabar saat musibah dan syukur saat nikmat."]}],
  sources:["quran"], related:["iman-kepada-qada-qadar","ikhtiar-tawakal"], tags:["akidah","takdir"]});

/* --- Menu 3 · Tajwid --- */
addEntry({id:"makharijul-huruf", menu:3, material:"tajwid", type:"article", title:"Makharijul Huruf", summary:"Tempat keluarnya huruf hijaiyah — fondasi pelafalan yang benar.",
  body:[{h:"Lima makhraj utama", list:["Al-Jauf (rongga mulut dan tenggorokan): huruf mad (ا و ي).","Al-Halq (tenggorokan): hamzah, ha', 'ain, ha, ghain, kha.","Al-Lisan (lidah): mayoritas huruf — ujung lidah, pangkal, dan tengah lidah.","Asy-Syafatan (dua bibir): fa, ba, mim, wau.","Al-Khaisyum (rongga hidung): ghunnah."]},
  {h:"Catatan", p:["Detail 17 titik makhraj dipelajari langsung bersama guru (talaqqi) agar tepat."]}],
  sources:["app"], related:["tajwid","sifat-huruf","huruf-hijaiyah"], tags:["al-quran","tajwid"]});
addEntry({id:"sifat-huruf", menu:3, material:"tajwid", type:"article", title:"Sifat Huruf", summary:"Sifat yang menyertai huruf — membedakan huruf yang satu dari yang lain.",
  body:[{h:"Sifat penting", list:["Hams vs Jahr (aliran nafas kuat/tertahan).","Syiddah vs Rikhwah (tekanan kuat/lemah).","Isti'la vs Istifal (lidah terangkat/tidak).","Ithbaq vs Infitah.","Qalqalah, Shafir, Ghunnah, dan lainnya."]},
  {h:"Catatan", p:["Pembahasan sifat huruf menuntut praktik langsung; pelajari bersama guru bacaan."]}],
  sources:["app"], related:["tajwid","makharijul-huruf"], tags:["al-quran","tajwid"]});

/* --- Menu 6 · Doa --- */
addEntry({id:"doa-setelah-shalat", menu:6, material:"doa", sub:"setelah-shalat", type:"doa", category:"Setelah Shalat", title:"Doa setelah Shalat",
  arabic:{text:"اللَّهُمَّ أَنْتَ السَّلَامُ وَمِنْكَ السَّلَامُ، تَبَارَكْتَ يَا ذَا الْجَلَالِ وَالْإِكْرَامِ",translit:"Allahumma antas-salam wa minkas-salam, tabarakta ya dzal-jalali wal-ikram",arti:"Ya Allah, Engkau Maha Sejahtera, dan dari-Mu keselamatan. Maha Berkah Engkau, wahai Pemilik kebesaran dan kemuliaan.",audio:"",audio_src:"",source:"HR. Muslim no. 591"},
  body:[{h:"Keterangan", p:["Dibaca setelah salam, lalu dilanjutkan dzikir: istighfar 3×, tasbih 33×, tahmid 33×, takbir 33×. Rincian pada Dzikir setelah Shalat."]}],
  sources:["muslim"], related:["dzikir-setelah-shalat","shalat"], tags:["doa","shalat"]});
addEntry({id:"doa-ramadan", menu:6, material:"doa", sub:"ramadan", type:"doa", category:"Ramadan", title:"Doa Berbuka Puasa",
  arabic:{text:"ذَهَبَ الظَّمَأُ وَابْتَلَّتِ الْعُرُوقُ وَثَبَتَ الْأَجْرُ إِنْ شَاءَ اللهُ",translit:"Dzahaba-z-zama'u wabtallatil-'uruqu wa tsabatal-ajru insya Allah",arti:"Telah hilang dahaga, urat-urat telah basah, dan pahala telah tetap, insya Allah.",audio:"",audio_src:"",source:"HR. Abu Dawud no. 2357"},
