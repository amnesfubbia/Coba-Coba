<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>amnesfubbia xx1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { background-color: #000; color: #fff; font-family: 'Inter', sans-serif; margin: 0; overflow-x: hidden; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        /* HEADER & PROFILE */
        .profile-header { padding: 15px 15px 0 15px; background: #000; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .ig-logo-wrapper { display: flex; align-items: center; gap: 4px; position: relative; cursor: pointer; }
        .ig-logo { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 18px; letter-spacing: -0.5px; }
        .dot-notify { width: 7px; height: 7px; background-color: #ff3b30; border-radius: 50%; display: inline-block; margin-left: 2px; }
        
        .profile-info { display: flex; align-items: center; gap: 25px; margin-bottom: 15px; }
        .profile-pic-container { position: relative; width: 86px; height: 86px; }
        .profile-pic-logo { width: 82px; height: 82px; border-radius: 50%; border: 1px solid #333; padding: 2px; background: #1a1a1a; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .logo-text-inner { font-weight: 900; font-size: 16px; color: #fff; letter-spacing: 1px; line-height: 1; text-align: center; }
        .add-story-btn { position: absolute; bottom: 4px; right: 4px; width: 24px; height: 24px; background: #0095f6; border: 3px solid #000; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; color: #fff; z-index: 10; }

        .stats { display: flex; flex-grow: 1; justify-content: space-around; text-align: center; }
        .stat-val { font-weight: 700; font-size: 16px; display: block; }
        .stat-label { font-size: 12px; color: #a8a8a8; }
        
        .bio { font-size: 13px; line-height: 1.4; margin-bottom: 15px; padding-top: 5px; }
        .bio-name-wrapper { display: flex; align-items: center; gap: 5px; margin-bottom: 2px; }
        .bio-name { font-weight: 700; font-size: 14px; display: block; }

        .action-buttons { display: flex; gap: 6px; margin-bottom: 10px; }
        .btn-ig { flex: 1; background: #1c1c1c; border-radius: 8px; padding: 7px; font-size: 13px; font-weight: 600; text-align: center; cursor: pointer; color: #fff; }
        .btn-ig.active { background: #363636; }
        .btn-icon-sq { width: 34px; background: #1c1c1c; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; }

        #filterBar { display: none; margin-bottom: 15px; }
        .pill-grid { display: grid; gap: 6px; }
        .pill { background: transparent; border: 1px solid #1c1c1c; color: #fff; padding: 7px 0; border-radius: 8px; font-size: 10px; font-weight: 800; text-transform: uppercase; text-align: center; cursor: pointer; }
        
        .filter-dropdown { display: none; position: fixed; bottom: 0; left: 0; right: 0; background: #121212; border-radius: 20px 20px 0 0; z-index: 5000; max-height: 60vh; overflow-y: auto; border-top: 1px solid #333; padding-bottom: 20px; animation: slideUp 0.3s ease-out; overscroll-behavior: contain; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .sticky-reset { position: sticky; top: 0; background: #1c1c1c; z-index: 10; font-weight: 800 !important; color: #0095f6 !important; border-bottom: 2px solid #333; }
        #filterOverlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 4000; }
        .filter-item { padding: 16px; font-size: 14px; text-align: center; border-bottom: 1px solid #262626; color: #eee; cursor: pointer; }

        .highlights-wrapper { padding: 0 15px 15px 15px; border-bottom: 1px solid #1c1c1c; }
        .highlights-container { display: flex; gap: 15px; overflow-x: auto; }
        .highlight-item { flex: 0 0 62px; text-align: center; cursor: pointer; }
        .highlight-circle { width: 58px; height: 58px; border-radius: 50%; border: 1px solid #262626; margin-bottom: 5px; display: flex; align-items: center; justify-content: center; background: #000; }
        .highlight-circle .hl-logo { font-size: 10px; font-weight: 900; letter-spacing: -0.5px; text-transform: uppercase; color: #fff; text-align: center; line-height: 1; }
        .highlight-text { font-size: 10px; color: #fff; }

        .tab-nav { display: flex; border-top: 1px solid #1c1c1c; }
        .tab-item { flex: 1; text-align: center; padding: 12px 0; color: #a8a8a8; cursor: pointer; font-size: 18px; }
        .tab-item.active { color: #fff; border-bottom: 1px solid #fff; }

        .movie-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; padding-bottom: 80px; }
        .post-card { position: relative; aspect-ratio: 2/3; background: #0a0a0a; overflow: hidden; }
        .post-card img { width: 100%; height: 100%; object-fit: cover; }
        .badge-rating { position: absolute; top: 6px; left: 6px; padding: 2px 5px; border-radius: 2px; font-size: 7px; font-weight: 900; z-index: 5; background: rgba(255,255,255,0.9); color: #000; }
        .badge-type { position: absolute; top: 6px; right: 6px; padding: 2px 5px; border-radius: 2px; font-size: 7px; font-weight: 900; z-index: 5; background: rgba(0,0,0,0.7); color: #fff; text-transform: uppercase; border: 0.5px solid rgba(255,255,255,0.3); }

        #searchOverlay { display: none; position: fixed; inset: 0; background: #000; z-index: 2000; overflow-y: auto; }
        .search-header { position: sticky; top: 0; background: #000; display: flex; align-items: center; padding: 10px 15px; gap: 10px; border-bottom: 1px solid #1c1c1c; z-index: 100; }
        .search-input-box { flex-grow: 1; background: #262626; border-radius: 10px; padding: 8px 12px; display: flex; align-items: center; position: relative; }
        .search-input-box input { background: transparent !important; border: none; outline: none; color: #fff !important; font-size: 14px; width: 100%; margin-left: 8px; }

        .modal-player { display: none; position: fixed; inset: 0; z-index: 3000; background: #000; overflow-y: auto; }
        .carousel-track { display: flex; transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1); width: 100%; }
        .carousel-slide { min-width: 100%; aspect-ratio: 16/9; position: relative; }
        .swipe-overlay { position: absolute; inset: 0; z-index: 10; background: transparent; }
        .interaction-icon { font-size: 24px; cursor: pointer; color: #fff; }
        
        /* OST STYLES - Perbaikan Baru */
        .ost-container { margin-top: 20px; padding: 12px; background: #121212; border: 1px solid #262626; border-radius: 12px; }
        .ost-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
        .ost-header i { color: #ff0000; font-size: 14px; }
        .ost-header span { font-size: 10px; font-weight: 800; text-transform: uppercase; color: #a8a8a8; letter-spacing: 1px; }
        
        .server-btn { width: 100%; padding: 12px 5px; border-radius: 8px; font-size: 8px; font-weight: 800; text-transform: uppercase; border: 1px solid #1c1c1c; text-align: center; cursor: pointer; background: #0a0a0a; color: #fff; }
        .server-btn.active-link { border: 2px solid #fff !important; }
        .dl-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 15px; }
        .dl-link-btn { width: 100%; padding: 14px; border-radius: 12px; background: #000; color: #a1a1aa; font-size: 10px; font-weight: 800; text-transform: uppercase; text-align: center; border: 1px solid #1c1c1c; }
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: #000; border-top: 1px solid #1c1c1c; display: flex; justify-content: space-around; padding: 12px 0; z-index: 300; }
        
        #backToTop { position: fixed; bottom: 85px; right: 20px; background: rgba(255,255,255,0.3); width: 42px; height: 42px; border-radius: 50%; display: none; align-items: center; justify-content: center; z-index: 100; backdrop-filter: blur(10px); }
    </style>
</head>
<body>

    <div id="mainProfile">
        <div class="profile-header">
            <div class="top-bar">
                <div class="ig-logo-wrapper" onclick="location.reload()">
                    <h1 class="ig-logo">amnesfubbia</h1>
                    <i class="fa-solid fa-chevron-down text-[10px] ml-0.5"></i>
                    <span class="dot-notify"></span>
                </div>
                <div class="flex gap-5">
                    <i class="fa-regular fa-square-plus text-2xl"></i>
                    <i class="fa-solid fa-bars text-2xl"></i>
                </div>
            </div>

            <div class="profile-info">
                <div class="profile-pic-container">
                    <div class="profile-pic-logo"><div class="logo-text-inner">AM.<br>FB</div></div>
                    <div class="add-story-btn"><i class="fa-solid fa-plus"></i></div>
                </div>
                <div class="stats">
                    <div class="stat-item" onclick="setFilter('type', 'movie')"><span class="stat-val">25.4rb</span><span class="stat-label">film</span></div>
                    <div class="stat-item" onclick="setFilter('type', 'tv')"><span class="stat-val">8.2rb</span><span class="stat-label">series</span></div>
                    <div class="stat-item" onclick="setFilter('type', 'short')"><span class="stat-val">1.5rb</span><span class="stat-label">short</span></div>
                </div>
            </div>

            <div class="bio">
                <div class="bio-name-wrapper"><span class="bio-name">amnesfubbia xx1</span><i class="fa-solid fa-circle-check text-[#0095f6] text-[13px]"></i></div>
                <span>dari indonesia untuk dunia</span><br><span>By Anasteas</span>
            </div>

            <div class="action-buttons">
                <div class="btn-ig" id="btnNowPlaying" onclick="setSchedule('now_playing', this)">Sedang Tayang</div>
                <div class="btn-ig" id="btnUpcoming" onclick="setSchedule('upcoming', this)">Segera Tayang</div>
                <div class="btn-icon-sq" onclick="toggleFilterBar()"><i class="fa-solid fa-user-plus text-sm"></i></div>
            </div>

            <div id="filterBar">
                <div class="pill-grid grid-cols-3">
                    <button class="pill" id="btnCountry" onclick="toggleFilter(event, 'countryDropdown')">Negara <i class="fa-solid fa-caret-down"></i></button>
                    <button class="pill" id="btnGenre" onclick="toggleFilter(event, 'genreDropdown')">Genre <i class="fa-solid fa-caret-down"></i></button>
                    <button class="pill" id="yearBtn" onclick="toggleFilter(event, 'yearDropdown')">Tahun <i class="fa-solid fa-caret-down"></i></button>
                </div>
            </div>
        </div>

        <div class="highlights-wrapper no-scrollbar"><div class="highlights-container no-scrollbar" id="highlightList"></div></div>

        <div class="tab-nav">
            <div class="tab-item active" id="tabGrid" onclick="switchTab('grid', this)"><i class="fa-solid fa-table-cells"></i></div>
            <div class="tab-item" id="tabLikes" onclick="switchTab('likes', this)"><i class="fa-regular fa-heart"></i></div>
            <div class="tab-item" id="tabBookmark" onclick="switchTab('bookmarks', this)"><i class="fa-regular fa-bookmark"></i></div>
        </div>

        <main id="feedGrid" class="movie-grid"></main>
    </div>

    <div id="searchOverlay">
        <div class="search-header">
            <i class="fa-solid fa-arrow-left text-xl text-white" onclick="closeSearch()"></i>
            <div class="search-input-box">
                <i class="fa-solid fa-magnifying-glass text-zinc-500 text-xs"></i>
                <input type="text" id="searchInp" autocomplete="off" placeholder="Cari film, series, anime..." onkeydown="if(event.key==='Enter') searchAction()">
            </div>
        </div>
        <div id="searchGrid" class="movie-grid"></div>
    </div>

    <div id="filterOverlay" onclick="closeD()"></div>
    <div id="countryDropdown" class="filter-dropdown no-scrollbar"></div>
    <div id="genreDropdown" class="filter-dropdown no-scrollbar"></div>
    <div id="yearDropdown" class="filter-dropdown no-scrollbar"></div>

    <div id="movieModal" class="modal-player">
        <div class="max-w-xl mx-auto pb-40">
            <div class="px-4 h-[54px] flex items-center border-b border-zinc-900 sticky top-0 bg-black z-50">
                <i class="fa-solid fa-chevron-left text-xl cursor-pointer" onclick="closeModal()"></i>
                <div class="flex-grow text-center text-[14px] font-bold truncate px-8" id="mTitle"></div>
            </div>
            
            <div id="castContainer" class="flex overflow-x-auto gap-4 px-4 py-4 no-scrollbar"></div>

            <div class="relative overflow-hidden">
                <div class="swipe-overlay" id="swipeOverlay"></div>
                <div class="carousel-track" id="carouselTrack"></div>
                <div id="carouselDots" class="flex justify-center gap-2 py-3"></div>
            </div>

            <div class="px-4 py-3 flex justify-between items-center">
                <div class="flex gap-4">
                    <i id="btnLikeModal" class="interaction-icon"></i>
                    <i class="fa-regular fa-comment interaction-icon"></i>
                    <i class="fa-regular fa-paper-plane interaction-icon"></i>
                </div>
                <i id="btnBookModal" class="interaction-icon"></i>
            </div>

            <div class="px-4">
                <span id="mLikeDisplay" class="font-bold text-sm block mb-1"></span>
                <div>
                    <span class="font-bold text-sm mr-2">amnesfubbia.xx1</span>
                    <span id="mDesc" class="text-sm"></span>
                    <span id="mToggleBtn" class="text-zinc-500 text-sm hidden" onclick="handleToggleDesc()">selengkapnya</span>
                </div>
                
                <div id="mHashtags" class="text-blue-100 text-sm mt-3"></div>
                <div id="mDateDisplay" class="text-zinc-500 text-[10px] mt-2 uppercase"></div>

                <div id="ostSection" class="ost-container hidden">
                    <div class="ost-header">
                        <i class="fa-brands fa-youtube"></i>
                        <span>Soundtrack Original</span>
                    </div>
                    <div class="flex items-center justify-center bg-zinc-900/50 p-4 rounded-lg border border-zinc-800">
                        <button id="btnPlayMusic" class="flex items-center gap-2 bg-[#ff0000] hover:bg-red-700 text-white px-5 py-2.5 rounded-full font-bold text-[10px] transition-all active:scale-95">
                            <i class="fa-solid fa-play"></i> DENGARKAN DI YOUTUBE
                        </button>
                    </div>
                </div>

                <div id="seriesControl" class="hidden mt-6 p-4 bg-zinc-950 rounded-xl border border-zinc-900">
                    <select id="seasonSel" class="bg-zinc-900 text-white text-xs px-2 py-1 rounded w-full mb-4" onchange="loadEpisodes()"></select>
                    <div id="episodeGrid" class="grid grid-cols-5 gap-2"></div>
                </div>

                <div id="serverList" class="grid grid-cols-3 gap-2 mt-6"></div>
                
                <div class="dl-grid">
                    <button class="dl-link-btn" onclick="window.open(`https://dl.vidsrc.vip/${window.currentMediaType}/${window.currentMediaId}`)">Download 1</button>
                    <button class="dl-link-btn" onclick="window.open(`https://multiembed.mov/directstream.php?video_id=${window.currentMediaId}&tmdb=1`)">Download 2</button>
                </div>
            </div>
        </div>
    </div>

    <div id="backToTop" onclick="window.scrollTo({top: 0, behavior: 'smooth'})"><i class="fa-solid fa-arrow-up"></i></div>

    <nav class="bottom-nav">
        <i class="fa-solid fa-house cursor-pointer text-xl" onclick="location.reload()"></i>
        <i class="fa-solid fa-magnifying-glass cursor-pointer text-xl" onclick="openSearch()"></i>
        <i class="fa-regular fa-bookmark cursor-pointer text-xl" onclick="switchTab('bookmarks', document.getElementById('tabBookmark'))"></i>
    </nav>

    <script>
        const API_KEY = 'bfa7df5310c9974f62f26c6789a8c00d';
        let page = 1, loading = false, currentType = 'movie', currentGenre = '', currentYear = '', currentCountry = '', currentSchedule = 'trending', searchQuery = '', currentLibMode = false, currentCastId = '';
        let isExpanded = false, globalFullDesc = "", currentIdx = 0, startX = 0;

        window.onload = () => { initFilters(); initHighlights(); loadFeed(); setupSwipe(); };

        function initHighlights() { 
            const hls = [
                {n: 'Disney', com: '2|6125', l: 'DSNY', t: 'movie'},
                {n: 'Pixar', com: '3', l: 'PIXR', t: 'movie'},
                {n: 'Ghibli', com: '10342', l: 'GHBL', t: 'movie'},
                {n: 'Anime', g: 16, l: 'ANIM', t: 'movie', c: 'JP'},
                {n: 'Indonesia', c: 'ID', l: 'INDO', t: 'movie'}
            ]; 
            const cont = document.getElementById('highlightList'); 
            hls.forEach(h => { 
                cont.innerHTML += `<div class="highlight-item" onclick="filterByHighlight('${h.c||''}','${h.g||''}','${h.com||''}','${h.t}')"><div class="highlight-circle"><span class="hl-logo">${h.l}</span></div><div class="highlight-text">${h.n}</div></div>`;
            }); 
        }

        function filterByHighlight(c, g, com, t) { currentCountry=c; currentGenre=g; currentCompany=com; currentType=t; loadFeed(true); }

        async function loadFeed(isNew = true) {
            if(loading) return; loading = true;
            const grid = document.getElementById('searchOverlay').style.display === 'block' ? document.getElementById('searchGrid') : document.getElementById('feedGrid');
            if(isNew) { page = 1; grid.innerHTML = ''; }
            let url = searchQuery ? `https://api.themoviedb.org/3/search/multi?query=${encodeURIComponent(searchQuery)}&api_key=${API_KEY}&page=${page}` : `https://api.themoviedb.org/3/discover/${currentType}?api_key=${API_KEY}&page=${page}&with_origin_country=${currentCountry}&with_genres=${currentGenre}&primary_release_year=${currentYear}`;
            try { const res = await fetch(url); const data = await res.json(); renderGrid(data.results || [], grid); } catch(e) {}
            loading = false;
        }

        function renderGrid(items, grid) { items.forEach(m => { if(!m.poster_path) return; grid.innerHTML += `<div class="post-card" onclick="openModal(${m.id}, '${m.media_type||currentType}')"><div class="badge-rating">★ ${(m.vote_average||0).toFixed(1)}</div><img src="https://image.tmdb.org/t/p/w342${m.poster_path}"></div>`; }); }

        async function openModal(id, type) {
            window.currentMediaId = id; window.currentMediaType = type;
            document.getElementById('movieModal').style.display = 'block'; document.body.style.overflow = 'hidden';
            const res = await fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=${API_KEY}&language=id-ID&append_to_response=videos,credits`);
            const d = await res.json();
            
            document.getElementById('mTitle').innerText = d.title || d.name;
            document.getElementById('mLikeDisplay').innerText = `${Math.floor(d.vote_average * 1000).toLocaleString()} suka`;
            globalFullDesc = d.overview || "Sinopsis tidak tersedia.";
            renderSynopsis();
            
            // LOGIKA SOUNDTRACK: Tampilkan jika ada judul
            loadSoundtrack(d.title || d.name);

            const vids = (d.videos?.results || []).filter(v => v.site === 'YouTube').slice(0, 3);
            const track = document.getElementById('carouselTrack');
            track.innerHTML = vids.length ? vids.map(v => `<div class="carousel-slide"><iframe src="https://www.youtube.com/embed/${v.key}" class="w-full h-full" allowfullscreen></iframe></div>`).join('') : `<div class="carousel-slide"><iframe src="https://vidrock.net/embed/${type}/${id}" class="w-full h-full" allowfullscreen></iframe></div>`;
            
            document.getElementById('serverList').innerHTML = `<button class="server-btn" onclick="playVid('https://vidrock.net/embed/${type}/${id}')">Server 1</button><button class="server-btn" onclick="playVid('https://vidsrc.me/embed/${type}?tmdb=${id}')">Server 2</button>`;
            updateLibButtons(id);
        }

        // FUNGSI SOUNDTRACK: Muncul hanya jika ada data dan arahkan ke YouTube
        function loadSoundtrack(title) {
            const ostSection = document.getElementById('ostSection');
            const btnMusic = document.getElementById('btnPlayMusic');
            if (!title) { ostSection.classList.add('hidden'); return; }
            ostSection.classList.remove('hidden');
            btnMusic.onclick = () => window.open(`https://www.youtube.com/results?search_query=${encodeURIComponent(title + " official soundtrack")}`, '_blank');
        }

        function renderSynopsis() { const descEl = document.getElementById('mDesc'), toggleBtn = document.getElementById('mToggleBtn'); descEl.innerText = isExpanded ? globalFullDesc : globalFullDesc.substring(0, 90) + "..."; toggleBtn.classList.toggle('hidden', globalFullDesc.length <= 90); }
        function handleToggleDesc() { isExpanded = !isExpanded; renderSynopsis(); }
        function closeModal() { document.getElementById('movieModal').style.display = 'none'; document.body.style.overflow = 'auto'; }
        function openSearch() { document.getElementById('searchOverlay').style.display = 'block'; }
        function closeSearch() { document.getElementById('searchOverlay').style.display = 'none'; }
        function searchAction() { searchQuery = document.getElementById('searchInp').value; loadFeed(true); }

        function initFilters() {
            const yD = document.getElementById('yearDropdown');
            yD.innerHTML = '<div class="filter-item sticky-reset" onclick="setYear(\'\')">Semua Tahun</div>';
            for(let y=2026; y>=1990; y--) yD.innerHTML += `<div class="filter-item" onclick="setYear(${y})">${y}</div>`;
        }
        function setYear(y) { currentYear=y; closeD(); loadFeed(true); }
        function toggleFilter(e, id) { document.getElementById(id).style.display = 'block'; document.getElementById('filterOverlay').style.display = 'block'; }
        function closeD() { document.querySelectorAll('.filter-dropdown').forEach(d => d.style.display = 'none'); document.getElementById('filterOverlay').style.display = 'none'; }
        function switchTab(m, el) { document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active')); el.classList.add('active'); loadFeed(true); }
        function setupSwipe() {} // Opsional untuk touch drag
        function playVid(url) { document.getElementById('carouselTrack').innerHTML = `<div class="carousel-slide"><iframe src="${url}" class="w-full h-full" allowfullscreen></iframe></div>`; }
        function updateLibButtons(id) { 
            const isL = JSON.parse(localStorage.getItem('likes') || '[]').some(x=>x.id==id);
            document.getElementById('btnLikeModal').className = isL ? 'fa-solid fa-heart text-red-500 interaction-icon' : 'fa-regular fa-heart interaction-icon';
            document.getElementById('btnBookModal').className = 'fa-regular fa-bookmark interaction-icon';
        }
    </script>
</body>
</html>
