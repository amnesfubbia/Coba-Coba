<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Al-Jami' Digital Library</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --emerald: #059669; --dark: #064e3b; }
        body { background: #fdfdfd; font-family: 'Plus Jakarta Sans', sans-serif; color: #1e293b; }
        .arabic { font-family: 'Amiri', serif; font-size: 1.8rem; line-height: 3.5rem; text-align: right; color: var(--dark); background: #f0fdf4; padding: 20px; border-radius: 18px; margin: 15px 0; border: 1px solid #d1fae5; }
        .menu-card { background: white; border-radius: 24px; border: 1px solid #e2e8f0; transition: 0.3s; }
        .menu-card:hover { border-color: var(--emerald); transform: translateY(-3px); }
        .layer { position: fixed; inset: 0; background: white; z-index: 1000; transform: translateX(100%); transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1); overflow-y: auto; }
        .layer.active { transform: translateX(0); }
        .section-box { background: #f8fafc; border-radius: 24px; padding: 25px; border: 1px solid #e2e8f0; margin-bottom: 25px; }
        .section-box h4 { font-weight: 800; color: var(--emerald); text-transform: uppercase; margin-bottom: 15px; font-size: 14px; border-bottom: 2px solid #ddd; display: inline-block; }
        .step-num { width: 28px; height: 28px; background: var(--emerald); color: white; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; margin-right: 10px; }
    </style>
</head>
<body class="pb-10">

    <header class="p-8 sticky top-0 bg-white/95 backdrop-blur z-50 border-b-4 border-emerald-600">
        <h1 class="text-3xl font-black italic tracking-tighter text-slate-800">AL-JAMI'<span class="text-emerald-600">.</span></h1>
        <p class="text-[10px] font-bold text-slate-400 tracking-[3px] uppercase">Pusat Ilmu & Adab Anak Sholeh</p>
    </header>

    <main class="p-6 space-y-5">
        <div onclick="openLayer('sholat')" class="menu-card p-6 flex items-center gap-5 shadow-sm">
            <div class="w-14 h-14 bg-emerald-100 text-emerald-600 rounded-2xl flex items-center justify-center text-2xl"><i class="fa-solid fa-person-praying"></i></div>
            <div><h3 class="font-black text-sm uppercase italic">Panduan Sholat Lengkap</h3><p class="text-[10px] text-slate-400">Niat, Bacaan, & Macam-macam Sholat</p></div>
        </div>

        <div onclick="openLayer('akidah')" class="menu-card p-6 flex items-center gap-5 shadow-sm">
            <div class="w-14 h-14 bg-blue-100 text-blue-600 rounded-2xl flex items-center justify-center text-2xl"><i class="fa-solid fa-book"></i></div>
            <div><h3 class="font-black text-sm uppercase italic">Akidah & Akhlak</h3><p class="text-[10px] text-slate-400">Malaikat, Sifat Allah, & Adab Harian</p></div>
        </div>

        <div onclick="openLayer('nabi')" class="menu-card p-6 flex items-center gap-5 shadow-sm">
            <div class="w-14 h-14 bg-rose-100 text-rose-600 rounded-2xl flex items-center justify-center text-2xl"><i class="fa-solid fa-heart"></i></div>
            <div><h3 class="font-black text-sm uppercase italic">Sirah Nabawiyah</h3><p class="text-[10px] text-slate-400">25 Nabi & Kisah Rasulullah SAW</p></div>
        </div>

        <div onclick="openLayer('thaharah')" class="menu-card p-6 flex items-center gap-5 shadow-sm">
            <div class="w-14 h-14 bg-teal-100 text-teal-600 rounded-2xl flex items-center justify-center text-2xl"><i class="fa-solid fa-faucet-drip"></i></div>
            <div><h3 class="font-black text-sm uppercase italic">Thaharah (Bersuci)</h3><p class="text-[10px] text-slate-400">Cara Wudhu, Tayammum, & Najis</p></div>
        </div>
    </main>

    <div id="layer" class="layer no-scrollbar">
        <nav class="sticky top-0 bg-white border-b-2 border-emerald-500 p-6 flex items-center justify-between z-[1100]">
            <button onclick="closeLayer()" class="w-10 h-10 flex items-center justify-center bg-emerald-50 text-emerald-700 rounded-xl"><i class="fa-solid fa-arrow-left"></i></button>
            <span id="layerTitle" class="font-black italic text-xs uppercase tracking-widest text-emerald-600"></span>
            <div class="w-10"></div>
        </nav>
        <div id="layerBody" class="p-8 pb-40"></div>
    </div>

    <script>
        const content = {
            sholat: {
                title: "Panduan Sholat Lengkap",
                data: `
                <div class="section-box">
                    <h4>I. Syarat Sah Sholat</h4>
                    <ul class="text-xs space-y-2 list-disc pl-4">
                        <li>Suci dari hadats besar dan kecil.</li>
                        <li>Suci badan, pakaian, dan tempat dari najis.</li>
                        <li>Menutup aurat.</li>
                        <li>Menghadap Kiblat.</li>
                        <li>Telah masuk waktu sholat.</li>
                    </ul>
                </div>

                <div class="section-box">
                    <h4>II. Urutan Bacaan Sholat</h4>
                    <p class="text-[11px] font-bold mb-2">1. Niat (Contoh Subuh):</p>
                    <p class="arabic text-sm">أُصَلِّى فَرْضَ الصُّبْح رَكْعَتَيْنِ مُسْتَقْبِلَ الْقِبْلَةِ أَدَاءً لِلَّهِ تَعَالَى</p>
                    <p class="text-[10px] italic">"Usholli fardhos-subhi rok'ataini mustaqbilal qiblati adaa-an lillahi ta'ala."</p>
                    
                    <p class="text-[11px] font-bold mt-6 mb-2">2. Takbiratul Ihram:</p>
                    <p class="arabic">اللهُ أَكْبَرُ</p>
                    
                    <p class="text-[11px] font-bold mt-6 mb-2">3. Doa Iftitah (Sunnah):</p>
                    <p class="arabic">اللَّهُ أَكْبَرُ كَبِيرًا وَالْحَمْدُ لِلَّهِ كَثِيرًا...</p>

                    <p class="text-[11px] font-bold mt-6 mb-2">4. Bacaan Ruku':</p>
                    <p class="arabic">سُبْحَانَ رَبِّيَ الْعَظِيمِ وَبِحَمْدِهِ (3x)</p>

                    <p class="text-[11px] font-bold mt-6 mb-2">5. Bacaan Sujud:</p>
                    <p class="arabic">سُبْحَانَ رَبِّيَ الْأَعْلَى وَبِحَمْدِهِ (3x)</p>
                </div>

                <div class="section-box">
                    <h4>III. Macam-Macam Sholat</h4>
                    <p class="text-[11px] mb-2"><b>Sholat Fardu (5 Waktu):</b> Subuh, Dzuhur, Ashar, Maghrib, Isya.</p>
                    <p class="text-[11px] mb-2"><b>Sholat Sunnah:</b></p>
                    <ul class="text-[11px] space-y-1 pl-4 list-decimal">
                        <li><b>Dhuha:</b> Sholat pagi (pembuka rezeki).</li>
                        <li><b>Tahajjud:</b> Sholat malam setelah tidur.</li>
                        <li><b>Witir:</b> Sholat ganjil penutup malam.</li>
                        <li><b>Istikharah:</b> Sholat meminta pilihan terbaik.</li>
                        <li><b>Hajat:</b> Sholat saat ada keinginan besar.</li>
                    </ul>
                </div>`
            },
            akidah: {
                title: "Akidah & Akhlak Sholeh",
                data: `
                <div class="section-box">
                    <h4>10 Malaikat & Tugasnya</h4>
                    <div class="grid gap-2 text-[11px]">
                        <div class="p-3 bg-white border rounded-xl flex justify-between"><b>1. Jibril</b> <span>Menyampaikan Wahyu</span></div>
                        <div class="p-3 bg-white border rounded-xl flex justify-between"><b>2. Mikail</b> <span>Membagi Rezeki</span></div>
                        <div class="p-3 bg-white border rounded-xl flex justify-between"><b>3. Israfil</b> <span>Meniup Sangkakala</span></div>
                        <div class="p-3 bg-white border rounded-xl flex justify-between"><b>4. Izrail</b> <span>Mencabut Nyawa</span></div>
                        <div class="p-3 bg-white border rounded-xl flex justify-between"><b>5-6. Raqib & Atid</b> <span>Mencatat Amal</span></div>
                        <div class="p-3 bg-white border rounded-xl flex justify-between"><b>7-8. Munkar & Nakir</b> <span>Bertanya di Kubur</span></div>
                        <div class="p-3 bg-white border rounded-xl flex justify-between"><b>9. Malik</b> <span>Menjaga Neraka</span></div>
                        <div class="p-3 bg-white border rounded-xl flex justify-between"><b>10. Ridwan</b> <span>Menjaga Surga</span></div>
                    </div>
                </div>

                <div class="section-box">
                    <h4>Adab Anak Sholeh</h4>
                    <ul class="text-xs space-y-3">
                        <li class="p-3 bg-emerald-50 rounded-lg"><b>Adab ke Orang Tua:</b> Berbicara lembut, mendoakan setiap sholat, membantu pekerjaan rumah.</li>
                        <li class="p-3 bg-emerald-50 rounded-lg"><b>Adab Makan:</b> Cuci tangan, duduk, baca Bismillah, makan dengan tangan kanan.</li>
                        <li class="p-3 bg-emerald-50 rounded-lg"><b>Adab Belajar:</b> Berdoa sebelum mulai, menghormati Guru (Ustadz/Ustadzah).</li>
                    </ul>
                </div>`
            },
            nabi: {
                title: "Sirah Nabawiyah",
                data: `
                <div class="section-box">
                    <h4>Sifat Wajib Rasul</h4>
                    <div class="grid grid-cols-2 gap-2 text-[11px]">
                        <div class="p-3 border rounded-xl"><b>Siddiq:</b> Jujur</div>
                        <div class="p-3 border rounded-xl"><b>Amanah:</b> Terpercaya</div>
                        <div class="p-3 border rounded-xl"><b>Tabligh:</b> Menyampaikan</div>
                        <div class="p-3 border rounded-xl"><b>Fathanah:</b> Cerdas</div>
                    </div>
                </div>

                <div class="section-box">
                    <h4>Mukjizat 5 Rasul Ulul Azmi</h4>
                    <ul class="text-xs space-y-4">
                        <li><b>Nabi Nuh AS:</b> Bahtera (Kapal) Raksasa.</li>
                        <li><b>Nabi Ibrahim AS:</b> Tidak hangus dibakar api.</li>
                        <li><b>Nabi Musa AS:</b> Membelah laut dengan tongkat.</li>
                        <li><b>Nabi Isa AS:</b> Menyembuhkan buta & menghidupkan mati.</li>
                        <li><b>Nabi Muhammad SAW:</b> Al-Qur'anul Karim.</li>
                    </ul>
                </div>`
            },
            thaharah: {
                title: "Tata Cara Bersuci",
                data: `
                <div class="section-box">
                    <h4>Tata Cara Wudhu (Sesuai Sunnah)</h4>
                    <ol class="text-xs space-y-2 list-decimal pl-4">
                        <li>Membaca Basmalah & Niat.</li>
                        <li>Mencuci kedua telapak tangan.</li>
                        <li>Berkumur-kumur (Madmadah).</li>
                        <li>Menghirup air ke hidung (Istinsyaq).</li>
                        <li>Membasuh muka (seluruhnya).</li>
                        <li>Membasuh kedua tangan sampai siku.</li>
                        <li>Mengusap sebagian kepala/rambut.</li>
                        <li>Membasuh kedua kaki sampai mata kaki.</li>
                        <li>Tertib & Berdoa setelah wudhu.</li>
                    </ol>
                </div>`
            }
        };

        function openLayer(key) {
            const data = content[key];
            document.getElementById('layerTitle').innerText = data.title;
            document.getElementById('layerBody').innerHTML = data.data;
            document.getElementById('layer').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLayer() {
            document.getElementById('layer').classList.remove('active');
            document.body.style.overflow = 'auto';
        }
    </script>
</body>
</html>
