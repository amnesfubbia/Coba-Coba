addEntry({id:"syarah-hadis-niat", menu:4, material:"syarah-hadis", type:"article", title:"Syarah Hadis Niat", summary:"Penjelasan hadis \"Innamal a'malu bin-niyyat\" — setiap amal tergantung niatnya.",
  body:[
    {h:"Teks hadis", p:["Rasulullah ﷺ bersabda: \"Sesungguhnya setiap amal tergantung niatnya, dan setiap orang akan mendapat balasan sesuai apa yang diniatkannya.\" (HR. Bukhari no. 1, Muslim no. 1907)."]},
    {h:"Kandungan", list:["Niat menentukan nilai dan kategori suatu amal — ibadah atau kebiasaan biasa.","Amal yang sama bisa bernilai berbeda tergantung niat pelakunya.","Hadis ini menjadi kaidah pembuka dalam banyak kitab hadis karena mencakup seluruh bab agama."]},
    {h:"Pelajaran", p:["Setiap Muslim dianjurkan meluruskan niat sebelum beramal, menjadikan setiap perbuatan sebagai sarana ibadah dan mendekatkan diri kepada Allah."]}
  ],
  sources:["bukhari","muslim"], related:["syarah-hadis"], tags:["hadis","syarah"]});
addEntry({id:"syarah-hadis-rukun-islam", menu:4, material:"syarah-hadis", type:"article", title:"Syarah Hadis Rukun Islam", summary:"Penjelasan hadis Jibril tentang lima perkara pondasi Islam.",
  body:[
    {h:"Teks hadis", p:["Rasulullah ﷺ bersabda: \"Islam dibangun di atas lima perkara: bersaksi bahwa tiada tuhan selain Allah dan Muhammad adalah utusan Allah, mendirikan shalat, menunaikan zakat, berpuasa Ramadan, dan haji ke Baitullah bagi yang mampu.\" (HR. Bukhari no. 8, Muslim no. 16)."]},
    {h:"Kandungan", list:["Kelima perkara ini adalah pondasi utama keislaman, diibaratkan tiang penyangga bangunan.","Syahadat sebagai gerbang; shalat, zakat, dan puasa sebagai ibadah rutin; haji sebagai puncak ibadah fisik dan harta bagi yang mampu."]},
    {h:"Pelajaran", p:["Menjaga kelima rukun ini secara utuh adalah wujud keislaman yang sempurna, sekaligus kerangka utama struktur menu aplikasi ini."]}
  ],
  sources:["bukhari","muslim"], related:["syarah-hadis","syahadat","shalat","zakat","puasa","haji"], tags:["hadis","syarah"]});
addEntry({id:"syarah-hadis-larangan-marah", menu:4, material:"syarah-hadis", type:"article", title:"Syarah Hadis Larangan Marah", summary:"Penjelasan hadis \"La taghdab\" — nasihat Rasulullah ﷺ agar tidak mudah marah.",
  body:[
    {h:"Teks hadis", p:["Seorang sahabat meminta nasihat kepada Rasulullah ﷺ, beliau bersabda: \"Janganlah engkau marah,\" diulang beberapa kali. (HR. Bukhari, Kitab al-Adab)."]},
    {h:"Kandungan", list:["Marah yang tidak terkendali menjadi pintu masuk banyak keburukan: ucapan kasar, kekerasan, dan penyesalan.","Menahan marah adalah tanda kekuatan diri sejati, sebagaimana disebutkan bahwa orang kuat bukanlah yang menang bergulat, melainkan yang mampu mengendalikan diri saat marah (HR. Bukhari no. 6114)."]},
    {h:"Pelajaran", p:["Hadis ini mengajarkan pengendalian emosi sebagai bagian penting akhlak seorang Muslim dalam kehidupan sehari-hari."]}
  ],
  sources:["bukhari"], related:["syarah-hadis","akhlak"], tags:["hadis","syarah","akhlak"]});

/* ---------- MENU 05 — FIQIH: WARIS & FARAIDH ---------- */
addEntry({id:"ahli-waris-utama", menu:5, material:"waris", type:"article", title:"Ahli Waris Utama", summary:"Golongan yang berhak menerima warisan menurut ketentuan syariat.",
  body:[
    {h:"Ahli waris laki-laki", list:["Anak laki-laki, cucu laki-laki dari anak laki-laki.","Ayah, kakek dari jalur ayah.","Suami.","Saudara laki-laki (kandung, seayah, seibu) beserta keturunannya.","Paman dari jalur ayah beserta keturunannya."]},
    {h:"Ahli waris perempuan", list:["Anak perempuan, cucu perempuan dari anak laki-laki.","Ibu, nenek dari jalur ayah atau ibu.","Istri.","Saudara perempuan (kandung, seayah, seibu)."]},
    {h:"Catatan", p:["Jika seluruh ahli waris di atas ada, yang pasti mendapat bagian adalah: ayah, ibu, suami/istri, anak laki-laki, dan anak perempuan — sisanya bisa mahjub (terhalang) tergantung susunan keluarga."]}
  ],
  sources:["quran","app"], related:["waris","furudh-muqaddarah","hijab-waris"], tags:["fiqih","waris"]});
addEntry({id:"furudh-muqaddarah", menu:5, material:"waris", type:"article", title:"Furudh Muqaddarah (Bagian Tetap)", summary:"Enam kadar bagian warisan yang telah ditetapkan dalam Al-Qur'an.",
  body:[
    {h:"Enam kadar bagian", list:["1/2 — misalnya: anak perempuan tunggal, saudara perempuan kandung tunggal.","1/4 — suami (jika ada anak), istri (jika tidak ada anak).","1/8 — istri (jika ada anak).","2/3 — dua anak perempuan atau lebih (tanpa saudara laki-laki).","1/3 — ibu (jika tidak ada anak/cucu dan tidak ada dua saudara atau lebih).","1/6 — ayah (jika ada anak laki-laki), ibu (jika ada anak), nenek, cucu perempuan bersama anak perempuan."]},
    {h:"Dasar", p:["Ketentuan ini disebutkan rinci dalam QS. An-Nisa' 4:11-12, dikenal sebagai ayat mawaris."]}
  ],
  sources:["quran"], related:["waris","ahli-waris-utama"], tags:["fiqih","waris"]});
addEntry({id:"ashabah", menu:5, material:"waris", type:"article", title:"Ashabah", summary:"Ahli waris yang menerima sisa harta setelah bagian pasti (furudh) dibagikan.",
  body:[
    {h:"Pengertian", p:["Ashabah adalah ahli waris yang tidak memiliki kadar bagian tetap, melainkan menerima sisa harta setelah ashabul furudh mengambil bagiannya — bisa juga menerima seluruh harta jika tidak ada ahli waris lain."]},
    {h:"Contoh", list:["Anak laki-laki menjadi ashabah binafsihi (dengan sendirinya).","Anak perempuan bisa menjadi ashabah bersama anak laki-laki (ashabah bil-ghair).","Jika tidak ada ashabah sama sekali dan masih ada sisa harta, sisa dikembalikan kepada ahli waris furudh (kecuali suami/istri) — disebut radd."]}
  ],
  sources:["app"], related:["waris","ahli-waris-utama","furudh-muqaddarah"], tags:["fiqih","waris"]});
addEntry({id:"hijab-waris", menu:5, material:"waris", type:"article", title:"Hijab (Penghalang Waris)", summary:"Kondisi ketika seorang ahli waris terhalang menerima warisan karena ada ahli waris lain yang lebih dekat/utama.",
  body:[
    {h:"Jenis hijab", list:["Hijab hirman: terhalang total — misalnya kakek terhalang oleh ayah.","Hijab nuqshan: bagian berkurang, tidak hilang sama sekali — misalnya bagian ibu berkurang dari 1/3 menjadi 1/6 karena ada anak."]},
    {h:"Contoh", p:["Saudara kandung terhalang oleh anak laki-laki atau ayah. Cucu dari anak laki-laki terhalang oleh anak laki-laki yang masih hidup."]},
    {h:"Catatan", p:["Perhitungan waris yang tepat memerlukan rincian susunan keluarga lengkap; disarankan berkonsultasi dengan ahli faraidh atau lembaga terpercaya untuk kasus nyata."]}
  ],
  sources:["app"], related:["waris","ahli-waris-utama"], tags:["fiqih","waris"]});

/* ---------- MENU 05 — FIQIH: MAQASHID SYARIAH ---------- */
addEntry({id:"hifz-din", menu:5, material:"maqashid", type:"article", title:"Hifz Din (Menjaga Agama)", summary:"Tujuan syariat pertama: memelihara dan melindungi agama.",
  body:[{h:"Penjelasan", p:["Hifz din diwujudkan lewat syariat akidah (rukun iman), ibadah (rukun Islam), serta hukum yang melindungi kebebasan menjalankan agama dan mencegah kemurtadan/penistaan yang merusak sendi keimanan umat."]}],
  sources:["app"], related:["maqashid-syariah"], tags:["fiqih","maqashid"]});
addEntry({id:"hifz-nafs", menu:5, material:"maqashid", type:"article", title:"Hifz Nafs (Menjaga Jiwa)", summary:"Tujuan syariat kedua: memelihara keselamatan nyawa dan kehormatan manusia.",
  body:[{h:"Penjelasan", p:["Diwujudkan lewat larangan membunuh, hukum qishash, kewajiban menjaga kesehatan, serta anjuran menyelamatkan nyawa dalam kondisi darurat. QS. Al-Ma'idah 5:32 menegaskan besarnya nilai satu nyawa manusia."]}],
  sources:["quran","app"], related:["maqashid-syariah"], tags:["fiqih","maqashid"]});
addEntry({id:"hifz-aql", menu:5, material:"maqashid", type:"article", title:"Hifz Aql (Menjaga Akal)", summary:"Tujuan syariat ketiga: memelihara akal sebagai alat berpikir dan bertanggung jawab.",
  body:[{h:"Penjelasan", p:["Diwujudkan lewat larangan khamr dan segala yang memabukkan/merusak akal, serta anjuran menuntut ilmu untuk mengembangkan akal secara sehat dan bermanfaat."]}],
  sources:["app"], related:["maqashid-syariah"], tags:["fiqih","maqashid"]});
addEntry({id:"hifz-nasl", menu:5, material:"maqashid", type:"article", title:"Hifz Nasl (Menjaga Keturunan)", summary:"Tujuan syariat keempat: memelihara kehormatan, nasab, dan kelangsungan keturunan.",
  body:[{h:"Penjelasan", p:["Diwujudkan lewat syariat pernikahan, larangan zina, serta hukum yang menjaga kejelasan nasab dan hak-hak anak dalam keluarga."]}],
  sources:["app"], related:["maqashid-syariah","fiqih-keluarga"], tags:["fiqih","maqashid"]});
addEntry({id:"hifz-mal", menu:5, material:"maqashid", type:"article", title:"Hifz Mal (Menjaga Harta)", summary:"Tujuan syariat kelima: memelihara kepemilikan harta secara sah dan adil.",
  body:[{h:"Penjelasan", p:["Diwujudkan lewat larangan mencuri, riba, dan penipuan, serta syariat muamalah yang adil seperti jual-beli, zakat, dan waris untuk menjaga peredaran harta yang halal."]}],
  sources:["app"], related:["maqashid-syariah","fiqih-muamalah","waris"], tags:["fiqih","maqashid"]});

/* ---------- MENU 05 — FIQIH KONTEMPORER ---------- */
addEntry({id:"bank-syariah-riba", menu:5, material:"fiqih-kontemporer", type:"article", title:"Perbankan Syariah & Riba", summary:"Prinsip bebas riba dalam sistem keuangan modern serta alternatif akad syariah.",
  body:[
    {h:"Larangan riba", p:["Al-Qur'an tegas melarang riba (QS. Al-Baqarah 2:275-279). Bunga tetap atas pinjaman umumnya dikategorikan sebagai riba oleh mayoritas ulama kontemporer."]},
    {h:"Alternatif akad", list:["Mudharabah — bagi hasil antara pemilik modal dan pengelola.","Murabahah — jual-beli dengan margin yang disepakati di awal.","Ijarah — sewa-menyewa aset atau jasa.","Musyarakah — kerja sama modal bersama dengan bagi hasil sesuai porsi."]},
    {h:"Catatan", p:["Praktik teknis perbankan syariah beragam antar lembaga; disarankan mempelajari akad spesifik suatu produk sebelum menggunakannya."]}
  ],
  sources:["quran","app"], related:["fiqih-kontemporer","fiqih-muamalah"], tags:["fiqih","kontemporer","ekonomi"]});
addEntry({id:"asuransi-syariah", menu:5, material:"fiqih-kontemporer", type:"article", title:"Asuransi Syariah (Takaful)", summary:"Konsep tolong-menolong menanggung risiko sebagai alternatif asuransi konvensional.",
  body:[
    {h:"Konsep dasar", p:["Takaful berbasis prinsip ta'awun (tolong-menolong) dan tabarru' (hibah/donasi) — peserta saling menanggung risiko lewat dana bersama, bukan jual-beli risiko seperti asuransi konvensional."]},
    {h:"Perbedaan dengan asuransi konvensional", list:["Menghindari unsur riba, gharar (ketidakjelasan), dan maisir (spekulasi/judi) yang dikhawatirkan ada pada sebagian skema konvensional.","Surplus dana dikelola dan sebagian dapat dibagikan kembali kepada peserta sesuai akad."]},
    {h:"Catatan", p:["Sebagian ulama kontemporer masih berbeda pandangan mengenai detail teknis tertentu; pastikan produk memiliki pengawasan Dewan Syariah yang kredibel."]}
  ],
  sources:["app"], related:["fiqih-kontemporer","bank-syariah-riba"], tags:["fiqih","kontemporer","ekonomi"]});
addEntry({id:"jual-beli-online", menu:5, material:"fiqih-kontemporer", type:"article", title:"Jual-Beli Online", summary:"Ketentuan fiqih muamalah yang diterapkan pada transaksi e-commerce.",
  body:[
    {h:"Prinsip", list:["Barang/jasa harus jelas (tidak gharar): deskripsi, foto, dan spesifikasi harus akurat.","Akad jual-beli terjadi saat kesepakatan harga dan barang, meski pembayaran dan pengiriman menyusul.","Hak khiyar (membatalkan) tetap berlaku jika barang tidak sesuai deskripsi."]},
    {h:"Isu kontemporer", p:["Dropshipping, pre-order, dan cash on delivery pada dasarnya dibolehkan selama prinsip kejelasan dan kejujuran dipenuhi; ulama mengingatkan agar penjual benar-benar menguasai atau memiliki hak jual atas barang yang ditawarkan."]}
  ],
  sources:["app"], related:["fiqih-kontemporer","fiqih-muamalah"], tags:["fiqih","kontemporer","ekonomi"]});
addEntry({id:"vaksinasi-medis", menu:5, material:"fiqih-kontemporer", type:"article", title:"Vaksinasi & Tindakan Medis", summary:"Pandangan fiqih atas vaksinasi dan ikhtiar medis modern.",
  body:[
    {h:"Kaidah umum", p:["Berobat termasuk ikhtiar yang dianjurkan dalam Islam: \"Berobatlah, karena Allah tidak menurunkan penyakit kecuali menurunkan pula obatnya.\" (HR. Bukhari no. 5678, Tirmidzi no. 2038)."]},
    {h:"Vaksinasi", p:["Mayoritas lembaga fatwa kontemporer membolehkan vaksinasi sebagai bentuk pencegahan penyakit (menjaga jiwa/hifz nafs), termasuk saat komposisinya diperdebatkan, dengan mempertimbangkan kaidah darurat dan maslahat yang lebih besar."]},
    {h:"Catatan", p:["Kasus spesifik (misalnya kandungan bahan tertentu) tetap memerlukan kajian dari lembaga fatwa resmi setempat."]}
  ],
  sources:["bukhari","tirmidzi","app"], related:["fiqih-kontemporer","hifz-nafs"], tags:["fiqih","kontemporer","kesehatan"]});

/* ---------- MENU 08 — SIRAH & SEJARAH ISLAM ---------- */
addEntry({id:"jazirah-arab-pra-islam", menu:8, material:"masa-sebelum-islam", type:"article", title:"Jazirah Arab Sebelum Islam", summary:"Kondisi sosial, ekonomi, dan kepercayaan bangsa Arab pada masa jahiliyah.",
  body:[
    {h:"Kondisi sosial", list:["Masyarakat suku (qabilah) dengan sistem kesukuan yang kuat; sering terjadi peperangan antarsuku.","Sebagian tradisi buruk: perbudakan, penguburan bayi perempuan hidup-hidup, dan perjudian.","Sebagian nilai baik tetap ada: kedermawanan, keberanian, dan kefasihan bersastra (syair)."]},
    {h:"Kepercayaan", p:["Mayoritas menyembah berhala di sekitar Ka'bah, meski sebagian kecil (hanif) masih memegang ajaran tauhid warisan Nabi Ibrahim. Makkah menjadi pusat perdagangan dan ziarah berhala Jazirah Arab."]}
  ],
  sources:["sirah","app"], related:["masa-sebelum-islam","tahun-gajah"], tags:["sejarah","sirah"]});
addEntry({id:"tahun-gajah", menu:8, material:"masa-sebelum-islam", type:"article", title:"Tahun Gajah", summary:"Tahun kelahiran Nabi Muhammad ﷺ, ditandai peristiwa gagalnya pasukan gajah Abrahah menyerang Ka'bah.",
  body:[
    {h:"Peristiwa", p:["Abrahah, gubernur Yaman yang beragama Nasrani, berusaha menghancurkan Ka'bah dengan pasukan bergajah. Allah menggagalkan serangan itu dengan mengirim burung Ababil yang melempari pasukan dengan batu, sebagaimana diabadikan dalam QS. Al-Fil (105)."]},
    {h:"Kaitan sejarah", p:["Peristiwa ini terjadi pada tahun yang sama dengan kelahiran Nabi Muhammad ﷺ (±570 M), sehingga tahun tersebut dikenal sebagai 'Tahun Gajah' (Aam al-Fil) dalam penanggalan Arab pra-Hijriah."]}
  ],
  sources:["quran","sirah"], related:["masa-sebelum-islam","nabi-muhammad"], tags:["sejarah","sirah"]});
addEntry({id:"as-sabiqun-awwalun", menu:8, material:"sahabat", type:"article", title:"As-Sabiqun al-Awwalun", summary:"Golongan pertama yang memeluk Islam pada masa awal dakwah di Makkah.",
  body:[
    {h:"Tokoh utama", list:["Khadijah binti Khuwailid — wanita pertama yang beriman.","Ali bin Abi Thalib — anak-anak pertama yang beriman.","Zaid bin Haritsah — bekas budak pertama yang beriman.","Abu Bakar ash-Shiddiq — orang merdeka dewasa pertama yang beriman.","Menyusul: Utsman bin Affan, Zubair bin Awwam, Sa'ad bin Abi Waqqash, Abdurrahman bin Auf, Thalhah bin Ubaidillah, dan lainnya."]},
    {h:"Keutamaan", p:["Allah memuji golongan ini dalam QS. At-Taubah 9:100 sebagai orang-orang yang diridai Allah karena keimanan mereka yang mendahului orang lain."]}
  ],
  sources:["quran","sirah"], related:["tokoh","khadijah","abu-bakar"], tags:["sejarah","sirah","sahabat"]});
addEntry({id:"muhajirin-ansar", menu:8, material:"sahabat", type:"article", title:"Muhajirin & Anshar", summary:"Dua kelompok sahabat yang mempersatukan Islam pasca-hijrah ke Madinah.",
  body:[
    {h:"Muhajirin", p:["Sahabat yang berhijrah dari Makkah ke Madinah, meninggalkan harta dan kampung halaman demi mempertahankan akidah."]},
    {h:"Anshar", p:["Penduduk asli Madinah yang menyambut dan menolong kaum Muhajirin — dari sinilah istilah Anshar (penolong) berasal."]},
    {h:"Ukhuwah", p:["Rasulullah ﷺ mempersaudarakan Muhajirin dan Anshar secara resmi, menjadi teladan persaudaraan lintas latar belakang yang diabadikan dalam sejarah Islam."]}
  ],
  sources:["sirah"], related:["baiat-aqabah","tokoh"], tags:["sejarah","sirah"]});
addEntry({id:"piagam-madinah", menu:8, material:"peristiwa", type:"event-article", title:"Piagam Madinah", summary:"Konstitusi tertulis pertama yang mengatur hubungan antar-kelompok di Madinah pasca-hijrah.",
  body:[
    {h:"Latar belakang", p:["Setelah hijrah, Nabi ﷺ menyusun kesepakatan tertulis yang mengatur hak dan kewajiban kaum Muslimin (Muhajirin-Anshar) serta kelompok non-Muslim (termasuk sejumlah suku Yahudi) yang tinggal di Madinah."]},
    {h:"Isi pokok", list:["Mengakui Madinah sebagai satu komunitas politik bersama (ummah) di bawah kepemimpinan Nabi ﷺ.","Menjamin kebebasan beragama bagi masing-masing kelompok.","Mewajibkan seluruh pihak saling membela Madinah dari serangan luar."]},
    {h:"Signifikansi", p:["Piagam ini dianggap sejarawan sebagai salah satu dokumen tata negara tertulis paling awal yang mengatur kehidupan majemuk dalam satu wilayah."]}
  ],
  sources:["sirah","app"], related:["peristiwa-sejarah","muhajirin-ansar"], tags:["sejarah","sirah"]});
addEntry({id:"andalusia-islam", menu:8, material:"sejarah-islam", type:"article", title:"Islam di Andalusia (Spanyol)", summary:"±711–1492 M — masa kejayaan peradaban Islam di Semenanjung Iberia.",
  body:[
    {h:"Perkembangan", p:["Islam masuk ke Andalusia dimulai penaklukan Thariq bin Ziyad (92 H/711 M). Kordoba berkembang menjadi salah satu pusat ilmu, seni, dan arsitektur terbesar dunia pada masanya, dengan perpustakaan besar dan universitas."]},
    {h:"Warisan", list:["Arsitektur: Masjid Agung Kordoba, Istana Alhambra di Granada.","Ilmu: penerjemahan karya Yunani-Arab ke Latin yang memicu Renaisans Eropa.","Ilmuwan: Ibnu Rusyd (Averroes), Az-Zahrawi, dan banyak lainnya berkarya di sini."]},
    {h:"Akhir", p:["Kekuasaan Islam di Andalusia berakhir tahun 1492 M dengan jatuhnya Granada, kesultanan Muslim terakhir di kawasan tersebut."]}
  ],
  sources:["app"], related:["sejarah-islam","dinasti-islam","ibnu-rusyd"], tags:["sejarah","peradaban"]});
addEntry({id:"akhir-khilafah-utsmani", menu:8, material:"sejarah-islam", type:"article", title:"Berakhirnya Khilafah Utsmani", summary:"1924 M — penghapusan resmi lembaga kekhalifahan setelah runtuhnya Kesultanan Utsmani.",
  body:[
    {h:"Latar belakang", p:["Kesultanan Utsmani melemah setelah kekalahan dalam Perang Dunia I. Pada 3 Maret 1924, Majelis Nasional Turki di bawah Mustafa Kemal Ataturk secara resmi menghapuskan lembaga khilafah yang telah berlangsung berabad-abad."]},
    {h:"Dampak", p:["Peristiwa ini menandai berakhirnya lembaga kekhalifahan yang secara historis pernah menyatukan sebagian besar dunia Islam, dan menjadi salah satu pemicu munculnya berbagai gerakan pembaruan dan pemikiran politik Islam modern."]}
  ],
  sources:["app"], related:["sejarah-islam","dinasti-islam"], tags:["sejarah"]});

  body:[
    {h:"Pengantar", p:["Rumusan \"20 sifat wajib\" adalah ringkasan yang disusun ulama ilmu kalam (Asy'ariyah/Maturidiyah) untuk memudahkan pembelajaran tauhid, bukan angka baku dari Al-Qur'an dan hadis secara langsung. Sebagian ulama (terutama tradisi salaf) memilih pendekatan lain: menetapkan seluruh sifat Allah sebagaimana disebutkan Al-Qur'an dan sunnah tanpa membatasi jumlahnya. Kedua pendekatan sama-sama menegaskan kesempurnaan mutlak Allah."]},
    {h:"20 Sifat (klasifikasi kalam klasik)", list:["Wujud (ada)","Qidam (terdahulu)","Baqa' (kekal)","Mukhalafatu lil hawadits (berbeda dari makhluk)","Qiyamuhu binafsihi (berdiri sendiri)","Wahdaniyah (esa)","Qudrat (berkuasa)","Iradat (berkehendak)","Ilmu (mengetahui)","Hayat (hidup)","Sama' (mendengar)","Bashar (melihat)","Kalam (berfirman)","Qadiran (Yang Berkuasa)","Muridan (Yang Berkehendak)","'Aliman (Yang Mengetahui)","Hayyan (Yang Hidup)","Sami'an (Yang Mendengar)","Bashiran (Yang Melihat)","Mutakalliman (Yang Berfirman)"]}
  ],
  sources:["app"], related:["sifat-allah","sifat-20-mustahil"], tags:["akidah","tauhid"]});
addEntry({id:"sifat-20-mustahil", menu:2, material:"iman-kepada-allah", sub:"sifat", type:"article", title:"20 Sifat Mustahil bagi Allah", summary:"Sifat kekurangan yang mustahil ada pada Allah — lawan dari 20 sifat wajib.",
  body:[
    {h:"Pengertian", p:["Setiap sifat wajib memiliki lawan yang mustahil disandang Allah, karena bertentangan dengan kesempurnaan-Nya, misalnya lawan dari \"Wujud\" (ada) adalah \"'Adam\" (tiada)."]},
    {h:"Daftar", list:["'Adam (tiada)","Huduts (baru)","Fana' (binasa)","Mumatsalatu lil hawadits (serupa makhluk)","Ihtiyaju lighairih (butuh pada selain-Nya)","Ta'addud (berbilang)","'Ajz (lemah)","Karahah (terpaksa)","Jahl (bodoh)","Maut (mati)","Shamam (tuli)","'Umyu (buta)","Bukmu (bisu)","Kaunuhu 'ajizan (Yang Lemah)","Kaunuhu karihan (Yang Terpaksa)","Kaunuhu jahilan (Yang Bodoh)","Kaunuhu mayyitan (Yang Mati)","Kaunuhu ashamma (Yang Tuli)","Kaunuhu a'ma (Yang Buta)","Kaunuhu abkam (Yang Bisu)"]}
  ],
  sources:["app"], related:["sifat-20-wajib"], tags:["akidah","tauhid"]});
addEntry({id:"sifat-jaiz-allah", menu:2, material:"iman-kepada-allah", sub:"sifat", type:"article", title:"Sifat Jaiz bagi Allah", summary:"Satu sifat kebebasan mutlak Allah dalam menciptakan atau tidak menciptakan sesuatu.",
  body:[
    {h:"Pengertian", p:["Fi'lu kulli mumkinin au tarkuh — Allah bebas melakukan atau tidak melakukan segala sesuatu yang mungkin terjadi, sesuai kehendak-Nya semata, tanpa ada yang berhak memaksa atau mendikte-Nya."]},
    {h:"Contoh", p:["Allah berkehendak menciptakan langit dan bumi dalam enam masa, padahal Dia mampu menciptakannya dalam sekejap — menunjukkan kebebasan-Nya menentukan cara dan waktu sesuai hikmah-Nya."]}
  ],
  sources:["app"], related:["sifat-20-wajib"], tags:["akidah","tauhid"]});

/* ---------- MENU 02 — IMAN KEPADA RASUL: Sifat Mustahil & Jaiz ---------- */
addEntry({id:"sifat-mustahil-rasul", menu:2, material:"iman-kepada-rasul", type:"article", title:"Sifat Mustahil Rasul", summary:"Sifat kekurangan yang mustahil dimiliki para rasul, kebalikan dari sifat wajibnya.",
  body:[{h:"Daftar", list:["Kizb — dusta (lawan Siddiq).","Khianat — tidak amanah (lawan Amanah).","Kitman — menyembunyikan wahyu (lawan Tabligh).","Baladah — bodoh/dungu (lawan Fathanah)."]}],
  sources:["app"], related:["sifat-rasul"], tags:["akidah","rasul"]});
addEntry({id:"sifat-jaiz-rasul", menu:2, material:"iman-kepada-rasul", type:"article", title:"Sifat Jaiz Rasul", summary:"Sifat manusiawi yang boleh ada pada rasul selama tidak mengurangi kedudukan kenabian.",
  body:[{h:"Pengertian", p:["Al-a'radhul basyariyah — para rasul tetap manusia biasa yang bisa makan, minum, sakit, menikah, dan lelah, selama tidak mengurangi kesempurnaan risalah yang mereka bawa."]},
        {h:"Dalil", p:["QS. Al-Furqan 25:20 — \"Dan Kami tidak mengutus rasul-rasul sebelummu, melainkan mereka sungguh memakan makanan dan berjalan di pasar-pasar.\""]}],
  sources:["quran"], related:["sifat-rasul","sifat-mustahil-rasul"], tags:["akidah","rasul"]});

/* ---------- MENU 02 — QADA & QADAR: Takdir Mubram & Muallaq ---------- */
addEntry({id:"takdir-mubram", menu:2, material:"iman-kepada-qada-qadar", type:"article", title:"Takdir Mubram", summary:"Ketetapan Allah yang bersifat pasti dan tidak dapat diubah oleh usaha manusia.",
  body:[{h:"Pengertian", p:["Takdir mubram adalah ketetapan mutlak, seperti waktu kematian, jenis kelamin saat lahir, dan hari kiamat — sudah tertulis di Lauhul Mahfuzh dan pasti terjadi."]}],
  sources:["app"], related:["iman-kepada-qada-qadar","takdir-muallaq"], tags:["akidah","takdir"]});
addEntry({id:"takdir-muallaq", menu:2, material:"iman-kepada-qada-qadar", type:"article", title:"Takdir Muallaq", summary:"Ketetapan Allah yang keterjadiannya terkait dengan usaha/ikhtiar manusia.",
  body:[
    {h:"Pengertian", p:["Takdir muallaq adalah ketetapan yang digantungkan pada sebab, seperti rezeki yang terkait usaha, atau kesehatan yang terkait pola hidup — mendorong manusia tetap berikhtiar meski segalanya dalam ilmu Allah."]},
    {h:"Dalil", p:["\"Sesungguhnya Allah tidak mengubah keadaan suatu kaum sehingga mereka mengubah keadaan yang ada pada diri mereka sendiri.\" (QS. Ar-Ra'd 13:11)."]}
  ],
  sources:["quran"], related:["takdir-mubram","iman-kepada-qada-qadar"], tags:["akidah","takdir"]});

/* ---------- AKIDAH DASAR: Syirik, Kufur, Nifaq ---------- */
addEntry({id:"syirik", menu:2, material:"iman-kepada-allah", sub:"tauhid", type:"article", title:"Syirik", summary:"Menyekutukan Allah dengan sesuatu selain-Nya — dosa terbesar yang bertentangan dengan tauhid.",
  body:[
    {h:"Jenis", list:["Syirik besar — menyembah atau meyakini sesuatu selain Allah setara dengan-Nya, mengeluarkan dari Islam.","Syirik kecil — seperti riya (beramal karena ingin dilihat orang), tidak mengeluarkan dari Islam namun tetap dosa besar."]},
    {h:"Dalil", p:["\"Sesungguhnya Allah tidak akan mengampuni dosa syirik, dan Dia mengampuni dosa selain itu bagi siapa yang dikehendaki-Nya.\" (QS. An-Nisa' 4:48)."]}
  ],
  sources:["quran"], related:["tauhid","tauhid-uluhiyah"], tags:["akidah","syirik"]});
addEntry({id:"kufur", menu:2, material:"iman-kepada-allah", sub:"tauhid", type:"article", title:"Kufur", summary:"Mengingkari keimanan kepada Allah, rasul-Nya, atau ajaran pokok agama.",
  body:[{h:"Jenis", list:["Kufur akbar — mengeluarkan dari Islam, seperti mengingkari rukun iman secara terang-terangan.","Kufur ashghar (kufur nikmat) — tidak mengeluarkan dari Islam, seperti tidak mensyukuri nikmat."]}],
  sources:["app"], related:["tauhid","syirik"], tags:["akidah"]});
addEntry({id:"nifaq", menu:2, material:"iman-kepada-allah", sub:"tauhid", type:"article", title:"Nifaq (Kemunafikan)", summary:"Menampakkan keimanan di lahir namun menyembunyikan kekufuran di hati, atau bersifat munafik dalam amal.",
  body:[
    {h:"Jenis", list:["Nifaq i'tiqadi — kemunafikan akidah (menampakkan Islam, menyembunyikan kekufuran), mengeluarkan dari Islam.","Nifaq 'amali — kemunafikan dalam amal (berdusta, ingkar janji, khianat amanah) tanpa disertai kekufuran hati."]},
    {h:"Dalil", p:["Rasulullah ﷺ bersabda tentang tiga tanda munafik: apabila berbicara berdusta, berjanji mengingkari, dan diberi amanah berkhianat (HR. Bukhari no. 33, Muslim no. 59)."]}
  ],
  sources:["bukhari","muslim"], related:["kufur","syirik"], tags:["akidah"]});

/* ---------- MENU 05 — FIQIH: Perawatan Jenazah, Takziyah, Qurban, Aqiqah ---------- */
addEntry({id:"memandikan-jenazah", menu:5, material:"fiqih-ibadah", type:"article", title:"Memandikan Jenazah", summary:"Fardhu kifayah — kewajiban memandikan jenazah Muslim sebelum dikafani.",
  body:[
    {h:"Tata cara umum", list:["Menutup aurat jenazah selama proses memandikan.","Membersihkan najis pada tubuh terlebih dahulu.","Mewudukan jenazah seperti wudu shalat.","Menyiramkan air ke seluruh tubuh, dianjurkan ganjil (3, 5, atau 7 kali), siraman terakhir dicampur wangi-wangian (kapur barus)."]},
    {h:"Yang berhak memandikan", p:["Jenazah laki-laki dimandikan oleh laki-laki (atau istri/mahramnya), jenazah perempuan oleh perempuan (atau suami/mahramnya)."]}
  ],
  sources:["app"], related:["shalat-jenazah","mengkafani-jenazah"], tags:["fiqih","jenazah"]});
addEntry({id:"mengkafani-jenazah", menu:5, material:"fiqih-ibadah", type:"article", title:"Mengkafani Jenazah", summary:"Membungkus jenazah dengan kain kafan setelah dimandikan, sebelum dishalatkan.",
  body:[
    {h:"Ketentuan", list:["Jenazah laki-laki dianjurkan dikafani dengan 3 lapis kain putih; jenazah perempuan dengan 5 lapis (termasuk kerudung dan sarung).","Kain kafan hendaknya bersih dan menutupi seluruh tubuh; diberi wangi-wangian.","Diikat di beberapa bagian agar kain tidak terbuka, lalu dilepas kembali saat dikuburkan."]}
  ],
  sources:["app"], related:["memandikan-jenazah","shalat-jenazah"], tags:["fiqih","jenazah"]});
addEntry({id:"menguburkan-jenazah", menu:5, material:"fiqih-ibadah", type:"article", title:"Menguburkan Jenazah", summary:"Tahap akhir pengurusan jenazah — dimakamkan sesegera mungkin setelah dishalatkan.",
  body:[
    {h:"Ketentuan", list:["Disunnahkan menyegerakan pemakaman, tidak menunda-nunda tanpa keperluan mendesak.","Jenazah dibaringkan miring menghadap kiblat di liang lahat.","Diucapkan doa saat meletakkan jenazah: \"Bismillahi wa 'ala millati Rasulillah\" (Dengan nama Allah dan atas agama Rasulullah)."]},
    {h:"Setelah pemakaman", p:["Dianjurkan mendoakan mayit dan memohonkan keteguhannya menjawab pertanyaan malaikat di kubur."]}
  ],
  sources:["app"], related:["mengkafani-jenazah","kematian"], tags:["fiqih","jenazah"]});
addEntry({id:"takziyah", menu:5, material:"fiqih-ibadah", type:"article", title:"Takziyah", summary:"Melayat dan menghibur keluarga yang ditinggalkan, dianjurkan dalam Islam.",
  body:[
    {h:"Tujuan", p:["Menghibur keluarga yang berduka, mendoakan mayit, dan mengingatkan tentang kesabaran serta pahala atas musibah yang menimpa."]},
    {h:"Adab", list:["Menyampaikan doa/ucapan yang menenangkan, bukan menambah kesedihan.","Waktu takziyah dianjurkan tidak lebih dari 3 hari kecuali ada uzur.","Dianjurkan membantu kebutuhan keluarga berduka, termasuk menyediakan makanan bagi mereka (bukan sebaliknya)."]}
  ],
  sources:["app"], related:["menguburkan-jenazah"], tags:["fiqih","jenazah"]});
addEntry({id:"qurban", menu:5, material:"fiqih-ibadah", type:"article", title:"Qurban", summary:"Menyembelih hewan ternak pada Idul Adha dan hari tasyrik sebagai ibadah dan sedekah.",
  body:[
    {h:"Hukum & waktu", p:["Sunnah muakkad bagi yang mampu, dilaksanakan mulai setelah shalat Id hingga terbenam matahari hari tasyrik terakhir (10-13 Dzulhijjah)."]},
    {h:"Ketentuan hewan", list:["Kambing/domba: cukup untuk 1 orang.","Sapi/unta: dapat untuk 7 orang berpatungan.","Hewan harus sehat, cukup umur, dan tidak cacat."]},
    {h:"Pembagian daging", p:["Dianjurkan dibagi tiga: untuk keluarga yang berqurban, kerabat/tetangga, dan fakir miskin."]}
  ],
  sources:["quran","app"], related:["haji","fiqih-ibadah"], tags:["fiqih","qurban"]});
addEntry({id:"aqiqah", menu:5, material:"fiqih-ibadah", type:"article", title:"Aqiqah", summary:"Penyembelihan hewan sebagai ungkapan syukur atas kelahiran anak.",
  body:[
    {h:"Ketentuan", list:["Anak laki-laki: dianjurkan 2 ekor kambing; anak perempuan: 1 ekor kambing.","Waktu utama: hari ke-7 kelahiran, boleh juga hari ke-14 atau ke-21, atau kapan saja mampu.","Disunnahkan mencukur rambut bayi dan memberi nama pada hari yang sama."]},
    {h:"Dalil", p:["Rasulullah ﷺ bersabda: \"Setiap anak tergadai dengan aqiqahnya, disembelihkan untuknya pada hari ketujuh...\" (HR. Abu Dawud no. 2838, Tirmidzi no. 1522)."]}
  ],
  sources:["abudawud","tirmidzi"], related:["qurban"], tags:["fiqih","aqiqah"]});

/* ---------- MENU 05 — KAIDAH FIQIH KE-5 ---------- */
addEntry({id:"kaidah-adat", menu:5, material:"kaidah-fiqih", type:"article", title:"Kaidah: Al-'Adah Muhakkamah", summary:"Adat/kebiasaan yang tidak bertentangan syariat dapat menjadi pertimbangan hukum.",
  body:[
    {h:"Pengertian", p:["Kaidah kelima dari lima kaidah fiqih pokok — kebiasaan suatu masyarakat yang tidak bertentangan dengan Al-Qur'an dan sunnah dapat dijadikan pertimbangan dalam menetapkan hukum fiqih pada perkara yang tidak ada dalil tegasnya."]},
    {h:"Contoh", p:["Ukuran mahar, bentuk akad jual-beli tertentu, atau kebiasaan takaran/timbangan lokal bisa menjadi rujukan hukum selama tidak melanggar prinsip syariat."]}
  ],
  sources:["app"], related:["kaidah-fiqih","kaidah-dharar"], tags:["fiqih","kaidah"]});

/* ---------- MENU 05 — Walimah, Khulu, Gadai, Wakalah, Kafalah ---------- */
addEntry({id:"walimah", menu:5, material:"fiqih-keluarga", type:"article", title:"Walimah", summary:"Jamuan/pesta pernikahan yang disunnahkan setelah akad nikah.",
  body:[
    {h:"Hukum", p:["Sunnah muakkad bagi mempelai laki-laki mengadakan walimah sesuai kemampuan, sebagai bentuk syukur dan pengumuman pernikahan kepada masyarakat."]},
    {h:"Adab", list:["Dianjurkan mengundang, tidak hanya orang kaya.","Dianjurkan menghadiri undangan walimah selama tidak ada kemungkaran.","Kesederhanaan lebih diutamakan daripada berlebih-lebihan (israf)."]}
  ],
  sources:["bukhari","muslim"], related:["pernikahan","mahar"], tags:["fiqih","pernikahan"]});
addEntry({id:"khulu", menu:5, material:"fiqih-keluarga", type:"article", title:"Khulu'", summary:"Perpisahan yang diajukan istri kepada suami dengan memberikan kompensasi (tebusan).",
  body:[
    {h:"Pengertian", p:["Khulu' adalah permintaan cerai dari pihak istri, biasanya karena tidak sanggup lagi menjalani rumah tangga, dengan mengembalikan mahar atau memberi sejumlah kompensasi kepada suami sebagai imbalan pelepasan ikatan."]},
    {h:"Dalil", p:["QS. Al-Baqarah 2:229 menyebutkan bolehnya istri menebus dirinya (khulu') jika keduanya khawatir tidak dapat menjalankan batas-batas Allah."]},
    {h:"Perbedaan dengan talak", p:["Pada talak biasa, inisiatif dan hak menjatuhkan ada di tangan suami; pada khulu', istri yang mengajukan dan memberikan kompensasi."]}
  ],
  sources:["quran"], related:["talak","pernikahan"], tags:["fiqih","pernikahan"]});
addEntry({id:"gadai", menu:5, material:"fiqih-muamalah", type:"article", title:"Gadai (Rahn)", summary:"Menjadikan suatu barang sebagai jaminan atas utang yang dimiliki.",
  body:[
    {h:"Pengertian", p:["Rahn adalah akad menjadikan barang berharga sebagai jaminan (agunan) atas suatu utang; jika peminjam tidak dapat melunasi, barang jaminan dapat dijual untuk melunasi utang sesuai kesepakatan."]},
    {h:"Ketentuan", list:["Barang gadai tetap milik penggadai, penerima gadai hanya menahannya sebagai jaminan.","Barang gadai tidak boleh dimanfaatkan penerima gadai tanpa izin, apalagi dipungut hasil sebagai riba terselubung."]}
  ],
  sources:["app"], related:["fiqih-muamalah","utang-piutang"], tags:["fiqih","muamalah"]});
addEntry({id:"wakalah", menu:5, material:"fiqih-muamalah", type:"article", title:"Wakalah", summary:"Akad perwakilan — seseorang mewakilkan urusannya kepada pihak lain untuk dikerjakan.",
  body:[
    {h:"Pengertian", p:["Wakalah adalah pemberian kuasa dari satu pihak (muwakkil) kepada pihak lain (wakil) untuk melakukan suatu tindakan/transaksi atas namanya, seperti mewakilkan jual-beli, mewakilkan akad nikah, atau mewakilkan pembayaran zakat."]},
    {h:"Syarat", p:["Perkara yang diwakilkan harus jelas dan merupakan sesuatu yang boleh diwakilkan (bukan ibadah badaniyah murni seperti shalat)."]}
  ],
  sources:["app"], related:["fiqih-muamalah"], tags:["fiqih","muamalah"]});
addEntry({id:"kafalah", menu:5, material:"fiqih-muamalah", type:"article", title:"Kafalah", summary:"Akad penjaminan — seseorang menanggung kewajiban/utang pihak lain.",
  body:[
    {h:"Pengertian", p:["Kafalah adalah akad di mana satu pihak (kafil) menjamin memenuhi kewajiban atau melunasi utang pihak lain (makful 'anhu) kepada pihak ketiga, jika yang berutang tidak mampu memenuhinya."]},
    {h:"Contoh modern", p:["Bank garansi dan penjaminan (asuransi kredit) dalam ekonomi syariah mengadopsi prinsip kafalah ini."]}
  ],
  sources:["app"], related:["fiqih-muamalah","wakalah"], tags:["fiqih","muamalah"]});

/* ---------- MENU 03 — AL-QUR'AN: Muhkam & Mutasyabih ---------- */
addEntry({id:"muhkam-mutasyabih", menu:3, material:"tafsir", type:"article", title:"Muhkam & Mutasyabih", summary:"Dua kategori ayat Al-Qur'an berdasarkan tingkat kejelasan maknanya.",
  body:[
    {h:"Muhkam", p:["Ayat yang maknanya jelas dan tegas, tidak mengandung banyak kemungkinan penafsiran — menjadi rujukan utama dalam memahami hukum dan akidah."]},
    {h:"Mutasyabih", p:["Ayat yang maknanya memerlukan penjelasan lebih lanjut atau mengandung beberapa kemungkinan makna, seperti ayat tentang huruf muqatha'ah di awal sebagian surah atau sifat-sifat Allah yang perlu dipahami tanpa penyerupaan (tasybih) dengan makhluk."]},
    {h:"Dalil", p:["QS. Ali 'Imran 3:7 menyebutkan Al-Qur'an berisi ayat muhkamat sebagai pokok kitab dan ayat mutasyabihat yang memerlukan kehati-hatian dalam menafsirkannya."]}
  ],
  sources:["quran"], related:["ulumul-quran","tafsir"], tags:["al-quran","ulumul quran"]});

/* ---------- MENU 04 — HADIS: Riyadhus Shalihin & Hadis Arbain ---------- */
addEntry({id:"riyadhus-shalihin", menu:4, material:"hadis", sub:"koleksi-kitab", type:"article", title:"Riyadhus Shalihin", summary:"Kitab kumpulan hadis susunan Imam an-Nawawi tentang akhlak dan amal saleh.",
  body:[
    {h:"Tentang kitab", p:["Disusun oleh Imam Yahya bin Syaraf an-Nawawi (w. 676 H), memuat sekitar 1.900 hadis yang disusun per tema, fokus pada akhlak, adab, dan amal-amal keseharian seorang Muslim."]},
    {h:"Kedudukan", p:["Salah satu kitab hadis tematik paling populer dan banyak dikaji di dunia Islam karena bahasannya yang ringkas namun mencakup banyak aspek kehidupan."]}
  ],
  sources:["app"], related:["hadis","hadis-arbain"], tags:["hadis","kitab"]});
addEntry({id:"hadis-arbain", menu:4, material:"hadis", sub:"koleksi-kitab", type:"article", title:"Hadis Arba'in an-Nawawiyah", summary:"Kumpulan 42 hadis pilihan susunan Imam an-Nawawi yang merangkum pokok-pokok ajaran Islam.",
  body:[
    {h:"Tentang kitab", p:["Disusun oleh Imam an-Nawawi, awalnya berjumlah 40 hadis (sesuai anjuran ulama untuk menghimpun 40 hadis pokok agama), lalu ditambah menjadi 42 hadis oleh penyusunnya sendiri."]},
    {h:"Kedudukan", p:["Menjadi materi pembelajaran dasar yang sangat populer di pesantren dan lembaga pendidikan Islam karena mencakup pokok-pokok akidah, ibadah, dan akhlak secara ringkas — hadis pertamanya adalah hadis niat."]}
  ],
  sources:["app"], related:["riyadhus-shalihin","syarah-hadis-niat"], tags:["hadis","kitab"]});

/* ---------- MENU 12 — NAHWU: I'rab ---------- */
addEntry({id:"irab", menu:12, material:"nahwu", type:"article", title:"I'rab", summary:"Perubahan akhir kata dalam bahasa Arab sesuai kedudukannya dalam kalimat.",
  body:[
    {h:"Pengertian", p:["I'rab adalah perubahan harakat/akhiran kata (isim atau fi'il mudhari') karena perbedaan faktor (amil) yang memengaruhinya dalam kalimat."]},
    {h:"Empat keadaan i'rab", list:["Rafa' — umumnya ditandai dhammah, untuk mubtada, khabar, fa'il, dsb.","Nashab — umumnya ditandai fathah, untuk maf'ul bih, khabar kana, dsb.","Khafd/Jarr — umumnya ditandai kasrah, untuk isim setelah huruf jar atau idhafah.","Jazm — khusus fi'il mudhari', ditandai sukun, muncul setelah huruf/kata jazm tertentu."]}
  ],
  sources:["app"], related:["nahwu","isim","fil"], tags:["bahasa arab","nahwu"]});

/* ---------- MENU 11 — PENDIDIKAN: Hak Guru & Hak Murid ---------- */
addEntry({id:"hak-guru", menu:11, material:"pendidikan-islam", type:"article", title:"Hak Guru", summary:"Penghormatan dan adab yang wajib ditunaikan murid kepada gurunya.",
  body:[
    {h:"Bentuk penghormatan", list:["Menghormati dan memuliakan guru sebagai pewaris ilmu para nabi.","Bersikap sopan, tidak memotong pembicaraan, dan mendengarkan dengan saksama.","Mendoakan kebaikan bagi guru, termasuk setelah wafatnya.","Tidak durhaka atau merendahkan guru meski di luar majelis."]},
    {h:"Landasan", p:["Ulama salaf sangat menekankan adab terhadap guru, karena ilmu yang bermanfaat (barakah) erat kaitannya dengan penghormatan terhadap sumber ilmu itu sendiri."]}
  ],
  sources:["app"], related:["adab-menuntut-ilmu","hak-murid"], tags:["pendidikan","adab"]});
addEntry({id:"hak-murid", menu:11, material:"pendidikan-islam", type:"article", title:"Hak Murid", summary:"Kewajiban dan tanggung jawab guru terhadap murid yang dibimbingnya.",
  body:[
    {h:"Bentuk hak murid", list:["Mendapatkan pengajaran yang ikhlas dan sesuai kemampuan pemahamannya.","Diperlakukan dengan lemah lembut dan sabar, tidak dengan kekerasan.","Dikoreksi kesalahannya dengan cara yang mendidik, bukan mempermalukan.","Mendapat keteladanan akhlak dari gurunya, bukan hanya transfer ilmu."]},
    {h:"Landasan", p:["Rasulullah ﷺ adalah teladan pendidik terbaik — mengajarkan ilmu dengan kasih sayang dan kesabaran, sebagaimana banyak diriwayatkan dalam interaksi beliau dengan para sahabat muda."]}
  ],
  sources:["app"], related:["hak-guru","adab-menuntut-ilmu"], tags:["pendidikan","adab"]});

/* ---------- MENU 07 — AKHLAK TERCELA: Dendam, Dusta, Su'udzan ---------- */
addEntry({id:"dendam", menu:7, material:"akhlak", sub:"tercela", type:"article", title:"Dendam (Hiqd)", summary:"Menyimpan kebencian dan keinginan membalas keburukan orang lain di dalam hati.",
  body:[
    {h:"Bahaya", p:["Dendam merusak ketenangan hati, memicu permusuhan berkepanjangan, dan menghalangi seseorang dari sifat pemaaf yang dianjurkan Islam."]},
    {h:"Solusi", p:["Islam menganjurkan memaafkan dan melapangkan dada; Rasulullah ﷺ dikenal sebagai pribadi yang tidak menyimpan dendam meski pernah disakiti."]}
  ],
  sources:["app"], related:["akhlak"], tags:["akhlak","tercela"]});
addEntry({id:"dusta", menu:7, material:"akhlak", sub:"tercela", type:"article", title:"Dusta (Kadzib)", summary:"Berkata tidak sesuai kenyataan — salah satu tanda kemunafikan jika menjadi kebiasaan.",
  body:[
    {h:"Bahaya", p:["Rasulullah ﷺ bersabda: \"Sesungguhnya kejujuran menuntun kepada kebaikan, dan kebaikan menuntun ke surga... Sesungguhnya dusta menuntun kepada keburukan, dan keburukan menuntun ke neraka.\" (HR. Bukhari no. 6094, Muslim no. 2607)."]},
    {h:"Pengecualian", p:["Sebagian ulama membolehkan berbohong demi kemaslahatan besar dalam kondisi terbatas, seperti mendamaikan dua pihak yang bertikai, namun ini bukan alasan menjadikan dusta kebiasaan."]}
  ],
  sources:["bukhari","muslim"], related:["akhlak","jujur"], tags:["akhlak","tercela"]});
addEntry({id:"suudzan", menu:7, material:"akhlak", sub:"tercela", type:"article", title:"Su'uzhan (Buruk Sangka)", summary:"Berprasangka buruk kepada orang lain tanpa bukti yang jelas.",
  body:[
    {h:"Dalil", p:["\"Wahai orang-orang yang beriman, jauhilah banyak prasangka, sesungguhnya sebagian prasangka itu dosa.\" (QS. Al-Hujurat 49:12)."]},
    {h:"Solusi", p:["Islam menganjurkan husnuzhan (berbaik sangka) sebagai lawannya, serta melakukan tabayyun (klarifikasi) sebelum menyimpulkan sesuatu tentang orang lain."]}
  ],
  sources:["quran"], related:["akhlak","akhlak-tercela"], tags:["akhlak","tercela"]});

/* ---------- MENU 07 — ADAB: Berpakaian, di Masjid ---------- */
addEntry({id:"adab-berpakaian", menu:7, material:"adab", type:"article", title:"Adab Berpakaian", summary:"Ketentuan Islam dalam berpakaian: menutup aurat, sopan, dan tidak menyerupai lawan jenis.",
  body:[
    {h:"Prinsip", list:["Menutup aurat sesuai ketentuan syariat.","Tidak transparan/ketat yang menampakkan bentuk tubuh secara berlebihan.","Tidak menyerupai pakaian khas lawan jenis.","Dianjurkan memulai dari sisi kanan saat mengenakan pakaian, disertai doa."]},
    {h:"Doa mengenakan pakaian baru", p:["\"Alhamdulillahilladzi kasani hadza (ats-tsauba) wa razaqanihi min ghairi haulin minni wa la quwwah\" — segala puji bagi Allah yang telah memberiku pakaian ini dan mengaruniakannya tanpa daya dan kekuatan dariku (HR. Abu Dawud, Tirmidzi)."]}
  ],
  sources:["abudawud","tirmidzi"], related:["adab"], tags:["adab"]});
addEntry({id:"adab-masjid", menu:7, material:"adab", type:"article", title:"Adab di Masjid", summary:"Tata krama menjaga kesucian dan kekhusyukan masjid sebagai rumah ibadah.",
  body:[
    {h:"Adab masuk-keluar", p:["Masuk dengan kaki kanan disertai doa memohon dibukakan rahmat Allah; keluar dengan kaki kiri disertai doa memohon karunia-Nya."]},
    {h:"Adab di dalam", list:["Melaksanakan shalat tahiyyatul masjid sebelum duduk.","Menjaga kebersihan dan ketenangan, tidak berisik atau berjual-beli di dalamnya.","Tidak lewat di depan orang yang sedang shalat.","Menjaga adab berpakaian yang sopan saat memasuki masjid."]}
  ],
  sources:["app"], related:["tahiyyatul-masjid","adab"], tags:["adab","masjid"]});

/* ---------- MENU 07 — TAZKIYAH: Mujahadah ---------- */
addEntry({id:"mujahadah", menu:7, material:"tazkiyah", type:"article", title:"Mujahadah", summary:"Bersungguh-sungguh melawan hawa nafsu dan godaan untuk mendekatkan diri kepada Allah.",
  body:[
    {h:"Pengertian", p:["Mujahadah an-nafs adalah upaya sungguh-sungguh mengendalikan hawa nafsu, godaan setan, dan kemalasan dalam beribadah — bagian penting dari perjalanan tazkiyatun nafs (penyucian jiwa)."]},
    {h:"Dalil", p:["\"Dan orang-orang yang berjihad (bersungguh-sungguh) untuk (mencari keridaan) Kami, benar-benar akan Kami tunjukkan kepada mereka jalan-jalan Kami.\" (QS. Al-'Ankabut 29:69)."]}
  ],
  sources:["quran"], related:["tazkiyah","taubat"], tags:["tazkiyah","akhlak"]});

/* ---------- MENU 08 — SIRAH: Masa Makkah & Masa Madinah ---------- */
addEntry({id:"masa-makkah", menu:8, material:"sirah-nabi", type:"article", title:"Periode Dakwah Makkah", summary:"±13 tahun dakwah Nabi ﷺ di Makkah, dari wahyu pertama hingga hijrah.",
  body:[
    {h:"Karakteristik", list:["Fokus dakwah: penanaman akidah tauhid dan pemurnian keimanan.","Dakwah dilakukan sembunyi-sembunyi lalu terang-terangan, menghadapi penentangan keras kaum Quraisy.","Banyak sahabat awal (as-sabiqun al-awwalun) menerima siksaan berat karena mempertahankan keimanannya.","Peristiwa penting: turunnya wahyu pertama, Isra' Mi'raj, dua kali hijrah ke Habasyah."]},
    {h:"Akhir periode", p:["Berakhir dengan hijrahnya Nabi ﷺ ke Madinah pada 622 M setelah tekanan Quraisy memuncak dan terbukanya peluang dakwah di Madinah lewat Bai'at Aqabah."]}
  ],
  sources:["sirah"], related:["sirah","as-sabiqun-awwalun","baiat-aqabah"], tags:["sejarah","sirah"]});
addEntry({id:"masa-madinah", menu:8, material:"sirah-nabi", type:"article", title:"Periode Dakwah Madinah", summary:"±10 tahun dakwah Nabi ﷺ di Madinah, dari hijrah hingga wafat beliau.",
  body:[
    {h:"Karakteristik", list:["Fokus dakwah meluas: pembentukan masyarakat (ummah), hukum syariat (shalat, zakat, puasa, haji, muamalah) banyak diturunkan pada periode ini.","Terjadi berbagai peperangan mempertahankan diri dan dakwah: Badar, Uhud, Khandaq, hingga Fathu Makkah.","Piagam Madinah disusun untuk mengatur kehidupan bersama lintas kelompok."]},
    {h:"Akhir periode", p:["Ditutup dengan Haji Wada' dan wafatnya Rasulullah ﷺ pada 11 H/632 M, meninggalkan Al-Qur'an dan sunnah sebagai pedoman umat."]}
  ],
  sources:["sirah"], related:["sirah","piagam-madinah","haji-wada","wafat-nabi"], tags:["sejarah","sirah"]});

/* ---------- MENU 08 — PERANG: Khaibar, Mu'tah, Hunain, Thaif, Tabuk, Bani Quraizhah ---------- */
addEntry({id:"bani-quraizhah", menu:8, material:"perang", type:"event-article", title:"Peristiwa Bani Quraizhah", summary:"5 H — penyelesaian atas pengkhianatan salah satu suku Yahudi Madinah yang membantu musuh dalam Perang Khandaq.",
  body:[
    {h:"Latar belakang", p:["Bani Quraizhah adalah salah satu suku Yahudi Madinah yang sebelumnya terikat perjanjian damai dengan kaum Muslimin, namun melanggarnya dengan berpihak kepada pasukan koalisi musuh (Ahzab) saat Perang Khandaq berlangsung, membahayakan posisi Madinah dari dalam."]},
    {h:"Penyelesaian", p:["Setelah Perang Khandaq usai, kaum Muslimin mengepung benteng Bani Quraizhah. Mereka akhirnya menyerah dan bersedia diputuskan hukumannya oleh Sa'ad bin Mu'adz, tokoh yang mereka pilih sendiri sebagai hakim (sesuai kesepakatan mereka) berdasarkan hukum Taurat yang berlaku bagi pengkhianatan dalam peperangan pada masa itu."]},
    {h:"Catatan", p:["Peristiwa ini dicatat sejarawan sebagai penyelesaian atas pelanggaran perjanjian saat perang berlangsung, bukan tindakan terhadap kelompok agama secara umum — sejumlah suku dan individu Yahudi lain di Madinah tetap hidup damai di bawah Piagam Madinah."]}
  ],
  sources:["sirah"], related:["perang-khandaq","piagam-madinah"], tags:["sejarah","sirah","perang"]});
addEntry({id:"perang-khaibar", menu:8, material:"perang", type:"event-article", title:"Perang Khaibar", summary:"7 H — penaklukan benteng-benteng Khaibar, basis sejumlah pihak yang terus memusuhi kaum Muslimin.",
  body:[
    {h:"Latar belakang", p:["Khaibar merupakan kawasan dengan benteng-benteng kuat yang menjadi basis pengumpulan kekuatan pihak-pihak yang terus berupaya menyerang kaum Muslimin di Madinah."]},
    {h:"Peristiwa", p:["Setelah pengepungan dan beberapa pertempuran benteng, Khaibar akhirnya ditaklukkan. Ali bin Abi Thalib dikenal berperan besar dalam pertempuran ini. Penduduk yang menyerah diizinkan tetap mengelola lahan pertanian dengan sistem bagi hasil."]}
  ],
  sources:["sirah"], related:["bani-quraizhah","perang-khandaq"], tags:["sejarah","sirah","perang"]});
addEntry({id:"perang-mutah", menu:8, material:"perang", type:"event-article", title:"Perang Mu'tah", summary:"8 H — pertempuran di perbatasan Syam melawan pasukan Romawi (Bizantium) yang jauh lebih besar jumlahnya.",
  body:[
    {h:"Latar belakang", p:["Dipicu terbunuhnya utusan Nabi ﷺ oleh pihak Ghassaniyah (sekutu Romawi). Nabi ﷺ mengirim ±3.000 pasukan menghadapi puluhan ribu pasukan Romawi dan sekutunya."]},
    {h:"Jalannya perang", p:["Tiga panglima gugur berturut-turut (Zaid bin Haritsah, Ja'far bin Abi Thalib, Abdullah bin Rawahah) sesuai wasiat Nabi ﷺ, hingga akhirnya Khalid bin Walid mengambil alih komando dan berhasil menarik mundur pasukan Muslimin secara taktis tanpa kekalahan telak."]}
  ],
  sources:["sirah"], related:["perang-tabuk"], tags:["sejarah","sirah","perang"]});
addEntry({id:"perang-hunain", menu:8, material:"perang", type:"event-article", title:"Perang Hunain", summary:"8 H — pertempuran melawan suku Hawazin dan Tsaqif tak lama setelah Fathu Makkah.",
  body:[
    {h:"Latar belakang", p:["Suku Hawazin dan Tsaqif mengumpulkan kekuatan besar untuk menyerang kaum Muslimin, khawatir dengan meluasnya kekuatan Islam setelah penaklukan Makkah."]},
    {h:"Jalannya perang", p:["Pasukan Muslimin sempat terdesak di awal pertempuran karena serangan mendadak dari lembah sempit, namun berkat keteguhan Nabi ﷺ dan sejumlah sahabat, pasukan berhasil bertahan dan akhirnya meraih kemenangan (QS. At-Taubah 9:25-26)."]}
  ],
  sources:["sirah","quran"], related:["fathu-makkah","perang-thaif"], tags:["sejarah","sirah","perang"]});
addEntry({id:"perang-thaif", menu:8, material:"perang", type:"event-article", title:"Pengepungan Thaif", summary:"8 H — pengepungan kota Thaif menyusul Perang Hunain, tempat sisa pasukan Tsaqif bertahan.",
  body:[
    {h:"Peristiwa", p:["Setelah kemenangan di Hunain, pasukan Muslimin mengejar sisa pasukan Tsaqif yang berlindung di balik benteng kokoh kota Thaif. Pengepungan berlangsung sekitar dua pekan tanpa berhasil menembus benteng, sehingga Nabi ﷺ memutuskan menarik pasukan."]},
    {h:"Pelajaran", p:["Tidak semua upaya dakwah/militer berhasil seketika; Thaif sendiri akhirnya masuk Islam secara damai tidak lama setelahnya, tanpa perlu penaklukan paksa."]}
  ],
  sources:["sirah"], related:["perang-hunain"], tags:["sejarah","sirah","perang"]});
addEntry({id:"perang-tabuk", menu:8, material:"perang", type:"event-article", title:"Perang Tabuk", summary:"9 H — ekspedisi besar terakhir Nabi ﷺ, mengantisipasi ancaman pasukan Romawi di perbatasan utara.",
  body:[
    {h:"Latar belakang", p:["Tersiar kabar pasukan besar Romawi tengah bersiap menyerang dari utara. Nabi ﷺ mengerahkan pasukan besar (±30.000 orang) dalam kondisi cuaca sangat panas dan paceklik — dikenal sebagai 'pasukan masa sulit' (Jaisyul 'Usrah)."]},
    {h:"Hasil", p:["Sesampainya di Tabuk, pasukan Romawi ternyata tidak jadi menyerang. Ekspedisi ini tetap bernilai besar karena menunjukkan kekuatan dan kesiapan kaum Muslimin, serta membuka jalan perjanjian damai dengan sejumlah suku di perbatasan Syam."]}
  ],
  sources:["sirah"], related:["perang-mutah"], tags:["sejarah","sirah","perang"]});

/* ---------- MENU 08 — SAHABAT: 10 Sahabat Dijamin Surga ---------- */
addEntry({id:"asyarah-mubasysyarin", menu:8, material:"sahabat", type:"article", title:"Asyarah Mubasysyarin (10 Sahabat Dijamin Surga)", summary:"Sepuluh sahabat yang secara khusus diberitakan Nabi ﷺ dijamin masuk surga semasa hidupnya.",
  body:[
    {h:"Daftar", list:["Abu Bakar ash-Shiddiq","Umar bin al-Khattab","Utsman bin Affan","Ali bin Abi Thalib","Thalhah bin Ubaidillah","Zubair bin al-Awwam","Abdurrahman bin Auf","Sa'ad bin Abi Waqqash","Sa'id bin Zaid","Abu Ubaidah bin al-Jarrah"]},
    {h:"Dalil", p:["Diriwayatkan dari hadis Sa'id bin Zaid yang menyebutkan kesepuluh nama ini secara berurutan sebagai ahli surga (HR. Abu Dawud no. 4649, Tirmidzi no. 3747 — hasan sahih)."]}
  ],
  sources:["abudawud","tirmidzi"], related:["abu-bakar","as-sabiqun-awwalun"], tags:["sejarah","sirah","sahabat"]});

/* ---------- MENU 09 — ULAMA: Imam Abu Hanifah ---------- */
addEntry({id:"imam-abu-hanifah", menu:9, material:"ulama", type:"person", title:"Imam Abu Hanifah", summary:"Pendiri mazhab Hanafi, mazhab fiqih tertua di antara empat mazhab besar Ahlus Sunnah.",
  person:{name:"Imam Abu Hanifah", alt:"An-Nu'man bin Tsabit", birth:"80 H / 699 M", death:"150 H / 767 M", loc:"Kufah"},
  body:[
    {h:"Biografi", p:["Lahir di Kufah dari keturunan Persia; dikenal sebagai pedagang sutra yang juga tekun menuntut ilmu fiqih dan hadis dari banyak ulama tabi'in di Kufah."]},
    {h:"Kontribusi", p:["Pendiri mazhab Hanafi, mazhab fiqih dengan pengikut terbanyak di dunia Islam hingga kini (banyak dianut di Asia Selatan, Turki, dan sebagian dunia Arab). Dikenal luas menggunakan qiyas (analogi) secara sistematis dalam istinbath hukum."]},
    {h:"Wafat", p:["Wafat di Baghdad pada 150 H setelah menolak jabatan qadhi (hakim) yang ditawarkan penguasa karena ingin menjaga independensi keilmuannya."]}
  ],
  sources:["app"], related:["imam-syafii","imam-malik","imam-ahmad","ushul-fiqih"], tags:["tokoh","ulama","biografi"]});

/* ---------- MENU 08 — Isra Mi'raj sebagai artikel ---------- */
addEntry({id:"isra-miraj", menu:8, material:"sirah-nabi", type:"event-article", title:"Isra' Mi'raj", summary:"27 Rajab, tahun ke-10 kenabian — perjalanan malam Nabi ﷺ dari Makkah ke Yerusalem lalu naik ke langit menerima perintah shalat.",
  body:[
    {h:"Isra'", p:["Perjalanan malam dari Masjidil Haram (Makkah) ke Masjidil Aqsa (Yerusalem) dalam waktu singkat, sebagaimana disebutkan dalam QS. Al-Isra' 17:1."]},
    {h:"Mi'raj", p:["Dilanjutkan dengan naik ke langit (Mi'raj) menembus tujuh lapis langit, bertemu beberapa nabi terdahulu, hingga menerima perintah shalat lima waktu langsung dari Allah — awalnya diwajibkan 50 waktu, diringankan menjadi 5 waktu atas saran Nabi Musa 'alaihissalam."]},
    {h:"Signifikansi", p:["Peristiwa ini terjadi pada masa-masa sulit dakwah di Makkah (disebut 'Amul Huzn/tahun kesedihan setelah wafatnya Khadijah dan Abu Thalib), menjadi penguat keimanan sekaligus asal-usul kewajiban shalat lima waktu."]}
  ],
