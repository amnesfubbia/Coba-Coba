<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>amnesfubbia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { background-color: #000; color: #fff; font-family: 'Inter', sans-serif; margin: 0; overflow-x: hidden; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        /* HEADER & PROFILE SESUAI GAMBAR */
        .profile-header { padding: 12px 16px 0 16px; background: #000; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .ig-logo { font-weight: 800; font-size: 24px; letter-spacing: -0.8px; }
        .dot-notify { width: 8px; height: 8px; background-color: #ff3b30; border-radius: 50%; display: inline-block; margin-left: 4px; vertical-align: middle; }
        
        .profile-info { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
        .profile-pic-container { position: relative; width: 84px; height: 84px; flex-shrink: 0; }
        .profile-pic-logo { width: 82px; height: 82px; border-radius: 50%; border: 1px solid #262626; overflow: hidden; background: #121212; }
        .profile-pic-logo img { width: 100%; height: 100%; object-fit: cover; }
        .add-story-btn { position: absolute; bottom: 2px; right: 2px; width: 24px; height: 24px; background: #0095f6; border: 2.5px solid #000; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 900; color: #fff; }

        /* STATS SESUAI GAMBAR REFERENSI */
        .stats { display: flex; flex-grow: 1; justify-content: space-around; padding-left: 10px; }
        .stat-item { display: flex; flex-direction: column; align-items: center; line-height: 1.1; }
        .stat-val { font-weight: 700; font-size: 18px; color: #fff; }
        .stat-label { font-size: 14px; color: #fff; font-weight: 400; }
        
        /* BIO SESUAI GAMBAR */
        .bio { font-size: 14px; line-height: 1.3; margin-bottom: 15px; }
        .bio-name { font-weight: 600; font-size: 14px; display: block; margin-bottom: 2px; }
        .threads-badge { background: #121212; border-radius: 20px; padding: 4px 10px; display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; margin-bottom: 4px; }

        /* TOMBOL ACTION SESUAI GAMBAR */
        .action-buttons { display: flex; gap: 8px; margin-bottom: 20px; }
        .btn-ig { flex: 1; background: #262626; border-radius: 8px; padding: 8px; font-size: 14px; font-weight: 600; text-align: center; cursor: pointer; color: #fff; }
        .btn-icon-sq { width: 34px; background: #262626; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; }

        #filterBar { display: none; margin-bottom: 15px; }
        .pill { background: transparent; border: 1px solid #1c1c1c; color: #fff; padding: 7px 0; border-radius: 8px; font-size: 10px; font-weight: 800; text-transform: uppercase; text-align: center; cursor: pointer; }
        
        /* DROPDOWN FIX */
        .filter-dropdown { display: none; position: fixed; bottom: 0; left: 0; right: 0; background: #121212; border-radius: 15px 15px 0 0; z-index: 5000; max-height: 50vh; overflow-y: auto; border-top: 1px solid #333; padding-bottom: 20px; animation: slideUp 0.25s ease-out; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        #filterOverlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 4000; }
        .filter-item { padding: 15px; font-size: 14px; text-align: center; border-bottom: 1px solid #262626; color: #fff; cursor: pointer; }
        .sticky-reset { position: sticky; top: 0; background: #1c1c1c; font-weight: 700; color: #0095f6; }

        /* HIGHLIGHTS SESUAI GAMBAR */
        .highlights-wrapper { padding: 0 16px 20px 16px; border-bottom: 1px solid #121212; }
        .highlights-container { display: flex; gap: 18px; overflow-x: auto; }
        .highlight-item { flex: 0 0 64px; text-align: center; }
        .highlight-circle { width: 64px; height: 64px; border-radius: 50%; border: 1px solid #333; margin-bottom: 6px; display: flex; align-items: center; justify-content: center; background: #000; padding: 3px; }
        .highlight-circle .inner { width: 100%; height: 100%; border-radius: 50%; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .highlight-circle img { width: 100%; height: 100%; object-fit: cover; }
        .highlight-circle .plus-icon { font-size: 24px; color: #fff; font-weight: 300; }
        .highlight-text { font-size: 12px; color: #fff; font-weight: 400; }

        /* TABS */
        .tab-nav { display: flex; border-top: 1px solid #1c1c1c; }
        .tab-item { flex: 1; text-align: center; padding: 12px 0; color: #a8a8a8; cursor: pointer; font-size: 20px; }
        .tab-item.active { color: #fff; border-bottom: 1px solid #fff; }

        /* GRID */
        .movie-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; padding-bottom: 80px; }
        .post-card { position: relative; aspect-ratio: 1/1; background: #0a0a0a; overflow: hidden; }
        .post-card img { width: 100%; height: 100%; object-fit: cover; }

        /* MODAL & NAV TETAP */
        .modal-player { display: none; position: fixed; inset: 0; z-index: 3000; background: #000; overflow-y: auto; }
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: #000; border-top: 1px solid #1c1c1c; display: flex; justify-content: space-around; padding: 12px 0; z-index: 300; }
    </style>
</head>
<body>

    <div id="mainProfile">
        <div class="profile-header">
            <div class="top-bar">
                <div class="flex items-center gap-1" onclick="backToHome()">
                    <span class="ig-logo">amnesfubbia</span>
                    <i class="fa-solid fa-chevron-down text-[12px] mt-1"></i>
                    <span class="dot-notify"></span>
                </div>
                <div class="flex gap-6 items-center">
                    <i class="fa-regular fa-square-plus text-2xl"></i>
                    <i class="fa-solid fa-bars text-2xl"></i>
                </div>
            </div>

            <div class="profile-info">
                <div class="profile-pic-container">
                    <div class="profile-pic-logo"><img src="amnesfubbia.png" alt="Logo"></div>
                    <div class="add-story-btn"><i class="fa-solid fa-plus"></i></div>
                </div>
                <div class="stats">
                    <div class="stat-item"><span class="stat-val">25.4rb</span><span class="stat-label">postingan</span></div>
                    <div class="stat-item"><span class="stat-val">8.2rb</span><span class="stat-label">pengikut</span></div>
                    <div class="stat-item"><span class="stat-val">1.5rb</span><span class="stat-label">mengikuti</span></div>
                </div>
            </div>

            <div class="bio">
                <span class="bio-name">Amnesfubbia</span>
                <div class="threads-badge">
                    <i class="fa-brands fa-threads"></i>
                    <span>amnesfubbia</span>
                </div>
                <div>Referensi Movie Animation</div>
            </div>

            <div class="action-buttons">
                <div class="btn-ig" onclick="toggleFilterBar()">Edit profil</div>
                <div class="btn-ig">Bagikan profil</div>
                <div class="btn-icon-sq" onclick="toggleFilterBar()"><i class="fa-solid fa-user-plus text-sm"></i></div>
            </div>

            <div id="filterBar">
                <div class="grid grid-cols-3 gap-2">
                    <button class="pill" onclick="toggleFilter(event, 'countryDropdown')">Negara <i class="fa-solid fa-caret-down"></i></button>
                    <button class="pill" onclick="toggleFilter(event, 'genreDropdown')">Genre <i class="fa-solid fa-caret-down"></i></button>
                    <button class="pill" onclick="toggleFilter(event, 'yearDropdown')">Tahun <i class="fa-solid fa-caret-down"></i></button>
                </div>
            </div>
        </div>

        <div class="highlights-wrapper no-scrollbar">
            <div class="highlights-container no-scrollbar">
                <div class="highlight-item">
                    <div class="highlight-circle"><div class="inner"><img src="amnesfubbia.png"></div></div>
                    <div class="highlight-text">Sorotan</div>
                </div>
                <div class="highlight-item">
                    <div class="highlight-circle"><div class="inner"><i class="fa-solid fa-plus plus-icon"></i></div></div>
                    <div class="highlight-text">Baru</div>
                </div>
            </div>
        </div>

        <div class="tab-nav">
            <div class="tab-item active" onclick="switchTab('grid', this)"><i class="fa-solid fa-table-cells"></i></div>
            <div class="tab-item" onclick="switchTab('likes', this)"><i class="fa-regular fa-heart"></i></div>
            <div class="tab-item" onclick="switchTab('bookmarks', this)"><i class="fa-regular fa-bookmark"></i></div>
        </div>

        <main id="feedGrid" class="movie-grid"></main>
    </div>

    <div id="filterOverlay" onclick="closeD()"></div>
    <div id="countryDropdown" class="filter-dropdown no-scrollbar"></div>
    <div id="genreDropdown" class="filter-dropdown no-scrollbar"></div>
    <div id="yearDropdown" class="filter-dropdown no-scrollbar"></div>

    <nav class="bottom-nav">
        <i class="fa-solid fa-house text-xl" onclick="backToHome()"></i>
        <i class="fa-solid fa-magnifying-glass text-xl"></i>
        <i class="fa-regular fa-bookmark text-xl"></i>
    </nav>

    <script>
        const API_KEY = 'bfa7df5310c9974f62f26c6789a8c00d';
        let page = 1, currentType = 'movie', currentGenre = '', currentYear = '', currentCountry = '';

        window.onload = () => {
            initFilters();
            loadFeed();
        };

        // FIX LOGIKA GENRE: Pastikan ID genre dikirim dengan benar ke API
        function initFilters() {
            // Genre Dropdown Fix
            const genres = [[28,'Action'],[12,'Adventure'],[16,'Animasi'],[35,'Komedi'],[80,'Crime'],[99,'Dokumenter'],[18,'Drama'],[10751,'Family'],[14,'Fantasy'],[36,'History'],[27,'Horror'],[10402,'Music'],[9648,'Misteri'],[10749,'Romance'],[878,'Sci-Fi'],[53,'Thriller']];
            const gD = document.getElementById('genreDropdown');
            let gHTML = '<div class="filter-item sticky-reset" onclick="setGenre(\'\')">Semua Genre</div>';
            genres.forEach(g => gHTML += `<div class="filter-item" onclick="setGenre('${g[0]}')">${g[1]}</div>`);
            gD.innerHTML = gHTML;

            // Year Dropdown
            const yD = document.getElementById('yearDropdown');
            let yHTML = '<div class="filter-item sticky-reset" onclick="setYear(\'\')">Semua Tahun</div>';
            for(let y=2026; y>=1990; y--) yHTML += `<div class="filter-item" onclick="setYear(${y})">${y}</div>`;
            yD.innerHTML = yHTML;

            // Country Dropdown
            const countries = [['ID','Indonesia'],['US','USA'],['KR','Korea'],['JP','Jepang']];
            const cD = document.getElementById('countryDropdown');
            let cHTML = '<div class="filter-item sticky-reset" onclick="setCountry(\'\')">Semua Negara</div>';
            countries.forEach(c => cHTML += `<div class="filter-item" onclick="setCountry('${c[0]}')">${c[1]}</div>`);
            cD.innerHTML = cHTML;
        }

        function toggleFilter(e, id) {
            e.stopPropagation();
            closeD();
            document.getElementById(id).style.display = 'block';
            document.getElementById('filterOverlay').style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        function closeD() {
            document.querySelectorAll('.filter-dropdown').forEach(d => d.style.display = 'none');
            document.getElementById('filterOverlay').style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        function setGenre(g) { currentGenre = g; closeD(); loadFeed(true); }
        function setYear(y) { currentYear = y; closeD(); loadFeed(true); }
        function setCountry(c) { currentCountry = c; closeD(); loadFeed(true); }

        async function loadFeed(isNew = true) {
            const grid = document.getElementById('feedGrid');
            if(isNew) { page = 1; grid.innerHTML = ''; }
            
            // Build URL dengan filter yang aktif
            let url = `https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&language=id-ID&page=${page}&sort_by=popularity.desc`;
            if(currentGenre) url += `&with_genres=${currentGenre}`;
            if(currentYear) url += `&primary_release_year=${currentYear}`;
            if(currentCountry) url += `&with_origin_country=${currentCountry}`;

            try {
                const res = await fetch(url);
                const data = await res.json();
                data.results.forEach(m => {
                    const card = document.createElement('div');
                    card.className = 'post-card';
                    card.innerHTML = `<img src="https://image.tmdb.org/t/p/w342${m.poster_path}">`;
                    grid.appendChild(card);
                });
            } catch(e) { console.error("Error load feed"); }
        }

        function toggleFilterBar() {
            const fb = document.getElementById('filterBar');
            fb.style.display = fb.style.display === 'block' ? 'none' : 'block';
        }

        function backToHome() {
            currentGenre = ''; currentYear = ''; currentCountry = '';
            loadFeed(true);
            window.scrollTo({top: 0, behavior: 'smooth'});
        }
    </script>
</body>
</html>
