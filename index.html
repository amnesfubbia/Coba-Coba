<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>amnesfubbia xx1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@1,700&family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --ig-bg: #000; --ig-text: #fff; --ig-gray: #262626; }
        body { background-color: var(--ig-bg); color: var(--ig-text); font-family: 'Inter', sans-serif; margin: 0; overflow-x: hidden; transition: background 0.3s; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        /* TRANSISI MODAL ALA INSTAGRAM */
        .modal-player { 
            display: none; 
            position: fixed; 
            inset: 0; 
            z-index: 5000; 
            background: #000; 
            overflow-y: auto;
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.1, 0.7, 0.1, 1);
        }
        .modal-player.active { transform: translateY(0); display: block; }

        /* REELS COMPONENT */
        #reelsView {
            display: none;
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 4000;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
        }
        .reel-item { width: 100%; height: 100vh; scroll-snap-align: start; position: relative; background: #000; }
        .reels-actions {
            position: absolute; right: 15px; bottom: 100px;
            display: flex; flex-direction: column; gap: 20px; align-items: center; text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
        .reels-actions div { display: flex; flex-direction: column; align-items: center; font-size: 11px; font-weight: 600; }
        .reels-actions i { font-size: 26px; margin-bottom: 5px; }

        /* DARK MODE THEME */
        body.light-mode { --ig-bg: #fff; --ig-text: #000; --ig-gray: #dbdbdb; }
        body.light-mode { background: #fff; color: #000; }
        body.light-mode .bottom-nav, body.light-mode .profile-header { background: #fff; border-color: #dbdbdb; }
        body.light-mode .btn-ig { background: #efefef; color: #000; }

        /* HEADER & PROFILE */
        .profile-header { padding: 15px 15px 0 15px; background: inherit; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .ig-logo-wrapper { display: flex; align-items: center; gap: 4px; position: relative; cursor: pointer; }
        .ig-logo { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 18px; letter-spacing: -0.5px; }
        .dot-notify { width: 7px; height: 7px; background-color: #ff3b30; border-radius: 50%; display: inline-block; margin-left: 2px; }
        
        .profile-info { display: flex; align-items: center; gap: 25px; margin-bottom: 15px; }
        .profile-pic-container { position: relative; width: 86px; height: 86px; }
        .profile-pic-logo { width: 82px; height: 82px; border-radius: 50%; border: 1px solid #333; padding: 2px; background: #1a1a1a; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .logo-text-inner { font-weight: 900; font-size: 16px; color: #fff; letter-spacing: 1px; line-height: 1; text-align: center; }
        .add-story-btn { position: absolute; bottom: 4px; right: 4px; width: 24px; height: 24px; background: #0095f6; border: 3px solid #000; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; color: #fff; z-index: 10; }

        .stats { display: flex; flex-grow: 1; justify-content: space-around; text-align: center; }
        .stat-val { font-weight: 700; font-size: 16px; display: block; }
        .stat-label { font-size: 12px; color: #a8a8a8; }
        
        .bio { font-size: 13px; line-height: 1.4; margin-bottom: 15px; padding-top: 5px; }
        .bio-name { font-weight: 700; font-size: 14px; display: block; }

        .action-buttons { display: flex; gap: 6px; margin-bottom: 10px; }
        .btn-ig { flex: 1; background: #1c1c1c; border-radius: 8px; padding: 7px; font-size: 13px; font-weight: 600; text-align: center; cursor: pointer; color: #fff; }
        .btn-icon-sq { width: 34px; background: #1c1c1c; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; }

        #filterBar { display: none; margin-bottom: 15px; }
        .pill-grid { display: grid; gap: 6px; }
        .pill { background: transparent; border: 1px solid #1c1c1c; color: inherit; padding: 7px 0; border-radius: 8px; font-size: 10px; font-weight: 800; text-transform: uppercase; text-align: center; cursor: pointer; }
        
        .filter-dropdown { display: none; position: fixed; bottom: 0; left: 0; right: 0; background: #121212; border-radius: 20px 20px 0 0; z-index: 6000; max-height: 60vh; overflow-y: auto; border-top: 1px solid #333; padding-bottom: 20px; animation: slideUp 0.3s ease-out; overscroll-behavior: contain; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        .highlights-wrapper { padding: 0 15px 15px 15px; border-bottom: 1px solid #1c1c1c; }
        .highlights-container { display: flex; gap: 15px; overflow-x: auto; }
        .highlight-item { flex: 0 0 62px; text-align: center; cursor: pointer; }
        .highlight-circle { width: 58px; height: 58px; border-radius: 50%; border: 1px solid #262626; margin-bottom: 5px; display: flex; align-items: center; justify-content: center; background: #000; }
        .highlight-circle .hl-logo { font-size: 10px; font-weight: 900; letter-spacing: -0.5px; text-transform: uppercase; color: #fff; text-align: center; line-height: 1; }
        .highlight-text { font-size: 10px; color: inherit; }

        .tab-nav { display: flex; border-top: 1px solid #1c1c1c; }
        .tab-item { flex: 1; text-align: center; padding: 12px 0; color: #a8a8a8; cursor: pointer; font-size: 18px; }
        .tab-item.active { color: var(--ig-text); border-bottom: 1px solid var(--ig-text); }

        .movie-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; padding-bottom: 80px; }
        .post-card { position: relative; aspect-ratio: 1/1; background: #0a0a0a; overflow: hidden; }
        .post-card img { width: 100%; height: 100%; object-fit: cover; }
        
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: #000; border-top: 1px solid #1c1c1c; display: flex; justify-content: space-around; padding: 12px 0; z-index: 4500; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="mainProfile">
        <div class="profile-header">
            <div class="top-bar">
                <div class="ig-logo-wrapper" onclick="location.reload()">
                    <h1 class="ig-logo">amnesfubbia</h1>
                    <i class="fa-solid fa-chevron-down text-[10px] ml-0.5"></i>
                    <span class="dot-notify"></span>
                </div>
                <div class="flex gap-5">
                    <i class="fa-solid fa-moon text-xl cursor-pointer" onclick="toggleDarkMode()"></i>
                    <i class="fa-regular fa-square-plus text-2xl"></i>
                    <i class="fa-solid fa-bars text-2xl"></i>
                </div>
            </div>

            <div class="profile-info">
                <div class="profile-pic-container">
                    <div class="profile-pic-logo"><div class="logo-text-inner">AM.<br>FB</div></div>
                    <div class="add-story-btn"><i class="fa-solid fa-plus"></i></div>
                </div>
                <div class="stats">
                    <div class="stat-item" onclick="setFilter('type', 'movie')"><span class="stat-val">25.4rb</span><span class="stat-label">film</span></div>
                    <div class="stat-item" onclick="setFilter('type', 'tv')"><span class="stat-val">8.2rb</span><span class="stat-label">series</span></div>
                    <div class="stat-item" onclick="setFilter('type', 'short')"><span class="stat-val">1.5rb</span><span class="stat-label">short</span></div>
                </div>
            </div>

            <div class="bio">
                <div class="bio-name">amnesfubbia xx1 <i class="fa-solid fa-circle-check text-[#0095f6]"></i></div>
                <span>dari indonesia untuk dunia</span><br><span>By Anasteas</span>
            </div>

            <div class="action-buttons">
                <div class="btn-ig" id="btnNowPlaying" onclick="setSchedule('now_playing', this)">Sedang Tayang</div>
                <div class="btn-ig" id="btnUpcoming" onclick="setSchedule('upcoming', this)">Segera Tayang</div>
                <div class="btn-icon-sq" onclick="toggleFilterBar()"><i class="fa-solid fa-user-plus text-sm"></i></div>
            </div>

            <div id="filterBar">
                <div class="pill-grid grid-cols-3">
                    <button class="pill" id="btnCountry" onclick="toggleFilter(event, 'countryDropdown')">Negara <i class="fa-solid fa-caret-down"></i></button>
                    <button class="pill" id="btnGenre" onclick="toggleFilter(event, 'genreDropdown')">Genre <i class="fa-solid fa-caret-down"></i></button>
                    <button class="pill" id="yearBtn" onclick="toggleFilter(event, 'yearDropdown')">Tahun <i class="fa-solid fa-caret-down"></i></button>
                </div>
            </div>
        </div>

        <div class="highlights-wrapper no-scrollbar"><div class="highlights-container no-scrollbar" id="highlightList"></div></div>

        <div class="tab-nav">
            <div class="tab-item active" id="tabGrid" onclick="switchTab('grid', this)"><i class="fa-solid fa-table-cells"></i></div>
            <div class="tab-item" id="tabLikes" onclick="switchTab('likes', this)"><i class="fa-regular fa-heart"></i></div>
            <div class="tab-item" id="tabBookmark" onclick="switchTab('bookmarks', this)"><i class="fa-regular fa-bookmark"></i></div>
        </div>

        <main id="feedGrid" class="movie-grid"></main>
    </div>

    <div id="reelsView">
        <div class="reel-item">
            <div id="reelsPlayer" class="w-full h-full"></div>
            <div class="reels-actions">
                <div><i class="fa-regular fa-heart"></i><span>12.5rb</span></div>
                <div><i class="fa-regular fa-comment"></i><span>450</span></div>
                <div><i class="fa-regular fa-paper-plane"></i></div>
                <div><i class="fa-solid fa-ellipsis-vertical"></i></div>
            </div>
            <button onclick="closeReels()" class="absolute top-6 left-5 text-2xl text-white"><i class="fa-solid fa-arrow-left"></i></button>
        </div>
    </div>

    <div id="searchOverlay">
        <div class="search-header">
            <i class="fa-solid fa-arrow-left text-xl text-white" onclick="closeSearch()"></i>
            <div class="search-input-box">
                <i class="fa-solid fa-magnifying-glass text-zinc-500 text-xs"></i>
                <input type="text" id="searchInp" autocomplete="off" placeholder="Cari film, series, anime..." onkeydown="if(event.key==='Enter') searchAction()">
                <div id="smartSearchDropdown" class="no-scrollbar"></div>
            </div>
        </div>
        <div id="searchGrid" class="movie-grid"></div>
    </div>

    <div id="movieModal" class="modal-player">
        <div class="max-w-xl mx-auto pb-40">
            <div class="px-4 h-[54px] flex items-center border-b border-zinc-900 sticky top-0 bg-black z-50">
                <i class="fa-solid fa-chevron-left text-xl cursor-pointer" onclick="closeModal()"></i>
                <div class="flex-grow text-center text-[14px] font-bold truncate px-8" id="mTitle"></div>
            </div>
            <div id="castContainer" class="cast-wrapper px-4 no-scrollbar"></div>
            <div class="relative overflow-hidden">
                <div class="swipe-overlay" id="swipeOverlay"></div>
                <div class="carousel-track" id="carouselTrack"></div>
                <div id="carouselDots" class="flex justify-center gap-2 py-3"></div>
            </div>
            <div class="px-4 py-3 flex justify-between items-center">
                <div class="flex gap-4">
                    <i id="btnLikeModal" class="interaction-icon"></i>
                    <i class="fa-regular fa-comment interaction-icon"></i>
                    <i class="fa-regular fa-paper-plane interaction-icon"></i>
                </div>
                <i id="btnBookModal" class="interaction-icon"></i>
            </div>
            <div class="ig-post-content px-4">
                <span id="mLikeDisplay" class="ig-likes-count font-bold text-sm"></span>
                <div class="mb-1 text-sm mt-1">
                    <span class="ig-username font-bold">amnesfubbia.xx1</span>
                    <span id="mDesc" class="ig-caption"></span>
                    <span id="mToggleBtn" class="toggle-btn text-zinc-500 hidden" onclick="handleToggleDesc()">selengkapnya</span>
                </div>
                <div id="mHashtags" class="text-[#e0f1ff] text-sm mt-2"></div>
                <div id="mDateDisplay" class="text-zinc-500 text-[11px] mt-2 uppercase"></div>
                
                <div id="seriesControl" class="hidden mt-6 p-4 bg-zinc-950 rounded-2xl border border-zinc-900">
                    <div class="flex justify-between items-center mb-4"><h4 class="text-[9px] font-black text-zinc-400 uppercase">Episode</h4><select id="seasonSel" class="bg-zinc-900 text-white text-[10px] px-2 py-1 rounded" onchange="loadEpisodes()"></select></div>
                    <div id="episodeGrid" class="grid grid-cols-5 gap-2"></div>
                </div>
                <div id="serverList" class="grid grid-cols-3 gap-2 mt-6"></div>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <i class="fa-solid fa-house cursor-pointer text-xl" onclick="location.reload()"></i>
        <i class="fa-solid fa-magnifying-glass cursor-pointer text-xl" onclick="openSearch()"></i>
        <i class="fa-solid fa-clapperboard cursor-pointer text-xl" onclick="openReels()"></i>
        <i class="fa-regular fa-bookmark cursor-pointer text-xl" onclick="switchTab('bookmarks', document.getElementById('tabBookmark'))"></i>
    </nav>

    <div id="filterOverlay" onclick="closeD()"></div>
    <div id="countryDropdown" class="filter-dropdown no-scrollbar"></div>
    <div id="genreDropdown" class="filter-dropdown no-scrollbar"></div>
    <div id="yearDropdown" class="filter-dropdown no-scrollbar"></div>

    <script>
        const API_KEY = 'bfa7df5310c9974f62f26c6789a8c00d';
        let page = 1, loading = false, currentType = 'movie', currentGenre = '', currentYear = '', currentCountry = '', currentSchedule = 'trending', searchQuery = '', currentCompany = '', currentLibMode = false, currentCastId = '';
        let isExpanded = false, globalFullDesc = "", globalEnDesc = "", currentIdx = 0, startX = 0;

        window.onload = () => { initFilters(); initHighlights(); loadFeed(); setupSwipe(); initSmartSearch(); };

        // --- DARK MODE LOGIC ---
        function toggleDarkMode() {
            document.body.classList.toggle('light-mode');
        }

        // --- REELS LOGIC ---
        function openReels() {
            document.getElementById('reelsView').style.display = 'block';
            document.getElementById('reelsPlayer').innerHTML = `<iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1" class="w-full h-full border-none"></iframe>`;
        }

        function closeReels() {
            document.getElementById('reelsView').style.display = 'none';
            document.getElementById('reelsPlayer').innerHTML = '';
        }

        // --- MODAL TRANSITION LOGIC ---
        async function openModal(id, type) {
            window.currentMediaId = id; window.currentMediaType = type;
            const modal = document.getElementById('movieModal');
            modal.style.display = 'block';
            setTimeout(() => modal.classList.add('active'), 10);
            
            document.getElementById('smartSearchDropdown').style.display = 'none'; 
            document.body.style.overflow = 'hidden'; 
            currentIdx = 0;
            
            const [rId, rEn, rCast] = await Promise.all([
                fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=${API_KEY}&language=id-ID&append_to_response=videos`),
                fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=${API_KEY}&language=en-US&append_to_response=videos`),
                fetch(`https://api.themoviedb.org/3/${type}/${id}/credits?api_key=${API_KEY}`)
            ]);
            const dId = await rId.json(), dEn = await rEn.json(), dCast = await rCast.json();
            const vids = [...(dId.videos?.results || []), ...(dEn.videos?.results || [])].filter(v => v.site === 'YouTube' && (v.type === 'Trailer' || v.type === 'Teaser')).slice(0, 4);
            const track = document.getElementById('carouselTrack'), dots = document.getElementById('carouselDots');
            track.innerHTML = ''; dots.innerHTML = ''; track.style.transform = 'translateX(0)';
            
            if(vids.length > 0) { 
                vids.forEach((v, i) => { track.innerHTML += `<div class="carousel-slide"><iframe id="yt-${i}" src="https://www.youtube.com/embed/${v.key}?enablejsapi=1&autoplay=${i===0?1:0}&mute=0&rel=0" class="w-full h-full" allow="autoplay; fullscreen"></iframe></div>`; dots.innerHTML += `<div class="dot w-1.5 h-1.5 rounded-full ${i===currentIdx?'bg-blue-500':'bg-zinc-700'}"></div>`; }); document.getElementById('swipeOverlay').style.display = 'block'; 
            } else { 
                track.innerHTML = `<div class="carousel-slide"><iframe src="https://vidrock.net/embed/${type}/${id}${type==='tv'?'/1/1':''}" class="w-full h-full" allowfullscreen></iframe></div>`; dots.innerHTML = `<div class="dot bg-blue-500 w-1.5 h-1.5 rounded-full"></div>`; document.getElementById('swipeOverlay').style.display = 'none'; 
            }
            
            document.getElementById('castContainer').innerHTML = (dCast.cast || []).slice(0, 10).map(c => `<div class="cast-item" onclick="searchByCast(${c.id})"><div class="cast-img-border"><img src="${c.profile_path ? 'https://image.tmdb.org/t/p/w185' + c.profile_path : 'https://www.themoviedb.org/assets/2/v4/glyphicons/basic/glyphicons-basic-4-user-3245c3f3347706a035c9744ffaa5d174e48be3b860667e406723f3bc8160f47e.svg'}"></div><span class="cast-name">${c.name}</span></div>`).join('');
            document.getElementById('mLikeDisplay').innerText = `${Math.floor((dId.vote_average || 0) * 1234).toLocaleString('id-ID')} suka`; document.getElementById('mTitle').innerText = dId.title || dId.name || dEn.title;
            globalFullDesc = dId.overview || dEn.overview || "Sinopsis tidak tersedia.";
            isExpanded = false; renderSynopsis();
            const rel = dId.release_date || dId.first_air_date || ""; document.getElementById('mHashtags').innerText = `#${(dId.title||dId.name||"").replace(/\s+/g, '')} #${rel.split('-')[0]}`; document.getElementById('mDateDisplay').innerText = rel ? new Date(rel).toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' }) : '';
            document.getElementById('serverList').innerHTML = `<button class="server-btn" onclick="playVid('https://vidrock.net/embed/${type}/${id}${type==='tv'?'/1/1':''}', this)">Server 1</button><button class="server-btn" onclick="playVid('https://vidsrc.me/embed/${type}?tmdb=${id}', this)">Server 2</button><button class="server-btn" onclick="playVid('https://embed.smashystream.com/playere.php?tmdb=${id}', this)">Server 3</button>`;
            if(type === 'tv') { document.getElementById('seriesControl').classList.remove('hidden'); document.getElementById('seasonSel').innerHTML = (dId.seasons||[]).filter(s=>s.season_number>0).map(s=>`<option value="${s.season_number}">Season ${s.season_number}</option>`).join(''); loadEpisodes(); } else { document.getElementById('seriesControl').classList.add('hidden'); }
            updateLibButtons(id);
        }

        function closeModal() { 
            const modal = document.getElementById('movieModal');
            modal.classList.remove('active');
            setTimeout(() => { modal.style.display = 'none'; }, 400);
            document.body.style.overflow = 'auto'; 
        }

        // --- SISANYA ADALAH LOGIKA ASLIMU (TIDAK BERUBAH) ---
        function initSmartSearch() { const inp = document.getElementById('searchInp'); const drop = document.getElementById('smartSearchDropdown'); let timeout = null; inp.addEventListener('input', () => { clearTimeout(timeout); const q = inp.value.trim(); if(q.length < 2) { drop.style.display = 'none'; return; } timeout = setTimeout(async () => { const res = await fetch(`https://api.themoviedb.org/3/search/multi?query=${encodeURIComponent(q)}&api_key=${API_KEY}&language=id-ID`); const data = await res.json(); const results = (data.results || []).slice(0, 5); if(results.length) { drop.innerHTML = results.map(m => `<div class="smart-item flex items-center p-3 gap-3 border-b border-zinc-800" onclick="openModal(${m.id}, '${m.media_type || 'movie'}')"><img src="https://image.tmdb.org/t/p/w92${m.poster_path || m.profile_path}" class="w-8 h-12 object-cover rounded"><div class="smart-info"><span class="smart-name block text-xs font-bold">${m.title || m.name}</span><span class="smart-meta text-[10px] text-zinc-500">${m.media_type === 'tv' ? 'Series' : 'Film'}</span></div></div>`).join(''); drop.style.display = 'block'; } else { drop.style.display = 'none'; } }, 300); }); }
        function initHighlights() { const hls = [{n: 'Disney', com: '2|6125|3166|34213', l: 'DSNY', t: 'movie'},{n: 'Pixar', com: '3', l: 'PIXR', t: 'movie'},{n: 'Dreamworks', com: '521|7|1778', l: 'DRMW', t: 'movie'},{n: 'Ghibli', com: '10342', l: 'GHBL', t: 'movie'},{n: 'Anime', g: 16, l: 'ANIM', t: 'movie', c: 'JP'},{n: 'Indonesia', c: 'ID', l: 'INDO', t: 'movie'},{n: 'Korea', c: 'KR', l: 'KOR', t: 'movie'}]; const cont = document.getElementById('highlightList'); hls.forEach(h => { const div = document.createElement('div'); div.className = 'highlight-item'; div.onclick = () => { currentLibMode = false; searchQuery = ''; currentCountry = h.c || ''; currentGenre = h.g || ''; currentCompany = h.com || ''; currentType = h.t; loadFeed(true); }; div.innerHTML = `<div class="highlight-circle"><span class="hl-logo">${h.l}</span></div><div class="highlight-text">${h.n}</div>`; cont.appendChild(div); }); }
        function initFilters() { const yD = document.getElementById('yearDropdown'); let yearHTML = '<div class="filter-item p-4 text-center border-b border-zinc-800" onclick="setYear(\'\')">Semua Tahun</div>'; for(let y=2026; y>=1900; y--) yearHTML += `<div class="filter-item p-4 text-center border-b border-zinc-800" onclick="setYear(${y})">${y}</div>`; yD.innerHTML = yearHTML; const countries = [['ID','Indonesia'],['US','USA'],['KR','Korea'],['JP','Jepang']]; const cD = document.getElementById('countryDropdown'); let countryHTML = '<div class="filter-item p-4 text-center border-b border-zinc-800" onclick="setCountry(\'\',\'Negara\')">Semua Negara</div>'; countries.forEach(c => countryHTML += `<div class="filter-item p-4 text-center border-b border-zinc-800" onclick="setCountry('${c[0]}','${c[1]}')">${c[1]}</div>`); cD.innerHTML = countryHTML; }
        function toggleFilter(e, id) { e.stopPropagation(); const d = document.getElementById(id); d.style.display = 'block'; document.getElementById('filterOverlay').style.display = 'block'; }
        function closeD() { document.querySelectorAll('.filter-dropdown').forEach(d => d.style.display = 'none'); document.getElementById('filterOverlay').style.display = 'none'; }
        async function loadFeed(isNew = true) { if(loading) return; loading = true; const grid = document.getElementById('feedGrid'); if(isNew) { page = 1; grid.innerHTML = ''; } let url = `https://api.themoviedb.org/3/discover/${currentType==='short'?'movie':currentType}?api_key=${API_KEY}&language=id-ID&page=${page}&sort_by=popularity.desc`; if(currentCountry) url += `&with_origin_country=${currentCountry}`; if(currentGenre) url += `&with_genres=${currentGenre}`; if(currentYear) url += `&primary_release_year=${currentYear}`; const res = await fetch(url); const data = await res.json(); renderGrid(data.results || [], grid); loading = false; }
        function renderGrid(items, grid) { items.forEach(m => { if(!m.poster_path) return; const card = document.createElement('div'); card.className = 'post-card'; card.onclick = () => openModal(m.id, m.title?'movie':'tv'); card.innerHTML = `<img src="https://image.tmdb.org/t/p/w342${m.poster_path}">`; grid.appendChild(card); }); }
        function openSearch() { document.getElementById('searchOverlay').style.display = 'block'; }
        function closeSearch() { document.getElementById('searchOverlay').style.display = 'none'; }
        function toggleFilterBar() { const b = document.getElementById('filterBar'); b.style.display = b.style.display === 'block' ? 'none' : 'block'; }
        function setSchedule(v, el) { currentSchedule=v; loadFeed(true); }
        function setFilter(k, v) { currentType=v; loadFeed(true); }
        function setYear(y) { currentYear=y; closeD(); loadFeed(true); }
        function setCountry(c, n) { currentCountry=c; closeD(); loadFeed(true); }
        function renderSynopsis() { const descEl = document.getElementById('mDesc'), toggleBtn = document.getElementById('mToggleBtn'); descEl.innerText = isExpanded ? globalFullDesc : globalFullDesc.substring(0, 90) + "..."; toggleBtn.classList.toggle('hidden', globalFullDesc.length <= 90); }
        function handleToggleDesc() { isExpanded = !isExpanded; renderSynopsis(); }
        function playVid(url, el) { document.getElementById('carouselTrack').innerHTML = `<div class="carousel-slide"><iframe src="${url}" class="w-full h-full" allowfullscreen></iframe></div>`; document.getElementById('swipeOverlay').style.display = 'none'; }
        async function loadEpisodes() { const s = document.getElementById('seasonSel').value; const res = await fetch(`https://api.themoviedb.org/3/tv/${window.currentMediaId}/season/${s}?api_key=${API_KEY}`); const d = await res.json(); document.getElementById('episodeGrid').innerHTML = (d.episodes||[]).map(e => `<div class="pill text-[10px]" onclick="playVid('https://vidrock.net/embed/tv/${window.currentMediaId}/${s}/${e.episode_number}', this)">${e.episode_number}</div>`).join(''); }
        function setupSwipe() { const overlay = document.getElementById('swipeOverlay'); overlay.addEventListener('touchstart', e => { startX = e.touches[0].clientX; }); overlay.addEventListener('touchend', e => { let diff = startX - e.changedTouches[0].clientX; if(Math.abs(diff) > 50) { if(diff > 0 && currentIdx < 3) currentIdx++; else if(diff < 0 && currentIdx > 0) currentIdx--; document.getElementById('carouselTrack').style.transform = `translateX(-${currentIdx * 100}%)`; } }); }
        function updateLibButtons(id) { const isL = JSON.parse(localStorage.getItem('likes') || '[]').some(x=>x.id==id); document.getElementById('btnLikeModal').className = isL ? 'fa-solid fa-heart text-red-500' : 'fa-regular fa-heart'; }
        function switchTab(mode, el) { currentLibMode = (mode !== 'grid'); if(!currentLibMode) loadFeed(true); }
    </script>
</body>
</html>
