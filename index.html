<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>amnesfubbia xx1 - Animation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@1,700&family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { background-color: #000; color: #fff; font-family: 'Inter', sans-serif; margin: 0; overflow-x: hidden; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        /* Header Tetap di Atas */
        .fixed-header-section { position: fixed; top: 0; width: 100%; z-index: 100; background: #000; }
        .ig-header { padding: 12px 15px 5px 15px; }
        .ig-logo { font-family: 'DM Sans', sans-serif; font-weight: 700; font-style: italic; font-size: 24px; letter-spacing: -0.8px; text-transform: lowercase; }
        .verified-icon { font-size: 13px; color: #0095f6; margin-left: 5px; }

        .search-container { background: #0a0a0a; border-radius: 8px; display: flex; align-items: center; padding: 7px 12px; flex-grow: 1; border: 1px solid #1c1c1c; margin-top: 8px; }
        .search-container input { background: transparent; border: none; color: white; font-size: 13px; width: 100%; outline: none; margin-left: 8px; }

        /* Navigation Pills */
        .category-wrapper { padding: 10px 15px; background: #000; }
        .scroll-pills { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 5px; }
        .pill { flex: 0 0 auto; background: #121212; border: 1px solid #1c1c1c; color: #888; padding: 6px 16px; border-radius: 20px; font-size: 11px; font-weight: 600; transition: 0.3s; }
        .pill.active { background: #fff; color: #000; border-color: #fff; }

        /* Highlights Studio (Instagram Story Style) */
        .highlights-section { padding: 5px 0 15px 0; background: #000; border-bottom: 1px solid #1c1c1c; }
        .highlights-container { display: flex; gap: 15px; overflow-x: auto; padding: 0 15px; }
        .highlight-item { flex: 0 0 70px; text-align: center; }
        .circle-outer { width: 64px; height: 64px; border-radius: 50%; padding: 2px; background: #1c1c1c; margin-bottom: 6px; position: relative; }
        .highlight-item.active .circle-outer { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
        .circle-inner { width: 100%; height: 100%; border-radius: 50%; background: #000; border: 2px solid #000; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .circle-inner img { width: 75%; height: 75%; object-fit: contain; filter: grayscale(1) invert(1); }
        .highlight-item.active .circle-inner img { filter: grayscale(0) invert(0); }
        .highlight-label { font-size: 10px; color: #888; font-weight: 500; }
        .highlight-item.active .highlight-label { color: #fff; font-weight: 600; }

        /* Grid Film */
        .movie-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; padding-top: 300px; padding-bottom: 80px; }
        .post-card { aspect-ratio: 1/1.5; background: #0a0a0a; position: relative; overflow: hidden; }
        .post-card img { width: 100%; height: 100%; object-fit: cover; }
        .card-meta { position: absolute; bottom: 0; left: 0; right: 0; padding: 10px 5px; background: linear-gradient(transparent, rgba(0,0,0,0.8)); font-size: 9px; }

        /* Bottom Sheet Menu (Drawer) */
        .bottom-sheet { position: fixed; bottom: -100%; left: 0; right: 0; background: #121212; z-index: 1000; border-radius: 20px 20px 0 0; transition: bottom 0.4s cubic-bezier(0.4, 0, 0.2, 1); padding: 20px; max-height: 70vh; overflow-y: auto; }
        .bottom-sheet.show { bottom: 0; }
        .sheet-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 999; display: none; }
        .sheet-overlay.show { display: block; }
        .sheet-handle { width: 40px; height: 4px; background: #333; border-radius: 2px; margin: 0 auto 20px auto; }
        .sheet-title { font-size: 16px; font-weight: 700; margin-bottom: 20px; text-align: center; }
        .grid-options { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .opt-btn { background: #1c1c1c; padding: 12px; border-radius: 10px; text-align: center; font-size: 12px; font-weight: 600; cursor: pointer; }
        .opt-btn.active { background: #fff; color: #000; }

        /* Navigasi Bawah */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: #000; border-top: 1px solid #1c1c1c; display: flex; justify-content: space-around; padding: 15px 0; z-index: 500; }
    </style>
</head>
<body>

    <div class="fixed-header-section">
        <header class="ig-header">
            <div class="flex justify-between items-center">
                <div class="flex items-center">
                    <h1 class="ig-logo">amnesfubbia <span class="text-zinc-500 font-normal italic">xx1</span></h1>
                    <i class="fa-solid fa-circle-check verified-icon"></i>
                </div>
                <div class="flex gap-5 text-xl">
                    <i class="fa-regular fa-square-plus"></i>
                    <i class="fa-regular fa-heart"></i>
                </div>
            </div>
            <div class="search-container">
                <i class="fa-solid fa-magnifying-glass text-zinc-600 text-[12px]"></i>
                <input type="text" id="searchInp" placeholder="Cari animasi...">
            </div>
        </header>

        <!-- Menu Bar 1 & 2 -->
        <div class="category-wrapper">
            <div class="scroll-pills no-scrollbar mb-3" id="mainTypePills">
                <button class="pill active" onclick="setMainType('multi', this)">Semua</button>
                <button class="pill" onclick="setMainType('movie', this)">Film</button>
                <button class="pill" onclick="setMainType('tv', this)">Series</button>
                <button class="pill" onclick="setMainType('short', this)">Short</button>
            </div>
            <div class="scroll-pills no-scrollbar" id="filterPills">
                <button class="pill active" onclick="resetFilters(this)">Semua</button>
                <button class="pill" onclick="openSheet('year')">Tahun <i class="fa-solid fa-chevron-down ml-1 text-[8px]"></i></button>
                <button class="pill" onclick="openSheet('country')">Negara <i class="fa-solid fa-chevron-down ml-1 text-[8px]"></i></button>
                <button class="pill" onclick="openSheet('genre')">Genre <i class="fa-solid fa-chevron-down ml-1 text-[8px]"></i></button>
            </div>
        </div>

        <!-- Studio Highlights -->
        <div class="highlights-section">
            <div class="highlights-container no-scrollbar" id="studioList">
                <div class="highlight-item active" onclick="setStudio('', this)">
                    <div class="circle-outer"><div class="circle-inner"><i class="fa-solid fa-clapperboard text-xl"></i></div></div>
                    <p class="highlight-label">Semua</p>
                </div>
                <div class="highlight-item" onclick="setStudio('Disney', this)">
                    <div class="circle-outer"><div class="circle-inner"><img src="https://upload.wikimedia.org/wikipedia/commons/3/3a/Walt_Disney_Pictures_logo.svg"></div></div>
                    <p class="highlight-label">Disney</p>
                </div>
                <div class="highlight-item" onclick="setStudio('Pixar', this)">
                    <div class="circle-outer"><div class="circle-inner"><img src="https://upload.wikimedia.org/wikipedia/commons/0/03/Pixar_logo.svg"></div></div>
                    <p class="highlight-label">Pixar</p>
                </div>
                <div class="highlight-item" onclick="setStudio('DreamWorks', this)">
                    <div class="circle-outer"><div class="circle-inner"><img src="https://upload.wikimedia.org/wikipedia/en/2/23/DreamWorks_Animation_logo.svg"></div></div>
                    <p class="highlight-label">Dreamworks</p>
                </div>
                <div class="highlight-item" onclick="setStudio('Ghibli', this)">
                    <div class="circle-outer"><div class="circle-inner"><img src="https://upload.wikimedia.org/wikipedia/en/c/ca/Studio_Ghibli_logo.svg"></div></div>
                    <p class="highlight-label">Ghibli</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Overlay & Bottom Sheet -->
    <div class="sheet-overlay" id="overlay" onclick="closeSheet()"></div>
    <div class="bottom-sheet" id="filterSheet">
        <div class="sheet-handle"></div>
        <h3 id="sheetTitle" class="sheet-title">Pilih</h3>
        <div id="sheetOptions" class="grid-options"></div>
    </div>

    <!-- Feed Grid -->
    <main id="feedGrid" class="movie-grid"></main>

    <!-- Bottom Nav -->
    <nav class="bottom-nav">
        <i class="fa-solid fa-house text-xl"></i>
        <i class="fa-solid fa-magnifying-glass text-xl text-zinc-500"></i>
        <i class="fa-regular fa-square-plus text-xl text-zinc-500"></i>
        <i class="fa-regular fa-heart text-xl text-zinc-500"></i>
        <div class="w-6 h-6 rounded-full bg-zinc-800 border border-zinc-700"></div>
    </nav>

    <script>
        const API_KEY = 'bfa7df5310c9974f62f26c6789a8c00d';
        let state = {
            type: 'multi',
            studio: '',
            year: '',
            genre: '',
            page: 1
        };

        // Inisialisasi
        window.onload = () => fetchMovies();

        async function fetchMovies(isNew = true) {
            const grid = document.getElementById('feedGrid');
            if(isNew) {
                state.page = 1;
                grid.innerHTML = Array(12).fill('<div class="post-card bg-zinc-900 animate-pulse"></div>').join('');
                window.scrollTo(0,0);
            }

            try {
                let url = `https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&with_genres=16&language=id-ID&page=${state.page}`;
                
                if(state.year) url += `&primary_release_year=${state.year}`;
                if(state.genre) url += `&with_genres=16,${state.genre}`;

                const resp = await fetch(url);
                const data = await resp.json();
                
                if(isNew) grid.innerHTML = '';
                renderGrid(data.results);
            } catch (e) {
                console.error("Gagal memuat data", e);
            }
        }

        function renderGrid(movies) {
            const grid = document.getElementById('feedGrid');
            movies.forEach(m => {
                if(!m.poster_path) return;
                const div = document.createElement('div');
                div.className = 'post-card';
                div.innerHTML = `
                    <img src="https://image.tmdb.org/t/p/w342${m.poster_path}" loading="lazy">
                    <div class="card-meta">
                        <span class="font-bold"><i class="fa-solid fa-star text-yellow-500"></i> ${m.vote_average.toFixed(1)}</span>
                    </div>
                `;
                grid.appendChild(div);
            });
        }

        function setMainType(type, el) {
            document.querySelectorAll('#mainTypePills .pill').forEach(p => p.classList.remove('active'));
            el.classList.add('active');
            state.type = type;
            fetchMovies(true);
        }

        function setStudio(studio, el) {
            document.querySelectorAll('#studioList .highlight-item').forEach(p => p.classList.remove('active'));
            el.classList.add('active');
            state.studio = studio;
            fetchMovies(true);
        }

        function openSheet(mode) {
            const sheet = document.getElementById('filterSheet');
            const overlay = document.getElementById('overlay');
            const title = document.getElementById('sheetTitle');
            const options = document.getElementById('sheetOptions');
            
            let content = '';
            if(mode === 'year') {
                title.innerText = 'Pilih Tahun';
                for(let y=2025; y>=2015; y--) {
                    content += `<div class="opt-btn ${state.year == y ? 'active' : ''}" onclick="applyFilter('year', '${y}')">${y}</div>`;
                }
            } else if(mode === 'genre') {
                title.innerText = 'Pilih Genre';
                const g = { '12':'Petualangan', '35':'Komedi', '14':'Fantasi', '10751':'Keluarga' };
                for(let id in g) {
                    content += `<div class="opt-btn ${state.genre == id ? 'active' : ''}" onclick="applyFilter('genre', '${id}')">${g[id]}</div>`;
                }
            } else if(mode === 'country') {
                title.innerText = 'Pilih Negara';
                ['USA', 'Japan', 'Korea', 'France'].forEach(c => {
                    content += `<div class="opt-btn" onclick="applyFilter('country', '${c}')">${c}</div>`;
                });
            }

            options.innerHTML = content;
            sheet.classList.add('show');
            overlay.classList.add('show');
        }

        function closeSheet() {
            document.getElementById('filterSheet').classList.remove('show');
            document.getElementById('overlay').classList.remove('show');
        }

        function applyFilter(type, val) {
            state[type] = val;
            closeSheet();
            fetchMovies(true);
        }

        function resetFilters(el) {
            document.querySelectorAll('#filterPills .pill').forEach(p => p.classList.remove('active'));
            el.classList.add('active');
            state.year = '';
            state.genre = '';
            fetchMovies(true);
        }
    </script>
</body>
</html>
