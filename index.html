<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>amnesfubbia xx1 - Animation World</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@1,700&family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { background-color: #000; color: #fff; font-family: 'Inter', sans-serif; margin: 0; overflow-x: hidden; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        /* Header Fixed */
        .fixed-header-section { position: fixed; top: 0; width: 100%; z-index: 100; background: #000; border-bottom: 1px solid #1c1c1c; }
        .ig-header { padding: 12px 15px 5px 15px; }
        .ig-logo { font-family: 'DM Sans', sans-serif; font-weight: 700; font-style: italic; font-size: 24px; letter-spacing: -0.8px; text-transform: lowercase; }
        
        /* Search & Year */
        .search-container { background: #0a0a0a; border-radius: 8px; display: flex; align-items: center; padding: 7px 12px; flex-grow: 1; border: 1px solid #1c1c1c; }
        .year-selector { background: #0a0a0a; border: 1px solid #1c1c1c; border-radius: 8px; padding: 8px 12px; font-size: 9px; font-weight: 800; color: #fff; cursor: pointer; }

        /* Highlight Studio Monokrom */
        .highlights-section { padding: 15px 0; border-bottom: 1px solid #1c1c1c; background: #000; }
        .highlights-container { display: flex; gap: 15px; overflow-x: auto; padding: 0 15px; }
        .circle-icon { width: 62px; height: 62px; border-radius: 50%; background: #111; border: 1.5px solid #1c1c1c; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .circle-icon img { width: 80%; filter: grayscale(100%) invert(1); opacity: 0.7; } /* Logo Jadi Hitam Putih */
        .highlight-label { font-size: 9px; color: #555; font-weight: 700; text-align: center; margin-top: 5px; text-transform: uppercase; }

        /* Grid Film */
        .movie-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; padding-top: 280px; padding-bottom: 100px; }
        .post-card { position: relative; aspect-ratio: 2/3; background: #0a0a0a; overflow: hidden; cursor: pointer; }
        .post-card img { width: 100%; height: 100%; object-fit: cover; }
        
        /* Modal & Player */
        .modal-player { display: none; position: fixed; inset: 0; z-index: 200; background: #000; overflow-y: auto; }
        .server-btn { width: 100%; padding: 14px; border-radius: 12px; font-size: 10px; font-weight: 800; text-transform: uppercase; border: 1px solid #1c1c1c; text-align: center; cursor: pointer; color: #888; margin-top: 8px; }
        
        /* Bottom Nav */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: #000; border-top: 1px solid #1c1c1c; display: flex; justify-content: space-around; padding: 15px 0; z-index: 300; }
    </style>
</head>
<body>

    <div class="fixed-header-section">
        <header class="ig-header">
            <div class="flex justify-between items-center">
                <h1 class="ig-logo">amnesfubbia <span class="text-white opacity-40">xx1</span></h1>
                <div class="flex gap-4"><i class="fa-regular fa-heart"></i><i class="fa-regular fa-paper-plane"></i></div>
            </div>
            <div class="flex items-center gap-2 mt-2">
                <div class="search-container">
                    <input type="text" id="searchInp" placeholder="Cari animasi..." onkeydown="if(event.key==='Enter') searchAction()" class="bg-transparent border-none text-xs w-full outline-none">
                </div>
                <div class="year-selector" onclick="toggleYear()">TAHUN <i class="fa-solid fa-chevron-down ml-1"></i></div>
            </div>
        </header>

        <div class="highlights-section">
            <div class="highlights-container no-scrollbar">
                <div class="flex-shrink-0 cursor-pointer" onclick="filterByStudio(6125)">
                    <div class="circle-icon"><img src="https://upload.wikimedia.org/wikipedia/commons/3/3a/Walt_Disney_Pictures_logo.svg"></div>
                    <p class="highlight-label">Disney</p>
                </div>
                <div class="flex-shrink-0 cursor-pointer" onclick="filterByStudio(3)">
                    <div class="circle-icon"><img src="https://upload.wikimedia.org/wikipedia/commons/0/0b/Pixar_Logo.svg"></div>
                    <p class="highlight-label">Pixar</p>
                </div>
                <div class="flex-shrink-0 cursor-pointer" onclick="filterByStudio(521)">
                    <div class="circle-icon"><img src="https://upload.wikimedia.org/wikipedia/en/2/22/DreamWorks_Animation_logo.svg"></div>
                    <p class="highlight-label">Dreamworks</p>
                </div>
            </div>
        </div>
    </div>

    <main id="feedGrid" class="movie-grid"></main>

    <div id="movieModal" class="modal-player">
        <div class="p-4 flex items-center border-b border-zinc-900 sticky top-0 bg-black z-50">
            <i class="fa-solid fa-chevron-left text-xl mr-4" onclick="closeModal()"></i>
            <h2 id="mTitle" class="font-bold truncate"></h2>
        </div>
        <div class="aspect-video bg-zinc-900">
            <iframe id="videoPlayer" class="w-full h-full" allowfullscreen></iframe>
        </div>
        <div class="p-4">
            <div id="serverList" class="grid grid-cols-2 gap-2"></div>
            <button id="btnDownload" class="server-btn border-zinc-700 text-white mt-4"><i class="fa-solid fa-download mr-2"></i> DOWNLOAD SEKARANG</button>
            <p id="mDesc" class="text-xs text-zinc-500 mt-6 leading-relaxed"></p>
        </div>
    </div>

    <nav class="bottom-nav">
        <i class="fa-solid fa-house text-xl" onclick="location.reload()"></i>
        <i class="fa-solid fa-magnifying-glass text-xl"></i>
        <i class="fa-regular fa-square-plus text-xl"></i>
        <i class="fa-regular fa-user text-xl"></i>
    </nav>

    <script>
        const API_KEY = 'bfa7df5310c9974f62f26c6789a8c00d';
        let page = 1, currentStudio = '', currentYear = '';

        window.onload = () => loadFeed();

        async function loadFeed(isNew = true) {
            if (isNew) { page = 1; document.getElementById('feedGrid').innerHTML = ''; }
            
            // Fokus ke Animasi (16) dari seluruh dunia
            let url = `https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&with_genres=16&page=${page}`;
            if (currentStudio) url += `&with_companies=${currentStudio}`;
            if (currentYear) url += `&primary_release_year=${currentYear}`;

            try {
                const res = await fetch(url);
                const data = await res.json();
                renderFeed(data.results);
            } catch (err) { console.error(err); }
        }

        function renderFeed(items) {
            const grid = document.getElementById('feedGrid');
            items.forEach(m => {
                if (!m.poster_path) return;
                const card = document.createElement('div');
                card.className = 'post-card';
                card.onclick = () => openModal(m.id, 'movie');
                card.innerHTML = `<img src="https://image.tmdb.org/t/p/w342${m.poster_path}">`;
                grid.appendChild(card);
            });
        }

        async function openModal(id, type) {
            const modal = document.getElementById('movieModal');
            modal.style.display = 'block';
            document.body.style.overflow = 'hidden';

            const res = await fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=${API_KEY}`);
            const d = await res.json();
            
            document.getElementById('mTitle').innerText = d.title || d.name;
            document.getElementById('mDesc').innerText = d.overview || "Tidak ada sinopsis.";
            
            // Server Streaming
            document.getElementById('videoPlayer').src = `https://vidrock.net/embed/${type}/${id}`;
            document.getElementById('serverList').innerHTML = `
                <div class="server-btn" onclick="changeServer('${type}', ${id}, 1)">Server 1</div>
                <div class="server-btn" onclick="changeServer('${type}', ${id}, 2)">Server 2</div>
            `;
            
            // Tombol Download
            document.getElementById('btnDownload').onclick = () => window.open(`https://dl.vidsrc.vip/${type}/${id}`, '_blank');
        }

        function changeServer(type, id, s) {
            const base = s === 1 ? 'vidrock.net' : 'vidstorm.ru';
            document.getElementById('videoPlayer').src = `https://${base}/embed/${type}/${id}`;
        }

        function closeModal() {
            document.getElementById('movieModal').style.display = 'none';
            document.getElementById('videoPlayer').src = '';
            document.body.style.overflow = 'auto';
        }

        function filterByStudio(id) {
            currentStudio = id;
            loadFeed(true);
        }

        function toggleYear() {
            const y = prompt("Masukkan Tahun (contoh: 2024):");
            if (y) { currentYear = y; loadFeed(true); }
        }
    </script>
</body>
</html>
