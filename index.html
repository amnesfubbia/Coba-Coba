<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>amnesfubbia xx1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@1,700&family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { background-color: #000; color: #fff; font-family: 'Inter', sans-serif; margin: 0; overflow-x: hidden; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        /* HEADER PROFIL STYLE */
        .fixed-header-section { position: fixed; top: 0; width: 100%; z-index: 100; background: #000; border-bottom: 1px solid #1c1c1c; padding-bottom: 15px; }
        .profile-top { padding: 15px 15px 5px 15px; display: flex; align-items: center; justify-content: space-between; }
        .stats-container { display: flex; gap: 25px; text-align: center; margin-right: 10px; }
        .stat-item { display: flex; flex-direction: column; }
        .stat-num { font-weight: 700; font-size: 16px; }
        .stat-label { font-size: 12px; color: #fff; }
        
        .profile-bio { padding: 0 15px; margin-top: 10px; }
        .bio-name { font-weight: 700; font-size: 14px; display: flex; align-items: center; }
        .bio-text { font-size: 13px; color: #fff; line-height: 1.4; white-space: pre-line; }

        /* ACTION BUTTONS */
        .action-btns { display: flex; gap: 6px; padding: 15px 15px 0 15px; }
        .btn-insta { flex: 1; background: #1c1c1c; border-radius: 8px; padding: 8px 0; font-size: 13px; font-weight: 600; text-align: center; cursor: pointer; }
        .btn-insta.active { background: #363636; }
        .btn-plus { background: #1c1c1c; padding: 8px 12px; border-radius: 8px; cursor: pointer; }

        /* HIGHLIGHTS / SOROTAN */
        .highlights-wrapper { display: flex; overflow-x: auto; gap: 15px; padding: 15px; }
        .highlight-item { flex: 0 0 65px; text-align: center; cursor: pointer; }
        .highlight-circle { width: 64px; height: 64px; border-radius: 50%; border: 1px solid #333; display: flex; align-items: center; justify-content: center; margin-bottom: 5px; background: #000; }
        .highlight-circle i { font-size: 24px; color: #fff; filter: grayscale(1); }
        .highlight-circle img { width: 40px; height: 40px; filter: grayscale(1); object-fit: contain; }
        .highlight-text { font-size: 11px; color: #fff; }

        /* GRID TABS */
        .grid-tabs { display: flex; border-top: 1px solid #1c1c1c; margin-top: 5px; }
        .tab-item { flex: 1; text-align: center; padding: 12px; font-size: 20px; color: #8e8e8e; border-bottom: 2px solid transparent; }
        .tab-item.active { color: #fff; border-bottom: 2px solid #fff; }

        /* OVERLAY SEARCH */
        #searchOverlay { display: none; position: fixed; inset: 0; background: #000; z-index: 500; }
        .search-bar { display: flex; align-items: center; padding: 10px 15px; gap: 10px; }
        .search-input-wrap { flex: 1; background: #1c1c1c; border-radius: 10px; display: flex; align-items: center; padding: 8px 12px; }
        .search-input-wrap input { background: transparent; border: none; color: #fff; outline: none; width: 100%; font-size: 14px; margin-left: 8px; }

        /* EXISTING STYLE RE-ADAPTED */
        .movie-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; padding-top: 540px; padding-bottom: 80px; }
        .post-card { position: relative; aspect-ratio: 1/1; background: #0a0a0a; overflow: hidden; } /* Kotak Persegi Instagram */
        .post-card img { width: 100%; height: 100%; object-fit: cover; }
        .badge-rating { position: absolute; top: 5px; right: 5px; padding: 2px 4px; border-radius: 4px; font-size: 8px; font-weight: 800; background: rgba(0,0,0,0.6); color: #fff; }
        .badge-type { display: none; } /* Sembunyikan badge type agar bersih seperti feed IG */

        .filter-bar { display: none; padding: 10px 15px; gap: 8px; overflow-x: auto; background: #000; }
        .filter-dropdown { display: none; position: fixed; background: #121212; border: 1px solid #1c1c1c; border-radius: 12px; z-index: 200; width: 150px; max-height: 300px; overflow-y: auto; }
        
        .modal-player { display: none; position: fixed; inset: 0; z-index: 600; background: #000; overflow-y: auto; }
        .carousel-track { display: flex; transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1); width: 100%; }
        .carousel-slide { min-width: 100%; aspect-ratio: 16/9; position: relative; }
        .swipe-overlay { position: absolute; inset: 0; z-index: 10; background: transparent; }
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: #000; border-top: 1px solid #1c1c1c; display: flex; justify-content: space-around; padding: 12px 0; z-index: 300; }
        
        /* Highlight icon grayscale */
        .mono-icon { filter: grayscale(1) brightness(1.5); }
    </style>
</head>
<body>

    <div class="fixed-header-section">
        <div class="profile-top">
            <div class="flex items-center gap-1">
                <h1 class="font-bold text-xl">amnesfubbia <i class="fa-solid fa-chevron-down text-[10px]"></i></h1>
                <div class="w-2 h-2 bg-red-600 rounded-full"></div>
            </div>
            <div class="flex gap-5 text-2xl">
                <i class="fa-regular fa-square-plus" onclick="alert('Fitur upload segera hadir!')"></i>
                <i class="fa-solid fa-bars" onclick="toggleFilterBar()"></i>
            </div>
        </div>

        <div class="flex items-center px-4 mt-2">
            <div class="relative">
                <div class="w-20 h-20 rounded-full border-2 border-zinc-800 p-1">
                    <img src="https://i.ibb.co/pBTXmYV/profile.jpg" class="w-full h-full rounded-full object-cover bg-zinc-900" onerror="this.src='https://www.themoviedb.org/assets/2/v4/glyphicons/basic/glyphicons-basic-4-user-3245c3f3347706a035c9744ffaa5d174e48be3b860667e406723f3bc8160f47e.svg'">
                </div>
                <div class="absolute bottom-0 right-0 bg-blue-500 rounded-full w-5 h-5 flex items-center justify-center border-2 border-black">
                    <i class="fa-solid fa-plus text-[10px]"></i>
                </div>
            </div>
            <div class="flex-grow flex justify-center ml-4">
                <div class="stats-container">
                    <div class="stat-item">
                        <span class="stat-num">25.4rb</span>
                        <span class="stat-label">Film</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-num">8.2rb</span>
                        <span class="stat-label">Series</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-num">1.5rb</span>
                        <span class="stat-label">Short</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="profile-bio">
            <div class="bio-name">amnesfubbia xx1 <i class="fa-solid fa-circle-check text-[#0095f6] ml-1 text-[12px]"></i></div>
            <div class="bio-text">dari indonesia untuk dunia
By Anasteas</div>
        </div>

        <div class="action-btns">
            <div id="btnNow" class="btn-insta active" onclick="setSchedule('now_playing', this)">Sedang Tayang</div>
            <div id="btnSoon" class="btn-insta" onclick="setSchedule('upcoming', this)">Segera Tayang</div>
            <div class="btn-plus" onclick="toggleFilterBar()"><i class="fa-solid fa-user-plus text-sm"></i></div>
        </div>

        <div id="filterBar" class="filter-bar no-scrollbar">
            <button class="pill bg-zinc-900 px-4 py-1 rounded-md text-[10px] font-bold" onclick="toggleFilter('countryDropdown')">NEGARA</button>
            <button class="pill bg-zinc-900 px-4 py-1 rounded-md text-[10px] font-bold" onclick="toggleFilter('genreDropdown')">GENRE</button>
            <button class="pill bg-zinc-900 px-4 py-1 rounded-md text-[10px] font-bold" onclick="toggleFilter('yearDropdown')">TAHUN</button>
        </div>

        <div class="highlights-wrapper no-scrollbar">
            <div class="highlight-item" onclick="setHighlight('Anime')"><div class="highlight-circle"><i class="fa-solid fa-mask"></i></div><span class="highlight-text">Anime</span></div>
            <div class="highlight-item" onclick="setCountry('KR', 'Korea')"><div class="highlight-circle"><i class="fa-solid fa-heart"></i></div><span class="highlight-text">Korea</span></div>
            <div class="highlight-item" onclick="setCountry('ID', 'Indonesia')"><div class="highlight-circle"><i class="fa-solid fa-star"></i></div><span class="highlight-text">Indonesia</span></div>
            <div class="highlight-item" onclick="setCountry('IN', 'India')"><div class="highlight-circle"><i class="fa-solid fa-film"></i></div><span class="highlight-text">India</span></div>
            <div class="highlight-item" onclick="setCountry('TH', 'Thailand')"><div class="highlight-circle"><i class="fa-solid fa-bolt"></i></div><span class="highlight-text">Thailand</span></div>
            <div class="highlight-item" onclick="setHighlight('Disney')"><div class="highlight-circle"><i class="fa-solid fa-castle"></i></div><span class="highlight-text">Disney</span></div>
            <div class="highlight-item" onclick="setHighlight('Marvel')"><div class="highlight-circle"><i class="fa-solid fa-hand-fist"></i></div><span class="highlight-text">Marvel</span></div>
            <div class="highlight-item" onclick="setHighlight('Netflix')"><div class="highlight-circle"><i class="fa-solid fa-n"></i></div><span class="highlight-text">Netflix</span></div>
            <div class="highlight-item" onclick="setHighlight('DC')"><div class="highlight-circle"><i class="fa-solid fa-bat"></i></div><span class="highlight-text">DC Universe</span></div>
        </div>

        <div class="grid-tabs">
            <div class="tab-item active"><i class="fa-solid fa-table-cells"></i></div>
            <div class="tab-item" onclick="showLibrary('bookmarks')"><i class="fa-regular fa-bookmark"></i></div>
            <div class="tab-item" onclick="showLibrary('likes')"><i class="fa-regular fa-heart"></i></div>
        </div>
    </div>

    <div id="countryDropdown" class="filter-dropdown left-[15px] top-[300px] no-scrollbar"></div>
    <div id="genreDropdown" class="filter-dropdown left-[35%] top-[300px] no-scrollbar"></div>
    <div id="yearDropdown" class="filter-dropdown right-[15px] top-[300px] no-scrollbar"></div>

    <main id="feedGrid" class="movie-grid"></main>

    <div id="searchOverlay">
        <div class="search-bar">
            <i class="fa-solid fa-arrow-left text-xl" onclick="closeSearch()"></i>
            <div class="search-input-wrap">
                <i class="fa-solid fa-magnifying-glass text-zinc-500"></i>
                <input type="text" id="searchInp" placeholder="Cari film, series, anime..." onkeydown="if(event.key==='Enter') searchAction()">
            </div>
        </div>
        <main id="searchGrid" class="movie-grid" style="padding-top: 70px;"></main>
    </div>

    <div id="movieModal" class="modal-player">
        <div class="max-w-xl mx-auto pb-40">
            <div class="px-4 h-[54px] flex items-center border-b border-zinc-900 sticky top-0 bg-black z-50">
                <i class="fa-solid fa-chevron-left text-xl cursor-pointer" onclick="closeModal()"></i>
                <div class="flex-grow text-center text-[14px] font-bold truncate px-8" id="mTitle"></div>
            </div>
            <div id="castContainer" class="cast-wrapper px-4 no-scrollbar"></div>
            <div class="relative overflow-hidden">
                <div class="swipe-overlay" id="swipeOverlay"></div>
                <div class="carousel-track" id="carouselTrack"></div>
                <div id="carouselDots" class="flex justify-center gap-2 py-3"></div>
            </div>
            <div class="px-4 py-3 flex justify-between items-center">
                <div class="flex gap-4">
                    <i id="btnLikeModal" class="text-2xl cursor-pointer"></i>
                    <i class="fa-regular fa-comment text-2xl"></i>
                    <i class="fa-regular fa-paper-plane text-2xl"></i>
                </div>
                <i id="btnBookModal" class="text-2xl cursor-pointer"></i>
            </div>
            <div class="px-4">
                <span id="mLikeDisplay" class="font-bold text-[13px] block mb-1"></span>
                <div class="text-[13px]"><span class="font-bold mr-1">amnesfubbia.xx1</span><span id="mDesc"></span><span id="mToggleBtn" class="text-zinc-500 cursor-pointer ml-1 hidden" onclick="handleToggleDesc()">selengkapnya</span></div>
                <p id="mTranslateBtn" class="text-[11px] text-zinc-500 font-bold mb-2 cursor-pointer hidden">Lihat Terjemahan...</p>
                <div id="mHashtags" class="text-[#e0f1ff] text-[13px] mt-2"></div>
                <div id="mDateDisplay" class="text-[#a8a8a8] text-[11px] mt-2 uppercase"></div>
                <div id="seriesControl" class="hidden mt-6 bg-zinc-950 p-4 rounded-xl border border-zinc-900">
                    <select id="seasonSel" class="bg-zinc-900 text-white w-full p-2 mb-4 rounded text-[10px]" onchange="loadEpisodes()"></select>
                    <div id="episodeGrid" class="grid grid-cols-5 gap-2"></div>
                </div>
                <div id="serverList" class="grid grid-cols-3 gap-2 mt-6"></div>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <i class="fa-solid fa-house" onclick="location.reload()"></i>
        <i class="fa-solid fa-magnifying-glass" onclick="openSearch()"></i>
        <i class="fa-solid fa-clapperboard"></i>
        <i class="fa-solid fa-bag-shopping"></i>
        <img src="https://i.ibb.co/pBTXmYV/profile.jpg" class="w-6 h-6 rounded-full border border-white" onclick="location.reload()">
    </nav>

    <script>
        const API_KEY = 'bfa7df5310c9974f62f26c6789a8c00d';
        let page = 1, loading = false, currentType = 'multi', currentGenre = '', currentYear = '', currentCountry = '', currentSchedule = 'now_playing', searchQuery = '';
        let isExpanded = false, globalFullDesc = "", currentIdx = 0, startX = 0;

        window.onload = () => { initFilters(); loadFeed(); setupSwipe(); };

        function openSearch() { document.getElementById('searchOverlay').style.display = 'block'; document.getElementById('searchInp').focus(); }
        function closeSearch() { document.getElementById('searchOverlay').style.display = 'none'; document.getElementById('searchGrid').innerHTML = ''; }
        function toggleFilterBar() { const fb = document.getElementById('filterBar'); fb.style.display = fb.style.display === 'flex' ? 'none' : 'flex'; }

        async function loadFeed(isNew = true) {
            if(loading) return; loading = true;
            const grid = isSearch ? document.getElementById('searchGrid') : document.getElementById('feedGrid');
            if(isNew) { page = 1; grid.innerHTML = ''; }
            
            let url = `https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&language=id-ID&page=${page}`;
            if(currentSchedule === 'now_playing') url += `&sort_by=popularity.desc`;
            if(currentSchedule === 'upcoming') url += `&primary_release_date.gte=${new Date().toISOString().split('T')[0]}`;
            if(currentCountry) url += `&with_origin_country=${currentCountry}`;
            if(currentGenre) url += `&with_genres=${currentGenre}`;
            if(currentYear) url += `&primary_release_year=${currentYear}`;
            if(searchQuery) url = `https://api.themoviedb.org/3/search/multi?query=${encodeURIComponent(searchQuery)}&api_key=${API_KEY}&language=id-ID&page=${page}`;

            const res = await fetch(url); const data = await res.json();
            renderGrid(data.results || [], grid); loading = false;
        }

        let isSearch = false;
        function searchAction() { isSearch = true; searchQuery = document.getElementById('searchInp').value; loadFeed(true); }

        function renderGrid(items, target) {
            items.forEach(m => {
                if(!m.poster_path) return;
                const div = document.createElement('div'); div.className = 'post-card';
                div.onclick = () => openModal(m.id, m.media_type || 'movie');
                div.innerHTML = `<div class="badge-rating">★ ${m.vote_average.toFixed(1)}</div><img src="https://image.tmdb.org/t/p/w342${m.poster_path}">`;
                target.appendChild(div);
            });
        }

        // LOGIKA MODAL TETAP (TRAILER SLIDE)
        async function openModal(id, type) {
            window.currentMediaId = id; window.currentMediaType = type;
            document.getElementById('movieModal').style.display = 'block';
            document.body.style.overflow = 'hidden'; currentIdx = 0;
            const [rId, rEn, rCast] = await Promise.all([
                fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=${API_KEY}&language=id-ID&append_to_response=videos`),
                fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=${API_KEY}&language=en-US&append_to_response=videos`),
                fetch(`https://api.themoviedb.org/3/${type}/${id}/credits?api_key=${API_KEY}`)
            ]);
            const dId = await rId.json(), dEn = await rEn.json(), dCast = await rCast.json();
            const vids = [...(dId.videos?.results || []), ...(dEn.videos?.results || [])].filter(v => v.site === 'YouTube' && (v.type === 'Trailer' || v.type === 'Teaser')).slice(0, 4);
            const track = document.getElementById('carouselTrack'), dots = document.getElementById('carouselDots');
            track.innerHTML = ''; dots.innerHTML = ''; track.style.transform = 'translateX(0)';
            if(vids.length > 0) {
                vids.forEach((v, i) => {
                    track.innerHTML += `<div class="carousel-slide"><iframe id="yt-${i}" src="https://www.youtube.com/embed/${v.key}?enablejsapi=1&autoplay=${i===0?1:0}&mute=0&rel=0" class="w-full h-full" allow="autoplay; fullscreen"></iframe></div>`;
                    dots.innerHTML += `<div class="dot w-1.5 h-1.5 rounded-full ${i===0?'bg-blue-500':'bg-zinc-700'}"></div>`;
                });
                document.getElementById('swipeOverlay').style.display = 'block';
            } else {
                track.innerHTML = `<div class="carousel-slide"><iframe src="https://vidrock.net/embed/${type}/${id}" class="w-full h-full" allowfullscreen></iframe></div>`;
                dots.innerHTML = `<div class="dot bg-blue-500 w-1.5 h-1.5 rounded-full"></div>`;
                document.getElementById('swipeOverlay').style.display = 'none';
            }
            document.getElementById('mTitle').innerText = dId.title || dId.name;
            globalFullDesc = dId.overview || dEn.overview || ""; renderSynopsis();
            updateLibButtons(id);
            document.getElementById('castContainer').innerHTML = (dCast.cast || []).slice(0,10).map(c => `<div class="text-center min-w-[65px]"><img src="https://image.tmdb.org/t/p/w185${c.profile_path}" class="w-16 h-16 rounded-full object-cover mx-auto"><div class="text-[9px] mt-1 text-zinc-400">${c.name}</div></div>`).join('');
            document.getElementById('serverList').innerHTML = `<button class="btn-insta" onclick="playVid('https://vidrock.net/embed/${type}/${id}')">Server 1</button>`;
        }

        // FUNGSI LAINNYA
        function setSchedule(v, el) { 
            document.querySelectorAll('.btn-insta').forEach(b => b.classList.remove('active'));
            el.classList.add('active'); currentSchedule = v; isSearch = false; loadFeed(true); 
        }
        function setupSwipe() {
            const overlay = document.getElementById('swipeOverlay');
            overlay.addEventListener('touchstart', e => { startX = e.touches[0].clientX; }, {passive:true});
            overlay.addEventListener('touchend', e => {
                let diff = startX - e.changedTouches[0].clientX;
                const total = document.querySelectorAll('.carousel-slide').length;
                if(Math.abs(diff) > 50 && total > 1) {
                    let oldIdx = currentIdx;
                    if(diff > 0 && currentIdx < total - 1) currentIdx++;
                    else if(diff < 0 && currentIdx > 0) currentIdx--;
                    document.getElementById('carouselTrack').style.transform = `translateX(-${currentIdx * 100}%)`;
                    managePlayback(oldIdx, currentIdx);
                }
            });
        }
        function managePlayback(oldI, newI) {
            const o = document.getElementById(`yt-${oldI}`), n = document.getElementById(`yt-${newI}`);
            if(o) o.contentWindow.postMessage('{"event":"command","func":"pauseVideo","args":""}', '*');
            if(n) n.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
        }
        function closeModal() { document.getElementById('movieModal').style.display = 'none'; document.getElementById('carouselTrack').innerHTML = ''; document.body.style.overflow = 'auto'; }
        function initFilters() { /* sama seperti kode sebelumnya untuk mengisi dropdown */ }
        function toggleFilter(id) { document.querySelectorAll('.filter-dropdown').forEach(d=>d.style.display='none'); document.getElementById(id).style.display='block'; }
        function setCountry(c, n) { currentCountry=c; isSearch=false; loadFeed(true); }
        function renderSynopsis() { const d = document.getElementById('mDesc'); d.innerText = globalFullDesc.substring(0, 90) + "..."; }
    </script>
</body>
</html>
