<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amnesfubbia Film - Database Indonesia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { background-color: #080808; color: #ffffff; font-family: 'Inter', sans-serif; margin: 0; padding: 0; overflow-x: hidden; }
        
        .glass-nav { background: rgba(10, 10, 10, 0.9) !important; backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255, 255, 255, 0.05); z-index: 1000; }
        .movie-card { transition: 0.3s; border-radius: 12px; overflow: hidden; background: #121212; height: 100%; cursor: pointer; position: relative; border: 1px solid rgba(255,255,255,0.05); }
        .movie-card:hover { transform: translateY(-5px); border-color: #ef4444; }
        
        .type-badge { position: absolute; top: 6px; left: 6px; background: #ef4444; color: white; font-size: 6px; font-weight: 900; padding: 2px 5px; border-radius: 4px; text-transform: uppercase; z-index: 20; }
        .fav-btn { position: absolute; bottom: 35px; right: 8px; color: rgba(255,255,255,0.3); font-size: 14px; z-index: 30; transition: 0.3s; cursor: pointer; }
        .fav-btn.active { color: #ef4444; transform: scale(1.2); }

        .modal { display: none; position: fixed; inset: 0; z-index: 3000; background: rgba(0,0,0,0.98); overflow-y: auto; backdrop-filter: blur(25px); }
        #modalBackdrop { position: absolute; inset: 0; background-size: cover; background-position: center; filter: blur(80px) brightness(0.1); opacity: 0.8; z-index: -1; }
        
        .actor-card { min-width: 70px; text-align: center; cursor: pointer; transition: 0.3s; }
        .actor-card img { width: 55px; height: 55px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(255,255,255,0.1); margin: 0 auto 5px; }

        .scrollbar-hide::-webkit-scrollbar { display: none; }
        footer { width: 100%; border-top: 1px solid rgba(255,255,255,0.05); padding: 40px 20px; text-align: center; background: #050505; }
    </style>
</head>
<body onload="initApp()">

    <nav class="fixed top-0 w-full glass-nav p-3">
        <div class="container mx-auto space-y-3">
            <div class="flex items-center gap-2">
                <div class="flex items-center gap-1 cursor-pointer shrink-0" onclick="location.reload()">
                    <span class="text-xl font-black italic tracking-tighter uppercase">AMNES</span>
                    <span class="text-xl font-black text-red-600 italic uppercase">FILM</span>
                </div>
                <div class="relative flex-grow">
                    <input type="text" id="searchInput" placeholder="Cari film atau aktor..." class="w-full bg-[#000]/60 p-2.5 rounded-xl border border-white/10 outline-none focus:border-red-600 text-white text-xs">
                </div>
                <button onclick="searchMulti()" class="bg-red-600 px-4 py-2.5 rounded-xl font-black text-[10px] uppercase italic">Cari</button>
            </div>
            
            <div class="flex gap-2 overflow-x-auto pb-1 scrollbar-hide">
                <select id="genreFilter" onchange="resetAndLoad()" class="bg-[#000] p-2 rounded-lg outline-none text-white font-bold text-[10px] border border-white/10 uppercase">
                    <option value="">Semua Genre</option>
                    <option value="27">Horor</option><option value="35">Komedi</option><option value="18">Drama</option>
                    <option value="28">Aksi</option><option value="10749">Romantis</option>
                </select>
                <select id="typeFilter" onchange="resetAndLoad()" class="bg-[#000] p-2 rounded-lg outline-none text-red-500 font-bold text-[10px] border border-white/10 uppercase">
                    <option value="movie">FILM</option><option value="tv">SERIES</option>
                </select>
                <button onclick="showFavorites()" class="bg-white/10 text-white px-4 py-2 rounded-lg text-[10px] font-black uppercase whitespace-nowrap italic">My List ❤️</button>
            </div>
        </div>
    </nav>

    <main class="container mx-auto px-2 pt-36 pb-10 min-h-screen">
        <div id="movieGrid" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-6 gap-2"></div>
        <div id="scrollLoader" class="flex justify-center p-10 hidden text-red-600 font-black italic text-xs uppercase tracking-widest">Memuat Data...</div>
    </main>

    <footer>
        <p class="text-[12px] text-white font-black uppercase tracking-[0.4em] mb-2">BUATAN AMNESFUBBIA ENTERTAINMENT</p>
        <p class="text-[9px] text-gray-600 uppercase font-bold italic tracking-widest">Streaming & Database Indonesia © 2026</p>
    </footer>

    <div id="movieModal" class="modal flex items-center justify-center p-2">
        <div class="bg-[#0a0a0a] w-full max-w-5xl rounded-3xl overflow-hidden relative border border-white/10 shadow-2xl">
            <div id="modalBackdrop"></div>
            <button onclick="closeModal()" class="absolute top-5 right-5 text-white bg-black/40 hover:bg-red-600 w-10 h-10 rounded-full z-[100] flex items-center justify-center">✕</button>
            <div id="modalContent" class="flex flex-col md:flex-row relative z-10 max-h-[90vh] overflow-y-auto scrollbar-hide"></div>
        </div>
    </div>

    <script>
        const API_KEY = 'bfa7df5310c9974f62f26c6789a8c00d';
        const IMG_URL = 'https://image.tmdb.org/t/p/w500';
        let currentPage = 1;
        let isLoading = false;
        let isSearchMode = false;
        let favorites = JSON.parse(localStorage.getItem('amnesIndoFavs')) || [];

        function initApp() { loadMovies(); }
        
        window.onscroll = () => {
            if (!isLoading && !isSearchMode && (window.innerHeight + window.pageYOffset) >= document.body.offsetHeight - 800) loadMovies(true);
        };

        function resetAndLoad() { 
            currentPage = 1; isSearchMode = false; document.getElementById('movieGrid').innerHTML = ''; loadMovies(); 
        }

        async function loadMovies(isNextPage = false) {
            if (isLoading) return;
            isLoading = true;
            if (isNextPage) currentPage++;
            document.getElementById('scrollLoader').classList.remove('hidden');
            
            const type = document.getElementById('typeFilter').value;
            const genre = document.getElementById('genreFilter').value;
            let url = `https://api.themoviedb.org/3/discover/${type}?api_key=${API_KEY}&with_origin_country=ID&language=id-ID&page=${currentPage}&sort_by=popularity.desc`;
            if (genre) url += `&with_genres=${genre}`;
            
            try {
                const res = await fetch(url);
                const data = await res.json();
                render(data.results, isNextPage);
            } finally { isLoading = false; document.getElementById('scrollLoader').classList.add('hidden'); }
        }

        function render(movies, append) {
            const grid = document.getElementById('movieGrid');
            if (!append) grid.innerHTML = '';
            movies.forEach(item => {
                if(!item.poster_path) return;
                const isFav = favorites.some(f => f.id === item.id);
                const year = (item.release_date || item.first_air_date || '').split('-')[0];
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.innerHTML = `
                    <div class="type-badge">${item.title?'FILM':'SERIES'}</div>
                    <div class="fav-btn ${isFav?'active':''}" onclick="toggleFav(event, ${JSON.stringify(item).replace(/"/g, '&quot;')})"><i class="fas fa-heart"></i></div>
                    <img src="${IMG_URL + item.poster_path}" class="w-full aspect-[2/3] object-cover" onclick="showDetail(${item.id}, '${item.title?'movie':'tv'}')">
                    <div class="p-2" onclick="showDetail(${item.id}, '${item.title?'movie':'tv'}')">
                        <h3 class="text-[8px] font-black truncate uppercase text-gray-100">${item.title || item.name}</h3>
                        <p class="text-[7px] text-gray-500 font-bold italic">${year || 'TBA'}</p>
                    </div>`;
                grid.appendChild(card);
            });
        }

        async function showDetail(id, type) {
            const res = await fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=${API_KEY}&append_to_response=videos,credits&language=id-ID`);
            let movie = await res.json();
            
            // Cek sinopsis, jika kosong ambil versi global
            let sinopsis = movie.overview;
            if (!sinopsis || sinopsis.length < 5) {
                const resG = await fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=${API_KEY}`);
                const dataG = await resG.json();
                sinopsis = dataG.overview || "Maaf, sinopsis belum tersedia untuk judul ini.";
            }

            // Ambil Trailer
            let video = movie.videos.results.find(v => v.type === 'Trailer') || movie.videos.results[0];
            const videoSrc = video ? `https://www.youtube.com/embed/${video.key}?autoplay=1&mute=1` : '';
            const year = (movie.release_date || movie.first_air_date || '').split('-')[0];
            
            document.getElementById('modalBackdrop').style.backgroundImage = `url(https://image.tmdb.org/t/p/original${movie.backdrop_path || movie.poster_path})`;

            // Ambil Pemeran (Credits)
            let castHtml = movie.credits.cast.slice(0, 10).map(c => `
                <div class="actor-card" onclick="searchByActor(${c.id}, '${c.name}')">
                    <img src="${c.profile_path ? IMG_URL + c.profile_path : 'https://via.placeholder.com/100x100?text=No+Photo'}" alt="${c.name}">
                    <p class="text-[8px] font-black text-white leading-tight uppercase">${c.name}</p>
                </div>
            `).join('');

            document.getElementById('modalContent').innerHTML = `
                <div class="md:w-1/3 p-6 border-r border-white/5">
                    <img src="${IMG_URL + movie.poster_path}" class="w-full rounded-2xl shadow-2xl mb-4">
                    <div class="hidden md:block">
                        <p class="text-[9px] font-black text-gray-500 uppercase italic tracking-widest mb-2 text-center">Info Produksi</p>
                        <p class="text-[10px] text-white border-b border-white/5 py-2 uppercase font-bold">Status: <span class="text-red-500">${movie.status || '-'}</span></p>
                        <p class="text-[10px] text-white border-b border-white/5 py-2 uppercase font-bold">Rating: <span class="text-red-500">⭐ ${movie.vote_average.toFixed(1)}</span></p>
                    </div>
                </div>
                <div class="md:w-2/3 p-8 flex flex-col">
                    <h2 class="text-3xl font-black italic tracking-tighter uppercase mb-1">${movie.title || movie.name}</h2>
                    <p class="text-[10px] text-red-500 font-black mb-6 uppercase tracking-widest italic">${year} | ${movie.genres.map(g => g.name).join(', ')}</p>
                    
                    <div class="mb-6 rounded-2xl overflow-hidden aspect-video bg-black border border-white/5 shadow-2xl">
                        ${videoSrc ? `<iframe class="w-full h-full" src="${videoSrc}" frameborder="0" allowfullscreen allow="autoplay"></iframe>` : '<div class="flex items-center justify-center h-full text-xs italic text-gray-500 uppercase">Trailer Belum Tersedia</div>'}
                    </div>

                    <p class="text-[9px] font-black text-gray-500 uppercase mb-3 tracking-[0.2em] italic">Daftar Pemeran (Klik Foto Untuk Cari):</p>
                    <div class="flex gap-4 overflow-x-auto pb-6 scrollbar-hide mb-4">
                        ${castHtml || '<p class="text-[10px] italic">Data pemeran tidak tersedia</p>'}
                    </div>

                    <p class="text-[10px] font-black text-gray-500 uppercase mb-2 tracking-[0.2em] italic">Sinopsis Film:</p>
                    <p class="text-[12px] text-gray-300 leading-relaxed italic mb-8">"${sinopsis}"</p>

                    <div class="mt-auto pt-6 border-t border-white/10">
                        <p class="text-[9px] font-black text-red-600 uppercase mb-2 italic tracking-widest">Streaming Server:</p>
                        <div class="grid grid-cols-2 gap-2 mb-4">
                            <a href="https://vidsrc.to/embed/${type}/${movie.id}" target="_blank" class="bg-red-600 text-center py-3 rounded-xl text-[10px] font-black uppercase italic">SERVER 1</a>
                            <a href="https://vidsrc.xyz/embed/${type}/${movie.id}" target="_blank" class="bg-white/10 text-center py-3 rounded-xl text-[10px] font-black border border-white/10 uppercase italic">SERVER 2</a>
                        </div>
                        
                        <p class="text-[9px] font-black text-green-600 uppercase mb-2 italic tracking-widest">Download Server:</p>
                        <div class="grid grid-cols-2 gap-2">
                            <a href="https://dl.vidsrc.vip/${type}/${movie.id}" target="_blank" class="bg-green-700 text-center py-3 rounded-xl text-[10px] font-black uppercase italic">DOWNLOAD 1</a>
                            <a href="https://flashstream.cc/download/${type === 'movie' ? 'movie' : 'series'}/${movie.id}" target="_blank" class="bg-blue-700 text-center py-3 rounded-xl text-[10px] font-black uppercase italic">DOWNLOAD 2</a>
                        </div>
                    </div>
                </div>`;
            document.getElementById('movieModal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        async function searchByActor(actorId, actorName) {
            closeModal(); isSearchMode = true;
            document.getElementById('searchInput').value = actorName;
            const res = await fetch(`https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&with_cast=${actorId}&with_origin_country=ID&language=id-ID`);
            const data = await res.json();
            render(data.results, false);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function searchMulti() {
            const q = document.getElementById('searchInput').value; if (!q) return;
            isSearchMode = true;
            const res = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${API_KEY}&query=${encodeURIComponent(q)}&language=id-ID`);
            const data = await res.json();
            render(data.results.filter(m => (m.origin_country && m.origin_country.includes('ID')) || m.original_language === 'id'), false);
        }

        function toggleFav(e, item) {
            e.stopPropagation();
            const idx = favorites.findIndex(f => f.id === item.id);
            if(idx === -1) { favorites.push(item); e.target.classList.add('active'); }
            else { favorites.splice(idx, 1); e.target.classList.remove('active'); }
            localStorage.setItem('amnesIndoFavs', JSON.stringify(favorites));
        }

        function showFavorites() { isSearchMode = true; render(favorites, false); }
        function closeModal() { document.getElementById('movieModal').style.display = 'none'; document.body.style.overflow = 'auto'; }
    </script>
</body>
</html>
