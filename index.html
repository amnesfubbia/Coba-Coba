<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amnesfubbia Entertainment</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { background-color: #050505; color: #ffffff; font-family: 'Inter', sans-serif; margin: 0; overflow-x: hidden; }
        
        .glass-nav { background: rgba(8, 8, 8, 0.98); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255, 255, 255, 0.1); z-index: 1000; position: fixed; top: 0; width: 100%; }
        
        .skeleton { background: #111; position: relative; overflow: hidden; border-radius: 8px; aspect-ratio: 2/3; }
        .skeleton::after {
            content: ""; position: absolute; inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

        .movie-card { transition: 0.3s; background: #111; border-radius: 8px; overflow: hidden; border: 1px solid rgba(255,255,255,0.05); position: relative; cursor: pointer; }
        .movie-card:hover { transform: translateY(-5px); border-color: #ef4444; }
        
        .fav-btn { position: absolute; top: 8px; right: 8px; z-index: 20; color: rgba(255,255,255,0.5); font-size: 16px; cursor: pointer; filter: drop-shadow(0 0 5px black); transition: 0.3s; }
        .fav-btn.active { color: #ef4444; transform: scale(1.2); }

        .modal { display: none; position: fixed; inset: 0; z-index: 3000; background: rgba(0,0,0,0.98); overflow-y: auto; backdrop-filter: blur(20px); padding: 20px 10px; }
        .modal-content { background: #0a0a0a; width: 100%; max-width: 1000px; border-radius: 24px; margin: auto; position: relative; border: 1px solid #333; overflow: hidden; }
        
        .video-container { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden; border: 1px solid #333; }
        .btn-link { @apply py-3 rounded-xl text-[9px] font-black uppercase italic text-center transition-all active:scale-95 flex items-center justify-center gap-2; }
        .btn-stream { @apply bg-zinc-800 text-white border border-white/5 hover:bg-red-600; }
        .btn-download { @apply bg-emerald-600 text-white hover:bg-emerald-500 font-black; }

        .scrollbar-hide::-webkit-scrollbar { display: none; }
    </style>
</head>
<body onload="initApp()">

    <nav class="glass-nav p-3">
        <div class="container mx-auto space-y-3">
            <div class="flex items-center gap-2">
                <div class="shrink-0 cursor-pointer" onclick="location.reload()">
                    <span class="text-xl font-black italic uppercase text-white">AMNES</span>
                    <span class="text-xl font-black text-red-600 italic uppercase">FILM</span>
                </div>
                <div class="flex-grow">
                    <input type="text" id="searchInput" onkeypress="if(event.key==='Enter') searchMulti()" placeholder="Cari film atau series..." class="w-full bg-white/5 p-2.5 rounded-xl border border-white/10 text-xs outline-none focus:border-red-600 text-white">
                </div>
                <button onclick="showWatchlist()" class="bg-white/10 p-2.5 rounded-xl text-white">
                    <i class="fa-solid fa-heart"></i>
                </button>
            </div>
            
            <div class="flex gap-2 overflow-x-auto pb-1 scrollbar-hide">
                <select id="typeFilter" onchange="resetAndLoad()" class="bg-[#111] text-red-500 font-bold text-[10px] p-2 rounded-lg border border-white/10 uppercase outline-none">
                    <option value="movie">LAYAR LEBAR</option>
                    <option value="tv">TV SERIES</option>
                </select>
                <select id="genreFilter" onchange="resetAndLoad()" class="bg-[#111] text-white font-bold text-[10px] p-2 rounded-lg border border-white/10 uppercase outline-none">
                    <option value="">SEMUA GENRE</option>
                    <option value="27">HOROR</option>
                    <option value="35">KOMEDI</option>
                    <option value="18">DRAMA</option>
                    <option value="28">AKSI</option>
                </select>
                <select id="yearFilter" onchange="resetAndLoad()" class="bg-[#111] text-white font-bold text-[10px] p-2 rounded-lg border border-white/10 uppercase outline-none">
                    <option value="">TAHUN</option>
                    <script>for(let y=2026; y>=1980; y--) document.write(`<option value="${y}">${y}</option>`);</script>
                </select>
            </div>
        </div>
    </nav>

    <main class="container mx-auto px-2 pt-36 pb-20 min-h-screen">
        <div id="movieGrid" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-6 gap-2 sm:gap-4"></div>
        <div id="loadMoreContainer" class="flex justify-center mt-12">
            <button onclick="loadMore()" class="bg-white/5 border border-white/10 px-10 py-4 rounded-2xl font-black text-[10px] uppercase italic tracking-widest text-white hover:bg-red-600">MUAT LAGI</button>
        </div>
    </main>

    <div id="movieModal" class="modal">
        <div class="modal-content">
            <button onclick="closeModal()" class="absolute top-5 right-5 bg-black/60 hover:bg-red-600 text-white w-10 h-10 rounded-full z-[100] flex items-center justify-center">✕</button>
            <div class="flex flex-col lg:flex-row">
                <div class="lg:w-1/4 p-6 bg-zinc-900/30 border-r border-white/5">
                    <img id="mPoster" class="w-full rounded-2xl shadow-2xl mb-6 border border-white/10">
                    <div id="mRating" class="text-center text-xl font-black text-red-600 mb-6 bg-white/5 py-3 rounded-2xl"></div>
                    
                    <div class="space-y-4">
                        <p class="text-[10px] font-black text-red-500 uppercase italic mb-2">Streaming Server</p>
                        <div id="streamLinks" class="grid grid-cols-1 gap-2"></div>
                        
                        <p class="text-[10px] font-black text-emerald-500 uppercase italic mt-6 mb-2">Download Server</p>
                        <div id="downloadLinks" class="grid grid-cols-1 gap-2"></div>
                    </div>
                </div>

                <div class="lg:w-3/4 p-8">
                    <h2 id="mTitle" class="text-4xl font-black italic uppercase tracking-tighter mb-1 text-white leading-none"></h2>
                    <p id="mSub" class="text-[10px] text-zinc-500 font-bold mb-8 uppercase tracking-[0.3em]"></p>

                    <p class="text-[9px] font-black text-zinc-500 mb-2 uppercase italic">Official Trailer (YouTube)</p>
                    <div class="video-container mb-8 shadow-2xl">
                        <iframe id="mTrailerFrame" allowfullscreen allow="autoplay"></iframe>
                    </div>

                    <div class="grid md:grid-cols-2 gap-8">
                        <div>
                            <p class="text-[10px] font-black text-zinc-500 mb-3 uppercase italic">Sinopsis</p>
                            <p id="mDesc" class="text-sm text-zinc-300 leading-relaxed italic"></p>
                        </div>
                        <div>
                            <p class="text-[10px] font-black text-zinc-500 mb-3 uppercase italic">Pemeran</p>
                            <div id="mCast" class="flex flex-wrap gap-2"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const KEY = 'bfa7df5310c9974f62f26c6789a8c00d';
        const IMG = 'https://image.tmdb.org/t/p/w500';
        let page = 1;
        let isSearch = false;
        let watchlist = JSON.parse(localStorage.getItem('amnesWatchlist')) || [];

        function initApp() { loadMovies(); }

        async function loadMovies(append = false) {
            if (!append) document.getElementById('movieGrid').innerHTML = Array(12).fill('<div class="skeleton"></div>').join('');
            const type = document.getElementById('typeFilter').value;
            const genre = document.getElementById('genreFilter').value;
            const year = document.getElementById('yearFilter').value;
            
            let url = `https://api.themoviedb.org/3/discover/${type}?api_key=${KEY}&with_origin_country=ID&language=id-ID&page=${page}&sort_by=popularity.desc`;
            if (genre) url += `&with_genres=${genre}`;
            if (year) url += `&primary_release_year=${year}&first_air_date_year=${year}`;

            const res = await fetch(url);
            const data = await res.json();
            renderGrid(data.results, append);
        }

        function renderGrid(movies, append) {
            const grid = document.getElementById('movieGrid');
            if (!append) grid.innerHTML = '';
            movies.forEach(m => {
                if (!m.poster_path) return;
                const isFav = watchlist.some(w => w.id === m.id);
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.innerHTML = `
                    <div class="fav-btn ${isFav ? 'active' : ''}" onclick="toggleWatchlist(event, this, ${JSON.stringify(m).replace(/"/g, '&quot;')})">
                        <i class="fa-solid fa-heart"></i>
                    </div>
                    <img src="${IMG + m.poster_path}" loading="lazy" class="w-full aspect-[2/3] object-cover" onclick="showDetail(${m.id}, '${m.title ? 'movie' : 'tv'}')">
                    <div class="p-2 text-[8px] font-black truncate uppercase text-zinc-400">${m.title || m.name}</div>
                `;
                grid.appendChild(card);
            });
        }

        async function showDetail(id, type) {
            const res = await fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=${KEY}&append_to_response=videos,credits&language=id-ID`);
            const m = await res.json();

            document.getElementById('mPoster').src = IMG + m.poster_path;
            document.getElementById('mTitle').innerText = m.title || m.name;
            document.getElementById('mRating').innerText = "⭐ " + (m.vote_average ? m.vote_average.toFixed(1) : '0');
            document.getElementById('mSub').innerText = `${(m.release_date || m.first_air_date || '').split('-')[0]} | ${m.genres.map(g => g.name).join(' • ')}`;
            document.getElementById('mDesc').innerText = m.overview || "Sinopsis tidak tersedia.";

            // Trailer YouTube
            const youtube = m.videos.results.find(v => v.site === 'YouTube' && v.type === 'Trailer') || m.videos.results[0];
            document.getElementById('mTrailerFrame').src = youtube ? `https://www.youtube.com/embed/${youtube.key}?autoplay=1` : '';

            // STREAMING SERVERS (Sesuai List Baru Anda)
            const streamServers = [
                { n: 'VidSrc TO', u: `https://vidsrc.to/embed/${type}/${id}` },
                { n: 'VidRock', u: `https://vidrock.net/embed/${type}/${id}` },
                { n: 'RGShows', u: `https://www.rgshows.ru/embed/${type}/${id}` },
                { n: 'VidNest', u: `https://vidnest.fun/embed/${type}/${id}` },
                { n: 'VidLink Pro', u: `https://vidlink.pro/embed/${type}/${id}` },
                { n: 'VidFast', u: `https://vidfast.pro/embed/${type}/${id}` }
            ];

            // DOWNLOAD SERVER (Sesuai List Baru Anda)
            const downloadServers = [
                { n: 'Server Download VIP', u: `https://dl.vidsrc.vip/${type}/${id}` }
            ];

            const sCont = document.getElementById('streamLinks');
            const dCont = document.getElementById('downloadLinks');
            sCont.innerHTML = ''; dCont.innerHTML = '';

            streamServers.forEach(s => sCont.innerHTML += `<a href="${s.u}" target="_blank" class="btn-link btn-stream"><i class="fa-solid fa-play text-[7px]"></i> ${s.n}</a>`);
            downloadServers.forEach(d => dCont.innerHTML += `<a href="${d.u}" target="_blank" class="btn-link btn-download"><i class="fa-solid fa-cloud-arrow-down"></i> ${d.n}</a>`);

            document.getElementById('mCast').innerHTML = m.credits.cast.slice(0, 5).map(c => `<span class="bg-zinc-800 text-[9px] px-3 py-1 rounded-full border border-white/5">${c.name}</span>`).join('');
            document.getElementById('movieModal').style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        function toggleWatchlist(e, btn, movie) {
            e.stopPropagation();
            const idx = watchlist.findIndex(w => w.id === movie.id);
            if (idx === -1) { watchlist.push(movie); btn.classList.add('active'); }
            else { watchlist.splice(idx, 1); btn.classList.remove('active'); }
            localStorage.setItem('amnesWatchlist', JSON.stringify(watchlist));
        }

        function showWatchlist() { isSearch = true; renderGrid(watchlist, false); document.getElementById('loadMoreContainer').style.display = 'none'; }
        
        async function searchMulti() {
            const q = document.getElementById('searchInput').value; if (!q) return;
            isSearch = true;
            const res = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${KEY}&query=${encodeURIComponent(q)}&language=id-ID`);
            const data = await res.json();
            renderGrid(data.results.filter(m => m.poster_path), false);
        }

        function loadMore() { page++; loadMovies(true); }
        function resetAndLoad() { page = 1; isSearch = false; document.getElementById('loadMoreContainer').style.display = 'flex'; loadMovies(); }
        function closeModal() { document.getElementById('movieModal').style.display = 'none'; document.getElementById('mTrailerFrame').src = ''; document.body.style.overflow = 'auto'; }
    </script>
</body>
</html>
