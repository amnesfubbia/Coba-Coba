<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>amnesfubbia xx1 - Animation Global</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@1,700&family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { background-color: #000; color: #fff; font-family: 'Inter', sans-serif; margin: 0; overflow-x: hidden; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .fixed-header-section { position: fixed; top: 0; width: 100%; z-index: 100; background: #000; border-bottom: 1px solid #1c1c1c; }
        .ig-header { padding: 12px 15px 5px 15px; }
        .ig-logo { font-family: 'DM Sans', sans-serif; font-weight: 700; font-style: italic; font-size: 24px; letter-spacing: -0.8px; text-transform: lowercase; }
        
        .search-container { background: #0a0a0a; border-radius: 8px; display: flex; align-items: center; padding: 7px 12px; flex-grow: 1; border: 1px solid #1c1c1c; }
        .year-selector { background: #0a0a0a; border: 1px solid #1c1c1c; border-radius: 8px; padding: 8px 12px; font-size: 9px; font-weight: 800; cursor: pointer; }
        
        /* STUDIO HIGHLIGHT MONOKROM */
        .highlights-section { padding: 15px 0; border-bottom: 1px solid #1c1c1c; }
        .circle-icon { width: 64px; height: 64px; border-radius: 50%; background: #111; border: 1.5px solid #1c1c1c; display: flex; align-items: center; justify-content: center; margin: 0 auto 5px; overflow: hidden; }
        .circle-icon img { width: 70%; filter: grayscale(100%) invert(1); transition: 0.3s; }
        .highlight-item.active img { filter: grayscale(0%) invert(0); }
        .highlight-label { font-size: 9px; color: #555; font-weight: 800; text-transform: uppercase; text-align: center; }

        .movie-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; padding-top: 280px; padding-bottom: 100px; }
        .post-card { aspect-ratio: 2/3; background: #0a0a0a; overflow: hidden; cursor: pointer; }
        .post-card img { width: 100%; height: 100%; object-fit: cover; }

        /* MODAL & PLAYER */
        .modal-player { display: none; position: fixed; inset: 0; z-index: 200; background: #000; overflow-y: auto; }
        .interaction-icon { font-size: 24px; cursor: pointer; transition: 0.2s; }
        .interaction-icon.active { color: #ed4956; }
        .server-btn { width: 100%; padding: 12px; border-radius: 8px; font-size: 10px; font-weight: 800; border: 1px solid #1c1c1c; text-align: center; cursor: pointer; color: #888; }
        .ep-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin-top: 10px; }
        .ep-btn { background: #111; border: 1px solid #1c1c1c; font-size: 10px; padding: 10px 0; text-align: center; border-radius: 5px; cursor: pointer; }
        .ep-btn.active { border-color: #fff; color: #fff; }

        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: #000; border-top: 1px solid #1c1c1c; display: flex; justify-content: space-around; padding: 15px 0; z-index: 300; }
    </style>
</head>
<body>
    <div class="fixed-header-section">
        <header class="ig-header">
            <div class="flex justify-between items-center">
                <h1 class="ig-logo">amnesfubbia <span class="text-white opacity-40">xx1</span></h1>
                <div class="flex gap-5 text-xl"><i class="fa-regular fa-heart" onclick="showSaved()"></i><i class="fa-solid fa-clapperboard"></i></div>
            </div>
            <div class="flex items-center gap-2 mt-2 px-3">
                <div class="search-container"><input type="text" id="searchInp" placeholder="Cari animasi..." onkeydown="if(event.key==='Enter') searchAction()" class="bg-transparent w-full text-xs outline-none"></div>
                <div class="year-selector" onclick="setYear()">TAHUN</div>
            </div>
        </header>

        <div class="px-3 py-2 flex gap-2 overflow-x-auto no-scrollbar">
            <button class="px-4 py-2 border border-zinc-800 rounded-lg text-[10px] font-bold uppercase" onclick="setMode('multi')">Semua</button>
            <button class="px-4 py-2 border border-zinc-800 rounded-lg text-[10px] font-bold uppercase" onclick="setMode('movie')">Film</button>
            <button class="px-4 py-2 border border-zinc-800 rounded-lg text-[10px] font-bold uppercase" onclick="setMode('tv')">Series</button>
            <button class="px-4 py-2 border border-zinc-800 rounded-lg text-[10px] font-bold uppercase" onclick="setMode('short')">Short</button>
        </div>

        <div class="highlights-section no-scrollbar flex overflow-x-auto px-4 gap-4">
            <div class="highlight-item" onclick="setStudio('6125')"><div class="circle-icon"><img src="https://upload.wikimedia.org/wikipedia/commons/3/3a/Walt_Disney_Pictures_logo.svg"></div><p class="highlight-label">Disney</p></div>
            <div class="highlight-item" onclick="setStudio('3')"><div class="circle-icon"><img src="https://upload.wikimedia.org/wikipedia/commons/0/0b/Pixar_Logo.svg"></div><p class="highlight-label">Pixar</p></div>
            <div class="highlight-item" onclick="setStudio('521')"><div class="circle-icon"><img src="https://upload.wikimedia.org/wikipedia/en/2/22/DreamWorks_Animation_logo.svg"></div><p class="highlight-label">Dreamworks</p></div>
            <div class="highlight-item" onclick="setStudio('10342')"><div class="circle-icon"><img src="https://upload.wikimedia.org/wikipedia/commons/e/ed/Studio_Ghibli_logo.svg"></div><p class="highlight-label">Ghibli</p></div>
            <div class="highlight-item" onclick="setStudio('2251')"><div class="circle-icon"><img src="https://upload.wikimedia.org/wikipedia/commons/5/55/Sony_Pictures_Animation_logo.svg"></div><p class="highlight-label">Sony</p></div>
            <div class="highlight-item" onclick="setStudio('33')"><div class="circle-icon"><img src="https://upload.wikimedia.org/wikipedia/commons/3/31/Illumination_Entertainment_logo.svg"></div><p class="highlight-label">Illumination</p></div>
        </div>
    </div>

    <main id="feedGrid" class="movie-grid"></main>

    <div id="movieModal" class="modal-player">
        <div class="p-4 flex items-center border-b border-zinc-900 sticky top-0 bg-black z-50">
            <i class="fa-solid fa-chevron-left text-xl mr-4" onclick="closeModal()"></i>
            <h2 id="mTitle" class="font-bold truncate text-sm"></h2>
        </div>
        
        <div class="aspect-video bg-zinc-900">
            <iframe id="videoPlayer" class="w-full h-full" allowfullscreen></iframe>
        </div>

        <div class="p-4">
            <div class="flex justify-between items-center mb-4">
                <div class="flex gap-5">
                    <i id="likeBtn" class="fa-regular fa-heart interaction-icon"></i>
                    <i class="fa-solid fa-play-circle text-2xl" id="trailerBtn"></i>
                </div>
                <i id="saveBtn" class="fa-regular fa-bookmark interaction-icon"></i>
            </div>
            
            <p id="mDesc" class="text-xs text-zinc-400 leading-relaxed mb-6"></p>

            <div id="seriesSection" class="hidden">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-[10px] font-bold text-zinc-500">DAFTAR EPISODE</span>
                    <select id="seasonSel" class="bg-zinc-900 text-xs" onchange="loadEpisodes()"></select>
                </div>
                <div id="epGrid" class="ep-grid"></div>
            </div>

            <div class="grid grid-cols-2 gap-2 mt-6">
                <div class="server-btn" onclick="changeServer(1)">SERVER 1</div>
                <div class="server-btn" onclick="changeServer(2)">SERVER 2</div>
            </div>
            <button id="dlBtn" class="server-btn border-zinc-700 text-white mt-2 w-full">DOWNLOAD FILM</button>
        </div>
    </div>

    <nav class="bottom-nav">
        <i class="fa-solid fa-house text-xl" onclick="location.reload()"></i>
        <i class="fa-solid fa-magnifying-glass text-xl"></i>
        <i class="fa-regular fa-compass text-xl"></i>
        <i class="fa-regular fa-user text-xl"></i>
    </nav>

    <script>
        const API_KEY = 'bfa7df5310c9974f62f26c6789a8c00d';
        let currentType = 'multi', currentStudio = '', currentYear = '', searchQuery = '', page = 1;

        window.onload = () => loadFeed();

        async function loadFeed(isNew = true) {
            if(isNew) { page = 1; document.getElementById('feedGrid').innerHTML = ''; }
            
            // LOGIKA SHORT: Filter runtime < 40 menit
            let url = `https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&with_genres=16`;
            if (currentType === 'tv') url = `https://api.themoviedb.org/3/discover/tv?api_key=${API_KEY}&with_genres=16`;
            if (currentType === 'short') url += `&with_runtime.lte=40`;
            
            if (currentStudio) url += `&with_companies=${currentStudio}`;
            if (currentYear) url += `&primary_release_year=${currentYear}`;
            if (searchQuery) url = `https://api.themoviedb.org/3/search/multi?api_key=${API_KEY}&query=${searchQuery}`;

            const res = await fetch(url + `&page=${page}`);
            const data = await res.json();
            renderFeed(data.results || []);
        }

        function renderFeed(items) {
            const grid = document.getElementById('feedGrid');
            items.forEach(m => {
                if(!m.poster_path) return;
                const card = document.createElement('div');
                card.className = 'post-card';
                const type = m.media_type || (currentType === 'tv' ? 'tv' : 'movie');
                card.onclick = () => openModal(m.id, type);
                card.innerHTML = `<img src="https://image.tmdb.org/t/p/w342${m.poster_path}">`;
                grid.appendChild(card);
            });
        }

        async function openModal(id, type) {
            const modal = document.getElementById('movieModal');
            modal.style.display = 'block';
            window.activeId = id; window.activeType = type;

            // AMBIL DATA & FALLBACK SINOPSIS
            const resId = await fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=${API_KEY}&language=id-ID&append_to_response=videos`);
            let d = await resId.json();
            if(!d.overview) {
                const resEn = await fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=${API_KEY}&language=en-US`);
                const dEn = await resEn.json();
                d.overview = dEn.overview;
            }

            document.getElementById('mTitle').innerText = d.title || d.name;
            document.getElementById('mDesc').innerText = d.overview || "Sinopsis belum tersedia untuk animasi ini.";
            
            // TRAILER
            const trailer = d.videos?.results.find(v => v.type === 'Trailer');
            document.getElementById('trailerBtn').onclick = () => {
                if(trailer) document.getElementById('videoPlayer').src = `https://www.youtube.com/embed/${trailer.key}?autoplay=1`;
                else alert("Trailer tidak ditemukan");
            };

            // STREAMING & DOWNLOAD
            document.getElementById('videoPlayer').src = `https://vidrock.net/embed/${type}/${id}`;
            document.getElementById('dlBtn').onclick = () => window.open(`https://dl.vidsrc.vip/${type}/${id}`);

            // SERIES LOGIC
            if(type === 'tv') {
                document.getElementById('seriesSection').classList.remove('hidden');
                document.getElementById('seasonSel').innerHTML = d.seasons.map(s => `<option value="${s.season_number}">Season ${s.season_number}</option>`).join('');
                loadEpisodes();
            } else {
                document.getElementById('seriesSection').classList.add('hidden');
            }

            // SIMPAN / SUKA (LocalStorage)
            updateActionButtons(id);
        }

        async function loadEpisodes() {
            const s = document.getElementById('seasonSel').value;
            const res = await fetch(`https://api.themoviedb.org/3/tv/${window.activeId}/season/${s}?api_key=${API_KEY}`);
            const d = await res.json();
            document.getElementById('epGrid').innerHTML = d.episodes.map(e => `
                <div class="ep-btn" onclick="playEp(${s}, ${e.episode_number}, this)">${e.episode_number}</div>
            `).join('');
        }

        function playEp(s, e, el) {
            document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            document.getElementById('videoPlayer').src = `https://vidrock.net/embed/tv/${window.activeId}/${s}/${e}`;
        }

        function changeServer(s) {
            const base = s === 1 ? 'vidrock.net' : 'vidstorm.ru';
            document.getElementById('videoPlayer').src = `https://${base}/embed/${window.activeType}/${window.activeId}`;
        }

        function updateActionButtons(id) {
            const likes = JSON.parse(localStorage.getItem('likes') || '[]');
            const saves = JSON.parse(localStorage.getItem('saves') || '[]');
            
            const isLiked = likes.includes(id);
            const isSaved = saves.includes(id);

            document.getElementById('likeBtn').className = isLiked ? 'fa-solid fa-heart interaction-icon active' : 'fa-regular fa-heart interaction-icon';
            document.getElementById('saveBtn').className = isSaved ? 'fa-solid fa-bookmark interaction-icon text-white' : 'fa-regular fa-bookmark interaction-icon';

            document.getElementById('likeBtn').onclick = () => toggleStorage('likes', id);
            document.getElementById('saveBtn').onclick = () => toggleStorage('saves', id);
        }

        function toggleStorage(key, id) {
            let data = JSON.parse(localStorage.getItem(key) || '[]');
            if(data.includes(id)) data = data.filter(x => x !== id);
            else data.push(id);
            localStorage.setItem(key, JSON.stringify(data));
            updateActionButtons(id);
        }

        function setMode(m) { currentType = m; loadFeed(true); }
        function setStudio(id) { currentStudio = id; loadFeed(true); }
        function searchAction() { searchQuery = document.getElementById('searchInp').value; loadFeed(true); }
        function setYear() { const y = prompt("Tahun?"); if(y) { currentYear = y; loadFeed(true); } }
        function closeModal() { document.getElementById('movieModal').style.display = 'none'; document.getElementById('videoPlayer').src = ''; }

        window.onscroll = () => {
            if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 800) { page++; loadFeed(false); }
        };
    </script>
</body>
</html>
