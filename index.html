<div class="fixed-header-section">
    <header class="ig-header flex justify-between items-center">
        <div class="flex items-center" onclick="location.reload()">
            <h1 class="ig-logo">amnesfubbia <span class="text-white opacity-40 font-normal italic">xx1</span></h1>
            <i class="fa-solid fa-circle-check text-[#0095f6] ml-1 text-[10px]"></i>
        </div>
        <div class="flex gap-5 text-xl">
            <i class="fa-regular fa-square-plus cursor-pointer"></i>
            <i class="fa-solid fa-bars cursor-pointer"></i>
        </div>
    </header>

    <div class="flex items-center px-[15px] py-2">
        <div class="relative flex-shrink-0">
            <div class="w-[77px] h-[77px] rounded-full border border-[#262626] p-[3px]">
                <img src="https://i.ibb.co/pBTXmYV/profile.jpg" class="w-full h-full rounded-full object-cover">
            </div>
            <div class="absolute bottom-0 right-0 bg-[#0095f6] border-2 border-black rounded-full w-[22px] h-[22px] flex items-center justify-center">
                <i class="fa-solid fa-plus text-white text-[12px]"></i>
            </div>
        </div>
        
        <div class="flex flex-grow justify-around ml-5 text-center">
            <div class="cursor-pointer" onclick="setFilter('type', 'movie', this)">
                <span class="block font-bold text-[16px]">25.4rb</span>
                <span class="block text-[12px] text-[#a8a8a8]">Film</span>
            </div>
            <div class="cursor-pointer" onclick="setFilter('type', 'tv', this)">
                <span class="block font-bold text-[16px]">8.2rb</span>
                <span class="block text-[12px] text-[#a8a8a8]">Series</span>
            </div>
            <div class="cursor-pointer" onclick="setFilter('type', 'short', this)">
                <span class="block font-bold text-[16px]">1.5rb</span>
                <span class="block text-[12px] text-[#a8a8a8]">Short</span>
            </div>
        </div>
    </div>

    <div class="px-[15px] pt-2 pb-4">
        <div class="text-[13px] font-bold">amnesfubbia xx1</div>
        <div class="text-[13px] leading-snug">
            dari indonesia untuk dunia<br>
            By Anasteas
        </div>
    </div>

    <div class="flex gap-2 px-[15px] mb-3">
        <button id="btnTayang" class="flex-1 bg-[#262626] text-white py-1.5 rounded-lg text-[13px] font-semibold" onclick="setSchedule('now_playing', this)">Sedang Tayang</button>
        <button id="btnSegera" class="flex-1 bg-[#262626] text-white py-1.5 rounded-lg text-[13px] font-semibold" onclick="setSchedule('upcoming', this)">Segera</button>
        <button class="bg-[#262626] text-white px-3 py-1.5 rounded-lg text-[13px]" onclick="toggleFilterRow()">
            <i class="fa-solid fa-user-plus text-[12px]"></i>
        </button>
    </div>

    <div id="filterRow" class="hidden px-[15px] pb-2">
        <div class="pill-grid grid-cols-3">
            <button class="pill" id="btnCountry" onclick="toggleFilter('countryDropdown')">Negara <i class="fa-solid fa-caret-down"></i></button>
            <button class="pill" id="btnGenre" onclick="toggleFilter('genreDropdown')">Genre <i class="fa-solid fa-caret-down"></i></button>
            <button class="pill" id="yearBtn" onclick="toggleFilter('yearDropdown')">Tahun <i class="fa-solid fa-caret-down"></i></button>
        </div>
    </div>
</div>
