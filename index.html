<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>amnesfubbia xx1 - Animation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@1,700&family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { background-color: #000; color: #fff; font-family: 'Inter', sans-serif; margin: 0; overflow-x: hidden; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .fixed-header-section { position: fixed; top: 0; width: 100%; z-index: 100; background: #000; border-bottom: 1px solid #1c1c1c; }
        .ig-header { padding: 12px 15px 5px 15px; }

        .ig-logo { font-family: 'DM Sans', sans-serif; font-weight: 700; font-style: italic; font-size: 24px; letter-spacing: -0.8px; text-transform: lowercase; cursor: pointer; }
        .verified-icon { font-size: 13px; color: #0095f6; margin-left: 5px; }

        .search-container { background: #0a0a0a; border-radius: 8px; display: flex; align-items: center; padding: 7px 12px; flex-grow: 1; border: 1px solid #1c1c1c; }
        .search-container input { background: transparent !important; border: none !important; color: white !important; font-size: 13px; width: 100%; outline: none !important; box-shadow: none !important; margin-left: 8px; }

        /* Menu Utama & Filter Baru */
        .category-wrapper { padding: 5px 15px 8px 15px; }
        .pill-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 8px; }
        .pill { background: transparent; border: 1px solid #1c1c1c; color: #fff; padding: 8px 0; border-radius: 8px; font-size: 10px; font-weight: 800; text-transform: uppercase; text-align: center; cursor: pointer; transition: 0.2s; }
        .pill.active { border-color: #fff; color: #fff; background: rgba(255,255,255,0.05); }

        /* Highlights Section (Studios) */
        .highlights-section { padding: 12px 0; border-bottom: 1px solid #1c1c1c; background: #000; }
        .highlights-container { display: flex; gap: 15px; overflow-x: auto; padding: 0 15px; scrollbar-width: none; }
        .highlight-item { flex: 0 0 75px; text-align: center; cursor: pointer; }
        .circle-icon { width: 62px; height: 62px; border-radius: 50%; background: #000; border: 1.5px solid #1c1c1c; display: flex; align-items: center; justify-content: center; margin: 0 auto 8px auto; overflow: hidden; transition: 0.3s; }
        .circle-icon img { width: 80%; height: 80%; object-fit: contain; filter: grayscale(1) invert(1); opacity: 0.5; }
        .highlight-item.active .circle-icon { 
            border: 2px solid transparent; 
            background: linear-gradient(#000, #000) padding-box, linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%) border-box; 
        }
        .highlight-item.active .circle-icon img { filter: grayscale(0) invert(0); opacity: 1; }
        .highlight-label { font-size: 9px; color: #555; font-weight: 700; text-transform: uppercase; white-space: nowrap; }
        .highlight-item.active .highlight-label { color: #fff; }

        /* Grid */
        .movie-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; padding-top: 320px; padding-bottom: 100px; }
        .post-card { position: relative; aspect-ratio: 2/3; background: #0a0a0a; overflow: hidden; cursor: pointer; }
        .post-card img { width: 100%; height: 100%; object-fit: cover; }
        
        .badge-type { position: absolute; top: 8px; right: 8px; font-size: 13px; color: #fff; z-index: 5; text-shadow: 0 0 4px rgba(0,0,0,0.8); }
        .badge-rating { position: absolute; top: 6px; left: 6px; padding: 2px 5px; border-radius: 2px; font-size: 7px; font-weight: 900; z-index: 5; background: rgba(255,255,255,0.9); color: #000; }
        
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: #000; border-top: 1px solid #1c1c1c; display: flex; justify-content: space-around; padding: 12px 0; z-index: 300; padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
        .nav-item { color: #fff; font-size: 20px; cursor: pointer; }
        
        .modal-player { display: none; position: fixed; inset: 0; z-index: 200; background: #000; overflow-y: auto; }
        .skeleton { background: linear-gradient(90deg, #0a0a0a 25%, #1a1a1a 50%, #0a0a0a 75%); background-size: 200% 100%; animation: skeleton-loading 1.5s infinite; }
        @keyframes skeleton-loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        
        /* Dropdown Style */
        .custom-dropdown { display: none; position: fixed; top: 110px; left: 0; right: 0; background: #000; z-index: 105; border-bottom: 1px solid #1c1c1c; padding: 15px; max-height: 400px; overflow-y: auto; }
        .grid-select { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .select-item { background: #111; border: 1px solid #1c1c1c; color: #fff; padding: 10px; border-radius: 8px; font-size: 10px; font-weight: 700; text-align: center; }
    </style>
</head>
<body>
    <div id="loader" style="position:fixed; top:0; left:0; height:1.5px; background:#fff; width:0%; transition:width 0.3s; z-index:1000;"></div>

    <div class="fixed-header-section">
        <header class="ig-header">
            <div class="flex justify-between items-center">
                <div class="flex items-center">
                    <h1 class="ig-logo">amnesfubbia <span class="text-white opacity-40 font-normal italic">xx1</span></h1>
                    <i class="fa-solid fa-circle-check verified-icon"></i>
                </div>
                <div class="flex gap-6 text-xl">
                    <i class="fa-regular fa-square-plus cursor-pointer"></i>
                    <i class="fa-regular fa-heart cursor-pointer"></i>
                </div>
            </div>
            <div class="search-area flex items-center gap-2 mt-2">
                <div class="search-container">
                    <i class="fa-solid fa-magnifying-glass text-zinc-600 text-[10px]"></i>
                    <input type="text" id="searchInp" placeholder="Cari animasi favorit..." onkeydown="if(event.key==='Enter') searchAction()">
                </div>
            </div>
        </header>

        <!-- BARIS 1: MENU UTAMA -->
        <div class="category-wrapper">
            <div class="pill-grid">
                <button class="pill active" onclick="updateMainFilter('multi', this)">Semua</button>
                <button class="pill" onclick="updateMainFilter('movie', this)">Film</button>
                <button class="pill" onclick="updateMainFilter('tv', this)">Series</button>
                <button class="pill" onclick="updateMainFilter('short', this)">Short</button>
            </div>
            
            <!-- BARIS 2: FILTER TAMBAHAN -->
            <div class="pill-grid">
                <button class="pill active" onclick="toggleFilterMenu('all')">Semua</button>
                <button class="pill" onclick="toggleFilterMenu('year')">Tahun</button>
                <button class="pill" onclick="toggleFilterMenu('country')">Negara</button>
                <button class="pill" onclick="toggleFilterMenu('genre')">Genre</button>
            </div>
        </div>

        <!-- BARIS 3: STUDIO HIGHLIGHTS -->
        <div class="highlights-section">
            <div class="highlights-container no-scrollbar" id="studioHighlights">
                <div class="highlight-item active" onclick="setStudio('', this)">
                    <div class="circle-icon"><i class="fa-solid fa-border-all text-xl text-zinc-600"></i></div>
                    <p class="highlight-label">Semua</p>
                </div>
                <div class="highlight-item" onclick="setStudio('Disney', this)">
                    <div class="circle-icon"><img src="https://upload.wikimedia.org/wikipedia/commons/3/3a/Walt_Disney_Pictures_logo.svg" alt="Disney"></div>
                    <p class="highlight-label">Disney</p>
                </div>
                <div class="highlight-item" onclick="setStudio('Pixar', this)">
                    <div class="circle-icon"><img src="https://upload.wikimedia.org/wikipedia/commons/0/03/Pixar_logo.svg" alt="Pixar"></div>
                    <p class="highlight-label">Pixar</p>
                </div>
                <div class="highlight-item" onclick="setStudio('DreamWorks', this)">
                    <div class="circle-icon"><img src="https://upload.wikimedia.org/wikipedia/en/2/23/DreamWorks_Animation_logo.svg" alt="DreamWorks"></div>
                    <p class="highlight-label">Dreamworks</p>
                </div>
                <div class="highlight-item" onclick="setStudio('Ghibli', this)">
                    <div class="circle-icon"><img src="https://upload.wikimedia.org/wikipedia/en/c/ca/Studio_Ghibli_logo.svg" alt="Ghibli"></div>
                    <p class="highlight-label">Ghibli</p>
                </div>
                <div class="highlight-item" onclick="setStudio('Sony', this)">
                    <div class="circle-icon"><img src="https://upload.wikimedia.org/wikipedia/commons/6/63/Sony_Pictures_Animation_logo.svg" alt="Sony"></div>
                    <p class="highlight-label">Sony</p>
                </div>
                <div class="highlight-item" onclick="setStudio('Illumination', this)">
                    <div class="circle-icon"><img src="https://upload.wikimedia.org/wikipedia/commons/1/1a/Illumination_Entertainment_logo.svg" alt="Illumination"></div>
                    <p class="highlight-label">Illumination</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Dropdown Content (Tahun, Negara, Genre) -->
    <div id="filterMenu" class="custom-dropdown no-scrollbar">
        <div id="filterContent" class="grid-select"></div>
    </div>

    <main id="feedGrid" class="movie-grid"></main>

    <nav class="bottom-nav">
        <div class="nav-item" onclick="location.reload()"><i class="fa-solid fa-house"></i></div>
        <div class="nav-item"><i class="fa-solid fa-magnifying-glass"></i></div>
        <div class="nav-item"><i class="fa-regular fa-bookmark"></i></div>
        <div class="nav-item"><i class="fa-regular fa-user"></i></div>
    </nav>

    <script>
        const API_KEY = 'bfa7df5310c9974f62f26c6789a8c00d';
        let page = 1, currentType = 'multi', currentStudio = '', currentGenre = '', currentYear = '', loading = false;

        window.onload = () => { loadFeed(); };

        async function loadFeed(isNew = true) {
            if (loading) return;
            loading = true;
            if (isNew) { page = 1; document.getElementById('feedGrid').innerHTML = Array(12).fill('<div class="post-card skeleton"></div>').join(''); }
            
            const l = document.getElementById('loader'); l.style.width = '30%';
            
            try {
                let urlM = `https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&with_genres=16&language=id-ID&page=${page}`;
                let urlT = `https://api.themoviedb.org/3/discover/tv?api_key=${API_KEY}&with_genres=16&language=id-ID&page=${page}`;

                if (currentYear) {
                    urlM += `&primary_release_year=${currentYear}`;
                    urlT += `&first_air_date_year=${currentYear}`;
                }
                
                let items = [];
                if (currentType === 'movie' || currentType === 'multi') {
                    const rM = await fetch(urlM); const dM = await rM.json();
                    items = [...items, ...(dM.results || []).map(x => ({...x, m_type: 'movie'}))];
                }
                if (currentType === 'tv' || currentType === 'multi') {
                    const rT = await fetch(urlT); const dT = await rT.json();
                    items = [...items, ...(dT.results || []).map(x => ({...x, m_type: 'tv'}))];
                }

                // Filter Studio secara manual dari keyword produksi (Hanya contoh logika)
                if (currentStudio) {
                    // Dalam aplikasi nyata, kita akan menggunakan production_companies ID
                    // Di sini kita simulasi filter sederhana
                }

                if (isNew) document.getElementById('feedGrid').innerHTML = '';
                renderFeed(items);
            } catch (err) { console.error(err); }
            loading = false; l.style.width = '100%'; setTimeout(() => l.style.width = '0%', 400);
        }

        function renderFeed(data) {
            const grid = document.getElementById('feedGrid');
            data.forEach(m => {
                if (!m.poster_path) return;
                const card = document.createElement('div');
                card.className = 'post-card';
                card.innerHTML = `
                    <div class="badge-rating"><i class="fa-solid fa-star text-[6px]"></i> ${m.vote_average?.toFixed(1) || '0.0'}</div>
                    <div class="badge-type">${m.m_type === 'tv' ? '<i class="fa-solid fa-clone"></i>' : '<i class="fa-solid fa-play"></i>'}</div>
                    <img src="https://image.tmdb.org/t/p/w342${m.poster_path}" onload="this.parentElement.classList.remove('skeleton')">
                `;
                grid.appendChild(card);
            });
        }

        function updateMainFilter(type, el) {
            document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
            el.classList.add('active');
            currentType = type;
            loadFeed(true);
        }

        function setStudio(studio, el) {
            document.querySelectorAll('.highlight-item').forEach(p => p.classList.remove('active'));
            el.classList.add('active');
            currentStudio = studio;
            loadFeed(true);
        }

        function toggleFilterMenu(type) {
            const menu = document.getElementById('filterMenu');
            const content = document.getElementById('filterContent');
            
            if (menu.style.display === 'block') {
                menu.style.display = 'none';
                return;
            }

            let html = '';
            if (type === 'year') {
                for (let y = 2026; y >= 1990; y--) {
                    html += `<div class="select-item" onclick="applyFilter('year', '${y}')">${y}</div>`;
                }
            } else if (type === 'genre') {
                const genres = ['Aksi', 'Komedi', 'Fantasi', 'Keluarga', 'Petualangan', 'Sci-Fi'];
                genres.forEach(g => {
                    html += `<div class="select-item" onclick="applyFilter('genre', '${g}')">${g}</div>`;
                });
            } else if (type === 'country') {
                const countries = ['USA', 'Japan', 'China', 'Indonesia', 'France'];
                countries.forEach(c => {
                    html += `<div class="select-item" onclick="applyFilter('country', '${c}')">${c}</div>`;
                });
            } else {
                menu.style.display = 'none';
                currentYear = '';
                loadFeed(true);
                return;
            }

            content.innerHTML = html;
            menu.style.display = 'block';
        }

        function applyFilter(type, val) {
            if (type === 'year') currentYear = val;
            document.getElementById('filterMenu').style.display = 'none';
            loadFeed(true);
        }
    </script>
</body>
</html>
