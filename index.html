                <div class="content-box">
                    <div class="story-title"><span class="tag-nabi">01</span> NABI ADAM AS</div>
                    <p class="detail-text">Nabi Adam AS adalah manusia pertama yang diciptakan Allah SWT. Allah menciptakan Adam dari berbagai macam unsur tanah di bumi. Setelah jasadnya sempurna, Allah meniupkan ruh ke dalamnya. Allah memerintahkan para malaikat dan Iblis untuk bersujud kepada Adam sebagai bentuk penghormatan. Malaikat bersujud, namun Iblis menolak karena merasa dirinya lebih mulia (terbuat dari api). Karena kesombongannya, Iblis diusir dari surga. Nabi Adam kemudian tinggal di surga dan Allah menciptakan Siti Hawa sebagai pendampingnya. Mereka diperbolehkan menikmati apa saja di surga kecuali memakan buah dari pohon Khuldi. Namun, karena godaan Iblis yang licik, Adam dan Hawa memakannya. Akibatnya, mereka diturunkan ke bumi sebagai khalifah pertama. Selama ratusan tahun Adam bertaubat memohon ampun dengan doa: "Rabbana dhalamma anfusana wa-in lam taghfir lana watarhamna lanakunanna minal khasirin." Allah menerima taubatnya dan dimulailah sejarah umat manusia di bumi.</p>

                    <div class="story-title"><span class="tag-nabi">02</span> NABI IDRIS AS</div>
                    <p class="detail-text">Nabi Idris AS adalah keturunan keenam Nabi Adam. Beliau dikenal sebagai manusia pertama yang sangat cerdas. Beliau adalah orang pertama yang mahir menulis dengan kalam (pena), orang pertama yang menjahit pakaian (sebelumnya manusia menggunakan kulit binatang), serta orang pertama yang mempelajari ilmu perbintangan (astronomi) dan matematika. Idris memiliki keberanian yang luar biasa dalam berdakwah melawan keturunan Qabil yang durhaka. Nama Idris berasal dari kata 'Darasa' yang berarti belajar, karena beliau sangat gemar mempelajari kitab-kitab Allah. Beliau diberikan mukjizat dapat melihat surga dan neraka sebelum wafatnya. Beliau diangkat oleh Allah ke tempat yang tinggi (langit keempat) sebagai bentuk kemuliaan atas ketaatannya.</p>

                    <div class="story-title"><span class="tag-nabi">03</span> NABI NUH AS</div>
                    <p class="detail-text">Nabi Nuh AS termasuk dalam golongan Rasul Ulul Azmi karena kesabaran yang luar biasa. Beliau berdakwah selama kurang lebih 950 tahun, namun jumlah orang yang beriman sangatlah sedikit (sekitar 80 orang). Kebanyakan kaumnya justru mengejek dan menutup telinga saat beliau berbicara. Karena pembangkangan yang sudah melampaui batas, Allah memerintahkan Nuh membangun sebuah bahtera (kapal) raksasa di atas sebuah bukit yang jauh dari perairan. Kaumnya tertawa dan menganggap Nuh gila. Ketika kapal selesai, Allah memerintahkan Nuh membawa orang-orang beriman serta sepasang dari setiap jenis hewan. Kemudian, Allah menurunkan hujan lebat dan memancarkan air dari bumi hingga terjadi banjir bandang yang menenggelamkan seluruh permukaan bumi, termasuk putra Nuh yang bernama Kan'an dan istrinya yang kafir. Kapal tersebut akhirnya berlabuh di Gunung Judi, dan dari keturunan Nuh inilah manusia kembali berkembang biak.</p>

                    <div class="story-title"><span class="tag-nabi">04</span> NABI HUD AS</div>
                    <p class="detail-text">Nabi Hud AS diutus untuk kaum 'Ad yang tinggal di perbukitan pasir (Al-Ahqaf) di Yaman. Kaum 'Ad adalah kaum yang sangat kuat, bertubuh besar, dan ahli dalam membangun gedung-gedung tinggi yang megah. Namun, mereka menyembah berhala dan sombong akan kekuatan fisiknya. Nabi Hud mengajak mereka untuk bertauhid, namun mereka mendustakannya. Allah kemudian memberikan ujian berupa kekeringan panjang selama tiga tahun. Karena tetap ingkar, Allah mengirimkan awan hitam yang mereka kira adalah hujan, padahal itu adalah azab berupa angin kencang yang sangat dingin (Rihun Shar-shar). Angin itu mengamuk selama tujuh malam delapan hari, menghancurkan segalanya dan menyisakan kaum 'Ad seperti batang pohon kurma yang tumbang. Nabi Hud dan orang beriman selamat.</p>

                    <div class="story-title"><span class="tag-nabi">05</span> NABI SHOLEH AS</div>
                    <p class="detail-text">Nabi Sholeh AS diutus kepada kaum Tsamud yang mewarisi kejayaan kaum 'Ad. Mereka mahir memahat gunung-gunung batu untuk dijadikan tempat tinggal yang mewah. Kaum Tsamud meminta bukti kenabian Sholeh berupa mukjizat yang mustahil: keluarnya seekor unta betina yang hamil dari sebuah batu besar. Atas izin Allah, mukjizat itu terjadi. Sholeh berpesan agar unta itu tidak diganggu dan berbagi air dengan penduduk. Namun, orang-orang kafir yang dengki menyembelih unta tersebut. Sholeh memperingatkan bahwa dalam tiga hari azab akan datang. Benar saja, pada hari keempat, suara guntur yang sangat keras menggelegar menghancurkan jantung mereka, dan mereka mati bergelimpangan di rumah-rumah mereka sendiri.</p>

                    <div class="story-title"><span class="tag-nabi">06</span> NABI IBRAHIM AS</div>
                    <p class="detail-text">Nabi Ibrahim AS adalah Bapak para Nabi (Abul Anbiya) dan Rasul Ulul Azmi. Beliau lahir di tengah masyarakat penyembah berhala pimpinan Raja Namrud. Sejak kecil, Ibrahim mencari Tuhan yang sebenarnya melalui pengamatan terhadap bintang, bulan, dan matahari hingga meyakini adanya Allah Sang Pencipta. Ibrahim melakukan aksi berani menghancurkan berhala-berhala Namrud dan menyisakan satu yang terbesar. Akibatnya, beliau dihukum bakar hidup-hidup. Namun Allah berfirman: "Wahai api, jadilah dingin dan selamatkan Ibrahim." Ibrahim tidak terbakar sedikitpun. Beliau kemudian berhijrah dan membangun Ka'bah bersama putranya, Ismail. Ibrahim diuji dengan perintah menyembelih Ismail, yang kemudian diganti dengan seekor domba besar oleh Allah (asal mula Idul Adha).</p>

                    <div class="story-title"><span class="tag-nabi">07</span> NABI LUTH AS</div>
                    <p class="detail-text">Nabi Luth AS adalah keponakan Nabi Ibrahim. Beliau diutus kepada penduduk kota Sodom yang memiliki perilaku maksiat yang sangat keji dan belum pernah dilakukan manusia sebelumnya, yaitu homoseksual. Luth berdakwah dengan gigih agar mereka bertaubat, namun mereka justru mengancam mengusir Luth. Allah kemudian mengirimkan malaikat yang menyamar sebagai pemuda tampan untuk bertamu ke rumah Luth. Kaum Sodom mengepung rumah Luth untuk merebut tamu tersebut. Malaikat kemudian membutakan mata mereka dan memerintahkan Luth untuk segera pergi meninggalkan kota sebelum fajar. Saat fajar menyingsing, Allah menjungkirbalikkan bumi mereka dan menghujani kota tersebut dengan batu belerang yang panas.</p>

                    <div class="story-title"><span class="tag-nabi">08</span> NABI ISMAIL AS</div>
                    <p class="detail-text">Nabi Ismail AS adalah putra pertama Nabi Ibrahim dari Siti Hajar. Saat masih bayi, Ismail dan ibunya ditinggalkan di lembah Makkah yang gersang atas perintah Allah. Ketika mereka kehausan, Hajar berlari antara bukit Shafa dan Marwah sebanyak tujuh kali (Sa'i). Tiba-tiba, dari bawah hentakan kaki bayi Ismail, terpancarlah air Zamzam yang tidak pernah kering hingga sekarang. Ismail tumbuh menjadi pemuda yang sangat patuh. Beliau dengan ikhlas menerima perintah Allah ketika ayahnya bermimpi menyembelihnya. Ketulusannya diganjar Allah dengan keselamatan, dan beliau membantu ayahnya meninggikan pondasi Ka'bah.</p>

                    <div class="story-title"><span class="tag-nabi">09</span> NABI ISHAQ AS</div>
                    <p class="detail-text">Nabi Ishaq AS adalah putra kedua Nabi Ibrahim dari istrinya, Siti Sarah. Kelahirannya merupakan kabar gembira yang disampaikan oleh para malaikat saat Sarah sudah berusia lanjut. Ishaq dikenal sebagai nabi yang sangat lembut hatinya dan sangat berilmu. Dari keturunan Ishaq inilah lahir banyak nabi-nabi Bani Israil, termasuk Nabi Ya'qub dan Nabi Yusuf. Beliau selalu mengikuti jejak ayahnya dalam menegakkan ajaran tauhid di tanah Palestina.</p>

                    <div class="story-title"><span class="tag-nabi">10</span> NABI YA'QUB AS</div>
                    <p class="detail-text">Nabi Ya'qub AS adalah putra Nabi Ishaq. Beliau memiliki dua belas orang putra yang kelak menjadi cikal bakal dua belas suku Bani Israil. Kehidupan Ya'qub dipenuhi dengan ujian kesabaran, terutama saat putra-putranya membuang Yusuf (putra kesayangannya) ke dalam sumur. Ya'qub menangis selama bertahun-tahun hingga matanya menjadi putih (buta) karena sedih. Namun, beliau tetap berprasangka baik kepada Allah. Kesabarannya berbuah manis saat beliau akhirnya dipertemukan kembali dengan Yusuf yang telah menjadi penguasa di Mesir, dan penglihatannya pun pulih kembali.</p>

                    <div class="story-title"><span class="tag-nabi">11</span> NABI YUSUF AS</div>
                    <p class="detail-text">Nabi Yusuf AS diberikan mukjizat berupa ketampanan yang luar biasa (separuh ketampanan dunia) dan kemampuan menafsirkan mimpi. Beliau dibuang ke sumur oleh saudara-saudaranya yang iri, lalu ditemukan musafir dan dijual sebagai budak di Mesir. Beliau difitnah oleh Zulaikha hingga dipenjara. Di dalam penjara, beliau menafsirkan mimpi Raja tentang tujuh sapi gemuk dan tujuh sapi kurus. Karena ketepatannya, Yusuf dibebaskan dan diangkat menjadi bendahara negara Mesir. Yusuf berhasil menyelamatkan Mesir dari bencana kelaparan dan akhirnya memaafkan saudara-saudaranya.</p>

                    <div class="story-title"><span class="tag-nabi">12</span> NABI AYYUB AS</div>
                    <p class="detail-text">Nabi Ayyub AS adalah simbol kesabaran tiada tara. Beliau awalnya sangat kaya raya, memiliki banyak anak, dan kesehatan yang sempurna. Namun, Allah mengujinya dengan mencabut semua hartanya, mewafatkan anak-anaknya, dan memberikan penyakit kulit yang sangat parah di seluruh tubuhnya selama 18 tahun. Istrinya tetap setia mendampingi, namun kaumnya menjauh. Ayyub tidak pernah mengeluh dan terus berdzikir. Akhirnya Allah memerintahkannya menghentakkan kaki ke bumi, lalu muncullah air yang menyembuhkan seluruh penyakitnya dan Allah mengembalikan kekayaan serta keturunannya berlipat ganda.</p>

                    <div class="story-title"><span class="tag-nabi">13</span> NABI SYUAIB AS</div>
                    <p class="detail-text">Nabi Syuaib AS diutus kepada penduduk Madyan. Mereka adalah pedagang yang sangat licik, sering mengurangi takaran dan timbangan. Syuaib mengajak mereka untuk adil dalam berbisnis dan hanya menyembah Allah. Karena mereka menentang dan mengejek Syuaib, Allah mengirimkan azab berupa hawa panas yang membakar kulit (Yaumuz Zhullah), diikuti oleh gempa bumi yang dahsyat yang membuat mereka mati bergelimpangan di rumah mereka.</p>

                    <div class="story-title"><span class="tag-nabi">14</span> NABI MUSA AS</div>
                    <p class="detail-text">Nabi Musa AS adalah Rasul Ulul Azmi yang lahir di zaman Firaun. Firaun memerintahkan membunuh setiap bayi laki-laki, namun Musa diselamatkan Allah dengan dihanyutkan ke sungai Nil hingga ditemukan oleh istri Firaun sendiri. Musa memiliki mukjizat tongkat yang bisa berubah menjadi ular besar dan mengalahkan penyihir Firaun. Puncaknya, Musa membelah Laut Merah dengan tongkatnya untuk menyelamatkan Bani Israil dari kejaran tentara Firaun. Musa menerima Kitab Taurat di Bukit Sinai dan dikenal sebagai Kalimullah (orang yang bicara langsung dengan Allah).</p>

                    <div class="story-title"><span class="tag-nabi">15</span> NABI HARUN AS</div>
                    <p class="detail-text">Nabi Harun AS adalah kakak kandung Nabi Musa. Beliau diangkat menjadi nabi atas permintaan Musa kepada Allah agar didampingi oleh seseorang yang fasih bicaranya. Harun dikenal memiliki tutur kata yang lembut dan sangat bijaksana. Beliau setia mendampingi Musa menghadap Firaun dan memimpin Bani Israil saat Musa pergi ke Bukit Sinai selama 40 hari.</p>

                    <div class="story-title"><span class="tag-nabi">16</span> NABI DZULKIFLI AS</div>
                    <p class="detail-text">Nabi Dzulkifli AS adalah nabi yang sangat sabar dan teguh memegang janji. Nama beliau berarti "yang memiliki kesanggupan". Beliau terpilih menjadi pemimpin kaumnya setelah berhasil memenuhi syarat dari nabi sebelumnya, yaitu berpuasa di siang hari, sholat di malam hari, dan tidak pernah marah. Meski digoda oleh Iblis berkali-kali, beliau tetap tenang dan adil dalam memutuskan perkara.</p>

                    <div class="story-title"><span class="tag-nabi">17</span> NABI DAUD AS</div>
                    <p class="detail-text">Nabi Daud AS adalah raja sekaligus nabi yang menerima Kitab Zabur. Beliau memiliki suara yang sangat merdu hingga gunung-gunung dan burung-burung ikut bertasbih bersamanya. Daud memiliki mukjizat bisa melunakkan besi dengan tangan kosong untuk dijadikan baju perang. Beliau dikenal sangat rajin beribadah, terutama puasa Daud (sehari puasa, sehari tidak). Beliau berhasil membunuh Jalut (Goliath) yang perkasa dalam pertempuran.</p>

                    <div class="story-title"><span class="tag-nabi">18</span> NABI SULAIMAN AS</div>
                    <p class="detail-text">Nabi Sulaiman AS adalah putra Nabi Daud yang mewarisi kerajaan dan kenabiannya. Beliau adalah manusia terkaya dan memiliki kekuasaan paling luas. Mukjizatnya meliputi kemampuan berbicara dengan hewan (semut, burung hud-hud), memerintah bangsa Jin, serta menundukkan angin sebagai kendaraannya. Beliau membangun Baitul Maqdis dan Istana Kaca yang megah untuk menyadarkan Ratu Balqis dari penyembahan matahari.</p>

                    <div class="story-title"><span class="tag-nabi">19</span> NABI ILYAS AS</div>
                    <p class="detail-text">Nabi Ilyas AS diutus kepada kaumnya di Baalbak (Lebanon) yang menyembah berhala bernama Ba'al. Ilyas memperingatkan mereka akan azab Allah, namun mereka tetap ingkar. Allah kemudian menahan hujan selama tiga tahun hingga hewan-hewan mati. Setelah Ilyas berdoa, hujan turun kembali, namun kaumnya kembali berbuat syirik. Akhirnya mereka ditimpa bencana gempa yang dahsyat.</p>

                    <div class="story-title"><span class="tag-nabi">20</span> NABI ILYASA AS</div>
                    <p class="detail-text">Nabi Ilyasa AS adalah murid dan penerus Nabi Ilyas. Beliau melanjutkan dakwah Ilyas untuk membimbing Bani Israil agar tetap di jalan tauhid. Beliau diberikan mukjizat dapat menyembuhkan berbagai macam penyakit dan membangkitkan orang mati atas izin Allah demi membuktikan kebenaran risalahnya.</p>

                    <div class="story-title"><span class="tag-nabi">21</span> NABI YUNUS AS</div>
                    <p class="detail-text">Nabi Yunus AS diutus ke penduduk Ninawa. Karena mereka menolak dakwahnya, Yunus pergi meninggalkan mereka dengan perasaan marah sebelum ada perintah Allah. Yunus naik ke kapal yang kemudian dihantam badai. Yunus dilempar ke laut dan ditelan oleh ikan paus raksasa. Di dalam perut ikan yang gelap, Yunus bertaubat dan berdzikir: "La ilaha illa anta subhanaka inni kuntu minaz dhalimin." Allah mengeluarkannya ke daratan dalam keadaan selamat. Sementara itu, kaumnya ternyata bertaubat dan menjadi satu-satunya kaum yang selamat dari azab karena keimanan mereka.</p>

                    <div class="story-title"><span class="tag-nabi">22</span> NABI ZAKARIA AS</div>
                    <p class="detail-text">Nabi Zakaria AS adalah nabi yang sangat sabar dalam berdoa memohon keturunan. Hingga usia rambutnya memutih dan tulang-tulangnya lemah, beliau tidak berhenti memohon kepada Allah. Akhirnya, Allah mengabulkan doanya dengan memberikan putra bernama Yahya. Zakaria juga merupakan pengasuh Siti Maryam (ibunda Nabi Isa) dan menyaksikan keajaiban makanan yang selalu ada di mihrab Maryam.</p>

                    <div class="story-title"><span class="tag-nabi">23</span> NABI YAHYA AS</div>
                    <p class="detail-text">Nabi Yahya AS adalah putra Nabi Zakaria. Beliau dikenal sebagai nabi yang sangat cerdas, zuhud, dan sangat sayang kepada orang tuanya serta sesama makhluk. Yahya sangat hafal syariat Taurat dan memiliki keberanian besar dalam menentang penguasa yang zalim (Raja Herodus) yang ingin menikahi mahramnya sendiri.</p>

                    <div class="story-title"><span class="tag-nabi">24</span> NABI ISA AS</div>
                    <p class="detail-text">Nabi Isa AS lahir dari rahim Siti Maryam tanpa seorang ayah, sebagai tanda kekuasaan Allah. Beliau bisa berbicara saat masih bayi untuk membela kesucian ibunya. Mukjizatnya meliputi: menyembuhkan orang buta sejak lahir, menyembuhkan penyakit kusta, menghidupkan orang mati, dan menurunkan hidangan dari langit atas izin Allah. Beliau menerima Kitab Injil. Isa diangkat ke langit oleh Allah saat orang-orang kafir hendak menyalibnya.</p>

                    <div class="story-title"><span class="tag-nabi">25</span> NABI MUHAMMAD SAW</div>
                    <p class="detail-text">Nabi Muhammad SAW adalah penutup para nabi (Khatamul Anbiya) yang diutus untuk seluruh alam semesta. Lahir di tahun Gajah, beliau dikenal sebagai Al-Amin (yang terpercaya). Menerima wahyu pertama di Gua Hira (Al-Alaq 1-5). Mukjizat terbesarnya adalah Al-Qur'anul Karim. Beliau melakukan Isra Mi'raj dalam satu malam ke langit ketujuh. Beliau berhasil mengubah peradaban jahiliyah menjadi peradaban yang berakhlak mulia. Beliau adalah teladan sempurna (Uswatun Hasanah) bagi seluruh umat manusia hingga akhir zaman.</p>
                </div>
                `

                <div class="content-box">
                    <h3 class="story-title">NIAT SHOLAT 5 WAKTU (LENGKAP)</h3>
                    <p class="font-bold text-emerald-800">1. SHOLAT SUBUH (2 Rakaat)</p>
                    <p class="arabic">أُصَلِّى فَرْضَ الصُّبْح رَكْعَتَيْنِ مُسْتَقْبِلَ الْقِبْلَةِ أَدَاءً لِلَّهِ تَعَالَى</p>
                    <p class="latin">Usholli fardhos-shubhi rok'ataini mustaqbilal qiblati adaa-an lillaahi ta'ala.</p>
                    <p class="arti">"Aku niat sholat fardu subuh dua rakaat menghadap kiblat karena Allah Ta'ala."</p>

                    <p class="font-bold text-emerald-800">2. SHOLAT DZUHUR (4 Rakaat)</p>
                    <p class="arabic">أُصَلِّى فَرْضَ الظُّهْرِ اَرْبَعَ رَكَعَاتٍ مُسْتَقْبِلَ الْقِبْلَةِ اَدَاءً لِلَّهِ تَعَالَى</p>
                    <p class="latin">Usholli fardhod-dzhuhri arba'a raka'aatim mustaqbilal qiblati adaa-an lillaahi ta'ala.</p>
                    <p class="arti">"Aku niat sholat fardu dzuhur empat rakaat menghadap kiblat karena Allah Ta'ala."</p>

                    <p class="font-bold text-emerald-800">3. SHOLAT ASHAR (4 Rakaat)</p>
                    <p class="arabic">أُصَلِّى فَرْضَ الْعَصْرِ اَرْبَعَ رَكَعَاتٍ مُسْتَقْبِلَ الْقِبْلَةِ اَدَاءً لِلَّهِ تَعَالَى</p>
                    <p class="latin">Usholli fardhol-'ashri arba'a raka'aatim mustaqbilal qiblati adaa-an lillaahi ta'ala.</p>
                    <p class="arti">"Aku niat sholat fardu ashar empat rakaat menghadap kiblat karena Allah Ta'ala."</p>

                    <p class="font-bold text-emerald-800">4. SHOLAT MAGHRIB (3 Rakaat)</p>
                    <p class="arabic">أُصَلِّى فَرْضَ الْمَغْرِبِ ثَلاَثَ رَكَعَاتٍ مُسْتَقْبِلَ الْقِبْلَةِ اَدَاءً لِلَّهِ تَعَالَى</p>
                    <p class="latin">Usholli fardhol-maghribi thalaatha raka'aatim mustaqbilal qiblati adaa-an lillaahi ta'ala.</p>
                    <p class="arti">"Aku niat sholat fardu maghrib tiga rakaat menghadap kiblat karena Allah Ta'ala."</p>

                    <p class="font-bold text-emerald-800">5. SHOLAT ISYA (4 Rakaat)</p>
                    <p class="arabic">أُصَلِّى فَرْضَ الْعِشَاءِ اَرْبَعَ رَكَعَاتٍ مُسْتَقْبِلَ الْقِبْلَةِ اَدَاءً لِلَّهِ تَعَالَى</p>
                    <p class="latin">Usholli fardhol-'isyaa-i arba'a raka'aatim mustaqbilal qiblati adaa-an lillaahi ta'ala.</p>
                    <p class="arti">"Aku niat sholat fardu isya empat rakaat menghadap kiblat karena Allah Ta'ala."</p>
                </div>

                <div class="content-box">
                    <h3 class="story-title">BACAAN DALAM SHOLAT (TEKSTUAL)</h3>
                    <p class="font-bold text-xs uppercase text-slate-500">Doa Iftitah:</p>
                    <p class="arabic text-[1.4rem]">اللهُ أَكْبَرُ كَبِيرًا، وَالْحَمْدُ لِلَّهِ كَثِيرًا، وَسُبْحَانَ اللهِ بُكْرَةً وَأَصِيلاً. إِنِّي وَجَّهْتُ وَجْهِيَ لِلَّذِي فَطَرَ السَّمَاوَاتِ وَالْأَرْضَ حَنِيفًا مُسْلِمًا وَمَا أَنَا مِنَ الْمُشْرِكِينَ. إِنَّ صَلَاتِي وَنُسُكِي وَمَحْيَايَ وَمَمَاتِي لِلَّهِ رَبِّ الْعَالَمِينَ. لَا شَرِيكَ لَهُ وَبِذَلِكَ أُمِرْتُ وَأَنَا مِنَ الْمُسْلِمِينَ</p>

                    <p class="font-bold text-xs mt-10 uppercase text-slate-500">Bacaan Ruku':</p>
                    <p class="arabic">سُبْحَانَ رَبِّيَ الْعَظِيمِ وَبِحَمْدِهِ</p>
                    <p class="latin">Subhaana rabbiyal 'adhiimi wa bihamdih (3x).</p>

                    <p class="font-bold text-xs mt-10 uppercase text-slate-500">Bacaan I'tidal:</p>
                    <p class="arabic">سَمِعَ اللهُ لِمَنْ حَمِدَهُ. رَبَّنَا لَكَ الْحَمْدُ</p>
                    <p class="latin">Sami'allaahu liman hamidah. Rabbanaa lakal hamdu.</p>

                    <p class="font-bold text-xs mt-10 uppercase text-slate-500">Bacaan Sujud:</p>
                    <p class="arabic">سُبْحَانَ رَبِّيَ الْأَعْلَى وَبِحَمْدِهِ</p>
                    <p class="latin">Subhaana rabbiyal a'laa wa bihamdih (3x).</p>

                    <p class="font-bold text-xs mt-10 uppercase text-slate-500">Bacaan Duduk Antara Dua Sujud:</p>
                    <p class="arabic">رَبِّ اغْفِرْ لِي وَارْحَمْنِي وَاجْبُرْنِي وَارْفَعْنِي وَارْزُقْنِي وَاهْدِنِي وَعَافِنِي وَاعْفُ عَنِّي</p>
                    <p class="latin">Rabbighfirlii warhamnii wajburnii warfa'nii warzuqnii wahdinii wa'aafinii wa'fu 'annii.</p>

                    <p class="font-bold text-xs mt-10 uppercase text-slate-500">Tahiyat Akhir:</p>
                    <p class="arabic text-[1.2rem]">التَّحِيَّاتُ الْمُبَارَكَاتُ الصَّلَوَاتُ الطَّيِّبَاتُ لِلَّهِ. السَّلاَمُ عَلَيْكَ أَيُّهَا النَّبِىُّ وَرَحْمَةُ اللَّهِ وَبَرَكَاتُهُ. السَّلاَمُ عَلَيْنَا وَعَلَى عِبَادِ اللَّهِ الصَّالِحِينَ. أَشْهَدُ أَنْ لاَ إِلَهَ إِلاَّ اللَّهُ وَأَشْهَدُ أَنْ نَّ مُحَمَّدًا رَسُولُ اللَّهِ. اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ وَعَلَى آلِ سَيِّدِنَا مُحَمَّدٍ كَمَا صَلَّيْتَ عَلَى سَيِّدِنَا إِبْرَاهِيمَ وَعَلَى آلِ سَيِّدِنَا إِبْرَاهِيمَ وَبَارِكْ عَلَى سَيِّدِنَا مُحَمَّدٍ وَعَلَى آلِ سَيِّدِنَا مُحَمَّدٍ كَمَا بَارَكْتَ عَلَى سَيِّدِنَا إِبْرَاهِيمَ وَعَلَى آلِ سَيِّدِنَا إِبْرَاهِيمَ فِي الْعَالَمِينَ إِنَّكَ حَمِيدٌ مَجِيدٌ</p>
                </div>

                <div class="content-box">
                    <h3 class="story-title">DZIKIR SETELAH SHOLAT</h3>
                    <p class="text-sm">1. Istighfar (3x): Astaghfirullah hal adzim</p>
                    <p class="text-sm">2. Allahumma antas-salam wa minkas-salam tabarakta ya dzal jalali wal ikram.</p>
                    <p class="text-sm">3. Subhanallah (33x)</p>
                    <p class="text-sm">4. Alhamdulillah (33x)</p>
                    <p class="text-sm">5. Allahu Akbar (33x)</p>
                    <p class="text-sm">6. La ilaha illallahu wahdahu la syarika lah, lahul mulku wa lahul hamdu wa huwa 'ala kulli syai-in qadir.</p>
                </div>
                `

                <div class="content-box">
                    <h3 class="story-title">SIFAT 20 WAJIB ALLAH (DETAIL)</h3>
                    <div class="space-y-6 text-sm">
                        <div class="p-4 border rounded-xl"><b>1. WUJUD (Ada):</b> Artinya Allah itu zat yang pasti ada. Mustahil Allah itu tidak ada (Adam). Buktinya adalah adanya alam semesta dan isinya.</div>
                        <div class="p-4 border rounded-xl"><b>2. QIDAM (Dahulu):</b> Artinya Allah sudah ada sebelum segala sesuatu ada. Tidak ada permulaan bagi keberadaan Allah.</div>
                        <div class="p-4 border rounded-xl"><b>3. BAQA (Kekal):</b> Artinya Allah tidak akan pernah mati, rusak, atau berakhir. Allah tetap ada saat dunia hancur.</div>
                        <div class="p-4 border rounded-xl"><b>4. MUKHALAFATU LIL HAWADITSI (Berbeda dengan Baru):</b> Artinya Allah tidak serupa dengan makhluk-Nya. Allah tidak punya rupa, tidak punya arah, dan tidak menempati ruang.</div>
                        <div class="p-4 border rounded-xl"><b>5. QIYAMUHU BINAFSIHI (Berdiri Sendiri):</b> Artinya Allah tidak membutuhkan bantuan siapapun dan tidak butuh tempat tinggal. Justru makhluklah yang butuh Allah.</div>
                        <div class="p-4 border rounded-xl"><b>6. WAHDANIYAH (Esa):</b> Artinya Allah itu tunggal. Tidak ada Tuhan selain Dia, tidak ada sekutu bagi-Nya baik dalam zat, sifat, maupun perbuatan.</div>
                        <div class="p-4 border rounded-xl"><b>7. QUDRAT (Kuasa):</b> Artinya Allah Maha Kuasa atas segala sesuatu. Tidak ada yang mustahil bagi Allah.</div>
                        <div class="p-4 border rounded-xl"><b>8. IRADAT (Berkehendak):</b> Artinya segala yang terjadi di dunia ini adalah atas kemauan Allah. Tidak ada paksaan bagi Allah.</div>
                        <div class="p-4 border rounded-xl"><b>9. ILMU (Mengetahui):</b> Artinya Allah tahu segala sesuatu, baik yang tampak maupun yang tersembunyi, yang sudah lewat maupun yang akan datang.</div>
                        <div class="p-4 border rounded-xl"><b>10. HAYAT (Hidup):</b> Artinya Allah Maha Hidup. Hidupnya Allah tidak pakai nafas atau detak jantung, dan Allah tidak pernah tidur atau mati.</div>
                        <div class="p-4 border rounded-xl"><b>11. SAMA' (Mendengar):</b> Artinya Allah mendengar segala suara meski sangat pelan atau hanya dalam hati tanpa bantuan telinga.</div>
                        <div class="p-4 border rounded-xl"><b>12. BASHAR (Melihat):</b> Artinya Allah melihat segala sesuatu yang ada di alam raya tanpa bantuan mata atau cahaya.</div>
                        <div class="p-4 border rounded-xl"><b>13. KALAM (Berfirman):</b> Artinya Allah berkata-kata tanpa suara, tanpa huruf, dan tanpa bahasa seperti manusia. Kitab-kitab suci adalah bukti kalam-Nya.</div>
                        <div class="p-4 border rounded-xl"><b>14-20. KAUNUHU QADIRAN s/d MUTAKALLIMAN:</b> Ini adalah sifat keadaan Allah yang senantiasa Berkuasa, Berkehendak, Mengetahui, Hidup, Mendengar, Melihat, dan Berfirman selama-lamanya.</div>
                    </div>
                </div>

                <div class="content-box">
                    <h3 class="story-title">10 MALAIKAT & TUGAS RINCI</h3>
                    <ul class="space-y-4 text-sm">
                        <li class="border-b pb-2"><b>Jibril:</b> Menyampaikan wahyu dari Allah kepada para Nabi dan Rasul.</li>
                        <li class="border-b pb-2"><b>Mikail:</b> Mengatur pembagian rezeki, menurunkan hujan, dan mengatur cuaca.</li>
                        <li class="border-b pb-2"><b>Israfil:</b> Meniup terompet Sangkakala saat hari kiamat dan hari kebangkitan.</li>
                        <li class="border-b pb-2"><b>Izrail:</b> Mencabut nyawa seluruh makhluk yang hidup di alam semesta.</li>
                        <li class="border-b pb-2"><b>Raqib:</b> Mencatat setiap amal kebaikan manusia sejak akil baligh.</li>
                        <li class="border-b pb-2"><b>Atid:</b> Mencatat setiap amal keburukan atau maksiat yang dilakukan manusia.</li>
                        <li class="border-b pb-2"><b>Munkar:</b> Menanyai manusia di alam kubur tentang ketauhidan dan ibadah.</li>
                        <li class="border-b pb-2"><b>Nakir:</b> Menanyai manusia di alam kubur (berpasangan dengan Munkar).</li>
                        <li class="border-b pb-2"><b>Malik:</b> Penjaga pintu neraka yang sangat tegas dan perkasa.</li>
                        <li class="border-b pb-2"><b>Ridwan:</b> Penjaga pintu surga yang ramah menyambut hamba yang beriman.</li>
                    </ul>
                </div>
