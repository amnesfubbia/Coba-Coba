<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>amnesfubbia ANIMATION</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@1,700&family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { background-color: #000; color: #fff; font-family: 'Inter', sans-serif; margin: 0; overflow-x: hidden; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .fixed-header-section { position: fixed; top: 0; width: 100%; z-index: 100; background: #000; border-bottom: 1px solid #1c1c1c; }
        .ig-header { padding: 12px 15px 5px 15px; }
        .ig-logo { font-family: 'DM Sans', sans-serif; font-weight: 700; font-style: italic; font-size: 24px; letter-spacing: -0.8px; text-transform: lowercase; cursor: pointer; }
        .verified-icon { font-size: 13px; color: #0095f6; margin-left: 5px; }
        
        .search-container { background: #0a0a0a; border-radius: 8px; display: flex; align-items: center; padding: 7px 12px; flex-grow: 1; border: 1px solid #1c1c1c; }
        .search-container input { background: transparent !important; border: none !important; color: white !important; font-size: 13px; width: 100%; outline: none; margin-left: 8px; }
        
        .year-selector { background: #0a0a0a; border: 1px solid #1c1c1c; border-radius: 8px; padding: 8px 12px; font-size: 9px; font-weight: 800; color: #fff; text-transform: uppercase; cursor: pointer; display: flex; align-items: center; gap: 5px; }
        .year-dropdown { display: none; position: fixed; top: 110px; right: 15px; width: 120px; max-height: 300px; background: #121212; border: 1px solid #1c1c1c; border-radius: 12px; z-index: 101; overflow-y: auto; }
        .year-item { padding: 12px; font-size: 11px; font-weight: 600; text-align: center; border-bottom: 1px solid #1c1c1c; color: #888; cursor: pointer; }
        
        .pill { background: transparent; border: 1px solid #1c1c1c; color: #fff; padding: 8px 0; border-radius: 8px; font-size: 10px; font-weight: 800; text-transform: uppercase; text-align: center; cursor: pointer; }
        .pill.active { border-color: #fff; }

        .highlights-section { padding: 15px 0; border-bottom: 1px solid #1c1c1c; background: #000; }
        .highlight-item { flex: 0 0 75px; text-align: center; cursor: pointer; }
        .circle-icon { width: 62px; height: 62px; border-radius: 50%; background: #000; border: 1.5px solid #1c1c1c; display: flex; align-items: center; justify-content: center; margin: 0 auto 8px auto; font-size: 18px; color: #555; }
        .highlight-item.active .circle-icon { border: 2px solid transparent; background: linear-gradient(#000, #000) padding-box, linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%) border-box; color: #fff; }

        .movie-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; padding-top: 360px; padding-bottom: 100px; }
        .post-card { position: relative; aspect-ratio: 2/3; background: #0a0a0a; overflow: hidden; }
        .post-card img { width: 100%; height: 100%; object-fit: cover; }
        
        .badge-rating { position: absolute; top: 6px; left: 6px; padding: 2px 5px; border-radius: 2px; font-size: 7px; font-weight: 900; z-index: 5; background: rgba(255,255,255,0.9); color: #000; }
        .interaction-icon { font-size: 24px; cursor: pointer; color: #fff; }
        
        .modal-player { display: none; position: fixed; inset: 0; z-index: 500; background: #000; overflow-y: auto; }
        .story-border { padding: 2.5px; background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); border-radius: 50%; display: inline-block; }
        .story-inner { background: #000; padding: 2px; border-radius: 50%; }
        .story-img { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; display: block; }
        
        .server-btn { width: 100%; padding: 14px; border-radius: 12px; font-size: 10px; font-weight: 800; text-transform: uppercase; border: 1px solid #1c1c1c; text-align: center; cursor: pointer; }
        .ep-box { background: #111; border: 1px solid #1c1c1c; color: #555; font-size: 10px; font-weight: 800; padding: 12px 0; border-radius: 8px; text-align: center; cursor: pointer; }
        .ep-box.active { border-color: #fff; color: #fff; background: #1a1a1a; }
    </style>
</head>
<body>
    <div class="fixed-header-section">
        <header class="ig-header">
            <div class="flex justify-between items-center">
                <div class="flex items-center">
                    <h1 class="ig-logo" onclick="location.reload()">amnesfubbia <span class="text-white opacity-40 font-normal italic">animation</span></h1>
                    <i class="fa-solid fa-circle-check verified-icon"></i>
                </div>
                <div class="flex gap-6 text-xl">
                    <i class="fa-regular fa-square-plus" onclick="document.getElementById('searchInp').focus()"></i>
                    <i class="fa-regular fa-heart" onclick="showLibrary('likes')"></i>
                </div>
            </div>
            <div class="flex items-center gap-2 mt-2">
                <div class="search-container">
                    <i class="fa-solid fa-magnifying-glass text-zinc-600 text-[10px]"></i>
                    <input type="text" id="searchInp" placeholder="Cari animasi favoritmu..." onkeydown="if(event.key==='Enter') searchAction()">
                </div>
                <div class="year-selector" onclick="toggleYearDropdown()"><span id="yearVal">TAHUN</span> <i class="fa-solid fa-chevron-down text-[7px]"></i></div>
            </div>
        </header>

        <div class="px-[15px] pb-3">
            <div class="grid grid-cols-4 gap-2">
                <button class="pill active" onclick="setFilter('type', 'multi', this)">Semua</button>
                <button class="pill" onclick="setFilter('type', 'movie', this)">Film</button>
                <button class="pill" onclick="setFilter('type', 'tv', this)">Series</button>
                <button class="pill" onclick="setFilter('type', 'short', this)">Short</button>
            </div>
            <div class="grid grid-cols-3 gap-2 mt-2">
                <button class="pill active" id="btnAllSchedule" onclick="setSchedule('', this)">Terbaru</button>
                <button class="pill" onclick="setSchedule('now_playing', this)">Tayang</button>
                <button class="pill" onclick="setSchedule('upcoming', this)">Akan Datang</button>
            </div>
        </div>

        <div class="highlights-section">
            <div class="flex gap-4 overflow-x-auto no-scrollbar px-4" id="genreHighlights">
                <div class="highlight-item active" onclick="setFilter('genre', '', this)"><div class="circle-icon"><i class="fa-solid fa-border-all"></i></div><p class="text-[9px] font-bold text-zinc-500 uppercase">Semua</p></div>
                <div class="highlight-item" onclick="setFilter('lang', 'ja', this)"><div class="circle-icon">🇯🇵</div><p class="text-[9px] font-bold text-zinc-500 uppercase">Anime</p></div>
                <div class="highlight-item" onclick="setFilter('genre', '12', this)"><div class="circle-icon"><i class="fa-solid fa-compass"></i></div><p class="text-[9px] font-bold text-zinc-500 uppercase">Adventure</p></div>
                <div class="highlight-item" onclick="setFilter('genre', '14', this)"><div class="circle-icon"><i class="fa-solid fa-wand-sparkles"></i></div><p class="text-[9px] font-bold text-zinc-500 uppercase">Fantasy</p></div>
            </div>
        </div>
    </div>

    <div id="yearDropdown" class="year-dropdown no-scrollbar"></div>
    <main id="feedGrid" class="movie-grid"></main>

    <nav class="bottom-nav">
        <div class="nav-item" onclick="closeModal(); location.reload();"><i class="fa-solid fa-house"></i></div>
        <div class="nav-item" onclick="closeModal(); document.getElementById('searchInp').focus();"><i class="fa-solid fa-magnifying-glass"></i></div>
        <div class="nav-item" onclick="closeModal(); showLibrary('bookmarks');"><i class="fa-regular fa-bookmark"></i></div>
        <div class="nav-item" onclick="alert('Amnesfubbia v2.0')"><i class="fa-regular fa-user"></i></div>
    </nav>

    <div id="movieModal" class="modal-player">
        <div class="max-w-xl mx-auto pb-40">
            <div class="px-4 h-[54px] flex items-center border-b border-zinc-900 sticky top-0 bg-black z-50">
                <i class="fa-solid fa-chevron-left text-xl" onclick="closeModal()"></i>
                <div class="flex-grow text-center"><h2 id="mTitle" class="truncate px-10"></h2></div>
            </div>
            
            <div class="py-4 bg-black border-b border-zinc-900"><div id="mCast" class="flex gap-4 overflow-x-auto no-scrollbar px-4"></div></div>
            
            <div class="aspect-video bg-zinc-900"><iframe id="videoPlayer" class="w-full h-full" allowfullscreen></iframe></div>
            
            <div class="px-4 py-4">
                <div class="flex justify-between mb-4">
                    <div class="flex gap-5">
                        <i id="btnLikeModal" class="interaction-icon"></i>
                        <i class="fa-regular fa-comment interaction-icon"></i>
                    </div>
                    <i id="btnBookModal" class="interaction-icon"></i>
                </div>
                <p id="mLikeCount" class="font-bold text-sm mb-2"></p>
                <p class="text-sm"><span id="mTitleAlt" class="font-black mr-2"></span><span id="mTagline" class="italic text-zinc-400"></span></p>
                <div class="mt-2"><span id="mDesc" class="text-zinc-300 text-sm leading-relaxed"></span></div>
                <p id="mMeta" class="text-[10px] text-zinc-500 mt-2 uppercase font-bold tracking-widest"></p>
                
                <div id="seriesControl" class="hidden mt-6 p-4 bg-zinc-950 rounded-xl border border-zinc-900">
                    <div class="flex justify-between items-center mb-4">
                        <span class="text-[10px] font-black text-zinc-500">EPISODE LIST</span>
                        <select id="seasonSel" class="bg-zinc-900 text-xs p-1 rounded border border-zinc-800" onchange="loadEpisodes()"></select>
                    </div>
                    <div id="episodeGrid" class="grid grid-cols-5 gap-2"></div>
                </div>

                <div id="serverList" class="grid grid-cols-2 gap-2 mt-6"></div>
                <button id="btnDownloadMain" class="server-btn border-zinc-800 text-zinc-500 mt-4"><i class="fa-solid fa-download mr-2"></i> Download Sinema</button>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = 'bfa7df5310c9974f62f26c6789a8c00d';
        let page = 1, currentType = 'multi', currentGenre = '', currentYear = '', searchQuery = '', currentSchedule = '';

        const getStore = (k) => JSON.parse(localStorage.getItem('anim_' + k) || '[]');
        const saveStore = (k, v) => localStorage.setItem('anim_' + k, JSON.stringify(v));

        window.onload = () => { initYearDropdown(); loadFeed(); };

        function initYearDropdown() {
            const d = document.getElementById('yearDropdown');
            let h = '<div class="year-item" onclick="setYear(\'\')">SEMUA</div>';
            for(let y=2026; y>=1950; y--) h += `<div class="year-item" onclick="setYear(${y})">${y}</div>`;
            d.innerHTML = h;
        }
        function toggleYearDropdown() { const d = document.getElementById('yearDropdown'); d.style.display = d.style.display === 'block' ? 'none' : 'block'; }
        function setYear(y) { currentYear = y; document.getElementById('yearVal').innerText = y || 'TAHUN'; toggleYearDropdown(); loadFeed(true); }

        async function loadFeed(isNew = true) {
            if (isNew) { page = 1; document.getElementById('feedGrid').innerHTML = ''; }
            let url = `https://api.themoviedb.org/3/discover/${currentType === 'tv' ? 'tv' : 'movie'}?api_key=${API_KEY}&with_genres=16&language=id-ID&page=${page}`;
            
            if (searchQuery) url = `https://api.themoviedb.org/3/search/multi?api_key=${API_KEY}&query=${searchQuery}&language=id-ID`;
            if (currentYear) url += (currentType === 'tv' ? `&first_air_date_year=${currentYear}` : `&primary_release_year=${currentYear}`);
            if (currentGenre) url += `&with_genres=16,${currentGenre}`;
            if (currentSchedule) url = `https://api.themoviedb.org/3/movie/${currentSchedule}?api_key=${API_KEY}&language=id-ID`;

            try {
                const res = await fetch(url);
                const data = await res.json();
                renderFeed(data.results.map(m => ({...m, m_type: m.media_type || (currentType === 'tv' ? 'tv' : 'movie')})));
            } catch (e) { console.error(e); }
        }

        function renderFeed(items) {
            const grid = document.getElementById('feedGrid');
            items.forEach(m => {
                if (!m.poster_path) return;
                const card = document.createElement('div');
                card.className = 'post-card';
                card.onclick = () => openModal(m.id, m.m_type);
                card.innerHTML = `<div class="badge-rating"><i class="fa-solid fa-star mr-1"></i>${m.vote_average.toFixed(1)}</div><img src="https://image.tmdb.org/t/p/w342${m.poster_path}">`;
                grid.appendChild(card);
            });
        }

        async function openModal(id, type) {
            window.currentMediaId = id;
            document.getElementById('movieModal').style.display = 'block';
            document.body.style.overflow = 'hidden';
            
            const res = await fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=${API_KEY}&language=id-ID&append_to_response=videos,credits`);
            const d = await res.json();

            document.getElementById('mTitle').innerText = d.title || d.name;
            document.getElementById('mTitleAlt').innerText = (d.title || d.name).toLowerCase().replace(/\s/g, '');
            document.getElementById('mTagline').innerText = d.tagline ? `"${d.tagline}"` : "";
            document.getElementById('mDesc').innerText = d.overview || "Sinopsis tidak tersedia.";
            document.getElementById('mMeta').innerText = `${(d.release_date || d.first_air_date || '').split('-')[0]} • ${type.toUpperCase()}`;
            document.getElementById('mLikeCount').innerText = `${Math.floor(d.vote_average * 1000).toLocaleString()} suka`;

            // Cast
            document.getElementById('mCast').innerHTML = (d.credits.cast || []).slice(0, 8).map(c => `
                <div class="flex-shrink-0 text-center w-[60px]">
                    <div class="story-border"><div class="story-inner">
                        <img src="https://image.tmdb.org/t/p/w185${c.profile_path}" class="story-img" onerror="this.src='https://via.placeholder.com/100'">
                    </div></div>
                    <p class="text-[8px] truncate mt-1 text-zinc-500">${c.name.split(' ')[0]}</p>
                </div>
            `).join('');

            // Video & Servers
            if(type === 'tv') {
                document.getElementById('seriesControl').classList.remove('hidden');
                document.getElementById('serverList').classList.add('hidden');
                document.getElementById('btnDownloadMain').classList.add('hidden');
                document.getElementById('seasonSel').innerHTML = d.seasons.map(s => `<option value="${s.season_number}">Season ${s.season_number}</option>`).join('');
                loadEpisodes();
            } else {
                document.getElementById('seriesControl').classList.add('hidden');
                document.getElementById('serverList').classList.remove('hidden');
                document.getElementById('btnDownloadMain').classList.remove('hidden');
                const trailer = d.videos.results.find(v => v.type === 'Trailer');
                document.getElementById('videoPlayer').src = trailer ? `https://www.youtube.com/embed/${trailer.key}?autoplay=1` : `https://vidrock.net/embed/movie/${id}`;
                document.getElementById('serverList').innerHTML = `
                    <button class="server-btn bg-zinc-950" onclick="document.getElementById('videoPlayer').src='https://vidrock.net/embed/movie/${id}'">Server 1</button>
                    <button class="server-btn bg-zinc-950" onclick="document.getElementById('videoPlayer').src='https://vidsrc.me/embed/movie/${id}'">Server 2</button>
                `;
                document.getElementById('btnDownloadMain').onclick = () => window.open(`https://dl.vidsrc.vip/movie/${id}`, '_blank');
            }
            updateModalButtons(id);
        }

        async function loadEpisodes() {
            const s = document.getElementById('seasonSel').value;
            const res = await fetch(`https://api.themoviedb.org/3/tv/${window.currentMediaId}/season/${s}?api_key=${API_KEY}`);
            const d = await res.json();
            document.getElementById('episodeGrid').innerHTML = d.episodes.map(e => `
                <div class="ep-box" onclick="playEp(${s}, ${e.episode_number})">${e.episode_number}</div>
            `).join('');
            playEp(s, 1);
        }

        function playEp(s, e) {
            document.getElementById('videoPlayer').src = `https://vidrock.net/embed/tv/${window.currentMediaId}/${s}/${e}`;
            document.querySelectorAll('.ep-box').forEach((b, i) => b.classList.toggle('active', i === e-1));
        }

        function closeModal() { document.getElementById('movieModal').style.display = 'none'; document.getElementById('videoPlayer').src = ''; document.body.style.overflow = 'auto'; }
        function searchAction() { searchQuery = document.getElementById('searchInp').value; loadFeed(true); }
        function setFilter(t, v, el) { 
            document.querySelectorAll('.pill, .highlight-item').forEach(p => p.classList.remove('active'));
            el.classList.add('active');
            if(t==='type') currentType = v; else if(t==='genre') currentGenre = v;
            loadFeed(true);
        }
        function setSchedule(v, el) { currentSchedule = v; loadFeed(true); }

        function updateModalButtons(id) {
            const isLiked = getStore('likes').some(x => x.id == id);
            const isBooked = getStore('bookmarks').some(x => x.id == id);
            document.getElementById('btnLikeModal').className = isLiked ? 'fa-solid fa-heart text-red-500 interaction-icon' : 'fa-regular fa-heart interaction-icon';
            document.getElementById('btnBookModal').className = isBooked ? 'fa-solid fa-bookmark text-white interaction-icon' : 'fa-regular fa-bookmark interaction-icon';
        }

        function toggleItem(key, id) {
            let items = getStore(key);
            const idx = items.findIndex(x => x.id == id);
            if(idx > -1) items.splice(idx, 1); else items.push({id});
            saveStore(key, items);
            updateModalButtons(id);
        }

        function showLibrary(k) {
            const grid = document.getElementById('feedGrid');
            grid.innerHTML = '';
            const items = getStore(k);
            if(!items.length) grid.innerHTML = '<div class="col-span-3 text-center py-20 uppercase text-xs font-black">Kosong</div>';
            else loadFeed(); // Untuk demo, panggil feed lagi (biasanya ambil data dari storage)
        }
    </script>
</body>
</html>
