<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amnesfubbia Entertainment</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { background-color: #050505; color: #ffffff; font-family: 'Inter', sans-serif; min-height: 100vh; }
        .glass-nav { background: rgba(8, 8, 8, 0.98); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255, 255, 255, 0.1); z-index: 1000; position: fixed; top: 0; width: 100%; }
        .movie-card { background: #111; border-radius: 12px; overflow: hidden; position: relative; border: 1px solid rgba(255,255,255,0.05); }
        .type-badge { position: absolute; top: 8px; left: 8px; background: #ef4444; color: white; font-size: 8px; font-weight: 900; padding: 3px 7px; border-radius: 4px; z-index: 10; text-transform: uppercase; }
        .modal { display: none; position: fixed; inset: 0; z-index: 3000; background: rgba(0,0,0,0.95); overflow-y: auto; }
        
        /* Perbaikan Pemeran - Tanpa Batasan Sempit */
        .actor-item { flex: 0 0 auto; width: 100px; text-align: center; padding: 10px; }
        .actor-item img { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 2px solid #ef4444; margin-bottom: 8px; box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3); }
        
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        select { background-color: #1a1a1a; color: white; border: 1px solid #333; padding: 8px; border-radius: 8px; font-size: 11px; font-weight: bold; text-transform: uppercase; }
    </style>
</head>
<body onload="initApp()">

    <nav class="glass-nav p-4">
        <div class="container mx-auto space-y-4">
            <div class="flex items-center gap-3">
                <div class="shrink-0 cursor-pointer" onclick="location.reload()">
                    <span class="text-2xl font-black italic tracking-tighter">AMNES</span><span class="text-2xl font-black text-red-600 italic">FILM</span>
                </div>
                <input type="text" id="searchInput" placeholder="Cari film atau aktor..." class="flex-grow bg-white/5 p-3 rounded-xl border border-white/10 text-xs outline-none focus:border-red-600 transition-all">
                <button onclick="searchMulti()" class="bg-red-600 px-5 py-3 rounded-xl font-black text-[11px] uppercase italic">Cari</button>
            </div>
            
            <div class="flex gap-2 overflow-x-auto pb-1 scrollbar-hide">
                <select id="typeFilter" onchange="resetAndLoad()" class="text-red-500">
                    <option value="all">Semua Tipe</option>
                    <option value="movie">Layar Lebar</option>
                    <option value="tv">TV Series</option>
                    <option value="short">Short Movie</option>
                </select>
                <select id="genreFilter" onchange="resetAndLoad()">
                    <option value="">Semua Genre</option>
                    <option value="16">Animasi</option>
                    <option value="27">Horor</option>
                    <option value="35">Komedi</option>
                    <option value="18">Drama</option>
                    <option value="28">Aksi</option>
                    <option value="10749">Romantis</option>
                    <option value="99">Dokumenter</option>
                    <option value="10751">Keluarga</option>
                </select>
                <select id="yearFilter" onchange="resetAndLoad()">
                    <option value="">Semua Tahun</option>
                    <script>
                        for(let y=2026; y>=1950; y--) document.write(`<option value="${y}">${y}</option>`);
                    </script>
                </select>
            </div>
        </div>
    </nav>

    <main class="container mx-auto px-4 pt-44 pb-20">
        <div id="movieGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4">
            <div class="col-span-full text-center py-20 opacity-50 italic">Memuat film Indonesia...</div>
        </div>
        
        <div class="flex justify-center mt-12">
            <button id="loadMoreBtn" onclick="loadMore()" class="bg-white/10 border border-white/20 hover:bg-red-600 px-12 py-4 rounded-2xl font-black text-xs uppercase italic tracking-widest transition-all">Tampilkan Lebih Banyak</button>
        </div>
    </main>

    <footer class="bg-[#030303] py-20 border-t border-white/5 text-center">
        <p class="text-[18px] font-black tracking-[0.6em] text-white uppercase italic">AMNESFUBBIA ENTERTAINMENT</p>
    </footer>

    <div id="movieModal" class="modal flex items-start justify-center p-4">
        <div class="bg-[#0a0a0a] w-full max-w-5xl rounded-3xl overflow-hidden relative border border-white/10 shadow-2xl mt-10">
            <button onclick="closeModal()" class="absolute top-5 right-5 bg-red-600 text-white w-12 h-12 rounded-full z-[100] flex items-center justify-center shadow-lg">✕</button>
            
            <div class="flex flex-col md:flex-row">
                <div class="md:w-1/3 p-8 bg-black/40 border-r border-white/5">
                    <img id="mPoster" class="w-full rounded-2xl shadow-2xl transition-transform duration-500 hover:scale-105">
                </div>

                <div class="md:w-2/3 p-8 flex flex-col">
                    <h2 id="mTitle" class="text-4xl font-black italic tracking-tighter uppercase mb-2 leading-none"></h2>
                    <p id="mSub" class="text-xs text-red-500 font-bold mb-8 uppercase tracking-widest"></p>

                    <p class="text-[10px] font-black text-gray-500 uppercase mb-3 italic tracking-widest">Official Trailer</p>
                    <div class="w-full aspect-video bg-black rounded-2xl overflow-hidden border border-white/10 mb-8">
                        <iframe id="mTrailer" class="w-full h-full" frameborder="0" allowfullscreen allow="autoplay"></iframe>
                    </div>

                    <p class="text-[10px] font-black text-gray-500 uppercase mb-3 italic tracking-widest">Pemeran Utama</p>
                    <div id="mCast" class="flex overflow-x-auto gap-2 pb-6 scrollbar-hide mb-6 border-b border-white/5"></div>

                    <p class="text-[10px] font-black text-gray-500 uppercase mb-3 italic tracking-widest">Sinopsis Film</p>
                    <p id="mDesc" class="text-[14px] text-gray-300 leading-relaxed italic mb-12"></p>

                    <div class="mt-auto grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div class="space-y-2">
                            <p class="text-[10px] font-black text-red-500 uppercase italic">Streaming</p>
                            <div class="flex gap-2">
                                <a id="s1" target="_blank" class="flex-1 bg-red-600 text-center py-4 rounded-xl text-[10px] font-black uppercase italic">Server 1</a>
                                <a id="s2" target="_blank" class="flex-1 bg-white/10 text-center py-4 rounded-xl text-[10px] font-black uppercase italic border border-white/10">Server 2</a>
                            </div>
                        </div>
                        <div class="space-y-2">
                            <p class="text-[10px] font-black text-green-500 uppercase italic">Download</p>
                            <div class="flex gap-2">
                                <a id="d1" target="_blank" class="flex-1 bg-green-700 text-center py-4 rounded-xl text-[10px] font-black uppercase italic">Server 1</a>
                                <a id="d2" target="_blank" class="flex-1 bg-blue-700 text-center py-4 rounded-xl text-[10px] font-black uppercase italic">Server 2</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const KEY = 'bfa7df5310c9974f62f26c6789a8c00d';
        const IMG = 'https://image.tmdb.org/t/p/w500';
        let page = 1;

        function initApp() { 
            try { loadMovies(); } 
            catch(e) { document.getElementById('movieGrid').innerHTML = "Terjadi kendala koneksi."; }
        }

        async function loadMovies(append = false) {
            const type = document.getElementById('typeFilter').value;
            const genre = document.getElementById('genreFilter').value;
            const year = document.getElementById('yearFilter').value;
            
            let fetchType = type === 'all' || type === 'short' ? 'movie' : type;
            let url = `https://api.themoviedb.org/3/discover/${fetchType}?api_key=${KEY}&with_origin_country=ID&language=id-ID&page=${page}&sort_by=popularity.desc`;
            
            if (genre) url += `&with_genres=${genre}`;
            if (year) url += `&primary_release_year=${year}`;
            if (type === 'short') url += `&with_runtime.lte=45`;

            const res = await fetch(url);
            const data = await res.json();
            const grid = document.getElementById('movieGrid');
            if (!append) grid.innerHTML = '';
            
            if(data.results.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-20 italic">Tidak ada film ditemukan untuk kriteria ini.</div>`;
                return;
            }

            data.results.forEach(m => {
                if (!m.poster_path) return;
                const card = document.createElement('div');
                card.className = 'movie-card cursor-pointer';
                card.onclick = () => showDetail(m.id, m.title ? 'movie' : 'tv');
                card.innerHTML = `
                    <div class="type-badge">${m.title ? 'Layar Lebar' : 'TV Series'}</div>
                    <img src="${IMG + m.poster_path}" class="w-full aspect-[2/3] object-cover" loading="lazy">
                    <div class="p-3 text-[10px] font-black truncate uppercase text-gray-200">${m.title || m.name}</div>
                `;
                grid.appendChild(card);
            });
        }

        async function showDetail(id, type) {
            const res = await fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=${KEY}&append_to_response=videos,credits&language=id-ID`);
            const m = await res.json();
            
            document.getElementById('mPoster').src = IMG + m.poster_path;
            document.getElementById('mTitle').innerText = m.title || m.name;
            
            const year = (m.release_date || m.first_air_date || '').split('-')[0];
            const genres = m.genres.map(g => g.name).join(', ');
            const rating = m.vote_average ? m.vote_average.toFixed(1) : '0';
            document.getElementById('mSub').innerText = `${year} | ⭐ ${rating} | ${genres}`;
            
            // Fix Trailer
            let video = m.videos.results.find(v => v.type === 'Trailer');
            if(!video && m.videos.results.length > 0) video = m.videos.results[0];
            document.getElementById('mTrailer').src = video ? `https://www.youtube.com/embed/${video.key}?autoplay=1&mute=1` : '';

            document.getElementById('mDesc').innerText = m.overview || "Sinopsis belum tersedia dalam Bahasa Indonesia.";

            // Perbaikan Daftar Pemeran
            const castDiv = document.getElementById('mCast');
            castDiv.innerHTML = m.credits.cast.length > 0 ? m.credits.cast.slice(0, 10).map(c => `
                <div class="actor-item" onclick="searchByActor(${c.id}, '${c.name}')">
                    <img src="${c.profile_path ? IMG + c.profile_path : 'https://via.placeholder.com/150x150?text=No+Photo'}" alt="${c.name}">
                    <p class="text-[9px] font-black text-white uppercase leading-tight">${c.name}</p>
                </div>
            `).join('') : '<p class="text-xs italic text-gray-600 ml-2">Data pemeran tidak tersedia.</p>';

            // Update Links
            const stream1 = `https://vidsrc.to/embed/${type}/${m.id}`;
            const stream2 = `https://vidsrc.xyz/embed/${type}/${m.id}`;
            document.getElementById('s1').href = stream1;
            document.getElementById('s2').href = stream2;
            document.getElementById('d1').href = `https://dl.vidsrc.vip/${type}/${m.id}`;
            document.getElementById('d2').href = `https://flashstream.cc/download/${type === 'movie' ? 'movie' : 'series'}/${m.id}`;

            document.getElementById('movieModal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function loadMore() { page++; loadMovies(true); }
        function resetAndLoad() { page = 1; loadMovies(); }
        function closeModal() { 
            document.getElementById('movieModal').style.display = 'none'; 
            document.getElementById('mTrailer').src = '';
            document.body.style.overflow = 'auto'; 
        }

        async function searchMulti() {
            const q = document.getElementById('searchInput').value; if (!q) return;
            const res = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${KEY}&query=${encodeURIComponent(q)}&language=id-ID`);
            const data = await res.json();
            const grid = document.getElementById('movieGrid');
            grid.innerHTML = '';
            data.results.forEach(m => {
                if(!m.poster_path) return;
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.onclick = () => showDetail(m.id, m.title ? 'movie' : 'tv');
                card.innerHTML = `<img src="${IMG + m.poster_path}" class="w-full aspect-[2/3] object-cover"><div class="p-3 text-[10px] font-black uppercase text-gray-200">${m.title || m.name}</div>`;
                grid.appendChild(card);
            });
        }
    </script>
</body>
</html>
