<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>amnesfubbia xx1 - Global Animation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@1,700&family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { background-color: #000; color: #fff; font-family: 'Inter', sans-serif; margin: 0; overflow-x: hidden; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .fixed-header-section { position: fixed; top: 0; width: 100%; z-index: 100; background: #000; border-bottom: 1px solid #1c1c1c; }
        .ig-header { padding: 12px 15px 5px 15px; }
        .ig-logo { font-family: 'DM Sans', sans-serif; font-weight: 700; font-style: italic; font-size: 24px; letter-spacing: -0.8px; text-transform: lowercase; cursor: pointer; }
        .verified-icon { font-size: 13px; color: #0095f6; margin-left: 5px; }
        .search-container { background: #0a0a0a; border-radius: 8px; display: flex; align-items: center; padding: 7px 12px; flex-grow: 1; border: 1px solid #1c1c1c; }
        .search-container input { background: transparent !important; border: none !important; color: white !important; font-size: 13px; width: 100%; outline: none !important; box-shadow: none !important; margin-left: 8px; }
        .pill-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 10px 15px; }
        .pill { background: transparent; border: 1px solid #1c1c1c; color: #fff; padding: 8px 0; border-radius: 8px; font-size: 10px; font-weight: 800; text-transform: uppercase; text-align: center; cursor: pointer; }
        .pill.active { border-color: #fff; }
        .movie-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; padding-top: 180px; padding-bottom: 100px; }
        .post-card { position: relative; aspect-ratio: 2/3; background: #0a0a0a; overflow: hidden; cursor: pointer; }
        .post-card img { width: 100%; height: 100%; object-fit: cover; }
        .badge-type { position: absolute; top: 8px; right: 8px; font-size: 12px; color: #fff; z-index: 5; text-shadow: 0 0 4px rgba(0,0,0,0.8); }
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: #000; border-top: 1px solid #1c1c1c; display: flex; justify-content: space-around; padding: 15px 0; z-index: 300; }
        .modal-player { display: none; position: fixed; inset: 0; z-index: 200; background: #000; overflow-y: auto; }
        .skeleton { background: linear-gradient(90deg, #0a0a0a 25%, #1a1a1a 50%, #0a0a0a 75%); background-size: 200% 100%; animation: loading 1.5s infinite; }
        @keyframes loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    </style>
</head>
<body>
    <div class="fixed-header-section">
        <header class="ig-header">
            <div class="flex justify-between items-center">
                <div class="flex items-center">
                    <h1 class="ig-logo">amnesfubbia <span class="text-white opacity-40 font-normal italic">xx1</span></h1>
                    <i class="fa-solid fa-circle-check verified-icon"></i>
                </div>
            </div>
            <div class="flex items-center gap-2 mt-2">
                <div class="search-container">
                    <i class="fa-solid fa-magnifying-glass text-zinc-600 text-[10px]"></i>
                    <input type="text" id="searchInp" placeholder="Cari animasi dunia..." onkeydown="if(event.key==='Enter') searchAction()">
                </div>
            </div>
        </header>
        <div class="pill-grid">
            <button class="pill active" onclick="setFilter('multi', this)">Semua</button>
            <button class="pill" onclick="setFilter('movie', this)">Film</button>
            <button class="pill" onclick="setFilter('tv', this)">Series</button>
            <button class="pill" onclick="setFilter('short', this)">Short</button>
        </div>
    </div>

    <main id="feedGrid" class="movie-grid"></main>

    <div id="movieModal" class="modal-player">
        <div class="p-4 border-b border-zinc-900 flex items-center">
            <i class="fa-solid fa-chevron-left text-xl mr-4" onclick="closeModal()"></i>
            <h2 id="mTitle" class="font-bold truncate"></h2>
        </div>
        <div class="aspect-video bg-zinc-900">
            <iframe id="videoPlayer" class="w-full h-full" allowfullscreen></iframe>
        </div>
        <div class="p-4">
            <p id="mDesc" class="text-sm text-zinc-400"></p>
        </div>
    </div>

    <nav class="bottom-nav">
        <i class="fa-solid fa-house text-xl" onclick="location.reload()"></i>
        <i class="fa-solid fa-magnifying-glass text-xl"></i>
        <i class="fa-regular fa-bookmark text-xl"></i>
        <i class="fa-regular fa-user text-xl"></i>
    </nav>

    <script>
        const API_KEY = 'bfa7df5310c9974f62f26c6789a8c00d';
        let page = 1, currentType = 'multi', searchQuery = '';

        window.onload = () => loadFeed();

        async function loadFeed(isNew = true) {
            if (isNew) { page = 1; document.getElementById('feedGrid').innerHTML = ''; }
            
            // PENGATURAN UTAMA: Genre 16 (Animasi) & Tanpa filter negara (Global)
            let url = `https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&with_genres=16&page=${page}`;
            
            if (currentType === 'tv') {
                url = `https://api.themoviedb.org/3/discover/tv?api_key=${API_KEY}&with_genres=16&page=${page}`;
            } else if (currentType === 'short') {
                url = `https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&with_genres=16&with_runtime.lte=40&page=${page}`;
            } else if (searchQuery) {
                url = `https://api.themoviedb.org/3/search/multi?api_key=${API_KEY}&query=${searchQuery}&page=${page}`;
            }

            try {
                const res = await fetch(url);
                const data = await res.json();
                renderFeed(data.results);
            } catch (err) { console.error(err); }
        }

        function renderFeed(items) {
            const grid = document.getElementById('feedGrid');
            items.forEach(m => {
                if (!m.poster_path) return;
                // Pastikan hasil search juga hanya menampilkan animasi
                if (searchQuery && !m.genre_ids?.includes(16)) return;

                const card = document.createElement('div');
                card.className = 'post-card';
                card.onclick = () => openModal(m.id, m.media_type || (currentType === 'tv' ? 'tv' : 'movie'));
                card.innerHTML = `
                    <div class="badge-type">${m.vote_average.toFixed(1)}</div>
                    <img src="https://image.tmdb.org/t/p/w342${m.poster_path}">
                `;
                grid.appendChild(card);
            });
        }

        async function openModal(id, type) {
            document.getElementById('movieModal').style.display = 'block';
            const res = await fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=${API_KEY}`);
            const d = await res.json();
            document.getElementById('mTitle').innerText = d.title || d.name;
            document.getElementById('mDesc').innerText = d.overview || "No description.";
            document.getElementById('videoPlayer').src = `https://vidrock.net/embed/${type}/${id}`;
        }

        function closeModal() {
            document.getElementById('movieModal').style.display = 'none';
            document.getElementById('videoPlayer').src = '';
        }

        function setFilter(type, el) {
            document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
            el.classList.add('active');
            currentType = type;
            searchQuery = '';
            loadFeed(true);
        }

        function searchAction() {
            searchQuery = document.getElementById('searchInp').value;
            loadFeed(true);
        }
    </script>
</body>
</html>
