<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>amnesfubbia ANIMATION</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@1,700&family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { background-color: #000; color: #fff; font-family: 'Inter', sans-serif; margin: 0; overflow-x: hidden; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .fixed-header-section { position: fixed; top: 0; width: 100%; z-index: 100; background: #000; border-bottom: 1px solid #1c1c1c; }
        .ig-header { padding: 12px 15px 5px 15px; }
        .ig-logo { font-family: 'DM Sans', sans-serif; font-weight: 700; font-style: italic; font-size: 24px; letter-spacing: -0.8px; text-transform: lowercase; cursor: pointer; }
        .search-container { background: #0a0a0a; border-radius: 8px; display: flex; align-items: center; padding: 7px 12px; flex-grow: 1; border: 1px solid #1c1c1c; }
        .search-container input { background: transparent !important; border: none; color: white; font-size: 13px; width: 100%; outline: none; margin-left: 8px; }
        
        /* Menu Filter System */
        .pill { background: transparent; border: 1px solid #1c1c1c; color: #fff; padding: 8px 0; border-radius: 8px; font-size: 10px; font-weight: 800; text-transform: uppercase; text-align: center; cursor: pointer; }
        .pill.active { border-color: #fff; }
        .filter-dropdown-btn { background: #0a0a0a; border: 1px solid #1c1c1c; border-radius: 8px; padding: 8px; font-size: 9px; font-weight: 800; color: #fff; text-transform: uppercase; display: flex; align-items: center; justify-content: center; gap: 5px; cursor: pointer; }
        
        .dropdown-content { display: none; position: fixed; width: 140px; max-height: 250px; background: #121212; border: 1px solid #1c1c1c; border-radius: 12px; z-index: 200; overflow-y: auto; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .dropdown-item { padding: 12px; font-size: 10px; font-weight: 600; text-align: center; border-bottom: 1px solid #1c1c1c; color: #888; cursor: pointer; }
        
        /* Studio Highlights */
        .highlights-section { padding: 15px 0; border-bottom: 1px solid #1c1c1c; background: #000; }
        .circle-icon { width: 62px; height: 62px; border-radius: 50%; background: #111; border: 1.5px solid #1c1c1c; display: flex; align-items: center; justify-content: center; margin: 0 auto 8px auto; overflow: hidden; font-weight: 900; font-size: 10px; color: #555; text-align: center; padding: 5px; line-height: 1; }
        .highlight-item.active .circle-icon { border: 2px solid transparent; background: linear-gradient(#000, #000) padding-box, linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%) border-box; color: #fff; }

        .movie-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; padding-top: 385px; padding-bottom: 100px; }
        .post-card { position: relative; aspect-ratio: 2/3; background: #0a0a0a; overflow: hidden; }
        .post-card img { width: 100%; height: 100%; object-fit: cover; }
        .badge-rating { position: absolute; top: 6px; left: 6px; padding: 2px 5px; border-radius: 2px; font-size: 7px; font-weight: 900; background: rgba(255,255,255,0.9); color: #000; z-index: 5; }

        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: #000; border-top: 1px solid #1c1c1c; display: flex; justify-content: space-around; padding: 15px 0; z-index: 300; padding-bottom: calc(15px + env(safe-area-inset-bottom)); }
        .modal-player { display: none; position: fixed; inset: 0; z-index: 500; background: #000; overflow-y: auto; }
        #backToTop { position: fixed; bottom: 90px; right: 20px; background: #fff; color: #000; width: 40px; height: 40px; border-radius: 50%; display: none; align-items: center; justify-content: center; z-index: 400; cursor: pointer; }
    </style>
</head>
<body>
    <div id="backToTop" onclick="window.scrollTo({top: 0, behavior: 'smooth'})"><i class="fa-solid fa-arrow-up"></i></div>

    <div class="fixed-header-section">
        <header class="ig-header">
            <div class="flex justify-between items-center">
                <div class="flex items-center">
                    <h1 class="ig-logo" onclick="location.reload()">amnesfubbia <span class="text-white opacity-40 font-normal italic">animation</span></h1>
                    <i class="fa-solid fa-circle-check text-[#0095f6] text-[13px] ml-1"></i>
                </div>
                <div class="flex gap-6 text-xl"><i class="fa-regular fa-square-plus" onclick="document.getElementById('searchInp').focus()"></i><i class="fa-regular fa-heart" onclick="showLibrary('likes')"></i></div>
            </div>
            <div class="flex items-center gap-2 mt-2">
                <div class="search-container">
                    <i class="fa-solid fa-magnifying-glass text-zinc-600 text-[10px]"></i>
                    <input type="text" id="searchInp" placeholder="Cari animasi favoritmu..." onkeydown="if(event.key==='Enter') searchAction()">
                </div>
            </div>
        </header>

        <div class="px-4 pb-3">
            <div class="grid grid-cols-4 gap-2 mb-2">
                <button class="pill active" onclick="setFilter('type', 'multi', this)">Semua</button>
                <button class="pill" onclick="setFilter('type', 'movie', this)">Film</button>
                <button class="pill" onclick="setFilter('type', 'tv', this)">Series</button>
                <button class="pill" onclick="setFilter('type', 'short', this)">Short</button>
            </div>
            <div class="grid grid-cols-3 gap-2">
                <div class="filter-dropdown-btn" onclick="toggleDrop('yearDrop')"><span id="yearVal">TAHUN</span> <i class="fa-solid fa-chevron-down text-[7px]"></i></div>
                <div class="filter-dropdown-btn" onclick="toggleDrop('genreDrop')"><span id="genreVal">GENRE</span> <i class="fa-solid fa-chevron-down text-[7px]"></i></div>
                <div class="filter-dropdown-btn" onclick="toggleDrop('countryDrop')"><span id="countryVal">NEGARA</span> <i class="fa-solid fa-chevron-down text-[7px]"></i></div>
            </div>
        </div>

        <div class="highlights-section">
            <div class="flex gap-4 overflow-x-auto no-scrollbar px-4" id="studioHighlights">
                <div class="highlight-item active text-center flex-shrink-0" onclick="setStudio('', this)"><div class="circle-icon">ALL</div><p class="text-[9px] font-bold text-zinc-500 uppercase">STUDIO</p></div>
                <div class="highlight-item text-center flex-shrink-0" onclick="setStudio('2', this)"><div class="circle-icon">DISNEY</div><p class="text-[9px] font-bold text-zinc-500 uppercase">Disney</p></div>
                <div class="highlight-item text-center flex-shrink-0" onclick="setStudio('3', this)"><div class="circle-icon">PIXAR</div><p class="text-[9px] font-bold text-zinc-500 uppercase">Pixar</p></div>
                <div class="highlight-item text-center flex-shrink-0" onclick="setStudio('10342', this)"><div class="circle-icon">GHIBLI</div><p class="text-[9px] font-bold text-zinc-500 uppercase">Ghibli</p></div>
                <div class="highlight-item text-center flex-shrink-0" onclick="setStudio('521', this)"><div class="circle-icon">DREAM</div><p class="text-[9px] font-bold text-zinc-500 uppercase">DreamW</p></div>
                <div class="highlight-item text-center flex-shrink-0" onclick="setStudio('33', this)"><div class="circle-icon">WARNER</div><p class="text-[9px] font-bold text-zinc-500 uppercase">WB</p></div>
                <div class="highlight-item text-center flex-shrink-0" onclick="setStudio('6734', this)"><div class="circle-icon">ILLUM</div><p class="text-[9px] font-bold text-zinc-500 uppercase">Illum</p></div>
            </div>
        </div>
    </div>

    <div id="yearDrop" class="dropdown-content no-scrollbar" style="left:15px"></div>
    <div id="genreDrop" class="dropdown-content no-scrollbar" style="left:50%; transform:translateX(-50%)"></div>
    <div id="countryDrop" class="dropdown-content no-scrollbar" style="right:15px"></div>

    <main id="feedGrid" class="movie-grid"></main>

    <nav class="bottom-nav">
        <div onclick="location.reload()"><i class="fa-solid fa-house text-xl"></i></div>
        <div onclick="document.getElementById('searchInp').focus()"><i class="fa-solid fa-magnifying-glass text-xl text-zinc-500"></i></div>
        <div onclick="showLibrary('bookmarks')"><i class="fa-regular fa-bookmark text-xl text-zinc-500"></i></div>
        <div onclick="alert('Amnesfubbia Animation')"><i class="fa-regular fa-circle-user text-xl text-zinc-500"></i></div>
    </nav>

    <div id="movieModal" class="modal-player">
        <div class="max-w-xl mx-auto pb-40">
            <div class="px-4 h-[54px] flex items-center border-b border-zinc-900 sticky top-0 bg-black z-50">
                <i class="fa-solid fa-chevron-left text-xl cursor-pointer" onclick="closeModal()"></i>
                <div class="flex-grow text-center"><h2 id="mTitle" class="text-xs font-black uppercase truncate px-10"></h2></div>
            </div>
            <div id="mCast" class="flex gap-4 overflow-x-auto no-scrollbar px-4 py-4 border-b border-zinc-900"></div>
            <div class="aspect-video bg-zinc-900"><iframe id="videoPlayer" class="w-full h-full" allowfullscreen></iframe></div>
            <div class="px-4 py-4">
                <div class="flex justify-between mb-4">
                    <div class="flex gap-6">
                        <i id="btnLikeModal" class="text-2xl cursor-pointer"></i>
                        <i class="fa-regular fa-comment text-2xl"></i>
                    </div>
                    <i id="btnBookModal" class="text-2xl cursor-pointer"></i>
                </div>
                <div id="mDesc" class="text-sm text-zinc-300 leading-relaxed mb-4"></div>
                <div id="serverList" class="grid grid-cols-2 gap-2"></div>
                <button id="btnDownloadMain" class="w-full mt-4 p-4 border border-zinc-800 rounded-xl text-[10px] font-bold text-zinc-500 uppercase">Download Sinema</button>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = 'bfa7df5310c9974f62f26c6789a8c00d';
        let page = 1, currentType = 'multi', currentGenre = '', currentYear = '', currentCountry = '', currentStudio = '', searchQuery = '';

        window.onload = () => { initFilters(); loadFeed(); };
        window.onscroll = () => { document.getElementById('backToTop').style.display = window.scrollY > 400 ? 'flex' : 'none'; };

        function initFilters() {
            // Tahun
            let yH = '<div class="dropdown-item" onclick="applyF(\'year\', \'\')">SEMUA</div>';
            for(let y=2026; y>=1950; y--) yH += `<div class="dropdown-item" onclick="applyF(\'year\', ${y})">${y}</div>`;
            document.getElementById('yearDrop').innerHTML = yH;
            // Genre
            const gs = [{id:'12',n:'Petualangan'},{id:'35',n:'Komedi'},{id:'14',n:'Fantasi'},{id:'878',n:'Sci-Fi'},{id:'28',n:'Aksi'}];
            let gH = '<div class="dropdown-item" onclick="applyF(\'genre\', \'\')">SEMUA</div>';
            gs.forEach(g => gH += `<div class="dropdown-item" onclick="applyF(\'genre\', \'${g.id}\', \'${g.n}\')">${g.n}</div>`);
            document.getElementById('genreDrop').innerHTML = gH;
            // Negara
            const cs = [{id:'US',n:'USA'},{id:'JP',n:'Jepang'},{id:'KR',n:'Korea'},{id:'ID',n:'Indonesia'},{id:'FR',n:'Prancis'}];
            let cH = '<div class="dropdown-item" onclick="applyF(\'country\', \'\')">SEMUA</div>';
            cs.forEach(c => cH += `<div class="dropdown-item" onclick="applyF(\'country\', \'${c.id}\', \'${c.n}\')">${c.n}</div>`);
            document.getElementById('countryDrop').innerHTML = cH;
        }

        function toggleDrop(id) {
            const el = document.getElementById(id);
            const isOpen = el.style.display === 'block';
            document.querySelectorAll('.dropdown-content').forEach(d => d.style.display = 'none');
            el.style.display = isOpen ? 'none' : 'block';
        }

        function applyF(type, val, name) {
            if(type==='year') { currentYear = val; document.getElementById('yearVal').innerText = val || 'TAHUN'; }
            if(type==='genre') { currentGenre = val; document.getElementById('genreVal').innerText = name || 'GENRE'; }
            if(type==='country') { currentCountry = val; document.getElementById('countryVal').innerText = name || 'NEGARA'; }
            document.querySelectorAll('.dropdown-content').forEach(d => d.style.display = 'none');
            loadFeed(true);
        }

        async function loadFeed(isNew = true) {
            if (isNew) { page = 1; document.getElementById('feedGrid').innerHTML = ''; }
            let url = `https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&with_genres=16&language=id-ID&page=${page}`;
            if (currentType === 'tv') url = url.replace('/movie', '/tv');
            if (currentYear) url += (currentType==='tv' ? `&first_air_date_year=${currentYear}` : `&primary_release_year=${currentYear}`);
            if (currentGenre) url += `&with_genres=16,${currentGenre}`;
            if (currentCountry) url += `&with_origin_country=${currentCountry}`;
            if (currentStudio) url += `&with_companies=${currentStudio}`;
            if (searchQuery) url = `https://api.themoviedb.org/3/search/multi?api_key=${API_KEY}&query=${searchQuery}&language=id-ID`;

            const res = await fetch(url);
            const data = await res.json();
            const items = (data.results || []).filter(m => m.poster_path && (m.genre_ids ? m.genre_ids.includes(16) : true));
            renderFeed(items.map(m => ({...m, m_type: m.media_type || (currentType==='tv'?'tv':'movie')})));
        }

        function renderFeed(items) {
            const grid = document.getElementById('feedGrid');
            items.forEach(m => {
                const card = document.createElement('div');
                card.className = 'post-card';
                card.onclick = () => openModal(m.id, m.m_type);
                card.innerHTML = `<div class="badge-rating"><i class="fa-solid fa-star mr-1"></i>${(m.vote_average || 0).toFixed(1)}</div><img src="https://image.tmdb.org/t/p/w342${m.poster_path}">`;
                grid.appendChild(card);
            });
        }

        function setStudio(id, el) {
            document.querySelectorAll('.highlight-item').forEach(h => h.classList.remove('active'));
            el.classList.add('active');
            currentStudio = id;
            loadFeed(true);
        }

        function setFilter(type, val, el) {
            document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
            el.classList.add('active');
            currentType = val;
            loadFeed(true);
        }

        // Modal & Logika lainnya diintegrasikan dari kode sebelumnya...
        async function openModal(id, type) {
            document.getElementById('movieModal').style.display = 'block';
            document.body.style.overflow = 'hidden';
            const res = await fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=${API_KEY}&language=id-ID&append_to_response=videos,credits`);
            const d = await res.json();
            document.getElementById('mTitle').innerText = d.title || d.name;
            document.getElementById('mDesc').innerText = d.overview || "No Description.";
            document.getElementById('videoPlayer').src = `https://vidrock.net/embed/${type}/${id}`;
            document.getElementById('serverList').innerHTML = `<button class="server-btn p-4 border border-zinc-800 rounded-lg text-[9px] font-bold" onclick="document.getElementById('videoPlayer').src='https://vidrock.net/embed/${type}/${id}'">SERVER 1</button><button class="server-btn p-4 border border-zinc-800 rounded-lg text-[9px] font-bold" onclick="document.getElementById('videoPlayer').src='https://vidsrc.me/embed/${type}/${id}'">SERVER 2</button>`;
        }
        function closeModal() { document.getElementById('movieModal').style.display = 'none'; document.getElementById('videoPlayer').src = ''; document.body.style.overflow = 'auto'; }
        function searchAction() { searchQuery = document.getElementById('searchInp').value; loadFeed(true); }
    </script>
</body>
</html>
