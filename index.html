<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>amnesfubbia xx1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap');
        
        body { background-color: #000; color: #fff; font-family: 'Inter', sans-serif; margin: 0; overflow-x: hidden; }
        .no-scrollbar::-webkit-scrollbar { display: none; }

        /* HEADER */
        .fixed-header-section { position: fixed; top: 0; width: 100%; z-index: 100; background: #000; border-bottom: 1px solid #1c1c1c; }
        .ig-header { padding: 12px 15px 5px 15px; }
        .search-container { background: #0a0a0a; border-radius: 8px; display: flex; align-items: center; padding: 7px 12px; flex-grow: 1; border: 1px solid #1c1c1c; }
        .search-container input { background: transparent; border: none; color: white; font-size: 13px; width: 100%; outline: none; margin-left: 8px; }
        
        .year-selector { background: #0a0a0a; border: 1px solid #1c1c1c; border-radius: 8px; padding: 8px 12px; font-size: 9px; font-weight: 800; color: #fff; text-transform: uppercase; cursor: pointer; display: flex; align-items: center; gap: 5px; }
        .year-dropdown { display: none; position: fixed; top: 110px; right: 15px; width: 120px; max-height: 300px; background: #121212; border: 1px solid #1c1c1c; border-radius: 12px; z-index: 101; overflow-y: auto; }
        .year-item { padding: 12px; font-size: 11px; font-weight: 600; text-align: center; border-bottom: 1px solid #1c1c1c; color: #888; cursor: pointer; }

        /* CATEGORY PILLS PRESISI */
        .category-wrapper { padding: 5px 15px 12px 15px; }
        .pill-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
        .pill { background: transparent; border: 1px solid #1c1c1c; color: #fff; padding: 8px 0; border-radius: 8px; font-size: 10px; font-weight: 800; text-transform: uppercase; text-align: center; }
        .pill.active { background: #fff; color: #000; border-color: #fff; }

        /* HIGHLIGHTS */
        .highlights-section { padding: 15px 0; border-bottom: 1px solid #1c1c1c; background: #000; }
        .highlights-container { display: flex; gap: 15px; overflow-x: auto; padding: 0 15px; scrollbar-width: none; }
        .highlight-item { flex: 0 0 68px; text-align: center; cursor: pointer; }
        .circle-icon { width: 62px; height: 62px; border-radius: 50%; background: #000; border: 1.5px solid #1c1c1c; display: flex; align-items: center; justify-content: center; margin: 0 auto 8px auto; font-size: 18px; color: #555; }
        .highlight-item.active .circle-icon { border-color: #fff; color: #fff; }
        .highlight-label { font-size: 9px; color: #555; font-weight: 700; text-transform: uppercase; }

        /* GRID */
        .movie-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5px; padding-top: 275px; padding-bottom: 100px; }
        .post-card { position: relative; aspect-ratio: 2/3; background: #0a0a0a; overflow: hidden; }
        .post-card img { width: 100%; height: 100%; object-fit: cover; }
        
        /* BADGES */
        .badge-type { position: absolute; top: 6px; right: 6px; padding: 2px 5px; border-radius: 2px; font-size: 7px; font-weight: 900; text-transform: uppercase; z-index: 5; background: rgba(0,0,0,0.7); color: #fff; border: 0.5px solid rgba(255,255,255,0.2); }
        .badge-rating { position: absolute; top: 6px; left: 6px; padding: 2px 5px; border-radius: 2px; font-size: 7px; font-weight: 900; z-index: 5; background: rgba(255,255,255,0.9); color: #000; }
        .verified-badge { color: #0095f6; font-size: 11px; margin-left: 4px; }

        /* BOTTOM NAV */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: #000; border-top: 1px solid #1c1c1c; display: flex; justify-content: space-around; padding: 12px 0; z-index: 150; padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
        .nav-item { color: #fff; font-size: 20px; cursor: pointer; position: relative; }
        .nav-active { color: #fff; }

        /* MODAL */
        .modal-player { display: none; position: fixed; inset: 0; z-index: 200; background: #000; overflow-y: auto; }
        .btn-like.active { color: #ff2d55; }
        .btn-bookmark.active { color: #fff; }
        
        .skeleton { background: linear-gradient(90deg, #0a0a0a 25%, #1a1a1a 50%, #0a0a0a 75%); background-size: 200% 100%; animation: skeleton-loading 1.5s infinite; }
        @keyframes skeleton-loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    </style>
</head>
<body>

    <div id="loader" style="position:fixed; top:0; left:0; height:1.5px; background:#fff; width:0%; transition:width 0.3s; z-index:1000;"></div>

    <div class="fixed-header-section">
        <header class="ig-header">
            <div class="flex justify-between items-center">
                <div class="flex items-center">
                    <h1 class="text-xl font-bold italic lowercase tracking-tight" onclick="location.reload()">amnesfubbia <span class="text-white opacity-50 font-normal">xx1</span></h1>
                    <i class="fa-solid fa-circle-check verified-badge"></i>
                </div>
                <div class="flex gap-6 text-lg">
                    <i class="fa-regular fa-square-plus cursor-pointer" onclick="alert('Fitur Upload Segera Hadir')"></i>
                    <i class="fa-regular fa-heart cursor-pointer" onclick="showLibrary('likes')"></i>
                </div>
            </div>
            <div class="search-area flex items-center gap-2 mt-2">
                <div class="search-container">
                    <i class="fa-solid fa-magnifying-glass text-zinc-600 text-[10px]"></i>
                    <input type="text" id="searchInp" placeholder="Cari sinema Indonesia..." onkeydown="if(event.key==='Enter') searchAction()">
                </div>
                <div class="year-selector" onclick="toggleYearDropdown()">
                    <span id="yearVal">TAHUN</span> <i class="fa-solid fa-chevron-down text-[7px]"></i>
                </div>
            </div>
        </header>

        <div class="category-wrapper">
            <div class="pill-grid">
                <button class="pill active" onclick="setFilter('type', 'multi', this)">Semua</button>
                <button class="pill" onclick="setFilter('type', 'movie', this)">Film</button>
                <button class="pill" onclick="setFilter('type', 'tv', this)">Series</button>
                <button class="pill" onclick="setFilter('type', 'short', this)">Short</button>
            </div>
        </div>

        <div class="highlights-section">
            <div class="highlights-container no-scrollbar" id="genreHighlights">
                <div class="highlight-item active" onclick="setFilter('genre', '', this)"><div class="circle-icon"><i class="fa-solid fa-border-all"></i></div><p class="highlight-label">Semua</p></div>
                <div class="highlight-item" onclick="setFilter('genre', '27', this)"><div class="circle-icon"><i class="fa-solid fa-ghost"></i></div><p class="highlight-label">Horor</p></div>
                <div class="highlight-item" onclick="setFilter('genre', '35', this)"><div class="circle-icon"><i class="fa-solid fa-masks-theater"></i></div><p class="highlight-label">Komedi</p></div>
                <div class="highlight-item" onclick="setFilter('genre', '10749', this)"><div class="circle-icon"><i class="fa-solid fa-heart"></i></div><p class="highlight-label">Romantis</p></div>
                <div class="highlight-item" onclick="setFilter('genre', '28', this)"><div class="circle-icon"><i class="fa-solid fa-bolt"></i></div><p class="highlight-label">Aksi</p></div>
                <div class="highlight-item" onclick="setFilter('genre', '18', this)"><div class="circle-icon"><i class="fa-solid fa-clapperboard"></i></div><p class="highlight-label">Drama</p></div>
            </div>
        </div>
    </div>

    <div id="yearDropdown" class="year-dropdown no-scrollbar"></div>
    <main id="feedGrid" class="movie-grid"></main>

    <nav class="bottom-nav">
        <div class="nav-item" onclick="location.reload()"><i class="fa-solid fa-house"></i></div>
        <div class="nav-item" onclick="document.getElementById('searchInp').focus()"><i class="fa-solid fa-magnifying-glass"></i></div>
        <div class="nav-item" onclick="showLibrary('bookmarks')"><i class="fa-regular fa-bookmark" id="navBookmark"></i></div>
        <div class="nav-item" onclick="alert('Profil Kamu')"><i class="fa-regular fa-user"></i></div>
    </nav>

    <div id="movieModal" class="modal-player">
        <div class="max-w-xl mx-auto pb-20">
            <div class="p-4 flex items-center justify-between border-b border-zinc-900 sticky top-0 bg-black z-50">
                <i class="fa-solid fa-xmark text-lg cursor-pointer" onclick="closeModal()"></i>
                <h2 id="mTitle" class="text-[10px] font-bold truncate uppercase tracking-widest text-center px-4"></h2>
                <div class="flex gap-4">
                    <i id="btnLikeModal" class="fa-regular fa-heart btn-like cursor-pointer text-lg"></i>
                    <i id="btnBookModal" class="fa-regular fa-bookmark btn-bookmark cursor-pointer text-lg"></i>
                </div>
            </div>
            <div class="aspect-video bg-zinc-900 w-full relative">
                <iframe id="videoPlayer" class="w-full h-full" allowfullscreen></iframe>
            </div>
            <div class="p-6">
                <p id="mMeta" class="text-[9px] text-zinc-500 font-black mb-4 uppercase"></p>
                <p id="mDesc" class="text-xs text-zinc-400 leading-relaxed mb-6"></p>
                <div id="serverList" class="grid grid-cols-2 gap-2 mt-4"></div>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = 'bfa7df5310c9974f62f26c6789a8c00d';
        let page = 1, loading = false, currentType = 'multi', currentGenre = '', currentYear = '', searchQuery = '';
        let currentMovieData = null;

        // SISTEM STORAGE
        const getStore = (key) => JSON.parse(localStorage.getItem(key) || '[]');
        const saveStore = (key, data) => localStorage.setItem(key, JSON.stringify(data));

        window.onload = () => { initYearDropdown(); loadFeed(); };
        window.onscroll = () => { if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 900 && !loading) { page++; loadFeed(false); } };

        function initYearDropdown() {
            const dropdown = document.getElementById('yearDropdown');
            let html = '<div class="year-item" onclick="setYear(\'\')">SEMUA</div>';
            for(let y = 2026; y >= 1930; y--) html += `<div class="year-item" onclick="setYear(${y})">${y}</div>`;
            dropdown.innerHTML = html;
        }

        function toggleYearDropdown() {
            const d = document.getElementById('yearDropdown');
            d.style.display = (d.style.display === 'block') ? 'none' : 'block';
        }

        function setYear(y) {
            currentYear = y; document.getElementById('yearVal').innerText = y || 'TAHUN';
            document.getElementById('yearDropdown').style.display = 'none'; loadFeed(true);
        }

        async function loadFeed(isNew = true) {
            if (loading) return;
            loading = true;
            if (isNew) { page = 1; document.getElementById('feedGrid').innerHTML = Array(12).fill('<div class="post-card skeleton"></div>').join(''); }
            
            try {
                let url = searchQuery ? 
                    `https://api.themoviedb.org/3/search/multi?api_key=${API_KEY}&query=${encodeURIComponent(searchQuery)}&language=id-ID&page=${page}` :
                    `https://api.themoviedb.org/3/discover/${currentType === 'tv' ? 'tv' : 'movie'}?api_key=${API_KEY}&with_origin_country=ID&language=id-ID&page=${page}${currentGenre ? '&with_genres='+currentGenre : ''}${currentYear ? '&primary_release_year='+currentYear : ''}`;

                if (currentType === 'multi' && !searchQuery) {
                    const [resM, resT] = await Promise.all([
                        fetch(`https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&with_origin_country=ID&language=id-ID&page=${page}${currentGenre ? '&with_genres='+currentGenre : ''}${currentYear ? '&primary_release_year='+currentYear : ''}`),
                        fetch(`https://api.themoviedb.org/3/discover/tv?api_key=${API_KEY}&with_origin_country=ID&language=id-ID&page=${page}${currentGenre ? '&with_genres='+currentGenre : ''}${currentYear ? '&first_air_date_year='+currentYear : ''}`)
                    ]);
                    const dM = await resM.json(); const dT = await resT.json();
                    let items = [...(dM.results||[]).map(x=>({...x, m_type:'movie'})), ...(dT.results||[]).map(x=>({...x, m_type:'tv'}))];
                    if(isNew) document.getElementById('feedGrid').innerHTML = '';
                    renderFeed(items);
                } else {
                    const res = await fetch(url);
                    const data = await res.json();
                    if(isNew) document.getElementById('feedGrid').innerHTML = '';
                    renderFeed((data.results||[]).map(x => ({...x, m_type: x.media_type || (currentType === 'tv' ? 'tv' : 'movie')})));
                }
            } catch (err) { console.error(err); }
            loading = false;
        }

        function renderFeed(data) {
            const grid = document.getElementById('feedGrid');
            data.forEach(m => {
                if (!m.poster_path) return;
                const card = document.createElement('div');
                card.className = 'post-card';
                card.onclick = () => openModal(m.id, m.m_type);
                card.innerHTML = `
                    <div class="badge-rating"><i class="fa-solid fa-star text-[6px]"></i> ${m.vote_average?.toFixed(1) || '0.0'}</div>
                    <div class="badge-type">${m.m_type === 'tv' ? 'Series' : 'Film'}</div>
                    <img src="https://image.tmdb.org/t/p/w342${m.poster_path}" loading="lazy">
                `;
                grid.appendChild(card);
            });
        }

        async function openModal(id, type) {
            const modal = document.getElementById('movieModal');
            modal.style.display = 'block';
            document.body.style.overflow = 'hidden';
            
            try {
                const res = await fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=${API_KEY}&language=id-ID`);
                const d = await res.json();
                currentMovieData = {...d, m_type: type};

                document.getElementById('mTitle').innerText = d.title || d.name;
                document.getElementById('mMeta').innerText = `${(d.release_date||d.first_air_date||'').split('-')[0]} // ${type.toUpperCase()}`;
                document.getElementById('mDesc').innerText = d.overview || "Sinopsis tidak tersedia.";
                document.getElementById('videoPlayer').src = `https://vidrock.net/embed/${type}/${id}`;
                
                // Update Tombol Like & Bookmark
                updateModalButtons(id);

                document.getElementById('btnLikeModal').onclick = () => toggleItem('likes', currentMovieData);
                document.getElementById('btnBookModal').onclick = () => toggleItem('bookmarks', currentMovieData);

                document.getElementById('serverList').innerHTML = `<button class="server-btn bg-zinc-900 p-3 rounded-lg text-xs" onclick="document.getElementById('videoPlayer').src='https://vidrock.net/embed/${type}/${id}'">Server 1</button>
                <button class="server-btn bg-zinc-900 p-3 rounded-lg text-xs" onclick="document.getElementById('videoPlayer').src='https://vidstorm.ru/embed/${type}/${id}'">Server 2</button>`;
            } catch(e) { console.error(e); }
        }

        function updateModalButtons(id) {
            const likes = getStore('likes');
            const books = getStore('bookmarks');
            const isLiked = likes.some(x => x.id == id);
            const isBooked = books.some(x => x.id == id);

            const lBtn = document.getElementById('btnLikeModal');
            const bBtn = document.getElementById('btnBookModal');

            lBtn.className = isLiked ? 'fa-solid fa-heart btn-like active cursor-pointer text-lg' : 'fa-regular fa-heart btn-like cursor-pointer text-lg';
            bBtn.className = isBooked ? 'fa-solid fa-bookmark btn-bookmark active cursor-pointer text-lg' : 'fa-regular fa-bookmark btn-bookmark cursor-pointer text-lg';
        }

        function toggleItem(key, movie) {
            let items = getStore(key);
            const index = items.findIndex(x => x.id == movie.id);
            if (index > -1) {
                items.splice(index, 1);
            } else {
                items.push({id: movie.id, poster_path: movie.poster_path, m_type: movie.m_type, vote_average: movie.vote_average});
            }
            saveStore(key, items);
            updateModalButtons(movie.id);
        }

        function showLibrary(key) {
            const items = getStore(key);
            const grid = document.getElementById('feedGrid');
            grid.innerHTML = '';
            document.querySelector('.fixed-header-section').scrollIntoView();
            if (items.length === 0) {
                grid.innerHTML = `<div class="col-span-3 text-center py-20 text-zinc-500 text-xs">Belum ada film di daftar ini.</div>`;
            } else {
                renderFeed(items);
            }
        }

        function closeModal() { document.getElementById('movieModal').style.display = 'none'; document.getElementById('videoPlayer').src = ''; document.body.style.overflow = 'auto'; }
        function searchAction() { searchQuery = document.getElementById('searchInp').value; loadFeed(true); }
        function setFilter(t, v, el) { 
            document.querySelectorAll('.pill, .highlight-item').forEach(p => p.classList.remove('active'));
            el.classList.add('active');
            if(t === 'type') currentType = v; else currentGenre = v;
            searchQuery = ''; loadFeed(true);
        }
    </script>
</body>
</html>
