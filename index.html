<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>amnesfubbia xx1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@1,700&family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { background-color: #000; color: #fff; font-family: 'Inter', sans-serif; margin: 0; overflow-x: hidden; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .fixed-header-section { position: fixed; top: 0; width: 100%; z-index: 100; background: #000; border-bottom: 1px solid #1c1c1c; }
        .ig-header { padding: 12px 15px 5px 15px; }
        .ig-logo { font-family: 'DM Sans', sans-serif; font-weight: 700; font-style: italic; font-size: 24px; letter-spacing: -0.8px; text-transform: lowercase; cursor: pointer; }
        .verified-icon { font-size: 13px; color: #0095f6; margin-left: 5px; }
        .search-container { background: #0a0a0a; border-radius: 8px; display: flex; align-items: center; padding: 7px 12px; flex-grow: 1; border: 1px solid #1c1c1c; }
        .search-container input { background: transparent !important; border: none !important; color: white !important; font-size: 13px; width: 100%; outline: none !important; margin-left: 8px; }
        .year-selector { background: #0a0a0a; border: 1px solid #1c1c1c; border-radius: 8px; padding: 8px 12px; font-size: 9px; font-weight: 800; color: #fff; text-transform: uppercase; cursor: pointer; display: flex; align-items: center; gap: 5px; }
        .year-dropdown { display: none; position: fixed; top: 110px; right: 15px; width: 120px; max-height: 300px; background: #121212; border: 1px solid #1c1c1c; border-radius: 12px; z-index: 101; overflow-y: auto; }
        .year-item { padding: 12px; font-size: 11px; font-weight: 600; text-align: center; border-bottom: 1px solid #1c1c1c; color: #888; cursor: pointer; }
        .category-wrapper { padding: 5px 15px 12px 15px; }
        .pill-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
        .pill { background: transparent; border: 1px solid #1c1c1c; color: #fff; padding: 8px 0; border-radius: 8px; font-size: 10px; font-weight: 800; text-transform: uppercase; text-align: center; cursor: pointer; }
        .pill.active { border-color: #fff; }
        
        /* HIGHLIGHT STUDIO HITAM PUTIH ASLI */
        .highlights-section { padding: 15px 0; border-bottom: 1px solid #1c1c1c; background: #000; }
        .highlights-container { display: flex; gap: 15px; overflow-x: auto; padding: 0 15px; scrollbar-width: none; }
        .highlight-item { flex: 0 0 75px; text-align: center; cursor: pointer; }
        .circle-icon { width: 62px; height: 62px; border-radius: 50%; background: #000; border: 1.5px solid #1c1c1c; display: flex; align-items: center; justify-content: center; margin: 0 auto 8px auto; overflow: hidden; }
        .circle-icon img { width: 75%; filter: grayscale(100%); opacity: 0.6; }
        .highlight-item.active .circle-icon { border: 2px solid transparent; background: linear-gradient(#000, #000) padding-box, linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%) border-box; }
        .highlight-item.active .circle-icon img { filter: grayscale(0%); opacity: 1; }
        .highlight-label { font-size: 9px; color: #555; font-weight: 700; text-transform: uppercase; white-space: nowrap; }
        
        .movie-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; padding-top: 275px; padding-bottom: 100px; }
        .post-card { position: relative; aspect-ratio: 2/3; background: #0a0a0a; overflow: hidden; }
        .post-card img { width: 100%; height: 100%; object-fit: cover; }
        .badge-type { position: absolute; top: 8px; right: 8px; font-size: 13px; color: #fff; z-index: 5; }
        .badge-rating { position: absolute; top: 6px; left: 6px; padding: 2px 5px; border-radius: 2px; font-size: 7px; font-weight: 900; z-index: 5; background: rgba(255,255,255,0.9); color: #000; }
        
        .modal-player { display: none; position: fixed; inset: 0; z-index: 200; background: #000; overflow-y: auto; }
        .interaction-icon { font-size: 24px; cursor: pointer; color: #fff; }
        .like-count { font-size: 14px; font-weight: 700; color: #fff; margin-top: 2px; }
        .server-btn { width: 100%; padding: 14px; border-radius: 12px; font-size: 10px; font-weight: 800; text-transform: uppercase; border: 1px solid #1c1c1c; text-align: center; cursor: pointer; }
        
        .story-border { padding: 2.5px; background: #1c1c1c; border-radius: 50%; display: inline-block; }
        .story-inner { background: #000; padding: 2px; border-radius: 50%; }
        .story-img { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; display: block; }

        .series-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 10px; }
        .ep-box { background: #111; border: 1px solid #1c1c1c; color: #555; font-size: 10px; font-weight: 800; padding: 12px 0; border-radius: 8px; text-align: center; cursor: pointer; }
        .ep-box.active { border-color: #fff; color: #fff; background: #1a1a1a; }
        .dl-link-btn { display: block; width: 100%; margin-top: 15px; padding: 14px; border-radius: 12px; background: #000; color: #a1a1aa; font-size: 10px; font-weight: 800; text-transform: uppercase; text-align: center; border: 1px solid #1c1c1c; }
        
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: #000; border-top: 1px solid #1c1c1c; display: flex; justify-content: space-around; padding: 12px 0; z-index: 300; }
        .nav-item { color: #fff; font-size: 20px; cursor: pointer; }
        #backToTop { position: fixed; bottom: 85px; right: 20px; background: #fff; color: #000; width: 40px; height: 40px; border-radius: 50%; display: none; align-items: center; justify-content: center; z-index: 140; }
    </style>
</head>
<body>
    <div id="loader" style="position:fixed; top:0; left:0; height:1.5px; background:#fff; width:0%; transition:width 0.3s; z-index:1000;"></div>
    <div id="backToTop" onclick="window.scrollTo({top: 0, behavior: 'smooth'})"><i class="fa-solid fa-arrow-up text-sm"></i></div>

    <div class="fixed-header-section">
        <header class="ig-header">
            <div class="flex justify-between items-center">
                <div class="flex items-center">
                    <h1 class="ig-logo" onclick="location.reload()">amnesfubbia <span class="text-white opacity-40 font-normal italic">xx1</span></h1>
                    <i class="fa-solid fa-circle-check verified-icon"></i>
                </div>
                <div class="flex gap-6 text-xl"><i class="fa-regular fa-square-plus" onclick="document.getElementById('searchInp').focus()"></i><i class="fa-regular fa-heart" onclick="showLibrary('likes')"></i></div>
            </div>
            <div class="search-area flex items-center gap-2 mt-2">
                <div class="search-container">
                    <i class="fa-solid fa-magnifying-glass text-zinc-600 text-[10px]"></i>
                    <input type="text" id="searchInp" placeholder="Cari animasi global..." onkeydown="if(event.key==='Enter') searchAction()" autocomplete="off">
                </div>
                <div class="year-selector" onclick="toggleYearDropdown()"><span id="yearVal">TAHUN</span> <i class="fa-solid fa-chevron-down text-[7px]"></i></div>
            </div>
        </header>
        <div class="category-wrapper">
            <div class="pill-grid">
                <button class="pill active" onclick="setFilter('type', 'multi', this)">Semua</button>
                <button class="pill" onclick="setFilter('type', 'movie', this)">Film</button>
                <button class="pill" onclick="setFilter('type', 'tv', this)">Series</button>
                <button class="pill" onclick="setFilter('type', 'short', this)">Short</button>
            </div>
        </div>
        <div class="highlights-section">
            <div class="highlights-container no-scrollbar" id="studioHighlights">
                <div class="highlight-item active" onclick="setFilter('studio', '', this)"><div class="circle-icon"><i class="fa-solid fa-border-all text-xl text-zinc-600"></i></div><p class="highlight-label">Semua</p></div>
                <div class="highlight-item" onclick="setFilter('studio', '6125', this)"><div class="circle-icon"><img src="https://upload.wikimedia.org/wikipedia/commons/3/3a/Walt_Disney_Pictures_logo.svg"></div><p class="highlight-label">Disney</p></div>
                <div class="highlight-item" onclick="setFilter('studio', '3', this)"><div class="circle-icon"><img src="https://upload.wikimedia.org/wikipedia/commons/0/0b/Pixar_Logo.svg"></div><p class="highlight-label">Pixar</p></div>
                <div class="highlight-item" onclick="setFilter('studio', '521', this)"><div class="circle-icon"><img src="https://upload.wikimedia.org/wikipedia/en/2/22/DreamWorks_Animation_logo.svg"></div><p class="highlight-label">Dreamworks</p></div>
                <div class="highlight-item" onclick="setFilter('studio', '10342', this)"><div class="circle-icon"><img src="https://upload.wikimedia.org/wikipedia/commons/e/ed/Studio_Ghibli_logo.svg"></div><p class="highlight-label">Ghibli</p></div>
                <div class="highlight-item" onclick="setFilter('studio', '2251', this)"><div class="circle-icon"><img src="https://upload.wikimedia.org/wikipedia/commons/5/55/Sony_Pictures_Animation_logo.svg"></div><p class="highlight-label">Sony</p></div>
                <div class="highlight-item" onclick="setFilter('studio', '33', this)"><div class="circle-icon"><img src="https://upload.wikimedia.org/wikipedia/commons/3/31/Illumination_Entertainment_logo.svg"></div><p class="highlight-label">Illumin</p></div>
            </div>
        </div>
    </div>

    <div id="yearDropdown" class="year-dropdown no-scrollbar"></div>
    <main id="feedGrid" class="movie-grid"></main>

    <div id="movieModal" class="modal-player">
        <div class="max-w-xl mx-auto pb-40">
            <div class="px-4 h-[54px] flex items-center border-b border-zinc-900 sticky top-0 bg-black z-50">
                <i class="fa-solid fa-chevron-left text-xl cursor-pointer" onclick="closeModal()"></i>
                <div class="flex-grow flex flex-col items-center justify-center px-8">
                    <span class="text-[11px] font-bold text-zinc-500 uppercase tracking-widest leading-none mb-1">Sinema</span>
                    <h2 id="mTitle" class="truncate w-full text-center leading-none font-bold text-sm"></h2>
                </div>
            </div>
            
            <div class="py-4 bg-black">
                <div id="mCast" class="flex gap-4 overflow-x-auto no-scrollbar px-4"></div>
            </div>

            <div class="aspect-video bg-zinc-900 w-full relative">
                <iframe id="videoPlayer" class="w-full h-full" allow="autoplay; fullscreen" allowfullscreen></iframe>
            </div>

            <div class="px-4 py-3 flex justify-between items-center">
                <div class="flex gap-4">
                    <i id="btnLikeModal" class="interaction-icon"></i>
                    <i id="btnTrailerModal" class="fa-regular fa-circle-play interaction-icon"></i>
                    <i class="fa-regular fa-paper-plane interaction-icon"></i>
                </div>
                <i id="btnBookModal" class="interaction-icon"></i>
            </div>

            <div class="px-4 mb-2"><p id="mLikeCount" class="like-count"></p></div>

            <div class="px-4">
                <p class="mb-1">
                    <span id="mTitleAlt" class="font-bold mr-2"></span>
                    <span id="mDesc" class="text-sm"></span>
                    <span id="readMoreBtn" class="text-zinc-500 text-sm hidden" onclick="expandDesc()">selengkapnya</span>
                </p>
                <div id="translateBtn" class="text-zinc-500 text-xs hidden mt-1" onclick="toggleTranslation()">Lihat Terjemahan</div>
                <p id="mMeta" class="text-[11px] text-zinc-500 mt-2"></p>
                <p id="mTime" class="text-[10px] text-zinc-600 uppercase mt-1"></p>
            </div>
            
            <div class="px-4 pt-4">
                <div id="seriesControl" class="hidden mb-6 p-4 bg-zinc-950 rounded-2xl border border-zinc-900">
                    <select id="seasonSel" class="bg-zinc-900 text-white text-[10px] font-bold px-3 py-2 rounded-lg w-full mb-4 border border-zinc-800" onchange="loadEpisodes()"></select>
                    <div id="episodeGrid" class="series-grid"></div>
                    <a id="dlSeriesBtn" href="#" target="_blank" class="dl-link-btn hidden">Download Episode <span id="dlEpNum"></span></a>
                </div>

                <div id="serverList" class="grid grid-cols-2 gap-2 mt-4"></div>
                <button id="btnDownloadMain" class="server-btn border-zinc-800 text-zinc-400 mt-4"><i class="fa-solid fa-download mr-2"></i> Download Sinema</button>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <div class="nav-item" onclick="closeModal(); location.reload();"><i class="fa-solid fa-house"></i></div>
        <div class="nav-item" onclick="closeModal(); document.getElementById('searchInp').focus();"><i class="fa-solid fa-magnifying-glass"></i></div>
        <div class="nav-item" onclick="closeModal(); showLibrary('bookmarks');"><i class="fa-regular fa-bookmark"></i></div>
        <div class="nav-item" onclick="alert('Amnesfubbia XX1')"><i class="fa-regular fa-user"></i></div>
    </nav>

    <script>
        const API_KEY = 'bfa7df5310c9974f62f26c6789a8c00d';
        let page = 1, loading = false, currentType = 'multi', currentStudio = '', currentYear = '', searchQuery = '', actorId = '', isLib = false, descIndo = '', descFull = '';
        
        const getStore = (k) => JSON.parse(localStorage.getItem(k) || '[]');
        const saveStore = (k, v) => localStorage.setItem(k, JSON.stringify(v));

        window.onload = () => { initYear(); loadFeed(); };
        window.onscroll = () => { 
            const btt = document.getElementById('backToTop');
            if (window.scrollY > 500) btt.style.display = 'flex'; else btt.style.display = 'none';
            if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 900 && !loading && !isLib) { page++; loadFeed(false); } 
        };

        function initYear() {
            const dropdown = document.getElementById('yearDropdown');
            let html = '<div class="year-item" onclick="setYear(\'\')">SEMUA</div>';
            for(let y = 2026; y >= 1970; y--) html += `<div class="year-item" onclick="setYear(${y})">${y}</div>`;
            dropdown.innerHTML = html;
        }

        function toggleYearDropdown() { const d = document.getElementById('yearDropdown'); d.style.display = (d.style.display === 'block') ? 'none' : 'block'; }
        function setYear(y) { isLib = false; currentYear = y; document.getElementById('yearVal').innerText = y || 'TAHUN'; toggleYearDropdown(); loadFeed(true); }

        function calculateTimeAgo(dateStr) {
            if(!dateStr) return "Baru saja";
            const diffDays = Math.floor((new Date() - new Date(dateStr)) / 86400000);
            if(diffDays <= 0) return "Hari ini";
            if(diffDays < 7) return `${diffDays} hari lalu`;
            if(diffDays < 30) return `${Math.floor(diffDays/7)} minggu lalu`;
            return `${Math.floor(diffDays/30)} bulan lalu`;
        }

        async function loadFeed(isNew = true) {
            if (loading) return; loading = true; isLib = false;
            if (isNew) { page = 1; document.getElementById('feedGrid').innerHTML = ''; }
            document.getElementById('loader').style.width = '30%';
            
            try {
                let url = `https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&with_genres=16&page=${page}`;
                if (currentType === 'tv') url = `https://api.themoviedb.org/3/discover/tv?api_key=${API_KEY}&with_genres=16&page=${page}`;
                if (currentType === 'short') url = `https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&with_genres=16&with_runtime.lte=40&page=${page}`;
                if (actorId) url = `https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&with_cast=${actorId}&page=${page}`;
                if (searchQuery) url = `https://api.themoviedb.org/3/search/multi?api_key=${API_KEY}&query=${encodeURIComponent(searchQuery)}&page=${page}`;
                
                if (currentStudio) url += `&with_companies=${currentStudio}`;
                if (currentYear) url += (currentType === 'tv' ? `&first_air_date_year=${currentYear}` : `&primary_release_year=${currentYear}`);

                const res = await fetch(url + "&language=id-ID");
                const data = await res.json();
                renderFeed(data.results || []);
            } catch (e) { console.error(e); }
            loading = false; document.getElementById('loader').style.width = '100%'; setTimeout(()=>document.getElementById('loader').style.width='0%', 400);
        }

        function renderFeed(items) {
            const grid = document.getElementById('feedGrid');
            items.forEach(m => {
                if (!m.poster_path) return;
                const card = document.createElement('div');
                card.className = 'post-card';
                const fType = m.media_type || (currentType === 'tv' ? 'tv' : 'movie');
                card.onclick = () => openModal(m.id, fType);
                card.innerHTML = `<div class="badge-rating"><i class="fa-solid fa-star text-[6px]"></i> ${m.vote_average?.toFixed(1) || '0.0'}</div><img src="https://image.tmdb.org/t/p/w342${m.poster_path}">`;
                grid.appendChild(card);
            });
        }

        async function openModal(id, type) {
            document.getElementById('movieModal').style.display = 'block';
            window.activeId = id; window.activeType = type;
            
            const [resId, resEn] = await Promise.all([
                fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=${API_KEY}&language=id-ID&append_to_response=videos,credits`),
                fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=${API_KEY}&language=en-US&append_to_response=videos`)
            ]);
            const d = await resId.json(); const dEn = await resEn.json();
            
            document.getElementById('mTitle').innerText = d.title || d.name;
            document.getElementById('mTitleAlt').innerText = (d.title || d.name).toLowerCase().replace(/\s/g, '');
            descIndo = d.overview; descFull = dEn.overview || "No description.";
            
            const text = descIndo || descFull;
            document.getElementById('mDesc').innerText = text.length > 100 ? text.substring(0, 100) + "..." : text;
            document.getElementById('readMoreBtn').classList.toggle('hidden', text.length <= 100);
            document.getElementById('translateBtn').classList.toggle('hidden', descIndo !== "");

            document.getElementById('mLikeCount').innerText = `${Math.floor((d.vote_average||0)*1200).toLocaleString()} suka`;
            document.getElementById('mMeta').innerText = `${(d.release_date||d.first_air_date||'').split('-')[0]} // ${type.toUpperCase()}`;
            document.getElementById('mTime').innerText = calculateTimeAgo(d.release_date || d.first_air_date);
            document.getElementById('videoPlayer').src = `https://vidrock.net/embed/${type}/${id}`;

            const tr = [...(d.videos.results||[]), ...(dEn.videos.results||[])].find(v => v.type === 'Trailer');
            document.getElementById('btnTrailerModal').onclick = () => { if(tr) document.getElementById('videoPlayer').src = `https://www.youtube.com/embed/${tr.key}?autoplay=1`; };

            document.getElementById('mCast').innerHTML = (d.credits?.cast || []).slice(0, 10).map(c => `
                <div class="flex-shrink-0 text-center" onclick="filterByActor('${c.id}')">
                    <div class="story-border"><div class="story-inner"><img src="${c.profile_path ? 'https://image.tmdb.org/t/p/w185'+c.profile_path : 'https://via.placeholder.com/100'}" class="story-img"></div></div>
                    <p class="text-[9px] text-zinc-500 mt-1 truncate w-[60px]">${c.name.split(' ')[0]}</p>
                </div>`).join('');

            if(type === 'tv') {
                document.getElementById('seriesControl').classList.remove('hidden');
                document.getElementById('seasonSel').innerHTML = (d.seasons || []).map(s=>`<option value="${s.season_number}">Season ${s.season_number}</option>`).join('');
                loadEpisodes();
            } else {
                document.getElementById('seriesControl').classList.add('hidden');
                document.getElementById('serverList').innerHTML = `<button class="server-btn" onclick="changeS(1)">Server 1</button><button class="server-btn" onclick="changeS(2)">Server 2</button>`;
            }
            updateModalButtons(id);
            document.getElementById('btnDownloadMain').onclick = () => window.open(`https://dl.vidsrc.vip/${type}/${id}`);
        }

        async function loadEpisodes() {
            const s = document.getElementById('seasonSel').value;
            const res = await fetch(`https://api.themoviedb.org/3/tv/${window.activeId}/season/${s}?api_key=${API_KEY}`);
            const d = await res.json();
            document.getElementById('episodeGrid').innerHTML = (d.episodes||[]).map(e => `<div class="ep-box" id="ep-${e.episode_number}" onclick="playEp(${s}, ${e.episode_number})">${e.episode_number}</div>`).join('');
        }

        function playEp(s, e) {
            document.getElementById('videoPlayer').src = `https://vidrock.net/embed/tv/${window.activeId}/${s}/${e}`;
            document.querySelectorAll('.ep-box').forEach(b => b.classList.remove('active'));
            document.getElementById(`ep-${e}`).classList.add('active');
        }

        function changeS(n) { document.getElementById('videoPlayer').src = `https://${n==1?'vidrock.net':'vidstorm.ru'}/embed/movie/${window.activeId}`; }
        function expandDesc() { document.getElementById('mDesc').innerText = descIndo || descFull; document.getElementById('readMoreBtn').classList.add('hidden'); }
        function toggleTranslation() { document.getElementById('mDesc').innerText = "[Translation] " + descFull; }
        function closeModal() { document.getElementById('movieModal').style.display = 'none'; document.getElementById('videoPlayer').src = ''; }
        function filterByActor(id) { actorId = id; closeModal(); loadFeed(true); }
        function searchAction() { searchQuery = document.getElementById('searchInp').value; loadFeed(true); }
        function setFilter(t, v, el) { 
            document.querySelectorAll('.pill, .highlight-item').forEach(p => p.classList.remove('active'));
            el.classList.add('active'); actorId = '';
            if(t === 'type') currentType = v; else currentStudio = v;
            loadFeed(true);
        }
        function updateModalButtons(id) {
            const l = getStore('likes'), b = getStore('bookmarks');
            document.getElementById('btnLikeModal').className = l.some(x=>x.id==id) ? 'fa-solid fa-heart text-red-500 interaction-icon' : 'fa-regular fa-heart interaction-icon';
            document.getElementById('btnBookModal').className = b.some(x=>x.id==id) ? 'fa-solid fa-bookmark text-white interaction-icon' : 'fa-regular fa-bookmark interaction-icon';
            document.getElementById('btnLikeModal').onclick = () => toggleItem('likes', {id, poster_path:''});
            document.getElementById('btnBookModal').onclick = () => toggleItem('bookmarks', {id, poster_path:''});
        }
        function toggleItem(k, m) {
            let d = getStore(k); const i = d.findIndex(x=>x.id==m.id);
            if(i>-1) d.splice(i,1); else d.push(m);
            saveStore(k, d); updateModalButtons(m.id);
        }
        function showLibrary(k) { isLib = true; document.getElementById('feedGrid').innerHTML = ''; renderFeed(getStore(k)); }
    </script>
</body>
</html>
