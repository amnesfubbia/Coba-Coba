<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>amnesfubbia xx1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@1,700&family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { background-color: #000; color: #fff; font-family: 'Inter', sans-serif; margin: 0; overflow-x: hidden; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        /* HEADER & PROFILE SECTION */
        .profile-header { padding: 15px 15px 0 15px; border-bottom: 1px solid #1c1c1c; background: #000; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .ig-logo { font-family: 'DM Sans', sans-serif; font-weight: 700; font-style: italic; font-size: 20px; }
        
        .profile-info { display: flex; align-items: center; gap: 25px; margin-bottom: 15px; }
        .profile-pic { width: 80px; height: 80px; border-radius: 50%; border: 1px solid #333; padding: 3px; }
        .profile-pic img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; filter: grayscale(1); }
        
        .stats { display: flex; gap: 20px; flex-grow: 1; justify-content: space-around; text-align: center; }
        .stat-val { font-weight: 700; font-size: 16px; display: block; }
        .stat-label { font-size: 12px; color: #a8a8a8; }
        
        .bio { font-size: 13px; line-height: 1.4; margin-bottom: 20px; }
        .bio-name { font-weight: 700; display: block; }
        .bio-link { color: #e0f1ff; text-decoration: none; }

        /* HIGHLIGHTS */
        .highlights-container { display: flex; gap: 15px; overflow-x: auto; padding-bottom: 15px; }
        .highlight-item { flex: 0 0 65px; text-align: center; }
        .highlight-circle { width: 60px; height: 60px; border-radius: 50%; border: 1px solid #333; margin-bottom: 5px; display: flex; align-items: center; justify-content: center; background: #0a0a0a; }
        .highlight-circle img { width: 35px; height: 35px; filter: grayscale(1) invert(1); opacity: 0.7; }
        .highlight-text { font-size: 10px; white-space: nowrap; }

        /* ACTION BUTTONS */
        .action-buttons { display: flex; gap: 5px; margin-bottom: 15px; }
        .btn-ig { flex: 1; background: #1c1c1c; border-radius: 8px; padding: 7px; font-size: 13px; font-weight: 600; text-align: center; transition: 0.2s; }
        .btn-ig.active { background: #363636; }
        .btn-icon { width: 34px; background: #1c1c1c; border-radius: 8px; display: flex; align-items: center; justify-content: center; }

        /* FILTERS (HIDDEN BY DEFAULT) */
        #filterBar { display: none; padding: 0 15px 10px 15px; border-bottom: 1px solid #1c1c1c; }
        .pill-grid { display: grid; gap: 6px; }
        .pill { background: transparent; border: 1px solid #1c1c1c; color: #fff; padding: 7px 0; border-radius: 8px; font-size: 10px; font-weight: 800; text-transform: uppercase; text-align: center; }
        .pill.active { border-color: #fff; background: rgba(255,255,255,0.1); }

        /* SEARCH OVERLAY */
        #searchOverlay { display: none; position: fixed; inset: 0; background: #000; z-index: 500; }
        .search-header { display: flex; align-items: center; padding: 10px 15px; gap: 10px; border-bottom: 1px solid #1c1c1c; }
        .search-input-box { flex-grow: 1; background: #262626; border-radius: 8px; padding: 6px 12px; display: flex; align-items: center; }
        .search-input-box input { background: transparent; border: none; outline: none; color: #fff; font-size: 14px; width: 100%; margin-left: 8px; }

        /* FEED GRID */
        .movie-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; padding-bottom: 80px; }
        .post-card { position: relative; aspect-ratio: 1/1; background: #0a0a0a; }
        .post-card img { width: 100%; height: 100%; object-fit: cover; }
        .badge-rating { position: absolute; top: 5px; left: 5px; padding: 1px 4px; border-radius: 2px; font-size: 7px; font-weight: 900; background: rgba(255,255,255,0.9); color: #000; z-index: 2; }
        
        /* BOTTOM NAV */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: #000; border-top: 1px solid #1c1c1c; display: flex; justify-content: space-around; padding: 12px 0; z-index: 300; }
        
        /* MODAL COPIED FROM YOUR ORIGINAL */
        .modal-player { display: none; position: fixed; inset: 0; z-index: 400; background: #000; overflow-y: auto; }
        .carousel-track { display: flex; transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1); width: 100%; }
        .carousel-slide { min-width: 100%; aspect-ratio: 16/9; position: relative; }
        .swipe-overlay { position: absolute; inset: 0; z-index: 10; background: transparent; }
        .interaction-icon { font-size: 24px; cursor: pointer; color: #fff; }
        .server-btn { width: 100%; padding: 12px 5px; border-radius: 8px; font-size: 8px; font-weight: 800; text-transform: uppercase; border: 1px solid #1c1c1c; text-align: center; background: #0a0a0a; }
        .server-btn.active-link { border: 2px solid #fff !important; }
        .dl-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 15px; }
        .dl-link-btn { width: 100%; padding: 14px; border-radius: 12px; background: #000; color: #a1a1aa; font-size: 10px; font-weight: 800; text-transform: uppercase; text-align: center; border: 1px solid #1c1c1c; }
        .cast-wrapper { display: flex; overflow-x: auto; gap: 15px; padding: 15px 0; scrollbar-width: none; }
        .cast-item { flex: 0 0 65px; text-align: center; }
        .cast-img-border { width: 64px; height: 64px; border-radius: 50%; padding: 2px; border: 2px solid #333; margin-bottom: 5px; }
        .cast-img-border img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
        .ig-post-content { padding: 0 15px; margin-top: 5px; }
        .ig-likes-count { font-weight: 700; font-size: 13px; margin-bottom: 5px; }
        .ig-username { font-weight: 700; font-size: 13px; margin-right: 5px; }
        .ig-caption { font-size: 13px; line-height: 1.5; }
        .ig-hashtags { color: #e0f1ff; display: block; margin-top: 10px; font-size: 13px; }
        .ig-date { color: #a8a8a8; font-size: 11px; margin-top: 8px; text-transform: uppercase; }

        .filter-dropdown { display: none; position: fixed; background: #121212; border: 1px solid #1c1c1c; border-radius: 12px; z-index: 600; width: 150px; max-height: 300px; overflow-y: auto; }
        .filter-item { padding: 12px; font-size: 11px; text-align: center; border-bottom: 1px solid #1c1c1c; color: #bbb; cursor: pointer; }
    </style>
</head>
<body>

    <div id="mainProfile">
        <div class="profile-header">
            <div class="top-bar">
                <div class="flex items-center">
                    <h1 class="ig-logo">amnesfubbia <span class="opacity-40 font-normal">xx1</span></h1>
                    <i class="fa-solid fa-circle-check text-[#0095f6] ml-1 text-[10px]"></i>
                </div>
                <div class="flex gap-4">
                    <i class="fa-regular fa-heart text-xl" onclick="showLibrary('likes')"></i>
                    <i class="fa-regular fa-bookmark text-xl" onclick="showLibrary('bookmarks')"></i>
                </div>
            </div>

            <div class="profile-info">
                <div class="profile-pic">
                    <img src="https://image.tmdb.org/t/p/w200/o79fH0A9mYt1L405G65kQoR97H5.jpg" alt="profile">
                </div>
                <div class="stats">
                    <div><span class="stat-val">25.4rb</span><span class="stat-label">film</span></div>
                    <div><span class="stat-val">8.2rb</span><span class="stat-label">series</span></div>
                    <div><span class="stat-val">1.5rb</span><span class="stat-label">short</span></div>
                </div>
            </div>

            <div class="bio">
                <span class="bio-name">amnesfubbia xx1</span>
                <span>dari indonesia untuk dunia</span><br>
                <span>By Anasteas</span>
            </div>

            <div class="highlights-container no-scrollbar">
                <script>
                    const hl = [
                        ['Anime','fa-dragon'],['Korea','fa-k'],['Indonesia','fa-flag'],
                        ['India','fa-tala-rupee-sign'],['Thailand','fa-temple'],['Disney','fa-mickey-mouse'],
                        ['Dreamwork','fa-moon'],['Ghibli','fa-leaf'],['Netflix','fa-n']
                    ];
                    hl.forEach(i => {
                        document.write(`
                            <div class="highlight-item">
                                <div class="highlight-circle"><i class="fa-solid ${i[1]} text-xl"></i></div>
                                <div class="highlight-text">${i[0]}</div>
                            </div>
                        `);
                    });
                </script>
            </div>

            <div class="action-buttons">
                <div id="btnNowPlaying" class="btn-ig" onclick="setSchedule('now_playing', this)">Sedang Tayang</div>
                <div id="btnUpcoming" class="btn-ig" onclick="setSchedule('upcoming', this)">Segera Tayang</div>
                <div class="btn-icon" onclick="toggleFilterBar()">
                    <i class="fa-solid fa-user-plus text-sm"></i>
                </div>
            </div>
        </div>

        <div id="filterBar">
            <div class="pill-grid grid-cols-3">
                <button class="pill" id="btnCountry" onclick="toggleDropdown('countryDropdown')">Negara <i class="fa-solid fa-caret-down"></i></button>
                <button class="pill" id="btnGenre" onclick="toggleDropdown('genreDropdown')">Genre <i class="fa-solid fa-caret-down"></i></button>
                <button class="pill" id="yearBtn" onclick="toggleDropdown('yearDropdown')">Tahun <i class="fa-solid fa-caret-down"></i></button>
            </div>
        </div>

        <main id="feedGrid" class="movie-grid"></main>
    </div>

    <div id="searchOverlay">
        <div class="search-header">
            <i class="fa-solid fa-arrow-left text-lg" onclick="closeSearch()"></i>
            <div class="search-input-box">
                <i class="fa-solid fa-magnifying-glass text-zinc-500 text-xs"></i>
                <input type="text" id="searchInp" placeholder="Cari film, series, anime..." onkeydown="if(event.key==='Enter') searchAction()" autocomplete="off">
            </div>
            <span class="text-sm font-semibold" onclick="closeSearch()">Batal</span>
        </div>
        <div id="searchGrid" class="movie-grid"></div>
    </div>

    <div id="movieModal" class="modal-player">
        <div class="max-w-xl mx-auto pb-40">
            <div class="px-4 h-[54px] flex items-center border-b border-zinc-900 sticky top-0 bg-black z-50">
                <i class="fa-solid fa-chevron-left text-xl cursor-pointer" onclick="closeModal()"></i>
                <div class="flex-grow text-center text-[14px] font-bold truncate px-8" id="mTitle"></div>
            </div>
            <div id="castContainer" class="cast-wrapper px-4 no-scrollbar"></div>
            <div class="relative overflow-hidden">
                <div class="swipe-overlay" id="swipeOverlay"></div>
                <div class="carousel-track" id="carouselTrack"></div>
                <div id="carouselDots" class="flex justify-center gap-2 py-3"></div>
            </div>
            <div class="px-4 py-3 flex justify-between items-center">
                <div class="flex gap-4"><i id="btnLikeModal" class="interaction-icon"></i><i class="fa-regular fa-comment interaction-icon"></i><i class="fa-regular fa-paper-plane interaction-icon"></i></div>
                <i id="btnBookModal" class="interaction-icon"></i>
            </div>
            <div class="ig-post-content">
                <span id="mLikeDisplay" class="ig-likes-count"></span>
                <div class="mb-1"><span class="ig-username">amnesfubbia.xx1</span><span id="mDesc" class="ig-caption"></span><span id="mToggleBtn" class="toggle-btn hidden" onclick="handleToggleDesc()">selengkapnya</span></div>
                <p id="mTranslateBtn" class="text-[11px] text-zinc-500 font-bold mb-2 cursor-pointer hidden">Lihat Terjemahan...</p>
                <div id="mHashtags" class="ig-hashtags"></div>
                <div id="mDateDisplay" class="ig-date"></div>
                <div id="seriesControl" class="hidden mt-6 p-4 bg-zinc-950 rounded-2xl border border-zinc-900">
                    <div class="flex justify-between items-center mb-4"><h4 class="text-[9px] font-black text-zinc-400 uppercase">Episode</h4><select id="seasonSel" class="bg-zinc-900 text-white text-[10px] px-2 py-1 rounded" onchange="loadEpisodes()"></select></div>
                    <div id="episodeGrid" class="grid grid-cols-5 gap-2"></div>
                </div>
                <div id="serverList" class="grid grid-cols-3 gap-2 mt-6"></div>
                <div class="dl-grid">
                    <button id="btnDownload1" class="dl-link-btn" onclick="highlightBtn(this); window.open(`https://dl.vidsrc.vip/${window.currentMediaType}/${window.currentMediaId}`)">Download 1</button>
                    <button id="btnDownload2" class="dl-link-btn" onclick="highlightBtn(this); window.open(`https://multiembed.mov/directstream.php?video_id=${window.currentMediaId}&tmdb=1`)">Download 2</button>
                </div>
            </div>
        </div>
    </div>

    <div id="countryDropdown" class="filter-dropdown left-[15px] bottom-[150px] no-scrollbar"></div>
    <div id="genreDropdown" class="filter-dropdown left-[35%] bottom-[150px] no-scrollbar"></div>
    <div id="yearDropdown" class="filter-dropdown right-[15px] bottom-[150px] no-scrollbar"></div>

    <nav class="bottom-nav">
        <i class="fa-solid fa-house cursor-pointer" onclick="location.reload()"></i>
        <i class="fa-solid fa-magnifying-glass cursor-pointer" onclick="openSearch()"></i>
        <i class="fa-regular fa-square-plus cursor-pointer"></i>
        <i class="fa-regular fa-compass cursor-pointer"></i>
        <div class="w-6 h-6 rounded-full border border-white flex items-center justify-center overflow-hidden">
             <img src="https://image.tmdb.org/t/p/w200/o79fH0A9mYt1L405G65kQoR97H5.jpg" class="w-full h-full object-cover filter grayscale" alt="">
        </div>
    </nav>

    <script>
        const API_KEY = 'bfa7df5310c9974f62f26c6789a8c00d';
        let page = 1, loading = false, currentType = 'multi', currentGenre = '', currentYear = '', currentCountry = '', currentSchedule = 'trending', searchQuery = '';
        let isExpanded = false, globalFullDesc = "", currentIdx = 0, startX = 0;

        window.onload = () => { initFilters(); loadFeed(); setupSwipe(); };

        function openSearch() {
            document.getElementById('searchOverlay').style.display = 'block';
            document.getElementById('searchInp').focus();
            document.body.style.overflow = 'hidden';
        }

        function closeSearch() {
            document.getElementById('searchOverlay').style.display = 'none';
            document.getElementById('searchInp').value = '';
            document.getElementById('searchGrid').innerHTML = '';
            document.body.style.overflow = 'auto';
            searchQuery = '';
        }

        function toggleFilterBar() {
            const bar = document.getElementById('filterBar');
            bar.style.display = (bar.style.display === 'block') ? 'none' : 'block';
        }

        function toggleDropdown(id) {
            const d = document.getElementById(id);
            const isVisible = d.style.display === 'block';
            document.querySelectorAll('.filter-dropdown').forEach(el => el.style.display = 'none');
            if(!isVisible) d.style.display = 'block';
        }

        function setSchedule(v, el) {
            document.querySelectorAll('.btn-ig').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            currentSchedule = v;
            loadFeed(true);
        }

        async function loadFeed(isNew = true) {
            if(loading) return; loading = true;
            const targetGrid = searchQuery ? document.getElementById('searchGrid') : document.getElementById('feedGrid');
            if(isNew) { page = 1; targetGrid.innerHTML = ''; }
            
            let params = `api_key=${API_KEY}&language=id-ID&page=${page}&include_adult=false`;
            let endpoint = 'discover/movie';
            let queryUrl = `https://api.themoviedb.org/3/${endpoint}?${params}`;
            
            const today = new Date().toISOString().split('T')[0];
            if (currentSchedule === 'trending') queryUrl += `&sort_by=trending.desc`;
            else if (currentSchedule === 'now_playing') {
                const sixtyDaysAgo = new Date(Date.now() - 60 * 24 * 60 * 60 * 1000).toISOString().split('T')[0];
                queryUrl += `&release_date.gte=${sixtyDaysAgo}&release_date.lte=${today}&sort_by=release_date.desc`;
            } else if (currentSchedule === 'upcoming') {
                const tomorrow = new Date(Date.now() + 24 * 60 * 60 * 1000).toISOString().split('T')[0];
                queryUrl += `&primary_release_date.gte=${tomorrow}&sort_by=primary_release_date.asc`;
            }
            
            if(currentCountry) queryUrl += `&with_origin_country=${currentCountry}`;
            if(currentGenre) queryUrl += `&with_genres=${currentGenre}`;
            if(currentYear) queryUrl += `&primary_release_year=${currentYear}`;
            if(searchQuery) queryUrl = `https://api.themoviedb.org/3/search/multi?query=${encodeURIComponent(searchQuery)}&api_key=${API_KEY}&language=id-ID&page=${page}`;
            
            try { 
                const res = await fetch(queryUrl); 
                const data = await res.json(); 
                renderGrid(data.results || [], targetGrid); 
            } catch (e) { console.error(e); }
            loading = false;
        }

        function renderGrid(items, grid) {
            items.forEach(m => {
                if(!m.poster_path) return;
                const mType = m.media_type || 'movie';
                const card = document.createElement('div');
                card.className = 'post-card';
                card.onclick = () => openModal(m.id, mType);
                card.innerHTML = `<div class="badge-rating">★ ${m.vote_average ? m.vote_average.toFixed(1) : '0'}</div><img src="https://image.tmdb.org/t/p/w342${m.poster_path}">`;
                grid.appendChild(card);
            });
        }

        // Search Action
        function searchAction() {
            searchQuery = document.getElementById('searchInp').value;
            loadFeed(true);
        }

        // Filter Setup & Logic
        function initFilters() {
            const yD = document.getElementById('yearDropdown');
            yD.innerHTML = '<div class="filter-item" onclick="setYear(\'\')">Semua Tahun</div>';
            for(let y=2026; y>=1990; y--) yD.innerHTML += `<div class="filter-item" onclick="setYear(${y})">${y}</div>`;
            
            const cD = document.getElementById('countryDropdown');
            cD.innerHTML = '<div class="filter-item" onclick="setCountry(\'\',\'Negara\')">Semua</div>';
            [['IN','India'],['KR','Korea'],['ID','Indonesia'],['US','USA']].forEach(c => cD.innerHTML += `<div class="filter-item" onclick="setCountry('${c[0]}','${c[1]}')">${c[1]}</div>`);
            
            const gD = document.getElementById('genreDropdown');
            gD.innerHTML = '<div class="filter-item" onclick="setGenre(\'\',\'Genre\')">Semua</div>';
            [[28,'Action'],[16,'Animasi'],[27,'Horror'],[10749,'Romance']].forEach(g => gD.innerHTML += `<div class="filter-item" onclick="setGenre('${g[0]}','${g[1]}')">${g[1]}</div>`);
        }

        function setYear(y) { currentYear=y; document.getElementById('yearBtn').innerText=y || 'Tahun'; toggleDropdown('yearDropdown'); loadFeed(true); }
        function setCountry(c, n) { currentCountry=c; document.getElementById('btnCountry').innerText=n; toggleDropdown('countryDropdown'); loadFeed(true); }
        function setGenre(g, n) { currentGenre=g; document.getElementById('btnGenre').innerText=n; toggleDropdown('genreDropdown'); loadFeed(true); }

        // --- MODAL FUNCTIONS (COPY-PASTE FROM ORIGINAL) ---
        async function openModal(id, type) {
            window.currentMediaId = id; window.currentMediaType = type;
            document.getElementById('movieModal').style.display = 'block';
            document.body.style.overflow = 'hidden';
            currentIdx = 0;
            const [rId, rEn, rCast] = await Promise.all([
                fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=${API_KEY}&language=id-ID&append_to_response=videos`),
                fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=${API_KEY}&language=en-US&append_to_response=videos`),
                fetch(`https://api.themoviedb.org/3/${type}/${id}/credits?api_key=${API_KEY}`)
            ]);
            const dId = await rId.json(), dEn = await rEn.json(), dCast = await rCast.json();
            const vids = [...(dId.videos?.results || []), ...(dEn.videos?.results || [])].filter(v => v.site === 'YouTube' && (v.type === 'Trailer' || v.type === 'Teaser')).slice(0, 4);
            const track = document.getElementById('carouselTrack'), dots = document.getElementById('carouselDots');
            track.innerHTML = ''; dots.innerHTML = ''; track.style.transform = 'translateX(0)';
            if(vids.length > 0) {
                vids.forEach((v, i) => {
                    track.innerHTML += `<div class="carousel-slide"><iframe id="yt-${i}" src="https://www.youtube.com/embed/${v.key}?enablejsapi=1&autoplay=${i===0?1:0}&mute=0&rel=0" class="w-full h-full" allow="autoplay; fullscreen"></iframe></div>`;
                    dots.innerHTML += `<div class="dot w-1.5 h-1.5 rounded-full ${i===0?'bg-blue-500':'bg-zinc-700'}"></div>`;
                });
                document.getElementById('swipeOverlay').style.display = 'block';
            } else {
                track.innerHTML = `<div class="carousel-slide"><iframe src="https://vidrock.net/embed/${type}/${id}${type==='tv'?'/1/1':''}" class="w-full h-full" allowfullscreen></iframe></div>`;
                dots.innerHTML = `<div class="dot bg-blue-500 w-1.5 h-1.5 rounded-full"></div>`;
                document.getElementById('swipeOverlay').style.display = 'none';
            }
            document.getElementById('castContainer').innerHTML = (dCast.cast || []).slice(0, 10).map(c => `<div class="cast-item"><div class="cast-img-border"><img src="${c.profile_path ? 'https://image.tmdb.org/t/p/w185' + c.profile_path : 'https://www.themoviedb.org/assets/2/v4/glyphicons/basic/glyphicons-basic-4-user-3245c3f3347706a035c9744ffaa5d174e48be3b860667e406723f3bc8160f47e.svg'}"></div><span class="cast-name">${c.name}</span></div>`).join('');
            document.getElementById('mLikeDisplay').innerText = `${Math.floor((dId.vote_average || 0) * 1234).toLocaleString('id-ID')} suka`;
            document.getElementById('mTitle').innerText = dId.title || dId.name || dEn.title || dEn.name;
            globalFullDesc = dId.overview || dEn.overview || "Sinopsis tidak tersedia.";
            isExpanded = false; renderSynopsis();
            const rel = dId.release_date || dId.first_air_date || "";
            document.getElementById('mHashtags').innerText = `#${(dId.title||dId.name||"").replace(/\s+/g, '')} #${rel.split('-')[0]}`;
            document.getElementById('mDateDisplay').innerText = rel ? new Date(rel).toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' }) : '';
            document.getElementById('serverList').innerHTML = `<button class="server-btn" onclick="playVid('https://vidrock.net/embed/${type}/${id}${type==='tv'?'/1/1':''}', this)">Server 1</button><button class="server-btn" onclick="playVid('https://vidsrc.me/embed/${type}?tmdb=${id}', this)">Server 2</button>`;
            if(type === 'tv') { document.getElementById('seriesControl').classList.remove('hidden'); loadEpisodes(); } else { document.getElementById('seriesControl').classList.add('hidden'); }
            updateLibButtons(id);
        }

        function closeModal() { document.getElementById('movieModal').style.display = 'none'; document.body.style.overflow = 'auto'; if(!searchQuery) document.body.style.overflow = 'auto'; }
        function renderSynopsis() { const descEl = document.getElementById('mDesc'), toggleBtn = document.getElementById('mToggleBtn'); if (globalFullDesc.length > 90) { toggleBtn.classList.remove('hidden'); descEl.innerText = isExpanded ? globalFullDesc : globalFullDesc.substring(0, 90) + "..."; toggleBtn.innerText = isExpanded ? "ringkas" : "selengkapnya"; } else { descEl.innerText = globalFullDesc; toggleBtn.classList.add('hidden'); } }
        function handleToggleDesc() { isExpanded = !isExpanded; renderSynopsis(); }
        function setupSwipe() {
            const overlay = document.getElementById('swipeOverlay');
            overlay.addEventListener('touchstart', e => { startX = e.touches[0].clientX; }, {passive:true});
            overlay.addEventListener('touchend', e => {
                let diff = startX - e.changedTouches[0].clientX;
                const slides = document.querySelectorAll('.carousel-slide');
                if(Math.abs(diff) > 50 && slides.length > 1) {
                    if(diff > 0 && currentIdx < slides.length - 1) currentIdx++;
                    else if(diff < 0 && currentIdx > 0) currentIdx--;
                    document.getElementById('carouselTrack').style.transform = `translateX(-${currentIdx * 100}%)`;
                }
            });
        }
        function highlightBtn(el) { document.querySelectorAll('.server-btn, .dl-link-btn').forEach(b => b.classList.remove('active-link')); el.classList.add('active-link'); }
        function updateLibButtons(id) { document.getElementById('btnLikeModal').className = 'fa-regular fa-heart interaction-icon'; document.getElementById('btnBookModal').className = 'fa-regular fa-bookmark interaction-icon'; }
        window.onscroll = () => { if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 1000 && !loading) { page++; loadFeed(false); } };
    </script>
</body>
</html>
