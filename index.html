<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>amnesfubbia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #000000; --accent: #3b82f6; --text: #ffffff; --zinc-800: #27272a; --zinc-900: #18181b; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg); color: var(--text); -webkit-tap-highlight-color: transparent; overflow-x: hidden; }
        .glass { background: rgba(0,0,0,0.7); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
        .feed-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; }
        .post-card { aspect-ratio: 2/3; position: relative; overflow: hidden; cursor: pointer; background: #111; }
        .post-card img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s ease; }
        .modal { display: none; position: fixed; inset: 0; z-index: 50; background: #000; overflow-y: auto; }
        .carousel-container { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; overflow: hidden; }
        .carousel-track { display: flex; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); height: 100%; }
        .carousel-slide { min-width: 100%; height: 100%; }
        .cast-scroll { display: flex; overflow-x: auto; gap: 16px; padding: 4px 0; scrollbar-width: none; }
        .cast-scroll::-webkit-scrollbar { display: none; }
        .cast-item { flex: 0 0 70px; text-align: center; }
        .cast-img-border { width: 66px; height: 66px; border-radius: 50%; padding: 2px; background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); margin: 0 auto 6px; }
        .inner-border { width: 100%; height: 100%; border-radius: 50%; border: 2px solid #000; overflow: hidden; background: #222; }
        .inner-border img { width: 100%; height: 100%; object-fit: cover; }
        .cast-name { font-size: 10px; color: #a1a1aa; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
        .btn-action { transition: all 0.2s; }
        .btn-action:active { transform: scale(0.9); opacity: 0.7; }
        .tab-item { position: relative; padding: 12px 0; color: #71717a; cursor: pointer; flex: 1; text-align: center; }
        .tab-item.active { color: #fff; }
        .tab-item.active::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 2px; background: #fff; }
        select { background: #18181b; border: 1px solid #27272a; border-radius: 8px; padding: 6px 12px; color: white; font-size: 14px; outline: none; }
        .server-btn { background: #27272a; padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 500; }
        .server-btn.active { background: #fff; color: #000; }
        #smartSearchDropdown { position: absolute; top: 100%; left: 0; right: 0; background: #111; z-index: 100; max-height: 300px; overflow-y: auto; border-radius: 0 0 16px 16px; display: none; border: 1px solid #222; }
        .search-item { padding: 10px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #1a1a1a; cursor: pointer; }
        .search-item img { width: 35px; height: 50px; object-fit: cover; border-radius: 4px; }
    </style>
</head>
<body>

    <header class="glass sticky top-0 z-40 px-4 py-3 flex items-center justify-between">
        <h1 class="text-xl font-bold tracking-tighter cursor-pointer" onclick="resetToHome()">amnesfubbia</h1>
        <div class="relative flex-1 max-w-[200px] ml-4">
            <input type="text" id="searchInput" placeholder="Cari..." class="w-full bg-zinc-900 border-none rounded-full px-4 py-1.5 text-sm outline-none focus:ring-1 focus:ring-zinc-700">
            <div id="smartSearchDropdown"></div>
        </div>
    </header>

    <div class="flex border-b border-zinc-900 sticky top-[53px] bg-black z-30">
        <div class="tab-item active" onclick="switchTab('feed', this)">
            <svg class="w-6 h-6 mx-auto" fill="currentColor" viewBox="0 0 24 24"><path d="M12.97 2.59a1.5 1.5 0 00-1.94 0l-7.5 6.363A1.5 1.5 0 003 10.097V19.5A1.5 1.5 0 004.5 21h4.75a.75.75 0 00.75-.75V14.25a.75.75 0 01.75-.75h2.5a.75.75 0 01.75.75v6a.75.75 0 00.75.75h4.75a1.5 1.5 0 001.5-1.5v-9.403a1.5 1.5 0 00-.53-1.144l-7.5-6.363z"/></svg>
        </div>
        <div class="tab-item" onclick="switchTab('likes', this)">
            <svg class="w-6 h-6 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5"><path d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z"/></svg>
        </div>
        <div class="tab-item" onclick="switchTab('bookmarks', this)">
            <svg class="w-6 h-6 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5"><path d="M17.593 3.322c1.1.128 1.907 1.077 1.907 2.185V21L12 17.25 4.5 21V5.507c0-1.108.806-2.057 1.907-2.185a48.507 48.507 0 0111.186 0z"/></svg>
        </div>
    </div>

    <main id="feedGrid" class="feed-grid pb-20"></main>

    <div id="movieModal" class="modal">
        <div class="sticky top-0 z-50 p-4 flex justify-between items-center glass">
            <button onclick="closeModal()" class="btn-action p-2 bg-zinc-900 rounded-full"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg></button>
            <div class="flex gap-4">
                <button id="btnLike" onclick="toggleLib('likes')" class="btn-action"><svg id="iconLike" class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z"/></svg></button>
                <button id="btnBookmark" onclick="toggleLib('bookmarks')" class="btn-action"><svg id="iconBookmark" class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M17.593 3.322c1.1.128 1.907 1.077 1.907 2.185V21L12 17.25 4.5 21V5.507c0-1.108.806-2.057 1.907-2.185a48.507 48.507 0 0111.186 0z"/></svg></button>
            </div>
        </div>

        <div class="carousel-container" id="carousel">
            <div class="carousel-track" id="carouselTrack"></div>
            <div id="swipeOverlay" class="absolute inset-0 z-10 hidden"></div>
            <div id="carouselDots" class="absolute bottom-4 left-0 right-0 z-20 flex justify-center gap-1.5"></div>
        </div>

        <div class="p-4 space-y-6">
            <div>
                <div class="flex justify-between items-start mb-1">
                    <h2 id="mTitle" class="text-2xl font-bold leading-tight flex-1 pr-4"></h2>
                    <span id="mLikeDisplay" class="text-xs font-semibold bg-zinc-900 px-2 py-1 rounded"></span>
                </div>
                <div id="mDateDisplay" class="text-xs text-zinc-500 mb-4"></div>
                <div class="space-y-3">
                    <p id="mSynopsis" class="text-[14px] leading-relaxed text-zinc-300"></p>
                    <button id="mTranslateBtn" onclick="toggleTranslate()" class="text-blue-500 text-xs font-semibold hidden"></button>
                </div>
                <div id="mHashtags" class="mt-4 text-[13px] text-blue-500 font-medium leading-relaxed"></div>
            </div>

            <div class="space-y-3">
                <h3 class="text-sm font-bold uppercase tracking-wider text-zinc-500">Pemeran Utama</h3>
                <div id="castContainer" class="cast-scroll"></div>
            </div>

            <div class="space-y-4 pt-4 border-t border-zinc-900">
                <div class="flex items-center justify-between">
                    <h3 class="font-bold">Nonton Sekarang</h3>
                    <div id="seriesControl" class="flex gap-2 hidden">
                        <select id="seasonSel" onchange="loadEpisodes()"></select>
                        <select id="episodeSel" onchange="changeEpisode()"></select>
                    </div>
                </div>
                <div id="serverList" class="flex flex-wrap gap-2"></div>
                <div id="videoWrapper" class="relative w-full aspect-video bg-black rounded-xl overflow-hidden hidden">
                    <iframe id="mainPlayer" class="w-full h-full" allowfullscreen></iframe>
                </div>
            </div>
        </div>
        <div class="h-20"></div>
    </div>

    <script>
        const API_KEY = '53114b301b44766863641b98a18357a7';
        let page = 1, loading = false, currentType = 'movie', currentSchedule = 'trending', searchQuery = '', currentCastId = '', currentCompany = '', currentLibMode = false;
        let startX = 0, currentIdx = 0, isTranslated = false, globalFullDesc = '', globalEnDesc = '', originalIndoDesc = '', isExpanded = false;
        let loadingLib = false;

        async function fetchTMDB(path, params = '') {
            const r = await fetch(`https://api.themoviedb.org/3/${path}?api_key=${API_KEY}&${params}`);
            return r.json();
        }

        async function loadFeed(reset = false) {
            if(loading || currentLibMode) return;
            loading = true; if(reset) { page = 1; document.getElementById('feedGrid').innerHTML = ''; window.scrollTo(0,0); }
            let path = (currentSchedule === 'trending') ? `trending/${currentType}/day` : `${currentType}/${currentSchedule}`;
            let params = `language=id-ID&page=${page}`;
            if(searchQuery) { path = `search/multi`; params += `&query=${searchQuery}`; }
            if(currentCastId) { path = `discover/${currentType}`; params += `&with_cast=${currentCastId}`; }
            if(currentCompany) { path = `discover/${currentType}`; params += `&with_companies=${currentCompany}`; }
            const data = await fetchTMDB(path, params);
            renderGrid(data.results);
            loading = false; page++;
        }

        function renderGrid(items) {
            const grid = document.getElementById('feedGrid');
            items.forEach(m => {
                if(m.media_type === 'person') return;
                const card = document.createElement('div');
                card.className = 'post-card';
                card.onclick = () => openModal(m.id, m.media_type || currentType);
                // Placeholder if no image
                const imgPath = m.poster_path ? `https://image.tmdb.org/t/p/w342${m.poster_path}` : 'https://via.placeholder.com/342x513/111/111?text=No+Image';
                card.innerHTML = `<img src="${imgPath}" loading="lazy">`;
                grid.appendChild(card);
            });
        }

        async function openModal(id, type) {
            window.currentMediaId = id; window.currentMediaType = type;
            document.getElementById('movieModal').style.display = 'block'; 
            document.getElementById('movieModal').scrollTop = 0;
            document.getElementById('smartSearchDropdown').style.display = 'none'; 
            document.body.style.overflow = 'hidden'; 
            currentIdx = 0; isTranslated = false;
            
            const [rId, rEn, rCast] = await Promise.all([
                fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=${API_KEY}&language=id-ID&append_to_response=videos,production_companies`),
                fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=${API_KEY}&language=en-US&append_to_response=videos`),
                fetch(`https://api.themoviedb.org/3/${type}/${id}/credits?api_key=${API_KEY}`)
            ]);
            
            const dId = await rId.json(), dEn = await rEn.json(), dCast = await rCast.json();
            const vids = [...(dId.videos?.results || []), ...(dEn.videos?.results || [])].filter(v => v.site === 'YouTube' && (v.type === 'Trailer' || v.type === 'Teaser')).slice(0, 4);
            const track = document.getElementById('carouselTrack'), dots = document.getElementById('carouselDots');
            track.innerHTML = ''; dots.innerHTML = ''; track.style.transform = 'translateX(0)';
            
            if(vids.length > 0) { 
                vids.forEach((v, i) => { 
                    track.innerHTML += `<div class="carousel-slide"><iframe id="yt-${i}" src="https://www.youtube.com/embed/${v.key}?enablejsapi=1&autoplay=${i===0?1:0}&rel=0" class="w-full h-full" allow="autoplay; fullscreen"></iframe></div>`; 
                    dots.innerHTML += `<div class="dot w-1.5 h-1.5 rounded-full ${i===currentIdx?'bg-blue-500':'bg-zinc-700'}"></div>`; 
                }); 
                document.getElementById('swipeOverlay').style.display = 'block';
                dots.style.display = (vids.length > 1) ? 'flex' : 'none';
            } else { 
                track.innerHTML = `<div class="carousel-slide"><iframe src="https://vidrock.net/embed/${type}/${id}${type==='tv'?'/1/1':''}" class="w-full h-full" allowfullscreen></iframe></div>`; 
                document.getElementById('swipeOverlay').style.display = 'none';
                dots.style.display = 'none';
            }

            document.getElementById('castContainer').innerHTML = (dCast.cast || []).slice(0, 10).map(c => {
                const profileImg = c.profile_path ? `<img src="https://image.tmdb.org/t/p/w185${c.profile_path}" loading="lazy">` : `<div style="width:100%; height:100%; background:#000;"></div>`;
                return `<div class="cast-item" onclick="searchByCast(${c.id})"><div class="cast-img-border"><div class="inner-border">${profileImg}</div></div><span class="cast-name">${c.name}</span></div>`;
            }).join('');

            document.getElementById('mLikeDisplay').innerText = `${Math.floor((dId.vote_average || 0) * 1234).toLocaleString('id-ID')} suka`; 
            document.getElementById('mTitle').innerText = dId.title || dId.name || dEn.title;
            originalIndoDesc = dId.overview;
            globalFullDesc = originalIndoDesc || dEn.overview || "Sinopsis belum tersedia untuk konten ini.";
            globalEnDesc = dEn.overview;
            
            if(globalEnDesc && globalEnDesc !== originalIndoDesc) { 
                document.getElementById('mTranslateBtn').classList.remove('hidden'); 
                document.getElementById('mTranslateBtn').innerText = "Lihat terjemahan"; 
            } else { document.getElementById('mTranslateBtn').classList.add('hidden'); }
            
            isExpanded = false; renderSynopsis();
            const relYear = (dId.release_date || dId.first_air_date || "2026").split('-')[0];
            const contentKind = (type === 'tv') ? 'Series' : 'Film';
            const genresArr = (dId.genres || []).map(g => `#${g.name.replace(/[^a-zA-Z0-9]/g, '')}`).slice(0, 3).join(' ');
            const studiosArr = (dId.production_companies || []).map(c => `#${c.name.replace(/[^a-zA-Z0-9]/g, '')}`).slice(0, 2).join(' ');
            document.getElementById('mHashtags').innerHTML = `#${(dId.title||dId.name||"").replace(/[^a-zA-Z0-9]/g, '')} #${relYear} #${contentKind} <br> ${genresArr} ${studiosArr}`;
            const rel = dId.release_date || dId.first_air_date || ""; 
            document.getElementById('mDateDisplay').innerText = rel ? new Date(rel).toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' }) : '';
            document.getElementById('serverList').innerHTML = `<button class="server-btn" onclick="playVid('https://vidrock.net/embed/${type}/${id}${type==='tv'?'/1/1':''}', this)">Server 1</button><button class="server-btn" onclick="playVid('https://vidsrc.me/embed/${type}?tmdb=${id}', this)">Server 2</button><button class="server-btn" onclick="playVid('https://embed.smashystream.com/playere.php?tmdb=${id}', this)">Server 3</button>`;
            if(type === 'tv') { document.getElementById('seriesControl').classList.remove('hidden'); document.getElementById('seasonSel').innerHTML = (dId.seasons||[]).filter(s=>s.season_number>0).map(s=>`<option value="${s.season_number}">Season ${s.season_number}</option>`).join(''); loadEpisodes(); } else { document.getElementById('seriesControl').classList.add('hidden'); }
            updateLibButtons(id);
        }

        // PERBAIKAN 1: Reset src mainPlayer agar memori bersih saat modal tutup
        function closeModal() { document.getElementById('movieModal').style.display = 'none'; document.getElementById('videoWrapper').classList.add('hidden'); document.getElementById('mainPlayer').src = ''; document.body.style.overflow = 'auto'; if(currentLibMode) switchTab('likes', document.querySelectorAll('.tab-item')[1]); }
        
        function playVid(url, el) { document.querySelectorAll('.server-btn').forEach(b => b.classList.remove('active')); el.classList.add('active'); document.getElementById('videoWrapper').classList.remove('hidden'); document.getElementById('mainPlayer').src = url; }
        async function loadEpisodes() { const s = document.getElementById('seasonSel').value; const data = await fetchTMDB(`${currentMediaType}/${currentMediaId}/season/${s}`, 'language=id-ID'); document.getElementById('episodeSel').innerHTML = data.episodes.map(e => `<option value="${e.episode_number}">Eps ${e.episode_number}: ${e.name}</option>`).join(''); changeEpisode(); }
        function changeEpisode() { const s = document.getElementById('seasonSel').value, e = document.getElementById('episodeSel').value; playVid(`https://vidrock.net/embed/tv/${currentMediaId}/${s}/${e}`, document.querySelector('.server-btn')); }
        function renderSynopsis() { const display = isExpanded ? globalFullDesc : (globalFullDesc.length > 120 ? globalFullDesc.substring(0, 120) + '...' : globalFullDesc); document.getElementById('mSynopsis').innerHTML = display + (globalFullDesc.length > 120 ? ` <span onclick="toggleExpand()" class="text-zinc-500 font-bold cursor-pointer">${isExpanded ? ' lebih sedikit' : ' selengkapnya'}</span>` : ''); }
        function toggleExpand() { isExpanded = !isExpanded; renderSynopsis(); }
        function toggleTranslate() { isTranslated = !isTranslated; if(isTranslated) { document.getElementById('mSynopsis').innerText = "Menerjemahkan..."; fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=id&dt=t&q=${encodeURIComponent(globalEnDesc)}`).then(r=>r.json()).then(d=>{ globalFullDesc = d[0].map(x=>x[0]).join(''); document.getElementById('mTranslateBtn').innerText = "Lihat asli"; renderSynopsis(); }); } else { globalFullDesc = originalIndoDesc || globalEnDesc; document.getElementById('mTranslateBtn').innerText = "Lihat terjemahan"; renderSynopsis(); } }
        
        async function switchTab(mode, el) {
            if(loadingLib) return; 
            document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active')); 
            el.classList.add('active'); 
            const grid = document.getElementById('feedGrid'); grid.innerHTML = ''; 
            if(mode === 'likes' || mode === 'bookmarks') { 
                currentLibMode = true; loadingLib = true;
                await showLibrary(mode); 
                loadingLib = false;
            } else { 
                currentLibMode = false; currentCastId = ''; searchQuery = ''; currentType='movie'; currentSchedule='trending'; currentCompany=''; loadFeed(true); 
            } 
        }

        // PERBAIKAN 2: Fungsi Reset Cepat Klik Logo
        function resetToHome() {
            currentLibMode = false; searchQuery = ''; currentCastId = ''; currentType = 'movie'; currentSchedule = 'trending';
            document.getElementById('searchInput').value = '';
            document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-item')[0].classList.add('active');
            loadFeed(true);
        }

        async function showLibrary(key) { const list = JSON.parse(localStorage.getItem(key) || '[]'); if(list.length === 0) { document.getElementById('feedGrid').innerHTML = `<div class="col-span-3 py-20 text-center text-zinc-600 text-sm">Belum ada item di ${key}</div>`; return; } const data = await Promise.all(list.map(i => fetchTMDB(`${i.type}/${i.id}`))); renderGrid(data); }
        function toggleLib(key) { const list = JSON.parse(localStorage.getItem(key) || '[]'); const idx = list.findIndex(i => i.id == currentMediaId); if(idx > -1) { list.splice(idx, 1); } else { list.push({id: currentMediaId, type: currentMediaType}); } localStorage.setItem(key, JSON.stringify(list)); updateLibButtons(currentMediaId); }
        function updateLibButtons(id) { const likes = JSON.parse(localStorage.getItem('likes') || '[]'), books = JSON.parse(localStorage.getItem('bookmarks') || '[]'); const isL = likes.some(i => i.id == id), isB = books.some(i => i.id == id); document.getElementById('iconLike').setAttribute('fill', isL ? '#ef4444' : 'none'); document.getElementById('iconLike').setAttribute('stroke', isL ? '#ef4444' : 'currentColor'); document.getElementById('iconBookmark').setAttribute('fill', isB ? '#fff' : 'none'); document.getElementById('iconBookmark').setAttribute('stroke', isB ? '#fff' : 'currentColor'); }
        function searchByCast(id) { currentCastId = id; closeModal(); loadFeed(true); }
        
        // Carousel Logic
        const carousel = document.getElementById('carousel');
        carousel.addEventListener('touchstart', e => { startX = e.touches[0].clientX; });
        carousel.addEventListener('touchend', e => { 
            const diff = startX - e.changedTouches[0].clientX; 
            const slides = document.querySelectorAll('.carousel-slide');
            if(Math.abs(diff) > 50 && slides.length > 1) { 
                if(diff > 0 && currentIdx < slides.length - 1) currentIdx++; 
                else if(diff < 0 && currentIdx > 0) currentIdx--; 
                document.getElementById('carouselTrack').style.transform = `translateX(-${currentIdx * 100}%)`; 
                document.querySelectorAll('.dot').forEach((d, i) => { d.className = `dot w-1.5 h-1.5 rounded-full ${i===currentIdx?'bg-blue-500':'bg-zinc-700'}`; }); 
                slides.forEach((s, i) => { const ifr = s.querySelector('iframe'); if(ifr && ifr.id.startsWith('yt-')) { ifr.contentWindow.postMessage(JSON.stringify({event: 'command', func: i === currentIdx ? 'playVideo' : 'pauseVideo'}), '*'); } });
            } 
        });

        // Search Logic
        document.getElementById('searchInput').addEventListener('input', async (e) => {
            const q = e.target.value; 
            if(q.length < 2) { document.getElementById('smartSearchDropdown').style.display = 'none'; return; }
            const d = await fetchTMDB('search/multi', `query=${q}&language=id-ID`);
            const dd = document.getElementById('smartSearchDropdown');
            dd.innerHTML = d.results.slice(0, 5).map(m => `<div class="search-item" onclick="openModal(${m.id}, '${m.media_type}')"><img src="${m.poster_path ? 'https://image.tmdb.org/t/p/w92'+m.poster_path : 'https://via.placeholder.com/92/111/111'}"><div><div class="text-sm font-bold">${m.title || m.name}</div><div class="text-xs text-zinc-500">${(m.release_date || m.first_air_date || '').split('-')[0]}</div></div></div>`).join('');
            dd.style.display = 'block';
        });

        window.onscroll = () => { if((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 800) loadFeed(); };
        loadFeed();
    </script>
</body>
</html>
