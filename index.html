<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AL-JAMI' MEGA REPOSITORY | AMAL JARIYAH</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #064e3b; --secondary: #10b981; --gold: #ca8a04; }
        body { background: #fdfdfd; font-family: 'Plus Jakarta Sans', sans-serif; color: #1e293b; line-height: 1.8; }
        
        .arabic { 
            font-family: 'Amiri', serif; font-size: 2.2rem; line-height: 5rem; text-align: right; 
            color: var(--primary); background: #f0fdf4; padding: 25px; border-radius: 20px; 
            margin: 20px 0; border: 1px solid #dcfce7; direction: rtl;
        }
        
        .latin { color: #0891b2; font-weight: 700; font-size: 14px; border-left: 4px solid #0891b2; padding-left: 15px; margin-bottom: 5px; }
        .arti { color: #64748b; font-style: italic; font-size: 13px; margin-bottom: 30px; display: block; background: #f8fafc; padding: 10px; border-radius: 8px; }

        .layer { position: fixed; inset: 0; background: white; z-index: 2000; transform: translateY(100%); transition: 0.5s cubic-bezier(0.16, 1, 0.3, 1); overflow-y: auto; }
        .layer.active { transform: translateY(0); }
        
        .content-card { background: white; border-radius: 30px; padding: 30px; margin-bottom: 25px; border: 1px solid #e2e8f0; box-shadow: 0 4px 20px rgba(0,0,0,0.03); }
        .hero { background: linear-gradient(135deg, #064e3b 0%, #065f46 100%); padding: 60px 30px; border-radius: 0 0 50px 50px; color: white; text-align: center; }
        
        .btn-menu { background: white; border-radius: 25px; padding: 25px; border: 1px solid #e2e8f0; display: flex; align-items: center; gap: 20px; transition: 0.3s; cursor: pointer; }
        .btn-menu:active { transform: scale(0.96); background: #f0fdf4; }

        .nav-sticky { position: sticky; top: 0; background: white; padding: 20px; border-bottom: 2px solid var(--primary); display: flex; align-items: center; justify-content: space-between; z-index: 2100; }
        
        .history-item { border-left: 4px solid var(--secondary); padding-left: 20px; margin-bottom: 40px; }
        .history-item h4 { font-weight: 800; color: var(--primary); font-size: 18px; margin-bottom: 8px; }
        
        .grid-sifat { display: grid; grid-template-cols: 1fr; gap: 15px; }
        .sifat-box { background: #f8fafc; padding: 20px; border-radius: 15px; border: 1px solid #e2e8f0; }
    </style>
</head>
<body class="pb-20">

    <header class="hero">
        <h1 class="text-4xl font-black italic tracking-tighter">AL-JAMI' ULTIMATE</h1>
        <p class="text-[10px] font-bold opacity-80 tracking-[4px] uppercase mt-2">Database Ilmu Syariat Terlengkap (Full Offline)</p>
    </header>

    <main class="p-6 -mt-8 space-y-4">
        <div onclick="openPage('nabi')" class="btn-menu shadow-xl">
            <div class="w-14 h-14 bg-emerald-100 text-emerald-800 rounded-2xl flex items-center justify-center text-3xl"><i class="fa-solid fa-scroll"></i></div>
            <div><h3 class="font-black text-sm uppercase">25 Nabi & Rasul</h3><p class="text-[10px] text-slate-400">Sejarah & Mukjizat Lengkap A-Z</p></div>
        </div>

        <div onclick="openPage('sholat')" class="btn-menu shadow-xl">
            <div class="w-14 h-14 bg-blue-100 text-blue-800 rounded-2xl flex items-center justify-center text-3xl"><i class="fa-solid fa-person-praying"></i></div>
            <div><h3 class="font-black text-sm uppercase">Tuntunan Sholat</h3><p class="text-[10px] text-slate-400">Niat, Bacaan, Dzikir & Doa</p></div>
        </div>

        <div onclick="openPage('akidah')" class="btn-menu shadow-xl">
            <div class="w-14 h-14 bg-amber-100 text-amber-800 rounded-2xl flex items-center justify-center text-3xl"><i class="fa-solid fa-shield-halved"></i></div>
            <div><h3 class="font-black text-sm uppercase">Akidah & Sifat 20</h3><p class="text-[10px] text-slate-400">Tauhid, Malaikat & Rukun Iman</p></div>
        </div>

        <div onclick="openPage('thaharah')" class="btn-menu shadow-xl">
            <div class="w-14 h-14 bg-teal-100 text-teal-800 rounded-2xl flex items-center justify-center text-3xl"><i class="fa-solid fa-faucet-drip"></i></div>
            <div><h3 class="font-black text-sm uppercase">Fiqih Bersuci</h3><p class="text-[10px] text-slate-400">Wudhu, Janabah & Fiqih Wanita</p></div>
        </div>
    </main>

    <div id="layer" class="layer">
        <div class="nav-sticky">
            <button onclick="closePage()" class="w-10 h-10 bg-slate-100 rounded-xl flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>

            <div class="w-10"></div>
        </div>
