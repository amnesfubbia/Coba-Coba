<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>amnesfubbia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { background-color: #000; color: #fff; font-family: 'Inter', sans-serif; margin: 0; overflow-x: hidden; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        /* LOGO MODERN RIBBON */
        .logo-a-container { position: relative; width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; }
        .logo-a-shape { position: relative; width: 40px; height: 50px; background: #fff; clip-path: polygon(50% 0%, 100% 100%, 75% 100%, 50% 30%, 25% 100%, 0% 100%); }
        .logo-a-shape::after { content: ''; position: absolute; top: 0; left: 50%; width: 50%; height: 100%; background: rgba(0, 0, 0, 0.15); }

        /* SPLASH SCREEN */
        #splashScreen { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.5s ease; }

        .profile-header { padding: 15px 15px 0 15px; background: #000; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .ig-logo { font-weight: 700; font-size: 18px; letter-spacing: -0.5px; }
        .dot-notify { width: 7px; height: 7px; background-color: #ff3b30; border-radius: 50%; display: inline-block; margin-left: 2px; }
        
        .profile-info { display: flex; align-items: center; gap: 25px; margin-bottom: 15px; }
        .profile-pic-container { position: relative; width: 86px; height: 86px; }
        .profile-pic-logo { width: 82px; height: 82px; border-radius: 50%; border: 1px solid #333; padding: 2px; background: #000; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .profile-pic-logo .logo-a-container { transform: scale(0.7); }
        .add-story-btn { position: absolute; bottom: 4px; right: 4px; width: 24px; height: 24px; background: #0095f6; border: 3px solid #000; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; color: #fff; z-index: 10; }

        .stats { display: flex; flex-grow: 1; justify-content: space-around; text-align: center; }
        .stat-item { cursor: pointer; }
        .stat-val { font-weight: 700; font-size: 16px; display: block; }
        .stat-label { font-size: 12px; color: #a8a8a8; }
        
        .bio { font-size: 13px; line-height: 1.4; margin-bottom: 15px; padding-top: 5px; }
        .bio-name { font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 5px; }

        .action-buttons { display: flex; gap: 6px; margin-bottom: 10px; }
        .btn-ig { flex: 1; background: #1c1c1c; border-radius: 8px; padding: 7px; font-size: 13px; font-weight: 600; text-align: center; cursor: pointer; }
        .btn-ig.active { background: #363636; }
        .btn-icon-sq { width: 34px; background: #1c1c1c; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; }

        #filterBar { display: none; margin-bottom: 15px; }
        .pill { background: transparent; border: 1px solid #1c1c1c; color: #fff; padding: 7px 0; border-radius: 8px; font-size: 10px; font-weight: 800; text-transform: uppercase; text-align: center; cursor: pointer; }
        
        .filter-dropdown { display: none; position: fixed; bottom: 0; left: 0; right: 0; background: #121212; border-radius: 20px 20px 0 0; z-index: 5000; max-height: 60vh; overflow-y: auto; border-top: 1px solid #333; animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .filter-item { padding: 16px; font-size: 14px; text-align: center; border-bottom: 1px solid #262626; color: #eee; cursor: pointer; }
        #filterOverlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 4000; }

        .highlights-wrapper { padding: 0 15px 15px 15px; border-bottom: 1px solid #1c1c1c; }
        .highlights-container { display: flex; gap: 15px; overflow-x: auto; }
        .highlight-item { flex: 0 0 62px; text-align: center; cursor: pointer; }
        .highlight-circle { width: 58px; height: 58px; border-radius: 50%; border: 1px solid #262626; margin-bottom: 5px; display: flex; align-items: center; justify-content: center; background: #000; }
        .hl-logo { font-size: 10px; font-weight: 900; text-transform: uppercase; }

        .tab-nav { display: flex; border-top: 1px solid #1c1c1c; }
        .tab-item { flex: 1; text-align: center; padding: 12px 0; color: #a8a8a8; cursor: pointer; font-size: 18px; }
        .tab-item.active { color: #fff; border-bottom: 1px solid #fff; }

        .movie-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; padding-bottom: 80px; }
        .post-card { position: relative; aspect-ratio: 2/3; background: #0a0a0a; overflow: hidden; }
        .post-card img { width: 100%; height: 100%; object-fit: cover; }
        .badge-rating { position: absolute; top: 6px; left: 6px; padding: 2px 5px; border-radius: 2px; font-size: 7px; font-weight: 900; background: rgba(255,255,255,0.9); color: #000; }
        .badge-type { position: absolute; top: 6px; right: 6px; padding: 2px 5px; border-radius: 2px; font-size: 7px; font-weight: 900; background: rgba(0,0,0,0.7); border: 0.5px solid rgba(255,255,255,0.3); }

        .modal-player { display: none; position: fixed; inset: 0; z-index: 3000; background: #000; overflow-y: auto; }
        .carousel-track { display: flex; transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1); width: 100%; }
        .carousel-slide { min-width: 100%; aspect-ratio: 16/9; position: relative; }
        .swipe-overlay { position: absolute; inset: 0; z-index: 10; background: transparent; }
        .interaction-icon { font-size: 24px; cursor: pointer; color: #fff; }
        .server-btn { width: 100%; padding: 12px 5px; border-radius: 8px; font-size: 8px; font-weight: 800; border: 1px solid #1c1c1c; background: #0a0a0a; color: #fff; }
        .server-btn.active-link { border: 2px solid #fff; }
        .cast-wrapper { display: flex; overflow-x: auto; gap: 15px; padding: 15px 0; }
        .dl-link-btn { width: 100%; padding: 14px; border-radius: 12px; background: #000; color: #a1a1aa; font-size: 10px; font-weight: 800; text-transform: uppercase; text-align: center; border: 1px solid #1c1c1c; }

        #searchOverlay { display: none; position: fixed; inset: 0; background: #000; z-index: 2000; overflow-y: auto; }
        .search-header { position: sticky; top: 0; background: #000; display: flex; align-items: center; padding: 10px 15px; gap: 10px; border-bottom: 1px solid #1c1c1c; z-index: 100; }
        .search-input-box { flex-grow: 1; background: #262626; border-radius: 10px; padding: 8px 12px; display: flex; align-items: center; position: relative; }
        .search-input-box input { background: transparent; border: none; outline: none; color: #fff; font-size: 14px; width: 100%; }
        #smartSearchDropdown { position: absolute; top: 100%; left: 0; right: 0; background: #1a1a1a; border-radius: 0 0 10px 10px; border: 1px solid #333; display: none; z-index: 500; max-height: 300px; overflow-y: auto; }
        .smart-item { display: flex; align-items: center; padding: 10px; gap: 12px; border-bottom: 1px solid #262626; }
        .smart-item img { width: 35px; height: 50px; object-fit: cover; border-radius: 4px; }

        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: #000; border-top: 1px solid #1c1c1c; display: flex; justify-content: space-around; padding: 12px 0; z-index: 300; }
    </style>
</head>
<body>

    <div id="splashScreen">
        <div class="logo-a-container" style="transform: scale(1.5);">
            <div class="logo-a-shape"></div>
        </div>
        <p class="mt-6 text-[10px] tracking-[5px] font-bold uppercase text-zinc-500">amnesfubbia</p>
    </div>

    <div id="mainProfile">
        <div class="profile-header">
            <div class="top-bar">
                <div class="ig-logo-wrapper" onclick="location.reload()">
                    <h1 class="ig-logo">amnesfubbia</h1>
                    <i class="fa-solid fa-chevron-down text-[10px] ml-0.5"></i>
                    <span class="dot-notify"></span>
                </div>
                <div class="flex gap-5">
                    <i class="fa-regular fa-square-plus text-2xl"></i>
                    <i class="fa-solid fa-bars text-2xl"></i>
                </div>
            </div>

            <div class="profile-info">
                <div class="profile-pic-container">
                    <div class="profile-pic-logo"><div class="logo-a-container"><div class="logo-a-shape"></div></div></div>
                    <div class="add-story-btn"><i class="fa-solid fa-plus"></i></div>
                </div>
                <div class="stats">
                    <div class="stat-item" onclick="setFilter('movie')"><span class="stat-val">25.4rb</span><span class="stat-label">film</span></div>
                    <div class="stat-item" onclick="setFilter('tv')"><span class="stat-val">8.2rb</span><span class="stat-label">series</span></div>
                    <div class="stat-item" onclick="setFilter('short')"><span class="stat-val">1.5rb</span><span class="stat-label">short</span></div>
                </div>
            </div>

            <div class="bio">
                <div class="bio-name">amnesfubbia <i class="fa-solid fa-circle-check text-[#0095f6] text-[13px]"></i></div>
                <span>dari indonesia untuk dunia</span><br><span>By Anasteas</span>
            </div>

            <div class="action-buttons">
                <div class="btn-ig" id="btnNowPlaying" onclick="setSchedule('now_playing', this)">Sedang Tayang</div>
                <div class="btn-ig" id="btnUpcoming" onclick="setSchedule('upcoming', this)">Segera Tayang</div>
                <div class="btn-icon-sq" onclick="toggleFilterBar()"><i class="fa-solid fa-user-plus text-sm"></i></div>
            </div>

            <div id="filterBar">
                <div class="pill-grid grid grid-cols-3 gap-2">
                    <button class="pill" id="btnCountry" onclick="toggleFilter(event, 'countryDropdown')">Negara <i class="fa-solid fa-caret-down"></i></button>
                    <button class="pill" id="btnGenre" onclick="toggleFilter(event, 'genreDropdown')">Genre <i class="fa-solid fa-caret-down"></i></button>
                    <button class="pill" id="yearBtn" onclick="toggleFilter(event, 'yearDropdown')">Tahun <i class="fa-solid fa-caret-down"></i></button>
                </div>
            </div>
        </div>

        <div class="highlights-wrapper no-scrollbar"><div class="highlights-container no-scrollbar" id="highlightList"></div></div>

        <div class="tab-nav">
            <div class="tab-item active" onclick="switchTab('grid', this)"><i class="fa-solid fa-table-cells"></i></div>
            <div class="tab-item" onclick="switchTab('likes', this)"><i class="fa-regular fa-heart"></i></div>
            <div class="tab-item" onclick="switchTab('bookmarks', this)"><i class="fa-regular fa-bookmark"></i></div>
        </div>

        <main id="feedGrid" class="movie-grid"></main>
    </div>

    <div id="searchOverlay">
        <div class="search-header">
            <i class="fa-solid fa-arrow-left text-xl text-white" onclick="closeSearch()"></i>
            <div class="search-input-box">
                <i class="fa-solid fa-magnifying-glass text-zinc-500 text-xs mr-2"></i>
                <input type="text" id="searchInp" autocomplete="off" placeholder="Cari..." onkeydown="if(event.key==='Enter') searchAction()">
                <div id="smartSearchDropdown" class="no-scrollbar"></div>
            </div>
        </div>
        <div id="searchGrid" class="movie-grid"></div>
    </div>

    <div id="movieModal" class="modal-player">
        <div class="max-w-xl mx-auto pb-40">
            <div class="px-4 h-[54px] flex items-center border-b border-zinc-900 sticky top-0 bg-black z-50">
                <i class="fa-solid fa-chevron-left text-xl cursor-pointer" onclick="closeModal()"></i>
                <div class="flex-grow text-center text-[14px] font-bold truncate px-8" id="mTitle"></div>
            </div>
            <div id="castContainer" class="cast-wrapper px-4 no-scrollbar"></div>
            <div class="relative overflow-hidden">
                <div class="swipe-overlay" id="swipeOverlay"></div>
                <div class="carousel-track" id="carouselTrack"></div>
                <div id="carouselDots" class="flex justify-center gap-2 py-3"></div>
            </div>
            <div class="px-4 py-3 flex justify-between items-center">
                <div class="flex gap-4"><i id="btnLikeModal" class="interaction-icon"></i><i class="fa-regular fa-comment interaction-icon"></i></div>
                <i id="btnBookModal" class="interaction-icon"></i>
            </div>
            <div class="px-4">
                <p id="mDesc" class="text-sm leading-relaxed mb-1"></p>
                <p id="mTranslateBtn" class="text-[11px] text-zinc-400 font-bold mb-4 cursor-pointer hidden" onclick="handleTranslate()">Lihat Terjemahan...</p>
                <div id="serverList" class="grid grid-cols-3 gap-2 mt-6"></div>
                <div class="grid grid-cols-2 gap-2 mt-4">
                    <button class="dl-link-btn" onclick="window.open(`https://dl.vidsrc.vip/${window.currentMediaType}/${window.currentMediaId}`)">Download 1</button>
                    <button class="dl-link-btn" onclick="window.open(`https://multiembed.mov/directstream.php?video_id=${window.currentMediaId}&tmdb=1`)">Download 2</button>
                </div>
            </div>
        </div>
    </div>

    <div id="filterOverlay" onclick="closeD()"></div>
    <div id="countryDropdown" class="filter-dropdown no-scrollbar"></div>
    <div id="genreDropdown" class="filter-dropdown no-scrollbar"></div>
    <div id="yearDropdown" class="filter-dropdown no-scrollbar"></div>

    <nav class="bottom-nav">
        <i class="fa-solid fa-house text-xl" onclick="location.reload()"></i>
        <i class="fa-solid fa-magnifying-glass text-xl" onclick="openSearch()"></i>
        <i class="fa-regular fa-bookmark text-xl" onclick="switchTab('bookmarks', this)"></i>
    </nav>

    <script>
        const API_KEY = 'bfa7df5310c9974f62f26c6789a8c00d';
        let page = 1, loading = false, currentType = 'movie', currentGenre = '', currentYear = '', currentCountry = '', currentSchedule = 'trending', searchQuery = '', currentLibMode = false;
        let globalFullDesc = "", currentIdx = 0, startX = 0;

        window.onload = () => {
            setTimeout(() => { document.getElementById('splashScreen').style.opacity = '0'; setTimeout(() => document.getElementById('splashScreen').style.display = 'none', 500); }, 2000);
            initFilters(); initHighlights(); loadFeed(); setupSwipe(); initSmartSearch();
        };

        // INTEGRITAS: Menu Film, Series, Short
        function setFilter(type) {
            currentType = type;
            currentSchedule = 'trending';
            searchQuery = '';
            loadFeed(true);
        }

        async function loadFeed(isNew = true) {
            if(loading) return; loading = true;
            const isSearch = document.getElementById('searchOverlay').style.display === 'block';
            const grid = isSearch ? document.getElementById('searchGrid') : document.getElementById('feedGrid');
            if(isNew) { page = 1; grid.innerHTML = ''; }

            let url;
            if(searchQuery) {
                url = `https://api.themoviedb.org/3/search/multi?query=${encodeURIComponent(searchQuery)}&api_key=${API_KEY}&language=id-ID&page=${page}`;
            } else {
                let endpoint = (currentType === 'tv') ? 'discover/tv' : 'discover/movie';
                url = `https://api.themoviedb.org/3/${endpoint}?api_key=${API_KEY}&language=id-ID&page=${page}&include_adult=false&sort_by=popularity.desc`;
                if(currentType === 'short') url = `https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&with_runtime.lte=40&with_runtime.gte=5&page=${page}`;
                if(currentCountry) url += `&with_origin_country=${currentCountry}`;
                if(currentGenre) url += `&with_genres=${currentGenre}`;
                if(currentYear) url += (currentType === 'tv' ? `&first_air_date_year=${currentYear}` : `&primary_release_year=${currentYear}`);
            }

            try {
                const res = await fetch(url);
                const data = await res.json();
                renderGrid(data.results || [], grid);
            } catch(e) {}
            loading = false;
        }

        function renderGrid(items, grid) {
            items.forEach(m => {
                if(!m.poster_path) return;
                const mType = m.media_type || (currentType === 'tv' ? 'tv' : 'movie');
                const card = document.createElement('div');
                card.className = 'post-card';
                card.onclick = () => openModal(m.id, mType);
                card.innerHTML = `<div class="badge-rating">★ ${(m.vote_average||0).toFixed(1)}</div><div class="badge-type">${mType==='tv'?'SERIES':'FILM'}</div><img src="https://image.tmdb.org/t/p/w342${m.poster_path}">`;
                grid.appendChild(card);
            });
        }

        async function openModal(id, type) {
            window.currentMediaId = id; window.currentMediaType = type;
            document.getElementById('movieModal').style.display = 'block'; document.body.style.overflow = 'hidden';
            const res = await fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=${API_KEY}&language=id-ID&append_to_response=videos,credits`);
            const d = await res.json();
            
            document.getElementById('mTitle').innerText = d.title || d.name;
            document.getElementById('mDesc').innerText = d.overview || "Sinopsis tidak tersedia.";
            globalFullDesc = d.overview;
            if(!d.overview) document.getElementById('mTranslateBtn').classList.add('hidden'); else document.getElementById('mTranslateBtn').classList.remove('hidden');

            document.getElementById('castContainer').innerHTML = (d.credits?.cast || []).slice(0, 10).map(c => `<div class="cast-item min-w-[65px] text-center"><img src="${c.profile_path ? 'https://image.tmdb.org/t/p/w185' + c.profile_path : 'https://www.themoviedb.org/assets/2/v4/glyphicons/basic/glyphicons-basic-4-user-3245c3f3347706a035c9744ffaa5d174e48be3b860667e406723f3bc8160f47e.svg'}" class="w-14 h-14 rounded-full object-cover mx-auto"><span class="text-[9px] block mt-1">${c.name}</span></div>`).join('');

            const vids = (d.videos?.results || []).filter(v => v.site === 'YouTube').slice(0, 3);
            const track = document.getElementById('carouselTrack'), dots = document.getElementById('carouselDots');
            track.innerHTML = ''; dots.innerHTML = '';
            currentIdx = 0; track.style.transform = `translateX(0)`;
            
            if(vids.length > 0) {
                vids.forEach((v, i) => {
                    track.innerHTML += `<div class="carousel-slide"><iframe src="https://www.youtube.com/embed/${v.key}" class="w-full h-full" allowfullscreen></iframe></div>`;
                    dots.innerHTML += `<div class="dot w-1.5 h-1.5 rounded-full ${i===0?'bg-blue-500':'bg-zinc-700'}"></div>`;
                });
            } else {
                track.innerHTML = `<div class="carousel-slide"><iframe src="https://vidrock.net/embed/${type}/${id}" class="w-full h-full" allowfullscreen></iframe></div>`;
            }
            document.getElementById('serverList').innerHTML = `<button class="server-btn" onclick="playVid('https://vidrock.net/embed/${type}/${id}', this)">Server 1</button><button class="server-btn" onclick="playVid('https://vidsrc.me/embed/${type}?tmdb=${id}', this)">Server 2</button>`;
            updateLibButtons(id);
        }

        function initSmartSearch() {
            const inp = document.getElementById('searchInp'), drop = document.getElementById('smartSearchDropdown');
            inp.addEventListener('input', async () => {
                const q = inp.value.trim(); if(q.length < 2) { drop.style.display = 'none'; return; }
                const res = await fetch(`https://api.themoviedb.org/3/search/multi?query=${encodeURIComponent(q)}&api_key=${API_KEY}&language=id-ID`);
                const data = await res.json();
                drop.innerHTML = (data.results || []).slice(0, 5).map(m => `<div class="smart-item" onclick="openModal(${m.id}, '${m.media_type}')"><img src="https://image.tmdb.org/t/p/w92${m.poster_path}"><div><div class="text-xs font-bold">${m.title||m.name}</div><div class="text-[10px] text-zinc-500">${m.media_type}</div></div></div>`).join('');
                drop.style.display = 'block';
            });
        }

        function openSearch() { document.getElementById('searchOverlay').style.display = 'block'; document.getElementById('searchInp').focus(); }
        function closeSearch() { document.getElementById('searchOverlay').style.display = 'none'; searchQuery = ''; document.getElementById('smartSearchDropdown').style.display = 'none'; }
        function searchAction() { searchQuery = document.getElementById('searchInp').value; loadFeed(true); document.getElementById('smartSearchDropdown').style.display = 'none'; }
        function playVid(url, el) { document.getElementById('carouselTrack').innerHTML = `<div class="carousel-slide"><iframe src="${url}" class="w-full h-full" allowfullscreen></iframe></div>`; document.querySelectorAll('.server-btn').forEach(b => b.classList.remove('active-link')); el.classList.add('active-link'); }
        function closeModal() { document.getElementById('movieModal').style.display = 'none'; document.body.style.overflow = 'auto'; }
        function toggleFilterBar() { const b = document.getElementById('filterBar'); b.style.display = b.style.display === 'block' ? 'none' : 'block'; }
        
        function setupSwipe() {
            const el = document.getElementById('swipeOverlay');
            el.addEventListener('touchstart', e => startX = e.touches[0].clientX);
            el.addEventListener('touchend', e => {
                const diff = startX - e.changedTouches[0].clientX;
                const track = document.getElementById('carouselTrack'), slides = track.children.length;
                if(Math.abs(diff) > 50) {
                    if(diff > 0 && currentIdx < slides - 1) currentIdx++;
                    else if(diff < 0 && currentIdx > 0) currentIdx--;
                    track.style.transform = `translateX(-${currentIdx * 100}%)`;
                    updateDots();
                }
            });
        }
        function updateDots() { document.querySelectorAll('#carouselDots .dot').forEach((d, i) => { d.classList.toggle('bg-blue-500', i === currentIdx); d.classList.toggle('bg-zinc-700', i !== currentIdx); }); }
        
        // Storage & Library logic as requested (No simplified)
        function updateLibButtons(id) {
            const likes = JSON.parse(localStorage.getItem('likes') || '[]');
            const books = JSON.parse(localStorage.getItem('bookmarks') || '[]');
            document.getElementById('btnLikeModal').className = likes.includes(id) ? 'fa-solid fa-heart interaction-icon text-red-500' : 'fa-regular fa-heart interaction-icon';
            document.getElementById('btnBookModal').className = books.includes(id) ? 'fa-solid fa-bookmark interaction-icon text-white' : 'fa-regular fa-bookmark interaction-icon';
            document.getElementById('btnLikeModal').onclick = () => toggleLib('likes', id);
            document.getElementById('btnBookModal').onclick = () => toggleLib('bookmarks', id);
        }
        function toggleLib(key, id) {
            let list = JSON.parse(localStorage.getItem(key) || '[]');
            if(list.includes(id)) list = list.filter(i => i !== id); else list.push(id);
            localStorage.setItem(key, JSON.stringify(list)); updateLibButtons(id);
        }

        function initFilters() {
            const yD = document.getElementById('yearDropdown');
            let yH = ''; for(let y=2026; y>=1990; y--) yH += `<div class="filter-item" onclick="setYear(${y})">${y}</div>`;
            yD.innerHTML = yH;
        }
        function setYear(y) { currentYear=y; document.getElementById('yearBtn').innerText=y; closeD(); loadFeed(true); }
        function toggleFilter(e, id) { e.stopPropagation(); document.getElementById(id).style.display = 'block'; document.getElementById('filterOverlay').style.display = 'block'; }
        function closeD() { document.querySelectorAll('.filter-dropdown').forEach(d=>d.style.display='none'); document.getElementById('filterOverlay').style.display='none'; }
        
        async function switchTab(mode, el) {
            document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            if(mode === 'grid') { currentLibMode = false; loadFeed(true); }
            else { currentLibMode = true; renderLibrary(mode); }
        }
        function renderLibrary(key) {
            const ids = JSON.parse(localStorage.getItem(key) || '[]');
            const grid = document.getElementById('feedGrid'); grid.innerHTML = '';
            ids.forEach(async id => {
                const res = await fetch(`https://api.themoviedb.org/3/movie/${id}?api_key=${API_KEY}&language=id-ID`);
                const m = await res.json(); if(m.id) renderGrid([m], grid);
            });
        }

        function initHighlights() {
            const hls = [{n:'Disney', l:'DSNY', g:'16'}, {n:'Anime', l:'ANIM', g:'16'}];
            const cont = document.getElementById('highlightList');
            hls.forEach(h => {
                cont.innerHTML += `<div class="highlight-item" onclick="currentGenre='${h.g}';loadFeed(true)"><div class="highlight-circle"><span class="hl-logo">${h.l}</span></div><div class="highlight-text">${h.n}</div></div>`;
            });
        }
        window.onscroll = () => { if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 1000 && !loading && !currentLibMode) { page++; loadFeed(false); } };
    </script>
</body>
</html>
