<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amnesfubbia Film - Katalog Film Indonesia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { background-color: #080808; color: #ffffff; font-family: 'Inter', sans-serif; margin: 0; padding: 0; overflow-x: hidden; }
        
        .glass-nav { 
            background: rgba(10, 10, 10, 0.9) !important; 
            backdrop-filter: blur(20px); 
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 1000;
        }

        .movie-card { transition: 0.3s; border-radius: 12px; overflow: hidden; background: #121212; height: 100%; cursor: pointer; position: relative; border: 1px solid rgba(255,255,255,0.05); }
        .movie-card:hover { transform: translateY(-5px); border-color: #ef4444; }
        
        .type-badge { position: absolute; top: 6px; left: 6px; background: #ef4444; color: white; font-size: 6px; font-weight: 900; padding: 2px 5px; border-radius: 4px; text-transform: uppercase; z-index: 20; }
        .fav-btn { position: absolute; bottom: 35px; right: 8px; color: rgba(255,255,255,0.5); font-size: 14px; z-index: 30; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); transition: 0.3s; cursor: pointer; }
        .fav-btn.active { color: #ef4444; transform: scale(1.2); }

        /* Skeleton Loading */
        .skeleton { background: #1a1a1a; border-radius: 12px; aspect-ratio: 2/3; position: relative; overflow: hidden; }
        .skeleton::after {
            content: ""; position: absolute; inset: 0;
            background: linear-gradient(90deg, #1a1a1a 0, #2a2a2a 50%, #1a1a1a 100%);
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

        .modal { display: none; position: fixed; inset: 0; z-index: 3000; background: rgba(0,0,0,0.98); overflow-y: auto; backdrop-filter: blur(25px); }
        #modalBackdrop { position: absolute; inset: 0; background-size: cover; background-position: center; filter: blur(80px) brightness(0.1); opacity: 0.8; z-index: -1; }
        
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .btn-server { @apply w-full py-2.5 rounded-xl text-[10px] font-black uppercase italic transition-all active:scale-95 text-center block; }
    </style>
</head>
<body onload="initApp()">

    <nav class="fixed top-0 w-full glass-nav p-3">
        <div class="container mx-auto space-y-3">
            <div class="flex items-center gap-2">
                <div class="flex items-center gap-1 cursor-pointer shrink-0" onclick="location.reload()">
                    <span class="text-xl font-black text-white italic tracking-tighter">AMNES</span>
                    <span class="text-xl font-black text-red-600 italic">FILM</span>
                </div>
                
                <div class="relative flex-grow">
                    <input type="text" id="searchInput" onkeypress="if(event.key==='Enter') searchIndo()" placeholder="Cari film Indonesia..." class="w-full bg-[#000]/60 p-2.5 rounded-xl border border-white/10 outline-none focus:border-red-600 text-white text-xs">
                </div>
                <button onclick="searchIndo()" class="bg-red-600 px-4 py-2.5 rounded-xl font-black text-[10px] uppercase">Cari</button>
            </div>
            
            <div class="flex gap-2 overflow-x-auto pb-1 scrollbar-hide">
                <select id="genreFilter" onchange="resetAndLoad()" class="bg-[#000] p-2 rounded-lg outline-none text-white font-bold text-[10px] uppercase border border-white/10">
                    <option value="">Semua Genre</option>
                    <option value="27">Horor</option>
                    <option value="35">Komedi</option>
                    <option value="18">Drama</option>
                    <option value="28">Aksi</option>
                    <option value="10749">Romantis</option>
                </select>
                <select id="typeFilter" onchange="resetAndLoad()" class="bg-[#000] p-2 rounded-lg outline-none text-red-500 font-bold text-[10px] uppercase border border-white/10">
                    <option value="movie">Layar Lebar</option>
                    <option value="tv">Series</option>
                </select>
                <button onclick="showFavorites()" class="bg-white/10 text-white px-4 py-2 rounded-lg text-[10px] font-black uppercase whitespace-nowrap">My List ❤️</button>
            </div>
        </div>
    </nav>

    <main class="container mx-auto px-2 pt-36 pb-10 min-h-screen">
        <div id="movieGrid" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-6 gap-2 sm:gap-4"></div>
        <div id="scrollLoader" class="flex justify-center p-10 hidden">
            <div class="w-8 h-8 border-4 border-red-600 border-t-transparent rounded-full animate-spin"></div>
        </div>
    </main>

    <div id="movieModal" class="modal flex items-center justify-center p-2">
        <div class="bg-[#0a0a0a] w-full max-w-6xl rounded-3xl overflow-hidden relative border border-white/10 shadow-2xl">
            <div id="modalBackdrop"></div>
            <button onclick="closeModal()" class="absolute top-5 right-5 text-white bg-black/40 hover:bg-red-600 w-10 h-10 rounded-full z-50 flex items-center justify-center">✕</button>
            <div id="modalContent" class="flex flex-col md:flex-row relative z-10 max-h-[90vh] overflow-y-auto scrollbar-hide"></div>
        </div>
    </div>

    <script>
        const API_KEY = 'bfa7df5310c9974f62f26c6789a8c00d';
        const IMG_URL = 'https://image.tmdb.org/t/p/w500';
        const ORI_IMG = 'https://image.tmdb.org/t/p/original';
        let currentPage = 1;
        let isLoading = false;
        let isSearchMode = false;
        let favorites = JSON.parse(localStorage.getItem('amnesIndoFavs')) || [];

        function initApp() { loadMovies(false); }
        
        window.onscroll = function() {
            if (!isLoading && !isSearchMode && (window.innerHeight + window.pageYOffset) >= document.body.offsetHeight - 900) loadMovies(true);
        };

        function resetAndLoad() { 
            currentPage = 1; 
            isSearchMode = false; 
            document.getElementById('movieGrid').innerHTML = ''; 
            loadMovies(false); 
        }

        async function loadMovies(isNextPage = false) {
            if (isLoading) return;
            if (!isNextPage) document.getElementById('movieGrid').innerHTML = Array(12).fill('<div class="skeleton"></div>').join('');
            
            isLoading = true;
            if (isNextPage) currentPage++;
            document.getElementById('scrollLoader').classList.remove('hidden');
            
            const type = document.getElementById('typeFilter').value;
            const genre = document.getElementById('genreFilter').value;
            
            let url = `https://api.themoviedb.org/3/discover/${type}?api_key=${API_KEY}&with_origin_country=ID&language=id-ID&page=${currentPage}&sort_by=popularity.desc`;
            if (genre) url += `&with_genres=${genre}`;
            
            try {
                const res = await fetch(url);
                const data = await res.json();
                displayMovies(data.results, isNextPage);
            } catch(e) {
                console.error("Gagal memuat data");
            } finally { 
                isLoading = false; 
                document.getElementById('scrollLoader').classList.add('hidden'); 
            }
        }

        function displayMovies(movies, append = false) {
            const grid = document.getElementById('movieGrid');
            if (!append) grid.innerHTML = '';
            movies.forEach(item => {
                if(!item.poster_path) return;
                const isTV = item.name !== undefined;
                const isFav = favorites.some(f => f.id === item.id);
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.innerHTML = `
                    <div class="type-badge">${isTV?'SERIES':'FILM'}</div>
                    <div class="fav-btn ${isFav?'active':''}" onclick="toggleFav(event, this, ${JSON.stringify(item).replace(/"/g, '&quot;')})">
                        <i class="fas fa-heart"></i>
                    </div>
                    <img src="${IMG_URL + item.poster_path}" loading="lazy" class="w-full aspect-[2/3] object-cover" onclick="showDetail(${item.id}, '${isTV?'tv':'movie'}')">
                    <div class="p-2" onclick="showDetail(${item.id}, '${isTV?'tv':'movie'}')">
                        <h3 class="text-[8px] font-bold truncate uppercase text-gray-100">${item.title || item.name}</h3>
                    </div>`;
                grid.appendChild(card);
            });
        }

        async function showDetail(id, type) {
            const res = await fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=${API_KEY}&append_to_response=videos&language=id-ID`);
            const movie = await res.json();
            document.getElementById('modalBackdrop').style.backgroundImage = `url(${ORI_IMG + (movie.backdrop_path || movie.poster_path)})`;
            
            // Mencari trailer YouTube
            const video = movie.videos.results.find(v => v.site === 'YouTube' && (v.type === 'Trailer' || v.type === 'Teaser')) || movie.videos.results[0];
            const trailerHtml = video 
                ? `<iframe class="w-full h-full" src="https://www.youtube.com/embed/${video.key}" frameborder="0" allowfullscreen></iframe>`
                : `<div class="w-full h-full flex items-center justify-center bg-zinc-900 text-[10px] uppercase font-bold text-zinc-500">Trailer tidak tersedia</div>`;

            // Server Links (Sesuai Urutan Anda)
            const streamServers = [
                { name: 'VidRock', url: `https://vidrock.net/embed/${type}/${movie.id}` },
                { name: 'RGShows', url: `https://www.rgshows.ru/embed/${type}/${movie.id}` },
                { name: 'VidLink Pro', url: `https://vidlink.pro/embed/${type}/${movie.id}` },
                { name: 'VidNest', url: `https://vidnest.fun/embed/${type}/${movie.id}` },
                { name: 'VidFast', url: `https://vidfast.pro/embed/${type}/${movie.id}` },
                { name: 'VidSrc VIP', url: `https://vidsrc.vip/embed/${type}/${movie.id}` }
            ];

            const downloadServers = [
                { name: 'DL VidSrc VIP', url: `https://dl.vidsrc.vip/${type}/${movie.id}` },
                { name: 'DL VidRock', url: `https://dl.vidrock.net/${type}/${movie.id}` },
                { name: 'DL VidLink', url: `https://dl.vidlink.pro/${type}/${movie.id}` },
                { name: 'DL Vidsrc RU', url: `https://dl.vidsrc-embed.ru/embed/${type}/${movie.id}` },
                { name: 'DL VidRock VIP', url: `https://dl.vidrock.vip/${type}/${movie.id}` },
                { name: 'DL VidLink VIP', url: `https://dl.vidlink.vip/${type}/${movie.id}` }
            ];

            document.getElementById('modalContent').innerHTML = `
                <div class="md:w-1/4 p-6 border-r border-white/5 bg-black/20">
                    <img src="${IMG_URL + movie.poster_path}" class="w-full rounded-xl border border-white/10 mb-4">
                    <p class="text-[10px] font-black text-gray-500 uppercase mb-2">Streaming Server</p>
                    <div class="grid grid-cols-1 gap-2 mb-4">
                        ${streamServers.map(s => `<a href="${s.url}" target="_blank" class="btn-server bg-red-600 text-white">${s.name}</a>`).join('')}
                    </div>
                    <p class="text-[10px] font-black text-gray-500 uppercase mb-2">Download Server</p>
                    <div class="grid grid-cols-1 gap-2">
                        ${downloadServers.map(s => `<a href="${s.url}" target="_blank" class="btn-server bg-zinc-800 text-gray-300 border border-white/5">${s.name}</a>`).join('')}
                    </div>
                </div>
                <div class="md:w-3/4 p-8">
                    <h2 class="text-4xl font-black text-white uppercase italic mb-2 tracking-tighter">${movie.title || movie.name}</h2>
                    <div class="flex items-center gap-3 mb-6">
                        <span class="text-red-600 font-black text-xs italic">⭐ ${movie.vote_average.toFixed(1)}</span>
                        <span class="text-white/40 text-[10px] uppercase font-bold">${movie.genres.map(g => g.name).join(' • ')}</span>
                    </div>
                    <div class="mb-8 rounded-2xl overflow-hidden border border-white/10 aspect-video bg-black shadow-2xl">
                        ${trailerHtml}
                    </div>
                    <p class="text-[10px] font-black text-red-600 uppercase mb-2 italic tracking-widest">Sinopsis</p>
                    <p class="text-sm text-gray-300 leading-relaxed italic">"${movie.overview || 'Sinopsis belum tersedia untuk judul ini.'}"</p>
                </div>`;

            document.getElementById('movieModal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function toggleFav(e, el, item) {
            e.stopPropagation();
            const idx = favorites.findIndex(f => f.id === item.id);
            if(idx === -1) { favorites.push(item); el.classList.add('active'); }
            else { favorites.splice(idx, 1); el.classList.remove('active'); }
            localStorage.setItem('amnesIndoFavs', JSON.stringify(favorites));
        }

        async function searchIndo() {
            const q = document.getElementById('searchInput').value; 
            if (!q) return;
            isSearchMode = true;
            document.getElementById('movieGrid').innerHTML = Array(6).fill('<div class="skeleton"></div>').join('');
            const res = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${API_KEY}&query=${encodeURIComponent(q)}&language=id-ID`);
            const data = await res.json();
            displayMovies(data.results.filter(m => (m.origin_country && m.origin_country.includes('ID')) || m.original_language === 'id'), false);
        }

        function showFavorites() { isSearchMode = true; displayMovies(favorites, false); }
        function closeModal() { document.getElementById('movieModal').style.display = 'none'; document.body.style.overflow = 'auto'; }
        window.onclick = (e) => { if (e.target.id == 'movieModal') closeModal(); }
    </script>
</body>
</html>
