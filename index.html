<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AMNESFUBBIA FILM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { background-color: #030303; color: #e5e5e5; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; }
        .nav-glass { background: rgba(3, 3, 3, 0.98); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.05); position: fixed; top: 0; width: 100%; z-index: 1000; }
        .movie-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 10px; }
        @media (min-width: 768px) { .movie-grid { grid-template-columns: repeat(6, 1fr); gap: 20px; } }
        .movie-card { transition: 0.4s; background: #0f0f0f; border-radius: 12px; overflow: hidden; border: 1px solid rgba(255,255,255,0.03); cursor: pointer; }
        .movie-card:hover { transform: scale(1.05); border-color: #ef4444; }
        .movie-card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; }
        .modal { display: none; position: fixed; inset: 0; z-index: 2000; background: rgba(0,0,0,0.98); overflow-y: auto; }
        .modal-content { background: #080808; width: 100%; max-width: 1100px; margin: 0 auto; min-height: 100vh; position: relative; }
        @media (min-width: 768px) { .modal-content { min-height: auto; margin: 20px auto; border-radius: 24px; border: 1px solid #222; } }
        .btn-premium { @apply flex items-center justify-center gap-3 py-3 px-6 rounded-xl text-[10px] font-black uppercase tracking-widest transition-all duration-300 mb-3 w-full; background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%); border: 1px solid rgba(255,255,255,0.08); }
        .btn-premium:hover { border-color: #ef4444; transform: translateY(-3px); }
        .btn-dl-utama { color: #10b981; border-color: rgba(16, 185, 129, 0.3); background: rgba(16, 185, 129, 0.05) !important; font-size: 12px !important; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
    </style>
</head>
<body onload="initApp()">

    <nav class="nav-glass p-3">
        <div class="container mx-auto space-y-3">
            <div class="flex items-center gap-3">
                <div class="shrink-0 cursor-pointer" onclick="location.reload()">
                    <span class="text-xl font-black italic uppercase">AMNESFUBBIA<span class="text-red-600">FILM</span></span>
                </div>
                <div class="relative flex-grow">
                    <input type="text" id="searchInput" onkeypress="if(event.key==='Enter') searchMulti()" placeholder="Cari Film atau Aktor..." class="w-full bg-white/5 border border-white/10 p-3 rounded-xl text-xs outline-none focus:border-red-600 transition-all">
                </div>
            </div>
            <div class="flex gap-2 overflow-x-auto scrollbar-hide pb-1">
                <select id="typeFilter" onchange="resetAndLoad()" class="bg-zinc-900 text-white font-bold text-[10px] p-2.5 rounded-lg border border-white/5 uppercase">
                    <option value="movie">FILM</option>
                    <option value="tv">SERIES</option>
                </select>
                <select id="genreFilter" onchange="resetAndLoad()" class="bg-zinc-900 text-white text-[10px] font-bold p-2.5 rounded-lg border border-white/5 uppercase">
                    <option value="">GENRE</option>
                    <option value="28">Aksi</option><option value="12">Petualangan</option><option value="35">Komedi</option><option value="27">Horor</option><option value="18">Drama</option><option value="10749">Romantis</option>
                </select>
                <select id="yearFilter" onchange="resetAndLoad()" class="bg-zinc-900 text-white text-[10px] font-bold p-2.5 rounded-lg border border-white/5 uppercase">
                    <option value="">TAHUN</option>
                    <script>for(let y=2026; y>=1920; y--) document.write(`<option value="${y}">${y}</option>`);</script>
                </select>
            </div>
        </div>
    </nav>

    <main class="container mx-auto pt-32 pb-20 px-2">
        <div id="movieGrid" class="movie-grid"></div>
        <div id="loadMoreContainer" class="flex justify-center mt-10">
            <button onclick="loadMore()" class="bg-zinc-900 border border-white/10 text-white font-black text-[10px] uppercase px-12 py-4 rounded-full">Muat Lebih Banyak</button>
        </div>
    </main>

    <div id="movieModal" class="modal">
        <div class="modal-content">
            <button onclick="closeModal()" class="fixed top-5 right-5 bg-black/80 text-white w-10 h-10 rounded-full z-[3000] border border-white/10">✕</button>
            <div class="flex flex-col lg:flex-row">
                <div class="lg:w-2/3 p-5 lg:p-10 border-r border-white/5">
                    <h2 id="mTitle" class="text-2xl lg:text-4xl font-black italic uppercase mb-2 text-white"></h2>
                    <p id="mMeta" class="text-[10px] font-bold text-zinc-500 uppercase mb-6"></p>
                    <div class="aspect-video bg-black rounded-2xl overflow-hidden mb-8 border border-white/10">
                        <iframe id="mainPlayer" class="w-full h-full" allowfullscreen allow="autoplay"></iframe>
                    </div>
                    <p id="mDesc" class="text-sm text-zinc-400 leading-relaxed italic mb-8"></p>
                    <p class="text-[9px] font-black text-red-600 uppercase mb-4 tracking-widest">Pemeran (Klik untuk Cari Film Lainnya)</p>
                    <div id="mCast" class="flex overflow-x-auto gap-4 scrollbar-hide"></div>
                </div>

                <div class="lg:w-1/3 p-5 lg:p-10 bg-[#050505]">
                    <p class="text-[10px] font-black text-zinc-600 uppercase mb-4 tracking-widest">Streaming Server</p>
                    <div id="streamLinks"></div>
                    <div class="my-8 border-t border-white/5"></div>
                    <p class="text-[10px] font-black text-zinc-600 uppercase mb-4 tracking-widest">Download WEB-DL</p>
                    <div id="downloadLinks"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = 'bfa7df5310c9974f62f26c6789a8c00d';
        const IMG_BASE = 'https://image.tmdb.org/t/p/w500';
        let currentPage = 1;

        async function loadMovies(append = false) {
            const type = document.getElementById('typeFilter').value;
            const genre = document.getElementById('genreFilter').value;
            const year = document.getElementById('yearFilter').value;
            let url = `https://api.themoviedb.org/3/discover/${type}?api_key=${API_KEY}&with_origin_country=ID&language=id-ID&page=${currentPage}&sort_by=popularity.desc`;
            if (genre) url += `&with_genres=${genre}`;
            if (year) url += `&primary_release_year=${year}&first_air_date_year=${year}`;

            const res = await fetch(url);
            const data = await res.json();
            const grid = document.getElementById('movieGrid');
            if (!append) grid.innerHTML = '';
            data.results.forEach(m => {
                const div = document.createElement('div');
                div.className = 'movie-card';
                div.onclick = () => showDetail(m.id, type);
                div.innerHTML = `<img src="${m.poster_path ? IMG_BASE + m.poster_path : 'https://via.placeholder.com/500x750'}"><div class="p-3"><p class="text-[9px] font-black uppercase truncate">${m.title || m.name}</p></div>`;
                grid.appendChild(div);
            });
        }

        async function showDetail(id, type) {
            const res = await fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=${API_KEY}&append_to_response=videos,credits&language=id-ID`);
            const m = await res.json();
            document.getElementById('mTitle').innerText = m.title || m.name;
            document.getElementById('mMeta').innerText = `${m.release_date?.split('-')[0] || ''} • ${m.genres.map(g=>g.name).join(', ')} • ⭐ ${m.vote_average.toFixed(1)}`;
            document.getElementById('mDesc').innerText = m.overview || "Sinopsis belum tersedia.";
            
            // Logic Trailer (YouTube & Vimeo In-Frame)
            const video = m.videos.results.find(v => (v.site === 'YouTube' || v.site === 'Vimeo') && v.type === 'Trailer') || m.videos.results[0];
            let trailerUrl = '';
            if (video) {
                if (video.site === 'YouTube') trailerUrl = `https://www.youtube.com/embed/${video.key}?autoplay=1`;
                else if (video.site === 'Vimeo') trailerUrl = `https://player.vimeo.com/video/${video.key}?autoplay=1`;
            }
            document.getElementById('mainPlayer').src = trailerUrl;

            // 3 Server Streaming
            document.getElementById('streamLinks').innerHTML = `
                <button onclick="changePlayer('https://vidsrc.xyz/embed/${type}/${id}')" class="btn-premium text-red-500"><i class="fa-solid fa-play"></i> Server 1 (XYZ)</button>
                <button onclick="changePlayer('https://vidsrc.to/embed/${type}/${id}')" class="btn-premium text-red-500"><i class="fa-solid fa-play"></i> Server 2 (TO)</button>
                <button onclick="changePlayer('https://vidrock.net/embed/${type}/${id}')" class="btn-premium text-red-500"><i class="fa-solid fa-play"></i> Server 3 (PRO)</button>
            `;
            
            // Link Download Tunggal (Sesuai Permintaan)
            document.getElementById('downloadLinks').innerHTML = `
                <a href="https://dl.vidsrc.vip/${type}/${id}" target="_blank" class="btn-premium btn-dl-utama">
                    <i class="fa-solid fa-download"></i> DOWNLOAD WEB-DL (VIP)
                </a>
            `;

            // Cast Clickable Search
            const castCont = document.getElementById('mCast');
            castCont.innerHTML = m.credits.cast.slice(0, 10).map(c => `
                <div class="text-center shrink-0 cursor-pointer" onclick="searchByActor('${c.name}')">
                    <img src="${c.profile_path ? 'https://image.tmdb.org/t/p/w185'+c.profile_path : 'https://via.placeholder.com/100x100'}" class="w-16 h-16 rounded-full object-cover border border-zinc-800">
                    <p class="text-[8px] mt-2 text-zinc-500">${c.name}</p>
                </div>
            `).join('');

            document.getElementById('movieModal').style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        function initApp() { loadMovies(); }
        function closeModal() { document.getElementById('movieModal').style.display = 'none'; document.getElementById('mainPlayer').src = ''; document.body.style.overflow = 'auto'; }
        function changePlayer(url) { document.getElementById('mainPlayer').src = url + "?autoplay=1"; }
        function loadMore() { currentPage++; loadMovies(true); }
        function resetAndLoad() { currentPage = 1; loadMovies(); }

        async function searchMulti() {
            const q = document.getElementById('searchInput').value; if(!q) return;
            const res = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${API_KEY}&query=${encodeURIComponent(q)}&language=id-ID`);
            const data = await res.json();
            const grid = document.getElementById('movieGrid'); grid.innerHTML = '';
            data.results.forEach(m => {
                if(!m.poster_path) return;
                const div = document.createElement('div'); div.className = 'movie-card';
                div.onclick = () => showDetail(m.id, m.media_type || 'movie');
                div.innerHTML = `<img src="${IMG_BASE + m.poster_path}"><div class="p-3"><p class="text-[9px] font-black uppercase truncate">${m.title || m.name}</p></div>`;
                grid.appendChild(div);
            });
            document.getElementById('loadMoreContainer').style.display = 'none';
        }

        // Fungsi klik pemeran langsung cari film lainnya
        function searchByActor(name) {
            closeModal();
            document.getElementById('searchInput').value = name;
            searchMulti();
            window.scrollTo({top: 0, behavior: 'smooth'});
        }
    </script>
</body>
</html>
