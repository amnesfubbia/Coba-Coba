<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AMNESFUBBIA FILM INDONESIA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        
        body { background-color: #050505; color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; }
        
        /* Navbar Glass Effect */
        .nav-fixed { position: fixed; top: 0; width: 100%; z-index: 50; background: rgba(5, 5, 5, 0.95); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }
        
        /* Grid Layout yang Stabil (Tidak akan acak-acakan) */
        .grid-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 10px; padding-top: 160px; padding-bottom: 80px; }
        @media (min-width: 768px) { .grid-container { grid-template-columns: repeat(6, 1fr); gap: 20px; padding: 20px; padding-top: 160px; } }

        .card { background: #111; border-radius: 10px; overflow: hidden; position: relative; aspect-ratio: 2/3; border: 1px solid #222; }
        .card img { width: 100%; height: 100%; object-fit: cover; }

        /* MODAL FIX (Agar Judul tidak nabrak X) */
        .modal { display: none; position: fixed; inset: 0; z-index: 100; background: black; overflow-y: auto; }
        .modal-body { min-height: 100vh; background: #080808; padding: 20px; }
        @media(min-width: 768px){ .modal-body { padding: 40px; max-width: 1000px; margin: 0 auto; } }

        /* Judul Modal Spesifik */
        .modal-title { 
            font-size: 1.2rem; 
            font-weight: 800; 
            text-transform: uppercase; 
            padding-right: 60px; /* Jarak aman biar gak nabrak X */
            margin-bottom: 5px; 
            line-height: 1.3;
        }

        /* Tombol Merah Seragam (Streaming & Download SAMA PERSIS) */
        .btn-red {
            display: flex; justify-content: space-between; align-items: center;
            width: 100%; padding: 15px; margin-bottom: 10px;
            background: #dc2626; color: white; border-radius: 8px;
            font-weight: 700; font-size: 12px; text-transform: uppercase;
            border: none; cursor: pointer;
        }
        .btn-red:hover { background: #b91c1c; }

        /* Select Menu Styling */
        .custom-select {
            background: #171717; color: white; border: 1px solid #333;
            padding: 8px 12px; border-radius: 6px; font-size: 11px; font-weight: bold;
            text-transform: uppercase; outline: none;
        }

        /* Search Input Fix */
        .search-box { position: relative; width: 100%; }
        .search-input { width: 100%; background: #171717; border: 1px solid #333; padding: 10px 40px 10px 15px; border-radius: 8px; color: white; font-size: 12px; outline: none; }
        .search-icon { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: #666; }

        /* Back to Top */
        .btn-top { display: none; position: fixed; bottom: 20px; right: 20px; background: #dc2626; width: 40px; height: 40px; border-radius: 50%; color: white; border: none; z-index: 90; cursor: pointer; }
    </style>
</head>
<body>

    <nav class="nav-fixed">
        <div class="container mx-auto px-4 pt-4">
            <div class="flex items-center gap-3 mb-3">
                <div class="text-lg font-black italic shrink-0" onclick="window.location.reload()">
                    AMNESFUBBIA<span class="text-red-600">FILM</span>
                </div>
                <div class="search-box">
                    <input type="text" id="searchInput" class="search-input" placeholder="Cari Film..." onkeypress="if(event.key==='Enter') doSearch()">
                    <i class="fa-solid fa-magnifying-glass search-icon" onclick="doSearch()"></i>
                </div>
            </div>

            <div class="flex gap-2 overflow-x-auto pb-2 no-scrollbar">
                <select id="typeFilter" class="custom-select" onchange="resetApp()">
                    <option value="movie">FILM</option> <option value="tv">SERIES</option>
                    <option value="multi">SEMUA</option>
                </select>
                <select id="genreFilter" class="custom-select" onchange="resetApp()">
                    <option value="">GENRE (SEMUA)</option>
                    <option value="28">Aksi</option>
                    <option value="27">Horor</option>
                    <option value="35">Komedi</option>
                    <option value="18">Drama</option>
                    <option value="10749">Romansa</option>
                </select>
                <select id="yearFilter" class="custom-select" onchange="resetApp()">
                    <option value="">TAHUN (SEMUA)</option>
                    <script>
                        for(let i = new Date().getFullYear(); i >= 1920; i--) {
                            document.write(`<option value="${i}">${i}</option>`);
                        }
                    </script>
                </select>
                <select id="sortFilter" class="custom-select flex-grow" onchange="resetApp()">
                    <option value="popularity.desc">TERPOPULER</option>
                    <option value="primary_release_date.desc">TERBARU</option>
                </select>
            </div>
        </div>
    </nav>

    <main id="movieGrid" class="grid-container"></main>
    
    <div class="text-center pb-10">
        <button onclick="loadMore()" class="bg-white text-black font-bold px-6 py-2 rounded-full text-xs uppercase">Muat Lebih Banyak</button>
    </div>

    <button class="btn-top" id="btnTop" onclick="window.scrollTo(0,0)"><i class="fa-solid fa-arrow-up"></i></button>

    <div id="movieModal" class="modal">
        <div class="modal-body">
            <button onclick="closeModal()" class="fixed top-5 right-5 z-50 bg-black/80 text-white w-10 h-10 rounded-full border border-white/20">✕</button>

            <div class="flex flex-col md:flex-row gap-6">
                <div class="md:w-2/3">
                    <h1 id="mTitle" class="modal-title">JUDUL FILM</h1>
                    <div id="mMeta" class="text-xs text-gray-500 font-bold mb-4 uppercase"></div>

                    <div class="aspect-video bg-black rounded-xl overflow-hidden mb-6 border border-white/10">
                        <iframe id="mainPlayer" class="w-full h-full" frameborder="0" allowfullscreen></iframe>
                    </div>

                    <div class="mb-6">
                        <h3 class="text-red-600 text-[10px] font-black tracking-widest mb-2">SINOPSIS</h3>
                        <p id="mDesc" class="text-sm text-gray-300 leading-relaxed italic"></p>
                    </div>
                </div>

                <div class="md:w-1/3">
                    <h3 class="text-gray-500 text-[10px] font-bold mb-3 uppercase">Pilih Server</h3>
                    <div id="streamButtons"></div>
                    
                    <hr class="border-gray-800 my-6">
                    
                    <h3 class="text-gray-500 text-[10px] font-bold mb-3 uppercase">Download</h3>
                    <div id="downloadButtons"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = 'bfa7df5310c9974f62f26c6789a8c00d';
        const IMG_URL = 'https://image.tmdb.org/t/p/w500';
        let page = 1;

        window.onload = () => loadMovies();
        window.onscroll = () => {
            document.getElementById('btnTop').style.display = window.scrollY > 300 ? 'block' : 'none';
        }

        async function loadMovies() {
            const type = document.getElementById('typeFilter').value;
            const genre = document.getElementById('genreFilter').value;
            const year = document.getElementById('yearFilter').value;
            const sort = document.getElementById('sortFilter').value;

            // FIX: Logika URL agar tidak crash/layar hitam
            let url = '';
            if (type === 'multi') {
                url = `https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&with_origin_country=ID&page=${page}&sort_by=${sort}`;
            } else {
                url = `https://api.themoviedb.org/3/discover/${type}?api_key=${API_KEY}&with_origin_country=ID&page=${page}&sort_by=${sort}`;
            }

            if(genre) url += `&with_genres=${genre}`;
            if(year) url += `&primary_release_year=${year}&first_air_date_year=${year}`;

            try {
                const res = await fetch(url);
                const data = await res.json();
                renderMovies(data.results);
            } catch (e) { console.error("Error:", e); }
        }

        function renderMovies(movies) {
            const grid = document.getElementById('movieGrid');
            if (page === 1) grid.innerHTML = '';
            
            movies.forEach(m => {
                if (!m.poster_path) return;
                // Filter ketat: Hanya ID
                if (m.original_language !== 'id' && !m.origin_country?.includes('ID')) return;

                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => openModal(m.id, m.media_type || (document.getElementById('typeFilter').value === 'tv' ? 'tv' : 'movie'));
                card.innerHTML = `<img src="${IMG_URL + m.poster_path}" loading="lazy">`;
                grid.appendChild(card);
            });
        }

        async function openModal(id, type) {
            // Reset Modal
            document.getElementById('mTitle').innerText = "Memuat...";
            document.getElementById('movieModal').style.display = 'block';
            document.body.style.overflow = 'hidden';

            // Ambil Data Indo & Inggris (untuk fallback sinopsis)
            const [resID, resEN] = await Promise.all([
                fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=${API_KEY}&language=id-ID&append_to_response=videos`),
                fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=${API_KEY}&language=en-US`)
            ]);
            const m = await resID.json();
            const mEN = await resEN.json();

            // Set Data
            document.getElementById('mTitle').innerText = m.title || m.name;
            document.getElementById('mMeta').innerText = `${m.release_date?.split('-')[0] || 'N/A'} • ⭐ ${m.vote_average.toFixed(1)}`;
            
            // LOGIKA SINOPSIS: Indo -> Inggris -> Default
            let desc = m.overview;
            if (!desc || desc === "") desc = mEN.overview; 
            if (!desc || desc === "") desc = "Sinopsis belum tersedia dalam bahasa Indonesia maupun Inggris.";
            document.getElementById('mDesc').innerText = desc;

            // Player
            const vid = m.videos?.results.find(v => v.type === 'Trailer') || m.videos?.results[0];
            document.getElementById('mainPlayer').src = vid ? `https://www.youtube.com/embed/${vid.key}?autoplay=1` : '';

            // Buttons: FIX DESAIN MERAH SERAGAM
            const btnHTML = (label, link) => `
                <button onclick="document.getElementById('mainPlayer').src='${link}'" class="btn-red">
                    <span>${label}</span> <i class="fa-solid fa-play"></i>
                </button>`;
            
            document.getElementById('streamButtons').innerHTML = 
                btnHTML('Server Utama (XYZ)', `https://vidsrc.xyz/embed/${type}/${id}`) +
                btnHTML('Server Cadangan (TO)', `https://vidsrc.to/embed/${type}/${id}`);

            document.getElementById('downloadButtons').innerHTML = `
                <a href="https://dl.vidsrc.vip/${type}/${id}" target="_blank" class="btn-red" style="text-decoration:none;">
                    <span>Download VIP</span> <i class="fa-solid fa-download"></i>
                </a>`;
        }

        async function doSearch() {
            const q = document.getElementById('searchInput').value;
            if(!q) return;
            const res = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${API_KEY}&query=${q}&language=id-ID`);
            const data = await res.json();
            // Reset page dan grid khusus hasil search
            page = 1;
            document.getElementById('movieGrid').innerHTML = '';
            renderMovies(data.results);
        }

        function closeModal() {
            document.getElementById('movieModal').style.display = 'none';
            document.getElementById('mainPlayer').src = '';
            document.body.style.overflow = 'auto';
        }
        function loadMore() { page++; loadMovies(); }
        function resetApp() { page = 1; loadMovies(); }
    </script>
</body>
</html>
