<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DadarEndog | Masak itu Simpel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { background: #fafafa; font-family: 'Plus Jakarta Sans', sans-serif; color: #1a1a1a; }
        .recipe-layer { position: fixed; inset: 0; background: white; z-index: 1000; transform: translateX(100%); transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); overflow-y: auto; }
        .recipe-layer.active { transform: translateX(0); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .story-ring { background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); padding: 2px; border-radius: 50%; }
        .post-image { width: 100%; height: 350px; object-cover; background: #eee; }
    </style>
</head>
<body class="pb-20">

    <header class="flex flex-col px-5 py-4 bg-white border-b border-gray-100 sticky top-0 z-50">
        <div class="flex justify-between items-center w-full">
            <h1 class="text-2xl font-black tracking-tighter italic text-gray-900">
                Dadar<span class="text-orange-500">Endog</span>
            </h1>
            <div class="flex gap-5 text-xl">
                <i class="fa-regular fa-heart"></i>
                <i class="fa-solid fa-bars-staggered"></i>
            </div>
        </div>
        <p class="text-[9px] font-bold text-gray-400 mt-1 uppercase tracking-widest">
            Masak itu simpel, segampang dadar endog!
        </p>
    </header>

    <section class="py-4 border-b border-gray-100 bg-white overflow-x-auto no-scrollbar flex px-4 gap-4">
        <div onclick="filterResep('semua')" class="flex flex-col items-center gap-1 min-w-[70px]">
            <div class="story-ring"><div class="bg-white p-0.5 rounded-full"><div class="w-14 h-14 bg-gray-100 rounded-full flex items-center justify-center font-bold text-[10px]">ALL</div></div></div>
            <span class="text-[10px] font-semibold">Semua</span>
        </div>
        <div id="category-list" class="flex gap-4"></div>
    </section>

    <main id="main-feed" class="flex flex-col"></main>

    <nav class="fixed bottom-0 w-full h-16 bg-white/90 backdrop-blur border-top border-gray-100 flex justify-around items-center px-4 z-[999]">
        <i class="fa-solid fa-house text-xl" onclick="location.reload()"></i>
        <i class="fa-solid fa-magnifying-glass text-xl text-gray-300"></i>
        <div class="w-10 h-10 bg-orange-500 rounded-full flex items-center justify-center text-white shadow-lg shadow-orange-200">
            <i class="fa-solid fa-plus"></i>
        </div>
        <i class="fa-solid fa-utensils text-xl text-gray-300"></i>
        <div class="w-7 h-7 bg-gray-200 rounded-full overflow-hidden border border-gray-100">
            <img src="https://ui-avatars.com/api/?name=User&background=orange&color=fff" alt="Profile">
        </div>
    </nav>

    <div id="recipe-detail" class="recipe-layer">
        <div class="sticky top-0 bg-white/90 backdrop-blur border-b p-5 flex items-center gap-5">
            <button onclick="closeRecipe()" class="text-xl"><i class="fa-solid fa-chevron-left"></i></button>
            <h2 class="font-bold uppercase tracking-widest text-xs">Detail Resep</h2>
        </div>
        <div id="detail-content"></div>
    </div>

    <script>
        const PEXELS_API_KEY = '1fVjusZHCt9MJkTfuOy58M6Gs1IwaZXqu3qdAGq3ZOmJhQSTXOlZD0eA';
        
        const recipes = [
            { id: 1, cat: 'makanan', tag: 'Sumatera', title: 'Rendang Daging', search: 'beef rendang', origin: 'Padang', ing: ['1kg Daging Sapi', '2L Santan', 'Bumbu Rendang'], steps: ['Tumis bumbu.', 'Masukkan daging & santan.', 'Masak hingga kering.'] },
            { id: 2, cat: 'makanan', tag: 'Jawa', title: 'Soto Lamongan', search: 'indonesian chicken soup', origin: 'Jawa Timur', ing: ['Ayam Kampung', 'Koya', 'Soun'], steps: ['Rebus ayam.', 'Tumis bumbu kuning.', 'Sajikan dengan koya.'] },
            { id: 3, cat: 'cemilan', tag: 'Jawa', title: 'Dadar Gulung', search: 'indonesian cake', origin: 'Jawa', ing: ['Tepung Terigu', 'Santan', 'Unti Kelapa'], steps: ['Buat dadar hijau.', 'Isi kelapa manis.', 'Gulung rapi.'] },
            { id: 4, cat: 'makanan', tag: 'Timur', title: 'Papeda Ikan', search: 'indonesian fish soup', origin: 'Papua', ing: ['Sagu', 'Ikan Tongkol', 'Kunyit'], steps: ['Buat papeda.', 'Masak ikan kuah kuning.', 'Sajikan.'] },
            { id: 5, cat: 'minuman', tag: 'Sumatera', title: 'Teh Talua', search: 'tea egg drink', origin: 'Minang', ing: ['Teh Pekat', 'Telur Bebek', 'Jeruk Nipis'], steps: ['Kocok telur & gula.', 'Siram teh panas.', 'Beri jeruk nipis.'] }
        ];

        async function getPhoto(query) {
            try {
                const res = await fetch(`https://api.pexels.com/v1/search?query=${query}&per_page=1`, {
                    headers: { Authorization: PEXELS_API_KEY }
                });
                const data = await res.json();
                return data.photos[0]?.src?.large || 'https://via.placeholder.com/500x350?text=No+Image';
            } catch { return 'https://via.placeholder.com/500x350?text=Error+Loading'; }
        }

        async function renderFeed() {
            const feed = document.getElementById('main-feed');
            feed.innerHTML = '<p class="p-10 text-center text-xs text-gray-400">Memuat resep lezat...</p>';
            
            let html = '';
            for (let r of recipes) {
                const img = await getPhoto(r.search);
                html += `
                    <div class="bg-white mb-4 border-b border-gray-100 shadow-sm" onclick="openRecipe(${r.id})">
                        <div class="p-4 flex items-center justify-between">
                            <div class="flex items-center gap-3">
                                <div class="w-8 h-8 rounded-full bg-orange-100 flex items-center justify-center text-[10px] font-bold text-orange-600">${r.tag[0]}</div>
                                <span class="text-xs font-bold">${r.title} <span class="text-gray-300 mx-1">•</span> <span class="text-emerald-500">${r.origin}</span></span>
                            </div>
                            <i class="fa-solid fa-ellipsis"></i>
                        </div>
                        <img src="${img}" class="post-image" alt="${r.title}">
                        <div class="p-4">
                            <div class="flex gap-4 text-xl mb-3">
                                <i class="fa-regular fa-heart"></i>
                                <i class="fa-regular fa-comment"></i>
                                <i class="fa-regular fa-paper-plane"></i>
                            </div>
                            <p class="text-xs leading-relaxed text-gray-600"><span class="font-bold text-black">DadarEndog</span> Memasak ${r.title} itu gampang banget, rek! Cek bahannya di detail...</p>
                        </div>
                    </div>
                `;
            }
            feed.innerHTML = html;
        }

        function openRecipe(id) {
            const r = recipes.find(x => x.id === id);
            const content = document.getElementById('detail-content');
            content.innerHTML = `
                <div class="p-8">
                    <span class="text-[10px] font-black bg-orange-100 text-orange-600 px-3 py-1 rounded-full uppercase">${r.cat}</span>
                    <h2 class="text-4xl font-black mt-4 mb-2 tracking-tighter italic">${r.title}</h2>
                    <p class="text-gray-400 text-sm mb-8">Asal: ${r.origin}</p>
                    <div class="mb-8">
                        <h3 class="font-bold text-lg mb-4 border-b pb-2">Bahan:</h3>
                        <ul class="space-y-2 text-sm text-gray-600 list-disc pl-5">${r.ing.map(i => `<li>${i}</li>`).join('')}</ul>
                    </div>
                    <div>
                        <h3 class="font-bold text-lg mb-4 border-b pb-2">Langkah:</h3>
                        <ol class="space-y-4 text-sm text-gray-600 list-decimal pl-5">${r.steps.map(s => `<li>${s}</li>`).join('')}</ol>
                    </div>
                </div>
            `;
            document.getElementById('recipe-detail').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeRecipe() {
            document.getElementById('recipe-detail').classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        renderFeed();
    </script>
</body>
</html>
