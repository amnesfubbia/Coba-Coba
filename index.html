<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>amnesfubbia ANIMATION</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@1,700&family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { background-color: #000; color: #fff; font-family: 'Inter', sans-serif; margin: 0; overflow-x: hidden; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        /* Header Fix agar tidak goyang */
        .fixed-header-section { position: fixed; top: 0; width: 100%; z-index: 100; background: #000; border-bottom: 1px solid #1c1c1c; }
        .ig-header { padding: 12px 15px 5px 15px; }
        .ig-logo { font-family: 'DM Sans', sans-serif; font-weight: 700; font-style: italic; font-size: 24px; letter-spacing: -0.8px; text-transform: lowercase; }
        
        .search-container { background: #0a0a0a; border-radius: 8px; display: flex; align-items: center; padding: 7px 12px; flex-grow: 1; border: 1px solid #1c1c1c; }
        .search-container input { background: transparent !important; border: none; color: white; font-size: 13px; width: 100%; outline: none; margin-left: 8px; }
        
        .pill { background: transparent; border: 1px solid #1c1c1c; color: #fff; padding: 8px 0; border-radius: 8px; font-size: 10px; font-weight: 800; text-transform: uppercase; text-align: center; cursor: pointer; }
        .pill.active { border-color: #fff; }

        /* Grid Utama */
        .movie-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; padding-top: 360px; padding-bottom: 100px; width: 100%; }
        .post-card { position: relative; aspect-ratio: 2/3; background: #0a0a0a; overflow: hidden; }
        .post-card img { width: 100%; height: 100%; object-fit: cover; }
        
        /* Modal & Interaction */
        .modal-player { display: none; position: fixed; inset: 0; z-index: 500; background: #000; overflow-y: auto; }
        .interaction-icon { font-size: 24px; cursor: pointer; color: #fff; }
        
        /* Back to Top */
        #backToTop { position: fixed; bottom: 85px; right: 20px; background: #fff; color: #000; width: 45px; height: 45px; border-radius: 50%; display: none; align-items: center; justify-content: center; z-index: 400; box-shadow: 0 4px 15px rgba(0,0,0,0.5); cursor: pointer; }

        .story-border { padding: 2.5px; background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); border-radius: 50%; display: inline-block; }
        .story-inner { background: #000; padding: 2px; border-radius: 50%; }
        .story-img { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; display: block; }
    </style>
</head>
<body>
    <div id="backToTop" onclick="window.scrollTo({top: 0, behavior: 'smooth'})"><i class="fa-solid fa-arrow-up"></i></div>

    <div class="fixed-header-section">
        <header class="ig-header">
            <div class="flex justify-between items-center">
                <div class="flex items-center">
                    <h1 class="ig-logo" onclick="location.reload()">amnesfubbia <span class="text-white opacity-40 font-normal italic">animation</span></h1>
                    <i class="fa-solid fa-circle-check text-[#0095f6] text-[13px] ml-1"></i>
                </div>
                <div class="flex gap-6 text-xl">
                    <i class="fa-regular fa-square-plus" onclick="document.getElementById('searchInp').focus()"></i>
                    <i class="fa-regular fa-heart" onclick="showLibrary('likes')"></i>
                </div>
            </div>
            <div class="flex items-center gap-2 mt-2">
                <div class="search-container">
                    <i class="fa-solid fa-magnifying-glass text-zinc-600"></i>
                    <input type="text" id="searchInp" placeholder="Cari..." onkeydown="if(event.key==='Enter') searchAction()">
                </div>
                <button class="pill px-4" onclick="toggleYearDropdown()">TAHUN</button>
            </div>
        </header>

        <div class="px-4 pb-3">
            <div class="grid grid-cols-4 gap-2">
                <button class="pill active" onclick="setFilter('type', 'multi', this)">Semua</button>
                <button class="pill" onclick="setFilter('type', 'movie', this)">Film</button>
                <button class="pill" onclick="setFilter('type', 'tv', this)">Series</button>
                <button class="pill" onclick="setFilter('type', 'short', this)">Short</button>
            </div>
            <div class="grid grid-cols-3 gap-2 mt-2">
                <button class="pill active" id="btnAllSchedule" onclick="setSchedule('', this)">Terbaru</button>
                <button class="pill" onclick="setSchedule('now_playing', this)">Tayang</button>
                <button class="pill" onclick="setSchedule('upcoming', this)">Akan Datang</button>
            </div>
        </div>
    </div>

    <main id="feedGrid" class="movie-grid"></main>

    <div id="movieModal" class="modal-player">
        <div class="max-w-xl mx-auto pb-40">
            <div class="px-4 h-[60px] flex items-center border-b border-zinc-900 sticky top-0 bg-black z-50">
                <i class="fa-solid fa-chevron-left text-xl" onclick="closeModal()"></i>
                <h2 id="mTitle" class="flex-grow text-center text-sm font-bold truncate px-6"></h2>
            </div>
            <div id="mCast" class="flex gap-4 overflow-x-auto no-scrollbar px-4 py-4"></div>
            <div class="aspect-video bg-black">
                <iframe id="videoPlayer" class="w-full h-full" allow="autoplay; fullscreen" allowfullscreen></iframe>
            </div>
            <div class="px-4 py-4">
                <div class="flex justify-between mb-4">
                    <div class="flex gap-6">
                        <i id="btnLikeModal" class="interaction-icon"></i>
                        <i id="btnBookModal" class="interaction-icon"></i>
                    </div>
                </div>
                <p id="mDesc" class="text-sm text-zinc-300"></p>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = 'bfa7df5310c9974f62f26c6789a8c00d';
        let currentType = 'multi', searchQuery = '', currentSchedule = '', page = 1;

        const getStore = (k) => JSON.parse(localStorage.getItem('anim_' + k) || '[]');
        const saveStore = (k, v) => localStorage.setItem('anim_' + k, JSON.stringify(v));

        window.onload = () => loadFeed();
        window.onscroll = () => {
            const btt = document.getElementById('backToTop');
            btt.style.display = window.scrollY > 400 ? 'flex' : 'none';
        };

        async function loadFeed(isNew = true) {
            if (isNew) { page = 1; document.getElementById('feedGrid').innerHTML = ''; }
            
            let url = `https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&with_genres=16&language=id-ID&page=${page}`;
            
            if (currentSchedule) url = `https://api.themoviedb.org/3/movie/${currentSchedule}?api_key=${API_KEY}&language=id-ID&page=${page}`;
            if (searchQuery) url = `https://api.themoviedb.org/3/search/multi?api_key=${API_KEY}&query=${searchQuery}&language=id-ID`;

            try {
                const res = await fetch(url);
                const data = await res.json();
                
                // FILTER KETAT: Hanya Animasi (Genre ID 16)
                const items = data.results.filter(m => m.poster_path && (m.genre_ids ? m.genre_ids.includes(16) : true));
                
                // Filter Short Movie (durasi < 40 menit)
                let finalItems = items;
                if (currentType === 'short') {
                    // Karena discover API butuh request detail, kita simulasi dengan filter data yang ada atau gunakan runtime filter jika didukung
                    url += '&with_runtime.lte=40';
                }

                renderFeed(finalItems.map(m => ({...m, m_type: m.media_type || 'movie'})));
            } catch (e) { console.error(e); }
        }

        function renderFeed(items) {
            const grid = document.getElementById('feedGrid');
            items.forEach(m => {
                const card = document.createElement('div');
                card.className = 'post-card';
                card.onclick = () => openModal(m.id, m.m_type);
                card.innerHTML = `<img src="https://image.tmdb.org/t/p/w342${m.poster_path}">`;
                grid.appendChild(card);
            });
        }

        async function openModal(id, type) {
            document.getElementById('movieModal').style.display = 'block';
            document.body.style.overflow = 'hidden';
            
            const res = await fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=${API_KEY}&language=id-ID&append_to_response=videos,credits`);
            const d = await res.json();

            // Simpan data untuk like/simpan
            window.activeMovie = { id: d.id, title: d.title || d.name, poster_path: d.poster_path, m_type: type };

            document.getElementById('mTitle').innerText = d.title || d.name;
            document.getElementById('mDesc').innerText = d.overview || "Sinopsis tidak tersedia.";

            // Cast Clickable
            document.getElementById('mCast').innerHTML = (d.credits.cast || []).slice(0, 10).map(c => `
                <div class="flex-shrink-0 text-center w-[62px]" onclick="filterByActor('${c.id}')">
                    <div class="story-border"><div class="story-inner">
                        <img src="https://image.tmdb.org/t/p/w185${c.profile_path}" class="story-img" onerror="this.src='https://via.placeholder.com/100'">
                    </div></div>
                    <p class="text-[8px] truncate mt-1 text-zinc-500 font-bold">${c.name.split(' ')[0]}</p>
                </div>
            `).join('');

            // Trailer Autoplay & Mute Fix
            const trailer = d.videos.results.find(v => v.type === 'Trailer');
            if (trailer) {
                document.getElementById('videoPlayer').src = `https://www.youtube.com/embed/${trailer.key}?autoplay=1&mute=1`;
            } else {
                document.getElementById('videoPlayer').src = `https://vidrock.net/embed/movie/${id}`;
            }

            updateModalButtons(id);
        }

        function filterByActor(actorId) {
            searchQuery = '';
            currentSchedule = '';
            // Mencari film animasi yang dibintangi aktor tersebut
            const url = `https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&with_cast=${actorId}&with_genres=16`;
            closeModal();
            loadFeedByUrl(url);
        }

        async function loadFeedByUrl(url) {
            document.getElementById('feedGrid').innerHTML = '';
            const res = await fetch(url);
            const data = await res.json();
            renderFeed(data.results.filter(m => m.poster_path));
        }

        function closeModal() {
            document.getElementById('movieModal').style.display = 'none';
            document.getElementById('videoPlayer').src = '';
            document.body.style.overflow = 'auto';
        }

        function setFilter(t, v, el) {
            document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
            el.classList.add('active');
            currentType = v;
            loadFeed(true);
        }

        function setSchedule(v, el) {
            currentSchedule = v;
            document.getElementById('btnAllSchedule').parentElement.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
            el.classList.add('active');
            loadFeed(true);
        }

        function searchAction() {
            searchQuery = document.getElementById('searchInp').value;
            loadFeed(true);
        }

        function toggleItem(key, movie) {
            let items = getStore(key);
            const idx = items.findIndex(x => x.id == movie.id);
            if(idx > -1) items.splice(idx, 1); else items.push(movie);
            saveStore(key, items);
            updateModalButtons(movie.id);
        }

        function updateModalButtons(id) {
            const isLiked = getStore('likes').some(x => x.id == id);
            const isBooked = getStore('bookmarks').some(x => x.id == id);
            document.getElementById('btnLikeModal').className = isLiked ? 'fa-solid fa-heart text-red-500 interaction-icon' : 'fa-regular fa-heart interaction-icon';
            document.getElementById('btnBookModal').className = isBooked ? 'fa-solid fa-bookmark text-white interaction-icon' : 'fa-regular fa-bookmark interaction-icon';
            
            document.getElementById('btnLikeModal').onclick = () => toggleItem('likes', window.activeMovie);
            document.getElementById('btnBookModal').onclick = () => toggleItem('bookmarks', window.activeMovie);
        }

        function showLibrary(key) {
            const items = getStore(key);
            const grid = document.getElementById('feedGrid');
            grid.innerHTML = items.length ? '' : '<div class="col-span-3 text-center py-20 text-zinc-500">KOSONG</div>';
            renderFeed(items);
            window.scrollTo({top: 0, behavior: 'smooth'});
        }
    </script>
</body>
</html>
