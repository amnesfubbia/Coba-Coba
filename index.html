<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Persebaya Surabaya | Digital Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --green: #008037; --dark: #050505; }
        body { background-color: var(--dark); color: #fff; font-family: 'Montserrat', sans-serif; -webkit-tap-highlight-color: transparent; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .player-card { border-radius: 24px; overflow: hidden; background: #111; transition: 0.3s; }
        .player-card:active { transform: scale(0.95); }
        .modal-legend { display: none; position: fixed; inset: 0; z-index: 9999; background: rgba(0,0,0,0.95); align-items: center; justify-content: center; padding: 20px; }
    </style>
</head>
<body class="pb-20">

    <nav class="fixed top-0 w-full z-50 glass px-6 py-4 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <img src="Persebaya.png" class="w-8 h-8 object-contain" onerror="this.src='https://upload.wikimedia.org/wikipedia/id/0/09/Persebaya_logo.png'">
            <span class="font-black tracking-tighter text-lg uppercase">Persebaya Hub</span>
        </div>
        <i class="fa-solid fa-bars-staggered text-green-500 text-xl"></i>
    </nav>

    <section class="pt-24 px-6 pb-8 bg-gradient-to-b from-[#003d1a] to-transparent">
        <div class="glass p-6 rounded-[30px] border-t-2 border-green-500 shadow-xl shadow-green-900/20">
            <p class="text-[9px] font-black tracking-[0.4em] text-center text-green-400 mb-6 uppercase">Next Matchday</p>
            <div class="flex justify-between items-center">
                <div class="w-1/3 text-center">
                    <img src="Persebaya.png" class="w-14 h-14 mx-auto drop-shadow-lg" onerror="this.src='https://upload.wikimedia.org/wikipedia/id/0/09/Persebaya_logo.png'">
                    <p class="text-[9px] font-bold mt-2">PERSEBAYA</p>
                </div>
                <div class="w-1/3 text-center text-xl font-black italic opacity-30">VS</div>
                <div class="w-1/3 text-center">
                    <div class="w-14 h-14 bg-zinc-800 rounded-full mx-auto flex items-center justify-center border border-zinc-700">
                        <i class="fa-solid fa-shield-halved text-xl text-zinc-600"></i>
                    </div>
                    <p class="text-[9px] font-bold mt-2 text-zinc-500 uppercase">Opponent</p>
                </div>
            </div>
        </div>
    </section>

    <section class="px-6 py-4">
        <div class="flex justify-between items-center mb-6">
            <h3 class="text-xl font-black tracking-tighter">SQUAD <span class="text-green-500 italic">2026</span></h3>
            <span class="text-[10px] text-zinc-500 font-bold uppercase border-b border-zinc-800">Bonek View</span>
        </div>
        <div class="grid grid-cols-2 gap-4" id="squad-container">
            </div>
    </section>

    <section class="px-6 py-8">
        <h3 class="text-xl font-black mb-6 italic text-yellow-500 uppercase">Hall of Fame</h3>
        <div class="space-y-3">
            <div onclick="openLegend('Eri Irianto', 'Legenda abadi dengan nomor punggung 19. Meninggal saat membela Persebaya di lapangan. Sosok petarung sejati.')" class="glass p-4 rounded-2xl flex items-center gap-4 border-l-4 border-yellow-600 active:bg-white/5">
                <div class="w-12 h-12 rounded-full bg-green-800 flex items-center justify-center font-black text-sm">EI19</div>
                <div>
                    <p class="font-black text-xs italic uppercase">Eri Irianto</p>
                    <p class="text-[9px] text-zinc-500">The Eternal Legend</p>
                </div>
                <i class="fa-solid fa-chevron-right ml-auto text-zinc-700 text-xs"></i>
            </div>
        </div>
    </section>

    <section class="pb-10">
        <h3 class="px-6 text-xl font-black mb-6 uppercase tracking-tighter">Bonek <span class="text-zinc-600 italic">Gallery</span></h3>
        <div class="grid grid-cols-3 gap-1 px-1">
            <div class="aspect-square bg-zinc-900 overflow-hidden"><img src="https://picsum.photos/400/400?random=21" class="w-full h-full object-cover"></div>
            <div class="aspect-square bg-zinc-900 overflow-hidden"><img src="https://picsum.photos/400/400?random=22" class="w-full h-full object-cover"></div>
            <div class="aspect-square bg-zinc-900 overflow-hidden"><img src="https://picsum.photos/400/400?random=23" class="w-full h-full object-cover"></div>
        </div>
    </section>

    <div id="legendModal" class="modal-legend" onclick="closeLegend()">
        <div class="glass p-8 rounded-[35px] w-full max-w-xs text-center border-t-4 border-green-500 animate-in fade-in zoom-in duration-300">
            <h4 id="legendTitle" class="text-2xl font-black italic mb-4 uppercase"></h4>
            <p id="legendContent" class="text-xs text-zinc-400 leading-relaxed"></p>
            <div class="mt-8 py-2 px-4 bg-green-700 inline-block rounded-lg font-black text-[10px] uppercase">Tutup</div>
        </div>
    </div>

    <script>
        // Data Pemain dengan Link Fallback
        const players = [
            { name: 'Bruno Moreira', pos: 'Forward', no: '10', img: 'https://tmssl.akamaized.net//images/foto/galerie/bruno-moreira-1689239455-111353.jpg' },
            { name: 'F. Rivera', pos: 'Midfield', no: '7', img: 'https://tmssl.akamaized.net//images/foto/galerie/francisco-rivera-1715832793-137255.jpg' },
            { name: 'Flavio Silva', pos: 'Forward', no: '17', img: 'https://tmssl.akamaized.net//images/foto/galerie/flavio-silva-1681284985-104975.jpg' },
            { name: 'Ernando Ari', pos: 'Gk', no: '21', img: 'https://tmssl.akamaized.net//images/foto/galerie/ernando-ari-1684494396-107693.jpg' }
        ];

        const container = document.getElementById('squad-container');
        
        players.forEach(p => {
            // Fungsi untuk menangani gambar rusak
            const initial = p.name.split(' ').map(n => n[0]).join('');
            
            container.innerHTML += `
                <div class="player-card relative aspect-[3/4] glass shadow-lg">
                    <img src="${p.img}" 
                         onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'" 
                         class="w-full h-full object-cover opacity-80">
                    <div class="absolute inset-0 hidden flex items-center justify-center bg-gradient-to-br from-green-900 to-black text-4xl font-black text-white/20">${initial}</div>
                    
                    <div class="absolute bottom-0 w-full p-4 bg-gradient-to-t from-black via-black/80 to-transparent">
                        <p class="text-[7px] font-black text-green-500 uppercase tracking-widest">${p.pos}</p>
                        <p class="text-[11px] font-black uppercase italic tracking-tight">${p.name}</p>
                    </div>
                    <div class="absolute top-3 left-3 w-7 h-7 glass rounded-lg flex items-center justify-center text-[10px] font-black text-green-500">${p.no}</div>
                </div>
            `;
        });

        function openLegend(t, c) {
            document.getElementById('legendTitle').innerText = t;
            document.getElementById('legendContent').innerText = c;
            document.getElementById('legendModal').style.display = 'flex';
        }
        function closeLegend() {
            document.getElementById('legendModal').style.display = 'none';
        }
    </script>
</body>
</html>
