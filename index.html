<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>amnesfubbia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@1,700&family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { background-color: #000; color: #fff; font-family: 'Inter', sans-serif; margin: 0; overflow-x: hidden; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        /* CSS LOGO "A" MODERN (RIBBON STYLE) */
        .logo-a-container {
            position: relative;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logo-a-shape {
            position: relative;
            width: 40px;
            height: 50px;
            background: #fff;
            clip-path: polygon(50% 0%, 100% 100%, 75% 100%, 50% 30%, 25% 100%, 0% 100%);
        }
        .logo-a-shape::after {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            width: 50%;
            height: 100%;
            background: rgba(0, 0, 0, 0.15);
        }

        /* SPLASH SCREEN */
        #splashScreen { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.5s ease; }
        
        /* HEADER & PROFILE */
        .profile-header { padding: 15px 15px 0 15px; background: #000; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .ig-logo-wrapper { display: flex; align-items: center; gap: 4px; position: relative; cursor: pointer; }
        .ig-logo { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 18px; letter-spacing: -0.5px; }
        .dot-notify { width: 7px; height: 7px; background-color: #ff3b30; border-radius: 50%; display: inline-block; margin-left: 2px; }
        
        .profile-info { display: flex; align-items: center; gap: 25px; margin-bottom: 15px; }
        .profile-pic-container { position: relative; width: 86px; height: 86px; }
        .profile-pic-logo { width: 82px; height: 82px; border-radius: 50%; border: 1px solid #333; padding: 2px; background: #000; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .profile-pic-logo .logo-a-container { transform: scale(0.7); }

        .add-story-btn { position: absolute; bottom: 4px; right: 4px; width: 24px; height: 24px; background: #0095f6; border: 3px solid #000; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; color: #fff; z-index: 10; }

        .stats { display: flex; flex-grow: 1; justify-content: space-around; text-align: center; }
        .stat-val { font-weight: 700; font-size: 16px; display: block; }
        .stat-label { font-size: 12px; color: #a8a8a8; }
        
        .bio { font-size: 13px; line-height: 1.4; margin-bottom: 15px; padding-top: 5px; }
        .bio-name-wrapper { display: flex; align-items: center; gap: 5px; margin-bottom: 2px; }
        .bio-name { font-weight: 700; font-size: 14px; display: block; }

        .action-buttons { display: flex; gap: 6px; margin-bottom: 10px; }
        .btn-ig { flex: 1; background: #1c1c1c; border-radius: 8px; padding: 7px; font-size: 13px; font-weight: 600; text-align: center; cursor: pointer; color: #fff; }
        .btn-ig.active { background: #363636; }
        .btn-icon-sq { width: 34px; background: #1c1c1c; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; }

        #filterBar { display: none; margin-bottom: 15px; }
        .pill-grid { display: grid; gap: 6px; }
        .pill { background: transparent; border: 1px solid #1c1c1c; color: #fff; padding: 7px 0; border-radius: 8px; font-size: 10px; font-weight: 800; text-transform: uppercase; text-align: center; cursor: pointer; }
        
        .filter-dropdown { display: none; position: fixed; bottom: 0; left: 0; right: 0; background: #121212; border-radius: 20px 20px 0 0; z-index: 5000; max-height: 60vh; overflow-y: auto; border-top: 1px solid #333; padding-bottom: 20px; animation: slideUp 0.3s ease-out; overscroll-behavior: contain; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .sticky-reset { position: sticky; top: 0; background: #1c1c1c; z-index: 10; font-weight: 800 !important; color: #0095f6 !important; border-bottom: 2px solid #333; }
        #filterOverlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 4000; }
        .filter-item { padding: 16px; font-size: 14px; text-align: center; border-bottom: 1px solid #262626; color: #eee; cursor: pointer; }

        .highlights-wrapper { padding: 0 15px 15px 15px; border-bottom: 1px solid #1c1c1c; }
        .highlights-container { display: flex; gap: 15px; overflow-x: auto; }
        .highlight-item { flex: 0 0 62px; text-align: center; cursor: pointer; }
        .highlight-circle { width: 58px; height: 58px; border-radius: 50%; border: 1px solid #262626; margin-bottom: 5px; display: flex; align-items: center; justify-content: center; background: #000; }
        .highlight-circle .hl-logo { font-size: 10px; font-weight: 900; letter-spacing: -0.5px; text-transform: uppercase; color: #fff; text-align: center; line-height: 1; }
        .highlight-text { font-size: 10px; color: #fff; }

        .tab-nav { display: flex; border-top: 1px solid #1c1c1c; }
        .tab-item { flex: 1; text-align: center; padding: 12px 0; color: #a8a8a8; cursor: pointer; font-size: 18px; }
        .tab-item.active { color: #fff; border-bottom: 1px solid #fff; }

        .movie-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; padding-bottom: 80px; }
        .post-card { position: relative; aspect-ratio: 2/3; background: #0a0a0a; overflow: hidden; }
        .post-card img { width: 100%; height: 100%; object-fit: cover; }
        .badge-rating { position: absolute; top: 6px; left: 6px; padding: 2px 5px; border-radius: 2px; font-size: 7px; font-weight: 900; z-index: 5; background: rgba(255,255,255,0.9); color: #000; }
        .badge-type { position: absolute; top: 6px; right: 6px; padding: 2px 5px; border-radius: 2px; font-size: 7px; font-weight: 900; z-index: 5; background: rgba(0,0,0,0.7); color: #fff; text-transform: uppercase; border: 0.5px solid rgba(255,255,255,0.3); }

        #searchOverlay { display: none; position: fixed; inset: 0; background: #000; z-index: 2000; overflow-y: auto; }
        .search-header { position: sticky; top: 0; background: #000; display: flex; align-items: center; padding: 10px 15px; gap: 10px; border-bottom: 1px solid #1c1c1c; z-index: 100; }
        .search-input-box { flex-grow: 1; background: #262626; border-radius: 10px; padding: 8px 12px; display: flex; align-items: center; position: relative; }
        .search-input-box input { background: transparent !important; border: none; outline: none; color: #fff !important; font-size: 14px; width: 100%; margin-left: 8px; }
        
        #smartSearchDropdown { position: absolute; top: 100%; left: 0; right: 0; background: #1a1a1a; border-radius: 0 0 10px 10px; border: 1px solid #333; border-top: none; display: none; z-index: 500; max-height: 300px; overflow-y: auto; }

        #backToTop { position: fixed; bottom: 85px; right: 20px; background: rgba(255,255,255,0.3); width: 42px; height: 42px; border-radius: 50%; display: none; align-items: center; justify-content: center; z-index: 100; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); }

        .modal-player { display: none; position: fixed; inset: 0; z-index: 3000; background: #000; overflow-y: auto; }
        .carousel-track { display: flex; transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1); width: 100%; }
        .carousel-slide { min-width: 100%; aspect-ratio: 16/9; position: relative; }
        .interaction-icon { font-size: 24px; cursor: pointer; color: #fff; }
        .server-btn { width: 100%; padding: 12px 5px; border-radius: 8px; font-size: 8px; font-weight: 800; text-transform: uppercase; border: 1px solid #1c1c1c; text-align: center; cursor: pointer; background: #0a0a0a; color: #fff; }
        .server-btn.active-link { border: 2px solid #fff !important; }
        .dl-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 15px; }
        .dl-link-btn { width: 100%; padding: 14px; border-radius: 12px; background: #000; color: #a1a1aa; font-size: 10px; font-weight: 800; text-transform: uppercase; text-align: center; border: 1px solid #1c1c1c; }
        .ig-post-content { padding: 0 15px; margin-top: 5px; }
        .ig-likes-count { font-weight: 700; font-size: 13px; margin-bottom: 5px; display: block; }
        .ig-username { font-weight: 700; font-size: 13px; margin-right: 5px; }
        .ig-caption { font-size: 13px; line-height: 1.5; }
        .toggle-btn { color: #a8a8a8; cursor: pointer; margin-left: 4px; }
        .ig-hashtags { color: #e0f1ff; display: block; margin-top: 10px; font-size: 13px; }
        .ig-date { color: #a8a8a8; font-size: 11px; margin-top: 8px; text-transform: uppercase; }
        
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: #000; border-top: 1px solid #1c1c1c; display: flex; justify-content: space-around; padding: 12px 0; z-index: 300; }
    </style>
</head>
<body>

    <div id="splashScreen">
        <div class="logo-a-container" style="transform: scale(1.5);">
            <div class="logo-a-shape"></div>
        </div>
        <p class="mt-6 text-[10px] tracking-[5px] font-bold uppercase text-zinc-500">amnesfubbia</p>
    </div>

    <div id="mainProfile">
        <div class="profile-header">
            <div class="top-bar">
                <div class="ig-logo-wrapper" onclick="location.reload()">
                    <h1 class="ig-logo">amnesfubbia</h1>
                    <i class="fa-solid fa-chevron-down text-[10px] ml-0.5"></i>
                    <span class="dot-notify"></span>
                </div>
                <div class="flex gap-5">
                    <i class="fa-regular fa-square-plus text-2xl"></i>
                    <i class="fa-solid fa-bars text-2xl"></i>
                </div>
            </div>

            <div class="profile-info">
                <div class="profile-pic-container">
                    <div class="profile-pic-logo">
                        <div class="logo-a-container">
                            <div class="logo-a-shape"></div>
                        </div>
                    </div>
                    <div class="add-story-btn"><i class="fa-solid fa-plus"></i></div>
                </div>
                <div class="stats">
                    <div class="stat-item" onclick="setFilter('type', 'movie')"><span class="stat-val">25.4rb</span><span class="stat-label">film</span></div>
                    <div class="stat-item" onclick="setFilter('type', 'tv')"><span class="stat-val">8.2rb</span><span class="stat-label">series</span></div>
                    <div class="stat-item" onclick="setFilter('type', 'short')"><span class="stat-val">1.5rb</span><span class="stat-label">short</span></div>
                </div>
            </div>

            <div class="bio">
                <div class="bio-name-wrapper"><span class="bio-name">amnesfubbia</span><i class="fa-solid fa-circle-check text-[#0095f6] text-[13px]"></i></div>
                <span>dari indonesia untuk dunia</span><br><span>By Anasteas</span>
            </div>

            <div class="action-buttons">
                <div class="btn-ig" id="btnNowPlaying" onclick="setSchedule('now_playing', this)">Sedang Tayang</div>
                <div class="btn-ig" id="btnUpcoming" onclick="setSchedule('upcoming', this)">Segera Tayang</div>
                <div class="btn-icon-sq" onclick="toggleFilterBar()"><i class="fa-solid fa-user-plus text-sm"></i></div>
            </div>

            <div id="filterBar">
                <div class="pill-grid grid-cols-3">
                    <button class="pill" id="btnCountry" onclick="toggleFilter(event, 'countryDropdown')">Negara <i class="fa-solid fa-caret-down"></i></button>
                    <button class="pill" id="btnGenre" onclick="toggleFilter(event, 'genreDropdown')">Genre <i class="fa-solid fa-caret-down"></i></button>
                    <button class="pill" id="yearBtn" onclick="toggleFilter(event, 'yearDropdown')">Tahun <i class="fa-solid fa-caret-down"></i></button>
                </div>
            </div>
        </div>

        <div class="highlights-wrapper no-scrollbar"><div class="highlights-container no-scrollbar" id="highlightList"></div></div>

        <div class="tab-nav">
            <div class="tab-item active" id="tabGrid" onclick="switchTab('grid', this)"><i class="fa-solid fa-table-cells"></i></div>
            <div class="tab-item" id="tabLikes" onclick="switchTab('likes', this)"><i class="fa-regular fa-heart"></i></div>
            <div class="tab-item" id="tabBookmark" onclick="switchTab('bookmarks', this)"><i class="fa-regular fa-bookmark"></i></div>
        </div>

        <main id="feedGrid" class="movie-grid"></main>
    </div>

    <div id="searchOverlay">
        <div class="search-header">
            <i class="fa-solid fa-arrow-left text-xl text-white" onclick="closeSearch()"></i>
            <div class="search-input-box">
                <i class="fa-solid fa-magnifying-glass text-zinc-500 text-xs"></i>
                <input type="text" id="searchInp" autocomplete="off" placeholder="Cari film, series, anime..." onkeydown="if(event.key==='Enter') searchAction()">
                <div id="smartSearchDropdown" class="no-scrollbar"></div>
            </div>
        </div>
        <div id="searchGrid" class="movie-grid"></div>
    </div>

    <div id="backToTop" onclick="window.scrollTo({top: 0, behavior: 'smooth'})"><i class="fa-solid fa-arrow-up"></i></div>
    <div id="filterOverlay" onclick="closeD()"></div>
    <div id="countryDropdown" class="filter-dropdown no-scrollbar"></div>
    <div id="genreDropdown" class="filter-dropdown no-scrollbar"></div>
    <div id="yearDropdown" class="filter-dropdown no-scrollbar"></div>

    <div id="movieModal" class="modal-player">
        <div class="max-w-xl mx-auto pb-40">
            <div class="px-4 h-[54px] flex items-center border-b border-zinc-900 sticky top-0 bg-black z-50">
                <i class="fa-solid fa-chevron-left text-xl cursor-pointer" onclick="closeModal()"></i>
                <div class="flex-grow text-center text-[14px] font-bold truncate px-8" id="mTitle"></div>
            </div>
            <div id="castContainer" class="cast-wrapper px-4 no-scrollbar flex overflow-x-auto gap-4 py-4"></div>
            <div class="relative overflow-hidden">
                <div class="swipe-overlay" id="swipeOverlay" style="position: absolute; inset: 0; z-index: 10;"></div>
                <div class="carousel-track" id="carouselTrack"></div>
                <div id="carouselDots" class="flex justify-center gap-2 py-3"></div>
            </div>
            <div class="px-4 py-3 flex justify-between items-center">
                <div class="flex gap-4">
                    <i id="btnLikeModal" class="interaction-icon"></i>
                    <i class="fa-regular fa-comment interaction-icon"></i>
                    <i class="fa-regular fa-paper-plane interaction-icon"></i>
                </div>
                <i id="btnBookModal" class="interaction-icon"></i>
            </div>
            <div class="ig-post-content">
                <span id="mLikeDisplay" class="ig-likes-count"></span>
                <div class="mb-1">
                    <span class="ig-username">amnesfubbia</span>
                    <span id="mDesc" class="ig-caption"></span>
                    <span id="mToggleBtn" class="toggle-btn hidden" onclick="handleToggleDesc()">selengkapnya</span>
                </div>
                <p id="mTranslateBtn" class="text-[11px] text-zinc-400 font-bold mb-2 cursor-pointer hidden" onclick="handleTranslate()">Lihat Terjemahan...</p>
                <div id="mHashtags" class="ig-hashtags"></div>
                <div id="mDateDisplay" class="ig-date"></div>
                <div id="seriesControl" class="hidden mt-6 p-4 bg-zinc-950 rounded-2xl border border-zinc-900">
                    <div class="flex justify-between items-center mb-4"><h4 class="text-[9px] font-black text-zinc-400 uppercase">Episode</h4><select id="seasonSel" class="bg-zinc-900 text-white text-[10px] px-2 py-1 rounded" onchange="loadEpisodes()"></select></div>
                    <div id="episodeGrid" class="grid grid-cols-5 gap-2"></div>
                </div>
                <div id="serverList" class="grid grid-cols-3 gap-2 mt-6"></div>
                <div class="dl-grid">
                    <button id="btnDownload1" class="dl-link-btn" onclick="window.open(`https://dl.vidsrc.vip/${window.currentMediaType}/${window.currentMediaId}`)">Download 1</button>
                    <button id="btnDownload2" class="dl-link-btn" onclick="window.open(`https://multiembed.mov/directstream.php?video_id=${window.currentMediaId}&tmdb=1`)">Download 2</button>
                </div>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <i class="fa-solid fa-house cursor-pointer text-xl" onclick="location.reload()"></i>
        <i class="fa-solid fa-magnifying-glass cursor-pointer text-xl" onclick="openSearch()"></i>
        <i class="fa-regular fa-bookmark cursor-pointer text-xl" onclick="switchTab('bookmarks', document.getElementById('tabBookmark'))"></i>
    </nav>

    <script>
        const API_KEY = 'bfa7df5310c9974f62f26c6789a8c00d';
        let page = 1, loading = false, currentType = 'movie', currentGenre = '', currentYear = '', currentCountry = '', currentSchedule = 'trending', searchQuery = '', currentCompany = '', currentLibMode = false, currentCastId = '';
        let isExpanded = false, globalFullDesc = "", globalEnDesc = "", currentIdx = 0, startX = 0;

        window.onload = () => { 
            setTimeout(() => {
                const splash = document.getElementById('splashScreen');
                splash.style.opacity = '0';
                setTimeout(() => splash.style.display = 'none', 500);
            }, 2000);

            initFilters(); initHighlights(); loadFeed(); setupSwipe(); initSmartSearch(); 
            window.addEventListener('scroll', () => { document.getElementById('backToTop').style.display = window.scrollY > 500 ? 'flex' : 'none'; }); 
        };

        function initSmartSearch() { const inp = document.getElementById('searchInp'); const drop = document.getElementById('smartSearchDropdown'); let timeout = null; inp.addEventListener('input', () => { clearTimeout(timeout); const q = inp.value.trim(); if(q.length < 2) { drop.style.display = 'none'; return; } timeout = setTimeout(async () => { const res = await fetch(`https://api.themoviedb.org/3/search/multi?query=${encodeURIComponent(q)}&api_key=${API_KEY}&language=id-ID`); const data = await res.json(); const results = (data.results || []).slice(0, 5); if(results.length) { drop.innerHTML = results.map(m => `<div class="smart-item flex items-center p-2.5 gap-3 border-b border-zinc-800" onclick="openModal(${m.id}, '${m.media_type || 'movie'}')"><img src="https://image.tmdb.org/t/p/w92${m.poster_path || m.profile_path}" class="w-9 h-12 object-cover rounded"><div class="smart-info"><span class="smart-name text-xs font-semibold text-white">${m.title || m.name}</span><br><span class="smart-meta text-[10px] text-zinc-500">${m.media_type === 'tv' ? 'Series' : 'Film'}</span></div></div>`).join(''); drop.style.display = 'block'; } else { drop.style.display = 'none'; } }, 300); }); }
        
        function initHighlights() { 
            const hls = [
                {n: 'Disney', com: '2|6125|3166|34213', l: 'DSNY', t: 'movie'},
                {n: 'Pixar', com: '3', l: 'PIXR', t: 'movie'},
                {n: 'Dreamworks', com: '521|7|1778', l: 'DRMW', t: 'movie'},
                {n: 'Ghibli', com: '10342', l: 'GHBL', t: 'movie'},
                {n: 'Anime', g: 16, l: 'ANIM', t: 'movie', c: 'JP'},
                {n: 'Indonesia', c: 'ID', l: 'INDO', t: 'movie'},
                {n: 'Korea', c: 'KR', l: 'KOR', t: 'movie'},
                {n: 'India', c: 'IN', l: 'INDI', t: 'movie'},
                {n: 'Thailand', c: 'TH', l: 'THAI', t: 'movie'}
            ]; 
            const cont = document.getElementById('highlightList'); 
            hls.forEach(h => { 
                const div = document.createElement('div'); 
                div.className = 'highlight-item'; 
                div.onclick = () => { currentLibMode = false; currentCastId = ''; searchQuery = ''; currentCountry = h.c || ''; currentGenre = h.g || ''; currentCompany = h.com || ''; currentSchedule = 'trending'; currentType = h.t; loadFeed(true); }; 
                div.innerHTML = `<div class="highlight-circle"><span class="hl-logo">${h.l}</span></div><div class="highlight-text">${h.n}</div>`; 
                cont.appendChild(div); 
            }); 
        }

        function initFilters() { const yD = document.getElementById('yearDropdown'); let yearHTML = '<div class="filter-item sticky-reset" onclick="setYear(\'\')">Semua Tahun</div>'; for(let y=2026; y>=1900; y--) yearHTML += `<div class="filter-item" onclick="setYear(${y})">${y}</div>`; yD.innerHTML = yearHTML; const countries = [['ID','Indonesia'],['US','USA'],['KR','Korea Selatan'],['JP','Jepang']]; const cD = document.getElementById('countryDropdown'); let countryHTML = '<div class="filter-item sticky-reset" onclick="setCountry(\'\',\'Negara\')">Semua Negara</div>'; countries.forEach(c => countryHTML += `<div class="filter-item" onclick="setCountry('${c[0]}','${c[1]}')">${c[1]}</div>`); cD.innerHTML = countryHTML; const genres = [[28,'Action'],[12,'Adventure'],[16,'Animasi'],[35,'Komedi'],[27,'Horror'],[878,'Sci-Fi']]; const gD = document.getElementById('genreDropdown'); let genreHTML = '<div class="filter-item sticky-reset" onclick="setGenre(\'\',\'Genre\')">Semua Genre</div>'; genres.forEach(g => genreHTML += `<div class="filter-item" onclick="setGenre('${g[0]}','${g[1]}')">${g[1]}</div>`); gD.innerHTML = genreHTML; }
        function toggleFilter(e, id) { e.stopPropagation(); document.querySelectorAll('.filter-dropdown').forEach(el => el.style.display = 'none'); const d = document.getElementById(id); d.style.display = 'block'; document.getElementById('filterOverlay').style.display = 'block'; }
        function closeD() { document.querySelectorAll('.filter-dropdown').forEach(d => d.style.display = 'none'); document.getElementById('filterOverlay').style.display = 'none'; document.body.style.overflow = 'auto'; }

        async function loadFeed(isNew = true) {
            if(loading) return; loading = true;
            const isSearchActive = document.getElementById('searchOverlay').style.display === 'block';
            const grid = isSearchActive ? document.getElementById('searchGrid') : document.getElementById('feedGrid');
            if(isNew) { page = 1; grid.innerHTML = ''; }
            let url;
            if(currentCastId) url = `https://api.themoviedb.org/3/person/${currentCastId}/combined_credits?api_key=${API_KEY}&language=id-ID`;
            else if(searchQuery) url = `https://api.themoviedb.org/3/search/multi?query=${encodeURIComponent(searchQuery)}&api_key=${API_KEY}&language=id-ID&page=${page}`;
            else {
                let endpoint = (currentType === 'tv') ? 'discover/tv' : 'discover/movie';
                url = `https://api.themoviedb.org/3/${endpoint}?api_key=${API_KEY}&language=id-ID&page=${page}&include_adult=false&sort_by=popularity.desc`;
                if(currentCountry) url += `&with_origin_country=${currentCountry}`;
                if(currentGenre) url += `&with_genres=${currentGenre}`;
                if(currentCompany) url += `&with_companies=${currentCompany}`;
                if(currentYear) url += (endpoint === 'discover/tv' ? `&first_air_date_year=${currentYear}` : `&primary_release_year=${currentYear}`);
            }
            try { const res = await fetch(url); const data = await res.json(); renderGrid(data.results || data.cast || [], grid); } catch(e) {}
            loading = false;
        }

        function renderGrid(items, grid) { items.forEach(m => { if(!m.poster_path) return; const mType = m.media_type || (currentType === 'tv' ? 'tv' : 'movie'); const card = document.createElement('div'); card.className = 'post-card'; card.onclick = () => openModal(m.id, mType); card.innerHTML = `<div class="badge-rating">★ ${(m.vote_average||0).toFixed(1)}</div><div class="badge-type">${mType==='tv'?'SERIES':'FILM'}</div><img src="https://image.tmdb.org/t/p/w342${m.poster_path}">`; grid.appendChild(card); }); }
        
        function openSearch() { document.getElementById('searchOverlay').style.display = 'block'; document.getElementById('searchInp').focus(); }
        function closeSearch() { document.getElementById('searchOverlay').style.display = 'none'; searchQuery=''; }
        function searchAction() { searchQuery = document.getElementById('searchInp').value; loadFeed(true); document.getElementById('smartSearchDropdown').style.display = 'none'; }
        
        function toggleFilterBar() { const b = document.getElementById('filterBar'); b.style.display = b.style.display === 'block' ? 'none' : 'block'; }
        function setSchedule(v, el) { document.querySelectorAll('.btn-ig').forEach(b=>b.classList.remove('active')); el.classList.add('active'); currentSchedule=v; loadFeed(true); }
        function setYear(y) { currentYear=y; document.getElementById('yearBtn').innerText=y||'Tahun'; closeD(); loadFeed(true); }
        function setCountry(c, n) { currentCountry=c; document.getElementById('btnCountry').innerText=n; closeD(); loadFeed(true); }
        function setGenre(g, n) { currentGenre=g; document.getElementById('btnGenre').innerText=n; closeD(); loadFeed(true); }

        async function openModal(id, type) {
            window.currentMediaId = id; window.currentMediaType = type;
            document.getElementById('movieModal').style.display = 'block'; document.body.style.overflow = 'hidden'; currentIdx = 0;
            const rId = await fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=${API_KEY}&language=id-ID&append_to_response=videos,credits`);
            const dId = await rId.json();
            const vids = (dId.videos?.results || []).filter(v => v.site === 'YouTube').slice(0, 4);
            const track = document.getElementById('carouselTrack'), dots = document.getElementById('carouselDots');
            track.innerHTML = ''; dots.innerHTML = ''; track.style.transform = 'translateX(0)';
            
            if(vids.length > 0) { 
                vids.forEach((v, i) => { track.innerHTML += `<div class="carousel-slide"><iframe src="https://www.youtube.com/embed/${v.key}?rel=0" class="w-full h-full" allowfullscreen></iframe></div>`; dots.innerHTML += `<div class="dot w-1.5 h-1.5 rounded-full ${i===currentIdx?'bg-blue-500':'bg-zinc-700'}"></div>`; }); document.getElementById('swipeOverlay').style.display = 'block'; 
            } else { 
                track.innerHTML = `<div class="carousel-slide"><iframe src="https://vidrock.net/embed/${type}/${id}${type==='tv'?'/1/1':''}" class="w-full h-full" allowfullscreen></iframe></div>`; dots.innerHTML = `<div class="dot bg-blue-500 w-1.5 h-1.5 rounded-full"></div>`; document.getElementById('swipeOverlay').style.display = 'none'; 
            }
            
            document.getElementById('castContainer').innerHTML = (dId.credits?.cast || []).slice(0, 10).map(c => `<div class="cast-item min-w-[65px] text-center"><img src="${c.profile_path ? 'https://image.tmdb.org/t/p/w185' + c.profile_path : 'https://www.themoviedb.org/assets/2/v4/glyphicons/basic/glyphicons-basic-4-user-3245c3f3347706a035c9744ffaa5d174e48be3b860667e406723f3bc8160f47e.svg'}" class="w-14 h-14 rounded-full object-cover mx-auto border-2 border-zinc-800"><span class="text-[9px] block mt-1">${c.name}</span></div>`).join('');
            document.getElementById('mLikeDisplay').innerText = `${Math.floor((dId.vote_average || 0) * 1234).toLocaleString('id-ID')} suka`; document.getElementById('mTitle').innerText = dId.title || dId.name;
            globalFullDesc = dId.overview || "Sinopsis tidak tersedia.";
            isExpanded = false; renderSynopsis();
            const rel = dId.release_date || dId.first_air_date || ""; document.getElementById('mHashtags').innerText = `#${(dId.title||dId.name||"").replace(/\s+/g, '')} #${rel.split('-')[0]}`; document.getElementById('mDateDisplay').innerText = rel;
            document.getElementById('serverList').innerHTML = `<button class="server-btn" onclick="playVid('https://vidrock.net/embed/${type}/${id}${type==='tv'?'/1/1':''}', this)">Server 1</button><button class="server-btn" onclick="playVid('https://vidsrc.me/embed/${type}?tmdb=${id}', this)">Server 2</button><button class="server-btn" onclick="playVid('https://embed.smashystream.com/playere.php?tmdb=${id}', this)">Server 3</button>`;
            if(type === 'tv') { document.getElementById('seriesControl').classList.remove('hidden'); loadEpisodes(); } else { document.getElementById('seriesControl').classList.add('hidden'); }
            updateLibButtons(id);
        }

        async function handleTranslate() { const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=id&dt=t&q=${encodeURIComponent(globalFullDesc)}`); const data = await res.json(); globalFullDesc = data[0].map(x => x[0]).join(''); renderSynopsis(); document.getElementById('mTranslateBtn').classList.add('hidden'); }
        function closeModal() { document.getElementById('movieModal').style.display = 'none'; document.body.style.overflow = 'auto'; }
        function renderSynopsis() { const descEl = document.getElementById('mDesc'), toggleBtn = document.getElementById('mToggleBtn'); if (globalFullDesc.length > 90) { toggleBtn.classList.remove('hidden'); descEl.innerText = isExpanded ? globalFullDesc : globalFullDesc.substring(0, 90) + "..."; toggleBtn.innerText = isExpanded ? "ringkas" : "selengkapnya"; } else { descEl.innerText = globalFullDesc; toggleBtn.classList.add('hidden'); } }
        function handleToggleDesc() { isExpanded = !isExpanded; renderSynopsis(); }
        function playVid(url, el) { document.getElementById('carouselTrack').innerHTML = `<div class="carousel-slide"><iframe src="${url}" class="w-full h-full" allowfullscreen></iframe></div>`; document.getElementById('carouselDots').innerHTML = `<div class="dot bg-blue-500 w-1.5 h-1.5 rounded-full"></div>`; document.getElementById('swipeOverlay').style.display = 'none'; document.querySelectorAll('.server-btn').forEach(b => b.classList.remove('active-link')); el.classList.add('active-link'); }
        function setupSwipe() { const overlay = document.getElementById('swipeOverlay'); overlay.addEventListener('touchstart', e => { startX = e.touches[0].clientX; }, {passive:true}); overlay.addEventListener('touchend', e => { let diff = startX - e.changedTouches[0].clientX; const slides = document.querySelectorAll('.carousel-slide'); if(Math.abs(diff) > 50 && slides.length > 1) { if(diff > 0 && currentIdx < slides.length - 1) currentIdx++; else if(diff < 0 && currentIdx > 0) currentIdx--; document.getElementById('carouselTrack').style.transform = `translateX(-${currentIdx * 100}%)`; document.querySelectorAll('.dot').forEach((d, i) => { d.className = `dot w-1.5 h-1.5 rounded-full ${i===currentIdx?'bg-blue-500':'bg-zinc-700'}`; }); } }); }
        function updateLibButtons(id) { const isL = JSON.parse(localStorage.getItem('likes') || '[]').some(x=>x.id==id); const isB = JSON.parse(localStorage.getItem('bookmarks') || '[]').some(x=>x.id==id); document.getElementById('btnLikeModal').className = isL ? 'fa-solid fa-heart text-red-500 interaction-icon' : 'fa-regular fa-heart interaction-icon'; document.getElementById('btnBookModal').className = isB ? 'fa-solid fa-bookmark text-white interaction-icon' : 'fa-regular fa-bookmark interaction-icon'; document.getElementById('btnLikeModal').onclick = () => toggleLib('likes'); document.getElementById('btnBookModal').onclick = () => toggleLib('bookmarks'); }
        function toggleLib(k) { let items = JSON.parse(localStorage.getItem(k) || '[]'); const idx = items.findIndex(x => x.id == window.currentMediaId); idx > -1 ? items.splice(idx,1) : items.push({id: window.currentMediaId, type: window.currentMediaType}); localStorage.setItem(k, JSON.stringify(items)); updateLibButtons(window.currentMediaId); }
        async function switchTab(mode, el) { document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active')); el.classList.add('active'); if(mode === 'likes' || mode === 'bookmarks') { currentLibMode = true; showLibrary(mode); } else { currentLibMode = false; loadFeed(true); } }
        async function showLibrary(k) { const items = JSON.parse(localStorage.getItem(k) || '[]'); const grid = document.getElementById('feedGrid'); grid.innerHTML = ''; for(const i of items) { try { const r = await fetch(`https://api.themoviedb.org/3/${i.type}/${i.id}?api_key=${API_KEY}&language=id-ID`); const m = await r.json(); renderGrid([m], grid); } catch(e){} } }
        window.onscroll = () => { if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 1000 && !loading && !currentLibMode) { page++; loadFeed(false); } };
    </script>
</body>
</html>
