<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>amnesfubbia xx1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@1,700&family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { background-color: #000; color: #fff; font-family: 'Inter', sans-serif; margin: 0; overflow-x: hidden; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .fixed-header-section { position: fixed; top: 0; width: 100%; z-index: 100; background: #000; border-bottom: 1px solid #1c1c1c; }
        .ig-header { padding: 12px 15px 5px 15px; }

        .ig-logo { font-family: 'DM Sans', sans-serif; font-weight: 700; font-style: italic; font-size: 24px; letter-spacing: -0.8px; text-transform: lowercase; cursor: pointer; }
        .verified-icon { font-size: 13px; color: #0095f6; margin-left: 5px; }

        .search-container { background: #0a0a0a; border-radius: 8px; display: flex; align-items: center; padding: 7px 12px; flex-grow: 1; border: 1px solid #1c1c1c; }
        .search-container input { background: transparent !important; border: none !important; color: white !important; font-size: 13px; width: 100%; outline: none !important; box-shadow: none !important; margin-left: 8px; }

        /* Style Seragam untuk Selektor */
        .selector-box { background: #0a0a0a; border: 1px solid #1c1c1c; border-radius: 8px; padding: 8px 6px; font-size: 8px; font-weight: 800; color: #fff; text-transform: uppercase; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 3px; white-space: nowrap; }
        
        .custom-dropdown { display: none; position: fixed; width: 140px; max-height: 300px; background: #121212; border: 1px solid #1c1c1c; border-radius: 12px; z-index: 110; overflow-y: auto; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .dropdown-item { padding: 12px; font-size: 11px; font-weight: 600; text-align: center; border-bottom: 1px solid #1c1c1c; color: #888; cursor: pointer; text-transform: uppercase; }
        .dropdown-item:active { background: #1a1a1a; color: #fff; }

        .category-wrapper { padding: 5px 15px 12px 15px; }
        .pill-grid { display: flex; gap: 6px; margin-bottom: 8px; }
        .pill { flex: 1; background: transparent; border: 1px solid #1c1c1c; color: #fff; padding: 8px 0; border-radius: 8px; font-size: 10px; font-weight: 800; text-transform: uppercase; text-align: center; cursor: pointer; }
        .pill.active { border-color: #fff; }

        /* Grid untuk 4 Selektor agar muat */
        .selectors-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
        
        .movie-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; padding-top: 195px; padding-bottom: 100px; }
        .post-card { position: relative; aspect-ratio: 2/3; background: #0a0a0a; overflow: hidden; cursor: pointer; }
        .post-card img { width: 100%; height: 100%; object-fit: cover; }
        
        .badge-type { position: absolute; top: 8px; right: 8px; font-size: 13px; color: #fff; z-index: 5; text-shadow: 0 0 4px rgba(0,0,0,0.8); }
        .badge-rating { position: absolute; top: 6px; left: 6px; padding: 2px 4px; border-radius: 2px; font-size: 7px; font-weight: 900; z-index: 5; background: #f5c518; color: #000; display: flex; align-items: center; gap: 2px; }
        
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: #000; border-top: 1px solid #1c1c1c; display: flex; justify-content: space-around; padding: 12px 0; z-index: 300; padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
        .nav-item { color: #fff; font-size: 20px; cursor: pointer; }
        
        .modal-player { display: none; position: fixed; inset: 0; z-index: 200; background: #000; overflow-y: auto; }
        .skeleton { background: linear-gradient(90deg, #0a0a0a 25%, #1a1a1a 50%, #0a0a0a 75%); background-size: 200% 100%; animation: skeleton-loading 1.5s infinite; }
        #backToTop { position: fixed; bottom: 85px; right: 20px; background: #fff; color: #000; width: 40px; height: 40px; border-radius: 50%; display: none; align-items: center; justify-content: center; z-index: 140; cursor: pointer; }
        @keyframes skeleton-loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    </style>
</head>
<body>
    <div id="loader" style="position:fixed; top:0; left:0; height:1.5px; background:#fff; width:0%; transition:width 0.3s; z-index:1000;"></div>
    <div id="backToTop" onclick="window.scrollTo({top: 0, behavior: 'smooth'})"><i class="fa-solid fa-arrow-up text-sm"></i></div>

    <div class="fixed-header-section">
        <header class="ig-header">
            <div class="flex justify-between items-center">
                <div class="flex items-center">
                    <h1 class="ig-logo" onclick="location.reload()">amnesfubbia <span class="text-white opacity-40 font-normal italic">xx1</span></h1>
                    <i class="fa-solid fa-circle-check verified-icon"></i>
                </div>
                <div class="flex gap-6 text-xl"><i class="fa-regular fa-square-plus cursor-pointer"></i><i class="fa-regular fa-heart cursor-pointer" onclick="showLibrary('likes')"></i></div>
            </div>
            <div class="search-area flex items-center gap-2 mt-2">
                <div class="search-container">
                    <i class="fa-solid fa-magnifying-glass text-zinc-600 text-[10px]"></i>
                    <input type="text" id="searchInp" placeholder="Cari sinema dunia..." onkeydown="if(event.key==='Enter') searchAction()" autocomplete="off">
                </div>
            </div>
        </header>
        
        <div class="category-wrapper">
            <div class="pill-grid">
                <button class="pill active" onclick="setFilter('type', 'multi', this)">Semua</button>
                <button class="pill" onclick="setFilter('type', 'movie', this)">Film</button>
                <button class="pill" onclick="setFilter('type', 'tv', this)">Series</button>
                <button class="pill border-blue-500 text-blue-400" onclick="setTrendingRegion('ID', this)">Trending ID</button>
            </div>

            <div class="selectors-grid">
                <div class="selector-box" onclick="toggleDropdown('yearDropdown', this)">
                    <span id="yearVal">TAHUN</span> <i class="fa-solid fa-chevron-down text-[5px]"></i>
                </div>
                <div class="selector-box" onclick="toggleDropdown('countryDropdown', this)">
                    <span id="countryVal">NEGARA</span> <i class="fa-solid fa-chevron-down text-[5px]"></i>
                </div>
                <div class="selector-box" onclick="toggleDropdown('genreDropdown', this)">
                    <span id="genreVal">GENRE</span> <i class="fa-solid fa-chevron-down text-[5px]"></i>
                </div>
                <div class="selector-box" onclick="toggleDropdown('platformDropdown', this)">
                    <span id="platformVal">STUDIO</span> <i class="fa-solid fa-chevron-down text-[5px]"></i>
                </div>
            </div>
        </div>
    </div>

    <div id="yearDropdown" class="custom-dropdown no-scrollbar"></div>
    <div id="countryDropdown" class="custom-dropdown no-scrollbar"></div>
    <div id="genreDropdown" class="custom-dropdown no-scrollbar"></div>
    <div id="platformDropdown" class="custom-dropdown no-scrollbar"></div>

    <main id="feedGrid" class="movie-grid"></main>

    <nav class="bottom-nav">
        <div class="nav-item" onclick="location.reload();"><i class="fa-solid fa-house"></i></div>
        <div class="nav-item" onclick="document.getElementById('searchInp').focus();"><i class="fa-solid fa-magnifying-glass"></i></div>
        <div class="nav-item" onclick="showLibrary('bookmarks');"><i class="fa-regular fa-bookmark"></i></div>
        <div class="nav-item" onclick="alert('Amnesfubbia XX1\nBy Anasteas')"><i class="fa-regular fa-user"></i></div>
    </nav>

    <div id="movieModal" class="modal-player">
        <div class="max-w-xl mx-auto pb-40">
            <div class="px-4 h-[54px] flex items-center border-b border-zinc-900 sticky top-0 bg-black z-50">
                <i class="fa-solid fa-chevron-left text-xl cursor-pointer" onclick="closeModal()"></i>
                <div class="flex-grow text-center"><h2 id="mTitle" class="truncate font-bold text-sm"></h2></div>
            </div>
            <div class="aspect-video bg-zinc-900"><iframe id="videoPlayer" class="w-full h-full" allowfullscreen></iframe></div>
            </div>
    </div>

    <script>
        const API_KEY = 'bfa7df5310c9974f62f26c6789a8c00d';
        let page = 1, loading = false, currentType = 'multi', currentGenre = '', currentYear = '', currentCountry = '', currentPlatform = '', currentRegion = '', isLibraryMode = false;

        const getStore = (key) => JSON.parse(localStorage.getItem(key) || '[]');
        const saveStore = (key, data) => localStorage.setItem(key, JSON.stringify(data));

        window.onload = () => { initDropdowns(); loadFeed(); };

        function initDropdowns() {
            // Tahun
            const yD = document.getElementById('yearDropdown');
            let yH = '<div class="dropdown-item" onclick="setVal(\'year\', \'\', \'TAHUN\')">SEMUA TAHUN</div>';
            for(let y = 2026; y >= 1930; y--) yH += `<div class="dropdown-item" onclick="setVal(\'year\', ${y}, ${y})">${y}</div>`;
            yD.innerHTML = yH;

            // Negara
            const countries = { 'US':'USA', 'KR':'Korea', 'JP':'Jepang', 'ID':'Indonesia', 'TH':'Thailand', 'CN':'China', 'IN':'India', 'FR':'Prancis' };
            const cD = document.getElementById('countryDropdown');
            let cH = '<div class="dropdown-item" onclick="setVal(\'country\', \'\', \'NEGARA\')">SEMUA NEGARA</div>';
            for(const code in countries) cH += `<div class="dropdown-item" onclick="setVal(\'country\', \'${code}\', \'${countries[code]}\')">${countries[code]}</div>`;
            cD.innerHTML = cH;

            // Genre
            const genres = { '16':'Animasi', '27':'Horor', '35':'Komedi', '10749':'Romantis', '28':'Aksi', '18':'Drama', '878':'Sci-Fi', '9648':'Misteri' };
            const gD = document.getElementById('genreDropdown');
            let gH = '<div class="dropdown-item" onclick="setVal(\'genre\', \'\', \'GENRE\')">SEMUA GENRE</div>';
            for(const id in genres) gH += `<div class="dropdown-item" onclick="setVal(\'genre\', \'${id}\', \'${genres[id]}\')">${genres[id]}</div>`;
            gD.innerHTML = gH;

            // Platform / Studio (ID TMDB untuk Network Populer)
            const platforms = { '213':'Netflix', '1024':'Amazon', '2739':'Disney+', '49':'HBO', '2552':'Apple TV+', '4330':'Paramount+' };
            const pD = document.getElementById('platformDropdown');
            let pH = '<div class="dropdown-item" onclick="setVal(\'platform\', \'\', \'STUDIO\')">SEMUA STUDIO</div>';
            for(const id in platforms) pH += `<div class="dropdown-item" onclick="setVal(\'platform\', \'${id}\', \'${platforms[id]}\')">${platforms[id]}</div>`;
            pD.innerHTML = pH;
        }

        function toggleDropdown(id, el) {
            const d = document.getElementById(id);
            const isVisible = d.style.display === 'block';
            document.querySelectorAll('.custom-dropdown').forEach(dd => dd.style.display = 'none');
            if(!isVisible) {
                const rect = el.getBoundingClientRect();
                d.style.top = (rect.bottom + 5) + 'px';
                d.style.left = (rect.left - 20) + 'px'; // Sedikit geser agar pas di layar kecil
                d.style.display = 'block';
            }
        }

        function setVal(type, val, label) {
            document.querySelectorAll('.custom-dropdown').forEach(d => d.style.display = 'none');
            if(type === 'year') { currentYear = val; document.getElementById('yearVal').innerText = label; }
            if(type === 'country') { currentCountry = val; document.getElementById('countryVal').innerText = label; }
            if(type === 'genre') { currentGenre = val; document.getElementById('genreVal').innerText = label; }
            if(type === 'platform') { currentPlatform = val; document.getElementById('platformVal').innerText = label; }
            currentRegion = ''; loadFeed(true);
        }

        async function loadFeed(isNew = true) {
            if (loading) return;
            loading = true; isLibraryMode = false;
            if (isNew) { page = 1; document.getElementById('feedGrid').innerHTML = Array(12).fill('<div class="post-card skeleton"></div>').join(''); }
            try {
                const lang = `&language=id-ID`;
                const year = currentYear ? (currentType === 'tv' ? `&first_air_date_year=${currentYear}` : `&primary_release_year=${currentYear}`) : '';
                const country = currentCountry ? `&with_origin_country=${currentCountry}` : '';
                const genre = currentGenre ? `&with_genres=${currentGenre}` : '';
                const platform = currentPlatform ? `&with_networks=${currentPlatform}` : '';
                
                let url = '';
                if (currentRegion) {
                    url = `https://api.themoviedb.org/3/trending/all/day?api_key=${API_KEY}${lang}&region=${currentRegion}&page=${page}`;
                } else {
                    const type = currentType === 'multi' ? 'movie' : currentType;
                    url = `https://api.themoviedb.org/3/discover/${type}?api_key=${API_KEY}${lang}${genre}${year}${country}${platform}&page=${page}`;
                }

                const res = await fetch(url);
                const data = await res.json();
                const items = (data.results || []).map(x => ({...x, m_type: x.media_type || (currentType === 'multi' ? 'movie' : currentType)}));

                if(isNew) document.getElementById('feedGrid').innerHTML = '';
                renderFeed(items);
            } catch (err) { console.error(err); }
            loading = false;
        }

        function renderFeed(data) {
            const grid = document.getElementById('feedGrid');
            data.forEach(m => {
                if (!m.poster_path) return;
                const card = document.createElement('div');
                card.className = 'post-card';
                card.onclick = () => openModal(m.id, m.m_type);
                card.innerHTML = `<div class="badge-rating"><i class="fa-solid fa-star text-[7px]"></i> ${m.vote_average?.toFixed(1) || '0.0'}</div><img src="https://image.tmdb.org/t/p/w342${m.poster_path}" onload="this.parentElement.classList.remove('skeleton')">`;
                grid.appendChild(card);
            });
        }

        function setFilter(t, v, el) { 
            document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
            el.classList.add('active');
            currentType = v; loadFeed(true);
        }

        function setTrendingRegion(region, el) {
            document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
            el.classList.add('active');
            currentRegion = region; currentPlatform = ''; currentCountry = ''; currentYear = ''; currentGenre = '';
            document.getElementById('yearVal').innerText = 'TAHUN';
            document.getElementById('countryVal').innerText = 'NEGARA';
            document.getElementById('genreVal').innerText = 'GENRE';
            document.getElementById('platformVal').innerText = 'STUDIO';
            loadFeed(true);
        }

        function closeModal() { document.getElementById('movieModal').style.display = 'none'; document.getElementById('videoPlayer').src = ''; document.body.style.overflow = 'auto'; }
        async function openModal(id, type) { 
            const modal = document.getElementById('movieModal'); modal.style.display = 'block';
            document.getElementById('mTitle').innerText = "Memuat...";
            const actualType = type === 'tv' ? 'tv' : 'movie';
            const res = await fetch(`https://api.themoviedb.org/3/${actualType}/${id}?api_key=${API_KEY}&language=id-ID`);
            const d = await res.json();
            document.getElementById('mTitle').innerText = d.title || d.name;
            document.getElementById('videoPlayer').src = type === 'tv' ? `https://vidrock.net/embed/tv/${id}/1/1` : `https://vidrock.net/embed/movie/${id}`;
        }
    </script>
</body>
</html>
