<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArkanulDin Encyclopedia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&family=Amiri&display=swap" rel="stylesheet">
    <style>
        body { background: #fdfdfd; font-family: 'Plus Jakarta Sans', sans-serif; color: #1e293b; }
        .arabic { font-family: 'Amiri', serif; font-size: 1.8rem; line-height: 2.5rem; text-align: right; }
        .detail-layer { position: fixed; inset: 0; background: white; z-index: 1000; transform: translateX(100%); transition: 0.4s ease-out; overflow-y: auto; }
        .detail-layer.active { transform: translateX(0); }
        .section-card { border: 1px solid #f1f5f9; border-radius: 24px; transition: 0.3s; }
        .section-card:active { background: #f8fafc; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="pb-10">

    <header class="p-8 sticky top-0 bg-white/80 backdrop-blur z-50 border-b border-slate-50">
        <h1 class="text-3xl font-black tracking-tighter italic">Arkanul<span class="text-emerald-600">Din</span></h1>
        <p class="text-[10px] font-bold text-slate-400 mt-1 uppercase tracking-[3px]">Ensiklopedia Lengkap Syariat & Akidah</p>
    </header>

    <main class="p-6 space-y-8">
        <div>
            <h2 class="text-2xl font-black italic mb-4 flex items-center gap-2">
                <span class="w-2 h-8 bg-emerald-500 rounded-full"></span> Rukun Islam
            </h2>
            <div class="space-y-3">
                <div onclick="show('syahadat')" class="section-card p-5 bg-white shadow-sm flex items-center justify-between">
                    <div class="flex items-center gap-4">
                        <span class="text-xl font-black text-emerald-500">01</span>
                        <div><h3 class="font-bold text-sm">SYAHADAT</h3><p class="text-[10px] text-slate-400">Ikrar Tauhid & Kenabian</p></div>
                    </div>
                    <i class="fa-solid fa-chevron-right text-slate-200"></i>
                </div>
                <div onclick="show('shalat')" class="section-card p-5 bg-white shadow-sm flex items-center justify-between">
                    <div class="flex items-center gap-4">
                        <span class="text-xl font-black text-emerald-500">02</span>
                        <div><h3 class="font-bold text-sm">SHALAT</h3><p class="text-[10px] text-slate-400">Fardu, Sunnah & Niat</p></div>
                    </div>
                    <i class="fa-solid fa-chevron-right text-slate-200"></i>
                </div>
                <div onclick="show('zakat')" class="section-card p-5 bg-white shadow-sm flex items-center justify-between">
                    <div class="flex items-center gap-4">
                        <span class="text-xl font-black text-emerald-500">03</span>
                        <div><h3 class="font-bold text-sm">ZAKAT</h3><p class="text-[10px] text-slate-400">Fitrah, Mal & Perhitungan</p></div>
                    </div>
                    <i class="fa-solid fa-chevron-right text-slate-200"></i>
                </div>
                <div onclick="show('puasa')" class="section-card p-5 bg-white shadow-sm flex items-center justify-between">
                    <div class="flex items-center gap-4">
                        <span class="text-xl font-black text-emerald-500">04</span>
                        <div><h3 class="font-bold text-sm">PUASA</h3><p class="text-[10px] text-slate-400">Ramadhan, Syarat & Batal</p></div>
                    </div>
                    <i class="fa-solid fa-chevron-right text-slate-200"></i>
                </div>
                <div onclick="show('haji')" class="section-card p-5 bg-white shadow-sm flex items-center justify-between">
                    <div class="flex items-center gap-4">
                        <span class="text-xl font-black text-emerald-500">05</span>
                        <div><h3 class="font-bold text-sm">HAJI</h3><p class="text-[10px] text-slate-400">Rukun & Syarat Mampu</p></div>
                    </div>
                    <i class="fa-solid fa-chevron-right text-slate-200"></i>
                </div>
            </div>
        </div>

        <div>
            <h2 class="text-2xl font-black italic mb-4 flex items-center gap-2">
                <span class="w-2 h-8 bg-blue-500 rounded-full"></span> Rukun Iman
            </h2>
            <div class="grid grid-cols-2 gap-3">
                <div onclick="show('iman')" class="p-6 bg-white border border-slate-100 rounded-3xl shadow-sm text-center">
                    <i class="fa-solid fa-book-quran text-blue-500 text-2xl mb-2"></i>
                    <h3 class="font-bold text-[10px] tracking-widest uppercase">Detail 6 Iman</h3>
                </div>
            </div>
        </div>
    </main>

    <div id="layer" class="detail-layer no-scrollbar">
        <nav class="p-6 sticky top-0 bg-white/90 backdrop-blur border-b flex items-center justify-between z-[100]">
            <button onclick="hide()" class="text-xl"><i class="fa-solid fa-arrow-left-long"></i></button>
            <span id="layerTitle" class="font-black italic text-sm uppercase tracking-widest"></span>
            <div class="w-5"></div>
        </nav>
        <div id="layerContent" class="p-8 pb-20 space-y-8"></div>
    </div>

    <script>
        const content = {
            syahadat: {
                title: "Syahadat",
                html: `
                    <div class="space-y-6">
                        <div class="bg-emerald-50 p-6 rounded-3xl border border-emerald-100">
                            <p class="arabic mb-4">أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا اللهُ وَأَشْهَدُ أَنَّ مُحَمَّدًا رَسُولُ اللهِ</p>
                            <p class="text-xs font-bold text-emerald-700 italic">"Aku bersaksi bahwa tidak ada Tuhan selain Allah, dan aku bersaksi bahwa Muhammad adalah utusan Allah."</p>
                        </div>
                        <div>
                            <h4 class="font-black text-sm mb-3 underline">MAKNA PER KATA:</h4>
                            <ul class="text-xs space-y-2 text-slate-600">
                                <li><b>Asyhadu:</b> Aku bersaksi (dengan hati, lisan, perbuatan).</li>
                                <li><b>An Laa ilaaha:</b> Bahwa tidak ada Ilah (sembahan).</li>
                                <li><b>Illallaah:</b> Kecuali Allah.</li>
                                <li><b>Wa Asyhadu:</b> Dan aku bersaksi.</li>
                                <li><b>Anna Muhammadan:</b> Sesungguhnya Muhammad.</li>
                                <li><b>Rasuulullaah:</b> Utusan Allah.</li>
                            </ul>
                        </div>
                    </div>
                `
            },
            shalat: {
                title: "Shalat",
                html: `
                    <div class="space-y-8">
                        <div>
                            <h4 class="font-black text-emerald-600 mb-4">1. SHALAT FARDU (WAJIB)</h4>
                            <div class="space-y-3">
                                <div class="p-4 bg-slate-50 rounded-2xl text-xs">
                                    <b>Subuh:</b> 2 Rakaat. Niat: <i>Ushalli fardhash-shubhi rak'ataini mustaqbilal qiblati ada'an lillahi ta'ala.</i>
                                </div>
                                <div class="p-4 bg-slate-50 rounded-2xl text-xs">
                                    <b>Dzuhur:</b> 4 Rakaat. Niat: <i>Ushalli fardhadh-zhuhri arba'a raka'atin...</i>
                                </div>
                                <div class="p-4 bg-slate-50 rounded-2xl text-xs">
                                    <b>Ashar:</b> 4 Rakaat. Niat: <i>Ushalli fardhal-'ashri arba'a raka'atin...</i>
                                </div>
                                <div class="p-4 bg-slate-50 rounded-2xl text-xs">
                                    <b>Maghrib:</b> 3 Rakaat. Niat: <i>Ushalli fardhal-maghribi tsalatsa raka'atin...</i>
                                </div>
                                <div class="p-4 bg-slate-50 rounded-2xl text-xs">
                                    <b>Isya:</b> 4 Rakaat. Niat: <i>Ushalli fardhal-'isyai arba'a raka'atin...</i>
                                </div>
                            </div>
                        </div>
                        <div>
                            <h4 class="font-black text-emerald-600 mb-4">2. SHALAT SUNNAH</h4>
                            <ul class="text-xs space-y-2 text-slate-600 list-disc pl-4">
                                <li><b>Rawatib:</b> Pengiring shalat fardu (Qabliyah & Ba'diyah).</li>
                                <li><b>Tahajjud:</b> Sepertiga malam.</li>
                                <li><b>Dhuha:</b> Pagi hari (rezeki).</li>
                                <li><b>Witir:</b> Penutup shalat malam (ganjil).</li>
                            </ul>
                        </div>
                    </div>
                `
            },
            zakat: {
                title: "Zakat",
                html: `
                    <div class="space-y-8">
                        <div class="bg-orange-50 p-6 rounded-3xl border border-orange-100">
                            <h4 class="font-black text-orange-700 mb-2">ZAKAT FITRAH</h4>
                            <p class="text-xs text-orange-600 italic leading-relaxed">Wajib bagi setiap jiwa muslim di akhir Ramadhan. Besaran: 1 Sha' (sekitar 2.5kg atau 3.5 Liter) makanan pokok daerah masing-masing.</p>
                        </div>
                        <div>
                            <h4 class="font-black text-emerald-600 mb-4">ZAKAT MAL (HARTA)</h4>
                            <div class="space-y-4 text-xs">
                                <p>Wajib dikeluarkan jika mencapai <b>Nisab</b> (batas minimum) dan <b>Haul</b> (1 tahun kepemilikan).</p>
                                <div class="p-4 border rounded-2xl">
                                    <b>Emas & Perak:</b> Nisab emas 85gr. Kadar zakat: <b>2.5%</b>.
                                </div>
                                <div class="p-4 border rounded-2xl">
                                    <b>Perdagangan:</b> Modal + Keuntungan + Piutang - Hutang. Jika > 85gr emas, zakat <b>2.5%</b>.
                                </div>
                                <div class="p-4 border rounded-2xl">
                                    <b>Pertanian:</b> Nisab 5 Wasq (653kg). Pengairan alami 10%, pengairan buatan 5%.
                                </div>
                            </div>
                        </div>
                    </div>
                `
            },
            puasa: {
                title: "Puasa",
                html: `
                    <div class="space-y-8">
                        <div class="p-5 border-l-4 border-emerald-500 bg-slate-50">
                            <p class="text-xs font-bold mb-2">NIAT PUASA RAMADHAN:</p>
                            <p class="arabic text-sm">نَوَيْتُ صَوْمَ غَدٍ عَنْ أَدَاءِ فَرْضِ شَهْرِ رَمَضَانَ هَذِهِ السَّنَةِ لِلَّهِ تَعَالَى</p>
                            <p class="text-[10px] mt-2 italic text-slate-500">"Nawaitu shauma ghadin 'an ada'i fardhi syahri ramadhana hadzihis sanati lillahi ta'ala."</p>
                        </div>
                        <div>
                            <h4 class="font-black text-red-600 mb-4">YANG MEMBATALKAN:</h4>
                            <ul class="text-xs space-y-3 text-slate-600">
                                <li class="flex gap-3"><span>1.</span><span>Makan & minum dengan sengaja.</span></li>
                                <li class="flex gap-3"><span>2.</span><span>Muntah dengan sengaja.</span></li>
                                <li class="flex gap-3"><span>3.</span><span>Haid & Nifas bagi wanita.</span></li>
                                <li class="flex gap-3"><span>4.</span><span>Berhubungan suami istri di siang hari.</span></li>
                                <li class="flex gap-3"><span>5.</span><span>Murtad atau hilang akal (gila).</span></li>
                            </ul>
                        </div>
                    </div>
                `
            },
            haji: {
                title: "Haji",
                html: `
                    <div class="space-y-6">
                        <div class="bg-slate-900 text-white p-6 rounded-3xl">
                            <h4 class="text-orange-400 font-bold mb-2">SYARAT WAJIB:</h4>
                            <p class="text-xs leading-relaxed">Islam, Baligh, Berakal, Merdeka, dan <b>ISTITHO'AH</b> (Mampu secara fisik, biaya, dan aman perjalanan).</p>
                        </div>
                        <div>
                            <h4 class="font-black mb-4 underline">RUKUN HAJI (TIDAK BOLEH DITINGGAL):</h4>
                            <ol class="text-xs space-y-4 text-slate-600">
                                <li><b>Ihram:</b> Niat memulai ibadah haji.</li>
                                <li><b>Wukuf di Arafah:</b> Puncak ibadah haji pada 9 Dzulhijjah.</li>
                                <li><b>Tawaf Ifadhah:</b> Mengelilingi Ka'bah 7 kali.</li>
                                <li><b>Sa'i:</b> Lari-lari kecil Shafa ke Marwah 7 kali.</li>
                                <li><b>Tahallul:</b> Mencukur/memotong rambut.</li>
                                <li><b>Tertib:</b> Sesuai urutan.</li>
                            </ol>
                        </div>
                    </div>
                `
            },
            iman: {
                title: "Rukun Iman",
                html: `
                    <div class="space-y-6">
                        <div class="p-5 bg-blue-50 border-r-4 border-blue-500 rounded-xl">
                            <h4 class="font-black text-blue-800 text-sm mb-2">1. IMAN KEPADA ALLAH</h4>
                            <p class="text-xs text-slate-600">Meyakini Tauhid Rububiyah, Uluhiyah, serta Nama dan Sifat-Nya.</p>
                        </div>
                        <div class="p-5 bg-blue-50 border-r-4 border-blue-500 rounded-xl">
                            <h4 class="font-black text-blue-800 text-sm mb-2">2. IMAN KEPADA MALAIKAT</h4>
                            <p class="text-xs text-slate-600 italic">Meyakini 10 Malaikat wajib: Jibril, Mikail, Israfil, Izrail, Munkar, Nakir, Raqib, Atid, Malik, Ridwan.</p>
                        </div>
                        <div class="p-5 bg-blue-50 border-r-4 border-blue-500 rounded-xl">
                            <h4 class="font-black text-blue-800 text-sm mb-2">3. IMAN KEPADA KITAB</h4>
                            <p class="text-xs text-slate-600">Taurat (Musa), Zabur (Daud), Injil (Isa), Al-Qur'an (Muhammad).</p>
                        </div>
                        <div class="p-5 bg-blue-50 border-r-4 border-blue-500 rounded-xl">
                            <h4 class="font-black text-blue-800 text-sm mb-2">4. IMAN KEPADA RASUL</h4>
                            <p class="text-xs text-slate-600">Meyakini 25 Nabi dan Rasul yang wajib diketahui.</p>
                        </div>
                        <div class="p-5 bg-blue-50 border-r-4 border-blue-500 rounded-xl">
                            <h4 class="font-black text-blue-800 text-sm mb-2">5. IMAN KEPADA HARI KIAMAT</h4>
                            <p class="text-xs text-slate-600 text-red-500">Meyakini adanya alam kubur, hari kebangkitan, hisab, surga & neraka.</p>
                        </div>
                        <div class="p-5 bg-blue-50 border-r-4 border-blue-500 rounded-xl">
                            <h4 class="font-black text-blue-800 text-sm mb-2">6. IMAN KEPADA QADHA & QADAR</h4>
                            <p class="text-xs text-slate-600">Meyakini takdir baik dan buruk berasal dari Allah SWT.</p>
                        </div>
                    </div>
                `
            }
        };

        function show(key) {
            const data = content[key];
            document.getElementById('layerTitle').innerText = data.title;
            document.getElementById('layerContent').innerHTML = data.html;
            document.getElementById('layer').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function hide() {
            document.getElementById('layer').classList.remove('active');
            document.body.style.overflow = 'auto';
        }
    </script>
</body>
</html>
