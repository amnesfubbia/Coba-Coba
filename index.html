<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Silmikaffah — Panduan Iman & Islam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<link rel="manifest" href="/manifest.json">
<style>
  :root{
    --paper:#000000;
    --paper-2:#0A0A0A;
    --ink:#EDEAE2;
    --ink-soft:#9C9689;
    --night:#000000;
    --night-2:#0D0D0D;
    --gold:#D8A94E;
    --clay:#3FAE6A;
    --line:#232323;
    --card:#0A0A0A;
    --app-h:100dvh;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:#000000;
    color:var(--ink);
    font-family:'Inter',sans-serif;
    line-height:1.55;
    display:flex;
    justify-content:center;
  }
  h1,h2,h3,.display{font-family:'Fraunces',serif;font-weight:600;letter-spacing:-0.01em;}
  .arabic{font-family:'Amiri',serif;direction:rtl;unicode-bidi:isolate;}
  button{font-family:inherit;}

  /* PHONE FRAME */
  #app{
    width:100%;
    max-width:430px;
    height:var(--app-h);
    background:var(--paper);
    display:flex;
    flex-direction:column;
    position:relative;
    overflow:hidden;
    box-shadow:0 0 0 1px #1A1A1A, 0 0 60px rgba(0,0,0,.6);
  }
  @media (min-width:460px){
    body{align-items:center;padding:24px 0;}
    #app{height:min(860px, 96dvh);border-radius:28px;}
  }

  /* TOP APP BAR */
  .appbar{
    flex:0 0 auto;
    background:var(--night);
    color:#F5F0E1;
    padding:16px 18px 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
    z-index:20;
  }
  .appbar .title{display:flex;align-items:center;gap:10px;}
  .appbar .logo{
    width:30px;height:30px;border-radius:8px;
    background:linear-gradient(135deg,var(--gold),var(--clay));
    display:flex;align-items:center;justify-content:center;
    font-family:'Fraunces',serif;font-weight:700;color:#000000;font-size:.95rem;
  }
  .appbar h1{font-size:1.08rem;margin:0;color:#F5F0E1;}
  .appbar .sub{font-size:.7rem;color:#8A8478;margin-top:1px;}
  .appbar .iconbtn{background:none;border:none;color:#EDE7D6;font-size:1.1rem;cursor:pointer;padding:6px;}

  /* SCREENS */
  .screens{flex:1 1 auto;overflow:hidden;position:relative;}
  .screen{
    position:absolute;inset:0;
    overflow-y:auto;
    padding:18px 18px 90px;
    display:none;
    -webkit-overflow-scrolling:touch;
  }
  .screen.active{display:block;}

  .eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:var(--clay);font-weight:700;margin-bottom:6px;}
  .screen-head{margin-bottom:18px;}
  .screen-head h2{font-size:1.35rem;margin:0 0 4px;}
  .screen-head p{margin:0;color:var(--ink-soft);font-size:.87rem;}

  /* HOME */
  .greet-card{
    background:linear-gradient(135deg,var(--night),var(--night-2));
    color:#F5F0E1;border-radius:16px;padding:20px;margin-bottom:16px;
    background-image:radial-gradient(1px 1px at 15% 25%, rgba(232,196,104,.5) 0, transparent 60%),
      radial-gradient(1px 1px at 75% 60%, rgba(232,196,104,.4) 0, transparent 60%),
      radial-gradient(1.5px 1.5px at 45% 75%, rgba(232,196,104,.5) 0, transparent 60%);
    position:relative;overflow:hidden;
  }
  .greet-card .eyebrow{color:var(--gold);}...
</style>
</head>
<body>

<div id="splash">
  <div class="splash-inner">
    <div class="splash-pattern"></div>
    <div class="splash-logo">۩</div>
    <h1 class="splash-title">Silmikaffah</h1>
    <p class="splash-tagline">Islam Kaffah, Satu Genggaman</p>
    <div class="splash-loader"><div class="splash-loader-bar"></div></div>
  </div>
</div>

<div id="app">

  <div class="appbar">
    <div class="title">
      <div class="logo">۩</div>
      <div>
        <h1 id="appbarTitle">Silmikaffah</h1>
        <div class="sub" id="appbarSub">Panduan Iman & Islam</div>
      </div>
    </div>
  </div>

  <div class="screens">

    <!-- HOME -->
    <div class="screen active" id="screen-home">
      <div class="greet-card">
        <div class="eyebrow">Assalamu'alaikum</div>
        <h2>Iman itu pondasi, Islam itu bangunannya.</h2>
        <p>Enam perkara diyakini hati, lima perkara ditegakkan dalam laku hidup.</p>
      </div>
