<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>amnesfubbia ANIMATION</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@1,700&family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { background-color: #000; color: #fff; font-family: 'Inter', sans-serif; margin: 0; overflow-x: hidden; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        /* Header & Nav */
        .fixed-header-section { position: fixed; top: 0; width: 100%; z-index: 100; background: #000; border-bottom: 1px solid #1c1c1c; }
        .ig-logo { font-family: 'DM Sans', sans-serif; font-weight: 700; font-style: italic; font-size: 24px; text-transform: lowercase; }
        
        /* Studio Highlights Monokrom */
        .studio-item { flex: 0 0 80px; text-align: center; cursor: pointer; }
        .studio-circle { width: 60px; height: 60px; border-radius: 50%; background: #0a0a0a; border: 1px solid #1c1c1c; display: flex; align-items: center; justify-content: center; margin: 0 auto 5px; overflow: hidden; }
        .studio-logo { width: 40px; filter: grayscale(100%) brightness(0.8); transition: 0.3s; }
        .studio-item.active .studio-logo { filter: grayscale(0%) brightness(1); }
        .studio-item.active .studio-circle { border-color: #fff; }

        /* Filter Bar Baru */
        .filter-bar { display: flex; justify-content: space-around; padding: 12px 0; border-bottom: 1px solid #1c1c1c; background: #000; }
        .filter-btn { font-size: 10px; font-weight: 800; color: #555; text-transform: uppercase; letter-spacing: 1px; }
        .filter-btn.active { color: #fff; }

        /* Bottom Sheet */
        .sheet-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; z-index: 400; backdrop-filter: blur(4px); }
        .bottom-sheet { position: fixed; bottom: -100%; left: 0; width: 100%; height: 75%; background: #0a0a0a; border-top: 1px solid #1c1c1c; border-radius: 20px 20px 0 0; z-index: 500; transition: bottom 0.4s cubic-bezier(0.4, 0, 0.2, 1); display: flex; flex-direction: column; }
        .bottom-sheet.active { bottom: 0; }
        .sheet-header { padding: 20px; border-bottom: 1px solid #1c1c1c; display: flex; justify-content: space-between; align-items: center; }
        .sheet-body { flex-grow: 1; overflow-y: auto; padding: 10px 20px; }
        .list-item { padding: 15px 0; border-bottom: 1px solid #111; display: flex; justify-content: space-between; align-items: center; font-size: 14px; cursor: pointer; }
        .list-item.selected { color: #fff; font-weight: 700; }
        
        /* Grid Movies */
        .movie-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; padding-top: 360px; padding-bottom: 100px; }
        .post-card { aspect-ratio: 2/3; background: #0a0a0a; position: relative; }
        .post-card img { width: 100%; height: 100%; object-fit: cover; }

        /* Bottom Nav */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: #000; border-top: 1px solid #1c1c1c; display: flex; justify-content: space-around; padding: 15px 0; z-index: 300; }
    </style>
</head>
<body>

    <div class="fixed-header-section">
        <div class="p-4 flex justify-between items-center">
            <h1 class="ig-logo">amnesfubbia <span class="opacity-40 font-normal">animation</span></h1>
            <div class="flex gap-4 text-xl"><i class="fa-regular fa-heart"></i><i class="fa-regular fa-paper-plane"></i></div>
        </div>

        <div class="px-4 pb-2 flex gap-2">
            <button class="px-4 py-2 rounded-lg bg-zinc-900 text-[10px] font-bold uppercase" onclick="setFilter('type', 'movie')">Film</button>
            <button class="px-4 py-2 rounded-lg bg-zinc-900 text-[10px] font-bold uppercase" onclick="setFilter('type', 'tv')">Series</button>
            <button class="px-4 py-2 rounded-lg bg-zinc-900 text-[10px] font-bold uppercase" onclick="setFilter('type', 'short')">Short</button>
        </div>

        <div class="filter-bar">
            <button class="filter-btn" onclick="openSheet('tahun')">Tahun <i class="fa-solid fa-chevron-down text-[7px]"></i></button>
            <button class="filter-btn" onclick="openSheet('genre')">Genre <i class="fa-solid fa-chevron-down text-[7px]"></i></button>
            <button class="filter-btn" onclick="openSheet('negara')">Negara <i class="fa-solid fa-chevron-down text-[7px]"></i></button>
        </div>

        <div class="py-4 overflow-x-auto no-scrollbar flex px-4 gap-4 bg-black">
            <div class="studio-item" onclick="setStudio('2', this)">
                <div class="studio-circle"><img src="https://upload.wikimedia.org/wikipedia/commons/3/3e/Disney_logo.svg" class="studio-logo"></div>
                <p class="text-[8px] font-bold uppercase text-zinc-500">Disney</p>
            </div>
            <div class="studio-item" onclick="setStudio('3', this)">
                <div class="studio-circle"><img src="https://upload.wikimedia.org/wikipedia/commons/d/d5/Pixar_Animation_Studios_Logo.svg" class="studio-logo"></div>
                <p class="text-[8px] font-bold uppercase text-zinc-500">Pixar</p>
            </div>
            <div class="studio-item" onclick="setStudio('521', this)">
                <div class="studio-circle"><img src="https://upload.wikimedia.org/wikipedia/en/2/2a/DreamWorks_Animation_logo.svg" class="studio-logo"></div>
                <p class="text-[8px] font-bold uppercase text-zinc-500">Dreamworks</p>
            </div>
            <div class="studio-item" onclick="setStudio('10342', this)">
                <div class="studio-circle"><img src="https://upload.wikimedia.org/wikipedia/id/0/03/Studio_Ghibli_logo.svg" class="studio-logo"></div>
                <p class="text-[8px] font-bold uppercase text-zinc-500">Ghibli</p>
            </div>
            <div class="studio-item" onclick="setStudio('33', this)">
                <div class="studio-circle"><img src="https://upload.wikimedia.org/wikipedia/commons/5/5f/Illumination_Logo.svg" class="studio-logo"></div>
                <p class="text-[8px] font-bold uppercase text-zinc-500">Illumination</p>
            </div>
        </div>
    </div>

    <div id="sheetOverlay" class="sheet-overlay" onclick="closeSheet()"></div>
    <div id="bottomSheet" class="bottom-sheet">
        <div class="sheet-header">
            <h2 id="sheetTitle" class="text-xs font-black uppercase tracking-tighter">PILIH</h2>
            <i class="fa-solid fa-xmark cursor-pointer" onclick="closeSheet()"></i>
        </div>
        <div class="px-5 py-3">
            <div class="bg-zinc-900 flex items-center px-3 py-2 rounded-xl">
                <i class="fa-solid fa-magnifying-glass text-zinc-500 text-xs"></i>
                <input type="text" id="sheetSearch" placeholder="Cari..." class="bg-transparent border-none text-xs ml-2 w-full outline-none" oninput="filterSheetList()">
            </div>
        </div>
        <div id="sheetBody" class="sheet-body no-scrollbar"></div>
        <div class="p-5 border-t border-zinc-900">
            <button class="w-full bg-white text-black py-4 rounded-2xl font-black text-[10px] uppercase tracking-widest" onclick="applySheetFilter()">Terapkan Pilihan</button>
        </div>
    </div>

    <main id="feedGrid" class="movie-grid"></main>

    <nav class="bottom-nav">
        <i class="fa-solid fa-house text-xl"></i>
        <i class="fa-solid fa-magnifying-glass text-xl text-zinc-600"></i>
        <i class="fa-regular fa-square-plus text-xl text-zinc-600"></i>
        <i class="fa-regular fa-circle-user text-xl text-zinc-600"></i>
    </nav>

    <script>
        const API_KEY = 'bfa7df5310c9974f62f26c6789a8c00d';
        let currentType = 'movie', currentYears = [], currentGenres = [], currentCountries = [], currentStudio = '', sheetMode = '';

        // Data Mock untuk Negara & Genre
        const genresList = [{id:12, name:'Adventure'}, {id:35, name:'Comedy'}, {id:14, name:'Fantasy'}, {id:10751, name:'Family'}, {id:878, name:'Sci-Fi'}, {id:28, name:'Action'}];
        const countriesList = [{id:'US', name:'United States'}, {id:'JP', name:'Japan'}, {id:'FR', name:'France'}, {id:'KR', name:'South Korea'}, {id:'ID', name:'Indonesia'}, {id:'GB', name:'United Kingdom'}, {id:'CA', name:'Canada'}];

        window.onload = () => loadFeed();

        async function loadFeed() {
            const grid = document.getElementById('feedGrid');
            grid.innerHTML = Array(12).fill('<div class="post-card bg-zinc-900 animate-pulse"></div>').join('');
            
            let url = `https://api.themoviedb.org/3/discover/${currentType === 'short' ? 'movie' : currentType}?api_key=${API_KEY}&with_genres=16&language=id-ID`;
            
            if (currentYears.length) url += `&primary_release_year=${currentYears.join('|')}`;
            if (currentGenres.length) url += `&with_genres=16,${currentGenres.join(',')}`;
            if (currentCountries.length) url += `&with_origin_country=${currentCountries.join('|')}`;
            if (currentStudio) url += `&with_companies=${currentStudio}`;
            if (currentType === 'short') url += `&with_runtime.lte=40`;

            const res = await fetch(url);
            const data = await res.json();
            
            grid.innerHTML = '';
            data.results.forEach(m => {
                const card = document.createElement('div');
                card.className = 'post-card';
                card.innerHTML = `<img src="https://image.tmdb.org/t/p/w342${m.poster_path}" loading="lazy">`;
                grid.appendChild(card);
            });
        }

        function openSheet(mode) {
            sheetMode = mode;
            const title = document.getElementById('sheetTitle');
            const body = document.getElementById('sheetBody');
            body.innerHTML = '';
            document.getElementById('sheetSearch').value = '';

            if (mode === 'tahun') {
                title.innerText = 'PILIH TAHUN';
                for (let y = 2026; y >= 1930; y--) body.appendChild(createItem(y, y, currentYears));
            } else if (mode === 'genre') {
                title.innerText = 'PILIH GENRE';
                genresList.forEach(g => body.appendChild(createItem(g.id, g.name, currentGenres)));
            } else if (mode === 'negara') {
                title.innerText = 'PILIH NEGARA (A-Z)';
                countriesList.sort((a,b) => a.name.localeCompare(b.name)).forEach(c => body.appendChild(createItem(c.id, c.name, currentCountries)));
            }

            document.getElementById('sheetOverlay').style.display = 'block';
            document.getElementById('bottomSheet').classList.add('active');
        }

        function createItem(id, name, activeArray) {
            const div = document.createElement('div');
            div.className = `list-item ${activeArray.includes(id) ? 'selected' : ''}`;
            div.innerHTML = `<span>${name}</span> ${activeArray.includes(id) ? '<i class="fa-solid fa-check text-[10px]"></i>' : ''}`;
            div.onclick = () => {
                if (activeArray.includes(id)) {
                    activeArray.splice(activeArray.indexOf(id), 1);
                } else {
                    activeArray.push(id);
                }
                openSheet(sheetMode); // Refresh list
            };
            return div;
        }

        function applySheetFilter() {
            closeSheet();
            loadFeed();
        }

        function closeSheet() {
            document.getElementById('bottomSheet').classList.remove('active');
            document.getElementById('sheetOverlay').style.display = 'none';
        }

        function filterSheetList() {
            const q = document.getElementById('sheetSearch').value.toLowerCase();
            document.querySelectorAll('.list-item').forEach(item => {
                item.style.display = item.innerText.toLowerCase().includes(q) ? 'flex' : 'none';
            });
        }

        function setStudio(id, el) {
            document.querySelectorAll('.studio-item').forEach(s => s.classList.remove('active'));
            if (currentStudio === id) {
                currentStudio = '';
            } else {
                currentStudio = id;
                el.classList.add('active');
            }
            loadFeed();
        }

        function setFilter(type, val) {
            currentType = val;
            loadFeed();
        }
    </script>
</body>
</html>
