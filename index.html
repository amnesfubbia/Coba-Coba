<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amnesfubbia Film - Streaming Indonesia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { background-color: #080808; color: #ffffff; font-family: 'Inter', sans-serif; margin: 0; padding: 0; }
        .glass-nav { background: rgba(10, 10, 10, 0.95); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255, 255, 255, 0.05); z-index: 1000; position: fixed; top: 0; w-full; width: 100%; }
        .movie-card { background: #121212; border-radius: 10px; overflow: hidden; position: relative; border: 1px solid rgba(255,255,255,0.05); cursor: pointer; }
        .type-badge { position: absolute; top: 5px; left: 5px; background: #ef4444; color: white; font-size: 7px; font-weight: 900; padding: 2px 5px; border-radius: 4px; z-index: 10; }
        .fav-btn { position: absolute; bottom: 35px; right: 8px; color: rgba(255,255,255,0.3); z-index: 20; }
        .fav-btn.active { color: #ef4444; }
        .modal { display: none; position: fixed; inset: 0; z-index: 3000; background: rgba(0,0,0,0.95); overflow-y: auto; padding: 10px; }
        .actor-img { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; border: 2px solid #333; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
    </style>
</head>
<body onload="initApp()">

    <nav class="glass-nav p-3">
        <div class="container mx-auto space-y-3">
            <div class="flex items-center gap-2">
                <div class="shrink-0 cursor-pointer" onclick="location.reload()">
                    <span class="text-xl font-black italic">AMNES</span><span class="text-xl font-black text-red-600 italic">FILM</span>
                </div>
                <input type="text" id="searchInput" placeholder="Cari film/aktor..." class="flex-grow bg-black/50 p-2 rounded-xl border border-white/10 text-xs outline-none focus:border-red-600">
                <button onclick="searchMulti()" class="bg-red-600 px-4 py-2 rounded-xl font-bold text-[10px]">CARI</button>
            </div>
            <div class="flex gap-2 overflow-x-auto scrollbar-hide">
                <select id="genreFilter" onchange="resetAndLoad()" class="bg-black border border-white/10 p-2 rounded-lg text-[10px] font-bold">
                    <option value="">SEMUA GENRE</option>
                    <option value="27">HOROR</option><option value="35">KOMEDI</option><option value="18">DRAMA</option>
                </select>
                <select id="typeFilter" onchange="resetAndLoad()" class="bg-black border border-white/10 p-2 rounded-lg text-red-500 font-bold text-[10px]">
                    <option value="movie">FILM</option><option value="tv">SERIES</option>
                </select>
                <button onclick="showFavorites()" class="bg-white/10 px-3 py-2 rounded-lg text-[10px] font-bold whitespace-nowrap">MY LIST ❤️</button>
            </div>
        </div>
    </nav>

    <main class="container mx-auto px-2 pt-36 pb-20 min-h-screen">
        <div id="movieGrid" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 gap-2"></div>
        <div id="loader" class="text-center py-10 text-red-600 font-bold hidden">LOADING...</div>
    </main>

    <footer class="bg-[#050505] py-10 border-t border-white/5 text-center">
        <p class="text-[11px] font-black tracking-[0.3em] text-white">BUATAN AMNESFUBBIA ENTERTAINMENT</p>
        <p class="text-[8px] text-gray-600 mt-2 uppercase italic tracking-widest">Database Indonesia © 2026</p>
    </footer>

    <div id="movieModal" class="modal items-center justify-center">
        <div class="bg-[#0f0f0f] w-full max-w-4xl rounded-2xl overflow-hidden relative border border-white/10 flex flex-col md:flex-row">
            <button onclick="closeModal()" class="absolute top-3 right-3 bg-black/50 w-8 h-8 rounded-full z-[100]">✕</button>
            
            <div class="md:w-1/3 p-5 border-r border-white/5 bg-black/20">
                <img id="modalPoster" src="" class="w-full rounded-xl shadow-lg">
                <div class="mt-4 space-y-1 text-[10px] font-bold uppercase">
                    <p>Status: <span id="mStatus" class="text-red-500">-</span></p>
                    <p>Rating: <span id="mRating" class="text-red-500">-</span></p>
                </div>
            </div>

            <div class="md:w-2/3 p-6 flex flex-col max-h-[85vh] overflow-y-auto">
                <h2 id="mTitle" class="text-2xl font-black italic uppercase leading-none"></h2>
                <p id="mMeta" class="text-[10px] text-red-500 font-bold mt-2 uppercase"></p>

                <div class="mt-4 aspect-video bg-black rounded-xl overflow-hidden border border-white/5">
                    <iframe id="mTrailer" class="w-full h-full" frameborder="0" allowfullscreen allow="autoplay"></iframe>
                </div>

                <p class="text-[9px] font-black text-gray-500 uppercase mt-5 mb-2 tracking-widest">Pemeran (Klik Foto):</p>
                <div id="mCast" class="flex gap-4 overflow-x-auto pb-2 scrollbar-hide"></div>

                <p class="text-[9px] font-black text-gray-500 uppercase mt-4 mb-1 tracking-widest">Sinopsis:</p>
                <p id="mDesc" class="text-xs text-gray-300 leading-relaxed italic"></p>

                <div class="mt-8 pt-6 border-t border-white/10 space-y-4">
                    <div>
                        <p class="text-[9px] font-black text-red-600 mb-2 uppercase italic">Streaming Server:</p>
                        <div class="grid grid-cols-2 gap-2">
                            <a id="linkS1" target="_blank" class="bg-red-600 text-center py-3 rounded-lg text-[10px] font-black uppercase italic">SERVER 1</a>
                            <a id="linkS2" target="_blank" class="bg-white/10 text-center py-3 rounded-lg text-[10px] font-black uppercase italic border border-white/10">SERVER 2</a>
                        </div>
                    </div>
                    <div>
                        <p class="text-[9px] font-black text-green-600 mb-2 uppercase italic">Download Server:</p>
                        <div class="grid grid-cols-2 gap-2">
                            <a id="linkD1" target="_blank" class="bg-green-700 text-center py-3 rounded-lg text-[10px] font-black uppercase italic">SERVER 1</a>
                            <a id="linkD2" target="_blank" class="bg-blue-700 text-center py-3 rounded-lg text-[10px] font-black uppercase italic">SERVER 2</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const KEY = 'bfa7df5310c9974f62f26c6789a8c00d';
        const IMG = 'https://image.tmdb.org/t/p/w500';
        let page = 1, favorites = JSON.parse(localStorage.getItem('amnesIndoFavs')) || [];

        function initApp() { loadMovies(); }

        async function loadMovies(append = false) {
            const type = document.getElementById('typeFilter').value;
            const genre = document.getElementById('genreFilter').value;
            let url = `https://api.themoviedb.org/3/discover/${type}?api_key=${KEY}&with_origin_country=ID&language=id-ID&page=${page}&sort_by=popularity.desc`;
            if (genre) url += `&with_genres=${genre}`;
            
            try {
                const res = await fetch(url);
                const data = await res.json();
                const grid = document.getElementById('movieGrid');
                if (!append) grid.innerHTML = '';
                
                data.results.forEach(m => {
                    if (!m.poster_path) return;
                    const card = document.createElement('div');
                    card.className = 'movie-card';
                    card.innerHTML = `
                        <div class="type-badge">${m.title?'FILM':'SERIES'}</div>
                        <img src="${IMG + m.poster_path}" class="w-full aspect-[2/3] object-cover" onclick="showDetail(${m.id}, '${m.title?'movie':'tv'}')">
                        <div class="p-2 text-[8px] font-black truncate uppercase">${m.title || m.name}</div>
                    `;
                    grid.appendChild(card);
                });
            } catch (e) { console.log("Error loading"); }
        }

        async function showDetail(id, type) {
            const res = await fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=${KEY}&append_to_response=videos,credits&language=id-ID`);
            const m = await res.json();
            
            document.getElementById('modalPoster').src = IMG + m.poster_path;
            document.getElementById('mTitle').innerText = m.title || m.name;
            document.getElementById('mStatus').innerText = m.status;
            document.getElementById('mRating').innerText = "⭐ " + m.vote_average.toFixed(1);
            document.getElementById('mMeta').innerText = `${(m.release_date || m.first_air_date || '').split('-')[0]} | ${m.genres.map(g=>g.name).join(', ')}`;
            document.getElementById('mDesc').innerText = m.overview || "Sinopsis belum tersedia.";
            
            // Trailer
            const v = m.videos.results.find(x => x.type === 'Trailer') || m.videos.results[0];
            document.getElementById('mTrailer').src = v ? `https://www.youtube.com/embed/${v.key}?autoplay=1&mute=1` : '';

            // Cast
            const castDiv = document.getElementById('mCast');
            castDiv.innerHTML = m.credits.cast.slice(0, 8).map(c => `
                <div class="actor-card text-center min-w-[60px]" onclick="searchByActor(${c.id}, '${c.name}')">
                    <img src="${c.profile_path ? IMG + c.profile_path : 'https://via.placeholder.com/50'}" class="actor-img mx-auto">
                    <p class="text-[7px] font-bold mt-1 uppercase">${c.name.split(' ')[0]}</p>
                </div>
            `).join('');

            // Links
            document.getElementById('linkS1').href = `https://vidsrc.to/embed/${type}/${m.id}`;
            document.getElementById('linkS2').href = `https://vidsrc.xyz/embed/${type}/${m.id}`;
            document.getElementById('linkD1').href = `https://dl.vidsrc.vip/${type}/${m.id}`;
            document.getElementById('linkD2').href = `https://flashstream.cc/download/${type === 'movie' ? 'movie' : 'series'}/${m.id}`;

            document.getElementById('movieModal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        async function searchByActor(id, name) {
            closeModal();
            document.getElementById('searchInput').value = name;
            const res = await fetch(`https://api.themoviedb.org/3/discover/movie?api_key=${KEY}&with_cast=${id}&with_origin_country=ID&language=id-ID`);
            const data = await res.json();
            const grid = document.getElementById('movieGrid');
            grid.innerHTML = '';
            data.results.forEach(m => {
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.innerHTML = `<img src="${IMG + m.poster_path}" class="w-full aspect-[2/3] object-cover" onclick="showDetail(${m.id}, 'movie')">`;
                grid.appendChild(card);
            });
        }

        function resetAndLoad() { page = 1; loadMovies(); }
        function closeModal() { 
            document.getElementById('movieModal').style.display = 'none'; 
            document.getElementById('mTrailer').src = '';
            document.body.style.overflow = 'auto'; 
        }
    </script>
</body>
</html>
