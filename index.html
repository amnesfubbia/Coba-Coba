                        <div id="downloadLinks" class="grid grid-cols-2 sm:grid-cols-3 gap-2"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = 'YOUR_TMDB_API_KEY'; // Ganti dengan API Key TMDB Anda
        const BASE_URL = 'https://api.themoviedb.org/3';
        const IMG_URL = 'https://image.tmdb.org/t/p/w500';

        // Daftar Link yang Anda Berikan
        const STREAM_SERVERS = [
            { name: "Vidrock", url: "https://vidrock.net/" },
            { name: "RGShows", url: "https://www.rgshows.ru/?p=1&m=m-" },
            { name: "Vidlink", url: "https://vidlink.pro/" },
            { name: "Vidnest", url: "https://vidnest.fun/" },
            { name: "Vidfast", url: "https://vidfast.pro/" },
            { name: "Vidsrc VIP", url: "https://vidsrc.vip/" }
        ];

        const DOWNLOAD_SERVERS = [
            { name: "DL Vidsrc", url: "https://dl.vidsrc.vip/" },
            { name: "DL Vidrock", url: "https://dl.vidrock.net/" },
            { name: "DL Vidlink", url: "https://dl.vidlink.pro/" },
            { name: "DL Embed", url: "https://dl.vidsrc-embed.ru/embed/" },
            { name: "DL Rock VIP", url: "https://dl.vidrock.vip/" },
            { name: "DL Link VIP", url: "https://dl.vidlink.vip/" }
        ];

        let currentPage = 1;
        let currentType = 'all';

        async function initApp() {
            loadMovies();
        }

        async function loadMovies(append = false) {
            const type = document.getElementById('typeFilter').value;
            const genre = document.getElementById('genreFilter').value;
            const year = document.getElementById('yearFilter').value;
            const search = document.getElementById('searchInput').value;

            let url = search ? `${BASE_URL}/search/multi` : `${BASE_URL}/discover/${type === 'all' ? 'movie' : type}`;
            url += `?api_key=${API_KEY}&page=${currentPage}&language=id-ID`;
            
            if (genre) url += `&with_genres=${genre}`;
            if (year) url += type === 'tv' ? `&first_air_date_year=${year}` : `&primary_release_year=${year}`;
            if (search) url += `&query=${encodeURIComponent(search)}`;

            const res = await fetch(url);
            const data = await res.json();
            displayMovies(data.results, append);
        }

        function displayMovies(movies, append) {
            const grid = document.getElementById('movieGrid');
            if (!append) grid.innerHTML = '';

            movies.forEach(m => {
                if (!m.poster_path) return;
                const card = document.createElement('div');
                card.className = 'movie-card cursor-pointer transform hover:scale-105 transition duration-300';
                card.onclick = () => openModal(m.id, m.media_type || (document.getElementById('typeFilter').value === 'tv' ? 'tv' : 'movie'));
                card.innerHTML = `
                    <img src="${IMG_URL + m.poster_path}" class="w-full h-auto object-cover">
                    <div class="p-2">
                        <p class="text-[9px] font-black truncate uppercase italic">${m.title || m.name}</p>
                        <p class="text-[7px] text-red-600 font-bold">${(m.release_date || m.first_air_date || '').split('-')[0]}</p>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        async function openModal(id, type) {
            const res = await fetch(`${BASE_URL}/${type}/${id}?api_key=${API_KEY}&append_to_response=videos,credits`);
            const m = await res.json();

            document.getElementById('mTitle').innerText = m.title || m.name;
            document.getElementById('mPoster').src = IMG_URL + m.poster_path;
            document.getElementById('mDesc').innerText = m.overview || "Sinopsis tidak tersedia.";
            document.getElementById('mRating').innerText = `⭐ ${m.vote_average.toFixed(1)}`;
            document.getElementById('mSub').innerText = `${type.toUpperCase()} • ${m.genres.map(g => g.name).join(', ')}`;

            // Trailer YouTube
            const trailer = m.videos.results.find(v => v.type === 'Trailer');
            document.getElementById('mTrailerFrame').src = trailer ? `https://www.youtube.com/embed/${trailer.key}?autoplay=1` : '';

            // Cast
            const castContainer = document.getElementById('mCast');
            castContainer.innerHTML = m.credits.cast.slice(0, 10).map(c => `
                <div class="cast-item">
                    <img src="${c.profile_path ? IMG_URL + c.profile_path : 'https://via.placeholder.com/150'}">
                    <p class="text-white">${c.name}</p>
                </div>
            `).join('');

            // Links (Dinamis dari list Anda)
            const sContainer = document.getElementById('streamLinks');
            sContainer.innerHTML = STREAM_SERVERS.map(s => `<a href="${s.url}" target="_blank" class="btn-link btn-stream">${s.name}</a>`).join('');

            const dContainer = document.getElementById('downloadLinks');
            dContainer.innerHTML = DOWNLOAD_SERVERS.map(d => `<a href="${d.url}" target="_blank" class="btn-link btn-download">${d.name}</a>`).join('');

            document.getElementById('movieModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('movieModal').style.display = 'none';
            document.getElementById('mTrailerFrame').src = '';
        }

        function loadMore() { currentPage++; loadMovies(true); }
        function resetAndLoad() { currentPage = 1; loadMovies(); }
        function handleEnter(e) { if(e.key === 'Enter') resetAndLoad(); }
        function searchMulti() { resetAndLoad(); }
    </script>
</body>
</html>
