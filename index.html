<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>amnesfubbia xx1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@1,700&family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        /* CSS ASLI KAMU */
        body { background-color: #000; color: #fff; font-family: 'Inter', sans-serif; margin: 0; overflow-x: hidden; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .fixed-header-section { position: fixed; top: 0; width: 100%; z-index: 100; background: #000; border-bottom: 1px solid #1c1c1c; }
        .ig-header { padding: 12px 15px 5px 15px; }
        .ig-logo { font-family: 'DM Sans', sans-serif; font-weight: 700; font-style: italic; font-size: 24px; letter-spacing: -0.8px; text-transform: lowercase; cursor: pointer; }
        .verified-icon { font-size: 13px; color: #0095f6; margin-left: 5px; }
        .search-container { background: #0a0a0a; border-radius: 8px; display: flex; align-items: center; padding: 7px 12px; flex-grow: 1; border: 1px solid #1c1c1c; }
        .search-container input { background: transparent !important; border: none !important; color: white !important; font-size: 13px; width: 100%; outline: none !important; box-shadow: none !important; margin-left: 8px; }
        
        .category-wrapper { padding: 5px 15px 12px 15px; }
        .pill-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
        .pill { background: transparent; border: 1px solid #1c1c1c; color: #fff; padding: 8px 0; border-radius: 8px; font-size: 10px; font-weight: 800; text-transform: uppercase; text-align: center; cursor: pointer; }
        .pill.active { border-color: #fff; }

        /* SELEKTOR BARU (Sesuai Permintaan) */
        .selectors-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; padding: 0 15px 10px 15px; }
        .selector-box { background: #0a0a0a; border: 1px solid #1c1c1c; border-radius: 8px; padding: 8px 4px; font-size: 8px; font-weight: 800; color: #fff; text-transform: uppercase; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 3px; }
        .custom-dropdown { display: none; position: fixed; width: 140px; max-height: 300px; background: #121212; border: 1px solid #1c1c1c; border-radius: 12px; z-index: 110; overflow-y: auto; }
        .dropdown-item { padding: 12px; font-size: 11px; font-weight: 600; text-align: center; border-bottom: 1px solid #1c1c1c; color: #888; cursor: pointer; text-transform: uppercase; }

        .highlights-section { padding: 15px 0; border-bottom: 1px solid #1c1c1c; background: #000; }
        .highlights-container { display: flex; gap: 15px; overflow-x: auto; padding: 0 15px; scrollbar-width: none; }
        .highlight-item { flex: 0 0 75px; text-align: center; cursor: pointer; }
        .circle-icon { width: 62px; height: 62px; border-radius: 50%; background: #000; border: 1.5px solid #1c1c1c; display: flex; align-items: center; justify-content: center; margin: 0 auto 8px auto; font-size: 18px; color: #555; }
        .highlight-item.active .circle-icon { border: 2px solid transparent; background: linear-gradient(#000, #000) padding-box, linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%) border-box; color: #fff; }
        .highlight-label { font-size: 9px; color: #555; font-weight: 700; text-transform: uppercase; white-space: nowrap; }

        .movie-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; padding-top: 315px; padding-bottom: 100px; }
        .post-card { position: relative; aspect-ratio: 2/3; background: #0a0a0a; overflow: hidden; }
        .post-card img { width: 100%; height: 100%; object-fit: cover; }
        .badge-type { position: absolute; top: 8px; right: 8px; font-size: 13px; color: #fff; z-index: 5; text-shadow: 0 0 4px rgba(0,0,0,0.8); }
        .badge-rating { position: absolute; top: 6px; left: 6px; padding: 2px 5px; border-radius: 2px; font-size: 7px; font-weight: 900; z-index: 5; background: rgba(255,255,255,0.9); color: #000; }
        
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: #000; border-top: 1px solid #1c1c1c; display: flex; justify-content: space-around; padding: 12px 0; z-index: 300; }
        .nav-item { color: #fff; font-size: 20px; cursor: pointer; }

        /* MODAL ASLI KAMU */
        .modal-player { display: none; position: fixed; inset: 0; z-index: 200; background: #000; overflow-y: auto; }
        .story-border { padding: 2.5px; background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); border-radius: 50%; display: inline-block; }
        .story-inner { background: #000; padding: 2px; border-radius: 50%; }
        .story-img { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; display: block; }
        .skeleton { background: linear-gradient(90deg, #0a0a0a 25%, #1a1a1a 50%, #0a0a0a 75%); background-size: 200% 100%; animation: skeleton-loading 1.5s infinite; }
        @keyframes skeleton-loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    </style>
</head>
<body>
    <div id="loader" style="position:fixed; top:0; left:0; height:1.5px; background:#fff; width:0%; transition:width 0.3s; z-index:1000;"></div>

    <div class="fixed-header-section">
        <header class="ig-header">
            <div class="flex justify-between items-center">
                <div class="flex items-center">
                    <h1 class="ig-logo" onclick="location.reload()">amnesfubbia <span class="text-white opacity-40 font-normal italic">xx1</span></h1>
                    <i class="fa-solid fa-circle-check verified-icon"></i>
                </div>
                <div class="flex gap-6 text-xl"><i class="fa-regular fa-square-plus"></i><i class="fa-regular fa-heart"></i></div>
            </div>
            <div class="search-area mt-2">
                <div class="search-container"><i class="fa-solid fa-magnifying-glass text-zinc-600 text-[10px]"></i><input type="text" id="searchInp" placeholder="Cari sinema..." onkeydown="if(event.key==='Enter') searchAction()"></div>
            </div>
        </header>

        <div class="category-wrapper">
            <div class="pill-grid">
                <button class="pill active" onclick="setFilter('type', 'multi', this)">Semua</button>
                <button class="pill" onclick="setFilter('type', 'movie', this)">Film</button>
                <button class="pill" onclick="setFilter('type', 'tv', this)">Series</button>
                <button class="pill" onclick="setFilter('type', 'short', this)">Short</button>
            </div>
        </div>

        <div class="selectors-grid">
            <div class="selector-box" onclick="toggleDropdown('yearDropdown', this)"><span id="yearVal">TAHUN</span> <i class="fa-solid fa-chevron-down"></i></div>
            <div class="selector-box" onclick="toggleDropdown('countryDropdown', this)"><span id="countryVal">NEGARA</span> <i class="fa-solid fa-chevron-down"></i></div>
            <div class="selector-box" onclick="toggleDropdown('platformDropdown', this)"><span id="platformVal">STUDIO</span> <i class="fa-solid fa-chevron-down"></i></div>
            <div class="selector-box" onclick="toggleDropdown('genreDropdown', this)"><span id="genreVal">GENRE</span> <i class="fa-solid fa-chevron-down"></i></div>
        </div>

        <div class="highlights-section">
            <div class="highlights-container no-scrollbar" id="genreHighlights">
                <div class="highlight-item active" onclick="setFilter('genre', '', this)"><div class="circle-icon"><i class="fa-solid fa-border-all"></i></div><p class="highlight-label">Semua</p></div>
                <div class="highlight-item" onclick="setFilter('genre', '16', this)"><div class="circle-icon"><i class="fa-solid fa-dragon"></i></div><p class="highlight-label">Animasi</p></div>
                <div class="highlight-item" onclick="setFilter('genre', '27', this)"><div class="circle-icon"><i class="fa-solid fa-ghost"></i></div><p class="highlight-label">Horor</p></div>
                <div class="highlight-item" onclick="setFilter('genre', '28', this)"><div class="circle-icon"><i class="fa-solid fa-bolt"></i></div><p class="highlight-label">Aksi</p></div>
            </div>
        </div>
    </div>

    <div id="yearDropdown" class="custom-dropdown no-scrollbar"></div>
    <div id="countryDropdown" class="custom-dropdown no-scrollbar"></div>
    <div id="platformDropdown" class="custom-dropdown no-scrollbar"></div>
    <div id="genreDropdown" class="custom-dropdown no-scrollbar"></div>

    <main id="feedGrid" class="movie-grid"></main>

    <div id="movieModal" class="modal-player">
        <div class="max-w-xl mx-auto pb-40">
            <div class="px-4 h-[54px] flex items-center border-b border-zinc-900 sticky top-0 bg-black z-50">
                <i class="fa-solid fa-chevron-left text-xl cursor-pointer" onclick="closeModal()"></i>
                <h2 id="mTitle" class="flex-grow text-center text-sm font-bold truncate px-8 uppercase tracking-widest"></h2>
            </div>
            <div class="py-4 bg-black"><div id="mCast" class="flex gap-4 overflow-x-auto no-scrollbar px-4"></div></div>
            <div class="aspect-video bg-zinc-900"><iframe id="videoPlayer" class="w-full h-full" allowfullscreen></iframe></div>
            <div class="px-4 mt-4" id="serverList"></div>
            <div id="seriesControl" class="hidden px-4 mt-4">
                <select id="seasonSel" class="bg-zinc-900 w-full p-2 rounded mb-2" onchange="loadEpisodes()"></select>
                <div id="episodeGrid" class="grid grid-cols-5 gap-2"></div>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = 'bfa7df5310c9974f62f26c6789a8c00d';
        let page = 1, currentType = 'multi', currentGenre = '', currentYear = '', currentCountry = '', currentPlatform = '';

        window.onload = () => { initDrops(); loadFeed(); };

        function initDrops() {
            // Isi dropdown tahun, negara, studio, genre secara otomatis
            const yD = document.getElementById('yearDropdown');
            yD.innerHTML = '<div class="dropdown-item" onclick="setV(\'year\',\'\',\'TAHUN\')">SEMUA</div>' + 
                [2025,2024,2023,2022].map(y => `<div class="dropdown-item" onclick="setV(\'year\',\'${y}\',\'${y}\')">${y}</div>`).join('');
            
            const gD = document.getElementById('genreDropdown');
            gD.innerHTML = '<div class="dropdown-item" onclick="setV(\'genre\',\'\',\'GENRE\')">SEMUA</div>' + 
                [['16','Animasi'],['27','Horor'],['28','Aksi']].map(g => `<div class="dropdown-item" onclick="setV(\'genre\',\'${g[0]}\',\'${g[1]}\')">${g[1]}</div>`).join('');
        }

        function toggleDropdown(id, el) {
            const d = document.getElementById(id);
            const isVisible = d.style.display === 'block';
            document.querySelectorAll('.custom-dropdown').forEach(dd => dd.style.display = 'none');
            if(!isVisible) {
                const rect = el.getBoundingClientRect();
                d.style.top = (rect.bottom + 5) + 'px';
                d.style.left = rect.left + 'px';
                d.style.display = 'block';
            }
        }

        function setV(t, v, l) {
            if(t==='year') { currentYear=v; document.getElementById('yearVal').innerText=l; }
            if(t==='genre') { currentGenre=v; document.getElementById('genreVal').innerText=l; }
            document.querySelectorAll('.custom-dropdown').forEach(dd => dd.style.display = 'none');
            loadFeed(true);
        }

        async function loadFeed(isNew = true) {
            if(isNew) { page = 1; document.getElementById('feedGrid').innerHTML = ''; }
            
            let url = '';
            const year = currentYear ? (currentType === 'tv' ? `&first_air_date_year=${currentYear}` : `&primary_release_year=${currentYear}`) : '';
            const genre = currentGenre ? `&with_genres=${currentGenre}` : '';

            if (currentType === 'short') {
                // LOGIKA SHORT: Filter durasi maksimal 40 menit
                url = `https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&with_runtime.lte=40${year}${genre}&language=id-ID`;
            } else if (currentType === 'tv') {
                url = `https://api.themoviedb.org/3/discover/tv?api_key=${API_KEY}${year}${genre}&language=id-ID`;
            } else {
                url = `https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}${year}${genre}&language=id-ID`;
            }

            const res = await fetch(url);
            const data = await res.json();
            renderGrid(data.results);
        }

        function renderGrid(items) {
            const grid = document.getElementById('feedGrid');
            items.forEach(m => {
                const card = document.createElement('div');
                card.className = 'post-card skeleton';
                card.onclick = () => openModal(m.id, currentType === 'tv' ? 'tv' : 'movie');
                card.innerHTML = `<img src="https://image.tmdb.org/t/p/w342${m.poster_path}" onload="this.parentElement.classList.remove('skeleton')">`;
                grid.appendChild(card);
            });
        }

        function setFilter(t, v, el) {
            document.querySelectorAll('.pill, .highlight-item').forEach(p => p.classList.remove('active'));
            el.classList.add('active');
            if(t === 'type') currentType = v; else currentGenre = v;
            loadFeed(true);
        }

        function openModal(id, type) {
            document.getElementById('movieModal').style.display = 'block';
            document.getElementById('videoPlayer').src = type === 'tv' ? `https://vidrock.net/embed/tv/${id}/1/1` : `https://vidrock.net/embed/movie/${id}`;
            // Load detail lainnya sesuai fungsi aslimu...
        }

        function closeModal() {
            document.getElementById('movieModal').style.display = 'none';
            document.getElementById('videoPlayer').src = '';
        }
    </script>
</body>
</html>
