<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>amnesfubbia xx1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@1,700&family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { background-color: #000; color: #fff; font-family: 'Inter', sans-serif; margin: 0; overflow-x: hidden; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .fixed-header-section { position: fixed; top: 0; width: 100%; z-index: 100; background: #000; border-bottom: 1px solid #1c1c1c; }
        .ig-header { padding: 12px 15px 5px 15px; }
        .ig-logo { font-family: 'DM Sans', sans-serif; font-weight: 700; font-style: italic; font-size: 22px; letter-spacing: -0.5px; text-transform: lowercase; }
        
        /* Highlight Styling */
        .hl-container { display: flex; overflow-x: auto; gap: 12px; padding: 10px 15px; }
        .hl-item { flex: 0 0 64px; text-align: center; }
        .hl-circle { width: 62px; height: 62px; border-radius: 50%; border: 1px solid #262626; padding: 3px; margin-bottom: 4px; filter: grayscale(100%); transition: 0.3s; }
        .hl-circle:active { transform: scale(0.95); }
        .hl-circle img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: #1c1c1c; }
        .hl-text { font-size: 11px; color: #fff; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* Tabs Styling */
        .tab-icon { flex: 1; text-align: center; padding: 12px 0; border-bottom: 1px solid transparent; color: #a8a8a8; font-size: 20px; cursor: pointer; }
        .tab-icon.active { color: #fff; border-bottom: 1px solid #fff; }

        .btn-ig-active { background: #efefef !important; color: #000 !important; }
        .btn-ig-inactive { background: #262626; color: #fff; }

        .movie-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; padding-top: 510px; padding-bottom: 80px; transition: 0.3s; }
        .post-card { position: relative; aspect-ratio: 2/3; background: #0a0a0a; overflow: hidden; }
        .post-card img { width: 100%; height: 100%; object-fit: cover; }
        .badge-rating { position: absolute; top: 6px; left: 6px; padding: 2px 5px; border-radius: 2px; font-size: 7px; font-weight: 900; z-index: 5; background: rgba(255,255,255,0.9); color: #000; }
        .badge-type { position: absolute; top: 6px; right: 6px; padding: 2px 5px; border-radius: 2px; font-size: 7px; font-weight: 900; z-index: 5; background: rgba(0,0,0,0.7); color: #fff; text-transform: uppercase; border: 0.5px solid rgba(255,255,255,0.3); }
        
        .filter-dropdown { display: none; position: fixed; background: #121212; border: 1px solid #1c1c1c; border-radius: 12px; z-index: 200; width: 150px; max-height: 300px; overflow-y: auto; }
        .filter-item { padding: 12px; font-size: 11px; text-align: center; border-bottom: 1px solid #1c1c1c; color: #bbb; cursor: pointer; }
        .filter-item.reset { color: #fff; font-weight: 800; background: #1c1c1c; }
        
        .modal-player { display: none; position: fixed; inset: 0; z-index: 400; background: #000; overflow-y: auto; }
        .carousel-track { display: flex; transition: transform 0.4s; width: 100%; }
        .carousel-slide { min-width: 100%; aspect-ratio: 16/9; position: relative; }
        .swipe-overlay { position: absolute; inset: 0; z-index: 10; background: transparent; }
        .interaction-icon { font-size: 24px; cursor: pointer; color: #fff; }
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: #000; border-top: 1px solid #1c1c1c; display: flex; justify-content: space-around; padding: 12px 0; z-index: 300; }
    </style>
</head>
<body>

    <div class="fixed-header-section">
        <header class="ig-header flex justify-between items-center">
            <h1 class="ig-logo" onclick="location.reload()">amnesfubbia <span class="text-white opacity-40 font-normal italic">xx1</span></h1>
            <div class="flex gap-4">
                <i class="fa-regular fa-square-plus text-xl"></i>
                <i class="fa-solid fa-bars text-xl"></i>
            </div>
        </header>

        <div class="flex items-center px-[15px] py-2">
            <div class="relative w-[77px] h-[77px] flex-shrink-0">
                <img src="https://i.ibb.co/pBTXmYV/profile.jpg" class="w-full h-full rounded-full border border-zinc-800 p-1 object-cover">
                <div class="absolute bottom-0 right-0 bg-[#0095f6] border-2 border-black rounded-full w-[22px] h-[22px] flex items-center justify-center text-white text-[12px]"><i class="fa-solid fa-plus"></i></div>
            </div>
            <div class="flex flex-grow justify-around ml-5 text-center">
                <div><span class="block font-bold">25.4rb</span><span class="text-[12px] text-zinc-400">Film</span></div>
                <div><span class="block font-bold">8.2rb</span><span class="text-[12px] text-zinc-400">Series</span></div>
                <div><span class="block font-bold">1.5rb</span><span class="text-[12px] text-zinc-400">Short</span></div>
            </div>
        </div>

        <div class="px-[15px] pb-3">
            <div class="text-[14px] font-bold">amnesfubbia xx1</div>
            <div class="text-[13px] text-zinc-200">dari indonesia untuk dunia<br>By Anasteas</div>
        </div>

        <div class="hl-container no-scrollbar">
            <div class="hl-item" onclick="setCountry('JP', 'Anime')"><div class="hl-circle"><img src="https://image.tmdb.org/t/p/w200/966mS9ST0u78p7Z789is395v66A.jpg"></div><span class="hl-text">Anime</span></div>
            <div class="hl-item" onclick="setCountry('KR', 'Korea')"><div class="hl-circle"><img src="https://image.tmdb.org/t/p/w200/872fW5O5Uu0U7n3Hn6R3h0R1R3v.jpg"></div><span class="hl-text">Korea</span></div>
            <div class="hl-item" onclick="setCountry('ID', 'Indonesia')"><div class="hl-circle"><img src="https://image.tmdb.org/t/p/w200/4S3YqV9YQf7n8p6Gf7H1Gf7H1Gf.jpg"></div><span class="hl-text">Indonesia</span></div>
            <div class="hl-item" onclick="setCountry('IN', 'India')"><div class="hl-circle"><img src="https://image.tmdb.org/t/p/w200/4S3YqV9YQf7n8p6Gf7H1Gf7H1Gf.jpg"></div><span class="hl-text">India</span></div>
            <div class="hl-item" onclick="setCountry('TH', 'Thailand')"><div class="hl-circle"><img src="https://image.tmdb.org/t/p/w200/4S3YqV9YQf7n8p6Gf7H1Gf7H1Gf.jpg"></div><span class="hl-text">Thailand</span></div>
        </div>

        <div class="flex gap-2 px-[15px] mt-2 mb-3">
            <button id="btnTayang" class="flex-1 btn-ig-inactive py-1.5 rounded-lg text-[13px] font-semibold" onclick="setSchedule('now_playing', this)">Sedang Tayang</button>
            <button id="btnSegera" class="flex-1 btn-ig-inactive py-1.5 rounded-lg text-[13px] font-semibold" onclick="setSchedule('upcoming', this)">Segera</button>
            <button class="btn-ig-inactive px-3 py-1.5 rounded-lg" onclick="toggleFilterRow()"><i class="fa-solid fa-user-plus text-[12px]"></i></button>
        </div>

        <div id="filterRow" class="hidden px-[15px] pb-2">
            <div class="grid grid-cols-3 gap-2">
                <button class="pill text-[10px] py-2 border border-zinc-800 rounded" id="btnCountry" onclick="toggleFilter('countryDropdown')">Negara <i class="fa-solid fa-caret-down"></i></button>
                <button class="pill text-[10px] py-2 border border-zinc-800 rounded" id="btnGenre" onclick="toggleFilter('genreDropdown')">Genre <i class="fa-solid fa-caret-down"></i></button>
                <button class="pill text-[10px] py-2 border border-zinc-800 rounded" id="yearBtn" onclick="toggleFilter('yearDropdown')">Tahun <i class="fa-solid fa-caret-down"></i></button>
            </div>
        </div>

        <div class="flex border-t border-zinc-900 mt-2">
            <div class="tab-icon active" onclick="setFilter('type', 'multi', this)"><i class="fa-solid fa-table-cells"></i></div>
            <div class="tab-icon" onclick="setFilter('type', 'movie', this)"><i class="fa-solid fa-film"></i></div>
            <div class="tab-icon" onclick="setFilter('type', 'tv', this)"><i class="fa-solid fa-tv"></i></div>
            <div class="tab-icon" onclick="setFilter('type', 'short', this)"><i class="fa-solid fa-clapperboard"></i></div>
        </div>
    </div>

    <div id="countryDropdown" class="filter-dropdown left-[15px] top-[450px] no-scrollbar"></div>
    <div id="genreDropdown" class="filter-dropdown left-[35%] top-[450px] no-scrollbar"></div>
    <div id="yearDropdown" class="filter-dropdown right-[15px] top-[450px] no-scrollbar"></div>

    <main id="feedGrid" class="movie-grid"></main>

    <div id="movieModal" class="modal-player">
        <div class="max-w-xl mx-auto pb-40">
            <div class="px-4 h-[54px] flex items-center border-b border-zinc-900 sticky top-0 bg-black z-50">
                <i class="fa-solid fa-chevron-left text-xl cursor-pointer" onclick="closeModal()"></i>
                <div class="flex-grow text-center text-[14px] font-bold truncate px-8" id="mTitle"></div>
            </div>
            <div id="castContainer" class="cast-wrapper px-4 no-scrollbar flex overflow-x-auto gap-4"></div>
            <div class="relative overflow-hidden">
                <div class="swipe-overlay" id="swipeOverlay"></div>
                <div class="carousel-track" id="carouselTrack"></div>
                <div id="carouselDots" class="flex justify-center gap-2 py-3"></div>
            </div>
            <div class="px-4 py-3 flex justify-between items-center">
                <div class="flex gap-4">
                    <i id="btnLikeModal" class="interaction-icon"></i>
                    <i class="fa-regular fa-comment interaction-icon"></i>
                    <i class="fa-regular fa-paper-plane interaction-icon"></i>
                </div>
                <i id="btnBookModal" class="interaction-icon"></i>
            </div>
            <div class="ig-post-content">
                <span id="mLikeDisplay" class="ig-likes-count"></span>
                <div class="mb-1"><span class="ig-username">amnesfubbia.xx1</span><span id="mDesc" class="ig-caption"></span><span id="mToggleBtn" class="toggle-btn hidden" onclick="handleToggleDesc()">selengkapnya</span></div>
                <p id="mTranslateBtn" class="text-[11px] text-zinc-500 font-bold mb-2 cursor-pointer hidden">Lihat Terjemahan...</p>
                <div id="mHashtags" class="ig-hashtags"></div>
                <div id="mDateDisplay" class="ig-date"></div>
                <div id="seriesControl" class="hidden mt-6 p-4 bg-zinc-950 rounded-2xl border border-zinc-900">
                    <div class="flex justify-between items-center mb-4"><h4 class="text-[9px] font-black text-zinc-400 uppercase">Episode</h4><select id="seasonSel" class="bg-zinc-900 text-white text-[10px] px-2 py-1 rounded" onchange="loadEpisodes()"></select></div>
                    <div id="episodeGrid" class="grid grid-cols-5 gap-2"></div>
                </div>
                <div id="serverList" class="grid grid-cols-3 gap-2 mt-6"></div>
                <div class="dl-grid mt-4 grid grid-cols-2 gap-2">
                    <button id="btnDownload1" class="bg-zinc-900 text-[10px] font-bold py-3 rounded-lg border border-zinc-800" onclick="window.open(`https://dl.vidsrc.vip/${window.currentMediaType}/${window.currentMediaId}`)">DOWNLOAD 1</button>
                    <button id="btnDownload2" class="bg-zinc-900 text-[10px] font-bold py-3 rounded-lg border border-zinc-800" onclick="window.open(`https://multiembed.mov/directstream.php?video_id=${window.currentMediaId}&tmdb=1`)">DOWNLOAD 2</button>
                </div>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <i class="fa-solid fa-house cursor-pointer" onclick="location.reload()"></i>
        <i class="fa-solid fa-magnifying-glass cursor-pointer"></i>
        <i class="fa-regular fa-bookmark cursor-pointer" onclick="showLibrary('bookmarks')"></i>
    </nav>

    <script>
        const API_KEY = 'bfa7df5310c9974f62f26c6789a8c00d';
        let page = 1, loading = false, currentType = 'multi', currentGenre = '', currentYear = '', currentCountry = '', currentSchedule = 'trending', searchQuery = '';
        let isExpanded = false, globalFullDesc = "", currentIdx = 0, startX = 0;

        window.onload = () => { initFilters(); loadFeed(); setupSwipe(); };

        function initFilters() {
            const yD = document.getElementById('yearDropdown');
            yD.innerHTML = '<div class="filter-item reset" onclick="setYear(\'\')">Semua Tahun</div>';
            for(let y=2026; y>=1950; y--) yD.innerHTML += `<div class="filter-item" onclick="setYear(${y})">${y}</div>`;
            const cD = document.getElementById('countryDropdown');
            cD.innerHTML = '<div class="filter-item reset" onclick="setCountry(\'\',\'Negara\')">Semua Negara</div>';
            [['JP','Anime'],['KR','Korea'],['ID','Indonesia'],['IN','India'],['TH','Thailand'],['US','USA']].forEach(c => cD.innerHTML += `<div class="filter-item" onclick="setCountry('${c[0]}','${c[1]}')">${c[1]}</div>`);
            const gD = document.getElementById('genreDropdown');
            gD.innerHTML = '<div class="filter-item reset" onclick="setGenre(\'\',\'Genre\')">Semua Genre</div>';
            [[28,'Action'],[16,'Animasi'],[35,'Comedy'],[18,'Drama'],[27,'Horror'],[10749,'Romance']].forEach(g => gD.innerHTML += `<div class="filter-item" onclick="setGenre('${g[0]}','${g[1]}')">${g[1]}</div>`);
        }

        async function loadFeed(isNew = true) {
            if(loading) return; loading = true;
            if(isNew) { page = 1; document.getElementById('feedGrid').innerHTML = ''; }
            
            let endpoint = (currentType === 'tv' || currentType === 'anime') ? 'discover/tv' : 'discover/movie';
            let url = `https://api.themoviedb.org/3/${endpoint}?api_key=${API_KEY}&language=id-ID&page=${page}&sort_by=popularity.desc`;
            
            if(currentSchedule === 'now_playing') url += `&primary_release_date.lte=${new Date().toISOString().split('T')[0]}`;
            if(currentSchedule === 'upcoming') url += `&primary_release_date.gte=${new Date().toISOString().split('T')[0]}`;
            if(currentType === 'short') url += `&with_runtime.lte=45`;
            if(currentCountry) url += `&with_origin_country=${currentCountry}`;
            if(currentGenre) url += `&with_genres=${currentGenre}`;
            if(currentYear) url += endpoint.includes('tv') ? `&first_air_date_year=${currentYear}` : `&primary_release_year=${currentYear}`;

            try {
                const res = await fetch(url);
                const data = await res.json();
                renderGrid(data.results || []);
            } catch(e) { console.error(e); }
            loading = false;
        }

        function renderGrid(items) {
            const grid = document.getElementById('feedGrid');
            items.forEach(m => {
                if(!m.poster_path) return;
                const mType = m.media_type || (currentType.includes('tv')?'tv':'movie');
                const card = document.createElement('div');
                card.className = 'post-card';
                card.onclick = () => openModal(m.id, mType);
                card.innerHTML = `<div class="badge-rating">★ ${m.vote_average?.toFixed(1) || '0'}</div><img src="https://image.tmdb.org/t/p/w342${m.poster_path}">`;
                grid.appendChild(card);
            });
        }

        function toggleFilterRow() {
            const row = document.getElementById('filterRow');
            row.classList.toggle('hidden');
            document.getElementById('feedGrid').style.paddingTop = row.classList.contains('hidden') ? "510px" : "550px";
        }

        function setFilter(t, v, el) {
            currentType = v;
            document.querySelectorAll('.tab-icon').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
            loadFeed(true);
        }

        function setSchedule(v, el) {
            currentSchedule = v;
            document.getElementById('btnTayang').className = 'flex-1 btn-ig-inactive py-1.5 rounded-lg text-[13px] font-semibold';
            document.getElementById('btnSegera').className = 'flex-1 btn-ig-inactive py-1.5 rounded-lg text-[13px] font-semibold';
            el.classList.add('btn-ig-active');
            loadFeed(true);
        }

        function setCountry(c, n) { currentCountry = c; document.getElementById('btnCountry').innerText = n; closeD(); loadFeed(true); }
        function setGenre(g, n) { currentGenre = g; document.getElementById('btnGenre').innerText = n; closeD(); loadFeed(true); }
        function setYear(y) { currentYear = y; document.getElementById('yearBtn').innerText = y || 'Tahun'; closeD(); loadFeed(true); }
        function toggleFilter(id) { closeD(); document.getElementById(id).style.display = 'block'; }
        function closeD() { document.querySelectorAll('.filter-dropdown').forEach(d => d.style.display = 'none'); }

        // Modal Logic (Tetap Sesuai Kode Asli Anda)
        async function openModal(id, type) {
            window.currentMediaId = id; window.currentMediaType = type;
            document.getElementById('movieModal').style.display = 'block';
            document.body.style.overflow = 'hidden';
            const [rId, rEn, rCast] = await Promise.all([
                fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=${API_KEY}&language=id-ID&append_to_response=videos`),
                fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=${API_KEY}&language=en-US&append_to_response=videos`),
                fetch(`https://api.themoviedb.org/3/${type}/${id}/credits?api_key=${API_KEY}`)
            ]);
            const dId = await rId.json(), dEn = await rEn.json(), dCast = await rCast.json();
            const vids = [...(dId.videos?.results || []), ...(dEn.videos?.results || [])].filter(v => v.site === 'YouTube').slice(0, 4);
            const track = document.getElementById('carouselTrack');
            track.innerHTML = '';
            if(vids.length > 0) {
                vids.forEach((v, i) => {
                    track.innerHTML += `<div class="carousel-slide"><iframe id="yt-${i}" src="https://www.youtube.com/embed/${v.key}?enablejsapi=1&autoplay=${i===0?1:0}&mute=0" class="w-full h-full" allow="autoplay; fullscreen"></iframe></div>`;
                });
            } else {
                track.innerHTML = `<div class="carousel-slide"><iframe src="https://vidrock.net/embed/${type}/${id}" class="w-full h-full" allowfullscreen></iframe></div>`;
            }
            document.getElementById('mTitle').innerText = dId.title || dId.name;
            document.getElementById('mDesc').innerText = dId.overview || "Sinopsis tidak tersedia.";
            document.getElementById('mLikeDisplay').innerText = `${Math.floor(dId.vote_average * 1000)} suka`;
            document.getElementById('castContainer').innerHTML = dCast.cast.slice(0,10).map(c => `<div class="text-center w-16 flex-shrink-0"><img src="https://image.tmdb.org/t/p/w185${c.profile_path}" class="w-16 h-16 rounded-full object-cover"><span class="text-[9px] block truncate">${c.name}</span></div>`).join('');
            updateLibButtons(id);
        }

        function closeModal() { document.getElementById('movieModal').style.display = 'none'; document.getElementById('carouselTrack').innerHTML = ''; document.body.style.overflow = 'auto'; }
        function setupSwipe() { /* Logika swipe anda tetap disini */ }
        function updateLibButtons(id) { 
            const isB = JSON.parse(localStorage.getItem('bookmarks') || '[]').some(x=>x.id==id);
            document.getElementById('btnBookModal').className = isB ? 'fa-solid fa-bookmark text-white interaction-icon' : 'fa-regular fa-bookmark interaction-icon';
            document.getElementById('btnBookModal').onclick = () => toggleLib('bookmarks');
            document.getElementById('btnLikeModal').className = 'fa-regular fa-heart interaction-icon';
        }
        function toggleLib(k) { let items = JSON.parse(localStorage.getItem(k) || '[]'); const idx = items.findIndex(x => x.id == window.currentMediaId); idx > -1 ? items.splice(idx,1) : items.push({id: window.currentMediaId, type: window.currentMediaType}); localStorage.setItem(k, JSON.stringify(items)); updateLibButtons(window.currentMediaId); }
        async function showLibrary(k) { /* Logika bookmark anda tetap disini */ }
        window.onscroll = () => { if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 1000 && !loading) { page++; loadFeed(false); } };
    </script>
</body>
</html>
