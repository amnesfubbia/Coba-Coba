<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AMNESFUBBIA PREMIUM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        
        :root { --primary: #ef4444; --bg: #050505; --card: #0f0f0f; }
        body { background-color: var(--bg); color: #f4f4f5; font-family: 'Plus Jakarta Sans', sans-serif; }

        .nav-glass { background: rgba(5, 5, 5, 0.9); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(255,255,255,0.05); position: fixed; top: 0; width: 100%; z-index: 1000; }
        
        /* Movie Grid */
        .movie-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 12px; }
        @media (min-width: 1024px) { .movie-grid { grid-template-columns: repeat(6, 1fr); gap: 24px; } }

        /* Modern Card */
        .movie-card { position: relative; border-radius: 16px; overflow: hidden; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); background: var(--card); border: 1px solid rgba(255,255,255,0.05); }
        .movie-card:hover { transform: translateY(-8px); border-color: var(--primary); box-shadow: 0 10px 30px rgba(239, 68, 68, 0.2); }
        .movie-card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; }
        .movie-info { padding: 10px; background: linear-gradient(to top, rgba(0,0,0,0.9), transparent); }

        /* Professional Buttons */
        .btn-modern { @apply flex items-center justify-center gap-3 py-3 px-6 rounded-2xl text-[11px] font-bold uppercase tracking-wider transition-all duration-300 w-full mb-3; 
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); backdrop-filter: blur(5px); }
        .btn-modern:hover { background: rgba(255,255,255,0.1); border-color: var(--primary); transform: scale(1.02); }
        
        .btn-stream { color: #f4f4f5; }
        .btn-stream i { color: var(--primary); }
        
        .btn-download-vip { background: linear-gradient(135deg, #059669 0%, #10b981 100%); color: white; border: none; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); }
        .btn-download-vip:hover { box-shadow: 0 6px 20px rgba(16, 185, 129, 0.5); transform: translateY(-2px); }

        /* Modal Layout */
        .modal { display: none; position: fixed; inset: 0; z-index: 2000; background: rgba(0,0,0,0.95); overflow-y: auto; padding: 20px 0; }
        .modal-content { background: #0a0a0a; width: 95%; max-width: 1200px; margin: auto; border-radius: 32px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); }
        
        .cast-chip { flex: 0 0 auto; width: 80px; text-align: center; cursor: pointer; transition: 0.3s; }
        .cast-chip:hover { color: var(--primary); }
        .cast-chip img { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; margin: 0 auto 8px; border: 2px solid #222; }

        .scrollbar-hide::-webkit-scrollbar { display: none; }
    </style>
</head>
<body onload="initApp()">

    <nav class="nav-glass p-4">
        <div class="container mx-auto flex flex-col gap-4">
            <div class="flex items-center justify-between">
                <div class="cursor-pointer" onclick="location.reload()">
                    <span class="text-2xl font-black tracking-tighter italic">AMNESFUBBIA<span class="text-red-600">FILM</span></span>
                </div>
                <div class="relative w-full max-w-md ml-4">
                    <input type="text" id="searchInput" onkeypress="if(event.key==='Enter') searchMulti()" placeholder="Cari Judul atau Pemeran..." class="w-full bg-white/5 border border-white/10 p-3.5 rounded-2xl text-sm outline-none focus:border-red-600 transition-all">
                    <i class="fa-solid fa-magnifying-glass absolute right-4 top-1/2 -translate-y-1/2 text-zinc-500"></i>
                </div>
            </div>
            <div class="flex gap-3 overflow-x-auto scrollbar-hide">
                <select id="typeFilter" onchange="resetAndLoad()" class="bg-zinc-900 border border-white/10 text-white text-xs font-bold py-2 px-4 rounded-xl outline-none">
                    <option value="movie">FILM</option>
                    <option value="tv">SERIES</option>
                </select>
                <select id="genreFilter" onchange="resetAndLoad()" class="bg-zinc-900 border border-white/10 text-white text-xs font-bold py-2 px-4 rounded-xl outline-none">
                    <option value="">SEMUA GENRE</option>
                    <option value="28">AKSI</option><option value="27">HOROR</option><option value="35">KOMEDI</option><option value="18">DRAMA</option>
                </select>
                <select id="yearFilter" onchange="resetAndLoad()" class="bg-zinc-900 border border-white/10 text-white text-xs font-bold py-2 px-4 rounded-xl outline-none">
                    <option value="">TAHUN</option>
                    <script>for(let y=2026; y>=1950; y--) document.write(`<option value="${y}">${y}</option>`);</script>
                </select>
            </div>
        </div>
    </nav>

    <main class="container mx-auto pt-44 pb-20">
        <div id="movieGrid" class="movie-grid"></div>
        <div id="loadMoreContainer" class="flex justify-center mt-12">
            <button onclick="loadMore()" class="bg-white text-black font-black text-xs uppercase px-10 py-4 rounded-full hover:bg-red-600 hover:text-white transition-all">Muat Lebih Banyak</button>
        </div>
    </main>

    <div id="movieModal" class="modal">
        <div class="modal-content">
            <div class="flex flex-col lg:flex-row">
                <div class="lg:w-2/3 p-6 lg:p-12 border-r border-white/5">
                    <div class="flex justify-between items-start mb-6">
                        <div>
                            <h2 id="mTitle" class="text-3xl lg:text-5xl font-black uppercase mb-2"></h2>
                            <div id="mMeta" class="flex items-center gap-4 text-zinc-500 font-bold text-xs uppercase"></div>
                        </div>
                        <button onclick="closeModal()" class="bg-white/5 hover:bg-red-600 w-12 h-12 rounded-full transition-all">✕</button>
                    </div>
                    
                    <div class="aspect-video bg-black rounded-3xl overflow-hidden mb-8 border border-white/10 shadow-2xl">
                        <iframe id="mainPlayer" class="w-full h-full" allowfullscreen></iframe>
                    </div>

                    <p class="text-[10px] font-black text-red-600 uppercase mb-3 tracking-widest">Sinopsis</p>
                    <p id="mDesc" class="text-zinc-400 leading-relaxed text-sm lg:text-base italic mb-10"></p>
                    
                    <p class="text-[10px] font-black text-red-600 uppercase mb-5 tracking-widest">Pemeran Utama</p>
                    <div id="mCast" class="flex gap-6 overflow-x-auto scrollbar-hide pb-4"></div>
                </div>

                <div class="lg:w-1/3 p-6 lg:p-12 bg-[#080808]">
                    <p class="text-[10px] font-black text-zinc-500 uppercase mb-6 tracking-widest">Streaming Server</p>
                    <div id="streamLinks"></div>
                    
                    <div class="h-px bg-white/5 my-10"></div>
                    
                    <p class="text-[10px] font-black text-zinc-500 uppercase mb-6 tracking-widest">Download Quality</p>
                    <div id="downloadLinks"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = 'bfa7df5310c9974f62f26c6789a8c00d';
        const IMG_BASE = 'https://image.tmdb.org/t/p/w500';
        let currentPage = 1;

        async function initApp() { loadMovies(); }

        async function loadMovies(append = false) {
            const type = document.getElementById('typeFilter').value;
            const genre = document.getElementById('genreFilter').value;
            const year = document.getElementById('yearFilter').value;
            let url = `https://api.themoviedb.org/3/discover/${type}?api_key=${API_KEY}&with_origin_country=ID&language=id-ID&page=${currentPage}&sort_by=popularity.desc`;
            if (genre) url += `&with_genres=${genre}`;
            if (year) url += `&primary_release_year=${year}&first_air_date_year=${year}`;

            const res = await fetch(url);
            const data = await res.json();
            renderMovies(data.results, append);
        }

        function renderMovies(movies, append) {
            const grid = document.getElementById('movieGrid');
            if (!append) grid.innerHTML = '';
            movies.forEach(m => {
                const div = document.createElement('div');
                div.className = 'movie-card';
                div.onclick = () => showDetail(m.id, m.media_type || document.getElementById('typeFilter').value);
                div.innerHTML = `
                    <img src="${m.poster_path ? IMG_BASE + m.poster_path : 'https://via.placeholder.com/500x750'}">
                    <div class="movie-info">
                        <p class="text-[10px] font-black uppercase truncate">${m.title || m.name}</p>
                        <p class="text-[9px] text-zinc-500 font-bold mt-1">⭐ ${m.vote_average.toFixed(1)} | ${m.release_date?.split('-')[0] || ''}</p>
                    </div>`;
                grid.appendChild(div);
            });
        }

        async function showDetail(id, type) {
            const res = await fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=${API_KEY}&append_to_response=videos,credits&language=id-ID`);
            const m = await res.json();
            
            document.getElementById('mTitle').innerText = m.title || m.name;
            document.getElementById('mDesc').innerText = m.overview || "Sinopsis tidak tersedia dalam bahasa Indonesia.";
            document.getElementById('mMeta').innerHTML = `<span>${m.release_date?.split('-')[0] || 'N/A'}</span> <span class="text-zinc-700">•</span> <span>⭐ ${m.vote_average.toFixed(1)}</span> <span class="text-zinc-700">•</span> <span class="text-red-600">${m.genres[0]?.name || ''}</span>`;

            // Player logic (YouTube / Vimeo)
            const video = m.videos.results.find(v => (v.site === 'YouTube' || v.site === 'Vimeo') && v.type === 'Trailer') || m.videos.results[0];
            document.getElementById('mainPlayer').src = video ? (video.site === 'YouTube' ? `https://www.youtube.com/embed/${video.key}?autoplay=1` : `https://player.vimeo.com/video/${video.key}?autoplay=1`) : '';

            // Modern Streaming Buttons
            document.getElementById('streamLinks').innerHTML = `
                <button onclick="changePlayer('https://vidsrc.xyz/embed/${type}/${id}')" class="btn-modern btn-stream"><i class="fa-solid fa-play"></i> SERVER 01 (XYZ)</button>
                <button onclick="changePlayer('https://vidsrc.to/embed/${type}/${id}')" class="btn-modern btn-stream"><i class="fa-solid fa-play"></i> SERVER 02 (TO)</button>
                <button onclick="changePlayer('https://vidrock.net/embed/${type}/${id}')" class="btn-modern btn-stream"><i class="fa-solid fa-play"></i> SERVER 03 (PRO)</button>
            `;

            // Modern Download Button
            document.getElementById('downloadLinks').innerHTML = `
                <a href="https://dl.vidsrc.vip/${type}/${id}" target="_blank" class="btn-modern btn-download-vip">
                    <i class="fa-solid fa-bolt"></i> DOWNLOAD WEB-DL (VIP)
                </a>
            `;

            // Fix Cast Klik: Cari Film by Actor
            const castCont = document.getElementById('mCast');
            castCont.innerHTML = m.credits.cast.slice(0, 10).map(c => `
                <div class="cast-chip" onclick="searchByActorID('${c.id}', '${c.name}')">
                    <img src="${c.profile_path ? 'https://image.tmdb.org/t/p/w185'+c.profile_path : 'https://via.placeholder.com/100x100'}">
                    <p class="text-[8px] font-black uppercase tracking-tighter">${c.name}</p>
                </div>
            `).join('');

            document.getElementById('movieModal').style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        // FUNGSI KRUSIAL: Mencari film berdasarkan aktor yang diklik
        async function searchByActorID(personId, name) {
            closeModal();
            document.getElementById('searchInput').value = `Film: ${name}`;
            const res = await fetch(`https://api.themoviedb.org/3/person/${personId}/movie_credits?api_key=${API_KEY}&language=id-ID`);
            const data = await res.json();
            renderMovies(data.cast.sort((a,b) => b.popularity - a.popularity), false);
            window.scrollTo({top: 0, behavior: 'smooth'});
            document.getElementById('loadMoreContainer').style.display = 'none';
        }

        async function searchMulti() {
            const q = document.getElementById('searchInput').value; if(!q) return;
            const res = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${API_KEY}&query=${encodeURIComponent(q)}&language=id-ID`);
            const data = await res.json();
            renderMovies(data.results.filter(i => i.poster_path), false);
            document.getElementById('loadMoreContainer').style.display = 'none';
        }

        function closeModal() { document.getElementById('movieModal').style.display = 'none'; document.getElementById('mainPlayer').src = ''; document.body.style.overflow = 'auto'; }
        function changePlayer(url) { document.getElementById('mainPlayer').src = url + "?autoplay=1"; }
        function loadMore() { currentPage++; loadMovies(true); }
        function resetAndLoad() { currentPage = 1; loadMovies(); document.getElementById('loadMoreContainer').style.display = 'flex'; }
    </script>
</body>
</html>
