<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Library Pro</title>
    <style>
        :root {
            --primary: #e50914;
            --dark: #141414;
            --light: #ffffff;
            --grey: #2f2f2f;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--dark);
            color: var(--light);
            margin: 0;
            padding: 20px;
        }

        .container { max-width: 1200px; margin: auto; }

        /* Filter Section */
        .filter-group {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        select {
            padding: 10px;
            border-radius: 5px;
            background: var(--grey);
            color: white;
            border: none;
            cursor: pointer;
        }

        /* Movie Grid */
        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .movie-card {
            background: #1f1f1f;
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.3s;
            position: relative;
        }

        .movie-card:hover { transform: scale(1.05); }

        .movie-card img {
            width: 100%;
            height: 300px;
            object-fit: cover;
        }

        .movie-info { padding: 15px; }
        .movie-info h3 { margin: 0 0 10px; font-size: 1.1rem; }

        /* Watchlist Button */
        .btn-watchlist {
            width: 100%;
            padding: 8px;
            background: var(--primary);
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 4px;
        }

        /* Skeleton Loading */
        .skeleton {
            background: #2f2f2f;
            height: 300px;
            position: relative;
            overflow: hidden;
        }

        .skeleton::after {
            content: "";
            position: absolute;
            top: 0; right: 0; bottom: 0; left: 0;
            background: linear-gradient(90deg, #2f2f2f 0, #3f3f3f 50%, #2f2f2f 100%);
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>Katalog Film</h1>

    <div class="filter-group">
        <select id="genreFilter" onchange="applyFilters()">
            <option value="all">Semua Genre</option>
            <option value="Action">Action</option>
            <option value="Horor">Horor</option>
            <option value="Drama">Drama</option>
        </select>

        <select id="yearFilter" onchange="applyFilters()">
            <option value="all">Semua Tahun</option>
            <option value="2024">2024</option>
            <option value="2023">2023</option>
        </select>

        <select id="typeFilter" onchange="applyFilters()">
            <option value="all">Semua Tipe</option>
            <option value="Movie">Movie</option>
            <option value="Series">Series</option>
        </select>
        
        <button onclick="showWatchlist()" style="background: #333; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer;">
            ⭐ Lihat Watchlist
        </button>
    </div>

    <div id="movieContainer" class="movie-grid">
        <div class="movie-card skeleton-container">
            <div class="skeleton"></div>
            <div class="movie-info"><div style="height:20px; background:#2f2f2f; width:80%;"></div></div>
        </div>
    </div>
</div>

<script>
    // Data Film Dummy
    const allMovies = [
        { id: 1, title: "Deadpool & Wolverine", genre: "Action", year: "2024", type: "Movie", img: "https://via.placeholder.com/200x300?text=Action+2024" },
        { id: 2, title: "The Conjuring 4", genre: "Horor", year: "2024", type: "Movie", img: "https://via.placeholder.com/200x300?text=Horor+2024" },
        { id: 3, title: "Succession", genre: "Drama", year: "2023", type: "Series", img: "https://via.placeholder.com/200x300?text=Drama+2023" },
        { id: 4, title: "John Wick 4", genre: "Action", year: "2023", type: "Movie", img: "https://via.placeholder.com/200x300?text=Action+2023" }
    ];

    const container = document.getElementById('movieContainer');

    // Fungsi Render Utama
    function displayMovies(movies) {
        container.innerHTML = '';
        if (movies.length === 0) {
            container.innerHTML = '<p>Film tidak ditemukan.</p>';
            return;
        }

        movies.forEach(movie => {
            const card = document.createElement('div');
            card.className = 'movie-card';
            card.innerHTML = `
                <img src="${movie.img}" alt="${movie.title}" loading="lazy">
                <div class="movie-info">
                    <h3>${movie.title}</h3>
                    <p>${movie.genre} | ${movie.year}</p>
                    <button class="btn-watchlist" onclick="toggleWatchlist(${movie.id})">
                        + Watchlist
                    </button>
                </div>
            `;
            container.appendChild(card);
        });
    }

    // 1. Integrated Multi-Filter Logic
    function applyFilters() {
        const genre = document.getElementById('genreFilter').value;
        const year = document.getElementById('yearFilter').value;
        const type = document.getElementById('typeFilter').value;

        const filtered = allMovies.filter(m => {
            return (genre === 'all' || m.genre === genre) &&
                   (year === 'all' || m.year === year) &&
                   (type === 'all' || m.type === type);
        });

        displayMovies(filtered);
    }

    // 2. Watchlist Logic (Local Storage)
    function toggleWatchlist(id) {
        let watchlist = JSON.parse(localStorage.getItem('userWatchlist')) || [];
        const movie = allMovies.find(m => m.id === id);

        const isExist = watchlist.some(item => item.id === id);

        if (!isExist) {
            watchlist.push(movie);
            alert(`${movie.title} berhasil ditambah ke Watchlist!`);
        } else {
            watchlist = watchlist.filter(item => item.id !== id);
            alert(`${movie.title} dihapus dari Watchlist!`);
        }

        localStorage.setItem('userWatchlist', JSON.stringify(watchlist));
    }

    function showWatchlist() {
        const watchlist = JSON.parse(localStorage.getItem('userWatchlist')) || [];
        displayMovies(watchlist);
        alert("Menampilkan daftar favorit Anda");
    }

    // Simulasi Delay untuk Skeleton Loading
    window.onload = () => {
        setTimeout(() => {
            displayMovies(allMovies);
        }, 1500); // 1.5 detik loading
    };

</script>
</body>
</html>
