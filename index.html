<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amnesfubbia Entertainment</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { background-color: #050505; color: #ffffff; font-family: 'Inter', sans-serif; margin: 0; overflow-x: hidden; }
        .glass-nav { background: rgba(8, 8, 8, 0.98); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255, 255, 255, 0.1); z-index: 1000; position: fixed; top: 0; width: 100%; }
        .skeleton { background: #111; border-radius: 8px; aspect-ratio: 2/3; position: relative; overflow: hidden; }
        .skeleton::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent); animation: shimmer 1.5s infinite; }
        @keyframes shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
        .movie-card { transition: 0.3s; background: #111; border-radius: 8px; overflow: hidden; border: 1px solid rgba(255,255,255,0.05); cursor: pointer; }
        .movie-card:hover { transform: translateY(-5px); border-color: #ef4444; }
        .modal { display: none; position: fixed; inset: 0; z-index: 3000; background: rgba(0,0,0,0.98); overflow-y: auto; backdrop-filter: blur(20px); }
        .modal-content { background: #0a0a0a; width: 100%; max-width: 1100px; border-radius: 24px; margin: 20px auto; position: relative; border: 1px solid #333; overflow: hidden; }
        .video-container { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden; border: 1px solid #333; }
        .btn-link { @apply py-2 rounded-lg text-[7px] font-black uppercase text-center transition-all active:scale-95 flex items-center justify-center gap-1; }
        .btn-stream { @apply bg-zinc-800 text-white hover:bg-red-600 border border-white/5; }
        .btn-download { @apply bg-emerald-700 text-white hover:bg-emerald-600; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
    </style>
</head>
<body onload="initApp()">

    <nav class="glass-nav p-3">
        <div class="container mx-auto space-y-3">
            <div class="flex items-center gap-2">
                <div class="shrink-0 cursor-pointer" onclick="location.reload()">
                    <span class="text-xl font-black italic uppercase">AMNES</span><span class="text-xl font-black text-red-600 italic uppercase">FILM</span>
                </div>
                <div class="flex-grow">
                    <input type="text" id="searchInput" onkeypress="if(event.key==='Enter') searchMulti()" placeholder="Cari film Indonesia..." class="w-full bg-white/5 p-2.5 rounded-xl border border-white/10 text-xs outline-none focus:border-red-600 text-white">
                </div>
            </div>
            <div class="flex gap-2 overflow-x-auto pb-1 scrollbar-hide">
                <select id="typeFilter" onchange="resetAndLoad()" class="bg-[#111] text-red-500 font-bold text-[10px] p-2 rounded-lg border border-white/10 uppercase outline-none">
                    <option value="movie">FILM</option>
                    <option value="tv">SERIES</option>
                </select>
            </div>
        </div>
    </nav>

    <main class="container mx-auto px-2 pt-32 pb-20">
        <div id="movieGrid" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-6 gap-2"></div>
        <div id="loadMoreContainer" class="flex justify-center mt-10">
            <button onclick="loadMore()" class="bg-white/5 border border-white/10 px-8 py-3 rounded-xl font-black text-[10px] text-white hover:bg-red-600">MUAT LAGI</button>
        </div>
    </main>

    <div id="movieModal" class="modal p-4">
        <div class="modal-content">
            <button onclick="closeModal()" class="absolute top-4 right-4 bg-black/60 hover:bg-red-600 text-white w-8 h-8 rounded-full z-[100]">✕</button>
            <div class="flex flex-col lg:flex-row">
                <div class="lg:w-2/3 p-6 border-b lg:border-b-0 lg:border-r border-white/10">
                    <h2 id="mTitle" class="text-3xl font-black italic uppercase mb-4 text-white"></h2>
                    <p class="text-[9px] font-black text-zinc-500 mb-2 uppercase italic tracking-widest">Official Trailer (YouTube)</p>
                    <div class="video-container mb-6">
                        <iframe id="mTrailerFrame" class="w-full h-full" allowfullscreen allow="autoplay"></iframe>
                    </div>
                    <p id="mDesc" class="text-sm text-zinc-400 italic leading-relaxed"></p>
                </div>
                <div class="lg:w-1/3 p-6 bg-zinc-900/20">
                    <p class="text-[10px] font-black text-red-500 uppercase italic mb-3">Server Streaming</p>
                    <div id="streamLinks" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-2 gap-2 mb-8"></div>
                    
                    <p class="text-[10px] font-black text-emerald-500 uppercase italic mb-3">Server Download</p>
                    <div id="downloadLinks" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-2 gap-2"></div>
                    
                    <div class="mt-8 p-4 bg-red-600/10 border border-red-600/20 rounded-xl">
                        <p class="text-[9px] font-bold text-red-400 leading-tight">Tips: Jika server utama error, coba server vidsrc.xyz atau movieapi.win. Gunakan Browser Brave agar bebas iklan.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const KEY = 'bfa7df5310c9974f62f26c6789a8c00d';
        const IMG = 'https://image.tmdb.org/t/p/w500';
        let page = 1;

        function initApp() { loadMovies(); }

        async function loadMovies(append = false) {
            const grid = document.getElementById('movieGrid');
            if (!append) grid.innerHTML = Array(12).fill('<div class="skeleton"></div>').join('');
            const type = document.getElementById('typeFilter').value;
            const url = `https://api.themoviedb.org/3/discover/${type}?api_key=${KEY}&with_origin_country=ID&language=id-ID&page=${page}&sort_by=popularity.desc`;
            const res = await fetch(url);
            const data = await res.json();
            if (!append) grid.innerHTML = '';
            data.results.forEach(m => {
                if (!m.poster_path) return;
                const div = document.createElement('div');
                div.className = 'movie-card';
                div.onclick = () => showDetail(m.id, type);
                div.innerHTML = `<img src="${IMG + m.poster_path}" class="w-full aspect-[2/3] object-cover"><div class="p-2 text-[8px] font-black truncate uppercase text-zinc-400">${m.title || m.name}</div>`;
                grid.appendChild(div);
            });
        }

        async function showDetail(id, type) {
            const res = await fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=${KEY}&append_to_response=videos&language=id-ID`);
            const m = await res.json();
            document.getElementById('mTitle').innerText = m.title || m.name;
            document.getElementById('mDesc').innerText = m.overview || "Sinopsis belum tersedia.";
            
            const yt = m.videos.results.find(v => v.site === 'YouTube' && v.type === 'Trailer') || m.videos.results[0];
            document.getElementById('mTrailerFrame').src = yt ? `https://www.youtube.com/embed/${yt.key}` : '';

            // SERVER STREAMING (Updated)
            const streams = [
                { n: 'VidSrc TO', u: `https://vidsrc.to/embed/${type}/${id}` },
                { n: 'VidRock', u: `https://vidrock.net/embed/${type}/${id}` },
                { n: 'VidLink', u: `https://vidlink.pro/embed/${type}/${id}` },
                { n: 'Vidsrc RU', u: `https://vidsrc-embed.ru/embed/${type}/${id}` },
                { n: 'VidEasy', u: `https://videasy.su/embed/${type}/${id}` },
                { n: 'VidFast', u: `https://vidfast.pro/embed/${type}/${id}` },
                { n: 'VidNest', u: `https://vidnest.fun/embed/${type}/${id}` },
                { n: 'VidSrc XYZ', u: `https://vidsrc.xyz/embed/${type}/${id}` },
                { n: 'MovieAPI', u: `https://movieapi.win/embed/${type}/${id}` }
            ];

            // SERVER DOWNLOAD (Updated)
            const downloads = [
                { n: 'VidSrc VIP', u: `https://dl.vidsrc.vip/${type}/${id}` },
                { n: 'VidSrc XYZ', u: `https://vidsrc.xyz/download/${type}/${id}` },
                { n: 'MovieAPI DL', u: `https://movieapi.win/download/${type}/${id}` }
            ];

            const sCont = document.getElementById('streamLinks');
            const dCont = document.getElementById('downloadLinks');
            sCont.innerHTML = ''; dCont.innerHTML = '';
            streams.forEach(s => sCont.innerHTML += `<a href="${s.u}" target="_blank" class="btn-link btn-stream">${s.n}</a>`);
            downloads.forEach(d => dCont.innerHTML += `<a href="${d.u}" target="_blank" class="btn-link btn-download">${d.n}</a>`);

            document.getElementById('movieModal').style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        function loadMore() { page++; loadMovies(true); }
        function resetAndLoad() { page = 1; loadMovies(); }
        function closeModal() { document.getElementById('movieModal').style.display = 'none'; document.getElementById('mTrailerFrame').src = ''; document.body.style.overflow = 'auto'; }
        async function searchMulti() {
            const q = document.getElementById('searchInput').value; if (!q) return;
            const res = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${KEY}&query=${encodeURIComponent(q)}&language=id-ID`);
            const data = await res.json();
            const grid = document.getElementById('movieGrid'); grid.innerHTML = '';
            data.results.forEach(m => { if(m.poster_path) {
                const div = document.createElement('div'); div.className = 'movie-card';
                div.onclick = () => showDetail(m.id, m.media_type);
                div.innerHTML = `<img src="${IMG + m.poster_path}" class="w-full aspect-[2/3] object-cover"><div class="p-2 text-[8px] font-black truncate uppercase text-zinc-400">${m.title || m.name}</div>`;
                grid.appendChild(div);
            }});
        }
    </script>
</body>
</html>
