<script>
/* ============================================================
   SILMIKAFFAH — IQRA 32 HALAMAN PER JILID (data-extra10.js)
   Halaman buku orisinal (bukan salinan buku Iqro AMM yang
   berhak cipta). Alur progresif standar: fathah → kasrah/
   dhammah/sukun → tanwin/sambung → mad → hukum bacaan →
   bacaan lancar. Kombinasi dibuat generator deterministik.
   ============================================================ */
(function(){
const F = "َ", I = "ِ", U = "ُ", S = "ْ", TAN = "ً ٍ ٌ";
const HU = ["ا","ب","ت","ث","ج","ح","خ","د","ذ","ر","ز","س","ش","ص","ض","ط","ظ","ع","غ","ف","ق","ك","ل","م","ن","و","ه","ي"];

/* RNG deterministik */
let _seed = 20260831;
function rnd(){ _seed = (_seed*1103515245 + 12345) & 0x7fffffff; return _seed/0x7fffffff; }
function shuf(arr){ const a = arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function har(q){ return q==="i"?"ِ" : q==="u"?"ُ" : "َ"; }
function line(letters, q, sep){ return letters.map(l=>l+har(q)).join(sep||" "); }

/* Kombinasi pasangan unik (tanpa pengulangan) untuk satu jilid */
function makePairGen(letters, q){
  const used = new Set();
  let pool = shuf(letters), idx = 0;
  return function(count){
    const out = [];
    while(out.length < count){
      if(idx+1 >= pool.length){ pool = shuf(letters); idx = 0; }
      const a = pool[idx], b = pool[idx+1]; idx += 2;
      const s = a+har(q)+" "+b+har(q);
      if(used.has(s) || out.includes(s)) continue;
      used.add(s); out.push(s);
    }
    return out;
  };
}
function uniqWords(words, usedWords){
  const out = [];
  let pool = shuf(words), i = 0;
  while(out.length < 5){
    if(i >= pool.length){
      // bila semua kata sudah dipakai dalam satu pemindaian pool,
      // mulai siklus baru (cegah loop tak berujung)
      if(usedWords.size >= words.length) usedWords.clear();
      pool = shuf(words); i = 0;
    }
    const w = pool[i++];
    if(usedWords.has(w) || out.includes(w)) continue;
    usedWords.add(w); out.push(w);
  }
  return out;
}

/* Kata-kata standar per jilid (kosakata umum, pilihan orisinal) */
const W1 = ["بَتَ","مَلَكَ","سَمِعَ","رَأَسَ","دَخَلَ","خَرَجَ","عَلِمَ","فَهِمَ","كَتَبَ","قَرَأَ","شَرِبَ","أَكَلَ","قَلَمَ","نَصَرَ","وَعَدَ","هَدَى","فَتَحَ","غَلَبَ","ظَهَرَ","جَلَسَ"];
const W2 = ["بِسْمِ","قُلْ","كُنْ","مِنْ","عَنْ","لَمْ","كَانَ","يَكُونُ","يَقُولُ","سَمِيعٌ","رَحِيمٌ","مُسْلِمٌ","مُؤْمِنٌ","كَاتِبٌ","يَجْلِسُ","يَقْرَأُ","يَكْتُبُ","رَحْمَةٌ","عِبَادٌ","يُسَافِرُ"];
const W3 = ["كِتَابٌ","مَسْجِدٌ","بَيْتٌ","قَلَمٌ","مُحَمَّدٌ","أَحْمَدُ","جَمِيلٌ","كَبِيرٌ","صَغِيرٌ","الْكِتَابُ","الْمَسْجِدُ","الرَّحْمَنُ","الرَّحِيمُ","الْحَمْدُ","شَمْسٌ","قَمَرٌ","نُورٌ","عِلْمٌ","فَلَاحٌ","حَقٌّ"];
const W4 = ["قَالَ","كَانَ","يَقُولُ","يَكُونُ","قِيلَ","سِيرَةٌ","رَسُولٌ","سَلَامٌ","إِيمَانٌ","إِحْسَانٌ","مَالٌ","نُورٌ","صَائِمٌ","قَائِمٌ","غَائِبٌ","بَابٌ","دَارٌ","نَارٌ","عَالِمٌ","مُعَلِّمٌ"];
const W5 = ["مِنْ عَمَلِهِ","أَنْعَمْتَ","مِنْ نُّعْمَةٍ","مِنْ لَدُنْ","مِنْ تَحْتِهَا","عَنْ بَعْضٍ","مِنْ بَعْدِ","تَرْمِيهِمْ بِحِجَارَةٍ","مِنْ قَبْلُ","مِنْ خَوْفٍ","مِنْ شَرِّ","لَهُمْ مَا","عَلَيْهِمْ وَلَا","مِنَ الْجِنَّةِ","مِنْ وَلِيٍّ","أَنْبَتَ"];
const W6 = ["بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ","الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ","الرَّحْمَٰنِ الرَّحِيمِ","مَالِكِ يَوْمِ الدِّينِ","إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ","اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ","قُلْ هُوَ اللَّهُ أَحَدٌ","اللَّهُ الصَّمَدُ","لَمْ يَلِدْ وَلَمْ يُولَدْ","وَلَمْ يَكُنْ لَهُ كُفُوًا أَحَدٌ","قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ","مِنْ شَرِّ مَا خَلَقَ","وَمِنْ شَرِّ غَاسِقٍ إِذَا وَقَبَ","قُلْ أَعُوذُ بِرَبِّ النَّاسِ","مَلِكِ النَّاسِ","مِنْ شَرِّ الْوَسْوَاسِ الْخَنَّاسِ","وَالْعَصْرِ","إِنَّ الْإِنْسَانَ لَفِي خُسْرٍ","إِنَّا أَعْطَيْنَاكَ الْكَوْثَرَ","فَصَلِّ لِرَبِّكَ وَانْحَرْ"];

function buildJilid(cfg){
  const pages = [];
  const n = 32, usedWords = new Set();
  const pairGen = makePairGen(HU, cfg.q);
  for(let i=1; i<=n; i++){
    let lines = [];
    if(cfg.letterPages && i <= cfg.letterPages){
      const group = HU.slice((i-1)*cfg.per, Math.min(i*cfg.per, 28));
      lines = [line(group, cfg.q)];
      lines = lines.concat(pairGen(4));
    } else if(cfg.pairPages && i <= cfg.letterPages + cfg.pairPages){
      lines = pairGen(6);
    } else if(cfg.wordPages && i <= cfg.letterPages + cfg.pairPages + cfg.wordPages){
      lines = uniqWords(cfg.words, usedWords);
      lines = lines.concat(pairGen(1));
    } else {
      lines = uniqWords(cfg.words, usedWords);
    }
    pages.push({t:"Halaman "+i, ins:cfg.ins, l:lines.slice(0,6)});
  }
  return pages;
}


DB.IQRA_PAGES = {
  "iqra-1": buildJilid({q:"f", letterPages:7, pairPages:10, wordPages:8, per:4,
    words:W1, ins:"Baca langsung, jangan dieja. Bunyikan setiap huruf dengan fathah (a) pendek."}),
  "iqra-2": buildJilid({q:"i", letterPages:7, pairPages:10, wordPages:8, per:4,
    words:W2, ins:"Kasrah (i), dhammah (u), dan sukun (mati). Baca langsung tanpa mengeja."}),
  "iqra-3": buildJilid({q:"f", letterPages:6, pairPages:8, wordPages:12, per:4,
    words:W3, ins:"Tanwin (ً ٍ ٌ) dan huruf sambung. Perhatikan bentuk huruf di awal, tengah, akhir."}),
  "iqra-4": buildJilid({q:"f", letterPages:4, pairPages:8, wordPages:14, per:6,
    words:W4, ins:"Mad thabi'i: fathah+alif (2 harakat), kasrah+ya, dhammah+wau. Panjangkan 2 harakat."}),
  "iqra-5": buildJilid({q:"f", letterPages:2, pairPages:6, wordPages:18, per:8,
    words:W5, ins:"Hukum nun sukun/tanwin dan mim sukun: izhar, idgham, ikhfa, iqlab. Baca sesuai hukum."}),
  "iqra-6": buildJilid({q:"f", letterPages:1, pairPages:5, wordPages:20, per:10,
    words:W6, ins:"Bacaan lancar: surah pendek dan kalimat Al-Qur'an dengan tartil. Setelah ini siap membaca mushaf."})
};

/* Sinkronkan tiap baris: (sudah berupa string utuh; sisipkan instruksi per halaman) */
})();
</script>

<script>
/* ============================================================
   SILMIKAFFAH — Mesin Perhitungan (calc.js)
   Waktu shalat (astronomis, tidak hardcode) · Kalender Hijriah
   (Intl islamic-umalqura) · Kalkulator Zakat (transparan)
   ============================================================ */
const CALC = window.SILMIKAFFAH.CALC = {};

/* ---------- WAKTU SHALAT ---------- */
CALC.PRAY_METHODS = {
  KEMENAG: {name:"Kemenag RI (Fajar 20°, Isya 18°)", fajr:20, isha:18, fixed:0},
  MWL:     {name:"Muslim World League (18°, 17°)", fajr:18, isha:17, fixed:0},
  ISNA:    {name:"ISNA (15°, 15°)", fajr:15, isha:15, fixed:0},
  EGYPT:   {name:"Mesir (19.5°, 17.5°)", fajr:19.5, isha:17.5, fixed:0},
  KARACHI: {name:"Karachi (18°, 18°)", fajr:18, isha:18, fixed:0},
  MAKKAH:  {name:"Umm al-Qura Makkah (18.5°, Isya +90 mnt)", fajr:18.5, isha:0, fixed:90}
};
CALC.ASR_METHODS = { JUMHUR:{name:"Jumhur (bayangan 1× tinggi)", factor:1}, HANAFI:{name:"Hanafi (bayangan 2×)", factor:2} };

function rad(d){return d*Math.PI/180;}
function deg(r){return r*180/Math.PI;}
function fixangle(a){a=a-360*Math.floor(a/360);return a<0?a+360:a;}
function fixhour(a){a=a-24*Math.floor(a/24);return a<0?a+24:a;}
function dsin(d){return Math.sin(rad(d));}
function dcos(d){return Math.cos(rad(d));}
function dtan(d){return Math.tan(rad(d));}
function datan2(y,x){return deg(Math.atan2(y,x));}
function julian(y,m,d){
  if(m<=2){y-=1;m+=12;}
  const A=Math.floor(y/100), B=2-A+Math.floor(A/4);
  return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5;
}
function sunPosition(jd){
  const D=jd-2451545.0;
  const g=fixangle(357.529+0.98560028*D);
  const q=fixangle(280.459+0.98564736*D);
  const L=fixangle(q+1.915*Math.sin(rad(g))+0.020*Math.sin(rad(2*g)));
  const e=23.439-0.00000036*D;
  const RA=datan2(dcos(e)*dsin(L),dcos(L))/15;
  const decl=deg(Math.asin(Math.sin(rad(e))*dsin(L)));
  const EqT=q/15-fixhour(RA);
  return {decl, EqT};
}
function midDay(jd, t){const e=sunPosition(jd+ t/24).EqT; return fixhour(12-e);}
function hourAngle(angle, decl, lat){
  const a=rad(angle), d=rad(decl), L=rad(lat);
  const c=(Math.sin(a)-dsin(decl)*Math.sin(L))/(dcos(decl)*dcos(L));
  return deg(Math.acos(Math.max(-1,Math.min(1,c))))/15;
}

CALC.computePrayerTimes = function(date, lat, lon, methodKey, asrKey, tzHours){
  const M = CALC.PRAY_METHODS[methodKey] || CALC.PRAY_METHODS.KEMENAG;
  const A = CALC.ASR_METHODS[asrKey] || CALC.ASR_METHODS.JUMHUR;
  const y=date.getFullYear(), m=date.getMonth()+1, d=date.getDate();
  // tzHours: offset UTC kota (default: offset perangkat, DST-aware)
  const tz = (tzHours===undefined) ? -date.getTimezoneOffset()/60 : tzHours;
  const jd = julian(y,m,d);            // ≈ JD 12:00 UT
  const {decl, EqT} = sunPosition(jd);
  const noonUT = 12 - lon/15 - EqT;    // tengah hari matahari (UT, jam)
  const H = a => hourAngle(a, decl, lat); // sudut jam (jam)
  const mk = t => {
    const tt = fixhour(t + tz);        // konversi ke jam dinding lokal
    const h = Math.floor(tt), mn = Math.floor((tt-h)*60 + 0.5);
    const hh = ((h+24)%24);
    return {min: hh*60+mn, label: String(hh).padStart(2,"0")+":"+String(mn).padStart(2,"0")};
  };
  const dLat = Math.abs(lat - decl);
  // Asar: ketinggian matahari saat bayangan = panjang benda + bayangan saat zuhur
  const asrAngle = deg(Math.atan(1/(A.factor + Math.tan(rad(dLat)))));
  const sunset = noonUT + H(-0.833);
  return {
    imsak:   mk(noonUT - H(-M.fajr) - 10/60), // kehati-hatian (konvensi Indonesia)
    subuh:   mk(noonUT - H(-M.fajr)),
    terbit:  mk(noonUT - H(-0.833)),
    zuhur:   mk(noonUT),
    asar:    mk(noonUT + H(asrAngle)),
    maghrib: mk(sunset),
    isya:    mk(M.fixed>0 ? sunset + M.fixed/60 : noonUT + H(-M.isha)),
    method: M.name, asrMethod: A.name
  };
};

CALC.nextPrayer = function(times, nowMin){
  const order = [["subuh","Subuh"],["terbit","Terbit"],["zuhur","Zuhur"],["asar","Asar"],["maghrib","Maghrib"],["isya","Isya"],["imsak","Imsak"]];
  for(let i=0;i<order.length;i++){
    if(times[order[i][0]].min > nowMin) return {key:order[i][0], name:order[i][1], min:times[order[i][0]].min};
  }
  // besok subuh
  return {key:"subuh", name:"Subuh (besok)", min:times.subuh.min + 1440};
};

/* ---------- KALENDER HIJRIAH ---------- */
const HIJRI_MONTHS = ["Muharram","Safar","Rabiul Awal","Rabiul Akhir","Jumadil Awal","Jumadil Akhir","Rajab","Sya'ban","Ramadan","Syawal","Dzulqa'dah","Dzulhijjah"];
const hFmt = new Intl.DateTimeFormat("en-u-ca-islamic-umalqura", {day:"numeric", month:"numeric", year:"numeric"});

CALC.hijriParts = function(date){
  const p = hFmt.formatToParts(date), o = {day:1, month:1, year:1446};
  p.forEach(x=>{ if(x.type==="day")o.day=+x.value; if(x.type==="month")o.month=+x.value; if(x.type==="year")o.year=+x.value; });
  return o;
};
CALC.hijriLabel = function(date){
  const p = CALC.hijriParts(date);
  return {hijri: p.day+" "+HIJRI_MONTHS[p.month-1]+" "+p.year+" H", day:p.day, month:p.month, monthName:HIJRI_MONTHS[p.month-1], year:p.year};
};
CALC.hijriStart = function(cursor){
  const d = new Date(cursor);
  let i=0;
  while(CALC.hijriParts(d).day!==1 && i<60){ d.setDate(d.getDate()-1); i++; }
  return d;
};
CALC.hijriMonth = function(cursor){
  const start = CALC.hijriStart(cursor);
  const parts = CALC.hijriParts(start);
  const cells = [];
  const today = new Date(); today.setHours(0,0,0,0);
  for(let i=0;i<31;i++){
    const g = new Date(start); g.setDate(start.getDate()+i);
    const p = CALC.hijriParts(g);
    if(p.month!==parts.month) break;
    const g0 = new Date(g); g0.setHours(0,0,0,0);
    cells.push({
      gDate: g, hDay: p.day,
      isToday: g0.getTime()===today.getTime(),
      dow: g.getDay(),
      events: DB.EVENTS.filter(e=>e.month===HIJRI_MONTHS[p.month-1] && e.day===p.day)
    });
  }
  return {monthName:HIJRI_MONTHS[parts.month-1], year:parts.year, cells, start};
};
CALC.shiftHijriMonth = function(cursor, dir){
  const start = CALC.hijriStart(cursor);
  const d = new Date(start);
  d.setDate(d.getDate() + (dir>0?35:-15));
  return d;
};

/* ---------- KALKULATOR ZAKAT ---------- */
const fmtRp = n => "Rp " + Math.round(n).toLocaleString("id-ID");
CALC.zakat = function(type, inp){
  const today = new Date().toLocaleDateString("id-ID", {day:"numeric", month:"long", year:"numeric"});
  const out = {result:null, label:"", rows:[], method:"", notes:[], source:"", date:today};
  const goldPrice = +inp.goldPrice||0, silverPrice = +inp.silverPrice||0;
  if(type==="fitrah"){
    const qty = +inp.qty||2.5, price = +inp.price||0;
    out.result = qty*price;
    out.label = "Zakat Fitrah";
    out.rows.push(["Beras total (jiwa × kg)", qty+" kg × Rp "+price.toLocaleString("id-ID")]);
    out.rows.push(["Total", fmtRp(out.result)]);
    out.method = "1 sha' (±2,5 kg) makanan pokok per orang; konvensi lain 3,5 liter. Dikeluarkan sebelum shalat Idulfitri.";
    out.source = "HR. Bukhari no. 1503, Muslim no. 984; BAZNAS";
    out.notes.push("Boleh dibayar dalam bentuk uang senilai makanan pokok menurut sebagian lembaga (BAZNAS).");
    return out;
  }
  if(type==="emas"){
    const g = +inp.grams||0;
    out.result = g>=85 ? 0.025*g*goldPrice : 0;
    out.label = "Zakat Emas";
    out.rows.push(["Kepemilikan", g+" gram"]);
    out.rows.push(["Nishab", "85 gram — "+(g>=85?"tercapai":"belum tercapai")]);
    out.rows.push(["Zakat", g>=85 ? "2,5% × "+g+"g × Rp "+goldPrice.toLocaleString("id-ID") : "—"]);
    out.rows.push(["Total", fmtRp(out.result)]);
    out.method = "2,5% dari emas ≥ 85 gram yang dimiliki selama satu tahun (haul).";
    out.source = "BAZNAS; ketentuan nishab dari hadis";
    out.notes.push("Perhiasan yang dipakai secara wajar: jumhur tidak mewajibkan zakatnya; mazhab Hanafi mewajibkan.");
    return out;
  }
  if(type==="perak"){
    const g = +inp.grams||0;
    out.result = g>=595 ? 0.025*g*silverPrice : 0;
    out.label = "Zakat Perak";
    out.rows.push(["Kepemilikan", g+" gram"]);
    out.rows.push(["Nishab", "595 gram — "+(g>=595?"tercapai":"belum tercapai")]);
    out.rows.push(["Total", fmtRp(out.result)]);
    out.method = "2,5% dari perak ≥ 595 gram dengan haul satu tahun.";
    out.source = "BAZNAS; HR. Abu Dawud no. 1573";
    return out;
  }
  if(type==="uang"){
    const bal = +inp.balance||0;
    const nisab = 85*goldPrice;
    out.result = bal>=nisab ? 0.025*bal : 0;
    out.label = "Zakat Uang & Tabungan";
    out.rows.push(["Saldo", fmtRp(bal)]);
    out.rows.push(["Nishab (85g emas)", fmtRp(nisab)+" — "+(bal>=nisab?"tercapai":"belum tercapai")]);
    out.rows.push(["Total", fmtRp(out.result)]);
    out.method = "Uang diqiyaskan pada emas: nishab senilai 85 gram emas, 2,5%, haul 1 tahun.";
    out.source = "BAZNAS";
    return out;
  }
  if(type==="mal"){
    const cash=+inp.cash||0, g=+inp.gold||0, s=+inp.silver||0, trade=+inp.trade||0, recv=+inp.receivables||0, debt=+inp.debts||0;
    const haul = inp.haul==="yes";
    const nMethod = inp.nisabMethod==="perak"?"perak":"emas";
    const assets = cash + g*goldPrice + s*silverPrice + trade + recv - debt;
    const nisab = nMethod==="emas" ? 85*goldPrice : 595*silverPrice;
    out.result = (haul && assets>=nisab) ? 0.025*assets : 0;
    out.label = "Zakat Mal (Harta)";
    out.rows.push(["Kas + emas + perak + dagangan + piutang", fmtRp(cash+g*goldPrice+s*silverPrice+trade+recv)]);
    out.rows.push(["Dikurangi utang jatuh tempo", "− "+fmtRp(debt)]);
    out.rows.push(["Harta bersih", fmtRp(assets)]);
    out.rows.push(["Nishab ("+nMethod+")", fmtRp(nisab)+" — "+(assets>=nisab?"tercapai":"belum tercapai")]);
    out.rows.push(["Haul 1 tahun", haul?"terpenuhi":"belum terpenuhi"]);
    out.rows.push(["Total", fmtRp(out.result)]);
    out.method = "2,5% dari harta bersih yang mencapai nishab (85g emas / 595g perak) dan haul 1 tahun.";
    out.source = "BAZNAS; fiqih zakat";
    out.notes.push(haul?"":"Jika haul belum satu tahun, zakat mal belum wajib (kecuali jenis yang dizakati saat panen).");
    return out;
  }
  if(type==="perdagangan"){
    const asset=+inp.asset||0, debt=+inp.debt||0;
    const haul = inp.haul==="yes";
    const net = asset-debt, nisab = 85*goldPrice;
    out.result = (haul && net>=nisab) ? 0.025*net : 0;
    out.label = "Zakat Perdagangan";
    out.rows.push(["Nilai aset dagang (barang + kas + piutang)", fmtRp(asset)]);
    out.rows.push(["Dikurangi utang", "− "+fmtRp(debt)]);
    out.rows.push(["Bersih", fmtRp(net)]);
    out.rows.push(["Nishab (85g emas)", fmtRp(nisab)+" — "+(net>=nisab?"tercapai":"belum tercapai")]);
    out.rows.push(["Total", fmtRp(out.result)]);
    out.method = "2,5% dari nilai barang dagangan (dinilai harga pasar) + kas + piutang − utang, dengan nishab 85g emas dan haul 1 tahun.";
    out.source = "BAZNAS";
    return out;
  }
  if(type==="penghasilan"){
    const inc=+inp.income||0, debtM=+inp.debtMonthly||0;
    const m = inp.method==="b"?"b":"a";
    const ricePrice=+inp.ricePrice||0;
    const net = inc-debtM;
    const nisabA = (85*goldPrice)/12;
    const nisabB = (653*ricePrice)/12;
    const nisab = m==="a"?nisabA:nisabB;
    out.result = net>=nisab ? 0.025*net : 0;
    out.label = "Zakat Penghasilan (Profesi)";
    out.rows.push(["Penghasilan bulanan", fmtRp(inc)]);
    out.rows.push(["Dikurangi utang bulanan", "− "+fmtRp(debtM)]);
    out.rows.push(["Bersih", fmtRp(net)]);
    out.rows.push(["Nishab bulanan", fmtRp(nisab)+" — "+(net>=nisab?"tercapai":"belum tercapai")]);
    out.rows.push(["Total", fmtRp(out.result)]);
    out.method = m==="a"
      ? "Metode A (umum): nishab 85 gram emas setahun dibagi 12; jika penghasilan bulanan mencapai nishab bulanan, keluarkan 2,5% tiap bulan."
      : "Metode B: nishab diqiyaskan pada 5 wasaq (±653 kg) beras setahun, dibagi 12.";
    out.source = "BAZNAS (Metode A); pendapat ulama kontemporer (Metode B)";
    out.notes.push("Ada perbedaan pendapat tentang nishab penghasilan — gunakan metode yang Anda yakini / konsultasikan amil setempat.");
    return out;
  }
  if(type==="pertanian"){
    const val=+inp.value||0, irr=inp.irrigation==="alami"?"alami":"berbayar";
    const ricePrice=+inp.ricePrice||0, nisab=653*ricePrice;
    const rate = irr==="alami"?0.10:0.05;
    out.result = val>=nisab ? rate*val : 0;
    out.label = "Zakat Pertanian";
    out.rows.push(["Nilai hasil panen", fmtRp(val)]);
    out.rows.push(["Nishab 5 wasaq (±653 kg × harga)", fmtRp(nisab)+" — "+(val>=nisab?"tercapai":"belum tercapai")]);
    out.rows.push(["Besaran", irr==="alami"?"10% (pengairan alami)":"5% (pengairan berbiaya)"]);
    out.rows.push(["Total", fmtRp(out.result)]);
    out.method = "Dizakati saat panen (tanpa haul): 10% bila pengairan alami, 5% bila berbiaya.";
    out.source = "QS. Al-An'am 6:141; HR. Bukhari no. 1484, Muslim no. 979";
    return out;
  }
  if(type==="peternakan"){
    const t=inp.livestock==="sapi"?"sapi":"kambing", c=+inp.count||0;
    out.label = "Zakat Peternakan ("+ (t==="sapi"?"Sapi":"Kambing/Domba") +")";
    if(t==="kambing"){
      out.result = c>=40 ? Math.floor((c-1)/100)+1 : 0;
      out.rows.push(["Jumlah", c+" ekor"]);
      out.rows.push(["Nishab", "40 ekor"]);
      out.rows.push(["Zakat", out.result+" ekor kambing/domba (umur 1–2 tahun)"]);
      out.method = "40–120: 1; 121–200: 2; 201–300: 3; 300+: 1 tiap 100.";
      out.source = "HR. Bukhari no. 1454";
    } else {
      let z="", due=0;
      if(c>=30){due=1; if(c<40)z="1 ekor tabi' (umur 1 tahun)";
        else if(c<60)z="1 ekor musinnah (umur 2 tahun)";
        else if(c<70)z="2 ekor tabi'";
        else if(c<80)z="1 musinnah + 1 tabi'";
        else if(c<90)z="2 ekor musinnah";
        else if(c<100)z="3 ekor tabi'";
        else if(c<110)z="1 musinnah + 2 tabi'";
        else if(c<120)z="2 musinnah + 1 tabi'";
        else if(c<130)z="3 musinnah (atau 4 tabi')";
        else {due=0; z="Tiap 30 ekor: +1 tabi'; tiap 40 ekor: +1 musinnah";}
      }
      out.result = due; out.zakatLabel = z;
      out.rows.push(["Jumlah", c+" ekor"]);
      out.rows.push(["Nishab", "30 ekor"]);
      out.rows.push(["Zakat", z]);
      out.method = "Tabel zakat sapi (sa'imah, haul 1 tahun).";
      out.source = "BAZNAS; ketentuan zakat ternak";
    }
    out.notes.push("Syarat: digembalakan (sa'imah), mencapai nishab, haul 1 tahun.");
    out.date = today;
    return out;
  }
  return out;
};
</script>

<script>
/* ============================================================
   SILMIKAFFAH — Lapisan API & Cache (api.js)
   API-first dengan fallback lokal:
   - Aladhan API  → jadwal shalat + tanggal hijriah
   - Quran.com v4 → 6236 ayat (Arab + terjemahan Indonesia)
   - islamic.network CDN → audio murottal Al-Qur'an (legal)
   - api.hadith.gading.dev → kitab hadis (Arab + terjemahan)
   Semua punya fallback: jika API gagal, data lokal dipakai.
   ============================================================ */
const API = window.SILMIKAFFAH.API = {};

/* ---------- helper fetch dengan timeout ---------- */
API.fetchJSON = function(url, timeoutMs){
  return new Promise((resolve, reject)=>{
    const ctrl = (typeof AbortController!=="undefined") ? new AbortController() : null;
    const t = setTimeout(()=>{ if(ctrl) ctrl.abort(); reject(new Error("timeout")); }, timeoutMs||9000);
    fetch(url, ctrl?{signal:ctrl.signal}:undefined)
      .then(r=>{ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
      .then(d=>{ clearTimeout(t); resolve(d); })
      .catch(e=>{ clearTimeout(t); reject(e); });
  });
};

/* ---------- cache lokal (memory + localStorage) ---------- */
const _mem = new Map();
function cacheGet(key){
  if(_mem.has(key)) return _mem.get(key);
  try{ const raw = localStorage.getItem("silk_api_"+key); if(raw) return JSON.parse(raw); }catch(e){}
  return null;
}
function cacheSet(key, val, ttlMs){
  _mem.set(key, val);
  try{
    localStorage.setItem("silk_api_"+key, JSON.stringify({v:val, t:Date.now(), ttl:ttlMs||0}));
    // jaga ukuran: jika total > 3,5 MB, buang entri tertua
    let total = 0, keys = [];
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.indexOf("silk_api_")===0){ const v = localStorage.getItem(k); total += v.length; keys.push([k, (JSON.parse(v)||{}).t||0]); }
    }
    if(total > 3.5*1024*1024 && keys.length>3){
      keys.sort((a,b)=>a[1]-b[1]);
      for(let i=0;i<Math.max(1,keys.length/2);i++) localStorage.removeItem(keys[i][0]);
    }
  }catch(e){ /* storage penuh — lewati */ }
}
function cacheGetTtl(key, ttlMs){
  const c = cacheGet(key);
  if(!c) return null;
  if(c.ttl && c.t && (Date.now()-c.t) > c.ttl) return null;
  return c.v;
}

/* ============================================================
   A. JADWAL SHALAT — ALADHAN API (+ fallback kalkulasi lokal)
   ============================================================ */
const ALADHAN_METHOD = {KEMENAG:20, MWL:3, ISNA:2, EGYPT:5, MAKKAH:4, KARACHI:1};
API.getPrayerTimes = async function(date, lat, lon, methodKey, asrKey){
  const local = CALC.computePrayerTimes(date, lat, lon, methodKey, asrKey, undefined);
  try{
    const dd = date.getDate(), mm = date.getMonth()+1, yy = date.getFullYear();
    const m = ALADHAN_METHOD[methodKey]||20;
    const url = "https://api.aladhan.com/v1/timings/"+dd+"-"+mm+"-"+yy
      + "?latitude="+lat+"&longitude="+lon+"&method="+m+"&school="+(asrKey==="HANAFI"?1:0);
    const j = await API.fetchJSON(url, 8000);
    const t = j && j.data && j.data.timings;
    if(!t) throw new Error("no timings");
    const mk = s => {
      const p = (s||"").split(":");
      const hh = +p[0], mn = +p[1];
      return {min: hh*60+mn, label: String(hh).padStart(2,"0")+":"+String(mn).padStart(2,"0")};
    };
    const hijri = j.data.date && j.data.date.hijri;
    return {
      times: {
        imsak: mk(t.Imsak), subuh: mk(t.Fajr), terbit: mk(t.Sunrise),
        zuhur: mk(t.Dhuhr), asar: mk(t.Asr), maghrib: mk(t.Maghrib), isya: mk(t.Isha)
      },
      hijri: hijri ? {day:+hijri.day, month:hijri.month.number, year:+hijri.year, monthName:hijri.month.en} : null,
      source: "Aladhan API"
    };
  }catch(err){
    return {times: local, source: "Perhitungan lokal (offline)"};
  }
};

/* ============================================================
   B. AL-QUR'AN — QURAN.COM API v4 (6236 ayat) + audio CDN
   ============================================================ */
const QURAN_OFFSET = (function(){
  let off = [], sum = 0;
  window.SILMIKAFFAH.SURAHS.forEach(s=>{ off[s[0]] = sum; sum += s[5]; });
  return off;
})();
API.globalAyah = (surah, ayah) => QURAN_OFFSET[surah] + ayah;
API.ayahAudioUrl = (surah, ayah) =>
  "https://cdn.islamic.network/quran/audio/128/ar.alafasy/"+API.globalAyah(surah, ayah)+".mp3";

API.getSurah = async function(n){
  // cache per surah (ttl 30 hari)
  const cached = cacheGetTtl("q_surah_"+n, 30*24*3600*1000);
  if(cached) return {surah:cached, source:"cache lokal"};
  try{
    const out = [];
    let page = 1, totalPages = 1;
    while(page <= totalPages){
      const url = "https://api.quran.com/api/v4/verses/by_chapter/"+n
        + "?translations=131&fields=text_uthmani&per_page=300&page="+page;
      const j = await API.fetchJSON(url, 12000);
      const verses = j.verses || [];
      totalPages = (j.meta && j.meta.pagination && j.meta.pagination.total_pages) || 1;
      verses.forEach(v=>{
        let translation = "";
        const trs = v.translations || [];
        if(trs.length && trs[0].text) translation = trs[0].text.replace(/<[^>]+>/g,"").trim();
        out.push({
          number: v.verse_number, key: v.verse_key, juz: v.juz_number||null,
          arab: v.text_uthmani || "", translation: translation
        });
      });
      page++;
    }
    if(!out.length) throw new Error("empty");
    // fallback terjemahan: coba edition 33 bila 131 kosong
    if(!out[0].translation){
      try{
        const j = await API.fetchJSON("https://api.quran.com/api/v4/verses/by_chapter/"+n+"?translations=33&per_page=300", 10000);
        (j.verses||[]).forEach(v=>{
          const trs = v.translations||[];
          const t = trs.length ? trs[0].text.replace(/<[^>]+>/g,"").trim() : "";
          const item = out.find(x=>x.number===v.verse_number);
          if(item && t) item.translation = t;
        });
      }catch(e){}
    }
    cacheSet("q_surah_"+n, out, 30*24*3600*1000);
    return {surah:out, source:"Quran.com API"};
  }catch(err){
    // fallback: ayat contoh lokal yang tersedia
    const local = Object.keys(DBQ.AYAT).filter(k=>DBQ.AYAT[k].s===n)
      .map(k=>{ const a=DBQ.AYAT[k]; return {number:a.a, key:n+":"+a.a, juz:null, arab:a.arab, translation:a.arti}; })
      .sort((a,b)=>a.number-b.number);
    return {surah:local, source:"data lokal (API tidak terjangkau)"};
  }
};

/* ============================================================
   C. HADIS — API hadith (gading.dev) + fallback lokal
   ============================================================ */
API.HADITH_BOOKS = [
  ["bukhari","Shahih Bukhari"],["muslim","Shahih Muslim"],["abudawud","Sunan Abu Dawud"],
  ["tirmidzi","Jami' at-Tirmidzi"],["nasai","Sunan an-Nasa'i"],["ibnmajah","Sunan Ibnu Majah"],
  ["malik","Al-Muwaththa'"],["ahmad","Musnad Ahmad"]
];
API.getHadithRange = async function(book, from, to){
  const key = "h_"+book+"_"+from+"_"+to;
  const cached = cacheGetTtl(key, 24*3600*1000);
  if(cached) return {hadiths:cached, source:"cache lokal"};
  try{
    const j = await API.fetchJSON("https://api.hadith.gading.dev/books/"+book+"?range="+from+"-"+to, 10000);
    const list = (j && j.data && j.data.hadiths) ? j.data.hadiths : (j && j.hadiths) ? j.hadiths : [];
    if(!list.length) throw new Error("empty");
    const hadiths = list.map(h=>({
      number: h.number, arab: h.arab||"", id: h.id||"", narrator: h.narrator||""
    }));
    cacheSet(key, hadiths, 24*3600*1000);
    return {hadiths, source:"API hadith (gading.dev)"};
  }catch(err){
    return {hadiths:[], source:"API tidak terjangkau"};
  }
};

/* ============================================================
   D. DEBOUNCE untuk pencarian
   ============================================================ */
API.debounce = function(fn, ms){
  let t = null;
  return function(){
    const args = arguments, self = this;
    clearTimeout(t);
    t = setTimeout(()=>fn.apply(self, args), ms||250);
  };
};
</script>

<script>

    const box = document.getElementById("prayer-times");

  }).catch(()=>{});

  /* HARI INI — Carousel (Ayat / Hadis / Doa / Sejarah) */
  const i = dayOfYear();
  const ayatKey = DB.DAILY.ayat[i % DB.DAILY.ayat.length];
  const ayat = DBQ.AYAT[ayatKey]; const sur = DBQ.surah(ayat.s);

  const doaE = getEntry(DB.DAILY.doa[i % DB.DAILY.doa.length]);

  h += '<div class="section-title"><h2>Hari Ini</h2></div>'
    + '<div class="carousel" id="today-carousel">'
    + '<div class="carousel-viewport"><div class="carousel-track">';

  /* Slide 1 — Ayat Hari Ini */
  h += '<div class="carousel-slide"><div class="card daily-card tappable" data-nav="#/quran/ayat/'+ayatKey+'">'
    + '<span class="daily-label">AYAT HARI INI</span>'
    + '<div class="daily-title">QS. '+esc(sur[1])+' · Ayat '+ayat.a+'</div>'
    + '<div class="car-article"><div class="arabic-text" dir="rtl" lang="ar">'+esc(ayat.arab)+'</div>'
    + '<div class="car-arti muted small" style="margin-top:6px">'+esc(ayat.arti)+'</div></div>'
    + '<div class="car-foot tiny muted">Sumber: Al-Qur\'an · '+audioUI("","","")+'</div>'
    + '</div></div>';

  /* Slide 2 — Hadis Hari Ini */
  h += '<div class="carousel-slide"><div class="card daily-card tappable" data-nav="#/entry/'+hadisE.id+'">'

    + '<div class="car-arti muted small" style="margin-top:6px">'+esc(hadisE.arabic.arti)+'</div></div>'
    + '<div class="car-foot tiny muted">'+esc(hadisE.rawi)+' · '+esc(hadisE.kitab)+'</div>'
    + '</div></div>';

  /* Slide 3 — Doa Hari Ini */
  h += '<div class="carousel-slide"><div class="card daily-card tappable" data-nav="#/entry/'+doaE.id+'">'
    + '<span class="daily-label">DOA HARI INI</span>'
    + '<div class="car-article"><div class="arabic-text" dir="rtl" lang="ar">'+esc(doaE.arabic.text)+'</div>'
    + '<div class="car-arti muted small" style="margin-top:6px">'+esc(doaE.arabic.arti)+'</div></div>'
    + '<div class="car-foot tiny muted">'+esc(doaE.arabic.source)+'</div>'
    + '</div></div>';

  /* Slide 4 — Sejarah Hari Ini */

    h += eventsToday.map(ev=>'<div class="cal-event-row"><div class="ce-date">'+ev.day+' '+ev.month+'</div><div class="ce-body" data-nav="#/event/'+ev.id+'"><div class="ce-title">'+esc(ev.title)+'</div><div class="ce-desc">'+esc(ev.desc)+'</div></div></div>').join("");
  } else {
    h += '<div class="car-article"><p class="muted small" style="margin-top:6px">Tidak ada peristiwa tercatat untuk tanggal Hijriah hari ini di database.</p></div>';
  }
  h += '</div></div>';

  h += '</div></div>'
    + '<button class="carousel-nav prev" data-action="car-prev" aria-label="Sebelumnya">'+icon("arrowL",16)+'</button>'

/* ---------- Carousel "Hari Ini": auto-rotate, swipe, dots ---------- */
let carIdx = 0;
function initCarousel(){
  const root = document.getElementById("today-carousel");
  if(!root) return;
  const track = root.querySelector(".carousel-track");
  const dots = root.querySelectorAll(".carousel-dots .dot");
  if(!track || !dots.length) return;
  const n = root.querySelectorAll(".carousel-slide").length;
  carIdx = 0;
  clearInterval(window._carTimer);
  const go = idx => {
    carIdx = (idx+n)%n;
    track.style.transform = "translateX(-"+(carIdx*100)+"%)";
    dots.forEach((d,k)=> d.classList.toggle("active", k===carIdx));
  };
  root._go = go;
  const tick = () => go(carIdx+1);
  const resume = () => { clearInterval(window._carTimer); window._carTimer = setInterval(tick, 6000); };
  const pause = () => clearInterval(window._carTimer);
  const vp = root.querySelector(".carousel-viewport");
  if(vp){
    vp.onmouseenter = pause;
    vp.onmouseleave = resume;
    let tx = null;
    vp.ontouchstart = e => { tx = e.touches[0].clientX; pause(); };
    vp.ontouchend = e => {
      if(tx!==null){
        const dx = e.changedTouches[0].clientX - tx;
        if(Math.abs(dx) > 40) go(carIdx + (dx<0 ? 1 : -1));
      }
      tx = null; resume();
    };
  }
  window._carTimer = setInterval(tick, 6000);
}

function juzOf(surah, ayah){
  let juz = 1;
  DB.JUZ.forEach((j,idx)=>{
    const m = (j[2]||"").split(":");
    if(m.length===2){
      const js = +m[0], ja = +m[1];
      if(surah > js || (surah === js && ayah >= ja)) juz = j[0];
    }
  });
  return juz;
}

/* ---------- Aksi kalkulator zakat ---------- */
function calcZakat(){
  const type = (parseRoute().a) || "fitrah";
  const num = id => { const el = document.getElementById(id); return el && el.value!=="" ? +el.value : 0; };
  const sel = id => { const el = document.getElementById(id); return el? el.value : ""; };
  const inp = {goldPrice:num("z-goldPrice"), silverPrice:num("z-silverPrice"), ricePrice:num("z-ricePrice")};
  if(type==="fitrah"){ inp.qty = num("z-qty") * num("z-kg"); inp.price = num("z-price"); }
  if(type==="mal"){ inp.cash=num("z-cash"); inp.gold=num("z-gold"); inp.silver=num("z-silver"); inp.trade=num("z-trade"); inp.receivables=num("z-recv"); inp.debts=num("z-debt"); inp.nisabMethod=sel("z-nisab"); inp.haul=sel("z-haul"); }
  if(type==="emas"||type==="perak"){ inp.grams=num("z-grams"); }
  if(type==="uang"){ inp.balance=num("z-balance"); }
  if(type==="perdagangan"){ inp.asset=num("z-asset"); inp.debt=num("z-debt"); inp.haul=sel("z-haul"); }
  if(type==="penghasilan"){ inp.income=num("z-income"); inp.debtMonthly=num("z-debtM"); inp.method=sel("z-method"); }
  if(type==="pertanian"){ inp.value=num("z-value"); inp.irrigation=sel("z-irrigation"); }
  if(type==="peternakan"){ inp.livestock=sel("z-livestock"); inp.count=num("z-count"); }
  const box = document.getElementById("zakat-result");
  if(box){ box.innerHTML = zakatResultView(type, inp); box.scrollIntoView({behavior:"smooth", block:"start"}); }
}

/* ---------- Audio Manager — satu audio aktif pada satu waktu ---------- */
const AM = {
  el: null, key: null, queue: [], qi: 0,
  _ensure(){
    if(this.el || typeof Audio==="undefined") return this.el;
    this.el = new Audio();
    const self = this;
    this.el.onended = ()=> self.next();
    return this.el;
  },
  stop(){
    if(this.el){ this.el.pause(); this.el.src = ""; }
    this.key = null; this.queue = []; this.qi = 0;
    this._sync();
  },
  _scrollAyah(key){
    try{
      document.querySelectorAll(".ayah-playing").forEach(x=>x.classList.remove("ayah-playing"));
      const el = document.querySelector('[data-ayah="'+key+'"]');
      if(el){
        el.classList.add("ayah-playing");
        if(el.scrollIntoView) el.scrollIntoView({behavior:"smooth", block:"center"});
      }
    }catch(e){}
  },
  playOne(url, key){
    const a = this._ensure(); if(!a) return;
    this.stop();
    a.src = url; this.key = key;
    this._scrollAyah(key);
    a.play().catch(()=>{ this.key=null; this._sync(); });
    this._sync();
  },
  toggleOne(url, key){
    if(this.key===key && this.el && !this.el.paused){ this.el.pause(); this._sync(); return; }
    if(this.key===key){ this.el.play().catch(()=>{}); this._sync(); return; }
    this.playOne(url, key);
  },
  playQueue(urls, key, keys){
    const a = this._ensure(); if(!a || !urls || !urls.length) return;
    this.stop();
    this.queue = urls.slice(); this.keys = keys||[]; this.qi = 0; this.key = key;
    this._playQ();
  },
  _playQ(){
    if(this.qi >= this.queue.length){ this.key=null; this.queue=[]; this.keys=[]; this._sync(); return; }
    const a = this._ensure(); if(!a) return;
    a.src = this.queue[this.qi];
    if(this.keys && this.keys[this.qi]) this._scrollAyah(this.keys[this.qi]);
    this.qi++;
    a.play().catch(()=> this.next());
    this._sync();
  },
  next(){
    if(this.queue.length) this._playQ();
    else { this.key = null; this._sync(); }
  },
  _cancelTTS(){ if(typeof window!=="undefined" && "speechSynthesis" in window){ window.speechSynthesis.cancel(); } },
  stop(){
    if(this.el){ this.el.pause(); this.el.src = ""; }
    this.key = null; this.queue = []; this.qi = 0;
    this._cancelTTS();
    this._sync();
  },
  tts(text, btn){
    if(typeof window==="undefined" || !("speechSynthesis" in window)){ toast("Perangkat tidak mendukung suara (TTS)", true); return; }
    const synth = window.speechSynthesis;
    if(this._ttsRunning && btn){ synth.cancel(); this._ttsRunning=false; btn.classList.remove("playing"); return; }
    this.stop(); synth.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "ar-SA"; u.rate = 0.85;
    try{
      const voices = synth.getVoices();
      const ar = voices.find(v=>/^ar/i.test(v.lang));
      if(ar) u.voice = ar;
    }catch(e){}
    u.onend = ()=>{ this._ttsRunning=false; if(btn) btn.classList.remove("playing"); };
    u.onerror = ()=>{ this._ttsRunning=false; if(btn) btn.classList.remove("playing"); };
    this._ttsRunning = true;
    if(btn){ btn.classList.add("playing"); btn.innerHTML = icon("pause",15); }
    synth.speak(u);
  },
  _sync(){
    const k = this.key, playing = this.el && !this.el.paused;
    document.querySelectorAll("[data-audio-key]").forEach(b=>{
      const active = b.dataset.audioKey === k;
      b.classList.toggle("playing", active && playing);
      b.classList.toggle("paused", active && !playing);
      b.innerHTML = active ? icon(playing?"pause":"play",15) : icon("play",15);
    });
    document.querySelectorAll('[data-action="surah-audio"]').forEach(b=>{
      const active = (k||"").indexOf("surah-")===0;
      b.classList.toggle("playing", active && playing);
      b.classList.toggle("paused", active && !playing);
      b.innerHTML = active ? icon(playing?"pause":"play",17) : icon("play",17);
    });
  }
};

  return null;
}

  }

  let h = '<div class="page"><div class="detail-head">'+crumbs(cr)
    + '<button class="btn btn-ghost" style="margin-bottom:10px" data-action="back" data-fallback="'+backHref+'">'+icon("back",15)+' Kembali ke '+esc(backLabel)+'</button>'
    + '<h1 class="detail-title">'+esc(e.title)+' '+statusPill(e)+'</h1>'
    + (e.summary?'<p class="detail-summary">'+esc(e.summary)+'</p>':"")
    + (e.sequence?'<span class="badge-num" style="margin-top:8px">Urutan gerakan #'+e.sequence+'</span>':"")
    + '<div class="detail-actions">'
    + '<button class="btn btn-ghost" data-action="bookmark" data-id="'+e.id+'">'+(inCollection(e.id)?icon("bookmarkFill",16)+" Tersimpan":icon("bookmark",16)+" Simpan")+'</button>'
    + '<button class="btn btn-ghost" data-action="share" data-id="'+e.id+'">'+icon("share",16)+' Bagikan</button>'
    + '</div></div>';

  if(e.illustration){
    h += '<div class="pose">'+e.illustration+'<span class="pose-label">Ilustrasi gerakan (orisinal aplikasi)</span></div>';
  }

  h += arabicBlock(e.arabic);

  if(e.type==="hadith"){
    h += '<div class="callout info">'+icon("info",18)+'<div><b>Perawi:</b> '+esc(e.rawi||"—")+'<br><b>Referensi:</b> '+esc(e.kitab||"—")+'<br><b>Derajat:</b> '+esc(e.derajat||"—")+'</div></div>';
  }
  if(e.type==="person" && e.person){
    h += '<div class="callout info">'+icon("tokoh",18)+'<div>'
      + '<b>Nama lain:</b> '+esc(e.person.alt||"—")+'<br>'
      + '<b>Lahir:</b> '+esc(e.person.birth||"—")+'<br>'
      + '<b>Wafat:</b> '+esc(e.person.death||"—")+'<br>'
      + '<b>Lokasi:</b> '+esc(e.person.loc||"—")
      + '</div></div>';
  }
  if(e.type==="place" && e.place){
    const p=e.place;
    h += '<div class="callout info">'+icon("map",18)+'<div><b>Jenis:</b> '+esc(p.type||"—")+'<br><b>Lokasi:</b> '+esc(p.loc||"—")+'</div></div>';
    if(p.lat && p.lon){
      h += '<a class="btn btn-ghost" style="margin-top:4px" target="_blank" rel="noopener" href="https://www.google.com/maps?q='+p.lat+','+p.lon+'">'+icon("external",16)+' Buka di peta</a>';
    }
  }
  if(e.type==="kitab" && e.kitab){
    const k=e.kitab;
    h += '<div class="callout info">'+icon("book",18)+'<div>'
      + '<b>Penulis:</b> '+esc(k.penulis||"—")+'<br>'
      + '<b>Periode:</b> '+esc(k.periode||"—")+'<br>'
      + '<b>Bahasa asli:</b> '+esc(k.bahasa||"—")+'<br>'
      + '<b>Kategori:</b> '+esc(k.kategori||"—")
      + '</div></div>';
  }
  if(e.type==="bacaan" || e.type==="doa"){
    h += '<div class="callout info">'+icon("audio",18)+'<div>Setiap bacaan Arab menyertakan teks Arab, transliterasi, arti, audio (bila tersedia), dan sumber — sesuai standar global SILMIKAFFAH.</div></div>';
  }

  h += '<div class="prose">';
  (e.body||[]).forEach(sec=>{
    h += '<h4>'+esc(sec.h||"")+'</h4>';
    if(sec.p) sec.p.forEach(p=>h+='<p>'+esc(p)+'</p>');
    if(sec.list) h += '<ul>'+sec.list.map(x=>'<li>'+esc(x)+'</li>').join("")+'</ul>';
  });
  h += '</div>';

  if(e.tags && e.tags.length) h += '<div class="chips" style="margin-top:14px">'+e.tags.map(t=>'<span class="chip tag">#'+esc(t)+'</span>').join("")+'</div>';
  h += sourcesBlock(e);
  h += relatedBlock(e);
  h += '</div>';
  return h;
}

/* ---------- Halaman Menu (materi → submateri → entri) ---------- */
function subLabel(e){
  const map = {
    "wajib":"Wajib","sunnah":"Sunnah","tata-cara":"Tata Cara","gerakan":"Gerakan","bacaan":"Bacaan",
    "ketentuan":"Ketentuan","kondisi-khusus":"Kondisi Khusus","jenis":"Jenis","fitur":"Fitur","level":"Tahap",
    "tauhid":"Tauhid","asmaul-husna":"Asmaul Husna","sifat":"Sifat Allah","sub":"Submateri",
    "syarat-wajib":"Syarat Wajib","syarat-sah":"Syarat Sah","rukun":"Rukun Shalat","wajib-hukum":"Wajib Shalat",
    "sunnah-hukum":"Sunnah Shalat","makruh":"Makruh Shalat","pembatal":"Pembatal Shalat","jamaah":"Shalat Berjamaah",
    "perjalanan":"Shalat dalam Perjalanan","harian":"Doa Harian","tidur":"Doa Tidur","makan":"Doa Makan",
    "belajar":"Doa Belajar","perjalanan-doa":"Doa Perjalanan","keluarga":"Doa Keluarga","perlindungan":"Doa Perlindungan",
    "setelah-shalat":"Doa/Dzikir setelah Shalat","ramadan":"Doa Ramadan","pagi":"Dzikir Pagi","petang":"Dzikir Petang",
    "terpuji":"Akhlak Terpuji","tercela":"Akhlak Tercela","kepada-allah":"Adab kepada Allah","kepada-rasul":"Adab kepada Rasul",
    "orang-tua":"Adab kepada Orang Tua","guru":"Adab kepada Guru","sesama":"Adab kepada Sesama","bertamu":"Adab Bertamu",
    "media":"Adab Bermedia","taubat":"Taubat","muhasabah":"Muhasabah","penyakit-hati":"Penyakit Hati","pembinaan":"Pembinaan Diri"
  };
  return e.sub ? (map[e.sub]||e.sub) : null;
}
function byOrder(a,b){
  return ((a.order||9999)-(b.order||9999)) || a.title.localeCompare(b.title);
}
function menuView(menuId){
  const menu = DB.MENUS.find(m=>m.id===+menuId);
  if(!menu) return errorView("Menu tidak ditemukan.");
  // Menu khusus: Al-Qur'an (tab materi) & Kalender (halaman khusus)
  if(menu.id===3) return quranView("");
  if(menu.id===10) return kalenderView(new Date());

  let h = '<div class="page">'+crumbs([{label:"Home",href:"#/home"},{label:menu.name}])
    + '<h1 class="h1">'+icon(menu.icon,22)+' '+esc(menu.name)+'</h1>'
    + '<p class="muted small" style="margin-top:4px">'+esc(menu.desc)+'</p>'
    + '<div style="margin-top:12px">';
  menu.materials.forEach(mat=>{
    const count = DB.ENTRIES.filter(e=>e.menu===menu.id && e.material===mat.id).length;
    h += '<div class="row" data-nav="#/material/'+menu.id+'/'+mat.id+'">'
      + '<span class="row-icon">'+icon(matIcon(menu.id, mat.id),18)+'</span>'
      + '<span class="grow"><span class="rt">'+esc(mat.name)+'</span>'
      + (count?'<span class="rs">'+count+' topik</span>':"")
      + '</span><span class="chev">'+icon("chev",18)+'</span></div>';
  });
  h += '</div></div>';
  return h;
}
function matIcon(menuId, matId){
  const m = DB.MENUS.find(x=>x.id===+menuId);
  return m? m.icon : "book";
}
function materialView(menuId, matId){
  const menu = DB.MENUS.find(m=>m.id===+menuId);
  const mat = menu ? menu.materials.find(x=>x.id===matId) : null;
  if(!menu || !mat) return errorView("Materi tidak ditemukan.");
  if(menu.id===3){
    const tabs = {mushaf:"", juz:"juz", "juz-amma":"juzamma", iqra:"iqra", tajwid:"tajwid", tafsir:"tafsir"};
    return quranView(tabs[matId]||"", mat.name);
  }
  if(menu.id===10) return kalenderView(new Date());

  let entries = DB.ENTRIES.filter(e=>e.menu===+menuId && e.material===matId).sort(byOrder);
  // Entry pendahuluan "Rukun Iman" tidak ditampilkan di dalam materi Iman kepada Allah
  if(matId==="iman-kepada-allah") entries = entries.filter(e=>e.id!=="iman");
  const subsDef = mat.subs || [];
  const subSet = {};
  entries.forEach(e=>{ if(e.sub){ (subSet[e.sub]=subSet[e.sub]||[]).push(e); } });
  const subIds = subsDef.length ? subsDef.map(s=>s[0]) : Object.keys(subSet).sort();
  const mainEntries = entries.filter(e=>!e.sub);

  // Satu entri tanpa sub → langsung buka isi (bukan tombol ganda)
  if(entries.length===1 && !entries[0].sub && !subIds.length){
    return entryView(entries[0].id);
  }

  let h = '<div class="page">'+crumbs([{label:"Home",href:"#/home"},{label:menu.name,href:"#/menu/"+menu.id},{label:mat.name}])
    + '<button class="btn btn-ghost" style="margin-bottom:10px" data-action="back" data-fallback="#/menu/'+menu.id+'">'+icon("back",15)+' Kembali ke '+esc(menu.name)+'</button>'
    + '<h1 class="h1">'+esc(mat.name)+'</h1>';

  if(!entries.length){
    h += '<div class="empty-state" style="margin-top:12px">'+icon("book")+'<h4>Materi ini masih dikembangkan</h4><p>Konten akan ditambahkan bertahap.</p></div></div>';
    return h;
  }
  mainEntries.forEach(e=> h += rowEntry(e, zakatHref(e)));
  subIds.forEach(sk=>{
    const list = (subSet[sk]||[]).sort(byOrder);
    if(!list.length) return;
    const label = subName(mat, sk);
    h += '<div class="row" data-nav="#/sub/'+menu.id+'/'+mat.id+'/'+sk+'">'
      + '<span class="row-icon">'+icon("layers",18)+'</span>'
      + '<span class="grow"><span class="rt">'+esc(label)+'</span><span class="rs">'+list.length+' topik</span></span>'
      + '<span class="chev">'+icon("chev",18)+'</span></div>';
  });
  h += '</div>';
  return h;
}
function subView(menuId, matId, sub, tag){
  const menu = DB.MENUS.find(m=>m.id===+menuId);
  const mat = menu ? menu.materials.find(x=>x.id===matId) : null;
  if(!menu || !mat) return errorView("Submateri tidak ditemukan.");
  let entries = DB.ENTRIES.filter(e=>e.menu===+menuId && e.material===matId && e.sub===sub).sort(byOrder);
  const label = subName(mat, sub);
  let h = '<div class="page">'+crumbs([{label:"Home",href:"#/home"},{label:menu.name,href:"#/menu/"+menu.id},{label:mat.name,href:"#/material/"+menu.id+"/"+mat.id},{label:label}])
    + '<button class="btn btn-ghost" style="margin-bottom:10px" data-action="back" data-fallback="#/material/'+menu.id+'/'+mat.id+'">'+icon("back",15)+' Kembali ke '+esc(mat.name)+'</button>'
    + '<h1 class="h1">'+esc(label)+'</h1>';

  /* Filter TEMA (tag) — khusus koleksi hadis; tema adalah filter, bukan menu */
  if(+menuId===4 && matId==="hadis"){
    if(sub==="kitab"){
      h += '<div style="margin-top:12px">'+API.HADITH_BOOKS.map(b=>
        '<div class="row" data-nav="#/kitab/'+b[0]+'"><span class="row-icon">'+icon("hadis",18)+'</span>'
        + '<span class="grow"><span class="rt">'+esc(b[1])+'</span><span class="rs">Hadis dimuat via API saat dibuka</span></span>'
        + '<span class="chev">'+icon("chev",18)+'</span></div>').join("")+'</div>';
      h += '<div class="callout info" style="margin-top:12px">'+icon("info",18)+'<div>Koleksi kitab dimuat dari API hadis per 20 nomor (lazy). Derajat hadis tidak ditampilkan bila API tidak menyediakannya — tidak ada hadis karangan.</div></div>';
      return h+'</div>';
    }
    const tags = [...new Set(entries.flatMap(e=>e.tags||[]))].sort();
    h += '<div class="chips" style="margin:10px 0">'
      + '<button class="chip'+(tag?"":" active")+'" data-nav="#/sub/4/hadis/pilihan">Semua</button>'
      + tags.map(t=>'<button class="chip'+(tag===t?" active":"")+'" data-nav="#/sub/4/hadis/pilihan/'+encodeURIComponent(t)+'">'+esc(t)+'</button>').join("")
      + '</div>';
    if(tag) entries = entries.filter(e=>(e.tags||[]).includes(tag));
  }

  if(!entries.length){
    h += '<div class="empty-state" style="margin-top:12px">'+icon("layers")+'<h4>Belum ada topik</h4><p>Submateri ini masih dikembangkan.</p></div></div>';
    return h;
  }
  entries.forEach(e=> h += rowEntry(e, zakatHref(e)));
  h += '</div>';
  return h;
}
function subName(mat, sk){
  if(mat && mat.subs){ const s = mat.subs.find(x=>x[0]===sk); if(s) return s[1]; }
  return subLabel({sub:sk}) || sk;
}
function zakatHref(e){
  // Jenis/ketentuan zakat: klik → deskripsi entry. Kalkulator hanya lewat item Kalkulator Zakat.
  if(e.id==="zakat-kalkulator") return "#/zakat";
  return null;
}
function rowEntry(e, href){
  const seq = e.sequence ? ' <span class="badge-num">#'+e.sequence+'</span>' : "";
  return '<div class="row" data-nav="'+(href||"#/entry/"+e.id)+'">'
    + '<span class="row-icon">'+icon(typeIcon(e.type),18)+'</span>'
    + '<span class="grow"><span class="rt">'+esc(e.title)+seq+'</span>'
    + (e.summary?'<span class="rs">'+esc(e.summary)+'</span>':"")
    + '</span>'+statusPill(e)+'<span class="chev">'+icon("chev",18)+'</span></div>';
}

function entryHref(id){
  if(id.indexOf("ayat-")===0) return "#/quran/ayat/"+id.slice(5);

function typeIcon(t){

/* ---------- Pencarian Global ---------- */
function searchIndex(){
  const idx = [];
  DB.ENTRIES.forEach(e=>{
    idx.push({id:e.id, type:"entry", cat:menuName(e.menu), title:e.title, kw:(e.summary+" "+e.tags.join(" ")+" "+e.body.map(b=>(b.h||"")+(b.p?b.p.join(" "):"")+(b.list?b.list.join(" "):"")).join(" ")).toLowerCase()});
  });
  DBQ.SURAHS.forEach(s=>{
    idx.push({id:"surah-"+s[0], type:"surah", cat:"Al-Qur'an", title:"Surah "+s[1]+" — "+s[3], kw:(s[1]+" "+s[3]+" surah "+(s[4]==="Makkiyah"?"makkiyah":"madaniyah")).toLowerCase()});
  });
  Object.keys(DBQ.AYAT).forEach(k=>{
    const a = DBQ.AYAT[k], s = DBQ.surah(a.s);
    idx.push({id:"ayat-"+k, type:"ayat", cat:"Al-Qur'an", title:"QS. "+s[1]+" "+a.s+":"+a.a, kw:(a.arti+" "+s[1]).toLowerCase()});
  });
  DB.EVENTS.forEach(e=>{
    idx.push({id:"event-"+e.id, type:"event", cat:"Kalender & Sejarah", title:e.title, kw:(e.desc+" "+e.month).toLowerCase()});
  });
  DB.PLACES.forEach(p=>{
    idx.push({id:"place-"+p.id, type:"place", cat:"Ziarah", title:p.name, kw:(p.history+" "+p.loc).toLowerCase()});
  });
  DB.MENUS.forEach(m=>{
    idx.push({id:"menu-"+m.id, type:"menu", cat:"Menu Utama", title:m.name, kw:(m.name+" "+m.desc+" "+m.short).toLowerCase()});
    m.materials.forEach(mat=>{
      idx.push({id:"mat-"+m.id+"-"+mat.id, type:"material", cat:"Menu Utama", title:m.name+" → "+mat.name, kw:(mat.name+" "+m.name).toLowerCase()});
    });
  });
  return idx;
}
const SIDX = searchIndex();
function menuName(mid){ const m=DB.MENUS.find(x=>x.id===mid); return m?m.name:"Entri"; }
const SEARCH_CATS = ["Semua"].concat([...new Set(SIDX.map(x=>x.cat))].sort());
let searchCat = "Semua";
function searchView(q, cat){
  q = (q||"").trim().toLowerCase();
  if(cat) searchCat = cat;
  let h = '<div class="page">'+crumbs([{label:"Home",href:"#/home"},{label:"Search"}])
    + '<h1 class="h1">Pencarian Global</h1>'
    + '<p class="muted small" style="margin-top:4px">Mencari seluruh entity: ayat, surah, hadis, doa, fiqih, tokoh, sejarah, istilah, Asmaul Husna, dan tempat.</p>'
    + '<div class="search-bar" style="margin-top:12px"><div class="search-input-wrap">'+icon("search")+'<input class="search-input" id="search-input" type="search" placeholder="Cari mis. Ramadan, Bilal, zakat…" value="'+esc(q)+'"></div></div>'
    + '<div class="chips" style="margin:10px 0">'
    + SEARCH_CATS.map(c=>'<button class="chip'+(searchCat===c?" active":"")+'" data-nav="#/search/'+encodeURIComponent(q)+"/"+encodeURIComponent(c)+'">'+esc(c)+'</button>').join("")
    + '</div>';
  if(!q){
    h += '<div class="empty-state">'+icon("search")+'<h4>Mulai mengetik</h4><p>Hasil akan dikelompokkan berdasarkan kategori sumber.</p></div>';
    return h+'</div>';
  }
  let results = SIDX.filter(x=> x.title.toLowerCase().includes(q) || x.kw.includes(q));
  if(searchCat!=="Semua") results = results.filter(x=>x.cat===searchCat);
  if(!results.length){
    h += '<div class="empty-state">'+icon("search")+'<h4>Tidak ditemukan</h4><p>Pencarian "'+esc(q)+'" tidak menghasilkan hasil di kategori ini. Coba kata kunci lain.</p></div>';
    return h+'</div>';
  }
  const groups = {};
  results.forEach(r=>{ (groups[r.cat]=groups[r.cat]||[]).push(r); });
  Object.keys(groups).forEach(cat=>{
    h += '<div class="search-group"><h4>'+esc(cat)+' ('+groups[cat].length+')</h4>';
    groups[cat].forEach(r=>{
      h += '<div class="row" data-nav="'+searchHref(r)+'"><span class="row-icon">'+icon(searchIcon(r.type),18)+'</span><span class="grow"><span class="rt">'+esc(r.title)+'</span></span><span class="chev">'+icon("chev",18)+'</span></div>';
    });
    h += '</div>';
  });
  return h+'</div>';
}
function searchHref(r){
  if(r.type==="entry") return "#/entry/"+r.id;
  if(r.type==="surah") return "#/surah/"+r.id.split("-")[1];
  if(r.type==="ayat") return "#/quran/ayat/"+r.id.split("-")[1];
  if(r.type==="event") return "#/event/"+r.id.slice(6);
  if(r.type==="place") return "#/entry/"+r.id.slice(6);
  if(r.type==="menu") return "#/menu/"+r.id.slice(5);
  if(r.type==="material"){ const p = r.id.split("-"); return "#/material/"+p[1]+"/"+p.slice(2).join("-"); }
  return "#/entry/"+r.id;
}
function searchIcon(t){ return t==="surah"?"quran":t==="ayat"?"quran":t==="event"?"sirah":t==="place"?"map":t==="menu"?"grid":t==="material"?"layers":typeIcon(t); }

/* ---------- KALKULATOR FARAIDH ---------- */
CALC.faraidh = function(inp){
  const out = {rows:[], notes:[], total: +inp.harta||0, ok:true};
  const hasSpouse = !!inp.hasSpouse;
  const deceasedGender = inp.deceasedGender || "L";
  const spouseCount = Math.max(1, +inp.spouseCount||1);
  const sons = Math.max(0, +inp.sons||0);
  const daughters = Math.max(0, +inp.daughters||0);
  const fatherAlive = !!inp.fatherAlive;
  const motherAlive = !!inp.motherAlive;
  const hasChildren = sons>0 || daughters>0;
  const shares = {}; // key -> fraction of total

  // 1) Pasangan
  let spouseShare = 0;
  if(hasSpouse){
    if(deceasedGender==="L"){ spouseShare = hasChildren ? 1/8 : 1/4; shares["Istri"+(spouseCount>1?(" (dibagi "+spouseCount+")"):"")]=spouseShare; }
    else { spouseShare = hasChildren ? 1/4 : 1/2; shares["Suami"]=spouseShare; }
  }
  // 2) Ibu
  let motherShare = 0;
  if(motherAlive){ motherShare = hasChildren ? 1/6 : 1/3; shares["Ibu"]=motherShare; }

  if(sons>0){
    // Ayah hanya fardh 1/6 (anak laki-laki menghalangi ayah jadi ashabah)
    let fatherShare = fatherAlive ? 1/6 : 0;
    if(fatherAlive) shares["Ayah"]=fatherShare;
    const usedFixed = spouseShare + motherShare + fatherShare;
    let residual = Math.max(0, 1 - usedFixed);
    const units = sons*2 + daughters*1;
    if(units>0){
      shares["Anak laki-laki (@unit)"] = null; // placeholder removed below
      const perUnit = residual/units;
      if(sons>0) shares["Anak laki-laki ("+sons+" orang, @"+ (perUnit*2*100).toFixed(2) +"%)"] = perUnit*2*sons;
      if(daughters>0) shares["Anak perempuan ("+daughters+" orang, @"+ (perUnit*100).toFixed(2) +"%)"] = perUnit*1*daughters;
    }
    delete shares["Anak laki-laki (@unit)"];
    out.notes.push("Ayah tidak menjadi ashabah karena ada anak laki-laki (hanya menerima bagian tetap 1/6).");
  } else if(daughters>0){
    const daughtersFardh = daughters===1 ? 1/2 : 2/3;
    shares["Anak perempuan ("+daughters+" orang)"] = daughtersFardh;
    let fatherFardh = fatherAlive ? 1/6 : 0;
    let usedFixed = spouseShare + motherShare + daughtersFardh + fatherFardh;
    if(usedFixed > 1){
      // AUL: skala proporsional turun agar total = 1
      const factor = 1/usedFixed;
      Object.keys(shares).forEach(k=> shares[k]*=factor);
      if(fatherAlive) shares["Ayah"] = fatherFardh*factor;
      out.notes.push("Total bagian tetap melebihi harta ('aul) — seluruh bagian diskalakan proporsional agar berjumlah 100%.");
    } else {
      const residual = 1 - usedFixed;
      if(fatherAlive){
        shares["Ayah"] = fatherFardh + residual;
        out.notes.push("Ayah menerima 1/6 (fardh) ditambah sisa harta (ashabah) karena tidak ada anak laki-laki.");
      } else if(residual > 0.0001){
        // RADD ke ahli waris fardh non-pasangan (ibu & anak perempuan), proporsional
        const raddPool = {};
        if(motherAlive) raddPool["Ibu"]=motherShare;
        raddPool["Anak perempuan ("+daughters+" orang)"]=daughtersFardh;
        const raddTotal = Object.values(raddPool).reduce((a,b)=>a+b,0);
        Object.keys(raddPool).forEach(k=>{ shares[k] = raddPool[k] + residual*(raddPool[k]/raddTotal); });
        out.notes.push("Tidak ada ayah/ashabah lain dalam kasus ini — sisa harta dikembalikan (radd) secara proporsional ke ibu dan anak perempuan (pasangan tidak menerima radd menurut mayoritas ulama).");
      }
    }
  } else {
    // Tidak ada anak sama sekali
    const usedFixed = spouseShare + motherShare;
    const residual = 1 - usedFixed;
    if(fatherAlive){
      shares["Ayah"] = residual;
      out.notes.push("Tidak ada anak — ayah menerima seluruh sisa harta sebagai ashabah.");
    } else if(residual > 0.0001){
      out.ok = false;
      out.notes.push("Sisa harta ("+(residual*100).toFixed(2)+"%) jatuh ke ahli waris lain yang tidak dicakup kalkulator ini (mis. saudara kandung, kakek/nenek, paman) — kalkulator ini hanya mencakup pasangan, anak, ayah, dan ibu. Konsultasikan ke ulama/lembaga faraidh untuk kasus lengkap.");
    }
  }

  Object.keys(shares).forEach(label=>{
    const frac = shares[label];
    out.rows.push({label, fraction:frac, percent:(frac*100), nominal: out.total>0 ? out.total*frac : null});
  });
  return out;
};

/* ---------- KONVERSI HIJRIAH <-> MASEHI ---------- */
CALC.hijriToGregorian = function(hy, hm, hd){
  const anchor = new Date(); anchor.setHours(0,0,0,0);
  const aH = CALC.hijriParts(anchor);
  const monthsDiff = (hy - aH.year)*12 + (hm - aH.month);
  const daysDiff = Math.round(monthsDiff*29.5306) + (hd - aH.day);
  const guess = new Date(anchor); guess.setDate(guess.getDate()+daysDiff);
  for(let pass=0; pass<2; pass++){
    const range = pass===0 ? 10 : 40;
    for(let off=-range; off<=range; off++){
      const d = new Date(guess); d.setDate(guess.getDate()+off);
      const p = CALC.hijriParts(d);
      if(p.year===hy && p.month===hm && p.day===hd) return d;
    }
  }
  return null;
};

function convGregToHijri(){
  const v = document.getElementById("c-greg").value;
  const box = document.getElementById("conv-g2h-result");
  if(!v){ if(box) box.innerHTML = '<p class="muted small">Pilih tanggal terlebih dahulu.</p>'; return; }
  const d = new Date(v+"T12:00:00");
  const lbl = CALC.hijriLabel(d);
  if(box) box.innerHTML = '<div class="calc-result"><div class="cr-label">HASIL</div><div class="cr-value" style="font-size:22px">'+esc(lbl.hijri)+'</div></div>';
}
function convHijriToGreg(){
  const hd = +document.getElementById("c-hd").value||1;
  const hm = +document.getElementById("c-hm").value||1;
  const hy = +document.getElementById("c-hy").value||1446;
  const box = document.getElementById("conv-h2g-result");
  const d = CALC.hijriToGregorian(hy, hm, hd);
  if(!d){ if(box) box.innerHTML = '<p class="muted small">Tanggal tidak ditemukan/valid — periksa kembali input.</p>'; return; }
  const lbl = d.toLocaleDateString("id-ID", {weekday:"long", day:"numeric", month:"long", year:"numeric"});
  if(box) box.innerHTML = '<div class="calc-result"><div class="cr-label">HASIL</div><div class="cr-value" style="font-size:22px">'+esc(lbl)+'</div></div>';
}

  navigator.geolocation.getCurrentPosition(pos=>{
    const {latitude, longitude} = pos.coords;
    window.open("https://www.google.com/maps/search/masjid/@"+latitude+","+longitude+",15z", "_blank");

function parseRoute(){
  const raw = (location.hash||"#/home").replace(/^#\/?/,"");
  const parts = raw.split("/");
  return {name:parts[0]||"home", a:parts[1], b:parts[2], c:parts[3], d:parts[4], raw};
}
function router(){
  clearInterval(timerId); timerId = null;
  clearInterval(window._carTimer); window._carTimer = null;
  const r = parseRoute();
  const main = $("app-main");
  main.innerHTML = skeleton();
  window.scrollTo(0,0);
  setActiveNav(r.name);
  let html = "";
  try{
    switch(r.name){
      case "home": html = homeView(); break;
      case "jelajah": html = browseView(); break;
      case "menu": html = menuView(r.a); break;
      case "material": html = materialView(r.a, r.b); break;
      case "sub": html = subView(r.a, r.b, r.c, r.d); break;
      case "entry": html = entryView(decodeURIComponent(r.a||"")); break;
      case "quran": html = r.a==="ayat" ? quranAyahView(r.b) : quranView(r.a); break;
      case "surah": html = surahView(+r.a); break;
      case "juz": html = juzView(+r.a); break;
      case "iqra": html = iqraView(r.a); break;
      case "kalender": html = r.a==="date" ? kalenderDateView(r.b) : kalenderView(CAL_CURSOR); break;
      case "kitab": html = kitabView(r.a); break;
      case "hadith": html = hadithDetailView(r.a, r.b); break;
      case "zakat": html = zakatView(r.a); break;
      case "asmaul-husna": html = asmaulView(); break;
      case "ziarah": html = ziarahView(); break;
      case "event": html = eventView(r.a); break;
      case "search": html = searchView(r.a?decodeURIComponent(r.a):"", r.b?decodeURIComponent(r.b):""); break;
      case "koleksi": html = koleksiView(); break;
      case "faraidh": html = faraidhView(r.a); break;
      case "tasbih": html = tasbihView(); break;
      case "konversi-hijriah": html = hijriKonversiView(); break;
      case "masjid-terdekat": html = masjidTerdekatView(); break;
      case "settings": html = settingsView(); break;
      case "tentang": html = tentangView(); break;
      default: html = homeView();
    }
  }catch(err){
    console.error(err);
    html = errorView("Terjadi kesalahan saat memuat halaman.");
  }
  main.innerHTML = html;
  bindActions();
  afterRender(r);
}

function setActiveNav(name){
  const map = {home:"home", jelajah:"jelajah", search:"search", koleksi:"koleksi", settings:"settings"};
  const key = map[name] || (["menu","material","sub","entry","quran","surah","juz","iqra","kitab","hadith","kalender","zakat","ziarah","event","asmaul-husna","tentang","faraidh","tasbih","konversi-hijriah","masjid-terdekat"].includes(name)?"jelajah":null);
  document.querySelectorAll(".bn-item").forEach(b=> b.classList.toggle("active", b.dataset.bn===key));
  document.querySelectorAll(".sidebar-link").forEach(a=> a.classList.toggle("active", a.dataset.nav==="#/menu/"+(name==="menu"?routerA():"")));
}
function routerA(){ const p=parseRoute(); return p.a; }

/* ---------- Event Delegation ---------- */
function bindActions(){
  document.querySelectorAll("[data-nav]").forEach(el=>{
    el.onclick = e => { e.preventDefault(); location.hash = el.dataset.nav; };
  });
  document.querySelectorAll("[data-audio-key]").forEach(b=>{
    b.onclick = e => { e.stopPropagation(); AM.toggleOne(b.dataset.audioUrl, b.dataset.audioKey); };
  });
  document.querySelectorAll("[data-tts]").forEach(b=>{
    b.onclick = e => { e.stopPropagation(); AM.tts(b.dataset.tts, b); };
  });
  document.querySelectorAll("[data-action]").forEach(el=>{
    el.onclick = e => {
      const act = el.dataset.action;
      if(act==="bookmark") toggleBookmark(el.dataset.id, el);
      else if(act==="share") shareEntry(el.dataset.id, el);
      else if(act==="play") toggleAudio(el);
      else if(act==="geolocate") geolocate();
      else if(act==="reset") resetLocal();
      else if(act==="retry") router();
      else if(act==="wcalc") calcFaraidh();
      else if(act==="tasbih-tap") tasbihTap();
      else if(act==="tasbih-reset") tasbihReset();
      else if(act==="tasbih-target") tasbihSetTarget(el.dataset.n);
      else if(act==="conv-g2h") convGregToHijri();
      else if(act==="conv-h2g") convHijriToGreg();
      else if(act==="masjid-maps") openMasjidMaps();
      else if(act==="cal-pick") pickCalDate(el.dataset.month, el.dataset.day, el.dataset.istoday);
      else if(act==="cal-today") calBackToToday();
      else if(act==="zcalc") calcZakat();
      else if(act==="back"){
        // Satu stack navigasi: App Back = Hardware Back = Browser Back
        if(window.history && window.history.length > 1){ history.back(); }
        else if(el.dataset.fallback){ location.hash = el.dataset.fallback; }
        else { location.hash = "#/home"; }
      }
      else if(act==="iqra-prev"||act==="iqra-next"||act==="iqra-dot"){
        const bk = $("iqra-book"); if(!bk) return;
        const track = bk.querySelector(".iqra-track"), pages = bk.querySelectorAll(".iqra-page");
        const dots = bk.querySelectorAll("#iqra-dots .dot");
        const n = pages.length; if(!n) return;
        window._iqraIdx = window._iqraIdx || 0;
        if(act==="iqra-prev") window._iqraIdx = (window._iqraIdx-1+n)%n;
        else if(act==="iqra-next") window._iqraIdx = (window._iqraIdx+1)%n;
        else window._iqraIdx = +el.dataset.i;
        track.style.transform = "translateX(-"+(window._iqraIdx*100)+"%)";
        const pos = $("iqra-pos"); if(pos) pos.textContent = (window._iqraIdx+1)+" / "+n;
        dots.forEach((d,i)=> d.classList.toggle("active", i===window._iqraIdx));
      }
      else if(act==="asmaul-tts"){
        const names = DB.ENTRIES.filter(e=>e.type==="asmaul").map(e=>e.arabic ? e.arabic.text : "").filter(Boolean);
        AM.tts(names.join("، "), el);
      }
      else if(act==="surah-audio"){
        const n = el.dataset.surah;
        const q = window._surahQueue && window._surahQueue[n];
        const k = window._surahKeys && window._surahKeys[n];
        if(q && q.length){ AM.playQueue(q, "surah-"+n, k); }
        else { toast("Audio surah belum termuat — buka surah terlebih dahulu"); }
      }
      else if(act==="car-prev"||act==="car-next"){ const c=$("today-carousel"); if(c&&c._go){ clearInterval(window._carTimer); c._go(carIdx+(act==="car-next"?1:-1)); window._carTimer=setInterval(()=>{ const cc=$("today-carousel"); if(cc&&cc._go)cc._go(carIdx+1); },6000); } }
      else if(act==="car-dot"){ const c=$("today-carousel"); if(c&&c._go){ clearInterval(window._carTimer); c._go(+el.dataset.i); window._carTimer=setInterval(()=>{ const cc=$("today-carousel"); if(cc&&cc._go)cc._go(carIdx+1); },6000); } }
    };
  });
  const si = $("search-input");
  if(si){
    si.oninput = API.debounce(() => {
      const v = si.value.trim();
      history.replaceState(null,"","#/search"+(v?"/"+encodeURIComponent(v):"")+"/"+encodeURIComponent(searchCat));
      const main=$("app-main");
      const s = searchView(v, searchCat);
      // re-render hasil tanpa kehilangan fokus
      const pos = si.selectionStart;
      main.innerHTML = s;
      bindActions();
      const n = $("search-input"); if(n){ n.focus(); n.setSelectionRange(pos,pos); }
      setActiveNav("search");
    }, 250);
  }
  ["set-theme","set-font","set-prayer","set-asr","set-city"].forEach(id=>{
    const el = $(id); if(!el) return;
    el.onchange = el.oninput = () => {
      if(id==="set-theme") applyTheme(el.checked?"dark":"light");
      if(id==="set-font"){ const v=["a","b","c"][+el.value]; SETTINGS.font=v; document.documentElement.dataset.font=v; const fv=$("font-val"); if(fv)fv.textContent=v.toUpperCase(); }
      if(id==="set-prayer") SETTINGS.prayerMethod=el.value;
      if(id==="set-asr") SETTINGS.asrMethod=el.value;
      if(id==="set-city"){ SETTINGS.city=el.value; const c=DB.CITIES.find(x=>x.id===el.value); if(c)SETTINGS.cityName=c.name; }
      saveSettings();
    };
  });
}
function toggleBookmark(id, btn){
  if(inCollection(id)){ COLLECTION = COLLECTION.filter(x=>x!==id); toast("Dihapus dari koleksi"); }
  else { COLLECTION.push(id); toast("Disimpan ke koleksi"); }
  saveCollection();
  if(btn) btn.innerHTML = inCollection(id)?icon("bookmarkFill",16)+" Tersimpan":icon("bookmark",16)+" Simpan";
}
function shareEntry(id, btn){
  const e = getEntry(id);
  const title = e ? e.title : (btn && btn.dataset.title ? btn.dataset.title : id);
  const text = e ? (e.summary||e.title) : title;
  const url = location.origin+location.pathname+entryHref(id);
  const data = {title:title, text:text, url:url};
  if(navigator.share){ navigator.share(data).catch(()=>{}); }
  else {
    try{ navigator.clipboard.writeText(url); toast("Tautan disalin"); }
    catch(err){ toast("Tidak dapat membagikan di perangkat ini", true); }
  }
}
function resetLocal(){
  COLLECTION=[]; RECENT=[]; saveCollection(); saveRecent();
  toast("Koleksi & riwayat direset"); router();
}

/* ---------- Audio ---------- */
let audioEl=null, audioBtn=null;
function toggleAudio(btn){
  const url = btn.closest("[data-audio]") ? btn.closest("[data-audio]").dataset.audio : null;
  if(!url) return;
  if(!audioEl){ audioEl = new Audio(); audioEl.onended = ()=>{ if(audioBtn){audioBtn.innerHTML=icon("play"); audioBtn.closest(".audio-box").querySelector(".audio-progress > i").style.width="0";} }; audioEl.ontimeupdate = ()=>{ const p=btn?btn.closest(".audio-box"):null; if(p) p.querySelector(".audio-progress > i").style.width = (audioEl.currentTime/audioEl.duration*100)+"%"; }; }
  if(audioEl.src!==url){ audioEl.src=url; }
  if(audioEl.paused){ audioEl.play(); btn.innerHTML=icon("pause"); audioBtn=btn; }
  else { audioEl.pause(); btn.innerHTML=icon("play"); }
}
function afterRender(r){
  if(r.name==="home"){
    const up = () => { const el=$("next-prayer"); if(el && window.SILMIKAFFAH._np){ const np=window.SILMIKAFFAH._np(el.dataset.key); if(np!==null) el.innerHTML=np; } };
    timerId = setInterval(up, 1000); up();
    initCarousel();
  }
  if(r.name==="kalender"){
    const keys=["cal-prev","cal-next"]; keys.forEach(k=>{ const b=$(k); if(b) b.onclick=()=>{ CAL_CURSOR = CALC.shiftHijriMonth(CAL_CURSOR, k==="cal-prev"?-1:1); router(); }; });
  }
  if(r.name==="iqra"){
    // swipe untuk membalik halaman Iqra
    const bk = $("iqra-book");
    if(bk){
      const vp = bk.querySelector(".iqra-viewport");
      if(vp){
        let tx = null;
        vp.ontouchstart = e => { tx = e.touches[0].clientX; };
        vp.ontouchend = e => {
          if(tx===null) return;
          const dx = e.changedTouches[0].clientX - tx;
          if(Math.abs(dx) > 40){
            const n = bk.querySelectorAll(".iqra-page").length;
            window._iqraIdx = window._iqraIdx||0;
            window._iqraIdx = (window._iqraIdx + (dx<0?1:-1) + n) % n;
            const track = bk.querySelector(".iqra-track");
            if(track) track.style.transform = "translateX(-"+(window._iqraIdx*100)+"%)";
            const pos = $("iqra-pos"); if(pos) pos.textContent = (window._iqraIdx+1)+" / "+n;
            bk.querySelectorAll("#iqra-dots .dot").forEach((d,i)=> d.classList.toggle("active", i===window._iqraIdx));
          }
          tx = null;
        };
      }
    }
  }
}

/* ---------- Theme ---------- */
function applyTheme(t){
  SETTINGS.theme = t; saveSettings();
  document.documentElement.dataset.theme = t;
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.content = t==="dark" ? "#070B08" : "#0F7A4D";
}

/* ---------- Geolokasi ---------- */
function geolocate(){
  if(!navigator.geolocation){ toast("Geolokasi tidak didukung perangkat", true); return; }
  toast("Mendeteksi lokasi…");
  navigator.geolocation.getCurrentPosition(pos=>{
    SETTINGS.useGeo=true; SETTINGS.geo={lat:pos.coords.latitude, lon:pos.coords.longitude};
    saveSettings(); toast("Lokasi perangkat digunakan"); router();
  }, ()=>{
    toast("Izin lokasi ditolak — gunakan pilihan kota manual", true);
  }, {timeout:8000});
}

/* ---------- Sidebar ---------- */
function buildSidebar(){
  const nav = $("sidebar-nav"); if(!nav) return;
  nav.innerHTML = DB.MENUS.map(m=>'<a class="sidebar-link" data-nav="#/menu/'+m.id+'">'+icon(m.icon,18)+'<span>'+esc(m.name)+'</span></a>').join("");
}

/* ---------- Init ---------- */
function init(){
  applyTheme(SETTINGS.theme);
  document.documentElement.dataset.font = SETTINGS.font;
  // Field standar: parentId & updatedAt (single source of truth)
  DB.ENTRIES.forEach(e=>{
    e.parentId = e.sub ? ("sub:"+e.menu+"/"+e.material+"/"+e.sub) : ("mat:"+e.menu+"/"+e.material);
    e.updatedAt = e.updatedAt || "2026-08-30";
  });
  buildSidebar();
  window.addEventListener("hashchange", router);
  router();
  // global click untuk audio pause lainnya
  document.addEventListener("click", e=>{
    const b = e.target.closest(".audio-btn");
    if(b){ document.querySelectorAll(".audio-btn").forEach(x=>{ if(x!==b && audioEl && !audioEl.paused && x.closest("[data-audio]")&&x.closest("[data-audio]").dataset.audio===audioEl.src){ x.innerHTML=icon("play"); } }); }
  });
}
App.router = router; // hook untuk pengujian & debugging
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", init); else init();
</script>
