<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DadarEndog | Kitab Masak Nusantara</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { background: #fafafa; font-family: 'Plus Jakarta Sans', sans-serif; color: #1a1a1a; }
        .recipe-layer { position: fixed; inset: 0; background: white; z-index: 1000; transform: translateY(100%); transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1); overflow-y: auto; }
        .recipe-layer.active { transform: translateY(0); }
        .post-card { background: white; border-bottom: 8px solid #f0f0f0; }
        .img-container { position: relative; width: 100%; aspect-ratio: 1/1; background: #eee; overflow: hidden; }
        .img-container img { width: 100%; height: 100%; object-fit: cover; }
        .category-pill { transition: 0.3s; cursor: pointer; border: 1px solid #efefef; white-space: nowrap; }
        .category-pill.active { background: #000; color: #fff; border-color: #000; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="pb-24">

    <header class="bg-white border-b border-gray-100 sticky top-0 z-50 px-5 py-4">
        <div class="flex justify-between items-center">
            <h1 class="text-2xl font-black italic tracking-tighter">Dadar<span class="text-orange-500">Endog</span></h1>
            <div class="flex gap-5 text-xl">
                <i class="fa-regular fa-heart"></i>
                <i class="fa-solid fa-paper-plane"></i>
            </div>
        </div>
        <p class="text-[9px] font-bold text-gray-400 mt-1 uppercase tracking-widest italic">Masak itu gampang, segampang dadar endog!</p>
    </header>

    <nav class="bg-white border-b border-gray-100 p-4 overflow-x-auto no-scrollbar flex gap-3">
        <div onclick="filterFeed('Semua')" class="category-pill active px-4 py-2 rounded-full text-[10px] font-black">SEMUA</div>
        <div onclick="filterFeed('Sumatera')" class="category-pill px-4 py-2 rounded-full text-[10px] font-black uppercase text-gray-400">Sumatera</div>
        <div onclick="filterFeed('Jawa')" class="category-pill px-4 py-2 rounded-full text-[10px] font-black uppercase text-gray-400">Jawa</div>
        <div onclick="filterFeed('Bali')" class="category-pill px-4 py-2 rounded-full text-[10px] font-black uppercase text-gray-400">Bali & NT</div>
        <div onclick="filterFeed('Sulawesi')" class="category-pill px-4 py-2 rounded-full text-[10px] font-black uppercase text-gray-400">Sulawesi</div>
        <div onclick="filterFeed('Papua')" class="category-pill px-4 py-2 rounded-full text-[10px] font-black uppercase text-gray-400">Papua</div>
    </nav>

    <main id="main-feed" class="flex flex-col mb-10"></main>

    <nav class="fixed bottom-0 w-full h-16 bg-white border-t border-gray-100 flex justify-around items-center z-[999]">
        <i class="fa-solid fa-house text-xl" onclick="window.scrollTo(0,0)"></i>
        <i class="fa-solid fa-magnifying-glass text-xl text-gray-300"></i>
        <i class="fa-regular fa-square-plus text-2xl text-gray-300"></i>
        <i class="fa-solid fa-utensils text-xl text-gray-300"></i>
        <div class="w-7 h-7 bg-orange-500 rounded-full flex items-center justify-center text-[10px] text-white font-bold">DE</div>
    </nav>

    <div id="recipe-detail" class="recipe-layer">
        <div class="p-5 sticky top-0 bg-white/90 backdrop-blur border-b flex items-center justify-between">
            <button onclick="closeRecipe()" class="text-xl"><i class="fa-solid fa-xmark"></i></button>
            <span class="text-xs font-black uppercase tracking-widest">Resep Lengkap</span>
            <div class="w-5"></div>
        </div>
        <div id="detail-body"></div>
    </div>

    <script>
        // Gunakan API Key kamu di sini
        const API_KEY = '1fVjusZHCt9MJkTfuOy58M6Gs1IwaZXqu3qdAGq3ZOmJhQSTXOlZD0eA';

        // DATABASE LENGKAP: Saya gunakan ID Pexels yang sudah saya riset agar fotonya pas
        const recipes = [
            {
                id: 1, region: 'Sumatera', title: 'Rendang Daging Sapi', pexelsId: 674483,
                origin: 'Padang, Sumatera Barat', type: 'Makanan Berat',
                ing: ['1kg Daging Paha Sapi', '2L Santan Kental', '100g Bawang Merah', '80g Bawang Putih', '250g Cabai Merah', 'Lengkuas, Serai, Daun Kunyit'],
                steps: ['Haluskan bumbu, masak bersama santan hingga mendidih.', 'Masukkan daging sapi.', 'Masak dengan api kecil selama 4 jam.', 'Aduk perlahan sampai minyak keluar dan bumbu menjadi hitam kering.']
            },
            {
                id: 2, region: 'Jawa', title: 'Soto Ayam Lamongan', pexelsId: 2092897,
                origin: 'Lamongan, Jawa Timur', type: 'Makanan Berat',
                ing: ['1 Ekor Ayam Kampung', 'Bubuk Koya (Kerupuk udang + Bawang putih goreng)', 'Soun, Kol, Seledri', 'Kunyit, Jahe, Kemiri'],
                steps: ['Rebus ayam hingga empuk, ambil kaldunya.', 'Tumis bumbu halus dan masukkan ke air kaldu.', 'Goreng ayam sebentar lalu suwir.', 'Sajikan dengan taburan koya yang banyak agar gurih.']
            },
            {
                id: 3, region: 'Bali', title: 'Sate Lilit Ikan', pexelsId: 10452331,
                origin: 'Gianyar, Bali', type: 'Cemilan/Lauk',
                ing: ['500g Ikan Tenggiri Giling', '100ml Santan Kental', 'Bumbu Base Genep Bali', 'Batang Serai untuk tusukan'],
                steps: ['Campur ikan giling dengan santan dan bumbu base genep.', 'Ambil sedikit adonan, lilitkan pada batang serai.', 'Bakar di atas bara api hingga harum dan matang.', 'Sajikan dengan sambal matah.']
            },
            {
                id: 4, region: 'Sulawesi', title: 'Coto Makassar', pexelsId: 775031,
                origin: 'Makassar', type: 'Makanan Berat',
                ing: ['500g Daging Sapi', '150g Kacang Tanah (Sangrai & haluskan)', 'Air Cucian Beras (Tajin)', 'Rempah Coto Lengkap'],
                steps: ['Rebus daging menggunakan air cucian beras sampai empuk.', 'Masukkan bumbu halus dan kacang tanah halus ke kuah.', 'Masak hingga kuah mengental.', 'Sajikan dengan irisan daun bawang dan ketupat.']
            },
            {
                id: 5, region: 'Papua', title: 'Papeda & Ikan Kuah Kuning', pexelsId: 10452331, 
                origin: 'Papua', type: 'Makanan Berat',
                ing: ['250g Sagu murni', 'Ikan Tongkol Segar', 'Kunyit, Kemangi, Cabe Rawit'],
                steps: ['Larutkan sagu dengan sedikit air dingin, lalu siram air mendidih sambil diaduk cepat.', 'Masak kuah ikan dengan kunyit dan serai.', 'Sajikan papeda yang kenyal dengan siraman kuah kuning ikan.']
            }
        ];

        async function renderFeed(filter = 'Semua') {
            const feed = document.getElementById('main-feed');
            feed.innerHTML = '<div class="p-20 text-center text-xs font-bold text-gray-400">Menyiapkan Meja Makan...</div>';
            
            let filtered = filter === 'Semua' ? recipes : recipes.filter(r => r.region === filter);
            let html = '';

            for (let r of filtered) {
                // Mengambil foto spesifik berdasarkan ID agar akurat
                const photoUrl = `https://images.pexels.com/photos/${r.pexelsId}/pexels-photo-${r.pexelsId}.jpeg?auto=compress&cs=tinysrgb&w=600`;
                
                html += `
                    <div class="post-card" onclick="openRecipe(${r.id})">
                        <div class="p-4 flex items-center gap-3">
                            <div class="w-8 h-8 rounded-full bg-orange-500 text-white flex items-center justify-center text-[10px] font-black italic">DE</div>
                            <div>
                                <h4 class="text-xs font-black">${r.title}</h4>
                                <p class="text-[9px] text-gray-400 uppercase font-bold">${r.origin}</p>
                            </div>
                        </div>
                        <div class="img-container">
                            <img src="${photoUrl}" alt="${r.title}">
                        </div>
                        <div class="p-4">
                            <div class="flex gap-4 mb-3 text-xl">
                                <i class="fa-regular fa-heart"></i>
                                <i class="fa-regular fa-comment"></i>
                                <i class="fa-regular fa-paper-plane"></i>
                            </div>
                            <p class="text-xs text-gray-600 leading-relaxed">
                                <span class="font-black text-black">DadarEndog</span> Memasak <span class="text-orange-600 font-bold">${r.title}</span> ternyata simpel banget! Yuk cek langkahnya di bawah...
                            </p>
                        </div>
                    </div>
                `;
            }
            feed.innerHTML = html;
        }

        function filterFeed(region) {
            document.querySelectorAll('.category-pill').forEach(p => {
                p.classList.remove('active', 'text-white');
                p.classList.add('text-gray-400');
            });
            event.target.classList.add('active', 'text-white');
            renderFeed(region);
        }

        function openRecipe(id) {
            const r = recipes.find(item => item.id === id);
            const photoUrl = `https://images.pexels.com/photos/${r.pexelsId}/pexels-photo-${r.pexelsId}.jpeg?auto=compress&cs=tinysrgb&w=800`;
            
            document.getElementById('detail-body').innerHTML = `
                <img src="${photoUrl}" class="w-full h-80 object-cover">
                <div class="p-8">
                    <p class="text-[10px] font-black text-orange-600 uppercase mb-2 tracking-widest">${r.type} | ${r.region}</p>
                    <h2 class="text-4xl font-black italic tracking-tighter mb-4">${r.title}</h2>
                    <hr class="mb-8">
                    <div class="mb-10">
                        <h3 class="font-black text-lg mb-4 italic">Bahan-Bahan:</h3>
                        <ul class="space-y-3 text-sm text-gray-600">
                            ${r.ing.map(i => `<li class="flex items-center gap-3 border-b border-gray-50 pb-2 italic">○ ${i}</li>`).join('')}
                        </ul>
                    </div>
                    <div>
                        <h3 class="font-black text-lg mb-4 italic">Cara Masak:</h3>
                        <div class="space-y-6">
                            ${r.steps.map((s, idx) => `
                                <div class="flex gap-4">
                                    <div class="w-6 h-6 rounded-lg bg-black text-white flex-shrink-0 flex items-center justify-center text-[10px] font-bold">${idx + 1}</div>
                                    <p class="text-sm text-gray-600 leading-relaxed">${s}</p>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('recipe-detail').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeRecipe() {
            document.getElementById('recipe-detail').classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        // Jalankan Feed Pertama Kali
        renderFeed();
    </script>
</body>
</html>
