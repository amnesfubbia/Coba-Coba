<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>amnesfubbia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { background-color: #000; color: #fff; font-family: 'Inter', sans-serif; margin: 0; overflow-x: hidden; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        /* CSS LOGO "A" MODERN (RIBBON STYLE) */
        .logo-a-container {
            position: relative;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logo-a-shape {
            position: relative;
            width: 40px;
            height: 50px;
            background: #fff;
            clip-path: polygon(50% 0%, 100% 100%, 75% 100%, 50% 30%, 25% 100%, 0% 100%);
        }
        /* Efek Lipatan/Bayangan pada Logo */
        .logo-a-shape::after {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            width: 50%;
            height: 100%;
            background: rgba(0, 0, 0, 0.15); /* Bayangan sisi kanan */
        }

        /* SPLASH SCREEN */
        #splashScreen { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.5s ease; }
        .splash-logo-box { transform: scale(1.5); }

        /* PROFILE */
        .profile-header { padding: 15px 15px 0 15px; background: #000; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .ig-logo { font-weight: 700; font-size: 18px; letter-spacing: -0.5px; }
        .dot-notify { width: 7px; height: 7px; background-color: #ff3b30; border-radius: 50%; display: inline-block; margin-left: 2px; }
        
        .profile-info { display: flex; align-items: center; gap: 25px; margin-bottom: 15px; }
        .profile-pic-container { position: relative; width: 86px; height: 86px; }
        .profile-pic-logo { 
            width: 82px; 
            height: 82px; 
            border-radius: 50%; 
            border: 1px solid #333; 
            background: #000; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden; 
        }
        /* Perkecil logo di dalam lingkaran profil */
        .profile-pic-logo .logo-a-container { transform: scale(0.8); }

        .add-story-btn { position: absolute; bottom: 4px; right: 4px; width: 24px; height: 24px; background: #0095f6; border: 3px solid #000; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; color: #fff; z-index: 10; }

        .stats { display: flex; flex-grow: 1; justify-content: space-around; text-align: center; }
        .stat-val { font-weight: 700; font-size: 16px; display: block; }
        .stat-label { font-size: 12px; color: #a8a8a8; }
        
        .bio { font-size: 13px; line-height: 1.4; margin-bottom: 15px; padding-top: 5px; }
        .bio-name { font-weight: 700; font-size: 14px; }

        .action-buttons { display: flex; gap: 6px; margin-bottom: 10px; }
        .btn-ig { flex: 1; background: #1c1c1c; border-radius: 8px; padding: 7px; font-size: 13px; font-weight: 600; text-align: center; cursor: pointer; color: #fff; }
        .btn-ig.active { background: #363636; }
        .btn-icon-sq { width: 34px; background: #1c1c1c; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; }

        /* TAB & GRID */
        .tab-nav { display: flex; border-top: 1px solid #1c1c1c; }
        .tab-item { flex: 1; text-align: center; padding: 12px 0; color: #a8a8a8; cursor: pointer; font-size: 18px; }
        .tab-item.active { color: #fff; border-bottom: 1px solid #fff; }
        .movie-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; padding-bottom: 80px; }
        .post-card { position: relative; aspect-ratio: 2/3; background: #0a0a0a; overflow: hidden; }
        .post-card img { width: 100%; height: 100%; object-fit: cover; }

        /* MODAL & OTHERS */
        .modal-player { display: none; position: fixed; inset: 0; z-index: 3000; background: #000; overflow-y: auto; }
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: #000; border-top: 1px solid #1c1c1c; display: flex; justify-content: space-around; padding: 12px 0; z-index: 300; }
        
        /* OVERLAY SEARCH & FILTER */
        #searchOverlay { display: none; position: fixed; inset: 0; background: #000; z-index: 2000; }
    </style>
</head>
<body>

    <div id="splashScreen">
        <div class="splash-logo-box">
            <div class="logo-a-container">
                <div class="logo-a-shape"></div>
            </div>
        </div>
        <p class="mt-6 text-[10px] tracking-[5px] font-bold uppercase text-zinc-500">amnesfubbia</p>
    </div>

    <div id="mainProfile">
        <div class="profile-header">
            <div class="top-bar">
                <div class="flex items-center gap-1" onclick="location.reload()">
                    <h1 class="ig-logo">amnesfubbia</h1>
                    <i class="fa-solid fa-chevron-down text-[10px]"></i>
                    <span class="dot-notify"></span>
                </div>
                <div class="flex gap-5 text-2xl">
                    <i class="fa-regular fa-square-plus"></i>
                    <i class="fa-solid fa-bars"></i>
                </div>
            </div>

            <div class="profile-info">
                <div class="profile-pic-container">
                    <div class="profile-pic-logo">
                        <div class="logo-a-container">
                            <div class="logo-a-shape"></div>
                        </div>
                    </div>
                    <div class="add-story-btn"><i class="fa-solid fa-plus"></i></div>
                </div>
                <div class="stats">
                    <div class="stat-item"><span class="stat-val">25.4rb</span><span class="stat-label">film</span></div>
                    <div class="stat-item"><span class="stat-val">8.2rb</span><span class="stat-label">series</span></div>
                    <div class="stat-item"><span class="stat-val">1.5rb</span><span class="stat-label">short</span></div>
                </div>
            </div>

            <div class="bio">
                <div class="flex items-center gap-1 mb-1">
                    <span class="bio-name">amnesfubbia</span>
                    <i class="fa-solid fa-circle-check text-[#0095f6] text-[13px]"></i>
                </div>
                <span>dari indonesia untuk dunia</span><br>
                <span>By Anasteas</span>
            </div>

            <div class="action-buttons">
                <div class="btn-ig" id="btnNowPlaying">Sedang Tayang</div>
                <div class="btn-ig" id="btnUpcoming">Segera Tayang</div>
                <div class="btn-icon-sq"><i class="fa-solid fa-user-plus text-sm"></i></div>
            </div>
        </div>

        <div class="tab-nav">
            <div class="tab-item active"><i class="fa-solid fa-table-cells"></i></div>
            <div class="tab-item"><i class="fa-regular fa-heart"></i></div>
            <div class="tab-item"><i class="fa-regular fa-bookmark"></i></div>
        </div>

        <main id="feedGrid" class="movie-grid"></main>
    </div>

    <nav class="bottom-nav">
        <i class="fa-solid fa-house text-xl" onclick="location.reload()"></i>
        <i class="fa-solid fa-magnifying-glass text-xl"></i>
        <i class="fa-regular fa-bookmark text-xl"></i>
    </nav>

    <div id="movieModal" class="modal-player">
        </div>

    <script>
        // API KEY & LOGIC TETAP SAMA
        const API_KEY = 'bfa7df5310c9974f62f26c6789a8c00d';
        
        window.onload = () => { 
            // Handle Splash Screen
            setTimeout(() => {
                const splash = document.getElementById('splashScreen');
                splash.style.opacity = '0';
                setTimeout(() => splash.style.display = 'none', 500);
            }, 2000);

            loadFeed(); 
        };

        async function loadFeed() {
            const grid = document.getElementById('feedGrid');
            const res = await fetch(`https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&language=id-ID&sort_by=popularity.desc`);
            const data = await res.json();
            data.results.forEach(m => {
                const card = document.createElement('div');
                card.className = 'post-card';
                card.innerHTML = `<img src="https://image.tmdb.org/t/p/w342${m.poster_path}">`;
                grid.appendChild(card);
            });
        }
    </script>
</body>
</html>
