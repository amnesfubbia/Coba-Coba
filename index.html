<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AMNESFUBBIA FILM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        
        body { background-color: #030303; color: #e5e5e5; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; }
        .nav-glass { background: rgba(3, 3, 3, 0.98); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.05); position: fixed; top: 0; width: 100%; z-index: 1000; }
        
        /* Grid 3 Kolom Mobile */
        .movie-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 10px; }
        @media (min-width: 768px) { .movie-grid { grid-template-columns: repeat(6, 1fr); gap: 20px; } }

        .movie-card { transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); background: #0f0f0f; border-radius: 12px; overflow: hidden; border: 1px solid rgba(255,255,255,0.03); cursor: pointer; }
        .movie-card:hover { transform: scale(1.05); border-color: #ef4444; box-shadow: 0 10px 20px rgba(239, 68, 68, 0.2); }
        .movie-card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; }

        /* Modal & UI Elements */
        .modal { display: none; position: fixed; inset: 0; z-index: 2000; background: rgba(0,0,0,0.98); overflow-y: auto; }
        .modal-content { background: #080808; width: 100%; max-width: 1100px; margin: 0 auto; min-height: 100vh; position: relative; }
        @media (min-width: 768px) { .modal-content { min-height: auto; margin: 20px auto; border-radius: 24px; border: 1px solid #222; } }
        
        /* Cast Slider */
        .cast-slider { display: flex; overflow-x: auto; gap: 15px; padding: 10px 0; scrollbar-width: none; }
        .cast-item { flex: 0 0 auto; width: 70px; text-align: center; cursor: pointer; }
        .cast-item img { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; border: 2px solid #333; transition: 0.3s; }
        .cast-item:hover img { border-color: #ef4444; transform: scale(1.1); }

        /* TOMBOL PROFESIONAL & ELEGAN */
        .btn-premium { @apply relative flex items-center justify-center gap-3 py-3 px-6 rounded-xl text-[11px] font-black uppercase tracking-wider transition-all duration-300 mb-3; 
            background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%); border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .btn-premium:hover { border-color: #ef4444; background: linear-gradient(135deg, #ef4444 0%, #991b1b 100%); transform: translateY(-2px); }
        .btn-download { @apply text-emerald-400 border-emerald-500/20; }
        .btn-download:hover { background: linear-gradient(135deg, #059669 0%, #064e3b 100%); color: white; border-color: #10b981; }

        #backToTop { display: none; position: fixed; bottom: 25px; right: 20px; z-index: 99; background: #ef4444; color: white; width: 50px; height: 50px; border-radius: 50%; border: none; align-items: center; justify-content: center; box-shadow: 0 5px 20px rgba(239, 68, 68, 0.4); }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
    </style>
</head>
<body onload="initApp()">

    <button id="backToTop" onclick="scrollToTop()"><i class="fa-solid fa-chevron-up"></i></button>

    <nav class="nav-glass p-3">
        <div class="container mx-auto space-y-3">
            <div class="flex items-center gap-3">
                <div class="shrink-0 cursor-pointer" onclick="location.reload()">
                    <span class="text-xl font-black italic uppercase tracking-tighter">AMNESFUBBIA<span class="text-red-600">FILM</span></span>
                </div>
                <div class="relative flex-grow">
                    <input type="text" id="searchInput" onkeypress="if(event.key==='Enter') searchMulti()" placeholder="Cari Film Indonesia..." class="w-full bg-white/5 border border-white/10 p-3 rounded-xl text-xs outline-none focus:border-red-600 transition-all">
                    <button onclick="searchMulti()" class="absolute right-4 top-1/2 -translate-y-1/2 text-red-600"><i class="fa-solid fa-magnifying-glass"></i></button>
                </div>
            </div>
            
            <div class="flex gap-2 overflow-x-auto scrollbar-hide">
                <select id="typeFilter" onchange="resetAndLoad()" class="bg-zinc-900/50 text-red-600 font-bold text-[10px] p-2.5 rounded-lg border border-white/5 outline-none uppercase">
                    <option value="movie">FILM</option>
                    <option value="tv">SERIES</option>
                </select>
                <select id="genreFilter" onchange="resetAndLoad()" class="bg-zinc-900/50 text-white text-[10px] font-bold p-2.5 rounded-lg border border-white/5 outline-none uppercase">
                    <option value="">GENRE</option>
                    <option value="28">Aksi</option><option value="12">Petualangan</option><option value="16">Animasi</option>
                    <option value="35">Komedi</option><option value="80">Kriminal</option><option value="27">Horor</option>
                    <option value="18">Drama</option><option value="14">Fantasi</option><option value="10749">Romantis</option>
                </select>
                <select id="yearFilter" onchange="resetAndLoad()" class="bg-zinc-900/50 text-white text-[10px] font-bold p-2.5 rounded-lg border border-white/5 outline-none uppercase">
                    <option value="">TAHUN</option>
                    <script>
                        const yr = new Date().getFullYear();
                        for(let y=yr; y>=1920; y--) document.write(`<option value="${y}">${y}</option>`);
                    </script>
                </select>
            </div>
        </div>
    </nav>

    <main class="container mx-auto pt-32 pb-20 px-2">
        <div id="movieGrid" class="movie-grid"></div>
        <div id="loadMoreContainer" class="flex justify-center mt-10">
            <button onclick="loadMore()" class="bg-zinc-900 border border-white/10 text-white font-black text-xs uppercase px-12 py-4 rounded-full hover:bg-red-600 transition-all">Muat Lebih Banyak</button>
        </div>
    </main>

    <div id="movieModal" class="modal">
        <div class="modal-content shadow-2xl">
            <button onclick="closeModal()" class="fixed top-5 right-5 bg-black/80 text-white w-10 h-10 rounded-full z-[3000] flex items-center justify-center">✕</button>
            
            <div class="flex flex-col lg:flex-row">
                <div class="lg:w-2/3 p-5 lg:p-10 border-r border-white/5">
                    <h2 id="mTitle" class="text-2xl lg:text-4xl font-black italic uppercase mb-6 text-white leading-tight"></h2>
                    
                    <div class="aspect-video bg-black rounded-2xl overflow-hidden mb-8 border border-white/10 shadow-[0_0_50px_rgba(0,0,0,1)]">
                        <iframe id="mainPlayer" class="w-full h-full" allowfullscreen allow="autoplay"></iframe>
                    </div>

                    <div class="space-y-6">
                        <div>
                            <p class="text-[10px] font-black text-red-600 uppercase mb-2 tracking-widest">Alur Cerita</p>
                            <p id="mDesc" class="text-sm text-zinc-400 leading-relaxed italic"></p>
                        </div>
                        <div>
                            <p class="text-[10px] font-black text-red-600 uppercase mb-4 tracking-widest">Pemeran Film</p>
                            <div id="mCast" class="cast-slider scrollbar-hide"></div>
                        </div>
                    </div>
                </div>

                <div class="lg:w-1/3 p-5 lg:p-10 bg-[#050505]">
                    <p class="text-[10px] font-black text-zinc-500 uppercase mb-6 tracking-widest">Opsi Streaming</p>
                    <div id="streamLinks" class="flex flex-col"></div>
                    
                    <div class="my-8 border-t border-white/5"></div>
                    
                    <p class="text-[10px] font-black text-zinc-500 uppercase mb-6 tracking-widest">Opsi Download</p>
                    <div id="downloadLinks" class="flex flex-col"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = 'bfa7df5310c9974f62f26c6789a8c00d';
        const IMG_BASE = 'https://image.tmdb.org/t/p/w500';
        let currentPage = 1;

        window.onscroll = () => {
            const btn = document.getElementById("backToTop");
            btn.style.display = (window.scrollY > 500) ? "flex" : "none";
        };

        function scrollToTop() { window.scrollTo({top: 0, behavior: 'smooth'}); }

        function initApp() { loadMovies(); }

        async function loadMovies(append = false) {
            const type = document.getElementById('typeFilter').value;
            const genre = document.getElementById('genreFilter').value;
            const year = document.getElementById('yearFilter').value;
            
            // FILTRASI KHUSUS INDONESIA (ID)
            let url = `https://api.themoviedb.org/3/discover/${type}?api_key=${API_KEY}&with_origin_country=ID&language=id-ID&page=${currentPage}&sort_by=popularity.desc`;
            if (genre) url += `&with_genres=${genre}`;
            if (year) url += `&primary_release_year=${year}&first_air_date_year=${year}`;

            const res = await fetch(url);
            const data = await res.json();
            const grid = document.getElementById('movieGrid');
            if (!append) grid.innerHTML = '';
            
            data.results.forEach(m => {
                const poster = m.poster_path ? IMG_BASE + m.poster_path : 'https://via.placeholder.com/500x750?text=No+Poster';
                const div = document.createElement('div');
                div.className = 'movie-card';
                div.onclick = () => showDetail(m.id, type);
                div.innerHTML = `<img src="${poster}"><div class="p-3"><p class="text-[9px] font-black uppercase truncate">${m.title || m.name}</p></div>`;
                grid.appendChild(div);
            });
        }

        async function showDetail(id, type) {
            const [resID, resEN] = await Promise.all([
                fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=${API_KEY}&append_to_response=videos,credits&language=id-ID`),
                fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=${API_KEY}&language=en-US`)
            ]);
            const m = await resID.json();
            const mEN = await resEN.json();

            document.getElementById('mTitle').innerText = m.title || m.name;
            document.getElementById('mDesc').innerText = m.overview || mEN.overview || "Sinopsis untuk film ini belum tersedia.";

            const streams = [
                { n: 'Server Utama VIP', u: `https://vidsrc.xyz/embed/${type}/${id}` },
                { n: 'Server Cadangan 1', u: `https://vidsrc.to/embed/${type}/${id}` },
                { n: 'Server Cadangan 2', u: `https://vidrock.net/embed/${type}/${id}` }
            ];
            
            const sCont = document.getElementById('streamLinks');
            sCont.innerHTML = '';
            streams.forEach(s => sCont.innerHTML += `<button onclick="changePlayer('${s.u}')" class="btn-premium"><i class="fa-solid fa-play-circle text-lg"></i> ${s.n}</button>`);
            
            document.getElementById('downloadLinks').innerHTML = `<a href="https://dl.vidsrc.vip/${type}/${id}" target="_blank" class="btn-premium btn-download"><i class="fa-solid fa-cloud-arrow-down text-lg"></i> Download High Quality</a>`;

            const castCont = document.getElementById('mCast');
            castCont.innerHTML = m.credits.cast.slice(0, 15).map(c => `
                <div class="cast-item" onclick="searchByActor('${c.name}')">
                    <img src="${c.profile_path ? 'https://image.tmdb.org/t/p/w185'+c.profile_path : 'https://via.placeholder.com/100x100?text=?'}">
                    <p class="text-[8px] font-bold mt-2 text-zinc-500">${c.name}</p>
                </div>
            `).join('');

            // FIX TRAILER
            const yt = m.videos.results.find(v => v.site === 'YouTube' && (v.type === 'Trailer' || v.type === 'Teaser')) || m.videos.results[0];
            document.getElementById('mainPlayer').src = yt ? `https://www.youtube.com/embed/${yt.key}?autoplay=1&rel=0` : '';

            document.getElementById('movieModal').style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        async function searchMulti() {
            const q = document.getElementById('searchInput').value; 
            if(!q) return;
            // Pencarian juga difilter agar lebih akurat
            const res = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${API_KEY}&query=${encodeURIComponent(q)}&language=id-ID`);
            const data = await res.json();
            const grid = document.getElementById('movieGrid'); grid.innerHTML = '';
            data.results.forEach(m => {
                if(!m.poster_path) return;
                const div = document.createElement('div'); div.className = 'movie-card';
                div.onclick = () => showDetail(m.id, m.media_type || 'movie');
                div.innerHTML = `<img src="${IMG_BASE + m.poster_path}"><div class="p-3"><p class="text-[9px] font-black uppercase truncate">${m.title || m.name}</p></div>`;
                grid.appendChild(div);
            });
            document.getElementById('loadMoreContainer').style.display = 'none';
        }

        function searchByActor(name) { closeModal(); document.getElementById('searchInput').value = name; searchMulti(); }
        function changePlayer(url) { document.getElementById('mainPlayer').src = url + "?autoplay=1"; }
        function loadMore() { currentPage++; loadMovies(true); }
        function resetAndLoad() { currentPage = 1; loadMovies(); }
        function closeModal() { document.getElementById('movieModal').style.display = 'none'; document.getElementById('mainPlayer').src = ''; document.body.style.overflow = 'auto'; }
    </script>
</body>
</html>
