addEntry({
  id:"sirah", menu:8, material:"sirah-nabi", type:"article",
  title:"Sirah Nabi Muhammad ﷺ", summary:"Perjalanan hidup Rasulullah ﷺ — teladan dalam seluruh aspek kehidupan.",
  body:[{h:"Pengertian", p:["Sirah adalah perjalanan hidup Nabi Muhammad ﷺ: kelahiran, masa kecil, kerasulan, dakwah, hijrah, hingga wafat. Mempelajarinya menumbuhkan kecintaan dan teladan (QS. Al-Ahzab 33:21)."]},
  {h:"Cakupan", p:["Kelahiran, masa kecil & muda, pernikahan, awal wahyu, dakwah Makkah, hijrah, peristiwa penting, Fathu Makkah, Haji Wada', dan wafat — masing-masing sebagai entri di bawah materi ini."]}],
  sources:["quran","sirah"], related:["kelahiran-nabi","awal-wahyu","hijrah","fathu-makkah","haji-wada","nabi-muhammad"], tags:["sirah","sejarah"]
});
addEntry({id:"kelahiran-nabi", menu:8, material:"sirah-nabi", type:"article", title:"Kelahiran Nabi Muhammad ﷺ", summary:"Lahir di Makkah pada Tahun Gajah (±570 M), yatim sejak kecil.",
  body:[{h:"Ringkasan", list:["Lahir di Makkah, Tahun Gajah (± 570 M; tanggal pastinya diperselisihkan — pendapat masyhur 12 Rabiul Awal, ada pendapat lain).","Ayah: Abdullah bin Abdul Muththalib (wafat sebelum beliau lahir/saat ibunya hamil).","Ibu: Aminah binti Wahb (wafat saat beliau berusia ±6 tahun).","Disusui Halimah as-Sa'diyah; diasuh kakek Abdul Muththalib, lalu paman Abu Thalib."]}],
  sources:["sirah"], related:["sirah","masa-kecil-nabi","nabi-muhammad"], tags:["sirah","nabi"]});
addEntry({id:"masa-kecil-nabi", menu:8, material:"sirah-nabi", type:"article", title:"Masa Kecil & Muda", summary:"Tumbuh sebagai anak jujur dan terpercaya; dikenal Al-Amin.",
  body:[{h:"Ringkasan", list:["Masa kecil di Bani Sa'd (Badui) dan Makkah.","Menggembala kambing (HR. Bukhari no. 3402).","Membantu paman berdagang; dikenal jujur (Al-Amin) dan amanah.","Mengikuti perjanjian Hilful Fudhul — membela yang dizalimi."]}],
  sources:["bukhari","sirah"], related:["sirah","pernikahan-nabi"], tags:["sirah","nabi"]});
addEntry({id:"pernikahan-nabi", menu:8, material:"sirah-nabi", type:"article", title:"Pernikahan dengan Khadijah", summary:"Menikah dengan Khadijah binti Khuwailid pada usia 25 tahun.",
  body:[{h:"Ringkasan", p:["Khadijah adalah wanita pertama yang dinikahi Nabi ﷺ, pendukung pertama dakwah, dan ibu bagi anak-anak beliau (selain Ibrahim). Beliau tidak menikah lagi selama Khadijah hidup."]}],
  sources:["sirah"], related:["sirah","khadijah","awal-wahyu"], tags:["sirah","keluarga"]});
addEntry({id:"awal-wahyu", menu:8, material:"sirah-nabi", type:"article", title:"Awal Wahyu", summary:"Wahyu pertama turun di Gua Hira: QS. Al-'Alaq 96:1-5.",
  body:[{h:"Ringkasan", list:["Usia ±40 tahun, beliau menyendiri di Gua Hira.","Malaikat Jibril datang dan menyampaikan \"Iqra'...\" (QS. Al-'Alaq 96:1-5).","Khadijah menenangkan dan membawa beliau kepada Waraqah bin Naufal.","Setelah fatrah (masa terhenti wahyu), wahyu turun kembali dan dakwah dimulai."]}],
  sources:["bukhari","sirah"], related:["sirah","dakwah-makkah","khadijah"], tags:["sirah","wahyu"]});
addEntry({id:"dakwah-makkah", menu:8, material:"sirah-nabi", type:"article", title:"Dakwah Periode Makkah", summary:"Dakwah sembunyi-sembunyi lalu terang-terangan; penuh ujian dan kesabaran.",
  body:[{h:"Ringkasan", list:["Tiga tahun pertama dakwah sembunyi-sembunyi.","Lalu dakwah terang-terangan: \"Maka sampaikanlah apa yang diperintahkan kepadamu...\" (QS. Al-Hijr 15:94).","Boikot, penyiksaan, dan hijrah ke Habasyah bagi sebagian sahabat.","Tahun duka: wafat Abu Thalib dan Khadijah.","Isra' Mi'raj terjadi pada periode ini."]}],
  sources:["quran","sirah"], related:["sirah","awal-wahyu","hijrah"], tags:["sirah","dakwah"]});
addEntry({id:"hijrah", menu:8, material:"sirah-nabi", type:"article", title:"Hijrah ke Madinah", summary:"Perpindahan ke Yatsrib (Madinah) pada tahun 622 M — awal kalender Hijriah.",
  body:[{h:"Ringkasan", list:["Bai'at Aqabah dan undangan penduduk Yatsrib.","Nabi ﷺ hijrah bersama Abu Bakar; bersembunyi di Gua Tsur (QS. At-Taubah 9:40).","Tiba di Quba, membangun masjid; lalu mempersaudarakan Muhajirin dan Anshar.","Peristiwa ini menjadi titik awal penanggalan Hijriah pada masa Umar."]}],
  sources:["quran","sirah"], related:["sirah","abu-bakar","islam-nusantara"], tags:["sirah","hijrah"]});
addEntry({id:"fathu-makkah", menu:8, material:"sirah-nabi", type:"article", title:"Fathu Makkah", summary:"Pembebasan Makkah pada 20 Ramadan 8 H tanpa pertumpahan darah besar.",
  body:[{h:"Ringkasan", list:["Setelah perjanjian Hudaibiyah dilanggar, kaum Muslimin memasuki Makkah.","Rasulullah ﷺ memaafkan penduduk Makkah: \"Pergilah, kalian bebas.\"","Penghancuran berhala di sekitar Ka'bah dan penetapan Makkah sebagai kota suci."]}],
  sources:["sirah"], related:["sirah","haji-wada"], tags:["sirah","makkah"]});
addEntry({id:"haji-wada", menu:8, material:"sirah-nabi", type:"article", title:"Haji Wada'", summary:"Haji terakhir Rasulullah ﷺ pada 10 H — khutbah yang sarat wasiat.",
  body:[{h:"Ringkasan", list:["Beliau berhaji pada 10 H dan berkhutbah di Arafah (khutbah wada').","Wasiat: menjaga darah dan harta, hak wanita, dan berpegang pada Al-Qur'an dan sunnah.","Turun ayat penyempurnaan agama (QS. Al-Ma'idah 5:3)."]}],
  sources:["bukhari","muslim"], related:["sirah","wafat-nabi","haji"], tags:["sirah","haji"]});
addEntry({id:"wafat-nabi", menu:8, material:"sirah-nabi", type:"article", title:"Wafat Rasulullah ﷺ", summary:"Wafat di Madinah pada 12 Rabiul Awal 11 H (± 8 Juni 632 M).",
  body:[{h:"Ringkasan", list:["Setelah sakit beberapa hari, Rasulullah ﷺ wafat di rumah Aisyah.","Beliau dimakamkan di kamar tersebut, kini di dalam Masjid Nabawi.","Abu Bakar menenangkan umat: \"Barang siapa menyembah Muhammad, maka Muhammad telah wafat; barang siapa menyembah Allah, maka Allah Maha Hidup tidak mati.\" (HR. Bukhari no. 1241)."]}],
  sources:["bukhari","sirah"], related:["sirah","abu-bakar","haji-wada"], tags:["sirah","nabi"]});
addEntry({id:"khulafaur-rasyidin", menu:8, material:"sahabat", type:"article", title:"Khulafaur Rasyidin", summary:"Empat khalifah petunjuk: Abu Bakar, Umar, Utsman, Ali — masa 11–40 H.",
  body:[{h:"Ringkasan", list:["Abu Bakar (11–13 H): memerangi kaum murtad, mengumpulkan Al-Qur'an.","Umar (13–23 H): perluasan wilayah, penetapan kalender Hijriah, pembangunan administrasi.","Utsman (23–35 H): penyeragaman mushaf, perluasan Masjid Nabawi.","Ali (35–40 H): konsolidasi internal, memindahkan pusat pemerintahan ke Kufah."]}],
  sources:["sirah"], related:["abu-bakar","umar","utsman","ali","sirah"], tags:["sejarah","khulafaur rasyidin"]});
addEntry({id:"sejarah-islam", menu:8, material:"sejarah-islam", type:"article", title:"Sejarah Islam", summary:"Perkembangan Islam dari masa khulafa hingga era modern di berbagai wilayah.",
  body:[{h:"Cakupan", list:["Dinasti Umayyah dan Abbasiyah: perluasan wilayah, pusat ilmu (Baghdad, Damaskus, Kordoba).","Kerajaan-kerajaan Islam di berbagai kawasan (Andalusia, Persia, Turki Utsmani, Asia Tenggara).","Islam Nusantara: masuk lewat jalur dagang, dakwah damai, dan akulturasi.","Islam modern: kebangkitan, pembaruan, dan tantangan kontemporer."]}],
  sources:["app"], related:["islam-nusantara","khulafaur-rasyidin","peradaban"], tags:["sejarah","peradaban"]});
addEntry({id:"islam-nusantara", menu:8, material:"sejarah-islam", type:"article", title:"Islam Nusantara", summary:"Masuknya Islam ke Nusantara dan perkembangannya.",
  body:[{h:"Ringkasan", list:["Bukti awal: Kerajaan Samudera Pasai (abad ke-13 M), makam dan naskah.","Masuk melalui jalur perdagangan, dakwah para wali (Walisongo), dan akulturasi budaya.","Penyebaran damai tanpa penaklukan militer besar; munculnya kerajaan-kerajaan Islam (Demak, Aceh, Banten, Gowa, Mataram Islam).","Ulama Nusantara berperan dalam pendidikan pesantren dan karya tulis."]}],
  sources:["app"], related:["sejarah-islam","nawawi-banten","hamka"], tags:["sejarah","nusantara"]});
addEntry({id:"peristiwa-sejarah", menu:8, material:"peristiwa", type:"article", title:"Peristiwa Sejarah", summary:"Setiap peristiwa sejarah adalah entri individual dengan tanggal, lokasi, tokoh, dan sumber.",
  body:[{h:"Catatan", p:["Database peristiwa dikaitkan dengan Kalender Hijriah: tanggal Hijriah → peristiwa → entri lengkap di sini. Kalender tidak membuat artikel sejarah duplikat."]}],
  sources:["app"], related:["sejarah-islam"], tags:["sejarah","peristiwa"]});
addEntry({id:"ziarah", menu:8, material:"ziarah", type:"feature", title:"Eksplorasi Ziarah", summary:"Ziarah bukan menu utama, melainkan fitur: tempat ziarah, adab, doa, dan sejarah — terhubung dengan Sirah, Tokoh, dan Kalender.",
  body:[{h:"Cakupan", list:["Pengertian dan tujuan ziarah.","Ziarah kubur: adab, tata cara, dan doa.","Tempat ziarah: masjid bersejarah, makam tokoh, dan situs sejarah Islam.","Jika data lokasi tersedia: alamat, koordinat, dan tautan peta.","Perbedaan pendapat yang relevan ditampilkan dengan catatan."]}],
  sources:["app"], related:["ziarah-kubur","adab-ziarah","doa-ziarah-kubur","masjidil-haram"], tags:["ziarah","fitur"]});
addEntry({id:"ziarah-kubur", menu:8, material:"ziarah", type:"article", title:"Ziarah Kubur", summary:"Mengunjungi kubur untuk mendoakan mayit dan mengingat kematian.",
  body:[{h:"Ketentuan", list:["Disunnahkan — Rasulullah ﷺ bersabda: \"Dahulu aku melarang kalian berziarah kubur, maka (sekarang) berziarahlah.\" (HR. Muslim no. 977).","Mengucapkan salam kepada penghuni kubur dan mendoakan mereka.","Dilarang: meminta kepada mayit, thawaf kubur, dan perbuatan syirik lainnya.","Perempuan: boleh ziarah menurut sebagian ulama dengan adab; sebagian lain memakruhkan — tampilkan transparan."]}],
  sources:["muslim","fiqihsunnah"], related:["ziarah","adab-ziarah","doa-ziarah-kubur"], tags:["ziarah","kubur"]});
addEntry({id:"adab-ziarah", menu:8, material:"ziarah", type:"article", title:"Adab Ziarah", summary:"Tata krama saat ziarah kubur dan tempat bersejarah.",
  body:[{h:"Adab", list:["Niat mengingat kematian dan mendoakan.","Mengucap salam dan berdoa dengan khusyuk.","Tidak duduk/duduk-duduk di atas kubur (HR. Muslim no. 972).","Tidak meratap, berteriak, atau meminta kepada mayit.","Menjaga kesopanan di masjid dan situs bersejarah."]}],
  sources:["muslim"], related:["ziarah-kubur","ziarah"], tags:["ziarah","adab"]});
addEntry({id:"doa-ziarah-kubur", menu:8, material:"ziarah", type:"bacaan", title:"Doa Ziarah Kubur",
  arabic:{text:"السَّلَامُ عَلَيْكُمْ أَهْلَ الدِّيَارِ مِنَ الْمُؤْمِنِينَ وَالْمُسْلِمِينَ، وَإِنَّا إِنْ شَاءَ اللهُ بِكُمْ لَلَاحِقُونَ",translit:"Assalamu 'alaikum ahlad-diyari minal-mu'minina wal-muslimin, wa inna insya Allahu bikum lalahiqun",arti:"Semoga keselamatan atas kalian wahai penghuni kubur dari kalangan mukminin dan muslimin. Sungguh kami, insya Allah, akan menyusul kalian.",audio:"",audio_src:"",source:"HR. Muslim no. 975"},
  body:[{h:"Keterangan", p:["Diucapkan saat memasuki pekuburan; lalu mendoakan mayit sesuai yang diketahui kebaikannya."]}],
  sources:["muslim"], related:["ziarah-kubur","adab-ziarah"], tags:["ziarah","doa"]});

  {id:"khadijah", menu:9, mat:"tokoh-perempuan", name:"Khadijah binti Khuwailid", alt:"Ummul Mu'minin", birth:"±555 M", death:"±3 tahun sebelum hijrah / 619 M", loc:"Makkah", kontribusi:"Istri pertama Nabi ﷺ; wanita pertama masuk Islam; pendukung utama dakwah awal.", bio:"Wanita Quraisy yang terhormat dan sukses berdagang. Menikah dengan Nabi ﷺ pada usia 40 tahun; menenangkan beliau saat wahyu pertama turun. Wafat pada Tahun Duka."},
  {id:"aisyah", menu:9, mat:"tokoh-perempuan", name:"Aisyah binti Abu Bakar", alt:"Ummul Mu'minin, ash-Shiddiqah", birth:"±614 M", death:"58 H / 678 M", loc:"Makkah → Madinah", kontribusi:"Istri Nabi ﷺ; perawi hadis terbanyak di kalangan istri; sumber ilmu fikih dan hadis.", bio:"Putri Abu Bakar yang dinikahi Nabi ﷺ di Madinah. Meriwayatkan lebih dari 2.000 hadis dan menjadi rujukan para sahabat dalam banyak hukum."},
  {id:"imam-syafii", menu:9, mat:"ulama", name:"Imam asy-Syafi'i", alt:"Muhammad bin Idris", birth:"150 H", death:"204 H / 820 M", loc:"Gaza/Asqalan → Mesir", kontribusi:"Pendiri mazhab Syafi'i; perumus ushul fiqih lewat Ar-Risalah; Imam al-Mathlab.", bio:"Imam besar yang menguasai fikih Madinah (Malik) dan Irak (Hanafi), lalu merumuskan mazhabnya sendiri. Karya monumentalnya Ar-Risalah menjadi kitab pertama dalam disiplin ushul fiqih. Wafat di Mesir."},
  {id:"imam-bukhari", menu:9, mat:"ulama", name:"Imam al-Bukhari", alt:"Muhammad bin Ismail", birth:"194 H", death:"256 H / 870 M", loc:"Bukhara → Samarkand", kontribusi:"Penyusun Shahih Bukhari — kitab hadis paling sahih menurut jumhur.", bio:"Menghafal ratusan ribu hadis dan menyeleksi ±7.000 hadis sahih (dengan pengulangan) dalam Al-Jami' ash-Shahih. Dikenal kehati-hatian luar biasa dalam kriteria kesahihan."},
  {id:"imam-muslim", menu:9, mat:"ulama", name:"Imam Muslim", alt:"Muslim bin al-Hajjaj", birth:"206 H", death:"261 H / 875 M", loc:"Naisabur", kontribusi:"Penyusun Shahih Muslim — kitab hadis kedua paling sahih.", bio:"Murid Imam Bukhari yang menyusun Al-Jami' ash-Shahih dengan metode penyusunan tematik (penggabungan jalur periwayatan) yang diakui para ulama."},
  {id:"ibnu-sina", menu:9, mat:"ilmuwan", name:"Ibnu Sina", alt:"Avicenna", birth:"370 H / ±980 M", death:"428 H / 1037 M", loc:"Bukhara → Hamadan", kontribusi:"Dokter dan filsuf; penulis Al-Qanun fi ath-Thibb yang menjadi rujukan kedokteran dunia berabad-abad.", bio:"Jenius serba bisa: kedokteran, filsafat, logika, dan sains. Karyanya diterjemahkan ke bahasa Latin dan dipakai di universitas Eropa hingga era modern."},
  {id:"al-khwarizmi", menu:9, mat:"ilmuwan", name:"Al-Khwarizmi", alt:"Algoritmi", birth:"±780 M", death:"±850 M", loc:"Khwarizm → Baghdad", kontribusi:"Matematikawan; bapak aljabar (Kitab al-Jabr wa al-Muqabalah); pengembang angka nol dan algoritma.", bio:"Ilmuwan di Bayt al-Hikmah Baghdad. Kata \"aljabar\" dan \"algoritma\" berasal dari namanya/karyanya; karyanya menjembatani matematika India-Yunani ke dunia."},
  {id:"ibnu-khaldun", menu:9, mat:"ilmuwan", name:"Ibnu Khaldun", alt:"Abdurrahman bin Muhammad", birth:"732 H / 1332 M", death:"808 H / 1406 M", loc:"Tunis → Kairo", kontribusi:"Sejarawan dan sosiolog; penulis Muqaddimah — fondasi sosiologi dan filsafat sejarah.", bio:"Karyanya Muqaddimah membahas hukum peradaban, ekonomi, dan kemasyarakatan. Dianggap salah satu pemikir terbesar dalam sejarah ilmu sosial."},
  {id:"nawawi-banten", menu:9, mat:"nusantara", name:"Syekh Nawawi al-Bantani", alt:"Muhammad Nawawi bin Umar", birth:"1230 H / ±1813 M", death:"1314 H / 1897 M", loc:"Banten → Makkah", kontribusi:"Ulama Nusantara bertaraf internasional; penulis banyak kitab (Tafsir al-Munir, Marah Labid, dan lainnya).", bio:"Imam masjidil haram yang menjadi rujukan ulama dunia. Karya-karyanya dipelajari di pesantren Nusantara dan Timur Tengah hingga kini."},
  {id:"hamka", menu:9, mat:"nusantara", name:"Buya Hamka", alt:"Haji Abdul Malik Karim Amrullah", birth:"1908 M", death:"1981 M", loc:"Maninjau, Sumatera Barat", kontribusi:"Ulama, sastrawan, dan pahlawan nasional Indonesia; penulis Tafsir Al-Azhar dan banyak karya.", bio:"Tokoh Muhammadiyah yang produktif menulis: tafsir, sejarah, novel (Tenggelamnya Kapal Van Der Wijck), dan motivasi keislaman. Ditetapkan sebagai Pahlawan Nasional 2011."}
];

addEntry({id:"pendidikan-islam", menu:11, material:"pendidikan-islam", type:"article", title:"Pendidikan Islam", summary:"Pendidikan yang menumbuhkan iman, ilmu, dan akhlak.",
  body:[{h:"Cakupan", list:["Adab menuntut ilmu, metode belajar, hafalan, membaca, menulis.","Pendidikan anak: peran orang tua dan guru.","Metode mengajar yang efektif."]}],
  sources:["quran","muslim"], related:["adab-menuntut-ilmu","metode-belajar","pendidikan-anak","peran-guru"], tags:["pendidikan","dakwah"]});
addEntry({id:"adab-menuntut-ilmu", menu:11, material:"pendidikan-islam", type:"article", title:"Adab Menuntut Ilmu", summary:"Syarat keberkahan ilmu: niat ikhlas, menghormati guru, dan bersungguh-sungguh.",
  body:[{h:"Adab", list:["Niat karena Allah — \"Barang siapa menuntut ilmu untuk... selain Allah, maka tempatnya neraka\" (HR. Tirmidzi no. 2657, hasan).","Menghormati guru dan teman.","Sabar dan istiqamah; tidak malu bertanya.","Mengamalkan dan mengajarkan ilmu.","Menjaga waktu dan kesehatan."]}],
  sources:["tirmidzi","muslim"], related:["pendidikan-islam","adab-belajar"], tags:["pendidikan","adab"]});
addEntry({id:"metode-belajar", menu:11, material:"pendidikan-islam", type:"article", title:"Metode Belajar", summary:"Cara belajar efektif: bertahap, berulang, dan praktik.",
  body:[{h:"Metode", list:["Bertahap (tadarruj) — dari mudah ke sulit.","Pengulangan (tikrar) untuk hafalan.","Memahami sebelum menghafal.","Praktik langsung dan mengajarkan kepada orang lain.","Evaluasi berkala."]}],
  sources:["app"], related:["pendidikan-islam","hafalan"], tags:["pendidikan","belajar"]});
addEntry({id:"hafalan", menu:11, material:"pendidikan-islam", type:"article", title:"Hafalan (Tahfizh)", summary:"Menghafal dengan metode pengulangan dan setoran kepada guru.",
  body:[{h:"Tips", list:["Hafal sedikit tapi mantap (mis. setengah halaman).","Ulangi bacaan berkali-kali dengan tajwid benar.","Setor kepada guru (talaqqi) secara rutin.","Muraja'ah (mengulang hafalan lama) terjadwal."]}],
  sources:["app"], related:["pendidikan-islam","juz-amma"], tags:["pendidikan","hafalan"]});
addEntry({id:"pendidikan-anak", menu:11, material:"pendidikan-islam", type:"article", title:"Pendidikan Anak", summary:"Tanggung jawab orang tua: iman, ibadah, akhlak, dan ilmu.",
  body:[{h:"Prinsip", list:["Mengajarkan tauhid sejak dini (sebagaimana Luqman — QS. Luqman 31:13).","Menanamkan shalat sejak usia 7 tahun (HR. Abu Dawud no. 495).","Menjadi teladan; mendidik dengan kasih sayang.","Memperhatikan pergaulan dan media anak."]}],
  sources:["quran","abudawud"], related:["pendidikan-islam","adab-orangtua"], tags:["pendidikan","anak"]});
addEntry({id:"peran-guru", menu:11, material:"pendidikan-islam", type:"article", title:"Peran Guru", summary:"Guru sebagai pewaris nabi — menyampaikan ilmu dengan amanah.",
  body:[{h:"Peran", list:["Mengajar dengan ikhlas dan teladan.","Memahami perbedaan kemampuan murid.","Menjaga amanah ilmu: tidak menahan dan tidak menyimpang.","Mendoakan dan menasihati murid."]}],
  sources:["quran"], related:["pendidikan-islam"], tags:["pendidikan","guru"]});
addEntry({id:"dakwah", menu:11, material:"dakwah", type:"article", title:"Dakwah", summary:"Mengajak kepada kebaikan dengan hikmah dan pelajaran yang baik.",
  body:[{h:"Dalil", p:["\"Serulah (manusia) kepada jalan Tuhanmu dengan hikmah dan pengajaran yang baik...\" (QS. An-Nahl 16:125). Dakwah adalah kewajiban sesuai kemampuan — \"sampaikan dariku walau satu ayat\" (HR. Bukhari no. 3461)."]}],
  sources:["quran","bukhari"], related:["metode-dakwah","etika-dakwah","dakwah-digital"], tags:["dakwah","pendidikan"]});
addEntry({id:"metode-dakwah", menu:11, material:"dakwah", type:"article", title:"Metode Dakwah", summary:"Hikmah, mau'izhah hasanah, dan jidal yang baik.",
  body:[{h:"Metode", list:["Bil hikmah: bijak sesuai kondisi mad'u.","Mau'izhah hasanah: nasihat yang menyentuh.","Jidal ahsan: debat dengan cara terbaik.","Teladan amal (dakwah bil hal)."]}],
  sources:["quran"], related:["dakwah"], tags:["dakwah","metode"]});
addEntry({id:"etika-dakwah", menu:11, material:"dakwah", type:"article", title:"Etika Dakwah", summary:"Lembut, tidak memaksa, dan tidak menghakimi.",
  body:[{h:"Etika", list:["Mengikuti akhlak Nabi ﷺ: lembut dan sabar.","Tidak mencaci sesembahan kaum lain (QS. Al-An'am 6:108).","Memulai dari yang penting; bertahap.","Tidak mudah mengkafirkan atau menghakimi niat orang."]}],
  sources:["quran"], related:["dakwah"], tags:["dakwah","etika"]});
addEntry({id:"dakwah-digital", menu:11, material:"dakwah", type:"article", title:"Dakwah Digital", summary:"Menyampaikan kebaikan lewat media digital dengan tabayyun dan adab.",
  body:[{h:"Prinsip", list:["Memverifikasi informasi sebelum menyebar (QS. Al-Hujurat 49:6).","Menyampaikan dengan bahasa yang baik dan santun.","Menjaga konten dari ujaran kebencian dan hoaks.","Konsisten dan jujur; tidak memanfaatkan agama untuk kepentingan sempit."]}],
  sources:["quran"], related:["dakwah","etika-media-sosial"], tags:["dakwah","digital"]});

addEntry({id:"harakat", menu:12, material:"bahasa-arab-dasar", type:"article", title:"Harakat", summary:"Tanda baca Arab: fathah, kasrah, dhammah, sukun, tanwin, tasydid.",

addEntry({id:"kosakata", menu:12, material:"bahasa-arab-dasar", type:"article", title:"Kosakata & Angka", summary:"Kosakata dasar sehari-hari dan angka Arab.",

addEntry({id:"isim", menu:12, material:"nahwu", type:"article", title:"Isim, Fi'il & Huruf", summary:"Tiga jenis kata dalam bahasa Arab.",
  body:[{h:"Penjelasan", list:["Isim: kata benda/sifat (كِتَابٌ, رَجُلٌ, كَبِيرٌ).","Fi'il: kata kerja (كَتَبَ = telah menulis, يَكْتُبُ = sedang menulis).","Huruf: partikel penghubung (فِي = di, مِنْ = dari, عَلَى = atas)."]}],

  sources:["app"], related:["nahwu"], tags:["bahasa arab","nahwu"]});
addEntry({id:"sharaf", menu:12, material:"sharaf", type:"article", title:"Sharaf", summary:"Morfologi Arab: wazan, tashrif, dan perubahan bentuk kata.",

  sources:["app"], related:["bahasa-arab","nahwu"], tags:["bahasa arab","sharaf"]});
addEntry({id:"balaghah", menu:12, material:"balaghah", type:"article", title:"Balaghah", summary:"Retorika Arab: bayan, ma'ani, dan badi'.",

addEntry({id:"kamus-islam", menu:12, material:"kamus-islam", type:"article", title:"Kamus Islam", summary:"Istilah-istilah penting dalam khazanah Islam — dari Aqidah hingga Ibadah.",

<script>
/* ============================================================
   SILMIKAFFAH — Mesin Perhitungan (calc.js)
   Waktu shalat (astronomis, tidak hardcode) · Kalender Hijriah
   (Intl islamic-umalqura) · Kalkulator Zakat (transparan)
   ============================================================ */
const CALC = window.SILMIKAFFAH.CALC = {};

/* ---------- WAKTU SHALAT ---------- */
CALC.PRAY_METHODS = {
  KEMENAG: {name:"Kemenag RI (Fajar 20°, Isya 18°)", fajr:20, isha:18, fixed:0},
  MWL:     {name:"Muslim World League (18°, 17°)", fajr:18, isha:17, fixed:0},
  ISNA:    {name:"ISNA (15°, 15°)", fajr:15, isha:15, fixed:0},
  EGYPT:   {name:"Mesir (19.5°, 17.5°)", fajr:19.5, isha:17.5, fixed:0},
  KARACHI: {name:"Karachi (18°, 18°)", fajr:18, isha:18, fixed:0},
  MAKKAH:  {name:"Umm al-Qura Makkah (18.5°, Isya +90 mnt)", fajr:18.5, isha:0, fixed:90}
};
CALC.ASR_METHODS = { JUMHUR:{name:"Jumhur (bayangan 1× tinggi)", factor:1}, HANAFI:{name:"Hanafi (bayangan 2×)", factor:2} };

function rad(d){return d*Math.PI/180;}
function deg(r){return r*180/Math.PI;}
function fixangle(a){a=a-360*Math.floor(a/360);return a<0?a+360:a;}
function fixhour(a){a=a-24*Math.floor(a/24);return a<0?a+24:a;}
function dsin(d){return Math.sin(rad(d));}
function dcos(d){return Math.cos(rad(d));}
function dtan(d){return Math.tan(rad(d));}
function datan2(y,x){return deg(Math.atan2(y,x));}
function julian(y,m,d){
  if(m<=2){y-=1;m+=12;}
  const A=Math.floor(y/100), B=2-A+Math.floor(A/4);
  return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5;
}
function sunPosition(jd){
  const D=jd-2451545.0;
  const g=fixangle(357.529+0.98560028*D);
  const q=fixangle(280.459+0.98564736*D);
  const L=fixangle(q+1.915*Math.sin(rad(g))+0.020*Math.sin(rad(2*g)));
  const e=23.439-0.00000036*D;
  const RA=datan2(dcos(e)*dsin(L),dcos(L))/15;
  const decl=deg(Math.asin(Math.sin(rad(e))*dsin(L)));
  const EqT=q/15-fixhour(RA);
  return {decl, EqT};
}
function midDay(jd, t){const e=sunPosition(jd+ t/24).EqT; return fixhour(12-e);}
function hourAngle(angle, decl, lat){
  const a=rad(angle), d=rad(decl), L=rad(lat);
  const c=(Math.sin(a)-dsin(decl)*Math.sin(L))/(dcos(decl)*dcos(L));
  return deg(Math.acos(Math.max(-1,Math.min(1,c))))/15;
}

CALC.computePrayerTimes = function(date, lat, lon, methodKey, asrKey, tzHours){
  const M = CALC.PRAY_METHODS[methodKey] || CALC.PRAY_METHODS.KEMENAG;
  const A = CALC.ASR_METHODS[asrKey] || CALC.ASR_METHODS.JUMHUR;
  const y=date.getFullYear(), m=date.getMonth()+1, d=date.getDate();
  // tzHours: offset UTC kota (default: offset perangkat, DST-aware)
  const tz = (tzHours===undefined) ? -date.getTimezoneOffset()/60 : tzHours;
  const jd = julian(y,m,d);            // ≈ JD 12:00 UT
  const {decl, EqT} = sunPosition(jd);
  const noonUT = 12 - lon/15 - EqT;    // tengah hari matahari (UT, jam)
  const H = a => hourAngle(a, decl, lat); // sudut jam (jam)
  const mk = t => {
    const tt = fixhour(t + tz);        // konversi ke jam dinding lokal
    const h = Math.floor(tt), mn = Math.floor((tt-h)*60 + 0.5);
    const hh = ((h+24)%24);
    return {min: hh*60+mn, label: String(hh).padStart(2,"0")+":"+String(mn).padStart(2,"0")};
  };
  const dLat = Math.abs(lat - decl);
  // Asar: ketinggian matahari saat bayangan = panjang benda + bayangan saat zuhur
  const asrAngle = deg(Math.atan(1/(A.factor + Math.tan(rad(dLat)))));
  const sunset = noonUT + H(-0.833);
  return {
    imsak:   mk(noonUT - H(-M.fajr) - 10/60), // kehati-hatian (konvensi Indonesia)
    subuh:   mk(noonUT - H(-M.fajr)),
    terbit:  mk(noonUT - H(-0.833)),
    zuhur:   mk(noonUT),
    asar:    mk(noonUT + H(asrAngle)),
    maghrib: mk(sunset),
    isya:    mk(M.fixed>0 ? sunset + M.fixed/60 : noonUT + H(-M.isha)),
    method: M.name, asrMethod: A.name
  };
};

CALC.nextPrayer = function(times, nowMin){
  const order = [["subuh","Subuh"],["terbit","Terbit"],["zuhur","Zuhur"],["asar","Asar"],["maghrib","Maghrib"],["isya","Isya"],["imsak","Imsak"]];
  for(let i=0;i<order.length;i++){
    if(times[order[i][0]].min > nowMin) return {key:order[i][0], name:order[i][1], min:times[order[i][0]].min};
  }
  // besok subuh
  return {key:"subuh", name:"Subuh (besok)", min:times.subuh.min + 1440};
};

/* ---------- KALENDER HIJRIAH ---------- */
const HIJRI_MONTHS = ["Muharram","Safar","Rabiul Awal","Rabiul Akhir","Jumadil Awal","Jumadil Akhir","Rajab","Sya'ban","Ramadan","Syawal","Dzulqa'dah","Dzulhijjah"];
const hFmt = new Intl.DateTimeFormat("en-u-ca-islamic-umalqura", {day:"numeric", month:"numeric", year:"numeric"});

CALC.hijriParts = function(date){
  const p = hFmt.formatToParts(date), o = {day:1, month:1, year:1446};
  p.forEach(x=>{ if(x.type==="day")o.day=+x.value; if(x.type==="month")o.month=+x.value; if(x.type==="year")o.year=+x.value; });
  return o;
};
CALC.hijriLabel = function(date){
  const p = CALC.hijriParts(date);
  return {hijri: p.day+" "+HIJRI_MONTHS[p.month-1]+" "+p.year+" H", day:p.day, month:p.month, monthName:HIJRI_MONTHS[p.month-1], year:p.year};
};
CALC.hijriStart = function(cursor){
  const d = new Date(cursor);
  let i=0;
  while(CALC.hijriParts(d).day!==1 && i<60){ d.setDate(d.getDate()-1); i++; }
  return d;
};
CALC.hijriMonth = function(cursor){
  const start = CALC.hijriStart(cursor);
  const parts = CALC.hijriParts(start);
  const cells = [];
  const today = new Date(); today.setHours(0,0,0,0);
  for(let i=0;i<31;i++){
    const g = new Date(start); g.setDate(start.getDate()+i);
    const p = CALC.hijriParts(g);
    if(p.month!==parts.month) break;
    const g0 = new Date(g); g0.setHours(0,0,0,0);
    cells.push({
      gDate: g, hDay: p.day,
      isToday: g0.getTime()===today.getTime(),
      dow: g.getDay(),
      events: DB.EVENTS.filter(e=>e.month===HIJRI_MONTHS[p.month-1] && e.day===p.day)
    });
  }
  return {monthName:HIJRI_MONTHS[parts.month-1], year:parts.year, cells, start};
};
CALC.shiftHijriMonth = function(cursor, dir){
  const start = CALC.hijriStart(cursor);
  const d = new Date(start);
  d.setDate(d.getDate() + (dir>0?35:-15));
  return d;
};

/* ---------- KALKULATOR ZAKAT ---------- */
const fmtRp = n => "Rp " + Math.round(n).toLocaleString("id-ID");
CALC.zakat = function(type, inp){
  const today = new Date().toLocaleDateString("id-ID", {day:"numeric", month:"long", year:"numeric"});
  const out = {result:null, label:"", rows:[], method:"", notes:[], source:"", date:today};
  const goldPrice = +inp.goldPrice||0, silverPrice = +inp.silverPrice||0;
  if(type==="fitrah"){
    const qty = +inp.qty||2.5, price = +inp.price||0;
    out.result = qty*price;
    out.label = "Zakat Fitrah";
    out.rows.push(["Beras total (jiwa × kg)", qty+" kg × Rp "+price.toLocaleString("id-ID")]);
    out.rows.push(["Total", fmtRp(out.result)]);
    out.method = "1 sha' (±2,5 kg) makanan pokok per orang; konvensi lain 3,5 liter. Dikeluarkan sebelum shalat Idulfitri.";
    out.source = "HR. Bukhari no. 1503, Muslim no. 984; BAZNAS";
    out.notes.push("Boleh dibayar dalam bentuk uang senilai makanan pokok menurut sebagian lembaga (BAZNAS).");
    return out;
  }
  if(type==="emas"){
    const g = +inp.grams||0;
    out.result = g>=85 ? 0.025*g*goldPrice : 0;
    out.label = "Zakat Emas";
    out.rows.push(["Kepemilikan", g+" gram"]);
    out.rows.push(["Nishab", "85 gram — "+(g>=85?"tercapai":"belum tercapai")]);
    out.rows.push(["Zakat", g>=85 ? "2,5% × "+g+"g × Rp "+goldPrice.toLocaleString("id-ID") : "—"]);
    out.rows.push(["Total", fmtRp(out.result)]);
    out.method = "2,5% dari emas ≥ 85 gram yang dimiliki selama satu tahun (haul).";
    out.source = "BAZNAS; ketentuan nishab dari hadis";
    out.notes.push("Perhiasan yang dipakai secara wajar: jumhur tidak mewajibkan zakatnya; mazhab Hanafi mewajibkan.");
    return out;
  }
  if(type==="perak"){
    const g = +inp.grams||0;
    out.result = g>=595 ? 0.025*g*silverPrice : 0;
    out.label = "Zakat Perak";
    out.rows.push(["Kepemilikan", g+" gram"]);
    out.rows.push(["Nishab", "595 gram — "+(g>=595?"tercapai":"belum tercapai")]);
    out.rows.push(["Total", fmtRp(out.result)]);
    out.method = "2,5% dari perak ≥ 595 gram dengan haul satu tahun.";
    out.source = "BAZNAS; HR. Abu Dawud no. 1573";
    return out;
  }
  if(type==="uang"){
    const bal = +inp.balance||0;
    const nisab = 85*goldPrice;
    out.result = bal>=nisab ? 0.025*bal : 0;
    out.label = "Zakat Uang & Tabungan";
    out.rows.push(["Saldo", fmtRp(bal)]);
    out.rows.push(["Nishab (85g emas)", fmtRp(nisab)+" — "+(bal>=nisab?"tercapai":"belum tercapai")]);
    out.rows.push(["Total", fmtRp(out.result)]);
    out.method = "Uang diqiyaskan pada emas: nishab senilai 85 gram emas, 2,5%, haul 1 tahun.";
    out.source = "BAZNAS";
    return out;
  }
  if(type==="mal"){
    const cash=+inp.cash||0, g=+inp.gold||0, s=+inp.silver||0, trade=+inp.trade||0, recv=+inp.receivables||0, debt=+inp.debts||0;
    const haul = inp.haul==="yes";
    const nMethod = inp.nisabMethod==="perak"?"perak":"emas";
    const assets = cash + g*goldPrice + s*silverPrice + trade + recv - debt;
    const nisab = nMethod==="emas" ? 85*goldPrice : 595*silverPrice;
    out.result = (haul && assets>=nisab) ? 0.025*assets : 0;
    out.label = "Zakat Mal (Harta)";
    out.rows.push(["Kas + emas + perak + dagangan + piutang", fmtRp(cash+g*goldPrice+s*silverPrice+trade+recv)]);
    out.rows.push(["Dikurangi utang jatuh tempo", "− "+fmtRp(debt)]);
    out.rows.push(["Harta bersih", fmtRp(assets)]);
    out.rows.push(["Nishab ("+nMethod+")", fmtRp(nisab)+" — "+(assets>=nisab?"tercapai":"belum tercapai")]);
    out.rows.push(["Haul 1 tahun", haul?"terpenuhi":"belum terpenuhi"]);
    out.rows.push(["Total", fmtRp(out.result)]);
    out.method = "2,5% dari harta bersih yang mencapai nishab (85g emas / 595g perak) dan haul 1 tahun.";
    out.source = "BAZNAS; fiqih zakat";
    out.notes.push(haul?"":"Jika haul belum satu tahun, zakat mal belum wajib (kecuali jenis yang dizakati saat panen).");
    return out;
  }
  if(type==="perdagangan"){
    const asset=+inp.asset||0, debt=+inp.debt||0;
    const haul = inp.haul==="yes";
    const net = asset-debt, nisab = 85*goldPrice;
    out.result = (haul && net>=nisab) ? 0.025*net : 0;
    out.label = "Zakat Perdagangan";
    out.rows.push(["Nilai aset dagang (barang + kas + piutang)", fmtRp(asset)]);
    out.rows.push(["Dikurangi utang", "− "+fmtRp(debt)]);
    out.rows.push(["Bersih", fmtRp(net)]);
    out.rows.push(["Nishab (85g emas)", fmtRp(nisab)+" — "+(net>=nisab?"tercapai":"belum tercapai")]);
    out.rows.push(["Total", fmtRp(out.result)]);
    out.method = "2,5% dari nilai barang dagangan (dinilai harga pasar) + kas + piutang − utang, dengan nishab 85g emas dan haul 1 tahun.";
    out.source = "BAZNAS";
    return out;
  }
  if(type==="penghasilan"){
    const inc=+inp.income||0, debtM=+inp.debtMonthly||0;
    const m = inp.method==="b"?"b":"a";
    const ricePrice=+inp.ricePrice||0;
    const net = inc-debtM;
    const nisabA = (85*goldPrice)/12;
    const nisabB = (653*ricePrice)/12;
    const nisab = m==="a"?nisabA:nisabB;
    out.result = net>=nisab ? 0.025*net : 0;
    out.label = "Zakat Penghasilan (Profesi)";
    out.rows.push(["Penghasilan bulanan", fmtRp(inc)]);
    out.rows.push(["Dikurangi utang bulanan", "− "+fmtRp(debtM)]);
    out.rows.push(["Bersih", fmtRp(net)]);
    out.rows.push(["Nishab bulanan", fmtRp(nisab)+" — "+(net>=nisab?"tercapai":"belum tercapai")]);
    out.rows.push(["Total", fmtRp(out.result)]);
    out.method = m==="a"
      ? "Metode A (umum): nishab 85 gram emas setahun dibagi 12; jika penghasilan bulanan mencapai nishab bulanan, keluarkan 2,5% tiap bulan."
      : "Metode B: nishab diqiyaskan pada 5 wasaq (±653 kg) beras setahun, dibagi 12.";
    out.source = "BAZNAS (Metode A); pendapat ulama kontemporer (Metode B)";
    out.notes.push("Ada perbedaan pendapat tentang nishab penghasilan — gunakan metode yang Anda yakini / konsultasikan amil setempat.");
    return out;
  }
  if(type==="pertanian"){
    const val=+inp.value||0, irr=inp.irrigation==="alami"?"alami":"berbayar";
    const ricePrice=+inp.ricePrice||0, nisab=653*ricePrice;
    const rate = irr==="alami"?0.10:0.05;
    out.result = val>=nisab ? rate*val : 0;
    out.label = "Zakat Pertanian";
    out.rows.push(["Nilai hasil panen", fmtRp(val)]);
    out.rows.push(["Nishab 5 wasaq (±653 kg × harga)", fmtRp(nisab)+" — "+(val>=nisab?"tercapai":"belum tercapai")]);
    out.rows.push(["Besaran", irr==="alami"?"10% (pengairan alami)":"5% (pengairan berbiaya)"]);
    out.rows.push(["Total", fmtRp(out.result)]);
    out.method = "Dizakati saat panen (tanpa haul): 10% bila pengairan alami, 5% bila berbiaya.";
    out.source = "QS. Al-An'am 6:141; HR. Bukhari no. 1484, Muslim no. 979";
    return out;
  }
  if(type==="peternakan"){
    const t=inp.livestock==="sapi"?"sapi":"kambing", c=+inp.count||0;
    out.label = "Zakat Peternakan ("+ (t==="sapi"?"Sapi":"Kambing/Domba") +")";
    if(t==="kambing"){
      out.result = c>=40 ? Math.floor((c-1)/100)+1 : 0;
      out.rows.push(["Jumlah", c+" ekor"]);
      out.rows.push(["Nishab", "40 ekor"]);
      out.rows.push(["Zakat", out.result+" ekor kambing/domba (umur 1–2 tahun)"]);
      out.method = "40–120: 1; 121–200: 2; 201–300: 3; 300+: 1 tiap 100.";
      out.source = "HR. Bukhari no. 1454";
    } else {
      let z="", due=0;
      if(c>=30){due=1; if(c<40)z="1 ekor tabi' (umur 1 tahun)";
        else if(c<60)z="1 ekor musinnah (umur 2 tahun)";
        else if(c<70)z="2 ekor tabi'";
        else if(c<80)z="1 musinnah + 1 tabi'";
        else if(c<90)z="2 ekor musinnah";
        else if(c<100)z="3 ekor tabi'";
        else if(c<110)z="1 musinnah + 2 tabi'";
        else if(c<120)z="2 musinnah + 1 tabi'";
        else if(c<130)z="3 musinnah (atau 4 tabi')";
        else {due=0; z="Tiap 30 ekor: +1 tabi'; tiap 40 ekor: +1 musinnah";}
      }
      out.result = due; out.zakatLabel = z;
      out.rows.push(["Jumlah", c+" ekor"]);
      out.rows.push(["Nishab", "30 ekor"]);
      out.rows.push(["Zakat", z]);
      out.method = "Tabel zakat sapi (sa'imah, haul 1 tahun).";
      out.source = "BAZNAS; ketentuan zakat ternak";
    }
    out.notes.push("Syarat: digembalakan (sa'imah), mencapai nishab, haul 1 tahun.");
    out.date = today;
    return out;
  }
  return out;
};

</script>
<script>
/* ============================================================
   SILMIKAFFAH — Halaman Khusus (pages.js)
   Home dashboard · Al-Qur'an · Kalender Hijriah · Kalkulator
   Zakat · Asmaul Husna · Ziarah · Detail Peristiwa
   ============================================================ */

/* ========== HOME DASHBOARD ========== */
function homeView(){
  const now = new Date();
  const hijri = CALC.hijriLabel(now);
  const masehi = now.toLocaleDateString("id-ID", {weekday:"long", day:"numeric", month:"long", year:"numeric"});
  const loc = getLoc();
  const times = CALC.computePrayerTimes(now, loc.lat, loc.lon, SETTINGS.prayerMethod, SETTINGS.asrMethod, loc.tz);
  const nowMin = now.getHours()*60 + now.getMinutes();

  let h = '<div class="page">';

  /* Tanggal Hijriah Hari Ini */
  h += '<div class="date-card">'
    + '<div class="tiny" style="font-weight:800;letter-spacing:.08em;opacity:.85">TANGGAL HARI INI</div>'
    + '<div class="date-hijri">'+esc(hijri.hijri)+'</div>'
    + '<div class="date-masehi">'+esc(masehi)+'</div>'
    + '</div>';

  /* Jadwal Shalat */
  h += '<div class="card prayer-card" style="margin-top:10px">'
    + '<div class="h3">Jadwal Shalat Hari Ini</div>'
    + '<div class="tiny muted">'+esc(loc.name)+' · '+esc(times.method)+'</div>'
    + '<div class="prayer-list">'
    + [["imsak","Imsak"],["subuh","Subuh"],["terbit","Terbit"],["zuhur","Zuhur"],["asar","Asar"],["maghrib","Maghrib"],["isya","Isya"]]
      .map(p=>'<div class="prayer-item" data-p="'+p[0]+'"><div class="pn">'+p[1]+'</div><div class="pt">'+times[p[0]].label+'</div></div>').join("")
    + '</div>'
    + '<div id="next-prayer" data-key="np"></div>'
    + '<div class="tiny muted" style="margin-top:8px">Perhitungan astronomis (bukan hardcode) — untuk keperluan resmi gunakan jadwal lembaga setempat.</div>'
    + '</div>';

  /* Quick Access */
  h += '<div class="section-title"><h2>Quick Access</h2></div>'
    + '<div class="quick-access">'
    + qa("quran","Al-Qur'an","#/quran")+qa("book","Shalat","#/entry/shalat")+qa("doa","Doa","#/menu/6")
    + qa("hadis","Hadis","#/menu/4")+qa("kalender","Kalender","#/kalender")+qa("map","Ziarah","#/ziarah")
    + '</div>';

  /* Konten Hari Ini */
  const i = dayOfYear();
  const ayatKey = DB.DAILY.ayat[i % DB.DAILY.ayat.length];
  const ayat = DBQ.AYAT[ayatKey]; const sur = DBQ.surah(ayat.s);
  const hadisE = getEntry(DB.DAILY.hadis[i % DB.DAILY.hadis.length]);
  const doaE = getEntry(DB.DAILY.doa[i % DB.DAILY.doa.length]);
  const eventsToday = DB.EVENTS.filter(e=>e.month===hijri.monthName && e.day===hijri.day);

  h += '<div class="section-title"><h2>Hari Ini</h2></div>';

  h += '<div class="card daily-card tappable" data-nav="#/quran/ayat/'+ayatKey+'">'
    + '<span class="daily-label">AYAT HARI INI</span>'
    + '<div class="daily-title">QS. '+esc(sur[1])+' · Ayat '+ayat.a+'</div>'
    + '<div class="arabic-text" style="font-size:calc(22px * var(--font-scale))" dir="rtl" lang="ar">'+esc(ayat.arab)+'</div>'
    + '<div class="muted small" style="margin-top:6px">'+esc(ayat.arti)+'</div>'
    + '<div class="arabic-meta">'+audioUI("","","")+'</div>'
    + '</div>';

  h += '<div class="card daily-card tappable" data-nav="#/entry/'+hadisE.id+'" style="margin-top:10px">'
    + '<span class="daily-label">HADIS HARI INI</span>'
    + '<div class="arabic-text" style="font-size:calc(20px * var(--font-scale))" dir="rtl" lang="ar">'+esc(hadisE.arabic.text)+'</div>'
    + '<div class="muted small" style="margin-top:6px">'+esc(hadisE.arabic.arti)+'</div>'
    + '<div class="tiny muted" style="margin-top:6px">'+esc(hadisE.rawi)+' · '+esc(hadisE.kitab)+'</div>'
    + '</div>';

  h += '<div class="card daily-card tappable" data-nav="#/entry/'+doaE.id+'" style="margin-top:10px">'
    + '<span class="daily-label">DOA HARI INI</span>'
    + '<div class="arabic-text" style="font-size:calc(20px * var(--font-scale))" dir="rtl" lang="ar">'+esc(doaE.arabic.text)+'</div>'
    + '<div class="muted small" style="margin-top:6px">'+esc(doaE.arabic.arti)+'</div>'
    + '<div class="tiny muted" style="margin-top:6px">'+esc(doaE.arabic.source)+'</div>'
    + '</div>';

  h += '<div class="card daily-card" style="margin-top:10px">'
    + '<span class="daily-label">SEJARAH HARI INI</span>';
  if(eventsToday.length){
    h += eventsToday.map(ev=>'<div class="cal-event-row"><div class="ce-date">'+ev.day+' '+ev.month+'</div><div class="ce-body" data-nav="#/event/'+ev.id+'"><div class="ce-title">'+esc(ev.title)+'</div><div class="ce-desc">'+esc(ev.desc)+'</div></div></div>').join("");
  } else {
    h += '<div class="empty-state" style="border:none;padding:18px">'+icon("sirah")+'<h4>Belum ada data peristiwa</h4><p>Tidak ada peristiwa tercatat untuk tanggal ini di database.</p></div>';
  }
  h += '</div>';

  /* 14 Menu Utama */
  h += '<div class="section-title"><h2>Menu Utama</h2></div><div class="card-grid">';
  DB.MENUS.forEach(m=>{
    const count = DB.ENTRIES.filter(e=>e.menu===m.id).length;
    h += '<div class="card menu-card tappable" data-nav="#/menu/'+m.id+'">'
      + '<div class="mc-top"><span class="menu-icon">'+icon(m.icon,20)+'</span><span class="mc-count">'+m.num+'</span></div>'
      + '<h3>'+esc(m.name)+'</h3><p>'+esc(m.short||m.desc)+'</p></div>';
  });
  h += '</div>';

  /* Recently Viewed */
  const recents = RECENT.map(getEntry).filter(Boolean).slice(0,5);
  if(recents.length){
    h += '<div class="section-title"><h2>Baru Dibaca</h2></div>';
    recents.forEach(e=> h += rowEntry(e));
  }

  h += footerNote();
  h += '</div>';

  // simpan untuk countdown
  window.SILMIKAFFAH._times = times;
  window.SILMIKAFFAH._nowMin = nowMin;
  window.SILMIKAFFAH._np = function(key){
    const t = window.SILMIKAFFAH._times; if(!t) return null;
    const np = CALC.nextPrayer(t, new Date().getHours()*60+new Date().getMinutes());
    const diff = np.min - (new Date().getHours()*60+new Date().getMinutes());
    const hh = Math.floor(diff/60), mm = diff%60;
    const count = (hh>0?hh+"j ":"")+mm+"m lagi";
    const name = np.name;
    const el = document.getElementById("next-prayer");
    if(el) el.dataset.key = key;
    // highlight
    document.querySelectorAll(".prayer-item").forEach(p=>p.classList.toggle("next", p.dataset.p===np.key.toLowerCase()));
    return '<div class="next-prayer"><div><div class="np-name">Shalat berikutnya: '+name+'</div><div class="np-count">'+count+'</div></div><div class="np-time">'+t[np.key].label+'</div></div>';
  };
  return h;
}
function qa(ic,label,route){
  return '<div class="qa-item" data-nav="'+route+'">'+icon(ic,22)+'<span>'+esc(label)+'</span></div>';
}
function getLoc(){
  if(SETTINGS.useGeo && SETTINGS.geo){
    const tz = -new Date().getTimezoneOffset()/60;
    return {name:"Lokasi perangkat (GPS)", lat:SETTINGS.geo.lat, lon:SETTINGS.geo.lon, tz};
  }
  const c = DB.CITIES.find(x=>x.id===SETTINGS.city);
  return c ? {name:c.name, lat:c.lat, lon:c.lon, tz:c.utc} : {name:"Jakarta", lat:-6.2088, lon:106.8456, tz:7};
}
function footerNote(){
  return '<footer class="app-foot">SILMIKAFFAH — Ensiklopedia & Pembelajaran Islam<br>'
    + 'Konten disusun dengan prinsip kejujuran data; sumber belum tersedia ditandai, tidak dikarang.</footer>';
}

/* ========== AL-QUR'AN ========== */
function quranTabs(active){
  const tabs = [["","Mushaf"],["juz","Juz"],["juzamma","Juz 'Amma"],["iqra","Iqra"],["tajwid","Tajwid"],["tafsir","Tafsir"]];
  return '<div class="tabs" role="tablist">'+tabs.map(t=>'<button class="tab'+(active===t[0]?" active":"")+'" data-nav="#/quran'+(t[0]?"/"+t[0]:"")+'">'+t[1]+'</button>').join("")+'</div>';
}
function quranView(tab){
  tab = tab||"";
  let h = '<div class="page">'+crumbs([{label:"Home",href:"#/home"},{label:"Al-Qur'an"}])
    + '<h1 class="h1">'+icon("quran",22)+' Al-Qur\'an</h1>'
    + '<p class="muted" style="margin-top:6px">114 surah · 30 juz · Juz \'Amma · Iqra 1–6 · Tajwid · Tafsir</p>'
    + quranTabs(tab);

  if(tab===""){
    h += '<div class="section-title"><h2>Daftar Surah (114)</h2></div>';
    DBQ.SURAHS.forEach(s=>{
      h += '<div class="row" data-nav="#/surah/'+s[0]+'">'
        + '<span class="row-icon">'+icon("quran",18)+'</span>'
        + '<span class="grow"><span class="rt">'+s[0]+'. <span dir="rtl" lang="ar" style="font-family:var(--font-ar);font-size:1.25em">'+esc(s[1])+'</span> '+esc(s[2])+'</span>'
        + '<span class="rs">'+esc(s[3])+' · '+s[5]+' ayat · '+s[4]+' · Juz '+s[6]+'</span></span>'
        + '<span class="chev">'+icon("chev",18)+'</span></div>';
    });
  }
  else if(tab==="juz"){
    h += '<div class="section-title"><h2>Juz 1–30</h2></div><div class="card-grid">';
    DBQ.JUZ.forEach(j=>{
      h += '<div class="card menu-card tappable"><div class="mc-top"><span class="menu-icon">'+icon("quran",20)+'</span><span class="mc-count">Juz '+j[0]+'</span></div>'
        + '<h3>Juz '+j[0]+'</h3><p>Dimulai dari '+esc(j[1])+' '+esc(j[2])+'</p></div>';
    });
    h += '</div>';
    h += '<div class="callout info" style="margin-top:12px">'+icon("info",18)+'<div>Navigasi per ayat (mushaf penuh) memerlukan sumber berlisensi dan menyusul.</div></div>';
  }
  else if(tab==="juzamma"){
    const list = DBQ.SURAHS.filter(s=>s[0]>=78);
    h += '<div class="section-title"><h2>Juz \'Amma — '+list.length+' Surah (78–114)</h2></div>';
    list.forEach(s=>{
      h += '<div class="row" data-nav="#/surah/'+s[0]+'"><span class="row-icon">'+icon("quran",18)+'</span>'
        + '<span class="grow"><span class="rt"><span dir="rtl" lang="ar" style="font-family:var(--font-ar);font-size:1.2em">'+esc(s[1])+'</span> — '+esc(s[2])+'</span>'
        + '<span class="rs">'+esc(s[3])+' · '+s[5]+' ayat</span></span><span class="chev">'+icon("chev",18)+'</span></div>';
    });
  }
  else if(tab==="iqra"){
    h += '<div class="section-title"><h2>Iqra 1–6</h2></div><p class="muted small">Materi orisinal aplikasi sebagai panduan umum; belajar membaca Al-Qur\'an paling baik melalui talaqqi dengan guru.</p>';
    DB.ENTRIES.filter(e=>e.material==="iqra").sort((a,b)=>(a.id>b.id?1:-1)).forEach(e=> h += rowEntry(e));
  }
  else if(tab==="tajwid"){
    h += '<div class="section-title"><h2>Tajwid</h2></div>';
    DB.ENTRIES.filter(e=>e.menu===3 && e.material==="tajwid").forEach(e=> h += rowEntry(e));
  }
  else if(tab==="tafsir"){
    h += '<div class="section-title"><h2>Tafsir & Ulumul Qur\'an</h2></div>';
    DB.ENTRIES.filter(e=>e.menu===3 && e.material==="tafsir").forEach(e=> h += rowEntry(e));
  }
  h += '</div>';
  return h;
}
function surahView(n){
  const s = DBQ.surah(n);
  if(!s) return errorView("Surah tidak ditemukan.");
  const ayahs = Object.keys(DBQ.AYAT).filter(k=>DBQ.AYAT[k].s===n).map(k=>DBQ.AYAT[k]).sort((a,b)=>a.a-b.a);
  const juz = DBQ.JUZ.filter(j=>j[0]>=s[6]);
  let h = '<div class="page">'+crumbs([{label:"Home",href:"#/home"},{label:"Al-Qur'an",href:"#/quran"},{label:"Surah "+s[2]}])
    + '<div class="card date-card">'
    + '<div class="arabic-text" style="font-size:calc(28px * var(--font-scale))" dir="rtl" lang="ar">'+esc(s[1])+'</div>'
    + '<div class="date-hijri" style="margin-top:4px">Surah '+s[2]+'</div>'
    + '<div class="date-masehi">'+esc(s[3])+' · '+s[5]+' ayat · '+s[4]+' · Juz '+s[6]+'</div>'
    + '</div>'

function kalenderView(cursor){

  let h = '<div class="page">'+crumbs([{label:"Home",href:"#/home"},{label:"Kalender Hijriah"}])

    + '</div>'
    + '<div class="cal-grid">'
    + dows.map(d=>'<div class="cal-dow">'+d+'</div>').join("")
    + Array.from({length:firstDow},()=>'<div class="cal-cell empty"></div>').join("");
  m.cells.forEach(c=>{
    const ev = c.events.length ? '<span class="dot"></span>' : "";
    const cls = c.isToday?" today":"";
    h += '<div class="cal-cell'+cls+'" data-nav="#/kalender/date/'+m.monthName+'-'+c.hDay+'" title="'+c.hDay+' '+esc(m.monthName)+'">'
      + '<span class="cd">'+c.hDay+'</span><span class="ch">'+c.gDate.toLocaleDateString("id-ID",{day:"numeric",month:"short"})+'</span>'+ev+'</div>';
  });
  h += '</div></div>';

  /* Bagian 3–4 — Informasi Hari Ini */
  h += '<div class="section-title"><h2>Informasi Hari Ini</h2></div>';
  const evToday = DB.EVENTS.filter(e=>e.month===hijriToday.monthName && e.day===hijriToday.day);
  if(evToday.length){
    h += '<div class="card">'+evToday.map(ev=>

      + '<p class="tiny muted" style="margin-top:8px">Peringatan keagamaan ≠ hari libur resmi. Hari libur nasional Indonesia ditetapkan pemerintah.</p></div>';
  } else {
    h += '<div class="empty-state">'+icon("kalender")+'<h4>Tidak ada peringatan tercatat</h4><p>Tidak ada hari besar atau peristiwa yang tercatat pada tanggal Hijriah hari ini di database.</p></div>';
  }

  /* Bagian 5 — Sejarah Bulan Ini */
  h += '<div class="section-title"><h2>Sejarah pada Bulan Ini</h2></div>';
  const monthEvents = DB.EVENTS.filter(e=>e.month===m.monthName);

  }
  h += '</div>';
  return h;

/* ---------- Aksi kalkulator zakat ---------- */
function calcZakat(){
  const type = (parseRoute().a) || "fitrah";
  const num = id => { const el = document.getElementById(id); return el && el.value!=="" ? +el.value : 0; };
  const sel = id => { const el = document.getElementById(id); return el? el.value : ""; };
  const inp = {goldPrice:num("z-goldPrice"), silverPrice:num("z-silverPrice"), ricePrice:num("z-ricePrice")};
  if(type==="fitrah"){ inp.qty = num("z-qty") * num("z-kg"); inp.price = num("z-price"); }
  if(type==="mal"){ inp.cash=num("z-cash"); inp.gold=num("z-gold"); inp.silver=num("z-silver"); inp.trade=num("z-trade"); inp.receivables=num("z-recv"); inp.debts=num("z-debt"); inp.nisabMethod=sel("z-nisab"); inp.haul=sel("z-haul"); }
  if(type==="emas"||type==="perak"){ inp.grams=num("z-grams"); }
  if(type==="uang"){ inp.balance=num("z-balance"); }
  if(type==="perdagangan"){ inp.asset=num("z-asset"); inp.debt=num("z-debt"); inp.haul=sel("z-haul"); }
  if(type==="penghasilan"){ inp.income=num("z-income"); inp.debtMonthly=num("z-debtM"); inp.method=sel("z-method"); }
  if(type==="pertanian"){ inp.value=num("z-value"); inp.irrigation=sel("z-irrigation"); }
  if(type==="peternakan"){ inp.livestock=sel("z-livestock"); inp.count=num("z-count"); }
  const box = document.getElementById("zakat-result");
  if(box){ box.innerHTML = zakatResultView(type, inp); box.scrollIntoView({behavior:"smooth", block:"start"}); }
}

      + '<span class="grow"><span class="rt">'+esc(p.title)+'</span><span class="rs">'+esc(pl.loc||"")+'</span></span>'
      + (pl.lat&&pl.lon?'<a class="row-badge" target="_blank" rel="noopener" href="https://www.google.com/maps?q='+pl.lat+','+pl.lon+'" onclick="event.stopPropagation()">Peta</a>':"")
      + '<span class="chev">'+icon("chev",18)+'</span></div>';
  });
  h += '<div class="callout info" style="margin-top:12px">'+icon("info",18)+'<div>Ziarah kubur disunnahkan untuk mendoakan mayit dan mengingat kematian. Hindari perbuatan yang dilarang: meminta kepada mayit dan syirik lainnya. Perbedaan pendapat ditampilkan pada entri terkait.</div></div>';
  h += '</div>';
  return h;
}

</script>
<script>
/* ============================================================
   SILMIKAFFAH — Engine Aplikasi (app.js)
   Router hash, state, helper UI, template detail entri,

   ============================================================ */
"use strict";
const App = window.SILMIKAFFAH.App = {};
const $ = id => document.getElementById(id);

/* ---------- State & Persistence ---------- */
const LS = {
  get(k,d){ try{ const v=localStorage.getItem("silk_"+k); return v===null?d:JSON.parse(v);}catch(e){return d;} },
  set(k,v){ try{ localStorage.setItem("silk_"+k, JSON.stringify(v)); }catch(e){} }
};
let SETTINGS = Object.assign({theme:"light", font:"b", prayerMethod:"KEMENAG", asrMethod:"JUMHUR", city:"jakarta", cityName:"Jakarta", useGeo:false}, LS.get("settings",{}));
let COLLECTION = LS.get("collection",[]);
let RECENT = LS.get("recent",[]);
let CAL_CURSOR = new Date();
let timerId = null;

const saveSettings = () => LS.set("settings", SETTINGS);
const saveCollection = () => LS.set("collection", COLLECTION);
const saveRecent = () => LS.set("recent", RECENT.slice(0,12));

/* ---------- Helpers ---------- */
const esc = s => String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
/* fmtRp didefinisikan di calc.js (global scope bersama) */
const dayOfYear = () => { const n=new Date(); return Math.floor((n - new Date(n.getFullYear(),0,0)) / 864e5); };
const inCollection = id => COLLECTION.includes(id);
const addRecent = id => { RECENT = RECENT.filter(x=>x!==id); RECENT.unshift(id); saveRecent(); };

function toast(msg, err){
  const t = $("toast");
  t.textContent = msg;
  t.classList.toggle("err", !!err);
  t.classList.add("show");
  clearTimeout(t._h);
  t._h = setTimeout(()=>t.classList.remove("show"), 2600);
}

  clock:'<circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7.5V12l3 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',

function icon(name, size){
  const s = size||20;
  return '<svg viewBox="0 0 24 24" width="'+s+'" height="'+s+'" aria-hidden="true">'+(I[name]||I.book)+'</svg>';
}

/* ---------- Status ---------- */
const STATUS = {
  ready:["Siap", "status-ready"],
  verify:["Perlu verifikasi", "status-verify"],
  pending:["Belum tersedia", "status-pending"]
};
function statusPill(e){
  if(!e || e.status==="ready") return "";
  const s = STATUS[e.status] || STATUS.pending;
  return '<span class="status-pill '+s[1]+'">'+s[0]+'</span>';
}

/* ---------- Blok Arab standar (WAJIB di seluruh aplikasi) ---------- */
function arabicBlock(a){
  if(!a || (!a.text && !a.translit && !a.arti)) return "";
  let h = '<div class="arabic-block">';
  if(a.text) h += '<div class="arabic-text" dir="rtl" lang="ar">'+esc(a.text)+'</div>';
  if(a.translit) h += '<div class="arabic-translit">'+esc(a.translit)+'</div>';
  if(a.arti) h += '<div class="arabic-translation">'+esc(a.arti)+'</div>';
  h += '<div class="arabic-meta">'+audioUI(a.audio, a.audio_src, "Audio bacaan Arab")+'</div>';
  if(a.source) h += '<div class="arabic-src">Sumber: '+esc(a.source)+'</div>';
  return h + '</div>';
}
function audioUI(url, src, label){
  if(url){
    return '<div class="audio-box" data-audio="'+esc(url)+'">'
      +'<button class="audio-btn" data-action="play" aria-label="Putar audio">'+icon("play")+'</button>'
      +'<div class="audio-info"><div class="audio-title">'+esc(label||"Audio")+'</div>'
      +'<div class="audio-progress"><i></i></div>'
      +'<div class="audio-src">'+(src?esc(src):"")+'</div></div></div>';
  }
  return '<div class="audio-unavail">'+icon("audio",16)+'<span>Audio belum tersedia — konten audio memerlukan sumber berlisensi.</span></div>';
}

/* ---------- Breadcrumb ---------- */
function crumbs(items){
  return '<nav class="crumbs" aria-label="Jejak halaman">'+items.map((c,i)=>{
    const sep = i>0?'<span class="sep">/</span>':'';
    const el = c.href ? '<a data-nav="'+c.href+'">'+esc(c.label)+'</a>' : '<span>'+esc(c.label)+'</span>';
    return sep+el;
  }).join("")+'</nav>';
}

/* ---------- Relasi & Sumber ---------- */
function relLink(id){
  if(getEntry(id)) return {href:"#/entry/"+id, label:getEntry(id).title};
  if(/^surah-\d+$/.test(id)) return {href:"#/surah/"+id.split("-")[1], label:"Surah "+DB.surah(+id.split("-")[1])[1]};
  if(DB.EVENTS.some(e=>e.id===id)) return {href:"#/event/"+id, label:DB.EVENTS.find(e=>e.id===id).title};
  return null;
}
function relatedBlock(e){
  if(!e.related || !e.related.length) return "";
  const links = e.related.map(relLink).filter(Boolean);
  if(!links.length) return "";
  return '<div class="section-title"><h2>Konten Terkait</h2></div>'
    + links.map(l=>'<div class="row" data-nav="'+l.href+'"><span class="row-icon">'+icon("layers",18)+'</span><span class="grow"><span class="rt">'+esc(l.label)+'</span></span><span class="chev">'+icon("chev",18)+'</span></div>').join("");
}
function sourcesBlock(e){
  const srcs = (e.sources||[]).map(k=>DB.SOURCES[k]).filter(Boolean);
  if(!srcs.length) return "";
  return '<div class="section-title"><h2>Sumber</h2></div><div class="source-list">'
    + srcs.map(s=>'<div class="source-item"><span class="si-type">'+esc(s.type)+'</span><span><b>'+esc(s.title)+'</b>'+(s.note?'<br><span class="muted small">'+esc(s.note)+'</span>':"")+'</span></div>').join("")
    + '</div>';
}

/* ---------- Template Detail Entri Universal ---------- */
function entryView(id){
  const e = getEntry(id);
  if(!e) return errorView("Entri tidak ditemukan.");
  addRecent(e.id);
  const menu = DB.MENUS.find(m=>m.id===e.menu);
  const mat = menu ? menu.materials.find(m=>m.id===e.material) : null;
  let cr = [{label:"Home", href:"#/home"},{label:menu?menu.name:"", href:menu?"#/menu/"+menu.id:null}];
  if(mat) cr.push({label:mat.name, href:"#/menu/"+menu.id});
  if(e.sub){ const sm = subLabel(e); if(sm) cr.push({label:sm}); }
  cr.push({label:e.title});

  let h = '<div class="page"><div class="detail-head">'+crumbs(cr)
    + '<h1 class="detail-title">'+esc(e.title)+' '+statusPill(e)+'</h1>'
    + (e.summary?'<p class="detail-summary">'+esc(e.summary)+'</p>':"")
    + (e.sequence?'<span class="badge-num" style="margin-top:8px">Urutan gerakan #'+e.sequence+'</span>':"")
    + '<div class="detail-actions">'
    + '<button class="btn btn-ghost" data-action="bookmark" data-id="'+e.id+'">'+(inCollection(e.id)?icon("bookmarkFill",16)+" Tersimpan":icon("bookmark",16)+" Simpan")+'</button>'
    + '<button class="btn btn-ghost" data-action="share" data-id="'+e.id+'">'+icon("share",16)+' Bagikan</button>'
    + '</div></div>';

  h += arabicBlock(e.arabic);

  if(e.type==="hadith"){
    h += '<div class="callout info">'+icon("info",18)+'<div><b>Perawi:</b> '+esc(e.rawi||"—")+'<br><b>Referensi:</b> '+esc(e.kitab||"—")+'<br><b>Derajat:</b> '+esc(e.derajat||"—")+'</div></div>';
  }
  if(e.type==="person" && e.person){
    h += '<div class="callout info">'+icon("tokoh",18)+'<div>'
      + '<b>Nama lain:</b> '+esc(e.person.alt||"—")+'<br>'
      + '<b>Lahir:</b> '+esc(e.person.birth||"—")+'<br>'
      + '<b>Wafat:</b> '+esc(e.person.death||"—")+'<br>'
      + '<b>Lokasi:</b> '+esc(e.person.loc||"—")
      + '</div></div>';
  }
  if(e.type==="place" && e.place){
    const p=e.place;
    h += '<div class="callout info">'+icon("map",18)+'<div><b>Jenis:</b> '+esc(p.type||"—")+'<br><b>Lokasi:</b> '+esc(p.loc||"—")+'</div></div>';
    if(p.lat && p.lon){
      h += '<a class="btn btn-ghost" style="margin-top:4px" target="_blank" rel="noopener" href="https://www.google.com/maps?q='+p.lat+','+p.lon+'">'+icon("external",16)+' Buka di peta</a>';
    }
  }
  if(e.type==="bacaan" || e.type==="doa"){
    h += '<div class="callout info">'+icon("audio",18)+'<div>Setiap bacaan Arab menyertakan teks Arab, transliterasi, arti, audio (bila tersedia), dan sumber — sesuai standar global SILMIKAFFAH.</div></div>';
  }

  h += '<div class="prose">';
  (e.body||[]).forEach(sec=>{
    h += '<h4>'+esc(sec.h||"")+'</h4>';
    if(sec.p) sec.p.forEach(p=>h+='<p>'+esc(p)+'</p>');
    if(sec.list) h += '<ul>'+sec.list.map(x=>'<li>'+esc(x)+'</li>').join("")+'</ul>';
  });
  h += '</div>';

  if(e.tags && e.tags.length) h += '<div class="chips" style="margin-top:14px">'+e.tags.map(t=>'<span class="chip tag">#'+esc(t)+'</span>').join("")+'</div>';
  h += sourcesBlock(e);
  h += relatedBlock(e);
  h += '</div>';
  return h;
}

/* ---------- Halaman Menu (materi → submateri → entri) ---------- */
function subLabel(e){
  const map = {
    "wajib":"Wajib","sunnah":"Sunnah","tata-cara":"Tata Cara","gerakan":"Gerakan","bacaan":"Bacaan",
    "ketentuan":"Ketentuan","kondisi-khusus":"Kondisi Khusus","jenis":"Jenis","fitur":"Fitur","level":"Tahap",
    "tauhid":"Tauhid","asmaul-husna":"Asmaul Husna","sub":"Submateri"
  };
  return e.sub ? (map[e.sub]||e.sub) : null;
}
function menuView(menuId){
  const menu = DB.MENUS.find(m=>m.id===+menuId);
  if(!menu) return errorView("Menu tidak ditemukan.");
  // Menu khusus
  if(menu.id===3) return quranView();
  if(menu.id===10) return kalenderView(new Date());

  let h = '<div class="page">'+crumbs([{label:"Home",href:"#/home"},{label:menu.name}])
    + '<h1 class="h1">'+icon(menu.icon,22)+' '+esc(menu.name)+'</h1>'
    + '<p class="muted" style="margin-top:6px">'+esc(menu.desc)+'</p>';

  menu.materials.forEach(mat=>{
    const entries = DB.ENTRIES.filter(e=>e.menu===menu.id && e.material===mat.id);
    if(!entries.length) return;
    h += '<div class="section-title"><h2>'+esc(mat.name)+'</h2></div>';
    // submateri grouping
    const subs = {};
    entries.forEach(e=>{ if(e.sub){ (subs[e.sub]=subs[e.sub]||[]).push(e);} });
    const mainEntries = entries.filter(e=>!e.sub);
    mainEntries.forEach(e=>{
      h += rowEntry(e, zakatHref(e));
    });
    Object.keys(subs).forEach(sk=>{
      const label = subLabel({sub:sk}) || sk;
      h += '<div class="h3" style="margin:14px 0 8px;color:var(--text-2)">'+esc(label)+'</div>';
      subs[sk].forEach(e=> h += rowEntry(e, zakatHref(e)));
    });
  });
  h += '</div>';
  return h;
}
function zakatHref(e){
  return (e.calc && e.calc!=="feature") ? "#/zakat/"+e.calc : null;
}
function rowEntry(e, href){
  const seq = e.sequence ? ' <span class="badge-num">#'+e.sequence+'</span>' : "";
  return '<div class="row" data-nav="'+(href||"#/entry/"+e.id)+'">'
    + '<span class="row-icon">'+icon(typeIcon(e.type),18)+'</span>'
    + '<span class="grow"><span class="rt">'+esc(e.title)+seq+'</span>'
    + (e.summary?'<span class="rs">'+esc(e.summary)+'</span>':"")
    + '</span>'+statusPill(e)+'<span class="chev">'+icon("chev",18)+'</span></div>';
}
/* Tautan generik: entri / surah / ayat */
function entryHref(id){
  if(id.indexOf("ayat-")===0) return "#/quran/ayat/"+id.slice(5);
  if(id.indexOf("surah-")===0) return "#/surah/"+id.slice(6);
  return "#/entry/"+id;
}
function typeIcon(t){
  return {article:"book", hadith:"hadis", doa:"doa", bacaan:"audio", person:"tokoh", event:"sirah",
    place:"map", term:"layers", asmaul:"star", movement:"grid", lesson:"pendidikan", feature:"layers", guide:"book"}[t]||"book";
}

/* ---------- Jelajah ---------- */
function browseView(){
  let h = '<div class="page">'+crumbs([{label:"Home",href:"#/home"},{label:"Jelajah"}])
    + '<h1 class="h1">Jelajah</h1><p class="muted" style="margin-top:4px">14 menu utama SILMIKAFFAH — setiap topik memiliki satu rumah utama; menu lain hanya menautkan.</p>'
    + '<div class="card-grid" style="margin-top:14px">';
  DB.MENUS.forEach(m=>{
    const count = DB.ENTRIES.filter(e=>e.menu===m.id).length;
    h += '<div class="card menu-card tappable" data-nav="#/menu/'+m.id+'">'
      + '<div class="mc-top"><span class="menu-icon">'+icon(m.icon,20)+'</span><span class="mc-count">'+count+' entri</span></div>'
      + '<h3>'+esc(m.name)+'</h3><p>'+esc(m.desc)+'</p></div>';
  });
  h += '</div></div>';
  return h;
}

/* ---------- Pencarian Global ---------- */
function searchIndex(){
  const idx = [];
  DB.ENTRIES.forEach(e=>{
    idx.push({id:e.id, type:"entry", cat:menuName(e.menu), title:e.title, kw:(e.summary+" "+e.tags.join(" ")+" "+e.body.map(b=>(b.h||"")+(b.p?b.p.join(" "):"")+(b.list?b.list.join(" "):"")).join(" ")).toLowerCase()});
  });
  DBQ.SURAHS.forEach(s=>{
    idx.push({id:"surah-"+s[0], type:"surah", cat:"Al-Qur'an", title:"Surah "+s[1]+" — "+s[3], kw:(s[1]+" "+s[3]+" surah "+(s[4]==="Makkiyah"?"makkiyah":"madaniyah")).toLowerCase()});
  });
  Object.keys(DBQ.AYAT).forEach(k=>{
    const a = DBQ.AYAT[k], s = DBQ.surah(a.s);
    idx.push({id:"ayat-"+k, type:"ayat", cat:"Al-Qur'an", title:"QS. "+s[1]+" "+a.s+":"+a.a, kw:(a.arti+" "+s[1]).toLowerCase()});
  });
  DB.EVENTS.forEach(e=>{
    idx.push({id:"event-"+e.id, type:"event", cat:"Kalender & Sejarah", title:e.title, kw:(e.desc+" "+e.month).toLowerCase()});
  });
  DB.PLACES.forEach(p=>{
    idx.push({id:"place-"+p.id, type:"place", cat:"Ziarah", title:p.name, kw:(p.history+" "+p.loc).toLowerCase()});
  });
  return idx;
}
const SIDX = searchIndex();
function menuName(mid){ const m=DB.MENUS.find(x=>x.id===mid); return m?m.name:"Entri"; }
const SEARCH_CATS = ["Semua"].concat([...new Set(SIDX.map(x=>x.cat))].sort());
let searchCat = "Semua";
function searchView(q, cat){
  q = (q||"").trim().toLowerCase();
  if(cat) searchCat = cat;
  let h = '<div class="page">'+crumbs([{label:"Home",href:"#/home"},{label:"Search"}])
    + '<h1 class="h1">Pencarian Global</h1>'
    + '<p class="muted small" style="margin-top:4px">Mencari seluruh entity: ayat, surah, hadis, doa, fiqih, tokoh, sejarah, istilah, Asmaul Husna, dan tempat.</p>'
    + '<div class="search-bar" style="margin-top:12px"><div class="search-input-wrap">'+icon("search")+'<input class="search-input" id="search-input" type="search" placeholder="Cari mis. Ramadan, Bilal, zakat…" value="'+esc(q)+'"></div></div>'
    + '<div class="chips" style="margin:10px 0">'
    + SEARCH_CATS.map(c=>'<button class="chip'+(searchCat===c?" active":"")+'" data-nav="#/search/'+encodeURIComponent(q)+"/"+encodeURIComponent(c)+'">'+esc(c)+'</button>').join("")
    + '</div>';
  if(!q){
    h += '<div class="empty-state">'+icon("search")+'<h4>Mulai mengetik</h4><p>Hasil akan dikelompokkan berdasarkan kategori sumber.</p></div>';
    return h+'</div>';
  }
  let results = SIDX.filter(x=> x.title.toLowerCase().includes(q) || x.kw.includes(q));
  if(searchCat!=="Semua") results = results.filter(x=>x.cat===searchCat);
  if(!results.length){
    h += '<div class="empty-state">'+icon("search")+'<h4>Tidak ditemukan</h4><p>Pencarian "'+esc(q)+'" tidak menghasilkan hasil di kategori ini. Coba kata kunci lain.</p></div>';
    return h+'</div>';
  }
  const groups = {};
  results.forEach(r=>{ (groups[r.cat]=groups[r.cat]||[]).push(r); });
  Object.keys(groups).forEach(cat=>{
    h += '<div class="search-group"><h4>'+esc(cat)+' ('+groups[cat].length+')</h4>';
    groups[cat].forEach(r=>{
      h += '<div class="row" data-nav="'+searchHref(r)+'"><span class="row-icon">'+icon(searchIcon(r.type),18)+'</span><span class="grow"><span class="rt">'+esc(r.title)+'</span></span><span class="chev">'+icon("chev",18)+'</span></div>';
    });
    h += '</div>';
  });
  return h+'</div>';
}
function searchHref(r){
  if(r.type==="entry") return "#/entry/"+r.id;
  if(r.type==="surah") return "#/surah/"+r.id.split("-")[1];
  if(r.type==="ayat") return "#/quran/ayat/"+r.id.split("-")[1];
  if(r.type==="event") return "#/event/"+r.id.slice(6);
  if(r.type==="place") return "#/entry/"+r.id.slice(6);
  return "#/entry/"+r.id;
}
function searchIcon(t){ return t==="surah"?"quran":t==="ayat"?"quran":t==="event"?"sirah":t==="place"?"map":typeIcon(t); }

/* ---------- Koleksi ---------- */
function koleksiView(){
  let h = '<div class="page">'+crumbs([{label:"Home",href:"#/home"},{label:"Koleksi"}])
    + '<h1 class="h1">Koleksi</h1><p class="muted small" style="margin-top:4px">Koleksi hanya menyimpan ID entri — tidak membuat salinan konten.</p>';
  if(!COLLECTION.length){
    h += '<div class="empty-state">'+icon("heart")+'<h4>Koleksi masih kosong</h4><p>Simpan ayat, hadis, doa, artikel, atau tokoh untuk dibaca kembali.</p></div>';
    return h+'</div>';
  }
  COLLECTION.forEach(id=>{
    const e = getEntry(id);
    if(e){ h += rowEntry(e); return; }
    if(id.indexOf("ayat-")===0){
      const a = DBQ.AYAT[id.slice(5)];
      if(!a) return;
      const s = DBQ.surah(a.s);
      h += '<div class="row" data-nav="#/quran/ayat/'+id.slice(5)+'"><span class="row-icon">'+icon("quran",18)+'</span>'
        + '<span class="grow"><span class="rt">QS. '+esc(s[1])+' · Ayat '+a.a+'</span><span class="rs">'+esc(a.arti)+'</span></span>'
        + '<span class="chev">'+icon("chev",18)+'</span></div>';
    } else if(id.indexOf("surah-")===0){
      const s = DBQ.surah(+id.slice(6));
      if(!s) return;
      h += '<div class="row" data-nav="#/surah/'+s[0]+'"><span class="row-icon">'+icon("quran",18)+'</span>'
        + '<span class="grow"><span class="rt">Surah '+esc(s[2])+'</span><span class="rs">'+esc(s[3])+' · '+s[5]+' ayat</span></span>'
        + '<span class="chev">'+icon("chev",18)+'</span></div>';
    }
  });
  return h+'</div>';
}

/* ---------- Pengaturan ---------- */

  const city = DB.CITIES.find(c=>c.id===SETTINGS.city);
  let h = '<div class="page">'+crumbs([{label:"Home",href:"#/home"},{label:"Pengaturan"}])
    + '<h1 class="h1">Pengaturan</h1>';

  h += '<div class="set-group"><h3>Tampilan</h3><div class="card">';
  h += setRow("Tema gelap (AMOLED)", "Mode terang / gelap", '<label class="switch"><input type="checkbox" id="set-theme" '+(SETTINGS.theme==="dark"?"checked":"")+'><i></i></label>');
  h += '<div class="set-row"><div><div class="sr-t">Ukuran teks</div><div class="sr-d">A–C</div></div><div class="range-row" style="flex:1;max-width:160px"><input type="range" id="set-font" min="0" max="2" step="1" value="'+(SETTINGS.font==="a"?0:SETTINGS.font==="c"?2:1)+'"><span class="tiny muted" id="font-val">'+(SETTINGS.font==="a"?"A":SETTINGS.font==="c"?"C":"B")+'</span></div></div>';
  h += '</div></div>';

  h += '<div class="set-group"><h3>Waktu Shalat</h3><div class="card">';
  h += setSelect("Metode perhitungan", "Metode fajar & isya", "set-prayer", Object.keys(CALC.PRAY_METHODS).map(k=>[k, CALC.PRAY_METHODS[k].name]), SETTINGS.prayerMethod);
  h += setSelect("Metode Asar", "Bayangan Asar", "set-asr", Object.keys(CALC.ASR_METHODS).map(k=>[k, CALC.ASR_METHODS[k].name]), SETTINGS.asrMethod);
  h += setSelect("Lokasi", "Untuk perhitungan waktu shalat", "set-city", DB.CITIES.map(c=>[c.id, c.name]), SETTINGS.city);
  h += '<div class="set-row"><div><div class="sr-t">Gunakan lokasi perangkat</div><div class="sr-d">GPS (izin diperlukan)</div></div><button class="btn btn-ghost" data-action="geolocate">'+icon("map",16)+' Deteksi</button></div>';
  h += '<p class="tiny muted" style="margin-top:8px">Perkiraan astronomis — untuk keperluan resmi gunakan jadwal lembaga setempat.</p>';
  h += '</div></div>';

  h += '<div class="set-group"><h3>Data</h3><div class="card">';
  h += '<div class="set-row"><div><div class="sr-t">Reset koleksi & riwayat</div><div class="sr-d">Hapus data lokal perangkat ini</div></div><button class="btn btn-ghost" data-action="reset">Reset</button></div>';
  h += '<div class="set-row"><div><div class="sr-t">Tentang & status data</div><div class="sr-d">Kebijakan konten dan sumber</div></div><button class="btn btn-ghost" data-nav="#/tentang">Buka</button></div>';
  h += '</div></div>';
  h += '</div>';
  return h;

function setRow(t,d,ctrl){ return '<div class="set-row"><div><div class="sr-t">'+t+'</div><div class="sr-d">'+d+'</div></div>'+ctrl+'</div>'; }
function setSelect(t,d,id,opts,val){
  return '<div class="set-row" style="flex-wrap:wrap"><div style="flex:1;min-width:140px"><div class="sr-t">'+t+'</div><div class="sr-d">'+d+'</div></div>'
    + '<select class="input" id="'+id+'" style="max-width:220px">'+opts.map(o=>'<option value="'+o[0]+'" '+(o[0]===val?"selected":"")+'>'+esc(o[1])+'</option>').join("")+'</select></div>';
}

/* ---------- Error / Empty ---------- */
function errorView(msg, retry){
  return '<div class="page"><div class="error-state">'+icon("alert",34)+'<h4>Terjadi kesalahan</h4><p>'+esc(msg||"Data gagal dimuat.")+'</p>'
    + (retry!==false?'<button class="btn btn-ghost" style="margin-top:12px" data-action="retry">Coba Lagi</button>':"")
    + '</div></div>';
}
function skeleton(){
  return '<div class="page">'+Array.from({length:6},()=>'<div class="skeleton" style="height:70px;margin-bottom:10px"></div>').join("")+'</div>';
}

/* ---------- Router ---------- */
function parseRoute(){
  const raw = (location.hash||"#/home").replace(/^#\/?/,"");
  const parts = raw.split("/");
  return {name:parts[0]||"home", a:parts[1], b:parts[2], raw};
}
function router(){
  clearInterval(timerId); timerId = null;
  const r = parseRoute();
  const main = $("app-main");
  main.innerHTML = skeleton();
  window.scrollTo(0,0);
  setActiveNav(r.name);
  let html = "";
  try{
    switch(r.name){
      case "home": html = homeView(); break;
      case "jelajah": html = browseView(); break;
      case "menu": html = menuView(r.a); break;
      case "entry": html = entryView(decodeURIComponent(r.a||"")); break;
      case "quran": html = r.a==="ayat" ? quranAyahView(r.b) : quranView(r.a); break;
      case "surah": html = surahView(+r.a); break;
      case "kalender": html = r.a==="date" ? kalenderDateView(r.b) : kalenderView(CAL_CURSOR); break;
      case "zakat": html = zakatView(r.a); break;
      case "asmaul-husna": html = asmaulView(); break;
      case "ziarah": html = ziarahView(); break;
      case "event": html = eventView(r.a); break;
      case "search": html = searchView(r.a?decodeURIComponent(r.a):"", r.b?decodeURIComponent(r.b):""); break;
      case "koleksi": html = koleksiView(); break;
      case "settings": html = settingsView(); break;
      case "tentang": html = tentangView(); break;
      default: html = homeView();
    }
  }catch(err){
    console.error(err);
    html = errorView("Terjadi kesalahan saat memuat halaman.");
  }
  main.innerHTML = html;
  bindActions();
  afterRender(r);
}

function setActiveNav(name){
  const map = {home:"home", jelajah:"jelajah", search:"search", koleksi:"koleksi", settings:"settings"};
  const key = map[name] || (["menu","entry","quran","surah","kalender","zakat","ziarah","event","asmaul-husna","tentang"].includes(name)?"jelajah":null);
  document.querySelectorAll(".bn-item").forEach(b=> b.classList.toggle("active", b.dataset.bn===key));
  document.querySelectorAll(".sidebar-link").forEach(a=> a.classList.toggle("active", a.dataset.nav==="#/menu/"+(name==="menu"?routerA():"")));
}
function routerA(){ const p=parseRoute(); return p.a; }

/* ---------- Event Delegation ---------- */
function bindActions(){
  document.querySelectorAll("[data-nav]").forEach(el=>{
    el.onclick = e => { e.preventDefault(); location.hash = el.dataset.nav; };
  });
  document.querySelectorAll("[data-action]").forEach(el=>{
    el.onclick = e => {
      const act = el.dataset.action;
      if(act==="bookmark") toggleBookmark(el.dataset.id, el);
      else if(act==="share") shareEntry(el.dataset.id, el);
      else if(act==="play") toggleAudio(el);
      else if(act==="geolocate") geolocate();
      else if(act==="reset") resetLocal();
      else if(act==="retry") router();
      else if(act==="zcalc") calcZakat();
    };
  });
  const si = $("search-input");
  if(si){
    si.oninput = () => {
      const v = si.value.trim();
      history.replaceState(null,"","#/search"+(v?"/"+encodeURIComponent(v):"")+"/"+encodeURIComponent(searchCat));
      const main=$("app-main");
      const s = searchView(v, searchCat);
      // re-render hasil tanpa kehilangan fokus
      const pos = si.selectionStart;
      main.innerHTML = s;
      bindActions();
      const n = $("search-input"); if(n){ n.focus(); n.setSelectionRange(pos,pos); }
      setActiveNav("search");
    };
  }
  ["set-theme","set-font","set-prayer","set-asr","set-city"].forEach(id=>{
    const el = $(id); if(!el) return;
    el.onchange = el.oninput = () => {
      if(id==="set-theme") applyTheme(el.checked?"dark":"light");
      if(id==="set-font"){ const v=["a","b","c"][+el.value]; SETTINGS.font=v; document.documentElement.dataset.font=v; const fv=$("font-val"); if(fv)fv.textContent=v.toUpperCase(); }
      if(id==="set-prayer") SETTINGS.prayerMethod=el.value;
      if(id==="set-asr") SETTINGS.asrMethod=el.value;
      if(id==="set-city"){ SETTINGS.city=el.value; const c=DB.CITIES.find(x=>x.id===el.value); if(c)SETTINGS.cityName=c.name; }
      saveSettings();
    };
  });
}
function toggleBookmark(id, btn){
  if(inCollection(id)){ COLLECTION = COLLECTION.filter(x=>x!==id); toast("Dihapus dari koleksi"); }
  else { COLLECTION.push(id); toast("Disimpan ke koleksi"); }
  saveCollection();
  if(btn) btn.innerHTML = inCollection(id)?icon("bookmarkFill",16)+" Tersimpan":icon("bookmark",16)+" Simpan";
}
function shareEntry(id, btn){
  const e = getEntry(id);
  const title = e ? e.title : (btn && btn.dataset.title ? btn.dataset.title : id);
  const text = e ? (e.summary||e.title) : title;
  const url = location.origin+location.pathname+entryHref(id);
  const data = {title:title, text:text, url:url};
  if(navigator.share){ navigator.share(data).catch(()=>{}); }
  else {
    try{ navigator.clipboard.writeText(url); toast("Tautan disalin"); }
    catch(err){ toast("Tidak dapat membagikan di perangkat ini", true); }
  }
}
function resetLocal(){
  COLLECTION=[]; RECENT=[]; saveCollection(); saveRecent();
  toast("Koleksi & riwayat direset"); router();
}

/* ---------- Audio ---------- */
let audioEl=null, audioBtn=null;
function toggleAudio(btn){
  const url = btn.closest("[data-audio]") ? btn.closest("[data-audio]").dataset.audio : null;
  if(!url) return;
  if(!audioEl){ audioEl = new Audio(); audioEl.onended = ()=>{ if(audioBtn){audioBtn.innerHTML=icon("play"); audioBtn.closest(".audio-box").querySelector(".audio-progress > i").style.width="0";} }; audioEl.ontimeupdate = ()=>{ const p=btn?btn.closest(".audio-box"):null; if(p) p.querySelector(".audio-progress > i").style.width = (audioEl.currentTime/audioEl.duration*100)+"%"; }; }
  if(audioEl.src!==url){ audioEl.src=url; }
  if(audioEl.paused){ audioEl.play(); btn.innerHTML=icon("pause"); audioBtn=btn; }
  else { audioEl.pause(); btn.innerHTML=icon("play"); }
}
function afterRender(r){
  if(r.name==="home"){
    const up = () => { const el=$("next-prayer"); if(el && window.SILMIKAFFAH._np){ const np=window.SILMIKAFFAH._np(el.dataset.key); if(np!==null) el.innerHTML=np; } };
    timerId = setInterval(up, 1000); up();
  }
  if(r.name==="kalender"){
    const keys=["cal-prev","cal-next"]; keys.forEach(k=>{ const b=$(k); if(b) b.onclick=()=>{ CAL_CURSOR = CALC.shiftHijriMonth(CAL_CURSOR, k==="cal-prev"?-1:1); router(); }; });
  }
}

/* ---------- Theme ---------- */
function applyTheme(t){
  SETTINGS.theme = t; saveSettings();
  document.documentElement.dataset.theme = t;
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.content = t==="dark" ? "#070B08" : "#0F7A4D";
}

/* ---------- Geolokasi ---------- */
function geolocate(){
  if(!navigator.geolocation){ toast("Geolokasi tidak didukung perangkat", true); return; }
  toast("Mendeteksi lokasi…");
  navigator.geolocation.getCurrentPosition(pos=>{
    SETTINGS.useGeo=true; SETTINGS.geo={lat:pos.coords.latitude, lon:pos.coords.longitude};
    saveSettings(); toast("Lokasi perangkat digunakan"); router();
  }, ()=>{
    toast("Izin lokasi ditolak — gunakan pilihan kota manual", true);
  }, {timeout:8000});
}

/* ---------- Sidebar ---------- */
function buildSidebar(){
  const nav = $("sidebar-nav"); if(!nav) return;
  nav.innerHTML = DB.MENUS.map(m=>'<a class="sidebar-link" data-nav="#/menu/'+m.id+'">'+icon(m.icon,18)+'<span>'+esc(m.name)+'</span></a>').join("");
}

/* ---------- Init ---------- */
function init(){
  applyTheme(SETTINGS.theme);
  document.documentElement.dataset.font = SETTINGS.font;
  buildSidebar();
  window.addEventListener("hashchange", router);
  router();
  // global click untuk audio pause lainnya
  document.addEventListener("click", e=>{
    const b = e.target.closest(".audio-btn");
    if(b){ document.querySelectorAll(".audio-btn").forEach(x=>{ if(x!==b && audioEl && !audioEl.paused && x.closest("[data-audio]")&&x.closest("[data-audio]").dataset.audio===audioEl.src){ x.innerHTML=icon("play"); } }); }
  });
}
App.router = router; // hook untuk pengujian & debugging
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", init); else init();

</script>
